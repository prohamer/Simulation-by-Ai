        hx.fillRect(0, 0, HW, HH);
        hbx.fillStyle = '#808080';
        hbx.fillRect(0, 0, HW, HH);
        for (let k = 0; k < 520; k++) {
          const x = R() * HW;
          const w = 0.6 + R() * 1.6;
          const len = HH * (0.35 + R() * 0.65);
          const y0 = R() * HH;
          const v = R();
          hx.fillStyle = v > 0.5 ? `rgba(255,255,255,${0.12 + R() * 0.25})` : `rgba(0,0,0,${0.08 + R() * 0.2})`;
          hbx.fillStyle = v > 0.5 ? `rgba(220,220,220,${0.25 + R() * 0.3})` : `rgba(30,30,30,${0.25 + R() * 0.3})`;
          for (const yy of [y0, y0 - HH]) {
            hx.fillRect(x, yy, w, len);
            hbx.fillRect(x, yy, w, len);
          }
        }
        const mk = (c, srgb) => {
          const t = new THREE.CanvasTexture(c);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          if (srgb) t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = 4;
          return t;
        };
        const res = { fabric: mk(fc, true), fabricBump: mk(bc, false), hair: mk(hc, true), hairBump: mk(hb, false) };
        TEX_CACHE.set(THREE, res);
        return res;
      }

      // ---------------------------------------------------------------------------
      // 擴充本體
      // ---------------------------------------------------------------------------
      class MannequinAppearance {
        static OUTFITS = ['none', 'labcoat', 'jacket', 'cape', 'tunic'];
        static HAIR_STYLES = ['none', 'short', 'bob', 'ponytail', 'spiky', 'bun'];
        static LABELS = {
          none: '原木素體', labcoat: '實驗白袍', jacket: '立領夾克', cape: '英雄披風', tunic: '學院背心',
          short: '俐落短髮', bob: '齊耳鮑伯', ponytail: '活力馬尾', spiky: '動漫刺蝟', bun: '優雅丸子'
        };
        static OUTFIT_ALIASES = { vest: 'tunic' };
        static OUTFIT_COLORS = [
          { name: '實驗白', hex: '#f4f1ea' }, { name: '海軍藍', hex: '#253b59' }, { name: '勃根地紅', hex: '#8f2d36' },
          { name: '森林綠', hex: '#2d5a43' }, { name: '暖琥珀黃', hex: '#c98a2c' }, { name: '皇家紫', hex: '#553875' },
          { name: '炭灰黑', hex: '#2d3138' }, { name: '天空藍', hex: '#3b7ea1' }
        ];
        static HAIR_COLORS = [
          { name: '自然深棕', hex: '#3b271c' }, { name: '烏木黑', hex: '#1c1c21' }, { name: '亞麻金', hex: '#d6b168' },
          { name: '栗子紅棕', hex: '#7d3826' }, { name: '銀白灰', hex: '#cfd4dc' }, { name: '深海藍', hex: '#24426b' },
          { name: '櫻花粉', hex: '#d9829b' }, { name: '森林墨綠', hex: '#274a3c' }
        ];

        /**
         * @param {object} [options] { outfit, outfitColor, hairStyle, hairColor }
         */
        constructor(options = {}) {
          this.name = 'appearance';
          this.state = {
            outfit: 'none',
            outfitColor: '#f4f1ea',
            hairStyle: 'none',
            hairColor: '#3b271c'
          };
          this._initial = options;
          this.m = null;
          this._outfits = {}; // 已建立的服裝快取 { parts: Mesh[], ... }
          this._hairs = {};
          this._geos = [];
          this._cape = null;
          this.capeKnots = new Float32Array([0.04, 0.09, 0.12, 0.14, 0.15]);
          this.reset();
        }

        attach(m) {
          this.m = m;
          THREE = m.THREE;
          const tex = sharedTextures(m.constructor.canvasFactory || (() => document.createElement('canvas')));
          this.tex = tex;
          const transparent = m.isImage;
          const cloth = (color, extra = {}) =>
            new THREE.MeshStandardMaterial({ color, map: tex.fabric, bumpMap: tex.fabricBump, bumpScale: 0.6, roughness: 0.86, metalness: 0, transparent, ...extra });
          this.mats = {
            main: cloth(this.state.outfitColor),
            trim: cloth(0x334155),
            shirt: cloth(0xe8edf3),
            leather: new THREE.MeshStandardMaterial({ color: 0x2b1d14, roughness: 0.55, metalness: 0.05, transparent }),
            accent: new THREE.MeshStandardMaterial({ color: 0xd4a537, roughness: 0.3, metalness: 0.8, transparent }),
            hair: new THREE.MeshStandardMaterial({ color: this.state.hairColor, map: tex.hair, bumpMap: tex.hairBump, bumpScale: 0.9, roughness: 0.5, metalness: 0.04, transparent }),
            hairTie: new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4, metalness: 0.2, transparent })
          };
          // 披風是單層布：外面用主色、背面用內襯色，各自單面避免 z-fighting
          this.mats.capeOuter = cloth(this.state.outfitColor, { side: THREE.FrontSide });
          this.mats.capeInner = cloth(0x334155, { side: THREE.BackSide });
          const init = { ...this.state, ...this._initial };
          this.state.outfit = 'none';
          this.state.hairStyle = 'none';
          this.set(init, true);
        }

        getMaterials() {
          return this.mats ? Object.values(this.mats) : [];
        }

        /**
         * 設定外型（只需給要改的欄位）：outfit, outfitColor, hairStyle, hairColor
         */
        set(opts = {}, force = false) {
          if (!opts || typeof opts !== 'object') return;
          const st = this.state;
          if (!this.m) {
            Object.assign(this._initial, opts);
            return;
          }
          if (typeof opts.outfitColor === 'string' && (force || opts.outfitColor !== st.outfitColor)) {
            try {
              this.mats.main.color.set(opts.outfitColor);
              this.mats.trim.color.copy(this._trimColor(opts.outfitColor));
              this.mats.capeOuter.color.copy(this.mats.main.color);
              this.mats.capeInner.color.copy(this.mats.trim.color);
              st.outfitColor = opts.outfitColor;
            } catch (_) {
              /* 無效色碼略過 */
            }
          }
          if (typeof opts.hairColor === 'string' && (force || opts.hairColor !== st.hairColor)) {
            try {
              this.mats.hair.color.set(opts.hairColor);
              st.hairColor = opts.hairColor;
            } catch (_) {
              /* 略過 */
            }
          }
          if (typeof opts.outfit === 'string') {
            const req = MannequinAppearance.OUTFIT_ALIASES[opts.outfit] || opts.outfit;
            const next = MannequinAppearance.OUTFITS.includes(req) ? req : 'none';
            if (force || next !== st.outfit) {
              st.outfit = next;
              if (next !== 'none' && !this._outfits[next]) this._outfits[next] = this._buildOutfit(next);
              for (const [k, o] of Object.entries(this._outfits)) o.root.visible = k === next;
              this.m.markPickDirty();
            }
          }
          if (typeof opts.hairStyle === 'string') {
            const next = MannequinAppearance.HAIR_STYLES.includes(opts.hairStyle) ? opts.hairStyle : 'none';
            if (force || next !== st.hairStyle) {
              st.hairStyle = next;
              if (next !== 'none' && !this._hairs[next]) this._hairs[next] = this._buildHair(next);
              for (const [k, h] of Object.entries(this._hairs)) h.root.visible = k === next;
              this.m.markPickDirty();
            }
          }
        }

        get(key) {
          return key ? this.state[key] : { ...this.state };
        }

        syncAppearanceFrom(other) {
          const diff = {};
          let changed = false;
          for (const k of ['outfit', 'outfitColor', 'hairStyle', 'hairColor']) {
            if (other.state[k] !== this.state[k]) {
              diff[k] = other.state[k];
              changed = true;
            }
          }
          if (changed) this.set(diff);
        }

        syncPoseFrom(other) {
          this.capeKnots.set(other.capeKnots);
          if (this._cape && other._cape) {
            this._cape.root.rotation.z = other._cape.root.rotation.z;
            if (this.state.outfit === 'cape') this._deformCape();
          }
          const a = this._outfits.labcoat;
          const b = other._outfits.labcoat;
          if (a && b) {
            a.skirtL.rotation.copy(b.skirtL.rotation);
            a.skirtR.rotation.copy(b.skirtR.rotation);
          }
          const p = this._hairs.ponytail;
          const q = other._hairs.ponytail;
          if (p && q) p.pivot.rotation.copy(q.pivot.rotation);
        }

        reset() {
          this._capePitch = 0.14;
          this._capePitchVel = 0;
          this._capeRoll = 0;
          this._capeRollVel = 0;
          this._tailPitch = 0;
          this._tailPitchVel = 0;
        }

        dispose() {
          for (const o of [...Object.values(this._outfits), ...Object.values(this._hairs)]) {
            if (o.root.parent) o.root.parent.remove(o.root);
            if (this.m) this.m.unregisterParts(o.parts);
            for (const node of new Set([...(o.switches || []), ...(o.extraRoots || [])])) node.removeFromParent();
          }
          this._geos.forEach((g) => g.dispose());
          this._geos = [];
          this.getMaterials().forEach((mt) => mt.dispose());
          this._outfits = {};
          this._hairs = {};
          this.m = null;
        }

        _trimColor(hex) {
          const c = new THREE.Color(hex);
          const hsl = { h: 0, s: 0, l: 0 };
          c.getHSL(hsl);
          if (hsl.l > 0.78) return new THREE.Color('#334155');
          if (hsl.l < 0.25) return new THREE.Color('#64748b');
          return new THREE.Color().setHSL(hsl.h, clamp(hsl.s * 0.72, 0.12, 0.65), clamp(hsl.l * 0.48, 0.14, 0.34));
        }

        // -------------------------------------------------------------------------
        // 組件收集器：同一個父節點 + 同一材質的零件最後合併成一個網格
        // -------------------------------------------------------------------------
        _collector(rootName) {
          const m = this.m;
          const groups = new Map();
          const holder = { root: null, parts: [], extraRoots: [] };
          const self = this;
          return {
            holder,
            /** 加入幾何：parent 為骨架節點，info 為點選資訊 */
            add(parent, geo, matKey, info, pos, rot, scl) {
              const mtx = new THREE.Matrix4().compose(
                new THREE.Vector3(...(pos || [0, 0, 0])),
                new THREE.Quaternion().setFromEuler(new THREE.Euler(...(rot || [0, 0, 0]))),
                new THREE.Vector3(...(scl || [1, 1, 1]))
              );
              geo.applyMatrix4(mtx);
              const key = `${parent.uuid}|${matKey}|${info.partId}`;
              if (!groups.has(key)) groups.set(key, { parent, matKey, info, geos: [] });
              groups.get(key).geos.push(geo);
            },
            finish() {
              // 用一個不可見的容器群組統一控制顯示：每個父節點下掛一個子群組
              const switches = [];
              for (const g of groups.values()) {
                const geo = g.geos.length === 1 ? g.geos[0] : mergeGeos(g.geos);
                if (g.geos.length > 1) g.geos.forEach((x) => x.dispose());
                self._geos.push(geo);
                const mesh = new THREE.Mesh(geo, self.mats[g.matKey]);
                m.registerPart(mesh, { ...g.info, isClothing: rootName !== 'hair', isHair: rootName === 'hair' });
                holder.parts.push(mesh);
                let sw = g.parent.children.find((c) => c.userData.__lookSwitch === holder);
                if (!sw) {
                  sw = new THREE.Group();
                  sw.userData.__lookSwitch = holder;
                  g.parent.add(sw);
                  switches.push(sw);
                }
                sw.add(mesh);
              }
              // holder.root 以 Proxy 方式同時切換所有子群組的 visible
              holder.root = {
                _v: true,
                get visible() {
                  return this._v;
                },
                set visible(v) {
                  this._v = v;
                  switches.forEach((s) => (s.visible = v));
                },
                get parent() {
                  return null;
                }
              };
              holder.switches = switches;
              holder.extraRoots = [...switches];
              return holder;
            }
          };
        }

        // -------------------------------------------------------------------------
        // 服裝
        // -------------------------------------------------------------------------
        _buildOutfit(kind) {
          const m = this.m;
          const C = this._collector('outfit');
          const T = m.torsoGroup;
          const P = m.pelvisGroup;
          const W = m.waistJoint;
          const info = {
            torso: { partId: 'torso', partName: '上衣', dragType: 'torso' },
            pelvis: { partId: 'pelvis', partName: '腰部', dragType: 'pelvis' },
            arm: (s, upper) => (upper
              ? { partId: `${s}UpperArm`, partName: `${s === 'L' ? '左' : '右'}袖`, dragType: 'upperArm', side: s }
              : { partId: `${s}Hand`, partName: `${s === 'L' ? '左' : '右'}前袖`, dragType: 'handIK', side: s }),
            leg: (s, upper) => (upper
              ? { partId: `${s}Thigh`, partName: `${s === 'L' ? '左' : '右'}褲管`, dragType: 'thigh', side: s }
              : { partId: `${s}Foot`, partName: `${s === 'L' ? '左' : '右'}褲腳`, dragType: 'footIK', side: s })
          };
          const shirtProfile = linTable(PROFILES.shirt);
          const parts = { skirtL: null, skirtR: null };
          const extraPivots = [];

          const addTorso = (profileKey, matKey, gap, opts = {}) => {
            const prof = linTable(PROFILES[profileKey]);
            const pts = PROFILES[profileKey];
            C.add(T, latheCloth({ profile: prof, y0: opts.y0 ?? pts[0][0], y1: opts.y1 ?? pts[pts.length - 1][0], gap, sz: torsoSz, rows: 30, cols: 40, thickness: opts.thickness ?? 0.022, ...opts }), matKey, info.torso);
          };
          const addWaist = (matKey, pad) => {
            const b = BODY.waistBall;
            C.add(W, clothBall(b.r + pad, b.s[0], b.s[1], b.s[2]), matKey, info.torso);
          };
          const addSleeves = (matKey, len, cuffMat = null) => {
            for (const s of ['L', 'R']) {
              const arm = s === 'L' ? m.leftArm : m.rightArm;
              C.add(arm.shoulderJoint, clothBall(BODY.shoulderR + 0.018), matKey, info.arm(s, true));
              const ua = linTable(BODY.upperArm);
              const short = len === 'short';
              C.add(arm.shoulderJoint, latheCloth({ profile: ua, y0: short ? -0.4 : -0.83, y1: 0.02, gap: 0.024, flare: short ? (y, v) => 0.018 * (1 - v) : null, rows: 14, cols: 22, uRep: 3, vRep: 2 }), matKey, info.arm(s, true));
              if (short) continue;
              C.add(arm.elbowJoint, clothBall(BODY.elbowR + 0.026), matKey, info.arm(s, false));
              const fa = linTable(BODY.foreArm);
              const end = cuffMat ? -0.52 : -0.6;
              C.add(arm.elbowJoint, latheCloth({ profile: fa, y0: end, y1: 0.02, gap: 0.024, flare: (y, v) => 0.014 * (1 - v), rows: 14, cols: 22, uRep: 3, vRep: 2 }), matKey, info.arm(s, false));
              if (cuffMat) {
                C.add(arm.elbowJoint, latheCloth({ profile: fa, y0: -0.63, y1: -0.5, gap: 0.046, rows: 4, cols: 22, thickness: 0.03, uRep: 3, vRep: 1 }), cuffMat, info.arm(s, false));
              }
            }
          };
          const addPants = (matKey) => {
            C.add(P, latheCloth({ profile: linTable(PROFILES.pants), y0: -0.24, y1: 0.22, gap: 0.024, sz: () => BODY.pelvisSz, rows: 16, cols: 36 }), matKey, info.pelvis);
            for (const s of ['L', 'R']) {
              const leg = s === 'L' ? m.leftLeg : m.rightLeg;
              C.add(leg.hipJoint, clothBall(BODY.hipR + 0.026), matKey, info.leg(s, true));
              C.add(leg.hipJoint, latheCloth({ profile: linTable(BODY.thigh), y0: -0.95, y1: 0.02, gap: 0.026, rows: 16, cols: 24, uRep: 3, vRep: 3 }), matKey, info.leg(s, true));
              C.add(leg.kneeJoint, clothBall(BODY.kneeR + 0.028), matKey, info.leg(s, false));
              const calf = linTable(BODY.calf);
              C.add(leg.kneeJoint, latheCloth({ profile: (y) => Math.max(calf(y), 0.118), y0: -0.8, y1: 0.02, gap: 0.026, flare: (y, v) => 0.016 * (1 - v) * (1 - v), rows: 18, cols: 24, uRep: 3, vRep: 3 }), matKey, info.leg(s, false));
            }
          };
          const addBelt = (y) => {
            C.add(P, latheCloth({ profile: linTable(PROFILES.pants), y0: y - 0.035, y1: y + 0.035, gap: 0.05, sz: () => BODY.pelvisSz, rows: 2, cols: 36, thickness: 0.028 }), 'leather', info.pelvis);
            const z = linTable(PROFILES.pants)(y) * BODY.pelvisSz + 0.08;
            C.add(P, new THREE.BoxGeometry(0.1, 0.085, 0.022), 'accent', info.pelvis, [0, y, z]);
          };

          if (kind === 'labcoat') {
            // 內襯襯衫（只在白袍前襟開口看得到）＋長褲
            addTorso('shirt', 'shirt', 0.024, { thickness: 0.016 });
            addWaist('shirt', 0.02);
            addPants('trim');
            // 白袍上身：前襟開口，罩在褲子外
            const gapF = 0.2;
            addTorso('jacket', 'main', 0.06, { phi0: gapF, phiLen: TAU - gapF * 2, y0: -0.09, thickness: 0.026 });
            // 翻領：沿前襟外翻的布片
            const jk = linTable(PROFILES.jacket);
            // 翻領：V 形，下端在胸口收成尖角、往上變寬，貼著白袍外層
            for (const s of [1, -1]) {
              const lapel = buildShell({
                rows: 12, cols: 6, wrap: false, thickness: 0.018, uRep: 1, vRep: 2,
                point: (u, v, off, out) => {
                  const y = 0.46 + 0.5 * v;
                  const w = 0.04 + 0.26 * smooth(v);
                  const phi = s * (gapF - 0.015 + w * u);
                  const r = jk(y);
                  const g = 0.088 + off + 0.012 * v;
                  return out.set((r + g) * Math.sin(phi), y, (r * torsoSz(y) + g) * Math.cos(phi));
                }
              });
              C.add(T, lapel, 'main', info.torso);
            }
            // 後領
            C.add(T, latheCloth({ profile: () => 0.16, y0: 0.98, y1: 1.08, gap: 0.02, sz: () => 1, phi0: 0.9, phiLen: TAU - 1.8, rows: 3, cols: 20, thickness: 0.024, flare: (y, v) => 0.05 * (1 - v) }), 'main', info.torso);
            addSleeves('main', 'long');
            // 胸袋、鈕扣
            const zAt = (y, x) => {
              const r = jk(y) + 0.06;
              const rz = jk(y) * torsoSz(y) + 0.06;
              return rz * Math.sqrt(Math.max(0, 1 - (x / r) ** 2)) + 0.012;
            };
            C.add(T, new THREE.BoxGeometry(0.1, 0.12, 0.016), 'main', info.torso, [0.18, 0.6, zAt(0.6, 0.18)], [-0.12, 0.42, 0]);
            for (const y of [0.52, 0.36, 0.2]) {
              C.add(T, new THREE.CylinderGeometry(0.018, 0.018, 0.012, 14), 'shirt', info.torso, [-0.075, y, zAt(y, -0.075)], [Math.PI / 2, 0, 0]);
            }
            // 下襬：左右兩片，隨大腿擺動（見 update）
            const skirtProfile = linTable([[-0.78, 0.5], [-0.3, 0.45], [0.0, 0.42], [0.16, 0.4]]);
            for (const s of ['L', 'R']) {
              const pivot = new THREE.Group();
              pivot.position.set(s === 'L' ? 0.05 : -0.05, 0.06, 0);
              P.add(pivot);
              const sg = latheCloth({
                profile: skirtProfile, y0: -0.78, y1: 0.16, gap: 0.03,
                sz: (y) => 0.66 + 0.1 * clamp(-y / 0.78, 0, 1),
                phi0: s === 'L' ? gapF : Math.PI + 0.03, phiLen: Math.PI - gapF - 0.03,
                rows: 16, cols: 18, thickness: 0.026, zOff: 0
              });
              sg.translate(s === 'L' ? -0.05 : 0.05, -0.06, 0);
              C.add(pivot, sg, 'main', info.pelvis);
              // 下口袋
              const px = s === 'L' ? 0.26 : -0.26;
              const py = -0.42;
              const r = skirtProfile(py) + 0.03;
              const rz = r * (0.66 + 0.1 * (0.42 / 0.78));
              const pz = rz * Math.sqrt(Math.max(0, 1 - (px / (r + 0.02)) ** 2)) + 0.012;
              C.add(pivot, new THREE.BoxGeometry(0.15, 0.13, 0.016), 'main', info.pelvis, [px - (s === 'L' ? 0.05 : -0.05), py - 0.06, pz], [0, (s === 'L' ? 1 : -1) * 0.5, 0]);
              parts[`skirt${s}`] = pivot;
              extraPivots.push(pivot);
            }
          } else if (kind === 'jacket') {
            addTorso('jacket', 'main', 0.04, { y0: -0.1, thickness: 0.026 });
            addWaist('main', 0.03);
            // 下襬羅紋、立領、拉鍊
            const jk = linTable(PROFILES.jacket);
            C.add(T, latheCloth({ profile: jk, y0: -0.17, y1: -0.08, gap: 0.062, sz: torsoSz, rows: 3, cols: 40, thickness: 0.03 }), 'trim', info.torso);
            C.add(T, latheCloth({ profile: () => 0.165, y0: 0.97, y1: 1.12, gap: 0.0, sz: () => 0.95, rows: 4, cols: 32, thickness: 0.026, flare: (y, v) => -0.01 * v }), 'trim', info.torso);
            C.add(T, latheCloth({ profile: jk, y0: -0.12, y1: 0.99, gap: 0.068, sz: torsoSz, phi0: -0.035, phiLen: 0.07, rows: 30, cols: 2, thickness: 0.012 }), 'accent', info.torso);
            addSleeves('main', 'long', 'trim');
            addPants('trim');
          } else if (kind === 'tunic') {
            // 白襯衫（短袖）＋學院背心＋皮帶長褲
            addTorso('shirt', 'shirt', 0.024, { thickness: 0.016 });
            addWaist('shirt', 0.02);
            addSleeves('shirt', 'short');
            addPants('trim');
            addBelt(0.1);
            const vTop = lerpTable([[0, 0.6], [0.42, 0.96], [0.55, 1.02], [0.85, 1.02], [1.1, 0.68], [1.35, 0.6], [1.85, 0.6], [2.15, 0.72], [2.45, 1.02], [Math.PI, 1.03]]);
            addTorso('vest', 'main', 0.05, { yTop: (phi) => vTop(foldAngle(phi)), y1: 1.03, thickness: 0.026 });
            // 背心下緣的 V 形尖角
            const vs = linTable(PROFILES.vest);
            for (const s of [1, -1]) {
              C.add(T, latheCloth({ profile: vs, y0: -0.13, y1: -0.04, gap: 0.05, sz: torsoSz, phi0: s > 0 ? 0.02 : -0.32, phiLen: 0.3, rows: 3, cols: 5, thickness: 0.026, yTop: null, flare: null }), 'main', info.torso);
            }
            const zv = (y) => vs(y) * torsoSz(y) + 0.08;
            for (const y of [0.42, 0.28, 0.14]) C.add(T, new THREE.SphereGeometry(0.02, 12, 8), 'accent', info.torso, [0, y, zv(y)]);
          } else if (kind === 'cape') {
            this._buildCape(C, info.torso);
          }
          const holder = C.finish();
          Object.assign(holder, parts);
          holder.extraRoots.push(...extraPivots);
          return holder;
        }

        _buildCape(C, torsoInfo) {
          const m = this.m;
          const T = m.torsoGroup;
          // 披肩領（有厚度）
          const mantle = linTable([[0.78, 0.445], [0.89, 0.415], [0.96, 0.25], [0.99, 0.16]]);
          C.add(T, latheCloth({ profile: mantle, y0: 0.74, y1: 0.995, gap: 0.03, sz: () => 0.68, rows: 10, cols: 40, thickness: 0.024, flare: (y, v) => 0.03 * (1 - v) }), 'main', torsoInfo);
          const claspZ = 0.5 * 0.68 * 0.86 + 0.02;
          for (const s of [1, -1]) {
            const g = new THREE.CylinderGeometry(0.038, 0.038, 0.02, 18);
            C.add(T, g, 'accent', torsoInfo, [s * 0.2, 0.86, claspZ], [Math.PI / 2 - 0.25, 0, s * 0.35]);
          }
          const cord = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-0.2, 0.86, claspZ + 0.01),
            new THREE.Vector3(0, 0.815, claspZ + 0.035),
            new THREE.Vector3(0.2, 0.86, claspZ + 0.01)
          ]);
          C.add(T, new THREE.TubeGeometry(cord, 16, 0.011, 8), 'accent', torsoInfo);

          // 連續可彎曲披風（單一網格、CPU 變形）
          const capeRoot = new THREE.Group();
          capeRoot.position.set(0, 0.93, -0.22);
          T.add(capeRoot);
          const ROWS = 24;
          const COLS = 20;
          const CAPE_H = 1.88;
          const R0 = 0.36;
          const R1 = 0.68;
          const SPAN = 2.15;
          const CENTER_Z = R0 * 0.85;
          const vCount = (ROWS + 1) * (COLS + 1);
          const rest = new Float32Array(vCount * 3);
          const uvs = new Float32Array(vCount * 2);
          for (let j = 0; j <= ROWS; j++) {
            const sN = j / ROWS;
            const r = R0 + (R1 - R0) * sN;
            for (let i = 0; i <= COLS; i++) {
              const th = Math.PI - SPAN / 2 + SPAN * (i / COLS);
              const k = j * (COLS + 1) + i;
              rest[k * 3] = sN;
              rest[k * 3 + 1] = r * Math.sin(th);
              rest[k * 3 + 2] = r * (1 + Math.cos(th));
              uvs[k * 2] = (i / COLS) * 5;
              uvs[k * 2 + 1] = (1 - sN) * 8;
            }
          }
          const idx = [];
          for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
              const a = j * (COLS + 1) + i;
              const b = a + 1;
              const c = a + COLS + 1;
              const d = c + 1;
              idx.push(a, c, b, b, c, d);
            }
          }
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vCount * 3), 3));
          geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
          geo.setIndex(idx);
          this._geos.push(geo);
          this._cape = { geo, rest, ROWS, COLS, H: CAPE_H, spineZ0: CENTER_Z - R0, phiRow: new Float32Array(ROWS + 1), root: capeRoot };
          const outer = new THREE.Mesh(geo, this.mats.capeOuter);
          const inner = new THREE.Mesh(geo, this.mats.capeInner);
          for (const mesh of [outer, inner]) {
            m.registerPart(mesh, { ...torsoInfo, partName: '披風', isClothing: true });
            capeRoot.add(mesh);
          }
          this._deformCape();
          // 讓 capeRoot 跟著服裝開關：收集器 finish 後補進 switches
          const origFinish = C.finish;
          C.finish = () => {
            const h = origFinish();
            h.parts.push(outer, inner);
            h.switches.push(capeRoot);
            return h;
          };
        }

        /** 依 capeKnots 沿脊線積分出彎曲後的披風頂點 */
        _deformCape() {
          const cp = this._cape;
          if (!cp) return;
          const { rest, ROWS, COLS, H, phiRow } = cp;
          const K = this.capeKnots;
          for (let j = 0; j <= ROWS; j++) {
            const t = (j / ROWS) * 4;
            const k = Math.min(3, Math.floor(t));
            phiRow[j] = K[k] + (K[k + 1] - K[k]) * (t - k);
          }
          const pos = cp.geo.attributes.position.array;
          const step = H / ROWS;
          let py = 0;
          let pz = cp.spineZ0;
          for (let j = 0; j <= ROWS; j++) {
            if (j > 0) {
              const mid = 0.5 * (phiRow[j] + phiRow[j - 1]);
              py -= Math.cos(mid) * step;
              pz -= Math.sin(mid) * step;
            }
            const ny = -Math.sin(phiRow[j]);
            const nz = Math.cos(phiRow[j]);
            for (let i = 0; i <= COLS; i++) {
              const k = j * (COLS + 1) + i;
              const d = rest[k * 3 + 2];
              pos[k * 3] = rest[k * 3 + 1];
              pos[k * 3 + 1] = py + ny * d;
              pos[k * 3 + 2] = pz + nz * d;
            }
          }
          cp.geo.attributes.position.needsUpdate = true;
          cp.geo.computeVertexNormals();
          cp.geo.computeBoundingSphere();
        }

        // -------------------------------------------------------------------------
        // 髮型
        // -------------------------------------------------------------------------
        _buildHair(style) {
          const m = this.m;
          const C = this._collector('hair');
          const H = m.headGroup;
          const info = { partId: 'head', partName: '頭髮', dragType: 'head' };
          const holder = {};

          /**
           * 髮殼：hairline(a) 給每個方位（a = 折回角，0 = 正前方）的髮際極角；
           * volume(th, phi, v) 給外推量；hang 讓耳下頭髮垂直落下
           */
          const shell = ({ hairline, volume, hang = 0, inner = 0.004, rows = 26, cols = 64 }) => buildShell({
            rows, cols, wrap: true, pole: true, thickness: 1, uRep: 10, vRep: 1,
            point: (u, v, off, out) => {
              const phi = u * TAU;
              const thMax = hairline(foldAngle(phi), phi);
              const th = thMax * v;
              const outer = volume(th, phi, v, thMax);
              // 內層貼近頭皮（inner），外層為 volume；off = -1 代表內層
              const d = off <= -1 ? inner : outer + off;
              return hairPoint(th, phi, d, out, hang);
            }
          });

          const shortLine = (fringe) => (a, phi) => {
            let th = lerpTable([[0, 0.8], [0.8, 0.96], [1.3, 1.42], [1.75, 1.6], [2.4, 2.0], [Math.PI, 2.12]])(a);
            if (fringe && a < 0.95) th += 0.17 * Math.pow(Math.max(0, Math.sin(phi * 9 + 0.6)), 3) * (1 - a / 0.95);
            return th;
          };
          const tousled = (amt) => (th, phi, v) => {
            const base = 0.016 + 0.034 * Math.pow(1 - v, 0.6);
            return base + amt * Math.sin(phi * 6 + th * 3) * Math.sin(th * 5) * (1 - v * 0.6);
          };
          const sleek = (th, phi, v) => 0.012 + 0.022 * Math.pow(1 - v, 0.7) + 0.004 * Math.sin(phi * 24) * (1 - v);

          if (style === 'short') {
            C.add(H, shell({ hairline: shortLine(true), volume: tousled(0.007) }), 'hair', info);
          } else if (style === 'spiky') {
            const line = shortLine(false);
            const vol = (th, phi, v) => 0.014 + 0.02 * (1 - v);
            C.add(H, shell({ hairline: line, volume: vol }), 'hair', info);
            // 尖刺沿頭髮表面法線長出，向後上方傾斜
            const spike = new THREE.ConeGeometry(0.075, 1, 12);
            spike.translate(0, 0.5, 0);
            const rings = [[0.1, 1, 0.25], [0.55, 4, 0.24], [0.98, 6, 0.21], [1.4, 6, 0.16]];
            const p0 = new THREE.Vector3();
            const p1 = new THREE.Vector3();
            for (const [th, count, len] of rings) {
              for (let k = 0; k < count; k++) {
                const phi = (k / count) * TAU + (count % 2 ? 0 : Math.PI / count) + th * 0.3;
                const a = foldAngle(phi);
                if (th > line(a, phi) - 0.15 || (th > 1.2 && a < 0.7)) continue;
                hairPoint(th, phi, vol(th, phi, th / line(a, phi)) * 0.6, p0);
                hairPoint(th, phi, 0.2, p1);
                const dir = p1.sub(p0).normalize();
                dir.y += 0.55;
                dir.z -= 0.45;
                dir.normalize();
                const g = spike.clone();
                const sc = len * (0.9 + 0.2 * Math.sin(k * 2.3 + th * 5));
                g.scale(1 + 0.25 * Math.cos(k * 1.7), sc, 1);
                const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                g.applyQuaternion(q);
                g.translate(p0.x, p0.y, p0.z);
                C.add(H, g, 'hair', info);
              }
            }
            spike.dispose();
          } else if (style === 'bob') {
            // 前額齊瀏海；兩側在臉頰外框垂到下顎，耳下改為垂直落下並微微外翻
            const line = (a) => lerpTable([[0, 1.02], [0.62, 1.04], [0.8, 2.25], [Math.PI, 2.3]])(a);
            const vol = (th, phi, v, thMax) => {
              const a = foldAngle(phi);
              const fringeLift = a < 0.75 ? 0.012 * smooth(v) : 0;
              const flip = th > 1.9 ? 0.03 * smooth(clamp((th - 1.9) / (thMax - 1.9 + 1e-6), 0, 1)) : 0;
              return 0.02 + 0.03 * Math.pow(1 - v, 0.5) + fringeLift + flip + 0.003 * Math.sin(phi * 30);
            };
            C.add(H, shell({ hairline: line, volume: vol, hang: 0.34, rows: 32 }), 'hair', info);
          } else if (style === 'ponytail' || style === 'bun') {
            const line = (a) => lerpTable([[0, 0.74], [0.8, 0.9], [1.3, 1.38], [1.75, 1.56], [2.4, 1.96], [Math.PI, 2.06]])(a);
            C.add(H, shell({ hairline: line, volume: sleek }), 'hair', info);
            if (style === 'ponytail') {
              const anchorTh = 1.15;
              const p = hairPoint(anchorTh, Math.PI, 0.03, new THREE.Vector3());
              C.add(H, new THREE.TorusGeometry(0.05, 0.02, 10, 22), 'hairTie', info, [p.x, p.y, p.z - 0.005], [0.5, 0, 0]);
              const pivot = new THREE.Group();
              pivot.position.set(p.x, p.y, p.z - 0.01);
              H.add(pivot);
              const tail = sweepTube({
                spine: (s, out) => {
                  const u = 1 - s;
                  // 二次貝茲：向後挑起再垂落
                  return out.set(0, 2 * u * s * -0.02 + s * s * -0.5, 2 * u * s * -0.2 + s * s * -0.13);
                },
                radius: (s, a) => {
                  const swell = 0.05 + 0.045 * Math.sin(Math.PI * Math.min(1, s / 0.3) * 0.5);
                  return (swell * Math.pow(1 - s, 0.55) + 0.012) * (1 + 0.09 * Math.sin(a * 7 + s * 4));
                },
                rows: 30,
                cols: 20
              });
              C.add(pivot, tail, 'hair', info);
              holder.pivot = pivot;
              holder.extraPivot = pivot;
            } else {
              const p = hairPoint(0.55, Math.PI, 0.02, new THREE.Vector3());
              const bun = new THREE.SphereGeometry(0.12, 28, 20);
              const pa = bun.attributes.position;
              const v = new THREE.Vector3();
              for (let i = 0; i < pa.count; i++) {
                v.fromBufferAttribute(pa, i);
                const lat = Math.asin(clamp(v.y / 0.12, -1, 1));
                const lon = Math.atan2(v.x, v.z);
                v.multiplyScalar(1 + 0.07 * Math.sin(lon * 3 + lat * 6));
                pa.setXYZ(i, v.x, v.y * 0.85, v.z);
              }
              bun.computeVertexNormals();
              C.add(H, bun, 'hair', info, [p.x, p.y + 0.07, p.z - 0.03], [-0.5, 0, 0]);
              C.add(H, new THREE.TorusGeometry(0.085, 0.017, 10, 26), 'hairTie', info, [p.x, p.y + 0.0, p.z - 0.0], [Math.PI / 2 - 0.5, 0, 0]);
            }
          }
          const done = Object.assign(C.finish(), holder);
          if (holder.extraPivot) done.extraRoots.push(holder.extraPivot);
          return done;
        }

        // -------------------------------------------------------------------------
        // 每幀次級動態（核心以 motion 傳入人偶自身座標的速度）
        // -------------------------------------------------------------------------
        update(dt, motion) {
          const m = this.m;
          if (!m) return;
          const pose = m.pose;
          const D = Math.PI / 180;
          const bounce = Number.isFinite(pose.pelvisBounceY) ? pose.pelvisBounceY : 0;
          const { localFwdVel, localSideVel, speed, elapsed } = motion;

          if (this.state.outfit === 'cape' && this._cape) {
            const torsoPitch = (pose.torsoX || 0) * D;
            const targetPitch = clamp(0.14 + Math.max(0, localFwdVel) * 0.22 - Math.min(0, localFwdVel) * 0.05 + Math.max(0, -torsoPitch) * 0.35 + bounce * 1.1, 0.06, 1.18);
            const targetRoll = clamp(-localSideVel * 0.14, -0.42, 0.42);
            this._capePitchVel += (targetPitch - this._capePitch) * 44 * dt;
            this._capePitchVel *= Math.exp(-9.5 * dt);
            this._capePitch = clamp(this._capePitch + this._capePitchVel * dt, 0.05, 1.25);
            this._capeRollVel += (targetRoll - this._capeRoll) * 40 * dt;
            this._capeRollVel *= Math.exp(-9.0 * dt);
            this._capeRoll = clamp(this._capeRoll + this._capeRollVel * dt, -0.45, 0.45);
            const waveAmp = 0.02 + clamp(speed / 4.5, 0, 1) * 0.07;
            const Wt = [0.3, 0.6, 0.82, 0.95, 1.0];
            for (let k = 0; k < 5; k++) {
              this.capeKnots[k] = this._capePitch * Wt[k] + Math.sin(elapsed * (5.2 + speed * 1.4) - k * 0.85) * waveAmp * (k / 4);
            }
            this._cape.root.rotation.z = this._capeRoll * 0.8;
            this._deformCape();
          }

          const coat = this._outfits.labcoat;
          if (this.state.outfit === 'labcoat' && coat) {
            const lx = (pose.lHipX || 0) * D;
            const rx = (pose.rHipX || 0) * D;
            const lz = (pose.lHipZ || 0) * D;
            const rz = (pose.rHipZ || 0) * D;
            // 腿往前抬（hipX 為負）時衣襬跟著前掀；往後時略微跟隨
            coat.skirtL.rotation.x = clamp(lx * 0.7, -1.1, 0.35);
            coat.skirtR.rotation.x = clamp(rx * 0.7, -1.1, 0.35);
            coat.skirtL.rotation.z = clamp((lz - 0.05) * 0.6 + bounce * 0.35, 0, 0.5);
            coat.skirtR.rotation.z = clamp((rz + 0.05) * 0.6 - bounce * 0.35, -0.5, 0);
          }

          const tail = this._hairs.ponytail;
          if (this.state.hairStyle === 'ponytail' && tail) {
            const headPitch = (pose.headX || 0) * D;
            const target = clamp(-headPitch * 0.55 + Math.max(0, localFwdVel) * 0.14 + bounce * 2.2, -0.35, 0.78);
            this._tailPitchVel += (target - this._tailPitch) * 58 * dt;
            this._tailPitchVel *= Math.exp(-8.5 * dt);
            this._tailPitch = clamp(this._tailPitch + this._tailPitchVel * dt, -0.4, 0.85);
            tail.pivot.rotation.x = this._tailPitch;
            tail.pivot.rotation.z = clamp(-localSideVel * 0.09, -0.28, 0.28);
          }
        }
      }


      return { MannequinAppearance };
    })();

    const { MannequinControls, VirtualJoystick, PoseHistory } = (() => {
      /**
       * mannequin-controls.js — 木頭人偶的「互動」可選擴充（需要瀏覽器 DOM）
       *
       *   import { MannequinControls, VirtualJoystick } from './mannequin-controls.js';
       *   const ctl = new MannequinControls({ THREE, mannequin: m, camera, domElement: renderer.domElement,
       *                                       orbitControls: controls, scene });
       *   const joy = new VirtualJoystick({ parent: document.body, onTap: (x, y) => ctl.stepScreen(x, y) });
       *   ctl.joystick = joy;
       *   // 每幀：ctl.update(dt); m.update(dt, ctl.getAzimuth());
       *
       * 提供：
       *   - 拖曳腳下地面圓圈移動（Shift 吸附格線），未鎖定時腳步會跟著走
       *   - 鎖定擺姿勢（setPoseLocked(true)）後直接拖肢體：手腳 2-Bone IK（Shift 前後推深度）、
       *     頭/軀幹/上臂/大腿 FK 旋轉、骨盆上下拖曳蹲低且雙腳固定
       *   - 懸停高亮、復原/重做（PoseHistory）
       *   - 鍵盤：WASD 連續走跑；方向鍵短按＝單步、按住 220ms 以上＝連續走
       *   - VirtualJoystick：自帶 DOM 與行內樣式的觸控搖桿（拖曳＝走跑、快速輕點＝單步）
       * 不用的功能可以用建構選項關閉（keyboard: false、history: false…）。
       */

      const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
      const num = (v, f = 0) => (Number.isFinite(v) ? v : f);

      /** 姿勢復原/重做堆疊 */
      class PoseHistory {
        constructor(limit = 40) {
          this.limit = limit;
          this.undoStack = [];
          this.redoStack = [];
          this.onChange = null;
        }
        get canUndo() {
          return this.undoStack.length > 0;
        }
        get canRedo() {
          return this.redoStack.length > 0;
        }
        /** 在改變姿勢「之前」呼叫，記下目前姿勢 */
        record(mannequin) {
          this.push(mannequin.getPose());
        }
        push(pose) {
          this.undoStack.push({ ...pose });
          if (this.undoStack.length > this.limit) this.undoStack.shift();
          this.redoStack.length = 0;
          if (this.onChange) this.onChange(this);
        }
        undo(mannequin) {
          if (!this.canUndo) return false;
          this.redoStack.push(mannequin.getPose());
          this._apply(mannequin, this.undoStack.pop());
          return true;
        }
        redo(mannequin) {
          if (!this.canRedo) return false;
          this.undoStack.push(mannequin.getPose());
          this._apply(mannequin, this.redoStack.pop());
          return true;
        }
        clear() {
          this.undoStack.length = 0;
          this.redoStack.length = 0;
          if (this.onChange) this.onChange(this);
        }
        _apply(m, pose) {
          m.setPose(pose, true);
          if (this.onChange) this.onChange(this);
        }
      }

      /** 觸控/滑鼠虛擬搖桿：自帶 DOM，不依賴任何 CSS 框架 */
      class VirtualJoystick {

        constructor({ parent = document.body, size = 136, style = {}, onTap = null, tapMs = 180, tapPx = 6 } = {}) {
