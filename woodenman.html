          const fingersMesh = new THREE.Mesh(G.fingers, this.woodMat);
          fingersMesh.scale.set(0.40, 1.0, 1.02);
          fingersMesh.position.set(0, -0.205, 0);
          fingersMesh.rotation.z = -s * 0.14;
          this._registerPart(fingersMesh, {
            partId: `${side}Hand`,
            partName: `${label}木手掌`,
            dragType: 'handIK',
            side
          });
          handGroup.add(fingersMesh);

          const thumbMesh = new THREE.Mesh(G.thumb, this.woodMat);
          thumbMesh.position.set(-s * 0.015, -0.10, 0.075);
          thumbMesh.rotation.x = 0.45;
          thumbMesh.rotation.z = -s * 0.25;
          this._registerPart(thumbMesh, {
            partId: `${side}Hand`,
            partName: `${label}拇指`,
            dragType: 'handIK',
            side
          });
          handGroup.add(thumbMesh);

          return { shoulderJoint, elbowJoint, wristJoint, handGroup };
        }

        _buildLeg(side) {
          const G = this.geometries;
          const isLeft = side === 'L';
          const s = isLeft ? 1 : -1;
          const label = isLeft ? '左' : '右';

          const hipJoint = this._createJointBall(0.168, null, {
            partId: `${side}Thigh`,
            partName: `${label}髖球關節`,
            dragType: 'thigh',
            side
          });
          hipJoint.position.set(s * 0.205, -0.18, 0);
          this.pelvisGroup.add(hipJoint);

          const thighMesh = new THREE.Mesh(G.thigh, this.woodMat);
          thighMesh.position.set(0, -0.05, 0);
          this._registerPart(thighMesh, {
            partId: `${side}Thigh`,
            partName: `${label}大腿`,
            dragType: 'thigh',
            side
          });
          hipJoint.add(thighMesh);

          const kneeJoint = this._createJointBall(0.132, null, {
            partId: `${side}Foot`,
            partName: `${label}膝蓋球關節`,
            dragType: 'footIK',
            side
          });
          kneeJoint.position.set(0, -this.THIGH_LEN, 0);
          hipJoint.add(kneeJoint);

          const calfMesh = new THREE.Mesh(G.calf, this.woodMat);
          calfMesh.position.set(0, -0.05, 0);
          this._registerPart(calfMesh, {
            partId: `${side}Foot`,
            partName: `${label}小腿`,
            dragType: 'footIK',
            side
          });
          kneeJoint.add(calfMesh);

          const ankleJoint = this._createJointBall(0.095, null, {
            partId: `${side}Foot`,
            partName: `${label}腳踝`,
            dragType: 'footIK',
            side
          });
          ankleJoint.position.set(0, -this.CALF_LEN, 0);
          kneeJoint.add(ankleJoint);

          const footGroup = new THREE.Group();
          ankleJoint.add(footGroup);

          const footWedgeMesh = new THREE.Mesh(G.footWedge, this.woodMat);
          footWedgeMesh.rotation.x = -Math.PI / 2;
          footWedgeMesh.scale.set(1.05, 1.0, 0.58);
          footWedgeMesh.position.set(0, -0.055, -0.08);
          this._registerPart(footWedgeMesh, {
            partId: `${side}Foot`,
            partName: `${label}楔形木腳掌`,
            dragType: 'footIK',
            side
          });
          footGroup.add(footWedgeMesh);

          const heelMesh = new THREE.Mesh(G.sphere, this.woodMat);
          heelMesh.scale.set(0.095, 0.081, 0.095);
          heelMesh.position.set(0, -0.041, -0.035);
          this._registerPart(heelMesh, {
            partId: `${side}Foot`,
            partName: `${label}腳跟`,
            dragType: 'footIK',
            side
          });
          footGroup.add(heelMesh);

          return { hipJoint, kneeJoint, ankleJoint, footGroup };
        }

        // =======================================================================
        // 模組化立體髮型系統（光滑原木 / 俐落短髮 / 齊耳鮑伯 / 活力馬尾 / 動漫刺蝟 / 優雅丸子）
        // =======================================================================

        // =======================================================================
        // 模組化立體服裝系統（實驗白袍 / 立領夾克 / 英雄披風 / 學院背心）
        // =======================================================================


        /**
         * 設定外型。核心只處理 woodType；outfit / hairStyle 等需先 use(new MannequinAppearance())
         */
        setAppearance(opts = {}) {
          if (!opts || typeof opts !== 'object') return;
          if (opts.woodType === 'beech' || opts.woodType === 'walnut') this.setWoodType(opts.woodType);
          const look = this.getAddon('appearance');
          if (look) {
            look.set(opts);
          } else if (!this._warnedNoLook && ['outfit', 'outfitColor', 'hairStyle', 'hairColor'].some((k) => k in opts)) {
            this._warnedNoLook = true;
            console.warn('WoodenMannequin：服裝/髮型需要 mannequin-appearance.js（m.use(new MannequinAppearance())）');
          }
        }

        /** 從另一隻人偶同步外型（木紋＋各擴充的外型狀態）；沒有差異時不做任何事 */
        syncAppearanceFrom(sourceMannequin) {
          const src = sourceMannequin;
          if (!src) return;
          if (src.woodType !== this.woodType) this.setWoodType(src.woodType);
          for (const addon of this.addons) {
            const other = src.getAddon && src.getAddon(addon.name);
            if (other && addon.syncAppearanceFrom) addon.syncAppearanceFrom(other);
          }
        }

        // ------------------------------------------------------------------
        // 擴充模組機制
        // addon 介面（皆可選）：name, attach(m), update(dt, motion), syncAppearanceFrom(other),
        //   syncPoseFrom(other), getMaterials(), reset(), dispose()
        // ------------------------------------------------------------------

        /** 掛載擴充模組，回傳 addon 本身以便串接 */
        use(addon) {
          if (!addon) return addon;
          const dup = addon.name && this.getAddon(addon.name);
          if (dup) this.unuse(dup);
          this.addons.push(addon);
          if (addon.attach) addon.attach(this);
          if (this._opacity < 0.999 || this.isImage) this._applyOpacityTo(this._addonMats(addon), this._opacity);
          this._pickDirty = true;
          return addon;
        }

        unuse(addon) {
          const i = this.addons.indexOf(addon);
          if (i < 0) return;
          this.addons.splice(i, 1);
          if (addon.dispose) addon.dispose();
          this._pickDirty = true;
        }

        getAddon(name) {
          for (const a of this.addons) if (a.name === name) return a;
          return null;
        }

        /** 讓擴充把網格登記為可點選部位（info: partId, partName, dragType, side） */
        registerPart(mesh, info) {
          this._registerPart(mesh, info);
          this._pickDirty = true;
          return mesh;
        }

        /** 從可點選清單移除（擴充換裝時呼叫） */
        unregisterParts(meshes) {
          const set = new Set(meshes);
          if (this._highlightId) this.setHighlight(null);
          this.interactiveMeshes = this.interactiveMeshes.filter((m) => !set.has(m));
          for (const k of Object.keys(this.partGroupsMap)) {
            this.partGroupsMap[k] = this.partGroupsMap[k].filter((m) => !set.has(m));
          }
          this._pickDirty = true;
        }

        /** 換裝後呼叫，讓拾取快取重建 */
        markPickDirty() {
          this._pickDirty = true;
        }

        /** 擴充新增材質後呼叫，套用目前透明度 */
        adoptMaterials(mats) {
          if (this._opacity < 0.999 || this.isImage) this._applyOpacityTo(mats, this._opacity);
        }

        _addonMats(addon) {
          return (addon.getMaterials && addon.getMaterials()) || [];
        }

        /**
         * 切換木頭材質：'beech'（山毛櫸）或 'walnut'（黑胡桃木）
         * 兩組貼圖格式相同，直接換 map 即可，不需 needsUpdate 重新編譯 shader
         */
        setWoodType(type) {
          const key = type === 'walnut' ? 'walnut' : 'beech';
          this.appearance.woodType = key;
          const set = this.woodSets[key];
          if (key === this.woodType && this.woodMat.map === set.map) return;
          this.woodType = key;
          this.woodMat.map = set.map;
          this.woodMat.bumpMap = set.bumpMap;
          this.jointMat.map = set.map;
          this.jointMat.bumpMap = set.bumpMap;
          this.jointMat.color.setHex(set.jointTint);
        }

        /**
         * 切換移動模式：'strafe'（橫移模式）或 'turn'（轉向模式）
         */
        setMoveMode(mode) {
          if (mode === 'turn' || mode === 'strafe') {
            this.moveMode = mode;
          }
        }

        /**
         * 調整整體透明度（木頭、關節、所有擴充材質、陰影）
         */
        setOpacity(alpha) {
          const a = clamp(safeNum(alpha, 1), 0, 1);
          if (a === this._opacity) return;
          this._opacity = a;
          this._applyOpacityTo(this._allMats(), a);
          this.shadowMat.opacity = clamp((this.isImage ? 0.25 : 0.62) * a, 0.03, 0.72);
        }

        _applyOpacityTo(mats, a) {
          const needTrans = a < 0.999 || this.isImage;
          for (const mat of mats) {
            if (!mat) continue;
            if (mat.transparent !== needTrans) {
              mat.transparent = needTrans;
              mat.needsUpdate = true;
            }
            mat.opacity = a;
          }
        }

        _allMats() {
          const list = [this.woodMat, this.jointMat];
          for (const a of this.addons) list.push(...this._addonMats(a));
          return list;
        }

        /**
         * 從另一隻人偶同步關節角度、貼地高度，以及各擴充的動態（披風、衣襬、馬尾）
         * （原版只同步關節，成像人偶的披風會僵住不動）
         * 成像人偶不需要再呼叫 update()。
         */
        syncPoseFrom(sourceMannequin) {
          const src = sourceMannequin;
          if (!src || !src.pose) return;
          copyPose(this.pose, src.pose);
          copyPose(this.activeBasePose, src.activeBasePose);
          this.applyPoseToRig(true);
          this.pelvisGroup.position.y = src.pelvisGroup.position.y;
          this.contactShadow.scale.copy(src.contactShadow.scale);
          for (const addon of this.addons) {
            const other = src.getAddon && src.getAddon(addon.name);
            if (other && addon.syncPoseFrom) addon.syncPoseFrom(other);
          }
        }

        /**
         * 套用 this.pose 到骨架；groundLock 開啟時自動讓最低的腳底貼齊 y = 0
         * （原版部分預設姿勢會浮空 20 cm 或沉入地面 3.7 cm）
         */
        applyPoseToRig(skipGround = false) {
          this._applyJointAngles();
          if (this.groundLock && !skipGround) this._applyGroundLock();
        }

        _applyGroundLock() {
          this.root.updateMatrixWorld(true);
          const inv = this._tmpM.copy(this.root.matrixWorld).invert();
          let minY = Infinity;
          for (const leg of [this.leftLeg, this.rightLeg]) {
            const e = this._tmpM2.multiplyMatrices(inv, leg.ankleJoint.matrixWorld).elements;
            const pts = leg.footSamples;
            for (let i = 0; i < pts.length; i += 3) {
              const y = e[1] * pts[i] + e[5] * pts[i + 1] + e[9] * pts[i + 2] + e[13];
              if (y < minY) minY = y;
            }
          }
          if (Number.isFinite(minY)) {
            this.pelvisGroup.position.y -= minY;
            this.pelvisGroup.updateMatrixWorld(true);
          }
        }

        /** 預先取樣腳掌底部頂點（腳踝座標系），供貼地計算使用 */
        _initFootSamples() {
          this.root.updateMatrixWorld(true);
          const v = new THREE.Vector3();
          const mtx = new THREE.Matrix4();
          for (const leg of [this.leftLeg, this.rightLeg]) {
            const inv = new THREE.Matrix4().copy(leg.ankleJoint.matrixWorld).invert();
            const raw = [];
            leg.footGroup.children.forEach((mesh) => {
              const pos = mesh.geometry.attributes.position;
              mtx.multiplyMatrices(inv, mesh.matrixWorld);
              for (let i = 0; i < pos.count; i++) {
                v.fromBufferAttribute(pos, i).applyMatrix4(mtx);
                raw.push(v.x, v.y, v.z);
              }
            });
            let minY = Infinity;
            for (let i = 1; i < raw.length; i += 3) minY = Math.min(minY, raw[i]);
            const seen = new Set();
            const keep = [];
            for (let i = 0; i < raw.length; i += 3) {
              if (raw[i + 1] > minY + 0.12) continue;
              const key = `${raw[i].toFixed(3)},${raw[i + 1].toFixed(3)},${raw[i + 2].toFixed(3)}`;
              if (seen.has(key)) continue;
              seen.add(key);
              keep.push(raw[i], raw[i + 1], raw[i + 2]);
            }
            leg.footSamples = new Float32Array(keep);
          }
        }

        /**
         * 將目前姿勢角度套用至所有關節與接觸陰影
         */
        _applyJointAngles() {
          const p = this.pose;
          const bounce = safeNum(p.pelvisBounceY, 0);

          this.pelvisGroup.position.set(0, this.BASE_PELVIS_Y + bounce, 0);
          this.pelvisGroup.rotation.set(
            degToRad(safeNum(p.pelvisRotX, 0)),
            0,
            degToRad(safeNum(p.pelvisRotZ, 0))
          );

          const shadowScale = clamp(1.0 - bounce * 0.75, 0.65, 1.15);
          this.contactShadow.scale.setScalar(shadowScale);
          this.shadowMat.opacity = clamp(((this.isImage ? 0.25 : 0.62) - bounce * 0.5) * this._opacity, 0.03, 0.72);

          this.torsoGroup.rotation.set(
            degToRad(safeNum(p.torsoX, 0)),
            degToRad(safeNum(p.torsoY, 0)),
            degToRad(safeNum(p.torsoZ, 0))
          );
          this.headGroup.rotation.set(
            degToRad(safeNum(p.headX, 0)),
            degToRad(safeNum(p.headY, 0)),
            degToRad(safeNum(p.headZ, 0))
          );

          this.leftArm.shoulderJoint.rotation.set(
            degToRad(safeNum(p.lShoulderX, 0)),
            degToRad(safeNum(p.lShoulderY, 0)),
            degToRad(safeNum(p.lShoulderZ, 8))
          );
          this.leftArm.elbowJoint.rotation.x = degToRad(safeNum(p.lElbowX, -10));

          this.rightArm.shoulderJoint.rotation.set(
            degToRad(safeNum(p.rShoulderX, 0)),
            degToRad(safeNum(p.rShoulderY, 0)),
            degToRad(safeNum(p.rShoulderZ, -8))
          );
          this.rightArm.elbowJoint.rotation.x = degToRad(safeNum(p.rElbowX, -10));

          this.leftLeg.hipJoint.rotation.set(
            degToRad(safeNum(p.lHipX, 0)),
            degToRad(safeNum(p.lHipY, 0)),
            degToRad(safeNum(p.lHipZ, 3))
          );
          this.leftLeg.kneeJoint.rotation.x = degToRad(safeNum(p.lKneeX, 0));
          this.leftLeg.ankleJoint.rotation.x = degToRad(safeNum(p.lAnkleX, 0));

          this.rightLeg.hipJoint.rotation.set(
            degToRad(safeNum(p.rHipX, 0)),
            degToRad(safeNum(p.rHipY, 0)),
            degToRad(safeNum(p.rHipZ, -3))
          );
          this.rightLeg.kneeJoint.rotation.x = degToRad(safeNum(p.rKneeX, 0));
          this.rightLeg.ankleJoint.rotation.x = degToRad(safeNum(p.rAnkleX, 0));
        }

        /**
         * 設定是否鎖定位置進入「手動拖曳姿勢模式」（不顯示任何浮動點，直接拖曳肢體或地面圓圈）
         */
        setPositionLocked(locked) {
          this.isPoseLocked = Boolean(locked);
          if (this.isPoseLocked) {
            this.joyInput.x = 0;
            this.joyInput.y = 0;
            this.smoothedThrust = 0;
            this.stepState.active = false;
            this.activeBasePose = pickPose(this.pose);
            this._lastDir.set(0, 0);
          }
          this._updateGroundHandleAppearance();
        }

        /**
         * 觸發一次 0.24 秒的單步跨步（世界座標方向）
         * 側向跨步由移動方向那一側的腳先出；前後步則左右交替
         */
        step(dirX, dirZ, stepDistance = 0.25 * this.unitScale) {
          if (this.isPoseLocked) return false;
          const mag = Math.hypot(dirX, dirZ);
          if (!Number.isFinite(mag) || mag < 1e-5) return false;
          const nx = dirX / mag;
          const nz = dirZ / mag;
          const p = this.root.position;
          const wb = this.worldBounds;
          const ss = this.stepState;

          this.isTransitioningPreset = false;
          this.targetPreset = null;
          ss.active = true;
          ss.elapsed = 0;
          ss.duration = 0.24;
          ss.startPos.copy(p);
          ss.targetPos.set(clamp(p.x + nx * stepDistance, -wb, wb), p.y, clamp(p.z + nz * stepDistance, -wb, wb));
          ss.dirX = nx;
          ss.dirZ = nz;

          const yaw = this.root.rotation.y;
          const side = this.moveMode === 'strafe' ? nx * Math.cos(yaw) - nz * Math.sin(yaw) : 0;
          ss.stepSign = Math.abs(side) > 0.5 ? (side > 0 ? 1 : -1) : -ss.stepSign;
          return true;
        }

        // =======================================================================
        // 數學防溢位 2-Bone IK 核心解算器 (solveTwoBoneIK / solveArmIK / solveLegIK)
        // =======================================================================
        solveTwoBoneIK({
          parentGroup,
          rootJoint,
          L1,
          L2,
          targetWorldPos,
          poleHint,
          bendSign,
          minMidRad,
          maxMidRad
        }) {
          if (!parentGroup || !rootJoint || !targetWorldPos || !poleHint) return null;
          if (![targetWorldPos.x, targetWorldPos.y, targetWorldPos.z].every(Number.isFinite)) {
            return null;
          }

          parentGroup.updateMatrixWorld(true);
          const rootLocal = rootJoint.position.clone();
          const targetLocal = parentGroup.worldToLocal(targetWorldPos.clone());
          const toTarget = targetLocal.sub(rootLocal);

          const lenSq = toTarget.lengthSq();
          if (!Number.isFinite(lenSq) || lenSq < 1e-8) return null;

          const rawDist = Math.sqrt(lenSq);
          const targetDir = toTarget.clone().divideScalar(rawDist);

          const maxReach = (L1 + L2) * 0.999; // 原 0.992 使伸直的腿仍至少彎 15°
          const minReach = Math.abs(L1 - L2) + 0.08;
          const dist = clamp(rawDist, minReach, maxReach);

          // 余弦定理求近端偏角 alpha 與中關節內角 beta（嚴格 clamp 至 [-0.9999, 0.9999] 杜絕 NaN）
          const cosAlpha = Math.max(
            -0.9999,
            Math.min(0.9999, (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist))
          );
          const alpha = Math.acos(cosAlpha);

          const cosBeta = Math.max(
            -0.9999,
            Math.min(0.9999, (L1 * L1 + L2 * L2 - dist * dist) / (2 * L1 * L2))
          );
          const beta = Math.acos(cosBeta);

          // bendSign = -1 時手肘向前彎（局部繞 X 負轉）；bendSign = +1 時膝蓋向後彎（局部繞 X 正轉）
          const midBendRad = clamp(bendSign * (Math.PI - beta), minMidRad, maxMidRad);

          // 將極向量投影至垂直於 targetDir 的平面，防止共線退化
          const hintUnit = safeNormalize(poleHint.clone(), new THREE.Vector3(0, 0, 1));
          const polePerp = hintUnit.clone().addScaledVector(targetDir, -hintUnit.dot(targetDir));
          if (polePerp.lengthSq() < 1e-8) {
            const fallbackAxis = Math.abs(targetDir.x) < 0.9
              ? new THREE.Vector3(1, 0, 0)
              : new THREE.Vector3(0, 0, 1);
            polePerp.crossVectors(fallbackAxis, targetDir);
          }
          safeNormalize(polePerp, new THREE.Vector3(0, 0, 1));

          // 計算近端骨骼（上臂或大腿）單位方向向量
          const unitUpperDir = targetDir
            .clone()
            .multiplyScalar(Math.cos(alpha))
            .addScaledVector(polePerp, Math.sin(alpha));
          safeNormalize(unitUpperDir, targetDir);

          // 建構近端關節正交基底矩陣：
          // -Y 軸沿骨骼向下延伸至中關節；+Z 軸對齊中關節彎曲參考面
          const yAxis = unitUpperDir.clone().negate();
          const zAxis = bendSign < 0 ? polePerp.clone().negate() : polePerp.clone();
          zAxis.addScaledVector(yAxis, -zAxis.dot(yAxis));
          if (zAxis.lengthSq() < 1e-8) {
            zAxis.set(0, 0, 1).addScaledVector(yAxis, -yAxis.z);
          }
          safeNormalize(zAxis, new THREE.Vector3(0, 0, 1));

          const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis);
          if (xAxis.lengthSq() < 1e-8) {
            xAxis.set(1, 0, 0);
          }
          safeNormalize(xAxis, new THREE.Vector3(1, 0, 0));

          zAxis.crossVectors(xAxis, yAxis);
          safeNormalize(zAxis, new THREE.Vector3(0, 0, 1));

          const rotMatrix = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
          const euler = new THREE.Euler().setFromRotationMatrix(rotMatrix, 'XYZ');

          const rootXDeg = radToDeg(euler.x);
          const rootYDeg = radToDeg(euler.y);
          const rootZDeg = radToDeg(euler.z);
          const midXDeg = radToDeg(midBendRad);

          if (![rootXDeg, rootYDeg, rootZDeg, midXDeg].every(Number.isFinite)) {
            return null;
          }

          return { rootXDeg, rootYDeg, rootZDeg, midXDeg };
        }

        /**
         * 套用姿勢：預設名稱（'stand' | 'raiseRight' | 'pointForward' | 'runFreeze' | 'thinker' | 'martial'）
         * 或部分姿勢物件（例：{ rShoulderZ: -90 }，只覆寫給定的關節，單位：度）
         */
        setPose(presetOrPose, immediate = false) {
          let src = presetOrPose;
          let base = this.pose;
          if (typeof presetOrPose === 'string') {
            const name = WoodenMannequin.POSE_ALIASES[presetOrPose] || presetOrPose;
            src = WoodenMannequin.PRESETS[name];
            base = WoodenMannequin.PRESETS.stand;
          }
          if (!src || typeof src !== 'object') return false;
          const target = copyPose(pickPose(base), src);
          this.stepState.active = false;
          this.activeBasePose = target;
          if (immediate) {
            this.isTransitioningPreset = false;
            this.targetPreset = null;
            this.pose = pickPose(target);
            this.applyPoseToRig();
          } else {
            this.targetPreset = pickPose(target);
            this.isTransitioningPreset = true;
          }
          return true;
        }

        /** 取得目前姿勢的複本（度） */
        getPose() {
          return pickPose(this.pose);
        }

        /**
         * 在關節限制下解 2-Bone IK：繞「根→目標」軸旋轉極向量取樣多組解，
         * 選違反限制最少且最接近預設手肘/膝蓋朝向者（解決跨身體對側目標無法到達）
         */
        _solveLimbWithLimits(cfg, eulerLimits, midLimits) {
          const parent = cfg.parentGroup;
          parent.updateMatrixWorld(true);
          const axis = parent.worldToLocal(cfg.targetWorldPos.clone()).sub(cfg.rootJoint.position);
          if (!(axis.lengthSq() > 1e-8)) return null;
          axis.normalize();
          let best = null;
          for (const deg of [0, 25, -25, 50, -50, 80, -80, 115, -115, 150, -150, 180]) {
            const res = this.solveTwoBoneIK({ ...cfg, poleHint: cfg.poleHint.clone().applyAxisAngle(axis, degToRad(deg)) });
            if (!res) continue;
            const e = pickEuler(res.rootXDeg, res.rootYDeg, res.rootZDeg, eulerLimits);
            const mid = clamp(res.midXDeg, midLimits[0], midLimits[1]);
            const score = e.viol + Math.abs(mid - res.midXDeg) + Math.abs(deg) * 0.02;
            if (!best || score < best.score) best = { score, x: e[0], y: e[1], z: e[2], mid };
            if (deg === 0 && score < 1e-6) break;
          }
          return best;
        }
        /**
         * 手臂 2-Bone IK：讓手腕到達 targetWorldPos
         */
        solveArmIK(side, targetWorldPos) {
          const isLeft = side === 'L';
          const arm = isLeft ? this.leftArm : this.rightArm;
          if (!arm) return false;
          const LIM = WoodenMannequin.JOINT_LIMITS;
          const res = this._solveLimbWithLimits({
            parentGroup: this.torsoGroup,
            rootJoint: arm.shoulderJoint,
            L1: this.UPPER_ARM_LEN,
            L2: this.FOREARM_LEN,
            targetWorldPos,
            poleHint: new THREE.Vector3(isLeft ? 0.45 : -0.45, -0.25, -0.85),
            bendSign: -1,
            minMidRad: -Math.PI,
            maxMidRad: 0
          }, isLeft ? LIM.lShoulder : LIM.rShoulder, LIM.elbow);
          if (!res) return false;
          const pre = isLeft ? 'l' : 'r';
          this.pose[`${pre}ShoulderX`] = res.x;
          this.pose[`${pre}ShoulderY`] = res.y;
          this.pose[`${pre}ShoulderZ`] = res.z;
          this.pose[`${pre}ElbowX`] = res.mid;
          this.applyPoseToRig();
          return true;
        }

        /**
         * 腿部 2-Bone IK：讓腳踝到達 targetWorldPos，並依 footFlatten（0~1）讓腳掌回到水平
         */
        solveLegIK(side, targetWorldPos, footFlatten = this.footFlatten) {
          const isLeft = side === 'L';
          const leg = isLeft ? this.leftLeg : this.rightLeg;
          if (!leg) return false;
          const LIM = WoodenMannequin.JOINT_LIMITS;
          const res = this._solveLimbWithLimits({
            parentGroup: this.pelvisGroup,
            rootJoint: leg.hipJoint,
            L1: this.THIGH_LEN,
            L2: this.CALF_LEN,
            targetWorldPos,
            poleHint: new THREE.Vector3(isLeft ? 0.28 : -0.28, 0.0, 0.95),
            bendSign: 1,
            minMidRad: 0,
            maxMidRad: Math.PI
          }, isLeft ? LIM.lHip : LIM.rHip, LIM.knee);
          if (!res) return false;
          const pre = isLeft ? 'l' : 'r';
          const p = this.pose;
          p[`${pre}HipX`] = res.x;
          p[`${pre}HipY`] = res.y;
          p[`${pre}HipZ`] = res.z;
          p[`${pre}KneeX`] = res.mid;
          p[`${pre}AnkleX`] = 0;
          this._applyJointAngles();

          // 求腳踝繞 X 角 a，使腳掌前向在人偶座標系中保持水平：tan a = R[1][2] / R[1][1]
          this.root.updateMatrixWorld(true);
          const e = this._tmpM.copy(this.root.matrixWorld).invert().multiply(leg.kneeJoint.matrixWorld).elements;
          const flat = radToDeg(Math.atan2(e[9], e[5]));
          p[`${pre}AnkleX`] = clamp(flat * clamp(safeNum(footFlatten, 1), 0, 1), -80, 60);
          this.applyPoseToRig();
          return true;
        }

        /**
         * 計算行走、跑步與橫移的混合關節步態（preserveUpper 為 true 時保留上半身基準姿勢）
         */
        _computeLocomotionPose(fwdRatio, sideRatio, runRatio, sinP, cosP, preserveUpper = false) {
          const base = this.activeBasePose || WoodenMannequin.PRESETS.raiseRight;
          const absFwd = Math.abs(fwdRatio);
          const absSide = Math.abs(sideRatio);
          const activity = clamp(Math.hypot(fwdRatio, sideRatio), 0, 1);

          // 大腿前後擺幅與側向開合（側向僅向外側打開，避免左右腿交叉穿模）
          const legSwingAmp = 34 * fwdRatio + 24 * runRatio * fwdRatio;
          const sideStepAmp = 24 * absSide;
          const stepOutL = Math.max(0, sinP) * sideStepAmp;
          const stepOutR = Math.max(0, -sinP) * sideStepAmp;

          const lHipX = -sinP * legSwingAmp;
          const rHipX = sinP * legSwingAmp;
          const lHipZ = 3 + stepOutL;
          const rHipZ = -3 - stepOutR;
          const lHipY = sinP * 4 * fwdRatio;
          const rHipY = -sinP * 4 * fwdRatio;

          // 膝蓋抬腿彎曲與腳踝防穿地補償
          const kneeLiftAmp = 44 * absFwd + 42 * runRatio * absFwd;
          const lKneeX = Math.max(0, cosP) * kneeLiftAmp + stepOutL * 1.15;
          const rKneeX = Math.max(0, -cosP) * kneeLiftAmp + stepOutR * 1.15;
          const lAnkleX = clamp(-lKneeX * 0.25 - lHipX * 0.12, -28, 22);
          const rAnkleX = clamp(-rKneeX * 0.25 - rHipX * 0.12, -28, 22);

          // 骨盆垂直彈跳與微幅搖擺
          const pelvisBounceY = Math.abs(sinP) * (0.025 + runRatio * 0.065) * activity;
          const pelvisRotX = 2 * activity + runRatio * 5 * Math.max(0, fwdRatio);
          const pelvisRotZ = -sinP * (2.2 * absFwd + 2.5 * sideRatio);

          if (preserveUpper) {
            const sway = sinP * 2.5 * activity;
            return {
              pelvisBounceY,
              pelvisRotX,
              pelvisRotZ,
              headX: safeNum(base.headX, 0) - pelvisRotX * 0.5,
              headY: safeNum(base.headY, 0),
              headZ: safeNum(base.headZ, 0) - pelvisRotZ * 0.5,
              torsoX: safeNum(base.torsoX, 0) + 1.5 * activity,
              torsoY: safeNum(base.torsoY, 0) + sway,
              torsoZ: safeNum(base.torsoZ, 0) - pelvisRotZ * 0.6,
              lShoulderZ: safeNum(base.lShoulderZ, 12) + stepOutL * 0.35,
              lShoulderX: safeNum(base.lShoulderX, 0) + sway * 1.2,
              lShoulderY: safeNum(base.lShoulderY, 0),
              lElbowX: safeNum(base.lElbowX, -16),
              rShoulderZ: safeNum(base.rShoulderZ, -12) - stepOutR * 0.35,
              rShoulderX: safeNum(base.rShoulderX, 0) - sway * 1.2,
              rShoulderY: safeNum(base.rShoulderY, 0),
              rElbowX: safeNum(base.rElbowX, -16),
              lHipX,
              lHipZ,
              lHipY,
              lKneeX,
              lAnkleX,
              rHipX,
              rHipZ,
              rHipY,
              rKneeX,
              rAnkleX
            };
          }

          // 轉向走跑或全速衝刺時：雙臂與雙腿自然交叉擺動
          const armSwingAmp = 28 * fwdRatio + 28 * runRatio * fwdRatio;
          const elbowBase = -18 - runRatio * 68;
          const torsoTwist = sinP * (7 + runRatio * 7) * fwdRatio;
          const forwardLean = 3 * absFwd + runRatio * 14 * Math.max(0, fwdRatio);

          return {
            pelvisBounceY,
            pelvisRotX,
            pelvisRotZ,
            headX: -forwardLean * 0.55,
            headY: -torsoTwist * 0.45,
            headZ: -pelvisRotZ * 0.4,
            torsoX: forwardLean,
            torsoY: torsoTwist,
            torsoZ: -pelvisRotZ * 0.65,
            lShoulderZ: 10 + runRatio * 5 + stepOutL * 0.45,
            lShoulderX: sinP * armSwingAmp,
            lShoulderY: 0,
            lElbowX: elbowBase - Math.max(0, -sinP) * 18 * runRatio,
            rShoulderZ: -10 - runRatio * 5 - stepOutR * 0.45,
            rShoulderX: -sinP * armSwingAmp,
            rShoulderY: 0,
            rElbowX: elbowBase - Math.max(0, sinP) * 18 * runRatio,
            lHipX,
            lHipZ,
            lHipY,
            lKneeX,
            lAnkleX,
            rHipX,
            rHipZ,
            rHipY,
            rKneeX,
            rAnkleX
          };
        }


        /** 計算人偶自身座標的移動速度，交給擴充模組做次級擺動 */
        _updateSecondaryDynamics(dt, elapsed) {
          const safeDt = clamp(dt, 0.001, 0.05);
          const worldVx = clamp((this.root.position.x - this._prevWorldPos.x) / safeDt / this.unitScale, -6, 6);
          const worldVz = clamp((this.root.position.z - this._prevWorldPos.z) / safeDt / this.unitScale, -6, 6);
          this._prevWorldPos.copy(this.root.position);
          const yaw = this.root.rotation.y;
          const mo = this.motion;
          mo.localFwdVel = worldVx * Math.sin(yaw) + worldVz * Math.cos(yaw);
          mo.localSideVel = worldVx * Math.cos(yaw) - worldVz * Math.sin(yaw);
          mo.speed = Math.hypot(mo.localFwdVel, mo.localSideVel);
          mo.elapsed = elapsed;
          mo.dt = safeDt;
          for (const addon of this.addons) if (addon.update) addon.update(safeDt, mo);
        }

        /**
         * 每幀更新：搖桿走跑、單步、地面拖曳步行、姿勢過渡與次級擺動
         * @param {number} dt 秒（內部會再 clamp 到 0.05）
         * @param {number} cameraAzimuth OrbitControls.getAzimuthalAngle()，讓搖桿方向跟隨鏡頭
         * @param {number} [elapsed] 累計秒數；省略時內部自行累計
         * @returns {{stateLabel: string, thrustPercent: number}} 重複使用的狀態物件
         */
        update(dt, cameraAzimuth = 0, elapsed) {
          dt = clamp(safeNum(dt, 0), 0, 0.05);
          this._time = Number.isFinite(elapsed) ? elapsed : this._time + dt;
          const st = this._status;
          const done = (label, pct) => {
            st.stateLabel = label;
            st.thrustPercent = pct;
            this._updateSecondaryDynamics(dt, this._time);
            return st;
          };
          const us = this.unitScale;

          this.externalDragVel.multiplyScalar(Math.exp(-14 * dt));
          if (this.externalDragVel.lengthSq() < 1e-4 * us * us) this.externalDragVel.set(0, 0);

          const jx = safeNum(this.joyInput.x, 0);
          const jy = safeNum(this.joyInput.y, 0);
          const rawThrust = clamp(Math.hypot(jx, jy), 0, 1);
          const isJoyActive = !this.isPoseLocked && rawThrust > 0.02;
          // 修正：先判斷搖桿再處理姿勢過渡（原版過渡期間約 0.7 秒搖桿完全無反應）
          if (isJoyActive) {
            this.stepState.active = false;
            this.isTransitioningPreset = false;
            this.targetPreset = null;
          }

          if (this.isTransitioningPreset && this.targetPreset) {
            const maxDiff = blendPose(this.pose, this.targetPreset, 1 - Math.exp(-10 * dt));
            if (maxDiff < 0.05) {
              copyPose(this.pose, this.targetPreset);
              this.isTransitioningPreset = false;
              this.targetPreset = null;
            }
            this.applyPoseToRig();
            return done('姿勢過渡', 0);
          }

          if (this.isPoseLocked) {
            return done(this.isGroundDragging ? '地面平移' : '已鎖定', 0);
          }

          // 1. 單步跨步
          if (this.stepState.active) {
            const ss = this.stepState;
            ss.elapsed += dt;
            const u = clamp(ss.elapsed / ss.duration, 0, 1);
            const easePos = u * u * (3 - 2 * u);
            // 只動 x/z：原版 lerpVectors 會把 root.position.y 強制歸零
            this.root.position.x = ss.startPos.x + (ss.targetPos.x - ss.startPos.x) * easePos;
            this.root.position.z = ss.startPos.z + (ss.targetPos.z - ss.startPos.z) * easePos;

            let fwdRatio = 1;
            let sideRatio = 0;
            if (this.moveMode === 'turn') {
              const targetYaw = Math.atan2(ss.dirX, ss.dirZ);
              this.root.rotation.y = shortestAngleLerp(this.root.rotation.y, targetYaw, 1 - Math.exp(-18 * dt));
            } else {
              const yaw = this.root.rotation.y;
              fwdRatio = ss.dirX * Math.sin(yaw) + ss.dirZ * Math.cos(yaw);
              sideRatio = ss.dirX * Math.cos(yaw) - ss.dirZ * Math.sin(yaw);
            }
            // 修正：抬膝波形也要乘上 stepSign，左右腳才會輪流抬起（原版永遠只抬右膝）
            const wave = Math.sin(u * Math.PI) * ss.stepSign;
            const stepPose = this._computeLocomotionPose(fwdRatio * 0.85, sideRatio * 0.95, 0, wave, wave, true);
            blendPose(this.pose, stepPose, 1 - Math.exp(-22 * dt));
            if (u >= 1) {
              ss.active = false; // 結束後交給下方「靜止」分支平滑回到基準姿勢（原版瞬間跳回）
              this._idleSettled = false;
            }
            this.applyPoseToRig();
            return done('單步跨步', 25);
          }

          // 2. 地面圓圈拖曳時的自然小步走動
          const extSpeed = this.externalDragVel.length() / us;
          if (!isJoyActive && (this.isGroundDragging || extSpeed > 0.05)) {
            const dragThrust = clamp(extSpeed / 3.8, 0, 0.48);
            this.smoothedThrust += (dragThrust - this.smoothedThrust) * (1 - Math.exp(-12 * dt));
            if (this.smoothedThrust > 0.02 && extSpeed > 0.04) {
              const nx = this.externalDragVel.x / (extSpeed * us);
              const nz = this.externalDragVel.y / (extSpeed * us);
              let fwdRatio = this.smoothedThrust;
              let sideRatio = 0;
              if (this.moveMode === 'turn') {
                this.root.rotation.y = shortestAngleLerp(this.root.rotation.y, Math.atan2(nx, nz), 1 - Math.exp(-10 * dt));
              } else {
                const yaw = this.root.rotation.y;
                fwdRatio = (nx * Math.sin(yaw) + nz * Math.cos(yaw)) * this.smoothedThrust;
                sideRatio = (nx * Math.cos(yaw) - nz * Math.sin(yaw)) * this.smoothedThrust;
              }
              this.gaitPhase += dt * (4.5 + this.smoothedThrust * 9.0);
              const walkGait = this._computeLocomotionPose(fwdRatio, sideRatio, 0, Math.sin(this.gaitPhase), Math.cos(this.gaitPhase), true);
              blendPose(this.pose, walkGait, 1 - Math.exp(-16 * dt));
              this.applyPoseToRig();
            } else if (this.autoResetPose) {
              blendPose(this.pose, this.activeBasePose, 1 - Math.exp(-10 * dt));
              this.applyPoseToRig();
            }
            this._idleSettled = false;
            return done('地面拖移', Math.round(this.smoothedThrust * 100));
          }

          // 3. 搖桿推力平滑
          this.smoothedThrust += (rawThrust - this.smoothedThrust) * (1 - Math.exp(-10 * dt));
          if (!isJoyActive && this.smoothedThrust < 0.015) {
            this.smoothedThrust = 0;
            if (this.autoResetPose) {
              const diff = blendPose(this.pose, this.activeBasePose, 1 - Math.exp(-9 * dt));
              // 已收斂就不再每幀重算骨架與貼地
              if (diff > 1e-3 || !this._idleSettled) {
                this.applyPoseToRig();
                this._idleSettled = diff <= 1e-3;
              }
              return done('靜止', 0);
            }
            return done('定格步伐', 0);
          }
          this._idleSettled = false;

          // 4. 1–50% 慢走 → 51–100% 快跑（無段）
          const t = this.smoothedThrust;
          const walkRatio = clamp(t / 0.5, 0, 1);
          const runRatio = clamp((t - 0.5) / 0.5, 0, 1);
          const moveSpeed = (walkRatio * 1.85 + runRatio * 2.95) * us;

          if (isJoyActive) {
            const cosA = Math.cos(cameraAzimuth);
            const sinA = Math.sin(cameraAzimuth);
            const wx = jx * cosA - jy * sinA;
            const wz = -jx * sinA - jy * cosA;
            const mag = Math.hypot(wx, wz);
            if (mag > 1e-5) this._lastDir.set(wx / mag, wz / mag);
          }
          // 放開搖桿後沿最後方向減速滑行（原版原地踏步、位置與步態脫節）
          const nx = this._lastDir.x;
          const nz = this._lastDir.y;
          const wb = this.worldBounds;
          this.root.position.x = clamp(this.root.position.x + nx * moveSpeed * dt, -wb, wb);
          this.root.position.z = clamp(this.root.position.z + nz * moveSpeed * dt, -wb, wb);

          let fwdRatio = t;
          let sideRatio = 0;
          if (this.moveMode === 'turn') {
            if (isJoyActive && (nx !== 0 || nz !== 0)) {
              this.root.rotation.y = shortestAngleLerp(this.root.rotation.y, Math.atan2(nx, nz), 1 - Math.exp(-12 * dt));
            }
          } else {
            const yaw = this.root.rotation.y;
            fwdRatio = (nx * Math.sin(yaw) + nz * Math.cos(yaw)) * t;
            sideRatio = (nx * Math.cos(yaw) - nz * Math.sin(yaw)) * t;
          }

          this.gaitPhase += dt * (4.6 + walkRatio * 3.0 + runRatio * 7.2);
          const preserveUpper = this.moveMode === 'strafe' && runRatio < 0.25;
          const targetGait = this._computeLocomotionPose(fwdRatio, sideRatio, runRatio, Math.sin(this.gaitPhase), Math.cos(this.gaitPhase), preserveUpper);
          blendPose(this.pose, targetGait, 1 - Math.exp(-14 * dt));
          this.applyPoseToRig();

          const pct = Math.round(rawThrust * 100);
          return done(isJoyActive ? (pct <= 50 ? '慢走' : '快跑') : '減速', pct);
        }

        /**
         * 拾取清單：只回傳「整條祖先鏈都可見」的肢體/服裝/頭髮網格。
         * 原版只檢查網格自身 visible，隱藏髮型與披風仍會攔截點擊（站姿 36 個可見網格卻有 76 個可被點到）。
         */
        getPickTargets(includeGround = false) {
          if (this._pickDirty || !this._pickCache) {
            const list = [];
            for (const m of this.interactiveMeshes) {
              let o = m;
              let vis = true;
              while (o && o !== this.root) {
                if (!o.visible) {
                  vis = false;
                  break;
                }
                o = o.parent;
              }
              if (vis) list.push(m);
            }
            this._pickCache = list;
            this._pickCacheWithGround = this.groundHandle && this.groundHandle.visible ? list.concat(this.groundMeshes) : list;
            this._pickDirty = false;
          }
          return includeGround ? this._pickCacheWithGround : this._pickCache;
        }

        /** 高亮某個部位（partId，如 'head'、'LHand'；傳 null 取消） */
        setHighlight(partId) {
          if (this._highlightId === partId) return;
          this._highlightId = partId || null;
          for (const ov of this._highlightOverlays) ov.visible = false;
          this._highlightOverlays.length = 0;
          if (!partId) return;
          for (const mesh of this.partGroupsMap[partId] || []) {
            let ov = mesh.userData._hl;
            if (!ov) {
              ov = new THREE.Mesh(mesh.geometry, this._highlightMat);
              ov.scale.setScalar(1.015);
              ov.renderOrder = 2;
              ov.raycast = () => {};
              mesh.add(ov);
              mesh.userData._hl = ov;
            }
            ov.visible = true;
            this._highlightOverlays.push(ov);
          }
        }

        setGroundHandleVisible(visible) {
          if (!this.groundHandle) return;
          this.groundHandle.visible = Boolean(visible);
          this._pickDirty = true;
        }

        /** 人偶站立高度（世界單位，不含成像縮放） */
        getHeight() {
          return this.targetHeight;
        }

        /**
         * 取得身體錨點的世界座標（光學模擬可用 headTop 當物高頂點、eyes 當視線起點）
         * @param {string} name 見 WoodenMannequin.ANCHORS
         */
        getWorldAnchor(name, target = new THREE.Vector3()) {
          const la = this.leftArm;
          const ra = this.rightArm;
          const ll = this.leftLeg;
          const rl = this.rightLeg;
          const A = {
            headTop: [this.headGroup, 0, 0.6, 0.02],
            eyes: [this.headGroup, 0, 0.3, 0.17],
            head: [this.headGroup, 0, 0.3, 0],
            chest: [this.torsoGroup, 0, 0.6, 0],
            pelvis: [this.pelvisGroup, 0, 0, 0],
            handL: [la.wristJoint, 0, -0.22, 0],
            handR: [ra.wristJoint, 0, -0.22, 0],
            wristL: [la.wristJoint, 0, 0, 0],
            wristR: [ra.wristJoint, 0, 0, 0],
            footL: [ll.ankleJoint, 0, 0, 0],
            footR: [rl.ankleJoint, 0, 0, 0],
            toeL: [ll.ankleJoint, 0, -0.1, 0.32],
            toeR: [rl.ankleJoint, 0, -0.1, 0.32]
          };
          const a = A[name];
          if (!a) return null;
          a[0].updateWorldMatrix(true, false);
          return a[0].localToWorld(target.set(a[1], a[2], a[3]));
        }

        /** 從場景移除並釋放此實例獨有的材質與幾何（共用資源請用 WoodenMannequin.disposeShared()） */
        dispose() {
          if (this.root.parent) this.root.parent.remove(this.root);
          for (const addon of this.addons.splice(0)) if (addon.dispose) addon.dispose();
          this.woodMat.dispose();
          this.jointMat.dispose();
          this.shadowMat.dispose();
          this._highlightMat.dispose();
          [this.groundDiscMat, this.groundRingMat, this.groundInnerMat].forEach((m) => m && m.dispose());
          this.ownedGeometries.forEach((g) => g && typeof g.dispose === 'function' && g.dispose());
          this.ownedGeometries = [];
          this.interactiveMeshes = [];
          this.partGroupsMap = {};
          this._pickCache = null;
