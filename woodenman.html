<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>woodenman v3</title>

  <!-- Tailwind CSS CDN（僅用於外層工作台 UI 排版；核心 WoodenMannequinSkill 類別 100% 獨立無依賴） -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 字體設定 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 42%, #2c241d 0%, #1b1510 58%, #100c09 100%);
      color: #f5f0eb;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    /* 隱藏水平捲動軸但保留小螢幕橫向滑動能力 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 虛擬搖桿立體質感與脈衝光暈 */
    #joystick-base {
      background: radial-gradient(circle at 35% 30%, rgba(41, 37, 36, 0.88), rgba(18, 15, 13, 0.94));
      box-shadow:
        inset 0 2px 10px rgba(0, 0, 0, 0.78),
        inset 0 0 0 1px rgba(251, 191, 36, 0.22),
        0 12px 30px rgba(0, 0, 0, 0.58);
      touch-action: none;
    }

    #joystick-knob {
      background: radial-gradient(circle at 32% 28%, #fbbf24 0%, #d97706 62%, #92400e 100%);
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.65),
        inset 0 1px 2px rgba(255, 255, 255, 0.55);
      will-change: transform;
      transition: transform 0.06s ease-out;
    }

    #joystick-knob.is-dragging {
      transition: none;
    }

    .joy-quadrant-pulse {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease-out;
    }

    .joy-quadrant-pulse.active {
      opacity: 1;
      transition: opacity 0.04s ease-in;
    }
  </style>

  <!-- Three.js r160 ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="text-stone-100 antialiased">
  <!-- 3D 渲染畫布容器 -->
  <div id="canvas-container"></div>

  <!-- ===================================================================== -->
  <!-- 頂部毛玻璃雙群組工具列（Tailwind CSS） -->
  <!-- ===================================================================== -->
  <header class="fixed top-3 left-3 right-3 z-30 pointer-events-none flex flex-wrap items-center justify-between gap-2">
    <!-- 左側群組：品牌標題、移動模式切換、鎖定擺姿勢、放開回站姿/定格切換 -->
    <div class="pointer-events-auto flex items-center gap-1.5 px-2.5 py-1.5 rounded-2xl bg-stone-950/85 backdrop-blur-md border border-amber-400/20 shadow-2xl max-w-full overflow-x-auto no-scrollbar">
      <!-- 品牌識別 -->
      <div class="flex items-center gap-2 pr-2.5 border-r border-white/10 shrink-0">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-500 to-amber-800 flex items-center justify-center text-white shadow-inner shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="5" r="2.5" />
            <path d="M9 10h6l-1 5h-4l-1-5z" />
            <path d="M9 10.5L5.5 14" />
            <path d="M15 10.5L18.5 14" />
            <path d="M10.5 15L9.5 21" />
            <path d="M13.5 15L14.5 21" />
          </svg>
        </div>
        <div class="hidden xl:block">
          <h1 class="text-xs font-bold text-amber-100 leading-tight">3D 木頭人偶 Skill 工作台</h1>
          <p class="text-[10px] text-stone-400 leading-tight">地面圓圈拖移・橫移/轉向・IK/FK 擺姿</p>
        </div>
      </div>

      <!-- 移動模式切換：橫移模式 vs 轉向模式 (快捷鍵 M) -->
      <div class="inline-flex items-center gap-0.5 p-0.5 rounded-xl bg-black/45 border border-white/10 shrink-0" role="group" aria-label="移動模式切換">
        <button type="button" id="btn-movemode-strafe" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white shadow transition" title="鎖定朝向不轉身，左右推側向跨步、前後推前進/後退 (快捷鍵 M)">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 9l-3 3 3 3" />
            <path d="M19 9l3 3-3 3" />
            <path d="M2 12h20" />
          </svg>
          <span>橫移模式 (M)</span>
        </button>
        <button type="button" id="btn-movemode-turn" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition" title="人偶自動轉向移動方向並走跑 (快捷鍵 M)">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          <span>轉向模式 (M)</span>
        </button>
      </div>

      <!-- 互動模式切換：自由移動 / 鎖定擺姿勢 (快捷鍵 L) -->
      <button type="button" id="btn-toggle-lock" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-white/15 bg-stone-800/90 hover:bg-stone-700 text-stone-200 text-xs font-semibold transition shrink-0" title="鎖定位置後可直接拖曳手腳 IK 控制球與身體關節，仍可拖拉地面圓圈移動 (快捷鍵 L)">
        <svg id="icon-lock-open" class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 9.9-1" />
        </svg>
        <svg id="icon-lock-closed" class="w-3.5 h-3.5 text-emerald-200 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <span id="label-lock-btn">自由移動 / 鎖定擺姿勢 (L)</span>
      </button>

      <!-- 放開搖桿行為切換：放開回基準姿勢 vs 放開定格當前步伐 -->
      <button type="button" id="btn-release-mode" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-white/10 bg-stone-800/80 hover:bg-stone-700 text-stone-300 hover:text-white text-xs font-semibold transition shrink-0" title="切換放開搖桿或停止拖曳時自動回到基準姿勢，或定格在當前步伐">
        <span id="label-release-mode">放開回基準姿勢</span>
      </button>
    </div>

    <!-- 右側群組：預設姿勢、外型裝扮、材質切換、復原/重做、鏡頭跟隨、視角與重設 -->
    <div class="pointer-events-auto flex items-center gap-1.5 px-2.5 py-1.5 rounded-2xl bg-stone-950/85 backdrop-blur-md border border-amber-400/20 shadow-2xl max-w-full overflow-x-auto no-scrollbar">
      <!-- 預設動作姿勢 -->
      <div class="inline-flex items-center gap-0.5 p-0.5 rounded-xl bg-black/45 border border-white/10 shrink-0" role="group" aria-label="預設動作姿勢">
        <button type="button" data-pose="raiseRight" class="quick-pose-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white shadow transition" title="右手高舉不對稱姿勢">右手高舉</button>
        <button type="button" data-pose="pointForward" class="quick-pose-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition" title="右手向前指物姿勢">向前指物</button>
        <button type="button" data-pose="stand" class="quick-pose-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition" title="標準自然站姿">標準站姿</button>
        <button type="button" data-pose="runFreeze" class="quick-pose-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition" title="動態跑步定格姿勢">跑步定格</button>
        <button type="button" data-pose="thinker" class="quick-pose-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition" title="沉思者姿勢">沉思者</button>
        <button type="button" data-pose="martial" class="quick-pose-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition" title="武術架勢">武術架勢</button>
      </div>

      <!-- 外型裝扮抽屜開關 (快捷鍵 C) -->
      <button type="button" id="btn-toggle-drawer" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-amber-400/35 bg-amber-600/25 hover:bg-amber-600/40 text-amber-200 text-xs font-bold transition shrink-0" title="展開或收合服裝、披風、髮型與髮色面板 (快捷鍵 C)">
        <svg class="w-3.5 h-3.5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z" />
        </svg>
        <span>外型裝扮 (C)</span>
      </button>

      <!-- 木紋材質切換：山毛櫸 / 黑胡桃木 -->
      <div class="inline-flex items-center gap-0.5 p-0.5 rounded-xl bg-black/45 border border-white/10 shrink-0" role="group" aria-label="木材質切換">
        <button type="button" data-wood="beech" class="wood-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white shadow transition">山毛櫸</button>
        <button type="button" data-wood="walnut" class="wood-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition">黑胡桃木</button>
      </div>

      <!-- 復原 / 重做 (Ctrl+Z / Ctrl+Y) -->
      <button type="button" id="btn-undo" disabled class="px-2.5 py-1.5 rounded-xl border border-white/10 bg-stone-800/85 hover:bg-stone-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold text-stone-200 transition shrink-0" title="復原上一個姿勢 (Ctrl+Z)">復原</button>
      <button type="button" id="btn-redo" disabled class="px-2.5 py-1.5 rounded-xl border border-white/10 bg-stone-800/85 hover:bg-stone-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold text-stone-200 transition shrink-0" title="重做姿勢 (Ctrl+Y)">重做</button>

      <div class="w-px h-5 bg-white/15 mx-0.5 shrink-0"></div>

      <!-- 鏡頭跟隨開關 -->
      <label class="inline-flex items-center gap-2 px-2.5 py-1 rounded-xl bg-black/45 border border-white/10 text-xs font-semibold text-stone-300 cursor-pointer shrink-0" title="搖桿移動時鏡頭自動跟隨人偶（拖曳地面圓圈時保持鏡頭穩定以便對齊刻度）">
        <span>鏡頭跟隨</span>
        <input id="opt-follow-cam" type="checkbox" checked class="sr-only peer" />
        <span class="relative w-7 h-4 rounded-full bg-stone-700 peer-checked:bg-amber-600 transition after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-3 after:h-3 after:rounded-full after:bg-white after:transition peer-checked:after:translate-x-3"></span>
      </label>

      <!-- 視角快速切換 -->
      <div class="inline-flex items-center gap-0.5 p-0.5 rounded-xl bg-black/45 border border-white/10 shrink-0" role="group" aria-label="攝影機視角">
        <button type="button" data-cam="classic" class="cam-preset-btn px-2 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white shadow transition">45° 經典</button>
        <button type="button" data-cam="front" class="cam-preset-btn px-2 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition">正面</button>
        <button type="button" data-cam="side" class="cam-preset-btn px-2 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition">側面</button>
        <button type="button" data-cam="back" class="cam-preset-btn px-2 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white hover:bg-white/10 transition">背面</button>
      </div>

      <!-- 重設回到原點 -->
      <button type="button" id="btn-reset-all" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl border border-amber-400/30 bg-stone-800/90 hover:bg-stone-700 text-amber-200 text-xs font-semibold transition shrink-0" title="重設人偶至原點 (0, 0) 與預設姿勢">
        <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        <span>重設</span>
      </button>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- 左下角：零誤觸虛擬搖桿（連續拖曳走跑 ＋ 四象限輕點單步跨步） -->
  <!-- ===================================================================== -->
  <section class="fixed bottom-4 left-4 z-20 flex flex-col items-start gap-2" aria-label="虛擬搖桿走跑與單步控制器">
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-stone-950/85 backdrop-blur-md border border-amber-400/20 shadow-xl">
      <span id="gait-badge" class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-stone-700 text-stone-200 transition">靜止</span>
      <span class="font-mono text-xs font-semibold text-amber-300">推力 <span id="thrust-percent">0%</span></span>
      <span class="hidden sm:inline text-[10.5px] text-stone-400">｜輕點跨步・拖曳走跑・或直接拖拉腳下圓圈</span>
    </div>

    <div id="joy-slot"></div>
  </section>

  <!-- ===================================================================== -->
  <!-- 右側可收合：外型裝扮抽屜（服裝、披風、髮型、髮色） -->
  <!-- ===================================================================== -->
  <aside id="appearance-drawer" class="fixed top-20 right-3 z-20 w-72 max-w-[calc(100vw-1.5rem)] max-h-[calc(100vh-14.5rem)] overflow-y-auto no-scrollbar rounded-2xl bg-stone-950/88 backdrop-blur-md border border-amber-400/20 shadow-2xl p-3.5 flex flex-col gap-3 transition-all duration-200" aria-label="外型裝扮面板">
    <div class="flex items-center justify-between border-b border-white/10 pb-2">
      <div class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-400"></span>
        <h2 class="text-xs font-bold text-amber-100 tracking-wide">人偶外型裝扮</h2>
      </div>
      <button type="button" id="btn-close-drawer" class="text-[11px] text-stone-400 hover:text-white px-1.5 py-0.5 rounded-lg hover:bg-white/10 transition" title="收合面板 (C)">收合 ✕</button>
    </div>

    <!-- 1. 服裝款式 -->
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-semibold text-stone-300">服裝款式</span>
        <span id="label-outfit-name" class="text-[10.5px] font-medium text-amber-300">經典原木素體</span>
      </div>
      <div class="grid grid-cols-3 gap-1" id="outfit-style-group">
        <button type="button" data-outfit="none" class="outfit-btn px-2 py-1.5 rounded-lg text-[11px] font-bold bg-amber-600 text-white shadow transition">原木素體</button>
        <button type="button" data-outfit="labcoat" class="outfit-btn px-2 py-1.5 rounded-lg text-[11px] font-semibold bg-white/5 text-stone-300 hover:text-white hover:bg-white/10 transition">實驗白袍</button>
        <button type="button" data-outfit="jacket" class="outfit-btn px-2 py-1.5 rounded-lg text-[11px] font-semibold bg-white/5 text-stone-300 hover:text-white hover:bg-white/10 transition">立領夾克</button>
        <button type="button" data-outfit="cape" class="outfit-btn px-2 py-1.5 rounded-lg text-[11px] font-semibold bg-white/5 text-stone-300 hover:text-white hover:bg-white/10 transition">英雄披風</button>
        <button type="button" data-outfit="tunic" class="outfit-btn px-2 py-1.5 rounded-lg text-[11px] font-semibold bg-white/5 text-stone-300 hover:text-white hover:bg-white/10 transition">學院背心</button>
      </div>
    </div>

    <!-- 2. 服裝主色 -->
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-semibold text-stone-300">服裝配色</span>
        <span id="label-outfit-color" class="text-[10.5px] font-medium text-stone-400">實驗白</span>
      </div>
      <div class="grid grid-cols-8 gap-1.5" id="outfit-color-group">
        <button type="button" data-color="#f4f1ea" data-name="實驗白" class="outfit-color-btn w-6 h-6 rounded-full border-2 border-white ring-2 ring-amber-400 scale-110 transition" style="background:#f4f1ea" title="實驗白"></button>
        <button type="button" data-color="#253b59" data-name="海軍藍" class="outfit-color-btn w-6 h-6 rounded-full border border-white/25 hover:scale-110 transition" style="background:#253b59" title="海軍藍"></button>
        <button type="button" data-color="#8f2d36" data-name="勃根地紅" class="outfit-color-btn w-6 h-6 rounded-full border border-white/25 hover:scale-110 transition" style="background:#8f2d36" title="勃根地紅"></button>
        <button type="button" data-color="#2d5a43" data-name="森林綠" class="outfit-color-btn w-6 h-6 rounded-full border border-white/25 hover:scale-110 transition" style="background:#2d5a43" title="森林綠"></button>
        <button type="button" data-color="#c98a2c" data-name="暖琥珀黃" class="outfit-color-btn w-6 h-6 rounded-full border border-white/25 hover:scale-110 transition" style="background:#c98a2c" title="暖琥珀黃"></button>
        <button type="button" data-color="#553875" data-name="皇家紫" class="outfit-color-btn w-6 h-6 rounded-full border border-white/25 hover:scale-110 transition" style="background:#553875" title="皇家紫"></button>
        <button type="button" data-color="#2d3138" data-name="炭灰黑" class="outfit-color-btn w-6 h-6 rounded-full border border-white/25 hover:scale-110 transition" style="background:#2d3138" title="炭灰黑"></button>
        <button type="button" data-color="#3b7ea1" data-name="天空藍" class="outfit-color-btn w-6 h-6 rounded-full border border-white/25 hover:scale-110 transition" style="background:#3b7ea1" title="天空藍"></button>
      </div>
    </div>

    <div class="h-px bg-white/10"></div>

    <!-- 3. 髮型款式 -->
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-semibold text-stone-300">髮型款式</span>
        <span id="label-hair-name" class="text-[10.5px] font-medium text-amber-300">光滑原木頭</span>
      </div>
      <div class="grid grid-cols-3 gap-1" id="hair-style-group">
        <button type="button" data-hair="none" class="hair-btn px-2 py-1.5 rounded-lg text-[11px] font-bold bg-amber-600 text-white shadow transition">光滑原木</button>
        <button type="button" data-hair="short" class="hair-btn px-2 py-1.5 rounded-lg text-[11px] font-semibold bg-white/5 text-stone-300 hover:text-white hover:bg-white/10 transition">俐落短髮</button>
        <button type="button" data-hair="bob" class="hair-btn px-2 py-1.5 rounded-lg text-[11px] font-semibold bg-white/5 text-stone-300 hover:text-white hover:bg-white/10 transition">齊耳鮑伯</button>

  <!-- 非侵入式錯誤提示（絕不使用 alert / confirm） -->
  <div id="error-toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-red-950/95 border border-red-400/50 text-red-100 text-xs font-semibold shadow-2xl"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    // ===== 內嵌模組（原始檔：mannequin-core.js / mannequin-appearance.js / mannequin-controls.js）=====
    const { WoodenMannequin } = (() => {
      /**
       * mannequin-core.js — 可重用 3D 關節木頭人偶核心（Three.js r150+）
       *
       *   import * as THREE from 'three';
       *   import { WoodenMannequin } from './mannequin-core.js';
       *   const m = new WoodenMannequin(THREE, { targetHeight: 2, defaultPose: 'raiseRight' });
       *   scene.add(m.root);
       *   // 每幀：m.update(Math.min(clock.getDelta(), 0.05), controls.getAzimuthalAngle());
       *
       * 核心只含：木頭身體、姿勢、走跑/單步、IK、貼地、接觸陰影、地面圓圈。
       * 服裝與髮型（mannequin-appearance.js）、滑鼠/搖桿互動（mannequin-controls.js）都是可選擴充，
       * 透過 m.use(addon) 掛上；不需要時完全不載入。
       * 本檔不 import 任何東西：THREE 由建構子注入（或沿用 globalThis.THREE）。
       * 姿勢角度一律以「度」存放於 m.pose；L = 人偶自身左側（+X），人偶預設面向 +Z。
       */

      let THREE = null;
      const DEG = Math.PI / 180;
      const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
      const degToRad = (d) => d * DEG;
      const radToDeg = (r) => r / DEG;
      const safeNum = (v, fallback = 0) => (Number.isFinite(v) ? v : fallback);

      function safeNormalize(vec, fallback) {
        const lenSq = vec.lengthSq();
        if (!Number.isFinite(lenSq) || lenSq < 1e-8) {
          return fallback ? vec.copy(fallback) : vec.set(0, 1, 0);
        }
        return vec.divideScalar(Math.sqrt(lenSq));
      }

      function shortestAngleLerp(current, target, alpha) {
        const TAU = Math.PI * 2;
        const diff = ((((target - current) % TAU) + TAU + Math.PI) % TAU) - Math.PI;
        return current + diff * alpha;
      }

      /** 可重現的偽隨機數（木紋貼圖每次載入都一致） */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function makeCanvas() {
        if (WoodenMannequin.canvasFactory) return WoodenMannequin.canvasFactory();
        if (typeof document !== 'undefined') return document.createElement('canvas');
        if (typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(1, 1);
        throw new Error('WoodenMannequin: 找不到 canvas，請設定 WoodenMannequin.canvasFactory');
      }

      /** 姿勢字典的全部數值鍵（固定順序，避免每幀 Object.keys 配置） */
      const POSE_KEYS = [
        'pelvisBounceY', 'pelvisRotX', 'pelvisRotZ',
        'headX', 'headY', 'headZ', 'torsoX', 'torsoY', 'torsoZ',
        'lShoulderX', 'lShoulderY', 'lShoulderZ', 'lElbowX',
        'rShoulderX', 'rShoulderY', 'rShoulderZ', 'rElbowX',
        'lHipX', 'lHipY', 'lHipZ', 'lKneeX', 'lAnkleX',
        'rHipX', 'rHipY', 'rHipZ', 'rKneeX', 'rAnkleX'
      ];

      function pickPose(src, fallback) {
        const fb = fallback || WoodenMannequin.PRESETS.stand;
        const out = {};
        for (const k of POSE_KEYS) out[k] = safeNum(src && src[k], safeNum(fb[k], 0));
        return out;
      }

      function copyPose(dst, src) {
        if (!src) return dst;
        for (const k of POSE_KEYS) if (typeof src[k] === 'number' && Number.isFinite(src[k])) dst[k] = src[k];
        return dst;
      }

      /** 指數趨近；回傳本次最大角度差（度），用於判斷是否已收斂 */
      function blendPose(dst, src, alpha) {
        let maxDiff = 0;
        for (const k of POSE_KEYS) {
          const target = src[k];
          if (typeof target !== 'number') continue;
          const cur = safeNum(dst[k], 0);
          const diff = target - cur;
          dst[k] = cur + diff * alpha;
          const ad = diff < 0 ? -diff : diff;
          if (ad > maxDiff) maxDiff = ad;
        }
        return maxDiff;
      }

      /**
       * XYZ Euler 有兩組等價解 (x,y,z) 與 (x+180, 180-y, z+180)。
       * 原版直接逐軸 clamp 會把合法旋轉夾成錯誤方向（IK 誤差可達 0.9 m），
       * 這裡先挑違反關節限制最少的一組，最後才 clamp。
       */
      function pickEuler(xDeg, yDeg, zDeg, lim) {
        const wrap = (d) => ((((d + 180) % 360) + 360) % 360) - 180;
        const a = [wrap(xDeg), wrap(yDeg), wrap(zDeg)];
        const b = [wrap(xDeg + 180), wrap(180 - yDeg), wrap(zDeg + 180)];
        const viol = (e) => e.reduce((s, v, i) => s + Math.max(0, lim[i][0] - v, v - lim[i][1]), 0);
        const va = viol(a);
        const vb = viol(b);
        const best = vb < va ? b : a;
        const out = best.map((v, i) => clamp(v, lim[i][0], lim[i][1]));
        out.viol = Math.min(va, vb);
        return out;
      }

      /** 給擴充模組使用的共用工具 */
      const MannequinUtils = { clamp, degToRad, radToDeg, safeNum, mulberry32, makeCanvas: () => makeCanvas(), POSE_KEYS };

      class WoodenMannequin {
        static sharedResources = null;
        /** 可選：自訂 canvas 建立方式（Worker / Node 測試用） */
        static canvasFactory = null;

        /** IK 使用的關節限制（度，順序 [X, Y, Z]） */
        static JOINT_LIMITS = {
          lShoulder: [[-175, 95], [-95, 95], [-75, 178]],
          rShoulder: [[-175, 95], [-95, 95], [-178, 75]],
          elbow: [-155, -2],
          lHip: [[-130, 80], [-65, 65], [-30, 85]],
          rHip: [[-130, 80], [-65, 65], [-85, 30]],
          knee: [0, 150]
        };

        /** 與舊版 SKILL.md 相容的姿勢別名 */
        static POSE_ALIASES = { think: 'thinker', run: 'runFreeze' };

        /** getWorldAnchor() 可用的錨點 */
        static ANCHORS = ['headTop', 'eyes', 'head', 'chest', 'pelvis', 'handL', 'handR', 'wristL', 'wristR', 'footL', 'footR', 'toeL', 'toeR'];

        /**
         * 生成並快取共用程序化木紋貼圖（山毛櫸 & 黑胡桃木）與車削幾何體池
         */
        static getSharedResources(threeLib = THREE, maxAnisotropy = 4) {
          if (WoodenMannequin.sharedResources) {
            return WoodenMannequin.sharedResources;
          }

          const T = threeLib || THREE;

          const createWoodTextureSet = (palette) => {
            const rng = mulberry32(0x5eed);
            const width = 512;
            const height = 512;
            const colorCanvas = makeCanvas();
            colorCanvas.width = width;
            colorCanvas.height = height;
            const ctx = colorCanvas.getContext('2d');

            const bumpCanvas = makeCanvas();
            bumpCanvas.width = width;
            bumpCanvas.height = height;
            const bCtx = bumpCanvas.getContext('2d');

            const baseGrad = ctx.createLinearGradient(0, 0, width, 0);
            baseGrad.addColorStop(0.0, palette.c0);
            baseGrad.addColorStop(0.32, palette.c1);
            baseGrad.addColorStop(0.64, palette.c2);
            baseGrad.addColorStop(1.0, palette.c3);
            ctx.fillStyle = baseGrad;
            ctx.fillRect(0, 0, width, height);

            bCtx.fillStyle = '#808080';
            bCtx.fillRect(0, 0, width, height);

            for (let i = 0; i < 240; i++) {
              const xBase = (i / 240) * width;
              const waveAmp = 3.5 + Math.sin(i * 0.17) * 4.5;
              const waveFreq = 0.011 + (i % 6) * 0.002;
              const phase = i * 0.41;
              const isDark = i % 3 !== 0;

              ctx.beginPath();
              bCtx.beginPath();
              for (let y = 0; y <= height; y += 16) {
                const x = (xBase + Math.sin(y * waveFreq + phase) * waveAmp + width) % width;
                if (y === 0) {
                  ctx.moveTo(x, y);
                  bCtx.moveTo(x, y);
                } else {
                  ctx.lineTo(x, y);
                  bCtx.lineTo(x, y);
                }
              }
              ctx.lineWidth = 0.9 + (i % 3) * 0.5;
              ctx.strokeStyle = isDark ? palette.darkStreak : palette.lightStreak;
              ctx.stroke();

              bCtx.lineWidth = ctx.lineWidth;
              bCtx.strokeStyle = isDark ? 'rgba(95,95,95,0.16)' : 'rgba(170,170,170,0.12)';
              bCtx.stroke();
            }

            for (let k = 0; k < 650; k++) {
              const rx = rng() * width;
              const ry = rng() * height;
              const rLen = 5 + rng() * 12;
              ctx.fillStyle = palette.rayColor;
              ctx.fillRect(rx, ry, 1.2, rLen);
            }

            const map = new T.CanvasTexture(colorCanvas);
            map.colorSpace = T.SRGBColorSpace;
            map.wrapS = map.wrapT = T.RepeatWrapping;
            map.anisotropy = maxAnisotropy;

            const bumpMap = new T.CanvasTexture(bumpCanvas);
            bumpMap.wrapS = bumpMap.wrapT = T.RepeatWrapping;
            bumpMap.anisotropy = maxAnisotropy;

            return { map, bumpMap, jointTint: palette.jointTint };
          };

          const woodSets = {
            beech: createWoodTextureSet({
              c0: '#e5bd8e',
              c1: '#d6a772',
              c2: '#ebc598',
              c3: '#cfa06b',
              darkStreak: 'rgba(145, 88, 38, 0.11)',
              lightStreak: 'rgba(255, 240, 218, 0.11)',
              rayColor: 'rgba(126, 72, 30, 0.12)',
              jointTint: 0x9c6638
            }),
            walnut: createWoodTextureSet({
              c0: '#784c30',
              c1: '#633c24',
              c2: '#855537',
              c3: '#57331d',
              darkStreak: 'rgba(34, 17, 8, 0.22)',
              lightStreak: 'rgba(186, 134, 96, 0.13)',
              rayColor: 'rgba(30, 14, 6, 0.2)',
              jointTint: 0x452817
            })
          };

          // 腳底高效能半透明徑向漸層接觸陰影貼圖
          const shadowCanvas = makeCanvas();
          shadowCanvas.width = 128;
          shadowCanvas.height = 128;
          const sCtx = shadowCanvas.getContext('2d');
          const sGrad = sCtx.createRadialGradient(64, 64, 6, 64, 64, 62);
          sGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0.56)');
          sGrad.addColorStop(0.55, 'rgba(0, 0, 0, 0.22)');
          sGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
          sCtx.fillStyle = sGrad;
          sCtx.fillRect(0, 0, 128, 128);
          const shadowMap = new T.CanvasTexture(shadowCanvas);

          // 車削圓角肢段幾何輔助函數 (LatheGeometry)
          const createCarvedLimb = (topR, botR, len, segs = 20) => {
            const bevel = Math.min(topR, botR, len * 0.22) * 0.52;
            const pts = [new T.Vector2(0, -len)];
            const steps = 4;
            for (let i = 1; i <= steps; i++) {
              const t = (i / steps) * (Math.PI / 2);
              pts.push(new T.Vector2(Math.sin(t) * botR, -len + (1 - Math.cos(t)) * bevel));
            }
            for (let i = 0; i <= steps; i++) {
              const t = (i / steps) * (Math.PI / 2);
              pts.push(new T.Vector2(Math.cos(t) * topR, -bevel + Math.sin(t) * bevel));
            }
            pts.push(new T.Vector2(0, 0));
            const g = new T.LatheGeometry(pts, segs);
            g.computeVertexNormals();
            return g;
          };

          // 地面方向指示箭頭幾何（ExtrudeGeometry）
          const chevronShape = new T.Shape();
          chevronShape.moveTo(0, 0.24);
          chevronShape.lineTo(0.24, -0.04);
          chevronShape.lineTo(0.14, -0.10);
          chevronShape.lineTo(0, 0.06);
          chevronShape.lineTo(-0.14, -0.10);
          chevronShape.lineTo(-0.24, -0.04);
          chevronShape.closePath();
          const chevronGeo = new T.ExtrudeGeometry(chevronShape, {
            depth: 0.022,
            bevelEnabled: true,
            bevelThickness: 0.008,
            bevelSize: 0.008,
            bevelSegments: 2
          });
          chevronGeo.rotateX(Math.PI / 2);
          chevronGeo.computeVertexNormals();

          const geometries = {
            sphere: new T.SphereGeometry(1, 20, 16),
            pelvis: (() => {
              const pts = [
                new T.Vector2(0, -0.20),
                new T.Vector2(0.22, -0.20),
                new T.Vector2(0.27, -0.15),
                new T.Vector2(0.37, 0.12),
                new T.Vector2(0.34, 0.18),
                new T.Vector2(0, 0.18)
              ];
              const g = new T.LatheGeometry(pts, 24);
              g.computeVertexNormals();
              return g;
            })(),
            torso: (() => {
              const pts = [
                new T.Vector2(0, 0.02),
                new T.Vector2(0.22, 0.03),
                new T.Vector2(0.25, 0.13),
                new T.Vector2(0.33, 0.44),
                new T.Vector2(0.42, 0.76),
                new T.Vector2(0.40, 0.88),
                new T.Vector2(0.32, 0.95),
                new T.Vector2(0, 0.97)
              ];
              const g = new T.LatheGeometry(pts, 24);
              g.computeVertexNormals();
              return g;
            })(),
            head: (() => {
              const pts = [
                new T.Vector2(0, 0.0),
                new T.Vector2(0.088, 0.022),
                new T.Vector2(0.142, 0.09),
                new T.Vector2(0.188, 0.20),
                new T.Vector2(0.212, 0.33),
                new T.Vector2(0.202, 0.45),
                new T.Vector2(0.16, 0.55),
                new T.Vector2(0.088, 0.60),
                new T.Vector2(0, 0.62)
              ];
              const g = new T.LatheGeometry(pts, 24);
              g.computeVertexNormals();
              return g;
            })(),
            neckCol: createCarvedLimb(0.095, 0.105, 0.13, 18),
            upperArm: createCarvedLimb(0.135, 0.11, 0.76, 20),
            forearm: createCarvedLimb(0.11, 0.082, 0.67, 20),
            palm: createCarvedLimb(0.078, 0.088, 0.19, 18),
            fingers: createCarvedLimb(0.084, 0.062, 0.17, 18),
            thumb: createCarvedLimb(0.032, 0.023, 0.115, 14),
            thigh: createCarvedLimb(0.168, 0.132, 0.87, 22),
            calf: (() => {
              const len = 0.83;
              const pts = [
                new T.Vector2(0, -len),
                new T.Vector2(0.086, -len + 0.035),
                new T.Vector2(0.106, -len * 0.45),
                new T.Vector2(0.134, -len * 0.24),
                new T.Vector2(0.130, -0.045),
                new T.Vector2(0.112, -0.01),
                new T.Vector2(0, 0)
              ];
              const g = new T.LatheGeometry(pts, 22);
              g.computeVertexNormals();
              return g;
            })(),
            footWedge: createCarvedLimb(0.092, 0.115, 0.40, 20),
            shadowDisc: new T.CircleGeometry(0.92, 32),
            groundHitDisc: new T.CircleGeometry(1.12, 48),

            groundChevron: chevronGeo
          };

          WoodenMannequin.sharedResources = {
            woodSets,
            shadowMap,
            geometries
          };
          return WoodenMannequin.sharedResources;
        }

        /**
         * 主動釋放全場景共用的貼圖與幾何體記憶體
         */
        static disposeShared() {
          const res = WoodenMannequin.sharedResources;
          if (!res) return;
          Object.values(res.woodSets).forEach((s) => {
            if (s.map) s.map.dispose();
            if (s.bumpMap) s.bumpMap.dispose();
          });
          if (res.shadowMap) res.shadowMap.dispose();
          if (res.geometries) {
            Object.values(res.geometries).forEach((geo) => {
              if (geo && typeof geo.dispose === 'function') geo.dispose();
            });
          }
          WoodenMannequin.sharedResources = null;

        constructor(threeOrOptions, maybeOptions) {
          const injected = threeOrOptions && threeOrOptions.Vector3 ? threeOrOptions : null;
          const ns = injected || THREE || (typeof globalThis !== 'undefined' ? globalThis.THREE : null);
          const options = (injected ? maybeOptions : threeOrOptions) || {};
          if (!ns || !ns.Vector3) {
            throw new Error('WoodenMannequin：請傳入 THREE，例如 new WoodenMannequinSkill(THREE, options)');
          }
          if (THREE && THREE !== ns) {
            console.warn('WoodenMannequin：偵測到不同的 THREE 實例，共用資源將重建');
            WoodenMannequin.sharedResources = null;
          }
          THREE = ns;
          this.THREE = ns;
          const {
            isImage = false,
            targetHeight = 2.0,

            maxAnisotropy = 4,

            showShadow = !isImage,
            worldBounds = Infinity,
            groundLock = true
          } = options;

          const res = WoodenMannequin.getSharedResources(THREE, maxAnisotropy);
          this.geometries = res.geometries;
          this.woodSets = res.woodSets;
          this.isImage = Boolean(isImage);
          this.moveMode = moveMode === 'turn' ? 'turn' : 'strafe';
          this.woodType = woodType === 'walnut' ? 'walnut' : 'beech';

          const activeWood = this.woodSets[this.woodType];

          // 獨立材質（isImage: true 時自動開啟半透明材質，供光學虛像使用）
          this.woodMat = new THREE.MeshStandardMaterial({
            map: activeWood.map,
            bumpMap: activeWood.bumpMap,
            bumpScale: 0.012,
            roughness: 0.45,
            metalness: 0.04,

            opacity: this.isImage ? 0.6 : 1.0

          this.jointMat = new THREE.MeshStandardMaterial({
            map: activeWood.map,
            bumpMap: activeWood.bumpMap,
            bumpScale: 0.015,

            opacity: this.isImage ? 0.6 : 1.0
          });

          this.shadowMat = new THREE.MeshBasicMaterial({
            map: res.shadowMap,

          /** 每幀算出的動態資訊，供擴充模組（披風、馬尾…）使用 */
          this.motion = { localFwdVel: 0, localSideVel: 0, speed: 0, elapsed: 0, dt: 0 };

          // 骨骼尺寸常數（站立時腳底精準貼齊 y = 0.000）
          this.UPPER_ARM_LEN = 0.81;
          this.FOREARM_LEN = 0.71;
          this.THIGH_LEN = 0.92;
          this.CALF_LEN = 0.88;
          this.BASE_PELVIS_Y = 2.102;
          this.RAW_HEIGHT = 4.029; // 實測：腳底貼地時頭頂的原始高度（原值 4.0 讓人偶比 targetHeight 高 0.7%）
          this.targetHeight = targetHeight;
          this.unitScale = targetHeight / 2; // 速度、步距以 2 m 身高為基準等比縮放
          this.defaultPose = WoodenMannequin.PRESETS[defaultPose] ? defaultPose : 'stand';
          this.groundLock = Boolean(groundLock);
          this.footFlatten = 1;

          // 根節點：腳底貼齊 y = 0，並正規化為指定 targetHeight
          this.root = new THREE.Group();
          this.root.scale.setScalar(targetHeight / this.RAW_HEIGHT);

          // 地面接觸陰影圓片
          this.contactShadow = new THREE.Mesh(this.geometries.shadowDisc, this.shadowMat);

          this.targetPreset = null;
          this.isTransitioningPreset = false;

          // 走跑、地面圓圈拖曳步行感、單步跨步與次級物理擺動狀態
          this.joyInput = { x: 0, y: 0 };

            duration: 0.24,
            startPos: new THREE.Vector3(),
            targetPos: new THREE.Vector3(),

            dirZ: 0,

          };

          this.applyPoseToRig();
          this._updateGroundHandleAppearance();
        }

        _trackOwnedGeo(geo) {
          if (geo) this.ownedGeometries.push(geo);
          return geo;
        }

        /**
         * 建立人偶腳下的可拖曳地面定位圓圈 (groundHandle at y = 0.006)
         */
        _buildGroundHandle(enabled = true) {
          const G = this.geometries;
          if (!enabled) {
            this.groundHandle = null;
            return;
          }
          this.groundHandle = new THREE.Group();
          this.groundHandle.position.set(0, 0.006, 0);
          this.groundHandle.visible = true;
          this.root.add(this.groundHandle);

          this.groundDiscMat = new THREE.MeshBasicMaterial({
            color: 0xf59e0b,
            transparent: true,
            opacity: 0.14,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          this.groundRingMat = new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            emissive: 0xd97706,
            emissiveIntensity: 0.45,
            roughness: 0.35,
            metalness: 0.25,
            transparent: true,
            opacity: 0.92
          });

          this.groundInnerMat = new THREE.MeshBasicMaterial({
            color: 0xfde68a,
            transparent: true,
            opacity: 0.45,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          const registerGroundMesh = (mesh) => {
            mesh.userData = {
              partId: 'groundRing',
              partName: '地面定位圓圈 (Ground Ring)',
              dragType: 'groundMove',
              side: null,
              isGroundHandle: true
            };
            this.groundMeshes.push(mesh);
            return mesh;
          };

          // 1. 圓圈內部半透明抓握圓盤（點圓圈內任意處皆可輕鬆拖拉）
          const hitDisc = new THREE.Mesh(G.groundHitDisc, this.groundDiscMat);
          hitDisc.rotation.x = -Math.PI / 2;
          registerGroundMesh(hitDisc);
          this.groundHandle.add(hitDisc);

          // 2. 外圈刻度環 + 立體斜角圓環
          const outerRing = new THREE.Mesh(G.groundOuterRing, this.groundRingMat);
          outerRing.rotation.x = -Math.PI / 2;
          outerRing.position.y = 0.002;
          registerGroundMesh(outerRing);
          this.groundHandle.add(outerRing);

          const bevelTorus = new THREE.Mesh(G.groundBevelTorus, this.groundRingMat);
          bevelTorus.rotation.x = Math.PI / 2;
          bevelTorus.position.y = 0.012;
          registerGroundMesh(bevelTorus);
          this.groundHandle.add(bevelTorus);

          // 3. 內圈細準星環
          const innerRing = new THREE.Mesh(G.groundInnerRing, this.groundInnerMat);
          innerRing.rotation.x = -Math.PI / 2;
          innerRing.position.y = 0.003;
          registerGroundMesh(innerRing);
          this.groundHandle.add(innerRing);

          // 4. 正前方朝向指示箭頭 (+Z 方向)
          const chevronMesh = new THREE.Mesh(G.groundChevron, this.groundRingMat);
          chevronMesh.position.set(0, 0.014, 1.24);
          registerGroundMesh(chevronMesh);
          this.groundHandle.add(chevronMesh);
        }

        _updateGroundHandleAppearance() {
          if (!this.groundRingMat || !this.groundDiscMat) return;
          const baseHex = this.isPoseLocked ? 0x10b981 : 0xf59e0b;
          const emissiveHex = this.isPoseLocked ? 0x059669 : 0xd97706;
          const innerHex = this.isPoseLocked ? 0xa7f3d0 : 0xfde68a;

          this.groundRingMat.color.setHex(baseHex);
          this.groundRingMat.emissive.setHex(emissiveHex);
          this.groundDiscMat.color.setHex(baseHex);
          this.groundInnerMat.color.setHex(innerHex);

          if (this.isGroundDragging) {
            this.groundRingMat.emissiveIntensity = 1.05;
            this.groundDiscMat.opacity = 0.30;
            this.groundInnerMat.opacity = 0.85;
            this.groundHandle.scale.setScalar(1.04);
          } else if (this.isGroundHovered) {
            this.groundRingMat.emissiveIntensity = 0.85;
            this.groundDiscMat.opacity = 0.24;
            this.groundInnerMat.opacity = 0.72;
            this.groundHandle.scale.setScalar(1.025);
          } else {
            this.groundRingMat.emissiveIntensity = 0.42;
            this.groundDiscMat.opacity = 0.14;
            this.groundInnerMat.opacity = 0.42;
            this.groundHandle.scale.setScalar(1.0);
          }
        }

        setGroundHover(hovered) {
          const next = Boolean(hovered);
          if (this.isGroundHovered === next) return;
          this.isGroundHovered = next;
          this._updateGroundHandleAppearance();
        }

        setGroundDragging(dragging) {
          const next = Boolean(dragging);
          if (this.isGroundDragging === next) return;
          this.isGroundDragging = next;
          if (!next) {
            this.externalDragVel.set(0, 0);
          }
          this._updateGroundHandleAppearance();
        }

        /**
         * 外部拖曳地面圓圈時回報水平瞬時速度（世界單位/秒），未鎖定姿勢時自動產生自然小步走動
         */
        setExternalDragVelocity(vx, vz) {
          if (!Number.isFinite(vx) || !Number.isFinite(vz)) return;
          this.externalDragVel.set(clamp(vx, -5, 5), clamp(vz, -5, 5));
        }

        _registerPart(mesh, info) {
          mesh.userData = {
            partId: info.partId,
            partName: info.partName,
            dragType: info.dragType,
            side: info.side || null,
            isJointBall: Boolean(info.isJointBall),
            isClothing: Boolean(info.isClothing),
            isHair: Boolean(info.isHair)
          };
          this.interactiveMeshes.push(mesh);
          if (!this.partGroupsMap[info.partId]) {
            this.partGroupsMap[info.partId] = [];
          }
          this.partGroupsMap[info.partId].push(mesh);
          return mesh;
        }

        _createJointBall(radius, scaleVec, info) {
          const group = new THREE.Group();
          const mesh = new THREE.Mesh(this.geometries.sphere, this.jointMat);
          if (scaleVec) {
            mesh.scale.set(radius * scaleVec.x, radius * scaleVec.y, radius * scaleVec.z);
          } else {
            mesh.scale.setScalar(radius);
          }
          this._registerPart(mesh, { ...info, isJointBall: true });
          group.add(mesh);
          return group;
        }

        _buildRig() {
          const G = this.geometries;

          // 1. 骨盆 (Pelvis)
          this.pelvisGroup = new THREE.Group();
          this.pelvisGroup.position.set(0, this.BASE_PELVIS_Y, 0);
          this.root.add(this.pelvisGroup);

          const pelvisMesh = new THREE.Mesh(G.pelvis, this.woodMat);
          pelvisMesh.scale.set(1.0, 1.0, 0.64);
          this._registerPart(pelvisMesh, {
            partId: 'pelvis',
            partName: '骨盆 (Pelvis)',
            dragType: 'pelvis'
          });
          this.pelvisGroup.add(pelvisMesh);

          // 2. 腰部球關節與胸廓 (Waist & Torso)
          this.waistJoint = this._createJointBall(0.195, new THREE.Vector3(1.0, 0.85, 0.72), {
            partId: 'torso',
            partName: '腰部球關節 (Waist)',
            dragType: 'torso'
          });
          this.waistJoint.position.set(0, 0.20, 0);
          this.pelvisGroup.add(this.waistJoint);

          this.torsoGroup = new THREE.Group();
          this.waistJoint.add(this.torsoGroup);

          const torsoMesh = new THREE.Mesh(G.torso, this.woodMat);
          torsoMesh.scale.set(1.0, 1.0, 0.62);
          this._registerPart(torsoMesh, {
            partId: 'torso',
            partName: '胸廓軀幹 (Torso)',
            dragType: 'torso'
          });
          this.torsoGroup.add(torsoMesh);

          // 3. 頸部與蛋形木頭 (Neck & Head)
          this.neckJoint = this._createJointBall(0.112, null, {
            partId: 'head',
            partName: '頸部球關節 (Neck)',
            dragType: 'head'
          });
          this.neckJoint.position.set(0, 0.99, 0.01);
          this.torsoGroup.add(this.neckJoint);

          const neckCol = new THREE.Mesh(G.neckCol, this.woodMat);
          neckCol.position.set(0, 0.13, 0);
          this._registerPart(neckCol, {
            partId: 'head',
            partName: '頸部 (Neck)',
            dragType: 'head'
          });
          this.neckJoint.add(neckCol);

          this.headGroup = new THREE.Group();
          this.headGroup.position.set(0, 0.14, 0);
          this.neckJoint.add(this.headGroup);

          const headMesh = new THREE.Mesh(G.head, this.woodMat);
          headMesh.scale.set(0.90, 1.0, 1.06);
          headMesh.position.set(0, -0.02, 0.02);
          this._registerPart(headMesh, {
            partId: 'head',
            partName: '蛋形木頭 (Head)',
            dragType: 'head'
          });
          this.headGroup.add(headMesh);

          // 4. 雙臂 ('L' & 'R')
          this.leftArm = this._buildArm('L');
          this.rightArm = this._buildArm('R');

          // 5. 雙腿 ('L' & 'R')
          this.leftLeg = this._buildLeg('L');
          this.rightLeg = this._buildLeg('R');
        }

        _buildArm(side) {
          const G = this.geometries;
          const isLeft = side === 'L';
          const s = isLeft ? 1 : -1;
          const label = isLeft ? '左' : '右';

          const shoulderJoint = this._createJointBall(0.142, null, {
            partId: `${side}UpperArm`,
            partName: `${label}肩球關節`,

          shoulderJoint.position.set(s * 0.46, 0.81, 0);
          this.torsoGroup.add(shoulderJoint);

          const upperArmMesh = new THREE.Mesh(G.upperArm, this.woodMat);
          upperArmMesh.position.set(0, -0.045, 0);
          this._registerPart(upperArmMesh, {
            partId: `${side}UpperArm`,
            partName: `${label}上臂`,
            dragType: 'upperArm',

          const elbowJoint = this._createJointBall(0.11, null, {
            partId: `${side}Hand`,

            partId: `${side}Hand`,
            partName: `${label}前臂`,
            dragType: 'handIK',

          const wristJoint = this._createJointBall(0.08, null, {
            partId: `${side}Hand`,
            partName: `${label}手腕`,
            dragType: 'handIK',
            side

          wristJoint.position.set(0, -this.FOREARM_LEN, 0);
          elbowJoint.add(wristJoint);

          const handGroup = new THREE.Group();
          wristJoint.add(handGroup);

          const palmMesh = new THREE.Mesh(G.palm, this.woodMat);
          palmMesh.scale.set(0.46, 1.0, 1.08);
          palmMesh.position.set(0, -0.025, 0);
          this._registerPart(palmMesh, {
            partId: `${side}Hand`,
