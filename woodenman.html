          const base = document.createElement('div');
          Object.assign(base.style, {
            position: 'fixed', left: '16px', bottom: '16px', width: `${size}px`, height: `${size}px`, borderRadius: '50%',
            background: 'radial-gradient(circle at 35% 30%, rgba(41,37,36,.88), rgba(18,15,13,.94))',
            boxShadow: 'inset 0 2px 10px rgba(0,0,0,.78), inset 0 0 0 1px rgba(251,191,36,.22), 0 12px 30px rgba(0,0,0,.58)',
            touchAction: 'none', userSelect: 'none', cursor: 'grab', zIndex: 20, display: 'flex', alignItems: 'center', justifyContent: 'center'
          }, style);
          const ring = document.createElement('div');
          Object.assign(ring.style, { position: 'absolute', width: '52%', height: '52%', borderRadius: '50%', border: '1px dashed rgba(251,191,36,.35)', pointerEvents: 'none' });
          const knob = document.createElement('div');
          const k = Math.round(size * 0.36);
          Object.assign(knob.style, {
            width: `${k}px`, height: `${k}px`, borderRadius: '50%', pointerEvents: 'none', border: '2px solid rgba(254,243,199,.85)',
            background: 'radial-gradient(circle at 32% 28%, #fbbf24 0%, #d97706 62%, #92400e 100%)',
            boxShadow: '0 6px 16px rgba(0,0,0,.65), inset 0 1px 2px rgba(255,255,255,.55)', transition: 'transform .06s ease-out'
          });
          const mask = document.createElement('div');
          Object.assign(mask.style, {
            position: 'absolute', inset: '0', borderRadius: '50%', background: 'rgba(12,10,9,.88)', color: '#6ee7b7', display: 'none',
            alignItems: 'center', justifyContent: 'center', textAlign: 'center', font: '600 11px/1.3 system-ui, sans-serif', padding: '10px'
          });
          mask.textContent = '已鎖定擺姿勢';
          base.append(ring, knob, mask);
          parent.appendChild(base);
          this.el = base;
          this.knob = knob;
          this.mask = mask;
          this._size = size;
          this._pid = null;

          this._down = (e) => {
            if (!this.enabled) return;
            e.preventDefault();
            e.stopPropagation();
            this._pid = e.pointerId;
            this._t0 = performance.now();
            this._x0 = e.clientX;
            this._y0 = e.clientY;
            this._dragged = false;
            try {
              base.setPointerCapture(e.pointerId);
            } catch (_) {
              /* 略過 */
            }
          };
          this._move = (e) => {
            if (e.pointerId !== this._pid) return;
            if (!this._dragged && Math.hypot(e.clientX - this._x0, e.clientY - this._y0) >= this._tapPx) this._dragged = true;
            if (!this._dragged) return;
            const r = base.getBoundingClientRect();
            const R = Math.max(1, r.width * 0.36);
            let dx = (e.clientX - (r.left + r.width / 2)) / R;
            let dy = -(e.clientY - (r.top + r.height / 2)) / R;
            const m = Math.hypot(dx, dy);
            if (m > 1) {
              dx /= m;
              dy /= m;
            }
            this.value.x = dx;
            this.value.y = dy;
            this.active = true;
            this._render(true);
          };
          this._up = (e) => {
            if (e.pointerId !== this._pid) return;
            const tap = !this._dragged && performance.now() - this._t0 < this._tapMs;
            if (tap && this.onTap && this.enabled) {
              const r = base.getBoundingClientRect();
              const dx = e.clientX - (r.left + r.width / 2);
              const dy = e.clientY - (r.top + r.height / 2);
              if (Math.hypot(dx, dy) > 4) {
                if (Math.abs(dx) >= Math.abs(dy)) this.onTap(Math.sign(dx), 0);
                else this.onTap(0, -Math.sign(dy));
              }
            }
            this.release();
          };
          base.addEventListener('pointerdown', this._down);
          window.addEventListener('pointermove', this._move);
          window.addEventListener('pointerup', this._up);
          window.addEventListener('pointercancel', this._up);
        }

        release() {
          if (this._pid !== null) {
            try {
              this.el.releasePointerCapture(this._pid);
            } catch (_) {
              /* 略過 */
            }
          }
          this._pid = null;
          this.value.x = 0;
          this.value.y = 0;
          this.active = false;
          this._render(false);
        }

        /** 由外部（例如鍵盤）推動時同步旋鈕位置 */
        show(x, y) {
          if (this.active) return;
          this.value.x = 0;
          this.value.y = 0;
          this._renderXY(x, y, false);
        }

        setEnabled(on, maskText = '已鎖定擺姿勢') {
          this.enabled = on;
          this.mask.textContent = maskText;
          this.mask.style.display = on ? 'none' : 'flex';
          if (!on) this.release();
        }

        _render(dragging) {
          this._renderXY(this.value.x, this.value.y, dragging);
        }

        _renderXY(x, y, dragging) {
          const R = this._size * 0.32;
          this.knob.style.transition = dragging ? 'none' : 'transform .06s ease-out';
          this.knob.style.transform = `translate3d(${(x * R).toFixed(1)}px, ${(-y * R).toFixed(1)}px, 0)`;
        }

        dispose() {
          this.release();
          this.el.removeEventListener('pointerdown', this._down);
          window.removeEventListener('pointermove', this._move);
          window.removeEventListener('pointerup', this._up);
          window.removeEventListener('pointercancel', this._up);
          this.el.remove();
        }
      }

      /** 滑鼠/觸控/鍵盤互動控制器 */
      class MannequinControls {
        /**
         * @param {object} o
         * @param {object} o.THREE
         * @param {object} o.mannequin WoodenMannequin 實例
         * @param {THREE.Camera} o.camera
         * @param {HTMLElement} o.domElement 通常是 renderer.domElement
         * @param {object} [o.orbitControls] 拖曳時會暫停它
         * @param {THREE.Scene} [o.scene] 提供時會顯示拖曳輔助環
         * @param {boolean} [o.keyboard=true] 啟用 WASD / 方向鍵
         * @param {boolean} [o.history=true] 啟用復原/重做（Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z）
         * @param {boolean} [o.groundDrag=true] 允許拖曳地面圓圈
         * @param {boolean} [o.limbDrag=true] 鎖定時允許拖曳肢體
         * @param {number} [o.snap=0.25] Shift 吸附格距（世界單位）
         * @param {number} [o.stepDistance] 單步距離（預設依身高 0.25 m / 2 m）
         */
        constructor(o) {
          this.THREE = o.THREE;
          this.m = o.mannequin;
          this.camera = o.camera;
          this.dom = o.domElement;
          this.orbit = o.orbitControls || null;
          this.scene = o.scene || null;
          this.snap = o.snap ?? 0.25;
          this.stepDistance = o.stepDistance ?? null;
          this.groundDrag = o.groundDrag !== false;
          this.limbDrag = o.limbDrag !== false;
          this.keyboardEnabled = o.keyboard !== false;
          this.history = o.history === false ? null : new PoseHistory();
          this.joystick = null;
          this.enabled = true;

          /** 狀態訊息回呼 (text, mode: 'move' | 'locked' | 'dragging') */
          this.onStatus = null;
          /** 拖曳開始/結束回呼 (kind: 'ground' | 'limb', info) */
          this.onDragStart = null;
          this.onDragEnd = null;

          const T = this.THREE;
          this.isDraggingGround = false;
          this.isDraggingLimb = false;
          this.hoveredPart = null;
          this._ray = new T.Raycaster();
          this._ndc = new T.Vector2();
          this._plane0 = new T.Plane(new T.Vector3(0, 1, 0), 0);
          this._dragPlane = new T.Plane();
          this._hit = new T.Vector3();
          this._grab = new T.Vector3();
          this._pid = null;
          this._drag = null;
          this._keys = new Set();
          this._arrows = new Map();
          this._hold = 0;
          this._keyVec = { x: 0, y: 0 };
          this._lastGroundT = 0;

          if (this.scene) {
            this._vis = new T.Group();
            this._vis.visible = false;
            this._ring = new T.Mesh(new T.RingGeometry(0.1, 0.12, 36), new T.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.85, depthTest: false, side: T.DoubleSide }));
            this._ring.renderOrder = 998;
            this._lineGeo = new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3()]);
            this._line = new T.Line(this._lineGeo, new T.LineBasicMaterial({ color: 0x34d399, transparent: true, depthTest: false }));
            this._line.renderOrder = 998;
            this._vis.add(this._ring, this._line);
            this.scene.add(this._vis);
          }

          this._onDown = (e) => this._pointerDown(e);
          this._onMove = (e) => this._pointerMove(e);
          this._onUp = (e) => this._pointerUp(e);
          this._onCancel = () => this.cancel();
          this._onKeyDown = (e) => this._keyDown(e);
          this._onKeyUp = (e) => this._keyUp(e);
          this.dom.addEventListener('pointerdown', this._onDown);
          window.addEventListener('pointermove', this._onMove);
          window.addEventListener('pointerup', this._onUp);
          window.addEventListener('pointercancel', this._onCancel);
          window.addEventListener('blur', this._onCancel);
          window.addEventListener('keydown', this._onKeyDown);
          window.addEventListener('keyup', this._onKeyUp);
        }

        // ---------------------------------------------------------------- 公用 API

        /** 鏡頭水平方位角，傳給 mannequin.update() 讓搖桿方向跟著鏡頭 */
        getAzimuth() {
          if (this.orbit && this.orbit.getAzimuthalAngle) return this.orbit.getAzimuthalAngle();
          const d = this.camera.getWorldDirection(new this.THREE.Vector3());
          return Math.atan2(-d.x, -d.z);
        }

        /** 切換「鎖定擺姿勢」模式 */
        setPoseLocked(locked) {
          this.cancel();
          this.m.setPositionLocked(locked);
          if (this.joystick) this.joystick.setEnabled(!locked);
          this._status(locked ? '已鎖定擺姿勢・直接拖曳身體部位調整動作，或拖拉地面圓圈平移' : '自由移動・拖曳搖桿或 WASD 走跑、拖拉腳下圓圈移動', locked ? 'locked' : 'move');
        }

        /** 以螢幕方向（右 +x、上 +y）踏出一步 */
        stepScreen(sx, sy) {
          if (this.m.isPoseLocked) return false;
          const a = this.getAzimuth();
          const c = Math.cos(a);
          const s = Math.sin(a);
          const d = this.stepDistance ?? 0.25 * this.m.unitScale;
          return this.m.step(sx * c - sy * s, -sx * s - sy * c, d);
        }

        undo() {
          return this.history ? this.history.undo(this.m) : false;
        }

        redo() {
          return this.history ? this.history.redo(this.m) : false;
        }

        /** 每幀呼叫：把搖桿與鍵盤輸入合併寫入 mannequin.joyInput */
        update(dt) {
          const m = this.m;
          const joy = this.joystick;
          let x = 0;
          let y = 0;
          if (!m.isPoseLocked && this.enabled) {
            if (joy && joy.active) {
              x = joy.value.x;
              y = joy.value.y;
              this._hold = 0;
            } else if (this.keyboardEnabled) {
              let kx = 0;
              let ky = 0;
              if (this._keys.has('KeyW')) ky += 1;
              if (this._keys.has('KeyS')) ky -= 1;
              if (this._keys.has('KeyA')) kx -= 1;
              if (this._keys.has('KeyD')) kx += 1;
              const now = performance.now();
              this._arrows.forEach((t0, code) => {
                if (now - t0 > 220) {
                  const d = ARROWS[code];
                  kx += d[0];
                  ky += d[1];
                }
              });
              if (kx || ky) {
                const l = Math.hypot(kx, ky);
                this._hold += dt;
                const ramp = clamp(0.42 + (this._hold / 0.65) * 0.5, 0.42, 0.92);
                x = (kx / l) * ramp;
                y = (ky / l) * ramp;
              } else this._hold = 0;
              if (joy) joy.show(x, y);
            }
          }
          m.joyInput.x = x;
          m.joyInput.y = y;
        }

        /** 取消所有拖曳（失焦、切換模式時） */
        cancel() {
          this._endGround();
          this._endLimb();
          this._keys.clear();
          this._arrows.clear();
          if (this.joystick) this.joystick.release();
        }

        dispose() {
          this.cancel();
          this.m.setHighlight(null);
          this.dom.removeEventListener('pointerdown', this._onDown);
          window.removeEventListener('pointermove', this._onMove);
          window.removeEventListener('pointerup', this._onUp);
          window.removeEventListener('pointercancel', this._onCancel);
          window.removeEventListener('blur', this._onCancel);
          window.removeEventListener('keydown', this._onKeyDown);
          window.removeEventListener('keyup', this._onKeyUp);
          if (this._vis) {
            this._vis.removeFromParent();
            this._ring.geometry.dispose();
            this._ring.material.dispose();
            this._lineGeo.dispose();
            this._line.material.dispose();
          }
        }

        // ---------------------------------------------------------------- 內部

        _status(text, mode = 'move') {
          if (this.onStatus) this.onStatus(text, mode);
        }

        _raycast(clientX, clientY) {
          const r = this.dom.getBoundingClientRect();
          this._ndc.set(((clientX - r.left) / Math.max(1, r.width)) * 2 - 1, -((clientY - r.top) / Math.max(1, r.height)) * 2 + 1);
          this._ray.setFromCamera(this._ndc, this.camera);
          return this._ray;
        }

        _pickTargets() {
          const m = this.m;
          if (m.isPoseLocked && this.limbDrag) return m.getPickTargets(this.groundDrag);
          return this.groundDrag ? m.groundMeshes.filter(() => m.groundHandle && m.groundHandle.visible) : [];
        }

        _pointerDown(e) {
          if (!this.enabled || e.button !== 0) return;
          const ray = this._raycast(e.clientX, e.clientY);
          const hits = ray.intersectObjects(this._pickTargets(), false);
          if (!hits.length) return;
          e.stopPropagation();
          const top = hits[0];
          if (top.object.userData.isGroundHandle) this._startGround(e);
          else this._startLimb(top, e);
        }

        _pointerMove(e) {
          if (this.isDraggingGround && e.pointerId === this._pid) return this._moveGround(e);
          if (this.isDraggingLimb && e.pointerId === this._pid) return this._moveLimb(e);
          if (!this.enabled || e.target !== this.dom) {
            this._hover(null, false);
            return undefined;
          }
          const hits = this._raycast(e.clientX, e.clientY).intersectObjects(this._pickTargets(), false);
          const top = hits[0];
          if (!top) this._hover(null, false);
          else if (top.object.userData.isGroundHandle) this._hover(null, true);
          else this._hover(top.object.userData.partId, false);
          return undefined;
        }

        _pointerUp(e) {
          if (e.pointerId !== this._pid) return;
          this._endGround();
          this._endLimb();
        }

        _hover(partId, ground) {
          const m = this.m;
          if (this.hoveredPart !== partId) {
            this.hoveredPart = partId;
            m.setHighlight(m.isPoseLocked ? partId : null);
          }
          m.setGroundHover(ground);
          if (!this.isDraggingGround && !this.isDraggingLimb) this.dom.style.cursor = partId || ground ? 'grab' : '';
        }

        _capture(e) {
          this._pid = e.pointerId;
          try {
            this.dom.setPointerCapture(e.pointerId);
          } catch (_) {
            /* 略過 */
          }
          if (this.orbit) this.orbit.enabled = false;
          this.dom.style.cursor = 'grabbing';
        }

        _release() {
          if (this._pid !== null) {
            try {
              if (this.dom.hasPointerCapture(this._pid)) this.dom.releasePointerCapture(this._pid);
            } catch (_) {
              /* 略過 */
            }
          }
          this._pid = null;
          if (this.orbit) this.orbit.enabled = true;
          this.dom.style.cursor = '';
        }

        // ---- 地面圓圈 ----
        _startGround(e) {
          const ray = this._raycast(e.clientX, e.clientY);
          if (!ray.ray.intersectPlane(this._plane0, this._hit)) return;
          const m = this.m;
          this.isDraggingGround = true;
          this._capture(e);
          m.stepState.active = false;
          m.setGroundDragging(true);
          this._grab.subVectors(m.root.position, this._hit).setY(0);
          this._lastGroundT = performance.now();
          this._status(`拖移地面圓圈中（Shift 吸附 ${this.snap} m 格線）`, 'dragging');
          if (this.onDragStart) this.onDragStart('ground');
        }

        _moveGround(e) {
          const m = this.m;
          if (!this._raycast(e.clientX, e.clientY).ray.intersectPlane(this._plane0, this._hit)) return;
          const wb = m.worldBounds;
          let x = clamp(this._hit.x + this._grab.x, -wb, wb);
          let z = clamp(this._hit.z + this._grab.z, -wb, wb);
          if (e.shiftKey && this.snap > 0) {
            x = clamp(Math.round(x / this.snap) * this.snap, -wb, wb);
            z = clamp(Math.round(z / this.snap) * this.snap, -wb, wb);
          }
          const now = performance.now();
          const dts = clamp((now - this._lastGroundT) / 1000, 0.008, 0.06);
          this._lastGroundT = now;
          const dx = x - m.root.position.x;
          const dz = z - m.root.position.z;
          m.root.position.x = x;
          m.root.position.z = z;
          if (!m.isPoseLocked) m.setExternalDragVelocity(dx / dts, dz / dts);
          this.snapping = Boolean(e.shiftKey);
        }

        _endGround() {
          if (!this.isDraggingGround) return;
          this.isDraggingGround = false;
          this.snapping = false;
          this._release();
          this.m.setGroundDragging(false);
          this._status(this.m.isPoseLocked ? '已鎖定擺姿勢・直接拖曳身體部位調整動作' : '自由移動', this.m.isPoseLocked ? 'locked' : 'move');
          if (this.onDragEnd) this.onDragEnd('ground');
        }

        // ---- 肢體 ----
        _startLimb(hit, e) {
          const T = this.THREE;
          const m = this.m;
          const d = hit.object.userData;
          const arm = d.side === 'L' ? m.leftArm : m.rightArm;
          const leg = d.side === 'L' ? m.leftLeg : m.rightLeg;
          const eff = {
            handIK: arm && arm.wristJoint,
            footIK: leg && leg.ankleJoint,
            head: m.headGroup,
            torso: m.torsoGroup,
            upperArm: arm && arm.elbowJoint,
            thigh: leg && leg.kneeJoint,
            pelvis: m.pelvisGroup
          }[d.dragType] || hit.object;
          m.isTransitioningPreset = false;
          this.isDraggingLimb = true;
          this._capture(e);
          const effPos = eff.getWorldPosition(new T.Vector3());
          const camDir = this.camera.getWorldDirection(new T.Vector3());
          this._dragPlane.setFromNormalAndCoplanarPoint(camDir.clone().negate(), hit.point);
          this._drag = {
            ...d,
            eff,
            target: effPos.clone(),
            last: hit.point.clone(),
            lx: e.clientX,
            ly: e.clientY,
            before: m.getPose(),
            feet: d.dragType === 'pelvis' ? [m.leftLeg.ankleJoint.getWorldPosition(new T.Vector3()), m.rightLeg.ankleJoint.getWorldPosition(new T.Vector3())] : null
          };
          m.setHighlight(d.partId);
          this._showVis(effPos, effPos);
          const ik = d.dragType === 'handIK' || d.dragType === 'footIK';
          this._status(`調整：${d.partName}（${ik ? 'IK 連動｜Shift 前後推拉深度' : d.dragType === 'pelvis' ? '上下拖曳蹲低（雙腳固定）｜Shift 傾斜' : 'FK 旋轉｜Shift 扭轉'}）`, 'dragging');
          if (this.onDragStart) this.onDragStart('limb', d);
        }

        _moveLimb(e) {
          const T = this.THREE;
          const m = this.m;
          const g = this._drag;
          const dx = e.clientX - g.lx;
          const dy = e.clientY - g.ly;
          g.lx = e.clientX;
          g.ly = e.clientY;
          const delta = new T.Vector3();
          if (this._raycast(e.clientX, e.clientY).ray.intersectPlane(this._dragPlane, this._hit)) {
            delta.subVectors(this._hit, g.last);
            g.last.copy(this._hit);
          }
          const fwd = this.camera.getWorldDirection(new T.Vector3());
          const p = m.pose;
          const viewSign = fwd.z <= 0 ? 1 : -1;
          const rot = 0.5;
          const cur = new T.Vector3();

          if (g.dragType === 'handIK' || g.dragType === 'footIK') {
            if (e.shiftKey) {
              const step = -dy * 0.0085;
              g.target.addScaledVector(fwd, step);
              this._dragPlane.translate(fwd.clone().multiplyScalar(step));
            } else g.target.add(delta);
            if (g.dragType === 'handIK') m.solveArmIK(g.side, g.target);
            else m.solveLegIK(g.side, g.target);
            g.eff.getWorldPosition(cur);
            this._showVis(g.target, cur);
            return;
          }
          if (g.dragType === 'pelvis') {
            if (e.shiftKey) {
              p.pelvisRotZ = clamp(num(p.pelvisRotZ) - dx * 0.45 * viewSign, -30, 30);
              p.pelvisRotX = clamp(num(p.pelvisRotX) + dy * 0.45, -35, 35);
            } else p.pelvisBounceY = clamp(num(p.pelvisBounceY) - dy * 0.0065, -0.65, 0.05);
            // 雙腳以 IK 固定在原位，骨盆往下時自然屈膝
            const keep = m.groundLock;
            m.groundLock = false;
            m.applyPoseToRig();
            m.solveLegIK('L', g.feet[0]);
            m.solveLegIK('R', g.feet[1]);
            m.groundLock = keep;
            m.applyPoseToRig();
          } else if (g.dragType === 'head') {
            if (e.shiftKey) p.headZ = clamp(num(p.headZ) - dx * rot * viewSign, -40, 40);
            else {
              p.headY = clamp(num(p.headY) + dx * rot, -75, 75);
              p.headX = clamp(num(p.headX) + dy * rot, -55, 55);
            }
            m.applyPoseToRig();
          } else if (g.dragType === 'torso') {
            if (e.shiftKey) p.torsoZ = clamp(num(p.torsoZ) - dx * rot * viewSign, -35, 35);
            else {
              p.torsoY = clamp(num(p.torsoY) + dx * rot, -55, 55);
              p.torsoX = clamp(num(p.torsoX) + dy * rot, -40, 60);
            }
            m.applyPoseToRig();
          } else if (g.dragType === 'upperArm') {
            const k = g.side === 'L' ? 'l' : 'r';
            const zr = g.side === 'L' ? [-35, 170] : [-170, 35];
            p[`${k}ShoulderZ`] = clamp(num(p[`${k}ShoulderZ`]) + dx * rot * viewSign, zr[0], zr[1]);
            p[`${k}ShoulderX`] = clamp(num(p[`${k}ShoulderX`]) + dy * rot * viewSign, -170, 85);
            m.applyPoseToRig();
          } else if (g.dragType === 'thigh') {
            const k = g.side === 'L' ? 'l' : 'r';
            const zr = g.side === 'L' ? [-30, 80] : [-80, 30];
            p[`${k}HipZ`] = clamp(num(p[`${k}HipZ`]) + dx * rot * viewSign, zr[0], zr[1]);
            p[`${k}HipX`] = clamp(num(p[`${k}HipX`]) + dy * rot * viewSign, -125, 75);
            m.applyPoseToRig();
          }
          g.eff.getWorldPosition(cur);
          this._showVis(cur, cur);
        }

        _endLimb() {
          if (!this.isDraggingLimb) return;
          const m = this.m;
          const g = this._drag;
          this.isDraggingLimb = false;
          this._drag = null;
          this._release();
          if (this._vis) this._vis.visible = false;
          if (this.history && g) {
            const now = m.getPose();
            if (Object.keys(now).some((k) => Math.abs(now[k] - num(g.before[k])) > 0.05)) this.history.push(g.before);
          }
          m.activeBasePose = m.getPose();
          m.setHighlight(this.hoveredPart);
          this._status('已鎖定擺姿勢・直接拖曳身體部位調整動作', 'locked');
          if (this.onDragEnd) this.onDragEnd('limb', g);
        }

        _showVis(ringPos, effPos) {
          if (!this._vis) return;
          this._vis.visible = true;
          this._ring.position.copy(ringPos);
          this._ring.quaternion.copy(this.camera.quaternion);
          this._ring.scale.setScalar(this.m.unitScale);
          this._lineGeo.setFromPoints([effPos, ringPos]);
        }

        // ---- 鍵盤 ----
        _keyDown(e) {
          const tag = e.target && e.target.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
          if (this.history && (e.ctrlKey || e.metaKey)) {
            if (e.code === 'KeyZ') {
              e.preventDefault();
              if (e.shiftKey) this.redo();
              else this.undo();
              return;
            }
            if (e.code === 'KeyY') {
              e.preventDefault();
              this.redo();
              return;
            }
          }
          if (!this.keyboardEnabled || !this.enabled || e.ctrlKey || e.metaKey || e.altKey) return;
          if (WASD.has(e.code)) this._keys.add(e.code);
          else if (ARROWS[e.code]) {
            e.preventDefault();
            if (e.repeat || this._arrows.has(e.code)) return;
            this._arrows.set(e.code, performance.now());
            const d = ARROWS[e.code];
            this.stepScreen(d[0], d[1]);
          }
        }

        _keyUp(e) {
          this._keys.delete(e.code);
          this._arrows.delete(e.code);
        }
      }

      const WASD = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD']);
      const ARROWS = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };


      return { MannequinControls, VirtualJoystick, PoseHistory };
    })();

    // ===========================================================================
    // 工作台應用程式：示範如何組合 核心 + 外型擴充 + 互動擴充
    // （WoodenMannequin / MannequinAppearance / MannequinControls / VirtualJoystick 由上方內嵌）
    // ===========================================================================
    const $ = (id) => document.getElementById(id);

    function createGridTexture(maxAniso) {
      const size = 1024;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const bg = ctx.createRadialGradient(size / 2, size / 2, 40, size / 2, size / 2, size * 0.72);
      bg.addColorStop(0, '#271f18');
      bg.addColorStop(0.55, '#1f1812');
      bg.addColorStop(1, '#16100c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, size, size);
      const ppm = size / 12;
      for (let p = 0; p <= size + 0.5; p += 0.25 * ppm) {
        const m = Math.abs(p - size / 2) / ppm;
        ctx.strokeStyle = Math.abs(m - Math.round(m)) < 0.01 ? 'rgba(251,191,36,0.17)' : 'rgba(255,255,255,0.048)';
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, size);
        ctx.moveTo(0, p);
        ctx.lineTo(size, p);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(251,191,36,0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(size / 2 - ppm * 0.35, size / 2);
      ctx.lineTo(size / 2 + ppm * 0.35, size / 2);
      ctx.moveTo(size / 2, size / 2 - ppm * 0.35);
      ctx.lineTo(size / 2, size / 2 + ppm * 0.35);
      ctx.stroke();
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = maxAniso;
      return t;
    }

    function initApp() {
      // ---------------- 場景 ----------------
      const container = $('canvas-container');
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x16110d, 0.022);
      const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
      camera.position.set(2.8, 2.75, 6.2);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      const orbit = new OrbitControls(camera, renderer.domElement);
      orbit.target.set(0, 1.15, 0);
      orbit.enableDamping = true;
      orbit.dampingFactor = 0.07;
      orbit.minDistance = 2;
      orbit.maxDistance = 18;
      orbit.maxPolarAngle = Math.PI * 0.492;
      orbit.update();

      scene.add(new THREE.HemisphereLight(0xfff5e4, 0x3b2d22, 1.05));
      const key = new THREE.DirectionalLight(0xffe7c4, 2.2);
      key.position.set(5, 9, 6);
      const fill = new THREE.DirectionalLight(0xcbd5e1, 0.8);
      fill.position.set(-6, 4, 3);
      const rim = new THREE.DirectionalLight(0xf59e0b, 1.15);
      rim.position.set(-3, 6, -6);
      scene.add(key, fill, rim);

      const maxAniso = renderer.capabilities.getMaxAnisotropy();
      const bench = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ map: createGridTexture(maxAniso), roughness: 0.82, metalness: 0.05 }));
      bench.rotation.x = -Math.PI / 2;
      scene.add(bench);
      const outer = new THREE.Mesh(new THREE.CircleGeometry(24, 64), new THREE.MeshStandardMaterial({ color: 0x18120e, roughness: 0.92 }));
      outer.rotation.x = -Math.PI / 2;
      outer.position.y = -0.002;
      scene.add(outer);

      // ---------------- 人偶：核心 + 外型擴充 ----------------
      const mannequin = new WoodenMannequin(THREE, {
        targetHeight: 2,
        moveMode: 'strafe',
        woodType: 'beech',
        defaultPose: 'raiseRight',
        worldBounds: 5.6,
        maxAnisotropy: maxAniso
      });
      const look = mannequin.use(new MannequinAppearance({ outfitColor: '#f4f1ea', hairColor: '#3b271c' }));
      scene.add(mannequin.root);

      // ---------------- 互動擴充 ----------------
      const controls = new MannequinControls({ THREE, mannequin, camera, domElement: renderer.domElement, orbitControls: orbit, scene });
      const joystick = new VirtualJoystick({
        parent: $('joy-slot'),
        size: 136,
        style: { position: 'relative', left: 'auto', bottom: 'auto' },
        onTap: (x, y) => controls.stepScreen(x, y)
      });
      controls.joystick = joystick;
      window.__app = { THREE, scene, camera, orbit, renderer, mannequin, look, controls, joystick };

      // ---------------- 介面同步 ----------------
      const SEG_ON = 'bg-amber-600 text-white font-bold shadow'.split(' ');
      const SEG_OFF = 'text-stone-300 font-semibold hover:text-white hover:bg-white/10'.split(' ');
      const seg = (btn, on) => {
        SEG_ON.forEach((c) => btn.classList.toggle(c, on));
        SEG_OFF.forEach((c) => btn.classList.toggle(c, !on));
      };
      const group = (sel, activeFn) => document.querySelectorAll(sel).forEach((b) => seg(b, activeFn(b)));

      const statusDot = $('status-dot');
      const statusMsg = $('status-msg');
      controls.onStatus = (text, mode) => {
        if (mode === 'move') text = mannequin.moveMode === 'strafe' ? '橫移模式：拖曳搖桿/WASD 走跑、方向鍵單步、拖拉腳下圓圈（Shift 吸附 0.25 m）' : '轉向模式：人偶自動轉向移動方向';
        statusMsg.textContent = text;
        statusDot.className = 'w-2.5 h-2.5 rounded-full shrink-0 ' + (mode === 'dragging' ? 'bg-emerald-300' : mode === 'locked' ? 'bg-emerald-400' : 'bg-amber-400');
      };
      controls.onDragStart = (kind) => {
        if (kind === 'ground') $('snap-badge').classList.toggle('hidden', !controls.snapping);
      };
      controls.onDragEnd = () => $('snap-badge').classList.add('hidden');

      const btnUndo = $('btn-undo');
      const btnRedo = $('btn-redo');
      controls.history.onChange = (h) => {
        btnUndo.disabled = !h.canUndo;
        btnRedo.disabled = !h.canRedo;
      };
      btnUndo.addEventListener('click', () => controls.undo());
      btnRedo.addEventListener('click', () => controls.redo());

      const hudMode = $('hud-mode-badge');
      function setMoveMode(mode) {
        mannequin.setMoveMode(mode);
        seg($('btn-movemode-strafe'), mode === 'strafe');
        seg($('btn-movemode-turn'), mode === 'turn');
        if (!mannequin.isPoseLocked) {
          hudMode.textContent = mode === 'strafe' ? '橫移模式 (Strafe)' : '轉向模式 (Turn)';
          hudMode.className = 'px-2 py-0.5 rounded-md text-[10.5px] font-bold border ' + (mode === 'strafe' ? 'bg-amber-600/30 text-amber-300 border-amber-400/30' : 'bg-sky-600/30 text-sky-300 border-sky-400/30');
          controls.onStatus('', 'move');
        }
      }
      function setLocked(locked) {
        controls.setPoseLocked(locked);
        const b = $('btn-toggle-lock');
        const onCls = ['bg-emerald-600', 'hover:bg-emerald-500', 'text-white', 'font-bold', 'border-emerald-300/50', 'shadow-lg'];
        const offCls = ['bg-stone-800/90', 'hover:bg-stone-700', 'text-stone-200', 'border-white/15'];
        onCls.forEach((c) => b.classList.toggle(c, locked));
        offCls.forEach((c) => b.classList.toggle(c, !locked));
        $('icon-lock-open').classList.toggle('hidden', locked);
        $('icon-lock-closed').classList.toggle('hidden', !locked);
        $('label-lock-btn').textContent = locked ? '已鎖定擺姿勢 (按 L 解除)' : '自由移動 / 鎖定擺姿勢 (L)';
        if (locked) {
          hudMode.textContent = '鎖定擺姿勢 (IK/FK)';
          hudMode.className = 'px-2 py-0.5 rounded-md text-[10.5px] font-bold bg-emerald-600/35 text-emerald-300 border border-emerald-400/35';
        } else setMoveMode(mannequin.moveMode);
      }
      $('btn-movemode-strafe').addEventListener('click', () => setMoveMode('strafe'));
      $('btn-movemode-turn').addEventListener('click', () => setMoveMode('turn'));
      $('btn-toggle-lock').addEventListener('click', () => setLocked(!mannequin.isPoseLocked));
      $('btn-release-mode').addEventListener('click', () => {
        mannequin.autoResetPose = !mannequin.autoResetPose;
        $('label-release-mode').textContent = mannequin.autoResetPose ? '放開回基準姿勢' : '放開定格當前步伐';
      });

      document.querySelectorAll('.quick-pose-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          controls.history.record(mannequin);
          mannequin.setPose(btn.dataset.pose, false);
          group('.quick-pose-btn', (b) => b === btn);
        });
      });
      document.querySelectorAll('.wood-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          mannequin.setWoodType(btn.dataset.wood);
          group('.wood-btn', (b) => b === btn);
        });
      });

      // 外型面板
      const drawer = $('appearance-drawer');
      const toggleDrawer = (force = null) => drawer.classList.toggle('hidden', force !== null ? !force : !drawer.classList.contains('hidden'));
      $('btn-toggle-drawer').addEventListener('click', () => toggleDrawer());
      $('btn-close-drawer').addEventListener('click', () => toggleDrawer(false));
      const L = MannequinAppearance.LABELS;
      const pickBtns = (sel, active, inactive, apply) => {
        document.querySelectorAll(sel).forEach((btn) => {
          btn.addEventListener('click', () => {
            apply(btn);
            document.querySelectorAll(sel).forEach((b) => (b.className = b === btn ? active : inactive));
          });
        });
      };
      const SEL_TXT = 'px-2 py-1.5 rounded-lg text-[11px] font-bold bg-amber-600 text-white shadow transition';
      const UNSEL_TXT = 'px-2 py-1.5 rounded-lg text-[11px] font-semibold bg-white/5 text-stone-300 hover:text-white hover:bg-white/10 transition';
      const SEL_DOT = 'w-6 h-6 rounded-full border-2 border-white ring-2 ring-amber-400 scale-110 transition';
      const UNSEL_DOT = 'w-6 h-6 rounded-full border border-white/25 hover:scale-110 transition';
      pickBtns('.outfit-btn', 'outfit-btn ' + SEL_TXT, 'outfit-btn ' + UNSEL_TXT, (b) => {
        look.set({ outfit: b.dataset.outfit });
        $('label-outfit-name').textContent = L[b.dataset.outfit];
      });
      pickBtns('.hair-btn', 'hair-btn ' + SEL_TXT, 'hair-btn ' + UNSEL_TXT, (b) => {
        look.set({ hairStyle: b.dataset.hair });
        $('label-hair-name').textContent = L[b.dataset.hair];
      });
      pickBtns('.outfit-color-btn', 'outfit-color-btn ' + SEL_DOT, 'outfit-color-btn ' + UNSEL_DOT, (b) => {
        look.set({ outfitColor: b.dataset.color });
        $('label-outfit-color').textContent = b.dataset.name;
      });
      pickBtns('.hair-color-btn', 'hair-color-btn ' + SEL_DOT, 'hair-color-btn ' + UNSEL_DOT, (b) => {
        look.set({ hairColor: b.dataset.color });
        $('label-hair-color').textContent = b.dataset.name;
      });

      // 鏡頭
      let follow = true;
      $('opt-follow-cam').addEventListener('change', (e) => (follow = e.target.checked));
      let camMove = null;
      const CAM = { classic: [2.8, 2.75, 6.2], front: [0, 2.1, 6.5], side: [6.5, 2.1, 0], back: [0, 2.1, -6.5] };
      document.querySelectorAll('.cam-preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const p = mannequin.root.position;
          const o = CAM[btn.dataset.cam];
          camMove = { pos: new THREE.Vector3(p.x + o[0], o[1], p.z + o[2]), target: new THREE.Vector3(p.x, 1.15, p.z) };
          group('.cam-preset-btn', (b) => b === btn);
        });
      });
      $('btn-reset-all').addEventListener('click', () => {
        controls.cancel();
        controls.history.record(mannequin);
        mannequin.reset();
        group('.quick-pose-btn', (b) => b.dataset.pose === 'raiseRight');
        group('.cam-preset-btn', (b) => b.dataset.cam === 'classic');
        camMove = { pos: new THREE.Vector3(2.8, 2.75, 6.2), target: new THREE.Vector3(0, 1.15, 0) };
      });

      // 快捷鍵（移動與復原由 MannequinControls 處理）
      addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || (e.target && e.target.tagName === 'INPUT')) return;
        if (e.code === 'KeyM') setMoveMode(mannequin.moveMode === 'strafe' ? 'turn' : 'strafe');
        else if (e.code === 'KeyL') setLocked(!mannequin.isPoseLocked);
        else if (e.code === 'KeyC') toggleDrawer();
        else if (e.key === 'Shift' && controls.isDraggingGround) $('snap-badge').classList.remove('hidden');
      });
      addEventListener('keyup', (e) => {
        if (e.key === 'Shift') $('snap-badge').classList.add('hidden');
      });

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      setMoveMode('strafe');

      // ---------------- 主迴圈 ----------------
      const clock = new THREE.Clock();
      const prev = new THREE.Vector3();
      const delta = new THREE.Vector3();
      const gait = $('gait-badge');
      const thrust = $('thrust-percent');
      let frames = 0;
      let acc = 0;
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        controls.update(dt);
        prev.copy(mannequin.root.position);
        const st = mannequin.update(dt, controls.getAzimuth());

        gait.textContent = st.stateLabel;
        thrust.textContent = `${st.thrustPercent}%`;
        gait.className = 'px-2 py-0.5 rounded-md text-[11px] font-bold transition ' + (
          st.stateLabel === '快跑' ? 'bg-amber-400 text-stone-950'
            : ['慢走', '單步跨步', '地面拖移', '減速'].includes(st.stateLabel) ? 'bg-amber-600 text-white'
              : ['已鎖定', '地面平移'].includes(st.stateLabel) ? 'bg-emerald-600 text-white' : 'bg-stone-700 text-stone-200');
        $('hud-speed-state').textContent = st.stateLabel;
        $('pos-x-readout').textContent = mannequin.root.position.x.toFixed(2);
        $('pos-z-readout').textContent = mannequin.root.position.z.toFixed(2);

        if (camMove) {
          const a = 1 - Math.exp(-8 * dt);
          camera.position.lerp(camMove.pos, a);
          orbit.target.lerp(camMove.target, a);
          if (camera.position.distanceTo(camMove.pos) < 0.02 && orbit.target.distanceTo(camMove.target) < 0.02) camMove = null;
        } else if (follow && !mannequin.isPoseLocked && !controls.isDraggingGround) {
          delta.subVectors(mannequin.root.position, prev);
          camera.position.add(delta);
          orbit.target.add(delta);
        }
        if (orbit.enabled) orbit.update();
        renderer.render(scene, camera);

        frames++;
        acc += dt;
        if (acc >= 0.3) {
          const fps = Math.round(frames / acc);
          const col = fps >= 50 ? '#34d399' : fps >= 30 ? '#fbbf24' : '#f87171';
          $('perf-fps').textContent = String(fps);
          $('perf-fps').style.color = col;
          $('fps-dot').style.background = col;
          $('perf-calls').textContent = String(renderer.info.render.calls);
          $('perf-tris').textContent = renderer.info.render.triangles.toLocaleString();
          frames = 0;
          acc = 0;
        }
      }
      animate();
    }

    addEventListener('load', () => {
      try {
        initApp();
      } catch (err) {
        console.error('初始化失敗:', err);
        const t = $('error-toast');
        t.textContent = 'WebGL 3D 環境啟動異常：' + err.message;
        t.classList.remove('hidden');
      }
    });

  </script>
</body>
</html>
