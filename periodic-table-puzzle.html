<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>週期表拼圖遊戲</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --accent-cyan: #00ffff;
            --accent-magenta: #ff00ff;
            --accent-yellow: #ffff00;
            --text-primary: #e0e6ff;
            --text-secondary: #8891b3;
            --success: #00ff88;
            --error: #ff3366;
            --glow-cyan: 0 0 20px rgba(0, 255, 255, 0.5);
            --glow-magenta: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1035 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta), var(--accent-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease 0.3s backwards;
        }

        .toggle-btn {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-cyan);
            color: var(--text-primary);
            padding: 15px 30px;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .toggle-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .toggle-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .toggle-btn:hover {
            border-color: var(--accent-magenta);
            box-shadow: var(--glow-cyan);
            transform: translateY(-2px);
        }

        .reset-btn {
            border-color: var(--accent-yellow);
        }

        .reset-btn:hover {
            border-color: var(--accent-magenta);
            box-shadow: var(--glow-magenta);
        }

        .ref-btn {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-color: var(--accent-magenta);
            opacity: 0.8;
            position: relative;
            padding-right: 35px;
        }

        .ref-btn::after {
            content: '↗';
            position: absolute;
            right: 12px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .ref-btn:hover {
            opacity: 1;
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-magenta);
        }

        .ref-btn:hover::after {
            opacity: 1;
        }

        .game-area {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            margin-bottom: 40px;
            animation: fadeIn 1s ease 0.5s backwards;
        }

        .draggable-elements {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-cyan);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.2);
        }

        .draggable-elements h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
            margin-bottom: 15px;
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 2px;
        }

        .mobile-hint {
            display: none;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 15px;
            padding: 8px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 8px;
            animation: fadeIn 1s ease;
        }

        @media (max-width: 768px) {
            .mobile-hint {
                display: block;
            }
        }

        .elements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 700px;
            overflow-y: auto;
            padding: 10px;
        }

        .elements-grid::-webkit-scrollbar {
            width: 8px;
        }

        .elements-grid::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 4px;
        }

        .elements-grid::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 4px;
        }

        .draggable-element {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(255, 0, 255, 0.2));
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            padding: 10px 6px;
            cursor: move;
            text-align: center;
            transition: all 0.3s ease;
            font-family: 'Space Mono', monospace;
            position: relative;
            overflow: hidden;
            min-height: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .draggable-element::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }

        .draggable-element:hover::before {
            left: 100%;
        }

        .draggable-element:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: var(--glow-cyan);
            border-color: var(--accent-magenta);
        }

        .draggable-element:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .element-number {
            position: absolute;
            bottom: 4px;
            left: 5px;
            font-size: 0.6rem;
            color: var(--accent-yellow);
            font-weight: 700;
        }

        .element-mass {
            position: absolute;
            top: 4px;
            left: 5px;
            font-size: 0.55rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .element-symbol {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Orbitron', sans-serif;
            line-height: 1.2;
        }

        .element-symbol.large {
            font-size: 1.6rem;
        }

        .element-symbol.small {
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .element-name {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 3px;
            line-height: 1.2;
        }

        .element-name.large {
            font-size: 1.2rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .element-name.small {
            font-size: 0.6rem;
        }

        .periodic-table {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-magenta);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(255, 0, 255, 0.2);
        }

        .periodic-table::-webkit-scrollbar {
            height: 8px;
        }

        .periodic-table::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 4px;
        }

        .periodic-table::-webkit-scrollbar-thumb {
            background: var(--accent-magenta);
            border-radius: 4px;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
        }

        .drop-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.65rem;
            transition: all 0.3s ease;
            position: relative;
            font-family: 'Space Mono', monospace;
            min-height: 70px;
            height: 70px;
        }

        .drop-zone.drag-over {
            background: rgba(0, 255, 255, 0.2);
            border-color: var(--accent-cyan);
            transform: scale(1.05);
            box-shadow: var(--glow-cyan);
        }

        .drop-zone.filled {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(255, 0, 255, 0.15));
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .drop-zone.correct {
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            animation: pulse 0.5s ease;
        }

        .drop-zone.incorrect {
            border-color: var(--error);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
            animation: shake 0.5s ease;
        }

        .drop-zone.auto-filled {
            background: linear-gradient(135deg, rgba(100, 100, 255, 0.2), rgba(150, 100, 255, 0.2));
            border-color: rgba(150, 100, 255, 0.6);
        }

        .lanthanide-placeholder {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid var(--accent-cyan);
            border-style: solid;
            cursor: default;
        }

        .lanthanide-cell {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(100, 200, 255, 0.15));
            border-color: rgba(0, 255, 255, 0.6);
        }

        .actinide-cell {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.15), rgba(255, 100, 200, 0.15));
            border-color: rgba(255, 0, 255, 0.6);
        }

        .series-label {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: none;
            background: transparent;
        }

        .spacer-row {
            min-height: 15px;
            height: 15px;
            border: none;
            background: transparent;
        }

        .empty-cell {
            background: transparent;
            border: none;
            min-height: 70px;
            height: 70px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .progress {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 15px;
            border: 2px solid var(--accent-yellow);
            animation: fadeIn 1s ease 0.7s backwards;
        }

        .progress-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--accent-yellow);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: var(--bg-primary);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--accent-cyan);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            to { left: 200%; }
        }

        .congrats {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--bg-secondary);
            border: 3px solid var(--accent-cyan);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 100px rgba(0, 255, 255, 0.5);
            transition: transform 0.5s ease;
        }

        .congrats.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .congrats h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta), var(--accent-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        @media (max-width: 1500px) {
            .game-area {
                grid-template-columns: 260px 1fr;
                gap: 20px;
            }

            .table-grid {
                gap: 2px;
            }
        }

        @media (max-width: 1200px) {
            .game-area {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .table-grid {
                gap: 3px;
            }

            .elements-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                max-height: 400px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 2rem;
                letter-spacing: 1px;
            }
            
            .subtitle {
                font-size: 0.9rem;
                letter-spacing: 1px;
            }

            .controls {
                gap: 10px;
            }

            .toggle-btn {
                padding: 12px 20px;
                font-size: 0.85rem;
            }

            .ref-btn {
                padding: 10px 30px 10px 15px;
                font-size: 0.8rem;
            }

            .ref-btn::after {
                right: 10px;
                font-size: 0.8rem;
            }

            .game-area {
                gap: 20px;
                margin-bottom: 30px;
            }

            .draggable-elements {
                padding: 15px;
                order: 2;
            }

            .draggable-elements h2 {
                font-size: 1.2rem;
            }

            .elements-grid {
                grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
                gap: 10px;
                max-height: 400px;
                padding: 5px;
            }

            .draggable-element {
                padding: 10px 6px;
                min-height: 70px;
                touch-action: none;
            }

            .periodic-table {
                padding: 15px;
                order: 1;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .table-grid {
                gap: 2px;
                min-width: 650px;
            }

            .drop-zone {
                min-height: 60px;
                height: 60px;
                font-size: 0.6rem;
            }

            .empty-cell {
                min-height: 60px;
                height: 60px;
            }

            .spacer-row {
                min-height: 10px;
                height: 10px;
            }

            .series-label div {
                font-size: 0.6rem !important;
            }

            .element-number {
                font-size: 0.55rem;
                bottom: 2px;
                left: 3px;
            }

            .element-mass {
                font-size: 0.5rem;
                top: 2px;
                left: 3px;
            }

            .element-symbol {
                font-size: 1rem;
            }

            .element-symbol.large {
                font-size: 1.3rem;
            }

            .element-symbol.small {
                font-size: 0.7rem;
            }

            .element-name {
                font-size: 0.6rem;
            }

            .element-name.large {
                font-size: 1rem;
            }

            .element-name.small {
                font-size: 0.55rem;
            }

            .progress {
                padding: 15px;
            }

            .progress-text {
                font-size: 1.2rem;
            }

            .progress-bar {
                height: 25px;
            }

            .congrats {
                padding: 30px 20px;
                width: 90%;
                max-width: 400px;
            }

            .congrats h2 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 0.75rem;
            }

            .toggle-btn {
                padding: 10px 15px;
                font-size: 0.75rem;
                letter-spacing: 0.5px;
            }

            .ref-btn {
                padding: 8px 28px 8px 12px;
                font-size: 0.7rem;
            }

            .ref-btn::after {
                right: 8px;
                font-size: 0.7rem;
            }

            .elements-grid {
                grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
                gap: 8px;
            }

            .draggable-element {
                padding: 8px 4px;
                min-height: 60px;
            }

            .table-grid {
                gap: 1px;
                min-width: 550px;
            }

            .drop-zone {
                min-height: 50px;
                height: 50px;
                border-width: 1px;
            }

            .empty-cell {
                min-height: 50px;
                height: 50px;
            }

            .spacer-row {
                min-height: 8px;
                height: 8px;
            }

            .lanthanide-placeholder {
                font-size: 0.6rem;
            }

            .series-label {
                font-size: 0.6rem;
            }

            .element-number {
                font-size: 0.5rem;
            }

            .element-mass {
                font-size: 0.45rem;
            }

            .element-symbol {
                font-size: 0.85rem;
            }

            .element-symbol.large {
                font-size: 1.1rem;
            }

            .element-symbol.small {
                font-size: 0.6rem;
            }

            .element-name {
                font-size: 0.55rem;
            }

            .element-name.large {
                font-size: 0.85rem;
            }

            .element-name.small {
                font-size: 0.5rem;
            }
        }

        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .draggable-element {
                cursor: grab;
            }

            .draggable-element:active {
                cursor: grabbing;
            }

            .drop-zone {
                min-height: 65px;
                height: 65px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>週期表拼圖遊戲</h1>
            <p class="subtitle">▸ PERIODIC TABLE PUZZLE ◂</p>
        </header>

        <div class="controls">
            <button class="toggle-btn" id="toggleLang">當前顯示：元素符號</button>
            <button class="toggle-btn reset-btn" id="resetBtn">重新開始</button>
            <a href="https://ptable.com/" target="_blank" rel="noopener noreferrer" class="toggle-btn ref-btn">Ptable</a>
            <a href="https://inl.gov/periodic-table/" target="_blank" rel="noopener noreferrer" class="toggle-btn ref-btn">inl.gov</a>
            <a href="https://zh.wikipedia.org/wiki/%E5%85%83%E7%B4%A0%E5%91%A8%E6%9C%9F%E8%A1%A8" target="_blank" rel="noopener noreferrer" class="toggle-btn ref-btn">Wiki</a>
        </div>

        <div class="game-area">
            <div class="draggable-elements">
                <h2>待拖曳元素 (1-30)</h2>
                <div class="mobile-hint">👆 點住元素並拖曳到正確位置</div>
                <div class="elements-grid" id="draggableElements"></div>
            </div>

            <div class="periodic-table">
                <div class="table-grid" id="periodicTable"></div>
            </div>
        </div>

        <div class="progress">
            <div class="progress-text">完成進度: <span id="progressText">0/30</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="congrats" id="congrats">
            <h2>🎉 恭喜完成！🎉</h2>
            <p style="font-size: 1.2rem; color: var(--text-secondary);">你已成功完成週期表拼圖！</p>
        </div>
    </div>

    <script>
        // 週期表完整資料 (1-118)
        // row: 1-7 為主週期表, row: 8 為鑭系, row: 9 為錒系
        const elements = [
            {num: 1, symbol: "H", name: "氫", mass: "1.008", row: 1, col: 1},
            {num: 2, symbol: "He", name: "氦", mass: "4.003", row: 1, col: 18},
            {num: 3, symbol: "Li", name: "鋰", mass: "6.941", row: 2, col: 1},
            {num: 4, symbol: "Be", name: "鈹", mass: "9.012", row: 2, col: 2},
            {num: 5, symbol: "B", name: "硼", mass: "10.81", row: 2, col: 13},
            {num: 6, symbol: "C", name: "碳", mass: "12.01", row: 2, col: 14},
            {num: 7, symbol: "N", name: "氮", mass: "14.01", row: 2, col: 15},
            {num: 8, symbol: "O", name: "氧", mass: "16.00", row: 2, col: 16},
            {num: 9, symbol: "F", name: "氟", mass: "19.00", row: 2, col: 17},

        // 創建可拖曳元素 (1-30) - 只顯示符號和名稱
        function createDraggableElements() {
            const container = document.getElementById('draggableElements');
            container.innerHTML = '';
            
            const draggableElements = elements.filter(el => el.num <= 30);
            
            // 隨機排序
            draggableElements.sort(() => Math.random() - 0.5);
            
            draggableElements.forEach(element => {
                const div = document.createElement('div');
                div.className = 'draggable-element';
                div.draggable = true;
                div.dataset.number = element.num;
                
                if (showChinese) {
                    // 顯示中文時：中文大在上，符號小在下
                    div.innerHTML = `
                        <div class="element-name large">${element.name}</div>
                        <div class="element-symbol small">${element.symbol}</div>
                    `;
                } else {
                    // 顯示符號時：符號大在上，中文小在下
                    div.innerHTML = `
                        <div class="element-symbol large">${element.symbol}</div>
                        <div class="element-name small">${element.name}</div>
                    `;
                }
                
                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragend', handleDragEnd);
                
                // Touch events for mobile
                div.addEventListener('touchstart', handleTouchStart, {passive: false});
                div.addEventListener('touchmove', handleTouchMove, {passive: false});
                div.addEventListener('touchend', handleTouchEnd, {passive: false});
                
                container.appendChild(div);
            });
        }

        // 創建週期表 - 完整顯示原子量和原子序
        function createPeriodicTable() {
            const table = document.getElementById('periodicTable');
            table.innerHTML = '';
            
            // 主週期表：7行18列
            for (let row = 1; row <= 7; row++) {
                for (let col = 1; col <= 18; col++) {
                    const element = elements.find(el => el.row === row && el.col === col);
                    
                    const cell = document.createElement('div');
                    
                    if (element) {
                        if (element.num <= 30) {
                            // 可拖曳的空格
                            cell.className = 'drop-zone';
                            cell.dataset.number = element.num;
                            cell.innerHTML = `<div style="color: var(--text-secondary); font-size: 0.6rem;">${element.num}</div>`;

                            cell.addEventListener('dragleave', handleDragLeave);
                            cell.addEventListener('drop', handleDrop);

        // 拖曳事件處理
        function handleDragStart(e) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', e.target.dataset.number);
            e.target.style.opacity = '0.5';
        }

        function handleDragEnd(e) {
            e.target.style.opacity = '1';
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
            return false;
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            e.preventDefault();
            
            const draggedNumber = e.dataTransfer.getData('text/plain');
            const dropZoneNumber = e.currentTarget.dataset.number;
            
            e.currentTarget.classList.remove('drag-over');
            
            // 檢查是否已經放過
            if (placedElements.has(dropZoneNumber)) {
                return false;
            }
            
            const element = elements.find(el => el.num == draggedNumber);
            
            // 檢查是否正確
            if (draggedNumber === dropZoneNumber) {
                // 正確
                e.currentTarget.classList.add('filled', 'correct');
                e.currentTarget.classList.remove('incorrect');
                
                if (showChinese) {
                    e.currentTarget.innerHTML = `
                        <div class="element-mass">${element.mass}</div>
                        <div class="element-name large">${element.name}</div>
                        <div class="element-symbol small">${element.symbol}</div>
                        <div class="element-number">${element.num}</div>
                    `;
                } else {
                    e.currentTarget.innerHTML = `
                        <div class="element-mass">${element.mass}</div>
                        <div class="element-symbol large">${element.symbol}</div>
                        <div class="element-name small">${element.name}</div>
                        <div class="element-number">${element.num}</div>
                    `;
                }
                
                // 移除拖曳元素
                const draggedElement = document.querySelector(`[data-number="${draggedNumber}"]`);
                if (draggedElement && draggedElement.classList.contains('draggable-element')) {
                    draggedElement.remove();
                }
                
                placedElements.add(dropZoneNumber);
                correctPlacements++;
                updateProgress();
                
                // 檢查是否完成
                if (correctPlacements === 30) {
                    setTimeout(showCongrats, 500);
                }
            } else {
                // 錯誤
                e.currentTarget.classList.add('incorrect');
                e.currentTarget.classList.remove('correct');
                setTimeout(() => {
                    e.currentTarget.classList.remove('incorrect');
                }, 500);
            }
            
            return false;
        }

        // Touch event handlers for mobile devices
        function handleTouchStart(e) {
            e.preventDefault();
            touchDragElement = e.currentTarget;
            touchDragElement.style.opacity = '0.7';
            touchDragElement.style.transform = 'scale(1.1)';
            touchDragElement.style.zIndex = '1000';
            touchDragElement.style.position = 'relative';
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!touchDragElement) return;

            const touch = e.touches[0];
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            
            // Remove all drag-over classes
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.classList.remove('drag-over');
            });

            // Add drag-over class to valid drop zone
            if (elementBelow && elementBelow.classList.contains('drop-zone') && 
                !elementBelow.classList.contains('filled') && elementBelow.dataset.number) {
                elementBelow.classList.add('drag-over');
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            if (!touchDragElement) return;

            const touch = e.changedTouches[0];
            const dropZone = document.elementFromPoint(touch.clientX, touch.clientY);

            // Reset dragged element style
            touchDragElement.style.opacity = '1';
            touchDragElement.style.transform = 'scale(1)';
            touchDragElement.style.zIndex = 'auto';

            // Remove all drag-over classes
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.classList.remove('drag-over');
            });

            if (dropZone && dropZone.classList.contains('drop-zone') && 
                !dropZone.classList.contains('filled') && dropZone.dataset.number) {
                
                const draggedNumber = touchDragElement.dataset.number;
                const dropZoneNumber = dropZone.dataset.number;

                // Check if already placed
                if (placedElements.has(dropZoneNumber)) {
                    touchDragElement = null;
                    return;
                }

                const element = elements.find(el => el.num == draggedNumber);

                // Check if correct
                if (draggedNumber === dropZoneNumber) {
                    // Correct
                    dropZone.classList.add('filled', 'correct');
                    dropZone.classList.remove('incorrect');

                    if (showChinese) {
                        dropZone.innerHTML = `
                            <div class="element-mass">${element.mass}</div>
                            <div class="element-name large">${element.name}</div>
                            <div class="element-symbol small">${element.symbol}</div>
                            <div class="element-number">${element.num}</div>
                        `;
                    } else {
                        dropZone.innerHTML = `
                            <div class="element-mass">${element.mass}</div>
                            <div class="element-symbol large">${element.symbol}</div>
                            <div class="element-name small">${element.name}</div>
                            <div class="element-number">${element.num}</div>
                        `;
                    }

                    // Remove dragged element
                    touchDragElement.remove();

                    placedElements.add(dropZoneNumber);
                    correctPlacements++;
                    updateProgress();

                    // Check if complete
                    if (correctPlacements === 30) {
                        setTimeout(showCongrats, 500);
                    }
                } else {
                    // Incorrect
                    dropZone.classList.add('incorrect');
                    dropZone.classList.remove('correct');
                    setTimeout(() => {
                        dropZone.classList.remove('incorrect');
                    }, 500);
                }
            }

            touchDragElement = null;
        }

        // 更新進度
        function updateProgress() {
            const percentage = (correctPlacements / 30) * 100;
            document.getElementById('progressText').textContent = `${correctPlacements}/30`;
            document.getElementById('progressFill').style.width = `${percentage}%`;
        }

        // 顯示恭喜訊息
        function showCongrats() {
            document.getElementById('congrats').classList.add('show');
            setTimeout(() => {
                document.getElementById('congrats').classList.remove('show');
            }, 3000);
        }

        // 切換語言
        document.getElementById('toggleLang').addEventListener('click', function() {
            showChinese = !showChinese;
            this.textContent = showChinese ? '當前顯示：中文名稱' : '當前顯示：元素符號';
            createDraggableElements();
            createPeriodicTable();
        });

        // 重新開始
        document.getElementById('resetBtn').addEventListener('click', function() {
            correctPlacements = 0;
            placedElements.clear();
            init();
        });

        // 啟動遊戲
        init();
    </script>
</body>
</html>
