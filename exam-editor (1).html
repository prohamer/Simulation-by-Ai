  <style>
    .exam-paper {
      font-family: "Times New Roman", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      line-height: 1.75;
      color: #1a202c;
    }
    .exam-paper h1 { font-size: 1.45rem; font-weight: bold; margin-bottom: 0.75rem; border-bottom: 2px solid #2d3748; padding-bottom: 0.25rem; }
    .exam-paper h2 { font-size: 1.25rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: #2b6cb0; }
    .exam-paper h3 { font-size: 1.1rem; font-weight: bold; margin-top: 0.8rem; margin-bottom: 0.4rem; }
    .exam-paper p { margin-bottom: 0.65rem; }
    .exam-paper ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 0.65rem; }
    .exam-paper ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 0.65rem; }
    .exam-paper hr { border: 0; border-top: 1px solid #a0aec0; margin: 1.25rem 0; }
    .exam-paper table { width: 100%; border-collapse: collapse; margin: 0.9rem 0; font-size: 0.95rem; }
    .exam-paper th, .exam-paper td { border: 1px solid #4a5568; padding: 6px 10px; text-align: center; }
    .exam-paper th { background-color: #edf2f7; font-weight: bold; }
    .exam-paper code { background: #edf2f7; padding: 0 4px; border-radius: 3px; font-size: 0.9em; }
    .exam-paper .katex { font-size: 1.05em; }

    .svg-preview-wrapper {
      position: relative;
      width: 100%;
      margin: 1rem 0;
      border: 1px dashed #cbd5e0;
      border-radius: 8px;
      padding: 8px;
      background: #fafafa;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .svg-preview-wrapper:hover { border-color: #3182ce; box-shadow: 0 4px 12px rgba(49, 130, 206, 0.15); }
    .svg-content { display: flex; justify-content: center; overflow-x: auto; }
    .svg-content svg { max-width: 100%; height: auto; }
    .svg-edit-badge { position: absolute; top: 10px; right: 10px; opacity: 0; transition: opacity 0.2s ease; z-index: 20; }
    .svg-preview-wrapper:hover .svg-edit-badge, .svg-edit-badge:focus-within { opacity: 1; }
    @media (hover: none) { .svg-edit-badge { opacity: 1; } }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .tool-btn.active { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; font-weight: 600; }

    /* 原始碼視窗收合 */
    #expand-rail { display: none; }
    #app-main.source-collapsed #editor-pane { display: none; }
    #app-main.source-collapsed #expand-rail { display: flex; }
    #app-main.source-collapsed #preview-pane { width: 100%; }
    .rail-label { writing-mode: vertical-rl; letter-spacing: 0.15em; }
    @media (max-width: 767px) { .rail-label { writing-mode: horizontal-tb; letter-spacing: normal; } }

    @media print {
      @page { size: A4; margin: 18mm; }
      html, body { background: #fff !important; height: auto !important; overflow: visible !important; }
      #app-header, #editor-pane, #expand-rail, #preview-toolbar, #toast, #svg-editor-modal, .svg-edit-badge { display: none !important; }
      #app-main, #preview-pane, #preview-scroll { display: block !important; overflow: visible !important; padding: 0 !important; width: 100% !important; height: auto !important; }
      #preview-paper { box-shadow: none !important; border: none !important; max-width: none !important; padding: 0 !important; min-height: 0 !important; }
      .svg-preview-wrapper { border: none !important; background: none !important; padding: 0 !important; box-shadow: none !important; }
      table, .svg-preview-wrapper { break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- 頂部功能列 -->
  <header id="app-header" class="bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap gap-2 items-center justify-between shrink-0 shadow-sm z-10">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-sm">理</div>
      <div>
        <h1 class="text-base font-bold text-slate-800 leading-tight">國中自然素養試題編輯器 & SVG 向量圖形工作台</h1>
        <p class="text-xs text-slate-500">Markdown ＋ KaTeX 數學式 ＋ 內嵌 SVG 視覺化編輯，可列印 / 匯出 Word</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button id="btn-load-sample" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-md border border-slate-300 transition">載入範例</button>
      <button id="btn-clear" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-md border border-slate-300 transition">清空</button>
      <button id="btn-copy-md" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-md border border-slate-300 transition">複製 Markdown</button>
      <button id="btn-print" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-md border border-slate-300 transition">列印 / 存 PDF</button>
      <button id="btn-export-docx" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-md shadow transition">匯出 Word (.docx)</button>
    </div>
  </header>

  <!-- 主工作區 -->
  <main id="app-main" class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <!-- 左：原始碼 -->
    <section id="editor-pane" class="h-2/5 md:h-auto md:w-1/2 flex flex-col border-b md:border-b-0 md:border-r border-slate-200 bg-white">
      <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-xs font-semibold text-slate-600 tracking-wider">Markdown & SVG 原始碼</span>
          <span id="char-count" class="text-[11px] text-slate-400">0 字元</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="hidden lg:block text-[11px] text-slate-400">數學式用 $…$ 或 $$…$$ ・ 自動暫存於本機</div>
          <button id="btn-collapse-source" type="button" class="px-2 py-0.5 text-[11px] text-slate-600 bg-white hover:bg-slate-200 border border-slate-300 rounded transition" title="收合原始碼視窗 (Ctrl+\)">
            <span class="hidden md:inline">◀ 收合</span><span class="md:hidden">▲ 收合</span>
          </button>
        </div>
      </div>
      <textarea id="markdown-input" spellcheck="false" class="w-full flex-1 p-4 font-mono text-xs sm:text-sm text-slate-800 resize-none outline-none custom-scroll leading-relaxed focus:bg-slate-50/50" placeholder="在此輸入題目 Markdown，可直接貼入 <svg>…</svg> 圖形，數學式以 $…$ 包住…"></textarea>
    </section>

    <!-- 收合後的展開側欄 -->
    <button id="expand-rail" type="button" title="展開原始碼視窗 (Ctrl+\)"
      class="shrink-0 items-center justify-center gap-1.5 bg-white hover:bg-blue-50 text-slate-600 hover:text-blue-700 text-xs font-medium border-b md:border-b-0 md:border-r border-slate-200 py-1.5 md:py-3 md:w-9 md:flex-col transition">
      <span class="hidden md:inline">▶</span><span class="md:hidden">▼</span>
      <span class="rail-label">原始碼</span>
    </button>

    <!-- 右：預覽 -->
    <section id="preview-pane" class="flex-1 md:w-1/2 flex flex-col bg-slate-100 overflow-hidden">
      <div id="preview-toolbar" class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-600 tracking-wider">試卷印刷預覽（模擬 A4）</span>
        <span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">雙擊圖形或點「編輯此圖」</span>
      </div>
      <div id="preview-scroll" class="flex-1 p-4 sm:p-6 overflow-y-auto custom-scroll flex justify-center">
        <div id="preview-paper" class="w-full max-w-2xl bg-white shadow-md rounded-md p-6 sm:p-10 exam-paper min-h-[842px] border border-slate-200 h-fit"></div>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    <span id="toast-message">操作成功</span>
  </div>

  <!-- SVG 畫布編輯器 -->
  <div id="svg-editor-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center hidden z-40 p-2 sm:p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-6xl h-[94vh] flex flex-col overflow-hidden border border-slate-300">

      <div class="bg-slate-800 text-white px-4 py-2.5 flex flex-wrap gap-2 items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
          <span class="bg-blue-500 text-white text-xs px-2 py-0.5 rounded font-bold">SVG 向量畫布</span>
          <h2 class="text-sm font-semibold">圖形視覺化編輯器</h2>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <button id="btn-editor-undo" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded transition disabled:opacity-40" title="復原 (Ctrl+Z)">↺ 復原</button>
          <button id="btn-editor-redo" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded transition disabled:opacity-40" title="重做 (Ctrl+Y)">↻ 重做</button>
          <span class="text-slate-500">|</span>
          <button id="btn-download-single-svg" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded transition">下載 SVG</button>

          <button id="btn-close-editor" class="text-slate-400 hover:text-white text-lg ml-1 px-1.5" title="關閉 (Esc)">✕</button>
        </div>
      </div>

      <div class="bg-slate-100 border-b border-slate-200 px-3 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0 text-xs text-slate-700">
        <div class="flex flex-wrap items-center gap-1">
          <span class="font-bold text-slate-500 mr-1">工具:</span>
          <button id="tool-select" class="tool-btn active px-2 py-1 bg-white hover:bg-slate-200 rounded border border-slate-300">選取</button>
          <button id="tool-text" class="tool-btn px-2 py-1 bg-white hover:bg-slate-200 rounded border border-slate-300">＋文字</button>
          <button id="tool-line" class="tool-btn px-2 py-1 bg-white hover:bg-slate-200 rounded border border-slate-300">＋直線</button>

          <button id="tool-rect" class="tool-btn px-2 py-1 bg-white hover:bg-slate-200 rounded border border-slate-300">＋方框</button>
          <button id="tool-circle" class="tool-btn px-2 py-1 bg-white hover:bg-slate-200 rounded border border-slate-300">＋圓點</button>
          <button id="tool-freehand" class="tool-btn px-2 py-1 bg-white hover:bg-slate-200 rounded border border-slate-300">✎ 手繪</button>
        </div>
        <div id="prop-controls" class="flex flex-wrap items-center gap-x-3 gap-y-1 bg-white px-3 py-1 rounded border border-slate-300">
          <div class="flex items-center gap-1">
            <span>文字</span>
            <input type="text" id="prop-text" class="border border-slate-300 rounded px-1.5 py-0.5 w-28 text-xs disabled:bg-slate-100" placeholder="未選取文字" disabled>
          </div>
          <div class="flex items-center gap-1">
            <span>線條色</span>
            <input type="color" id="prop-stroke" value="#1a202c" class="w-6 h-6 border-0 p-0 rounded cursor-pointer">
          </div>
          <div class="flex items-center gap-1">
            <span>填色</span>
            <input type="color" id="prop-fill" value="#ffffff" class="w-6 h-6 border-0 p-0 rounded cursor-pointer">
            <label class="flex items-center gap-0.5"><input type="checkbox" id="prop-nofill">無</label>
          </div>
          <div class="flex items-center gap-1">
            <span>線寬</span>
            <input type="number" id="prop-width" min="0" max="20" step="0.5" value="2" class="border border-slate-300 rounded px-1 py-0.5 w-14 text-xs">
          </div>
          <div class="flex items-center gap-1">
            <span>字級</span>
            <input type="number" id="prop-fontsize" min="6" max="72" value="14" class="border border-slate-300 rounded px-1 py-0.5 w-14 text-xs disabled:bg-slate-100" disabled>
          </div>
          <div class="flex items-center gap-1">
            <span>線型</span>
            <select id="prop-dash" class="border border-slate-300 rounded px-1 py-0.5 text-xs">

              <option value="dotted">點線</option>
            </select>
          </div>
          <button id="btn-delete-element" class="px-2 py-0.5 bg-red-100 hover:bg-red-200 text-red-700 rounded border border-red-300 font-medium">🗑 刪除</button>
        </div>
      </div>

      <div class="flex-1 bg-slate-200/80 p-4 flex overflow-auto custom-scroll">
        <div class="m-auto bg-white shadow-xl rounded border border-slate-300 overflow-hidden">
          <canvas id="fabric-canvas"></canvas>
        </div>
      </div>

      <div class="bg-slate-50 border-t border-slate-200 px-4 py-1.5 text-[11px] text-slate-500 flex flex-wrap gap-2 justify-between items-center">

        <div id="canvas-status">畫布尺寸: 650 × 420 px</div>
      </div>
    </div>
  </div>

---

### 【試題】

**1.（圖表判讀）**
依據圖(一)，兩條彈簧懸掛相同物重時，在物重為多少時兩彈簧的總長度相同？
(A) 0 gw
(B) 20 gw
(C) 40 gw
(D) 60 gw

**2.（彈簧伸長量的應用）**
將一個重量未知的物體掛在彈簧乙下端，靜止後彈簧乙的總長度為 $15.0\text{ cm}$。此物體的重量為下列何者？
(A) 70 gw
(B) 75 gw
(C) 140 gw
(D) 150 gw

**3.（科學解釋）**
關於彈簧甲、乙的敘述，下列何者正確？
(A) 受相同外力時，彈簧甲的伸長量比彈簧乙大
(B) 彈簧乙的伸長量 $\Delta x$ 與所受外力 $F$ 成正比
(C) 兩條彈簧的總長度 $L$ 都與所受外力 $F$ 成正比
(D) 圖(一)中兩直線的交點，代表此時兩條彈簧的伸長量相同

---

### 【參考答案與解析】

**答案：** 1.(C)　2.(A)　3.(B)

1. 由表(一)，物重 $40\text{ gw}$ 時兩彈簧總長度皆為 $12.0\text{ cm}$，即圖中兩直線的交點。
2. 彈簧乙原長 $8.0\text{ cm}$，每增加 $20\text{ gw}$ 伸長 $2.0\text{ cm}$。伸長量 $\Delta x = 15.0 - 8.0 = 7.0\text{ cm}$，故物重 $F = 7.0 \times 10 = 70\text{ gw}$。選 (C) 者誤用了彈簧甲的比例；選 (D) 者誤把總長度當成伸長量。
3. (A) 相同外力下，彈簧乙的伸長量較大；(C) 與外力成正比的是伸長量，而非總長度；(D) 交點代表總長度相同，此時甲伸長 $2.0\text{ cm}$、乙伸長 $4.0\text{ cm}$，伸長量並不相同。

      nu: 'ν', pi: 'π', rho: 'ρ', sigma: 'σ', tau: 'τ', phi: 'φ', varphi: 'φ', omega: 'ω',
      Gamma: 'Γ', Delta: 'Δ', Theta: 'Θ', Lambda: 'Λ', Pi: 'Π', Sigma: 'Σ', Phi: 'Φ', Omega: 'Ω',

    // ===================== Markdown 渲染 =====================

    function buildSvgWrapper(svgCode, idx) {

        const newId = prefix + el.id;

        el.id = newId;
      });
      if (!Object.keys(map).length) return;
      svgEl.querySelectorAll('*').forEach((el) => {
        Array.from(el.attributes).forEach((attr) => {
          let v = attr.value;
          let changed = false;
          v = v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => {
            if (map[id]) { changed = true; return 'url(#' + map[id] + ')'; }
            return m;
          });

        if (v) return v;
        const st = node.style && node.style.getPropertyValue(name);
        if (st) return st;
        if (node.tagName.toLowerCase() === 'svg') break;
        node = node.parentNode;

      return null;

    // Fabric.js 不支援 marker：把 <line> 的箭頭標記展開成實體三角形

      const markerFill = (id) => {
        const m = Array.from(svg.querySelectorAll('marker')).find((mk) => mk.id === id);
        if (!m) return null;
        const p = m.querySelector('[fill]');
        const f = p && p.getAttribute('fill');

        const tag = el.tagName.toLowerCase();

        const x1 = parseFloat(el.getAttribute('x1')) || 0;
        const y1 = parseFloat(el.getAttribute('y1')) || 0;
        const x2 = parseFloat(el.getAttribute('x2')) || 0;
        const y2 = parseFloat(el.getAttribute('y2')) || 0;
        const stroke = getInheritedAttr(el, 'stroke') || '#000000';
        const sw = parseFloat(getInheritedAttr(el, 'stroke-width')) || 1;
        const addHead = (ref, tx, ty, fx, fy) => {
          if (!ref || ref === 'none') return;
          const idMatch = ref.match(/#([^)'"\s]+)/);
          const fill = (idMatch && markerFill(idMatch[1])) || stroke;
          const ang = Math.atan2(ty - fy, tx - fx);

        (objects || []).forEach((obj) => {

        });

        resetHistory();

    // 匯出畫布為 SVG 字串；responsive=true 時給試卷用（寬度 100%）
    function exportCanvasSvg(responsive) {
      fabricCanvas.discardActiveObject();
      fabricCanvas.requestRenderAll();
      const raw = fabricCanvas.toSVG({
        suppressPreamble: true,
        width: canvasW,
        height: canvasH,
        viewBox: { x: 0, y: 0, width: canvasW, height: canvasH }
      });
      const doc = new DOMParser().parseFromString(raw, 'text/html');
      const svg = doc.querySelector('svg');
      if (!svg) return raw;
      svg.querySelectorAll('desc').forEach((d) => d.remove());
      svg.setAttribute('viewBox', '0 0 ' + canvasW + ' ' + canvasH);
      if (responsive) {
        svg.setAttribute('width', '100%');
        svg.removeAttribute('height');
        svg.setAttribute('style', 'max-width:' + canvasW + 'px;background-color:#ffffff;');
      } else {
        svg.setAttribute('width', canvasW);
        svg.setAttribute('height', canvasH);
      }

      return responsive ? str : '<?xml version="1.0" encoding="UTF-8"?>\n' + str;
    }

    // ===================== 屬性面板 =====================
    const isTextObj = (o) => !!o && (o.type === 'text' || o.type === 'i-text' || o.type === 'textbox');

    function forEachLeaf(obj, fn) {
      if (obj.type === 'group') {
        obj.getObjects().forEach((c) => forEachLeaf(c, fn));
        obj.dirty = true;
      } else {
        fn(obj);
      }
    }
    function applyToSelection(fn) {
      if (!fabricCanvas) return;
      const objs = fabricCanvas.getActiveObjects();
      if (!objs.length) return;
      objs.forEach((o) => forEachLeaf(o, fn));
      fabricCanvas.requestRenderAll();
    }

    function updatePropertyControls() {
      const objs = fabricCanvas.getActiveObjects();
      if (!objs.length) return resetPropertyControls();
      const single = objs.length === 1 ? objs[0] : null;

      if (single && isTextObj(single)) {
        propText.disabled = false;
        propText.value = single.text || '';
        propFontSize.disabled = false;
        propFontSize.value = Math.round(single.fontSize || 14);
      } else {
        propText.disabled = true;
        propText.value = '';
        propText.placeholder = objs.length > 1 ? '已選 ' + objs.length + ' 個物件' : '非文字物件';
        propFontSize.disabled = true;
      }

      let first = objs[0];
      if (first.type === 'group' && first.getObjects().length) first = first.getObjects()[0];
      const strokeHex = toHexColor(first.stroke);
      const fillHex = toHexColor(first.fill);
      if (isTextObj(first)) {
        if (fillHex) propStroke.value = fillHex;
      } else if (strokeHex) {
        propStroke.value = strokeHex;
      }
      propNoFill.checked = !fillHex;
      if (fillHex) propFill.value = fillHex;
      propWidth.value = first.strokeWidth != null ? first.strokeWidth : 1;

      const dash = first.strokeDashArray;
      if (!dash || !dash.length) propDash.value = 'solid';
      else if (dash[0] >= 6) propDash.value = 'dashed';
      else propDash.value = 'dotted';

      $('canvas-status').textContent = '已選取: ' + (single ? single.type : objs.length + ' 個物件') + '　畫布 ' + canvasW + ' × ' + canvasH;
    }

    function resetPropertyControls() {
      propText.value = '';
      propText.placeholder = '未選取文字';
      propText.disabled = true;
      propFontSize.disabled = true;
      $('canvas-status').textContent = '畫布尺寸: ' + canvasW + ' × ' + canvasH + ' px';
    }

    propText.addEventListener('input', (e) => {
      const o = fabricCanvas && fabricCanvas.getActiveObject();
      if (isTextObj(o)) { o.set('text', e.target.value); fabricCanvas.requestRenderAll(); }
    });
    propText.addEventListener('change', saveHistory);

    // 「線條色」：文字物件改字色、箭頭同時改線與箭頭、其他物件改線條
    propStroke.addEventListener('input', (e) => {
      const c = e.target.value;
      applyToSelection((o) => {
        if (isTextObj(o)) o.set('fill', c);
        else if (o.isArrow) o.set({ stroke: c, fill: c });
        else if (o.stroke && o.stroke !== 'none') o.set('stroke', c);
        else o.set('fill', c);
      });
      if (fabricCanvas && fabricCanvas.isDrawingMode) fabricCanvas.freeDrawingBrush.color = c;
    });
    propStroke.addEventListener('change', saveHistory);

    propFill.addEventListener('input', (e) => {
      propNoFill.checked = false;
      const c = e.target.value;
      applyToSelection((o) => { if (!isTextObj(o)) o.set('fill', c); });
    });
    propFill.addEventListener('change', saveHistory);

    propNoFill.addEventListener('change', (e) => {
      const c = e.target.checked ? '' : propFill.value;
      applyToSelection((o) => { if (!isTextObj(o) && !o.isArrow) o.set('fill', c); });
      saveHistory();
    });

    propWidth.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      if (!isFinite(v) || v < 0) return;
      applyToSelection((o) => { if (!isTextObj(o)) o.set('strokeWidth', v); });
      if (fabricCanvas && fabricCanvas.isDrawingMode) fabricCanvas.freeDrawingBrush.width = Math.max(1, v);
    });
    propWidth.addEventListener('change', saveHistory);

    propFontSize.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      const o = fabricCanvas && fabricCanvas.getActiveObject();
      if (isTextObj(o) && v > 0) { o.set('fontSize', v); fabricCanvas.requestRenderAll(); }
    });
    propFontSize.addEventListener('change', saveHistory);

    propDash.addEventListener('change', (e) => {
      const map = { solid: null, dashed: [8, 4], dotted: [3, 3] };
      applyToSelection((o) => { if (!isTextObj(o)) o.set('strokeDashArray', map[e.target.value]); });
      saveHistory();
    });

    // ===================== 刪除 =====================
    function deleteActiveObject() {
      if (!fabricCanvas) return;
      const active = fabricCanvas.getActiveObject();
      if (active && active.isEditing) return;
      const objs = fabricCanvas.getActiveObjects();
      if (!objs.length) return;
      fabricCanvas.discardActiveObject();
      objs.forEach((o) => fabricCanvas.remove(o));
      fabricCanvas.requestRenderAll();
      saveHistory();
      showToast('已刪除 ' + objs.length + ' 個物件');
    }
    $('btn-delete-element').addEventListener('click', deleteActiveObject);

    // ===================== 繪圖工具 =====================
    function addObject(obj) {
      fabricCanvas.isDrawingMode = false;
      setActiveToolBtn('tool-select');
      fabricCanvas.add(obj); // object:added 會自動記錄歷史
      fabricCanvas.setActiveObject(obj);
      fabricCanvas.requestRenderAll();
    }
    const cx = () => canvasW / 2, cy = () => canvasH / 2;

    $('tool-select').addEventListener('click', () => {
      if (!fabricCanvas) return;
      fabricCanvas.isDrawingMode = false;
      setActiveToolBtn('tool-select');
    });
    $('tool-text').addEventListener('click', () => {
      addObject(new fabric.IText('新文字標籤', {
        left: cx() - 40, top: cy() - 10, fontSize: 14, fill: '#1a202c',
        fontFamily: 'Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif'
      }));
      propText.focus();
      propText.select();
    });
    $('tool-line').addEventListener('click', () => {
      addObject(new fabric.Line([cx() - 100, cy(), cx() + 100, cy()], { stroke: '#2d3748', strokeWidth: 2 }));
    });
    $('tool-arrow').addEventListener('click', () => {
      // 單一路徑：直線＋封閉三角形，線與箭頭同色、可一起改色
      const arrow = new fabric.Path('M 0 6 L 110 6 M 120 6 L 106 0 L 106 12 Z', {
        left: cx() - 60, top: cy() - 6, stroke: '#2b6cb0', fill: '#2b6cb0', strokeWidth: 2, strokeLineJoin: 'miter'
      });
      arrow.isArrow = true;
      addObject(arrow);
    });
    $('tool-curve').addEventListener('click', () => {
      addObject(new fabric.Path('M 0 150 Q 100 0 300 -30', {
        left: cx() - 150, top: cy() - 90, fill: '', stroke: '#3182ce', strokeWidth: 2.5
      }));
    });
    $('tool-rect').addEventListener('click', () => {
      addObject(new fabric.Rect({
        left: cx() - 60, top: cy() - 35, width: 120, height: 70,
        fill: '#ffffff', stroke: '#4a5568', strokeWidth: 1.5, rx: 4, ry: 4
      }));
    });
    $('tool-circle').addEventListener('click', () => {
      addObject(new fabric.Circle({
        left: cx() - 5, top: cy() - 5, radius: 5, fill: '#e53e3e', stroke: '#c53030', strokeWidth: 1
      }));
    });
    $('tool-freehand').addEventListener('click', () => {
      if (!fabricCanvas) return;
      fabricCanvas.isDrawingMode = !fabricCanvas.isDrawingMode;
      if (fabricCanvas.isDrawingMode) {
        fabricCanvas.discardActiveObject();
        fabricCanvas.freeDrawingBrush.width = Math.max(1, parseFloat(propWidth.value) || 2);
        fabricCanvas.freeDrawingBrush.color = propStroke.value;
        setActiveToolBtn('tool-freehand');
        showToast('手繪模式：再按一次「手繪」或「選取」結束');
      } else {
        setActiveToolBtn('tool-select');
      }
    });
    function setActiveToolBtn(id) {
      document.querySelectorAll('#tool-select, #tool-freehand').forEach((b) => b.classList.remove('active'));
      const b = $(id);
      if (b) b.classList.add('active');
    }

    // ===================== 復原 / 重做 =====================
    function snapshot() { return JSON.stringify(fabricCanvas.toJSON(EXTRA_PROPS)); }
    function updateUndoButtons() {
      btnUndo.disabled = historyIndex <= 0;
      btnRedo.disabled = historyIndex >= history.length - 1;
    }
    function resetHistory() {
      history = [snapshot()];
      historyIndex = 0;
      updateUndoButtons();
    }
    function saveHistory() {
      if (suppressHistory || !fabricCanvas) return;
      const snap = snapshot();
      if (history[historyIndex] === snap) return;
      history = history.slice(0, historyIndex + 1);
      history.push(snap);
      if (history.length > 100) history.shift();
      historyIndex = history.length - 1;
      updateUndoButtons();
    }
    function restoreHistory(i) {
      suppressHistory = true;
      fabricCanvas.discardActiveObject();
      fabricCanvas.loadFromJSON(history[i], () => {
        fabricCanvas.getObjects().forEach((o) => o.set(HANDLE_STYLE));
        fabricCanvas.requestRenderAll();
        suppressHistory = false;
        historyIndex = i;
        updateUndoButtons();
        resetPropertyControls();
      });
    }
    function undo() { if (historyIndex > 0) restoreHistory(historyIndex - 1); else showToast('已是最初狀態'); }
    function redo() { if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1); else showToast('已是最新狀態'); }
    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    // ===================== 鍵盤快捷鍵 =====================
    window.addEventListener('keydown', (e) => {
      if (editorModal.classList.contains('hidden')) return;
      const tag = document.activeElement && document.activeElement.tagName;
      const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      const active = fabricCanvas && fabricCanvas.getActiveObject();
      if (active && active.isEditing) return; // 正在畫布上編輯文字
      const mod = e.ctrlKey || e.metaKey;
      if (e.key === 'Escape') { closeEditor(); return; }
      if (inField) return;
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteActiveObject(); }
      else if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (mod && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    });

    // ===================== 套用 / 下載 =====================
    $('btn-close-editor').addEventListener('click', closeEditor);

    $('btn-apply-svg-back').addEventListener('click', () => {
      if (currentEditingSvgIndex < 0 || !fabricCanvas) return;
      const newSvg = exportCanvasSvg(true);
      let i = 0;
      markdownInput.value = markdownInput.value.replace(SVG_REGEX, (m) => (i++ === currentEditingSvgIndex ? newSvg : m));
      renderMarkdown();
      closeEditor();
      showToast('已將編輯後的圖形更新至試卷');
    });

    $('btn-download-single-svg').addEventListener('click', () => {
      if (!fabricCanvas) return;
      const blob = new Blob([exportCanvasSvg(false)], { type: 'image/svg+xml;charset=utf-8' });
      saveAs(blob, 'exam_figure_' + Date.now() + '.svg');
      showToast('SVG 檔已下載');
    });

    $('btn-download-single-png').addEventListener('click', () => {
      if (!fabricCanvas) return;
      fabricCanvas.discardActiveObject();
      fabricCanvas.requestRenderAll();
      const url = fabricCanvas.toDataURL({ format: 'png', multiplier: 2 });
      const a = document.createElement('a');
      a.download = 'exam_figure_' + Date.now() + '.png';
      a.href = url;
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('高解析 PNG 已下載');
    });

    // ===================== 頂部按鈕 =====================
    $('btn-copy-md').addEventListener('click', async () => {
      const text = markdownInput.value;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        markdownInput.select();
        document.execCommand('copy');
      }
      showToast('已將 Markdown 複製至剪貼簿');
    });

    $('btn-load-sample').addEventListener('click', () => {
      if (markdownInput.value.trim() && markdownInput.value !== SAMPLE_MARKDOWN &&
          !confirm('載入範例會覆蓋目前的內容，確定嗎？')) return;
      markdownInput.value = SAMPLE_MARKDOWN;
      renderMarkdown();
      showToast('已載入範例題組');
    });

    $('btn-clear').addEventListener('click', () => {
      if (markdownInput.value.trim() && !confirm('確定要清空所有內容嗎？')) return;
      markdownInput.value = '';
      renderMarkdown();
      markdownInput.focus();
    });

    $('btn-print').addEventListener('click', () => window.print());

    // ===================== 匯出 Word =====================
    function svgToPng(svgNode, scale) {
      return new Promise((resolve, reject) => {
        let w = 0, h = 0;
        const vbAttr = (svgNode.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
        if (vbAttr.length === 4 && vbAttr[2] > 0 && vbAttr[3] > 0) { w = vbAttr[2]; h = vbAttr[3]; }
        if (!w || !h) {
          w = parseFloat(svgNode.getAttribute('width')) || 650;
          h = parseFloat(svgNode.getAttribute('height')) || 420;
        }
        const clone = svgNode.cloneNode(true);
        clone.setAttribute('xmlns', SVG_NS);
        clone.setAttribute('width', w);
        clone.setAttribute('height', h);
        clone.setAttribute('style', 'background-color:#ffffff');
        const str = new XMLSerializer().serializeToString(clone);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve({ dataUrl: canvas.toDataURL('image/png'), width: w, height: h });
        };
        img.onerror = reject;
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
      });
    }

    $('btn-export-docx').addEventListener('click', async () => {
      if (typeof htmlDocx === 'undefined') { showToast('Word 匯出元件載入失敗，請確認網路連線'); return; }
      showToast('正在轉換試卷與圖形…');
      const clone = previewPaper.cloneNode(true);
      clone.querySelectorAll('.svg-edit-badge').forEach((b) => b.remove());

      // 數學式 → 純文字近似
      clone.querySelectorAll('span.math').forEach((span) => {
        const display = span.getAttribute('data-display') === '1';
        const el = document.createElement(display ? 'p' : 'span');
        if (display) el.setAttribute('align', 'center');
        el.innerHTML = '<i>' + latexToWordHtml(span.getAttribute('data-latex') || '') + '</i>';
        span.replaceWith(el);
      });

      // SVG → PNG（以 width/height 屬性限制大小，Word 會忽略 CSS max-width）
      const MAX_W = 620;
      const wrappers = Array.from(clone.querySelectorAll('.svg-preview-wrapper'));
      for (const wrap of wrappers) {
        const svg = wrap.querySelector('svg');
        if (!svg) { wrap.remove(); continue; }
        try {
          const r = await svgToPng(svg, 2);
          const dispW = Math.min(MAX_W, Math.round(r.width));
          const dispH = Math.round(r.height * dispW / r.width);
          const p = document.createElement('p');
          p.setAttribute('align', 'center');
          const img = document.createElement('img');
          img.src = r.dataUrl;
          img.setAttribute('width', dispW);
          img.setAttribute('height', dispH);
          p.appendChild(img);
          wrap.replaceWith(p);
        } catch (err) {
          console.error('SVG → PNG 轉換失敗', err);
          wrap.remove();
        }
      }
      clone.querySelectorAll('[class]').forEach((el) => el.removeAttribute('class'));

      const contentHtml =
        '<!DOCTYPE html><html><head><meta charset="utf-8"><title>國中自然素養試題</title>' +
        '<style>' +
        'body{font-family:"Times New Roman","標楷體","Microsoft JhengHei",serif;font-size:12pt;line-height:1.6;}' +
        'h1{font-size:18pt;text-align:center;font-weight:bold;}' +
        'h2{font-size:14pt;color:#1e3a8a;}h3{font-size:13pt;}' +
        'table{width:100%;border-collapse:collapse;margin:12pt 0;}' +
        'th,td{border:1pt solid #333333;padding:4pt 6pt;text-align:center;}' +
        'th{background-color:#f1f5f9;font-weight:bold;}p{margin:0 0 6pt 0;}' +
        '</style></head><body>' + clone.innerHTML + '</body></html>';

      try {
        const blob = htmlDocx.asBlob(contentHtml, {
          orientation: 'portrait',
          margins: { top: 1080, right: 1080, bottom: 1080, left: 1080 }
        });
        saveAs(blob, '國中自然素養試題_' + new Date().toISOString().slice(0, 10) + '.docx');
        showToast('Word 檔已匯出（建議以 Word 桌面版開啟）', 3500);
      } catch (e) {
        console.error(e);
        showToast('匯出 Word 時發生錯誤');
      }
    });

    // ===================== 原始碼視窗收合 =====================
    const appMain = $('app-main');
    const COLLAPSE_KEY = 'science-exam-editor-source-collapsed';
    function setSourceCollapsed(collapsed) {
      appMain.classList.toggle('source-collapsed', collapsed);
      try { localStorage.setItem(COLLAPSE_KEY, collapsed ? '1' : '0'); } catch (e) { /* 略過 */ }
      if (!collapsed) markdownInput.focus({ preventScroll: true });
    }
    $('btn-collapse-source').addEventListener('click', () => setSourceCollapsed(true));
    $('expand-rail').addEventListener('click', () => setSourceCollapsed(false));
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === '\\' && editorModal.classList.contains('hidden')) {
        e.preventDefault();
        setSourceCollapsed(!appMain.classList.contains('source-collapsed'));
      }
    });
    try { if (localStorage.getItem(COLLAPSE_KEY) === '1') appMain.classList.add('source-collapsed'); } catch (e) { /* 略過 */ }

    // ===================== 啟動 =====================
    let debounceTimer;
    markdownInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderMarkdown, 250);
    });

    const draft = loadDraft();
    if (draft !== null && draft.trim()) {
      markdownInput.value = draft;
      renderMarkdown();
      showToast('已還原上次的編輯內容');
    } else {
      markdownInput.value = SAMPLE_MARKDOWN;
      renderMarkdown();
    }

    // 測試用掛鉤
    window.__examEditor = { renderMarkdown, openSvgEditor, exportCanvasSvg: (r) => exportCanvasSvg(r), latexToWordHtml, prepareSvgForFabric, get canvas() { return fabricCanvas; } };
  })();
  </script>
</body>
</html>
