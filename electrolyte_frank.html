      { id: 'NaCH3COO', name: '醋酸鈉 (強電解質)', formula: 'CH₃COONa', inputs: { Na: 1, CH3COO: 1 }, uiColor: 'bg-indigo-50' },

    ];

    const PRECIPITATES = [
      { id: 'AgCl', formula: 'AgCl', cat: 'Ag', catN: 1, an: 'Cl', anN: 1, ksp: 1.8e-10, color: 'rgb(243, 244, 246)' },
      { id: 'BaSO4', formula: 'BaSO₄', cat: 'Ba', catN: 1, an: 'SO4', anN: 1, ksp: 1.1e-10, color: 'rgb(248, 250, 252)' },
      { id: 'CaCO3', formula: 'CaCO₃', cat: 'Ca', catN: 1, an: 'CO3', anN: 1, ksp: 3.3e-9, color: 'rgb(245, 245, 244)' },
      { id: 'BaCO3', formula: 'BaCO₃', cat: 'Ba', catN: 1, an: 'CO3', anN: 1, ksp: 5.1e-9, color: 'rgb(244, 244, 245)' },
      { id: 'CaOH2', formula: 'Ca(OH)₂', cat: 'Ca', catN: 1, an: 'OH', anN: 2, ksp: 4.68e-6, color: 'rgb(240, 253, 244)' },
      { id: 'Ag2CrO4', formula: 'Ag₂CrO₄', cat: 'Ag', catN: 2, an: 'CrO4', anN: 1, ksp: 1.1e-12, color: 'rgb(153, 27, 27)' },
    ];

    // --- 核心演算法：化學平衡計算 ---
    function solvePrecipitation(ionA, countA, ionB, countB, ksp, vol, solidMoles) {
      let cA = ionA / vol, cB = ionB / vol;
      let Q = Math.pow(cA, countA) * Math.pow(cB, countB);
      if (Math.abs(Q - ksp) / ksp < 1e-4) return 0; 
      let minDelta, maxDelta;
      if (Q > ksp) {
        minDelta = 0; maxDelta = Math.min(ionA / countA, ionB / countB); 
      } else {
        if (solidMoles <= 0) return 0; 
        minDelta = -solidMoles; maxDelta = 0;
      }
      let delta = 0;
      for (let i = 0; i < 40; i++) {
        delta = (minDelta + maxDelta) / 2;
        let newCa = Math.max(0, (ionA - countA * delta) / vol);
        let newCb = Math.max(0, (ionB - countB * delta) / vol);
        let currentQ = Math.pow(newCa, countA) * Math.pow(newCb, countB);
        if (currentQ > ksp) minDelta = delta; else maxDelta = delta;
      }
      return delta;
    }

    function solveWeakAcid(HA, H, A, Ka, vol) {
      let cHA = HA / vol, cH = H / vol, cA = A / vol;
      let Q = cHA > 0 ? (cH * cA) / cHA : (cH > 0 && cA > 0 ? Infinity : 0);
      if (Math.abs(Q - Ka) / Ka < 1e-4) return 0;
      
      let minDelta, maxDelta;
      if (Q < Ka) {
        minDelta = 0; maxDelta = HA; 
      } else {
        minDelta = -Math.min(H, A); maxDelta = 0; 
      }
      
      let delta = 0;
      for (let i = 0; i < 40; i++) {
        delta = (minDelta + maxDelta) / 2;
        let nHA = Math.max(0, (HA - delta) / vol);
        let nH = Math.max(0, (H + delta) / vol);
        let nA = Math.max(0, (A + delta) / vol);
        let currentQ = nHA > 0 ? (nH * nA) / nHA : Infinity;
        if (currentQ < Ka) minDelta = delta; else maxDelta = delta;
      }
      return delta;
    }

    function calculateEquilibrium(totalAtoms, volume) {
      let species = { ...totalAtoms };
      let solids = {};
      PRECIPITATES.forEach(p => solids[p.id] = 0);
      let co2Generated = 0;

      // 確保所有物種都有初始值
      ['H', 'OH', 'CO3', 'HCO3', 'CH3COOH', 'CH3COO'].forEach(k => {
        if (!species[k]) species[k] = 0;
      });

      let changed = true;
      let iterations = 0;
      
      while (changed && iterations < 100) {
        changed = false;

        // A1. 強酸直接中和碳酸根：H⁺ + CO₃²⁻ → HCO₃⁻
        //     再進一步：H⁺ + HCO₃⁻ → H₂CO₃ → CO₂↑ + H₂O
        {
          // 第一步：H⁺ + CO₃²⁻ → HCO₃⁻
          let step1 = Math.min(species.H, species.CO3);
          if (step1 > 1e-8) {
            species.H   -= step1;
            species.CO3 -= step1;
            species.HCO3 = (species.HCO3 || 0) + step1;
            changed = true;
          }
          // 第二步：H⁺ + HCO₃⁻ → CO₂↑ + H₂O
          let step2 = Math.min(species.H, species.HCO3 || 0);
          if (step2 > 1e-8) {
            species.H    -= step2;
            species.HCO3 -= step2;
            co2Generated += step2;
            changed = true;
          }
        }

        // A2. 醋酸直接中和碳酸根：2 CH₃COOH + CO₃²⁻ → 2 CH₃COO⁻ + CO₂↑ + H₂O
        {
          let ch3coohCount = species.CH3COOH || 0;
          let co3Count = species.CO3 || 0;
          let lim = Math.min(ch3coohCount / 2, co3Count);
          if (lim > 1e-8) {
            species.CH3COOH -= lim * 2;
            species.CO3     -= lim;
            species.CH3COO   = (species.CH3COO || 0) + lim * 2;
            co2Generated    += lim;
            changed = true;
          }
        }

        // A3. 醋酸中和碳酸氫根：CH₃COOH + HCO₃⁻ → CH₃COO⁻ + CO₂↑ + H₂O
        //     (Ka_CH3COOH=1.8e-5 > Ka2_H2CO3=4.7e-11，反應可正向進行)
        {
          let ch3coohCount = species.CH3COOH || 0;
          let hco3Count = species.HCO3 || 0;
          let lim = Math.min(ch3coohCount, hco3Count);
          if (lim > 1e-8) {
            species.CH3COOH -= lim;
            species.HCO3    -= lim;
            species.CH3COO   = (species.CH3COO || 0) + lim;
            co2Generated    += lim;
            changed = true;
          }
        }

        // B. 碳酸根水解（顯著水解，不可忽略）
        //    B1: CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻  Kb1 = Kw/Ka2(H2CO3) = 1e-14/4.7e-11 ≈ 2.13e-4
        //    醋酸根水解 Kb = 1e-14/1.8e-5 ≈ 5.6e-10，極小，忽略不計（不模擬醋酸根水解）
        {
          const Kb1_CO3 = 2.13e-4;
          let co3  = species.CO3  || 0;
          let hco3 = species.HCO3 || 0;
          let oh   = species.OH   || 0;
          let delta = solveWeakAcid(co3, oh, hco3, Kb1_CO3, volume);
          if (Math.abs(delta) > 1e-8) {
            species.CO3  = Math.max(0, co3  - delta);
            species.OH   = Math.max(0, oh   + delta);
            species.HCO3 = Math.max(0, hco3 + delta);
            changed = true;
          }
        }

        // B2: HCO₃⁻ + H₂O ⇌ H₂CO₃ + OH⁻  Kb2 = Kw/Ka1(H2CO3) = 1e-14/4.3e-7 ≈ 2.33e-8
        //     H₂CO₃ 視為 CO₂(aq)，不穩定，立即逸出
        {
          const Kb2_HCO3 = 2.33e-8;
          let hco3 = species.HCO3 || 0;
          let oh   = species.OH   || 0;
          // 此步生成 H₂CO₃，直接視為 CO₂ 逸出，delta 量從 HCO₃⁻ 扣除，OH⁻ 增加
          // 用 solveWeakAcid 模擬：HA=HCO3, H=OH, A=CO2(用 co2Generated 追蹤)
          // 簡化：直接計算平衡位移
          let Q_hco3 = hco3 > 0 ? (oh / volume) * 1 / (hco3 / volume) : 0; // 簡化 Q
          // 只在有顯著 HCO3 時才計算第二步水解（數量較小）
          let lim2 = Math.min(hco3, oh) * Kb2_HCO3 * volume / (1 + Kb2_HCO3);
          if (lim2 > 1e-8) {
            species.HCO3 = Math.max(0, hco3 - lim2);
            species.OH   = Math.max(0, oh   + lim2);
            co2Generated += lim2;
            changed = true;
          }
        }

        // C. H⁺ 與 OH⁻ 中和：H⁺ + OH⁻ → H₂O
        {
          let h  = species.H  || 0;
          let oh = species.OH || 0;
          let lim = Math.min(h, oh);
          if (lim > 1e-8) {
            species.H  -= lim;
            species.OH -= lim;
            changed = true;
          }
        }

        // C2. OH⁻ 與 HCO₃⁻ 反應：OH⁻ + HCO₃⁻ → CO₃²⁻ + H₂O
        //     強鹼直接中和弱酸根，正向進行
        {
          let oh   = species.OH   || 0;
          let hco3 = species.HCO3 || 0;
          let lim  = Math.min(oh, hco3);
          if (lim > 1e-8) {
            species.OH   -= lim;
            species.HCO3 -= lim;
            species.CO3   = (species.CO3 || 0) + lim;
            changed = true;
          }
        }

        // D. 沉澱反應
        for (let p of PRECIPITATES) {
          let ionA = species[p.cat] || 0;
          let ionB = species[p.an]  || 0;
          let solid = solids[p.id]  || 0;
          let delta = solvePrecipitation(ionA, p.catN, ionB, p.anN, p.ksp, volume, solid);
          if (Math.abs(delta) > 1e-8) {
            species[p.cat] = Math.max(0, ionA - p.catN * delta);
            species[p.an]  = Math.max(0, ionB - p.anN * delta);
            solids[p.id]   = Math.max(0, solid + delta);
            changed = true;
          }
        }

        // E. 弱酸解離：CH₃COOH ⇌ H⁺ + CH₃COO⁻  (Ka = 1.8e-5)
        //    注意：醋酸根(CH3COO⁻)的水解 Kb = 5.6e-10，極小，此處不模擬
        {
          let ha = species.CH3COOH || 0;
          let h  = species.H       || 0;
          let a  = species.CH3COO  || 0;
          let kaDelta = solveWeakAcid(ha, h, a, 1.8e-5, volume);
          if (Math.abs(kaDelta) > 1e-8) {
            species.CH3COOH = Math.max(0, ha - kaDelta);
            species.H       = Math.max(0, h  + kaDelta);
            species.CH3COO  = Math.max(0, a  + kaDelta);
            changed = true;
          }
        }
        
        iterations++;
      }

      let totalPosCharge = 0;
      let totalNegCharge = 0;
      Object.keys(species).forEach(id => {
        let def = SPECIES_DEFS[id];
        let moles = species[id];
        if (def.charge > 0) totalPosCharge += moles * def.charge;
        if (def.charge < 0) totalNegCharge += moles * Math.abs(def.charge);
      });

      return { species, solids, co2Generated, totalPosCharge, totalNegCharge };
    }

    // --- 主應用元件 ---
    function App() {
      const [volume, setVolume] = useState(INITIAL_VOLUME); 
      const [addAmount, setAddAmount] = useState(0.5); 
      const [totalAtoms, setTotalAtoms] = useState({}); 
      const [draggedItem, setDraggedItem] = useState(null);
      
      // 新增：暫停狀態
      const [isPaused, setIsPaused] = useState(false);
      const isPausedRef = useRef(isPaused);
      const [guideOpen, setGuideOpen] = useState(false);

      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      
      const particlesRef = useRef([]); 
      // 掛到 window 方便 console 即時調整參數
      useEffect(() => {
        window._particlesRef = particlesRef;
        window._setDissocRange = (min, max) => {
          window._SIM.dissocMin = min;
          window._SIM.dissocMax = max;
          particlesRef.current.forEach(p => {
            if (p.type === 'CH3COOH' && p.dissocTimer !== undefined)
              p.dissocTimer = Math.floor(min + Math.random() * (max - min));
          });
          console.log(`dissocTimer 已設為 ${min}～${max} 幀（新生成粒子同步套用）`);
        };
        window._setCooldown = (frames) => {
          window._SIM.cooldown = frames;
          particlesRef.current.forEach(p => {
            if ((p.reactionCooldown||0) > frames) p.reactionCooldown = frames;
          });
          console.log(`reactionCooldown 已設為 ${frames} 幀（新生成粒子同步套用）`);
        };
        window._status = () => console.log('目前參數：', JSON.stringify(window._SIM));
      }, []); 
      const snowflakesRef = useRef([]); 
      const bubblesRef = useRef([]); 
      const visualSolidsRef = useRef({}); 
      const cumulativeCO2Ref = useRef(0); 
      const animationRef = useRef(null);

      const eqState = useMemo(() => calculateEquilibrium(totalAtoms, volume), [totalAtoms, volume]);

      // 同步暫停狀態到 Ref 供 renderLoop 存取
      useEffect(() => {
        isPausedRef.current = isPaused;
      }, [isPaused]);

      // 動畫觸發 (雪花與氣泡)
      useEffect(() => {
        const parent = containerRef.current;
        if (!parent) return;
        const canvasWidth = parent.clientWidth;
        const canvasHeight = parent.clientHeight;
        const waterTop = canvasHeight * (1 - volume / MAX_VOLUME);

        Object.keys(eqState.solids).forEach(pId => {
          const targetSolid = eqState.solids[pId];
          const currentVisSolid = visualSolidsRef.current[pId] || 0;
          
          if (targetSolid > currentVisSolid + 1e-4) {
            const diff = targetSolid - currentVisSolid;
            const flakeCount = Math.floor(diff / MOLES_PER_PARTICLE);
            const pDef = PRECIPITATES.find(p => p.id === pId);
            for (let i = 0; i < flakeCount; i++) {
              snowflakesRef.current.push({
                id: pId, color: pDef.color,
                x: 20 + Math.random() * (canvasWidth - 40),
                y: waterTop + Math.random() * (canvasHeight - waterTop) * 0.5, 
                vy: 1.5 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2,
                moles: MOLES_PER_PARTICLE
              });
            }
          } else if (targetSolid < currentVisSolid - 1e-4) {
            visualSolidsRef.current[pId] = targetSolid;
          }
        });

        if (eqState.co2Generated > cumulativeCO2Ref.current) {
          const diff = eqState.co2Generated - cumulativeCO2Ref.current;
          const bubbleCount = Math.floor(diff / MOLES_PER_PARTICLE) * 2; 
          for (let i = 0; i < bubbleCount; i++) {
            bubblesRef.current.push({
              x: 20 + Math.random() * (canvasWidth - 40),
              y: canvasHeight - 20, 
              vy: -2 - Math.random() * 2,
              radius: 3 + Math.random() * 4,
              phase: Math.random() * Math.PI * 2
            });
          }
          cumulativeCO2Ref.current = eqState.co2Generated;
        }
      }, [eqState.solids, eqState.co2Generated, volume]);

      // 粒子數量同步
      useEffect(() => {
        const currentParticles = particlesRef.current;
        const newParticles = [];
        const particlesByType = {};
        currentParticles.forEach(p => {
          if(!particlesByType[p.type]) particlesByType[p.type] = [];
          particlesByType[p.type].push(p);
        });

        Object.keys(SPECIES_DEFS).forEach(spId => {
          const moles = eqState.species[spId] || 0;
          let targetCount = Math.floor(moles / MOLES_PER_PARTICLE);

          // 教學視覺保障 1：醋酸動態解離——有醋酸分子就保持至少一組 H⁺ + CH₃COO⁻
          if (spId === 'H' || spId === 'CH3COO') {
            const hasVisibleAceticAcid = Math.floor((eqState.species['CH3COOH'] || 0) / MOLES_PER_PARTICLE) > 0;
            if (hasVisibleAceticAcid && targetCount === 0) {
              targetCount = 1;
            }
          }

          // 教學視覺保障 2：醋酸根水解——有醋酸根就保持至少一組 CH₃COOH + OH⁻
          if (spId === 'OH') {
            const hasAcetate = (eqState.species['CH3COO'] || 0) >= MOLES_PER_PARTICLE;
            if (hasAcetate && targetCount === 0) targetCount = 1;
          }
          if (spId === 'CH3COOH') {
            const hasAcetate = (eqState.species['CH3COO'] || 0) >= MOLES_PER_PARTICLE;
            const noExternalAcid = Math.floor((eqState.species['CH3COOH'] || 0) / MOLES_PER_PARTICLE) === 0;
            if (hasAcetate && noExternalAcid && targetCount === 0) targetCount = 1;
          }

          // 教學視覺保障 3：碳酸根水解——有 CO₃²⁻ 且無多餘 H⁺ 時，保持至少一組 HCO₃⁻ + OH⁻
          if (spId === 'HCO3' || spId === 'OH') {
            const hasCO3 = (eqState.species['CO3'] || 0) >= MOLES_PER_PARTICLE;
            const noExcessH = (eqState.species['H'] || 0) < MOLES_PER_PARTICLE;
            if (hasCO3 && noExcessH && targetCount === 0) targetCount = 1;
          }

          const existing = particlesByType[spId] || [];

          // 軟同步：只有弱酸動態平衡的物種需要緩衝（CH₃COOH ⇌ H⁺ + CH₃COO⁻）
          // H⁺、OH⁻、CO₃²⁻、HCO₃⁻ 嚴格同步，確保酸鹼中和後正確歸零
          const isReactive = ['CH3COO', 'CH3COOH'].includes(spId);
          const effectiveTarget = isReactive
            ? Math.max(targetCount, Math.min(existing.length, targetCount * 2 + 2))
            : targetCount;

          if (existing.length < effectiveTarget) {
            newParticles.push(...existing);
            const toAdd = effectiveTarget - existing.length;
            for(let i=0; i < toAdd; i++) {
                const w = containerRef.current?.clientWidth || 400;
                const h = containerRef.current?.clientHeight || 400;
                const waterTop = h * (1 - volume / MAX_VOLUME);
                newParticles.push({
                    id: Math.random().toString(36).substr(2, 9),
                    type: spId,
                    charge: SPECIES_DEFS[spId].charge,
                    x: 30 + Math.random() * (w - 60),
                    y: waterTop + 20 + Math.random() * (h - waterTop - 60),
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2
                });
            }
          } else {
            newParticles.push(...existing.slice(0, effectiveTarget));
          }
        });
        particlesRef.current = newParticles;
      }, [eqState.species, volume]);

      // Canvas 渲染與物理
      const flashRef = useRef([]); // 反應閃光特效 [{x,y,r,alpha,color}]

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let isRunning = true;
        let time = 0;

        // --- 動態反應規則 ---
        // 每條規則：碰撞時按 prob 機率觸發結合，生成 product 粒子
        // dissociate：product 粒子每幀以 dissocProb 機率自發解離回 reactants
        const REACTION_RULES = [
          {
            // 醋酸結合：H⁺ + CH₃COO⁻ → CH₃COOH  (Ka小，結合機率高)
            r1: 'H', r2: 'CH3COO', product: 'CH3COOH',
            prob: 0.35,
            dissocProb: 0.004,
            flashColor: '#6366f1'
          },
          {
            // 中和反應：H⁺ + OH⁻ → H₂O（強酸強鹼，結合機率極高，無產物粒子）
            r1: 'H', r2: 'OH', product: null,
            prob: 0.80,
            dissocProb: 0,
            flashColor: '#f59e0b'
          },
          {
            // OH⁻ 中和碳酸氫根：OH⁻ + HCO₃⁻ → CO₃²⁻ + H₂O
            // 結合後生成 CO₃²⁻，再水解回 HCO₃⁻ + OH⁻（動態循環）
            r1: 'OH', r2: 'HCO3', product: 'CO3',
            prob: 0.70,
            dissocProb: 0.015, // CO₃²⁻ 水解 Kb1≈2.13e-4，較快解離
            flashColor: '#f59e0b'
          },
          {
            // 醋酸根水解：OH⁻ + CH₃COOH → CH₃COO⁻ + H₂O
            r1: 'OH', r2: 'CH3COOH', product: null,
            prob: 0.20,
            dissocProb: 0,
            flashColor: '#10b981'
          },
        ];

        // 可由 console 即時調整的參數
        window._SIM = window._SIM || { cooldown: 20, dissocMin: 20, dissocMax: 25 };

        // 結合反應：移除兩粒子，在原位生成 product，給予隨機大速度飛離
        const combine = (particles, i, j, productType, x, y, color) => {
          const removed = new Set([i, j]);
          const next = particles.filter((_, idx) => !removed.has(idx));
          if (productType) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 4 + Math.random() * 2;
            const { cooldown, dissocMin, dissocMax } = window._SIM;
            // CO₃²⁻ 水解比醋酸解離快（Kb1≈2.13e-4 vs Ka=1.8e-5），給較短計時
            const timer = productType === 'CO3'
              ? Math.floor(5 + Math.random() * 5)   // 約 0.08~0.17 秒
              : Math.floor(dissocMin + Math.random() * (dissocMax - dissocMin));
            next.push({
              id: Math.random().toString(36).substr(2,9),
              type: productType,
              charge: SPECIES_DEFS[productType].charge,
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              reactionCooldown: cooldown,
              dissocTimer: timer,
            });
          }
          flashRef.current.push({ x, y, r: 18, alpha: 1.0, color });
          return next;
        };

        // 解離反應：移除 parent，兩個子粒子以相反方向飛出
        const dissociate = (particles, i, rule, x, y) => {
          const next = particles.filter((_, idx) => idx !== i);
          const angle = Math.random() * Math.PI * 2;
          const speed = 4 + Math.random() * 2;
          [rule.r1, rule.r2].forEach((t, idx) => {
            const dir = idx === 0 ? 1 : -1;
            next.push({
              id: Math.random().toString(36).substr(2,9),
              type: t,
              charge: SPECIES_DEFS[t].charge,
              x: x + Math.cos(angle) * dir * 16,
              y: y + Math.sin(angle) * dir * 16,
              vx: Math.cos(angle) * dir * speed,
              vy: Math.sin(angle) * dir * speed,
              reactionCooldown: 120,
              noAttractTimer: 180, // 3秒內不受異性吸引，先飛散到各處
            });
          });
          flashRef.current.push({ x, y, r: 22, alpha: 1.0, color: rule.flashColor });
          return next;
        };

        const resizeCanvas = () => {
          const parent = containerRef.current;
          if (parent) {
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
          }
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const renderLoop = () => {
          if (!isRunning) return;
          
          if (!isPausedRef.current) {
             time += 0.05;
          }
          
          const width = canvas.width;
          const height = canvas.height;
          const waterTop = height * (1 - volume / MAX_VOLUME);
          
          let solidTotalMoles = Object.values(visualSolidsRef.current).reduce((a, b) => a + b, 0);
          let solidBaseY = height - Math.min((solidTotalMoles / 1.0) * 40, height * 0.4);

          ctx.clearRect(0, 0, width, height);

          // 1. 物理與動態反應
          let particles = particlesRef.current;
          
          if (!isPausedRef.current) {
            // 1a. 移動與庫侖力
            for (let i = 0; i < particles.length; i++) {
              let p1 = particles[i];
              if (p1.reactionCooldown > 0) p1.reactionCooldown--;
              if (p1.noAttractTimer > 0) p1.noAttractTimer--;
              p1.vx += (Math.random() - 0.5) * THERMAL_JITTER;
              p1.vy += (Math.random() - 0.5) * THERMAL_JITTER;
              if (p1.y < waterTop) p1.vy += 0.5;

              for (let j = i + 1; j < particles.length; j++) {
                  let p2 = particles[j];
                  let dx = p2.x - p1.x; let dy = p2.y - p1.y;
                  let distSq = dx*dx + dy*dy;
                  let dist = Math.sqrt(distSq);
                  if (dist < 1) dist = 1;

                  // 庫侖力：若任一方處於 noAttractTimer，暫停異性吸引（只保留排斥）
                  const suppressAttract = (p1.noAttractTimer > 0) || (p2.noAttractTimer > 0);
                  let force;
                  if (suppressAttract && p1.charge * p2.charge < 0) {
                    force = 0; // 暫時關閉異性吸引，讓粒子靠熱運動散開
                  } else {
                    force = (K_COULOMB * p1.charge * p2.charge) / distSq;
                  }
                  let minDist = BASE_PARTICLE_RADIUS * 2.2;
                  if (dist < minDist) force += K_REPULSION * (minDist - dist);

                  let fx = (dx / dist) * force;
                  let fy = (dy / dist) * force;
                  p1.vx -= fx; p1.vy -= fy;
                  p2.vx += fx; p2.vy += fy;
              }

              p1.vx = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, p1.vx)) * FRICTION;
              p1.vy = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, p1.vy)) * FRICTION;
              p1.x += p1.vx; p1.y += p1.vy;

              if (p1.x < BASE_PARTICLE_RADIUS) { p1.x = BASE_PARTICLE_RADIUS; p1.vx *= -0.8; }
              if (p1.x > width - BASE_PARTICLE_RADIUS) { p1.x = width - BASE_PARTICLE_RADIUS; p1.vx *= -0.8; }
              if (p1.y > solidBaseY - BASE_PARTICLE_RADIUS) { p1.y = solidBaseY - BASE_PARTICLE_RADIUS; p1.vy *= -0.8; }
            }

            // 1b. 碰撞結合反應（每幀先 shuffle，每幀最多一次，確保公平隨機選粒子）
            const shuffled = [...particles];
            for (let k = shuffled.length - 1; k > 0; k--) {
              const m = Math.floor(Math.random() * (k + 1));
              [shuffled[k], shuffled[m]] = [shuffled[m], shuffled[k]];
            }
            outer: for (let rule of REACTION_RULES) {
              for (let si = 0; si < shuffled.length; si++) {
                let p1 = shuffled[si];
                if (p1.type !== rule.r1 || (p1.reactionCooldown||0) > 0) continue;
                for (let sj = 0; sj < shuffled.length; sj++) {
                  if (si === sj) continue;
                  let p2 = shuffled[sj];
                  if (p2.type !== rule.r2 || (p2.reactionCooldown||0) > 0) continue;
                  let dx = p2.x - p1.x, dy = p2.y - p1.y;
                  let dist = Math.sqrt(dx*dx + dy*dy);
                  if (dist < BASE_PARTICLE_RADIUS * 2.8 && Math.random() < rule.prob) {
                    let mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
                    const oi = particles.findIndex(p => p.id === p1.id);
                    const oj = particles.findIndex(p => p.id === p2.id);
                    if (oi !== -1 && oj !== -1) {
                      particles = combine(particles, oi, oj, rule.product, mx, my, rule.flashColor);
                      particlesRef.current = particles;
                    }
                    break outer;
                  }
                }
              }
            }

            // 1c. 自發解離（每幀最多一次，隨機順序避免偏向同一顆）
            const dissocCandidates = [];
            for (let i = 0; i < particles.length; i++) {
              let p = particles[i];
              if ((p.reactionCooldown||0) > 0) continue;
              const rule = REACTION_RULES.find(r => r.product === p.type && r.dissocProb > 0);
              if (!rule) continue;
              if (p.dissocTimer !== undefined) {
                p.dissocTimer--;
                if (p.dissocTimer <= 0) dissocCandidates.push({ i, rule });
              }
            }
            if (dissocCandidates.length > 0) {
              // 隨機挑一顆解離
              const pick = dissocCandidates[Math.floor(Math.random() * dissocCandidates.length)];
              const p = particles[pick.i];
              particles = dissociate(particles, pick.i, pick.rule, p.x, p.y);
              particlesRef.current = particles;
            }
          }

          // 繪製閃光特效
          const activeFlash = [];
          for (let f of flashRef.current) {
            f.alpha -= 0.07;
            if (f.alpha > 0) {
              ctx.beginPath();
              ctx.arc(f.x, f.y, f.r * (1.5 - f.alpha), 0, Math.PI*2);
              ctx.strokeStyle = f.color + Math.floor(f.alpha*255).toString(16).padStart(2,'0');
              ctx.lineWidth = 2.5;
              ctx.stroke();
              activeFlash.push(f);
            }
          }
          flashRef.current = activeFlash;

          // 繪製粒子
          for (let p of particles) {
            const def = SPECIES_DEFS[p.type];
            ctx.font = 'bold 11px sans-serif';
            let textWidth = ctx.measureText(def.symbol).width;
            let radius = Math.max(BASE_PARTICLE_RADIUS, (textWidth/2) + 4); 

            ctx.beginPath();
            if(radius > BASE_PARTICLE_RADIUS) {
                ctx.roundRect(p.x - radius, p.y - BASE_PARTICLE_RADIUS, radius*2, BASE_PARTICLE_RADIUS*2, BASE_PARTICLE_RADIUS);
            } else {
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            }
            ctx.fillStyle = def.bg;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = def.color;
            ctx.stroke();

            ctx.fillStyle = def.color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(def.symbol, p.x, p.y);
          }

          // 2. 沉澱雪花
          const activeSnowflakes = [];
          for (let s of snowflakesRef.current) {
            if (!isPausedRef.current) {
              s.y += s.vy;
              s.x += Math.sin(time * 2 + s.phase) * 0.5; 
            }
            
            if (!isPausedRef.current && s.y >= solidBaseY) {
               visualSolidsRef.current[s.id] = (visualSolidsRef.current[s.id] || 0) + s.moles;
            } else {
               ctx.beginPath();
               ctx.arc(s.x, s.y, 4, 0, Math.PI*2);
               ctx.fillStyle = s.color;
               ctx.fill();
               ctx.strokeStyle = 'rgba(0,0,0,0.2)';
               ctx.stroke();
               activeSnowflakes.push(s);
            }
          }
          snowflakesRef.current = activeSnowflakes;

          // 3. 氣體氣泡
          const activeBubbles = [];
          for (let b of bubblesRef.current) {
            if (!isPausedRef.current) {
              b.y += b.vy;
              b.x += Math.sin(time * 3 + b.phase) * 1.0;
            }
            
            if (!isPausedRef.current && b.y <= waterTop) {
               // 氣泡逸散，不再推入 active 陣列
            } else {
               ctx.beginPath();
               ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
               ctx.fillStyle = 'rgba(255,255,255,0.6)';
               ctx.fill();
               ctx.strokeStyle = 'rgba(255,255,255,0.9)';
               ctx.stroke();
               activeBubbles.push(b);
            } 
          }
          bubblesRef.current = activeBubbles;

          animationRef.current = requestAnimationFrame(renderLoop);
        };

        renderLoop();

        return () => {
          isRunning = false;
          cancelAnimationFrame(animationRef.current);
          window.removeEventListener('resize', resizeCanvas);
        };
      }, [volume]);

      const handleReset = () => {
        setTotalAtoms({});
        setVolume(INITIAL_VOLUME);
        visualSolidsRef.current = {};
        cumulativeCO2Ref.current = 0;
        particlesRef.current = [];
        snowflakesRef.current = [];
        bubblesRef.current = [];
        flashRef.current = [];
        setIsPaused(false);
      };

      const handleAddElectrolyte = (electrolyteId) => {
        const el = ELECTROLYTES.find(e => e.id === electrolyteId);
        if (!el) return;
        setTotalAtoms(prev => {
          const next = { ...prev };
          Object.entries(el.inputs).forEach(([spId, count]) => {
            next[spId] = (next[spId] || 0) + count * addAmount;
          });
          return next;
        });
      };

      const onDragStart = (e, id) => { e.dataTransfer.setData('text/plain', id); setDraggedItem(id); };
      const onDragOver = (e) => e.preventDefault();
      const onDrop = (e) => { e.preventDefault(); handleAddElectrolyte(e.dataTransfer.getData('text/plain')); setDraggedItem(null); };

      const formatNum = (num) => {
        const str = num.toExponential(2);
        const [coef, exp] = str.split('e');
        const expNum = parseInt(exp, 10);
        if (expNum === 0) return <span>{coef}</span>;
        return <span>{coef}×10<sup>{expNum}</sup></span>;
      };
      const maxCharge = Math.max(eqState.totalPosCharge, eqState.totalNegCharge, 0.1);
      const posHeight = (eqState.totalPosCharge / maxCharge) * 100;
      const negHeight = (eqState.totalNegCharge / maxCharge) * 100;

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 font-sans p-4 md:p-6 flex flex-col">
          <header className="mb-4 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div className="flex items-center gap-3">
              <IconFlaskConical className="w-8 h-8 text-indigo-600" />
              <h1 className="text-2xl font-bold text-slate-800">微觀水溶液平衡 (弱酸動態視覺版)</h1>
            </div>
          </header>

          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            {/* 左側面板 */}
            <div className="lg:col-span-3 flex flex-col gap-4">
              <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                <h2 className="text-md font-bold mb-2 flex items-center gap-2"><IconDroplet className="w-5 h-5 text-blue-500"/> 設定與加入量</h2>
                <div className="mb-2">
                  <label className="block text-sm font-medium text-slate-700 mb-1">水量: {volume.toFixed(1)} L</label>
                  <input type="range" min="1.0" max={MAX_VOLUME} step="0.5" value={volume} onChange={(e) => setVolume(parseFloat(e.target.value))} className="w-full accent-blue-500" />
                </div>
                <div className="grid grid-cols-3 gap-1">
                  {[0.1, 0.5, 1.0].map(amt => (
                    <button key={amt} className={`py-0.5 text-sm rounded border ${addAmount === amt ? 'bg-indigo-100 border-indigo-400 font-bold' : 'bg-white hover:bg-slate-50'}`} onClick={() => setAddAmount(amt)}>{amt} mol</button>
                  ))}
                </div>
              </div>

              <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-200 flex-1 overflow-y-auto">
                <h2 className="text-md font-bold mb-2 flex items-center gap-2"><IconMousePointer2 className="w-5 h-5 text-indigo-500"/> 化學藥品區</h2>
                <div className="grid grid-cols-2 gap-1">
                  {ELECTROLYTES.map(el => (
                    <div 
                      key={el.id} draggable onDragStart={(e) => onDragStart(e, el.id)} onClick={() => handleAddElectrolyte(el.id)}
                      className={`px-1 py-1 border border-dashed border-slate-300 rounded cursor-grab hover:border-indigo-400 flex flex-col items-center justify-center gap-0.5 ${el.uiColor}`}
                    >
                      <span className="font-bold text-slate-800 text-sm text-center">{el.formula}</span>
                      <span className="text-[10px] text-slate-600 text-center">{el.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* 中央 Canvas */}
            <div className="lg:col-span-5 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 p-4 relative min-h-[500px]">
              <div className="flex justify-between items-center mb-2">
                <h2 className="text-lg font-bold text-slate-800">微觀互動燒杯</h2>
                <div className="flex gap-2">
                  <button 
                    onClick={() => setIsPaused(!isPaused)} 
                    className={`flex items-center gap-1 text-sm px-3 py-1.5 rounded-md transition-colors ${isPaused ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 font-medium'}`}
                  >
                    {isPaused ? <IconPlay className="w-4 h-4" /> : <IconPause className="w-4 h-4" />}
                    {isPaused ? '繼續' : '暫停'}
                  </button>
                  <button onClick={handleReset} className="flex items-center gap-1 text-sm text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md transition-colors font-medium">
                    <IconRefreshCcw className="w-4 h-4" /> 清空
                  </button>
                </div>
              </div>
              
              <div 
                className={`flex-1 relative border-b-8 border-l-8 border-r-8 border-slate-300 rounded-b-[40px] overflow-hidden ${draggedItem ? 'bg-indigo-50/50' : 'bg-transparent'}`}
                onDragOver={onDragOver} onDrop={onDrop} ref={containerRef} style={{ width: '90%', margin: '0 auto' }}
              >
                <div className="absolute bottom-0 w-full bg-blue-400/20 border-t border-blue-400/40" style={{ height: `${(volume / MAX_VOLUME) * 100}%` }} />
                <div className="absolute bottom-0 left-0 w-full flex flex-col justify-end z-10 pointer-events-none">
                  {Object.entries(eqState.solids).map(([pId, moles]) => {
                    if (moles < 1e-4) return null;
                    const pDef = PRECIPITATES.find(p => p.id === pId);
                    const h = Math.min((moles / 1.0) * 40, 150); 
                    return (
                      <div key={pId} className="w-full flex items-center justify-center border-t border-black/10 overflow-hidden transition-all duration-300" style={{ height: `${h}px`, backgroundColor: pDef.color }}>
                        <span className="text-xs font-bold text-black/50">{pDef.formula}</span>
                      </div>
                    );
                  })}
                </div>
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-20" />
                

              </div>
            </div>

            {/* 右側分析 */}
            <div className="lg:col-span-4 flex flex-col gap-4">
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 className="text-md font-bold mb-3 flex items-center gap-2"><IconScale className="w-5 h-5 text-emerald-600"/> 電中性與教學亮點</h2>
                <div className="flex items-center gap-3 mt-2">
                  <div className="flex-1 bg-slate-50 rounded-lg p-2 flex flex-col items-center gap-1">
                    <span className="text-xs text-slate-500">陽電荷(+)</span>
                    <span className="text-lg font-bold text-blue-600">{eqState.totalPosCharge.toFixed(2)}</span>
                    <div className="w-full bg-slate-200 rounded-full h-2">
                      <div className="bg-blue-500 h-2 rounded-full transition-all" style={{ width: `${posHeight}%`, minWidth: '4px' }}></div>
                    </div>
                  </div>
                  <div className="text-slate-400 font-bold text-sm">=</div>
                  <div className="flex-1 bg-slate-50 rounded-lg p-2 flex flex-col items-center gap-1">
                    <span className="text-xs text-slate-500">陰電荷(-)</span>
                    <span className="text-lg font-bold text-red-600">{eqState.totalNegCharge.toFixed(2)}</span>
                    <div className="w-full bg-slate-200 rounded-full h-2">
                      <div className="bg-red-500 h-2 rounded-full transition-all" style={{ width: `${negHeight}%`, minWidth: '4px' }}></div>
                    </div>
                  </div>
                </div>
                <div className="bg-emerald-50 rounded text-xs mt-3 overflow-hidden">
                  <button
                    onClick={() => setGuideOpen(v => !v)}
                    className="w-full flex items-center justify-between px-2 py-1.5 text-emerald-800 hover:bg-emerald-100 transition-colors"
                  >
                    <strong>💡 動態平衡觀察指南</strong>
                    <span className="text-emerald-600 text-base leading-none">{guideOpen ? '▲' : '▼'}</span>
                  </button>
                  {guideOpen && (
                    <div className="px-2 pb-2 text-emerald-800 leading-relaxed">
                      <ol className="list-decimal pl-4 mt-1">
                        <li>加入 <b>冰醋酸</b>，觀察畫面中永遠保持「至少一組」H⁺ 與 CH₃COO⁻ 在水中動態解離。</li>
                        <li>加入 <b>醋酸鈉</b>，只會看到 Na⁺ 和 CH₃COO⁻，以及極少量（一組）的 CH₃COOH 與 OH⁻——醋酸根水解（Kb≈5.6×10⁻¹⁰）極微小但不為零，溶液微鹼。</li>
                        <li>加入 <b>碳酸鈉</b>，CO₃²⁻ 會顯著水解（Kb≈2.1×10⁻⁴），產生 HCO₃⁻ 和 OH⁻，溶液明顯偏鹼。</li>
                        <li>加入 <b>氫氧化鈉</b>，觀察 OH⁻ 與 H⁺ 碰撞後立即中和消失（黃色閃光）。再加冰醋酸，看 NaOH 如何將弱酸平衡往解離方向推。</li>
                        <li>清空後，先加 <b>醋酸鈉</b> 再加 <b>鹽酸</b>，觀察 H⁺ 與 CH₃COO⁻ 快速結合回醋酸分子。</li>
                      </ol>
                    </div>
                  )}
                </div>
              </div>

              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex-1">
                <h2 className="text-md font-bold mb-2 flex items-center gap-2"><IconZap className="w-5 h-5 text-amber-500"/> 物種分析 (mol)</h2>
                <div className="grid grid-cols-2 gap-x-4 overflow-y-auto" style={{ maxHeight: '180px' }}>
                  {Object.entries(eqState.species).map(([id, moles]) => {
                    if (moles < 1e-4) return null;
                    return (
                      <div key={id} className="flex justify-between text-sm py-1 border-b border-slate-50">
                        <span>{SPECIES_DEFS[id].symbol}</span>
                        <span className="font-mono text-slate-600">{formatNum(moles)}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 將 React 元件掛載到 DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
