<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直尺測量估計值練習</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            height: 8px;
            margin: 10px 0;
        }

        .progress-fill {
            background: white;
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .timer {
            color: #dc3545;
            font-size: 1.2em;
        }

        .score {
            color: #28a745;
            font-size: 1.2em;
        }

        .main-content {
            padding: 30px;
        }

        .question-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .question-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .ruler-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            min-height: 300px;
            position: relative;
            overflow: hidden;
            border: 2px solid #dee2e6;
            cursor: grab;
        }

        .ruler-container:active {
            cursor: grabbing;
        }

        .ruler-svg {
            width: 100%;
            height: 100%;
            transition: transform 0.1s ease-out;
        }

        .zoom-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .zoom-btn:hover {
            background: white;
            transform: scale(1.1);
        }

        .zoom-btn:active {
            transform: scale(0.95);
        }

        .zoom-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            z-index: 10;
        }

        .input-section {
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .input-field {
            width: 120px;
            padding: 12px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            font-size: 1.2em;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .input-field:focus, .input-field.active {
            outline: none;
            border-color: #4ECDC4;
            background: white;
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        }

        .unit-label {
            font-weight: bold;
            color: #495057;
            font-size: 1.1em;
        }

        .measurement-inputs {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .input-pair {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .input-label {
            font-weight: bold;
            color: #495057;
            font-size: 0.9em;
        }

        .plus-sign {
            font-size: 1.5em;
            font-weight: bold;
            color: #495057;
            margin: 0 10px;
        }

        .unit-text {
            font-size: 0.8em;
            color: #666;
        }

        .input-mode-toggle {
            display: none;
        }

        .mode-btn {
            display: none;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 300px;
            margin: 20px auto;
        }

        .keypad button {
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #ced4da;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .keypad button:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .keypad button:active {
            transform: scale(0.95);
        }

        .submit-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .next-btn {
            background: linear-gradient(45deg, #007bff, #6610f2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 10px;
            display: none;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .feedback {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }

        .result-summary {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            display: none;
        }

        .result-header {
            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #007bff;
            margin: 10px 0;
        }

        .wrong-answers {
            text-align: left;
            background: #fff3cd;
            border: 2px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .wrong-answer-item {
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
        }

        .restart-btn {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }
            
            .info-panel {
                padding: 10px 15px;
                justify-content: center;
            }
            
            .main-content {
                padding: 15px;
            }
            
            .input-group {
                flex-direction: column;
                gap: 10px;
            }
            
            .keypad {
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>直尺測量估計值練習</h1>
            <p>適合八年級學生 - 學會讀取準確數值與估計值</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <span>📝 題目進度:</span>
                <span id="questionProgress">1 / 10</span>
            </div>
            <div class="info-item timer">
                <span>⏱️ 計時:</span>
                <span id="timer">00:00</span>
            </div>
            <div class="info-item score">
                <span>✅ 得分:</span>
                <span id="score">0 / 0</span>
            </div>
        </div>

        <div class="main-content">
            <div id="questionSection" class="question-section">
                <div class="question-title" id="questionTitle">
                    請讀取直尺上物件的測量值
                </div>
                
                <div class="ruler-container" id="rulerContainer">
                    <div class="zoom-controls">
                        <button class="zoom-btn" title="放大">+</button>
                        <button class="zoom-btn" title="縮小">−</button>
                        <button class="zoom-btn" title="重置">⌂</button>
                    </div>
                    <div class="zoom-info" id="zoomInfo">縮放: 100% | 點擊 + − 調整大小，拖動移動視角</div>
                    <svg id="rulerSvg" class="ruler-svg" width="1000" height="200" viewBox="0 0 1000 200">
                        <!-- 直尺和物件會動態生成 -->
                    </svg>
                </div>

                <div class="input-section">
                    <div class="input-group">
                        <label class="unit-label">測量結果 =</label>
                        <div class="measurement-inputs">
                            <div class="input-pair">
                                <label class="input-label">準確值</label>
                                <input type="text" id="accurateInput" class="input-field" readonly placeholder="" onclick="setInputMode('accurate')">
                                <span class="unit-text">公分</span>
                            </div>
                            <span class="plus-sign">+</span>
                            <div class="input-pair">
                                <label class="input-label">估計值</label>
                                <input type="text" id="estimateInput" class="input-field" readonly placeholder="" onclick="setInputMode('estimate')">
                                <span class="unit-text">公分</span>
                            </div>
                        </div>
                    </div>

                    <div class="keypad">
                        <button onclick="inputNumber('1')">1</button>
                        <button onclick="inputNumber('2')">2</button>
                        <button onclick="inputNumber('3')">3</button>
                        <button onclick="inputNumber('4')">4</button>
                        <button onclick="inputNumber('5')">5</button>
                        <button onclick="inputNumber('6')">6</button>
                        <button onclick="inputNumber('7')">7</button>
                        <button onclick="inputNumber('8')">8</button>
                        <button onclick="inputNumber('9')">9</button>
                        <button onclick="inputNumber('.')">.</button>
                        <button onclick="inputNumber('0')">0</button>
                        <button onclick="clearCurrentInput()">清除</button>
                    </div>

                    <div style="text-align: center;">
                        <button class="submit-btn" onclick="submitAnswer()">提交答案</button>
                        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一題</button>
                    </div>

                    <div id="feedback" class="feedback"></div>
                </div>
            </div>

            <div id="resultSection" class="result-summary">
                <div class="result-header">🎉 測驗完成！</div>
                
                <div class="result-stats">
                    <div class="stat-card">
                        <div>總成績</div>
                        <div class="stat-value" id="finalScore">0/10</div>
                    </div>
                    <div class="stat-card">
                        <div>正確率</div>
                        <div class="stat-value" id="accuracy">0%</div>
                    </div>
                    <div class="stat-card">
                        <div>測驗時間</div>
                        <div class="stat-value" id="finalTime">00:00</div>
                    </div>
                    <div class="stat-card">
                        <div>測驗日期</div>
                        <div class="stat-value" id="testDate">2025/08/25</div>
                    </div>
                </div>

                <div class="wrong-answers" id="wrongAnswers">
                    <h3>🔍 錯題回顧</h3>
                    <div id="wrongAnswersList"></div>
                </div>

                <button class="restart-btn" onclick="restartQuiz()">重新開始測驗</button>
            </div>
        </div>
    </div>

    <script>
        let currentQuestion = 1;
        let totalQuestions = 10;
        let score = 0;
        let startTime = Date.now();
        let timerInterval;
        let questions = [];
        let wrongAnswers = [];
        let currentAnswer = null;
        
        // 縮放和平移相關變數
        let currentZoom = 1;
        let currentX = 0;
        let currentY = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        
        // 輸入模式相關變數
        let inputMode = 'accurate'; // 'accurate' 或 'estimate'

        // 題目類型配置
        const questionTypes = [
            { scale: 1, unit: 'cm', description: '最小刻度為 1 公分' },
            { scale: 0.1, unit: 'cm', description: '最小刻度為 0.1 公分 (1 毫米)' }
        ];

        // 初始化
        function init() {
            generateQuestions();
            startTimer();
            displayQuestion();
            updateProgress();
            setupZoomAndPan();
        }

        // 生成所有題目
        function generateQuestions() {
            questions = [];
            for (let i = 0; i < totalQuestions; i++) {
                const type = questionTypes[Math.floor(Math.random() * questionTypes.length)];
                const question = generateSingleQuestion(type, i + 1);
                questions.push(question);
            }
        }

        // 生成單一題目
        function generateSingleQuestion(type, questionNum) {
            let targetLength; // 最終測量目標（筆尖位置）
            
            if (type.scale === 1) {
                // 1公分刻度：目標位置在某兩個整數刻度之間
                const baseInt = Math.floor(Math.random() * 15) + 5; // 5-19（左側刻度）
                const estimateDecimal = Math.round((Math.random() * 0.8 + 0.1) * 10) / 10; // 0.1-0.9，取到十分位
                targetLength = baseInt + estimateDecimal; // 例如：6.3cm（準確值6，估計值0.3）
            } else {
                // 0.1公分刻度：目標位置在某兩個0.1刻度之間
                const baseTenths = Math.floor(Math.random() * 150) + 50; // 50-199（代表5.0-19.9）
                const accurateLength = baseTenths / 10; // 準確到十分位，如6.2cm
                const estimateHundredths = Math.round((Math.random() * 0.08 + 0.01) * 100) / 100; // 0.01-0.09，取到百分位
                targetLength = accurateLength + estimateHundredths; // 例如：6.23cm（準確值6.2，估計值0.03）
            }

            return {
                id: questionNum,
                type: type,
                actualLength: Math.round(targetLength * 100) / 100,
                tolerance: type.scale * 0.5 // 半個最小刻度
            };
        }

        // 顯示當前題目
        function displayQuestion() {
            const question = questions[currentQuestion - 1];
            currentAnswer = question.actualLength;
            
            document.getElementById('questionTitle').textContent = 
                `第 ${currentQuestion} 題 - ${question.type.description}`;
            
            // 重置縮放
            resetZoom();
            drawRuler(question);
            
            // 重新設置縮放按鈕
            setupZoomButtons();
            
            // 清空輸入框
            document.getElementById('accurateInput').value = '';
            document.getElementById('estimateInput').value = '';
            
            // 重置輸入模式
            inputMode = 'accurate';
            updateInputFieldsStyle();
            
            document.getElementById('feedback').style.display = 'none';
            document.querySelector('.submit-btn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
        }

        // 繪製直尺
        function drawRuler(question) {
            const svg = document.getElementById('rulerSvg');
            svg.innerHTML = '';
            
            const scale = question.type.scale;
            const rulerLength = 750;
            const startX = 125;
            const rulerY = 100;
            const targetLength = question.actualLength; // 目標測量長度（筆尖位置）
            
            // 繪製直尺底色
            const rulerRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rulerRect.setAttribute('x', startX);
            rulerRect.setAttribute('y', rulerY);
            rulerRect.setAttribute('width', rulerLength);
            rulerRect.setAttribute('height', 50);
            rulerRect.setAttribute('fill', '#f8f9fa');
            rulerRect.setAttribute('stroke', '#333');
            rulerRect.setAttribute('stroke-width', '2');
            svg.appendChild(rulerRect);

            // 繪製刻度
            const maxCm = Math.floor(rulerLength / 37.5);
            for (let i = 0; i <= maxCm; i++) {
                const x = startX + (i * 37.5);
                
                // 主刻度線 (整公分)
                const mainLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                mainLine.setAttribute('x1', x);
                mainLine.setAttribute('y1', rulerY);
                mainLine.setAttribute('x2', x);
                mainLine.setAttribute('y2', rulerY + 35);
                mainLine.setAttribute('stroke', '#333');
                mainLine.setAttribute('stroke-width', '2');
                svg.appendChild(mainLine);

                // 數字標記
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', rulerY + 45);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '14');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('fill', '#333');
                text.textContent = i;
                svg.appendChild(text);

                // 小刻度線 (毫米)
                if (scale <= 0.1 && i < maxCm) {
                    for (let j = 1; j < 10; j++) {
                        const smallX = x + (j * 3.75);
                        const smallLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        smallLine.setAttribute('x1', smallX);
                        smallLine.setAttribute('y1', rulerY + 5);
                        smallLine.setAttribute('x2', smallX);
                        smallLine.setAttribute('y2', rulerY + (j === 5 ? 25 : 20));
                        smallLine.setAttribute('stroke', '#666');
                        smallLine.setAttribute('stroke-width', '1');
                        svg.appendChild(smallLine);
                    }
                }
            }

            // 計算鉛筆主體長度（筆尖位置減去筆尖長度）
            const pencilTipLengthCm = 20 / 37.5; // 筆尖在SVG中的長度對應的公分數
            const pencilBodyLength = Math.max(1, targetLength - pencilTipLengthCm); // 確保鉛筆主體至少1cm
            
            // 繪製測量物件 (鉛筆主體)
            drawPencil(svg, startX, rulerY - 40, pencilBodyLength * 37.5);

            // 繪製指示箭頭 - 指向筆尖位置（實際測量長度位置）
            const pencilTipX = startX + (targetLength * 37.5);
            const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            arrow.setAttribute('points', `${pencilTipX-8},${rulerY-8} ${pencilTipX+8},${rulerY-8} ${pencilTipX},${rulerY+8}`);
            arrow.setAttribute('fill', '#dc3545');
            arrow.setAttribute('stroke', '#fff');
            arrow.setAttribute('stroke-width', '1');
            svg.appendChild(arrow);
            
            // 添加提示文字
            const hintText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            hintText.setAttribute('x', 500);
            hintText.setAttribute('y', 30);
            hintText.setAttribute('text-anchor', 'middle');
            hintText.setAttribute('font-size', '16');
            hintText.setAttribute('fill', '#666');
            hintText.textContent = '💡 使用右上角按鈕放大縮小，拖動移動視角';
            svg.appendChild(hintText);
        }

        // 繪製鉛筆
        function drawPencil(svg, startX, y, length) {
            // 鉛筆主體
            const pencilBody = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            pencilBody.setAttribute('x', startX);
            pencilBody.setAttribute('y', y);
            pencilBody.setAttribute('width', length);
            pencilBody.setAttribute('height', 18);
            pencilBody.setAttribute('fill', '#ffd700');
            pencilBody.setAttribute('stroke', '#333');
            pencilBody.setAttribute('stroke-width', '1.5');
            svg.appendChild(pencilBody);

            // 鉛筆尖端
            const pencilTip = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            pencilTip.setAttribute('points', `${startX + length},${y} ${startX + length + 20},${y + 9} ${startX + length},${y + 18}`);
            pencilTip.setAttribute('fill', '#8b4513');
            pencilTip.setAttribute('stroke', '#333');
            pencilTip.setAttribute('stroke-width', '1.5');
            svg.appendChild(pencilTip);
            
            // 添加鉛筆上的紋理
            for(let i = 0; i < 3; i++) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', startX + 20 + i * 15);
                line.setAttribute('y1', y + 3);
                line.setAttribute('x2', startX + 20 + i * 15);
                line.setAttribute('y2', y + 15);
                line.setAttribute('stroke', '#daa520');
                line.setAttribute('stroke-width', '1');
                svg.appendChild(line);
            }
        }

        // 設置輸入模式
        function setInputMode(mode) {
            inputMode = mode;
            updateInputFieldsStyle();
        }

        // 更新輸入框樣式
        function updateInputFieldsStyle() {
            const accurateInput = document.getElementById('accurateInput');
            const estimateInput = document.getElementById('estimateInput');
            
            // 移除所有活躍樣式
            accurateInput.classList.remove('active');
            estimateInput.classList.remove('active');
            
            // 添加當前活躍樣式
            if (inputMode === 'accurate') {
                accurateInput.classList.add('active');
            } else {
                estimateInput.classList.add('active');
            }
        }

        // 數字輸入
        function inputNumber(num) {
            const currentInput = inputMode === 'accurate' ? 
                document.getElementById('accurateInput') : 
                document.getElementById('estimateInput');
                
            if (num === '.') {
                if (currentInput.value.indexOf('.') === -1) {
                    currentInput.value += num;
                }
            } else {
                currentInput.value += num;
            }
        }

        // 清除當前輸入
        function clearCurrentInput() {
            const currentInput = inputMode === 'accurate' ? 
                document.getElementById('accurateInput') : 
                document.getElementById('estimateInput');
            currentInput.value = '';
        }

        // 提交答案
        function submitAnswer() {
            // 獲取原始輸入字符串（在數值轉換之前）
            const accurateStr = document.getElementById('accurateInput').value.trim();
            const estimateStr = document.getElementById('estimateInput').value.trim();
            
            // 檢查是否為空
            if (!accurateStr || !estimateStr) {
                alert('請輸入準確值和估計值！');
                return;
            }
            
            const question = questions[currentQuestion - 1];
            const correctAnswer = question.actualLength;
            const tolerance = question.tolerance;
            
            // 格式檢查和數值轉換
            let isCorrect = false;
            let errorMessage = '';
            let accurateValue, estimateValue, userAnswer;

            if (question.type.scale === 1) {
                // 1公分刻度檢查
                // 1. 準確值格式檢查：必須是純整數（不能有小數點）
                if (accurateStr.includes('.')) {
                    errorMessage = `準確值格式錯誤：1公分刻度的準確值必須是整數（如15，不能是15.0）`;
                } else if (!/^\d+$/.test(accurateStr)) {
                    errorMessage = `準確值格式錯誤：請輸入有效的整數`;
                } else {
                    accurateValue = parseInt(accurateStr, 10);
                    
                    // 2. 估計值格式檢查 - 必須輸入到十分位
                    if (!/^0\.\d$/.test(estimateStr)) {
                        if (estimateStr === '0') {
                            errorMessage = `估計值格式錯誤：1公分刻度必須輸入估計值到十分位（如0.0, 0.1, 0.2等，不能只輸入0）`;
                        } else {
                            errorMessage = `估計值格式錯誤：1公分刻度的估計值必須是0.X格式（如0.1, 0.2等，不能是0.01, 0.12等）`;
                        }
                    } else {
                        // 0.X格式（一位小數）
                        estimateValue = parseFloat(estimateStr);
                        if (estimateValue >= 1) {
                            errorMessage = `估計值範圍錯誤：估計值應該在 0.0-0.9 之間`;
                        }
                    }
                    
                    // 3. 數值範圍檢查
                    if (!errorMessage) {
                        const correctAccurate = Math.floor(correctAnswer);
                        if (accurateValue !== correctAccurate) {
                            errorMessage = `準確值數值錯誤：筆尖在 ${correctAccurate}-${correctAccurate + 1} 公分之間，準確值應該是 ${correctAccurate} 公分`;
                        } else {
                            userAnswer = accurateValue + estimateValue;
                            isCorrect = Math.abs(userAnswer - correctAnswer) <= tolerance;
                        }
                    }
                }
                
            } else {
                // 0.1公分刻度檢查
                // 1. 準確值格式檢查：必須是X.X格式（恰好一位小數）
                if (!/^\d+\.\d$/.test(accurateStr)) {
                    errorMessage = `準確值格式錯誤：0.1公分刻度的準確值必須是X.X格式（如14.5，不能是14或14.50）`;
                } else {
                    accurateValue = parseFloat(accurateStr);
                    
                    // 2. 估計值格式檢查 - 必須輸入到百分位
                    if (!/^0\.0\d$/.test(estimateStr)) {
                        if (estimateStr === '0') {
                            errorMessage = `估計值格式錯誤：0.1公分刻度必須輸入估計值到百分位（如0.00, 0.01, 0.02等，不能只輸入0）`;
                        } else {
                            errorMessage = `估計值格式錯誤：0.1公分刻度的估計值必須是0.0X格式（如0.01, 0.02等）`;
                        }
                    } else {
                        // 0.0X格式（百分位）
                        estimateValue = parseFloat(estimateStr);
                        if (estimateValue >= 0.1) {
                            errorMessage = `估計值範圍錯誤：估計值應該在 0.00-0.09 之間`;
                        }
                    }
                    
                    // 3. 數值範圍檢查
                    if (!errorMessage) {
                        const correctAccurate = Math.floor(correctAnswer * 10) / 10;
                        if (Math.abs(accurateValue - correctAccurate) > 0.05) {
                            errorMessage = `準確值數值錯誤：筆尖在 ${correctAccurate.toFixed(1)}-${(correctAccurate + 0.1).toFixed(1)} 公分之間，準確值應該是 ${correctAccurate.toFixed(1)} 公分`;
                        } else {
                            userAnswer = accurateValue + estimateValue;
                            isCorrect = Math.abs(userAnswer - correctAnswer) <= tolerance;
                        }
                    }
                }
            }

            // 顯示回饋結果
            if (!errorMessage) {
                // 沒有錯誤訊息時才顯示結果
                const feedback = document.getElementById('feedback');

                if (isCorrect) {
                    score++;
                    feedback.className = 'feedback correct';
                    feedback.innerHTML = `
                        <div>✅ 回答正確！</div>
                        <div>您的答案: ${accurateStr} + ${estimateStr} = ${userAnswer.toFixed(question.type.scale === 1 ? 1 : 2)} cm</div>
                        <div>參考答案: ${correctAnswer.toFixed(question.type.scale === 1 ? 1 : 2)} cm</div>
                        <div style="color: #666; font-size: 0.9em; margin-top: 8px;">
                            🔍 ${question.type.scale === 1 ? 
                                '準確值讀到整數位，估計值必須讀到十分位（如0.3，不能只輸入0）' : 
                                '準確值讀到十分位，估計值必須讀到百分位（如0.03，不能只輸入0）'}
                        </div>
                    `;
                } else {
                    feedback.className = 'feedback incorrect';
                    const correctAccurate = question.type.scale === 1 ? 
                        Math.floor(correctAnswer) : 
                        Math.floor(correctAnswer * 10) / 10;
                    const correctEstimate = correctAnswer - correctAccurate;
                    
                    feedback.innerHTML = `
                        <div>❌ 回答錯誤</div>
                        <div>您的答案: ${accurateStr} + ${estimateStr} = ${userAnswer.toFixed(2)} cm</div>
                        <div>參考答案: ${correctAccurate.toFixed(question.type.scale === 1 ? 0 : 1)} + ${correctEstimate.toFixed(2)} = ${correctAnswer} cm</div>
                        <div style="color: #d63384; font-size: 0.9em; margin-top: 8px;">
                            估計值超出合理範圍
                        </div>
                        <div style="color: #666; font-size: 0.9em; margin-top: 8px;">
                            🔍 ${question.type.scale === 1 ? 
                                '準確值讀到整數位，估計值讀到十分位（0表示剛好在刻度線上）' : 
                                '準確值讀到十分位，估計值讀到百分位（0表示剛好在刻度線上）'}
                        </div>
                    `;
                    
                    wrongAnswers.push({
                        questionNum: currentQuestion,
                        userAnswer: `${accurateStr} + ${estimateStr} = ${userAnswer.toFixed(question.type.scale === 1 ? 1 : 2)}`,
                        correctAnswer: `${correctAccurate.toFixed(question.type.scale === 1 ? 0 : 1)} + ${correctEstimate.toFixed(question.type.scale === 1 ? 1 : 2)} = ${correctAnswer.toFixed(question.type.scale === 1 ? 1 : 2)}`,
                        type: question.type.description,
                        errorType: '估計值超出範圍'
                    });
                }

                feedback.style.display = 'block';
                document.querySelector('.submit-btn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'inline-block';
                
                updateScore();
            } else {
                // 有格式錯誤時顯示錯誤訊息
                const feedback = document.getElementById('feedback');
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `
                    <div>❌ 輸入格式錯誤</div>
                    <div style="color: #d63384; font-size: 0.9em; margin-top: 8px;">
                        ${errorMessage}
                    </div>
                    <div style="color: #666; font-size: 0.9em; margin-top: 8px;">
                        🔍 ${question.type.scale === 1 ? 
                            '準確值必須是整數，估計值必須是0.X格式（不能只輸入0）' : 
                            '準確值必須是X.X格式，估計值必須是0.0X格式（不能只輸入0）'}
                    </div>
                `;
                feedback.style.display = 'block';
                // 格式錯誤時不切換按鈕，讓學生可以重新輸入
                return;
            }
        }

        // 下一題
        function nextQuestion() {
            if (currentQuestion < totalQuestions) {
                currentQuestion++;
                displayQuestion();
                updateProgress();
            } else {
                endQuiz();
            }
        }

        // 更新進度
        function updateProgress() {
            const progress = (currentQuestion - 1) / totalQuestions * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('questionProgress').textContent = `${currentQuestion} / ${totalQuestions}`;
        }

        // 更新分數
        function updateScore() {
            document.getElementById('score').textContent = `${score} / ${currentQuestion}`;
        }

        // 計時器
        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // 結束測驗
        function endQuiz() {
            clearInterval(timerInterval);
            
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const timeStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            
            document.getElementById('finalScore').textContent = `${score}/${totalQuestions}`;
            document.getElementById('accuracy').textContent = `${Math.round(score/totalQuestions*100)}%`;
            document.getElementById('finalTime').textContent = timeStr;
            document.getElementById('testDate').textContent = new Date().toLocaleString('zh-TW');
            
            // 顯示錯題回顧
            if (wrongAnswers.length > 0) {
                let wrongHtml = '';
                wrongAnswers.forEach(wrong => {
                    wrongHtml += `
                        <div class="wrong-answer-item">
                            <strong>第 ${wrong.questionNum} 題</strong> (${wrong.type})<br>
                            您的答案: ${wrong.userAnswer} cm<br>
                            參考答案: ${wrong.correctAnswer} cm<br>
                            <span style="color: #dc3545; font-size: 0.9em;">
                                錯誤原因: ${wrong.errorType || '估計值超出範圍'}
                            </span>
                        </div>
                    `;
                });
                document.getElementById('wrongAnswersList').innerHTML = wrongHtml;
            } else {
                document.getElementById('wrongAnswers').innerHTML = '<h3>🎉 太棒了！全部答對！</h3>';
            }
        }

        // 重新開始
        function restartQuiz() {
            currentQuestion = 1;
            score = 0;
            wrongAnswers = [];
            startTime = Date.now();
            
            document.getElementById('questionSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            
            generateQuestions();
            displayQuestion();
            updateProgress();
            updateScore();
            startTimer();
        }

        // 縮放和平移功能
        function setupZoomAndPan() {
            const container = document.getElementById('rulerContainer');
            
            // 為縮放按鈕添加事件監聽器
            setupZoomButtons();

            // 滑鼠拖動 - 只對容器本身，不包括按鈕
            container.addEventListener('mousedown', function(e) {
                if (!e.target.closest('.zoom-controls')) {
                    startDrag(e);
                }
            });
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', endDrag);

            // 觸控支援
            container.addEventListener('touchstart', function(e) {
                if (!e.target.closest('.zoom-controls')) {
                    handleTouch(e);
                }
            }, { passive: false });
            container.addEventListener('touchmove', handleTouch, { passive: false });
            container.addEventListener('touchend', endDrag);

            // 滑鼠滾輪縮放
            container.addEventListener('wheel', handleWheel, { passive: false });
        }

        function setupZoomButtons() {
            // 移除舊的事件監聽器並重新添加
            const zoomControls = document.querySelector('.zoom-controls');
            if (zoomControls) {
                // 重新創建按鈕以清除舊的事件
                zoomControls.innerHTML = `
                    <button class="zoom-btn" title="放大">+</button>
                    <button class="zoom-btn" title="縮小">−</button>
                    <button class="zoom-btn" title="重置">⌂</button>
                `;
                
                // 添加新的事件監聽器
                const buttons = zoomControls.querySelectorAll('.zoom-btn');
                buttons[0].addEventListener('click', function(e) {
                    e.stopPropagation();
                    zoomIn();
                });
                buttons[1].addEventListener('click', function(e) {
                    e.stopPropagation();
                    zoomOut();
                });
                buttons[2].addEventListener('click', function(e) {
                    e.stopPropagation();
                    resetZoom();
                });
            }
        }

        function startDrag(e) {
            isDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
            dragStartX = clientX - currentX;
            dragStartY = clientY - currentY;
            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
            currentX = clientX - dragStartX;
            currentY = clientY - dragStartY;
            updateTransform();
            e.preventDefault();
        }

        function endDrag() {
            isDragging = false;
        }

        function handleTouch(e) {
            if (e.touches && e.touches.length === 1) {
                const touch = e.touches[0];
                if (e.type === 'touchstart') {
                    startDrag({ 
                        clientX: touch.clientX, 
                        clientY: touch.clientY, 
                        preventDefault: () => e.preventDefault() 
                    });
                } else if (e.type === 'touchmove') {
                    drag({ 
                        clientX: touch.clientX, 
                        clientY: touch.clientY, 
                        preventDefault: () => e.preventDefault() 
                    });
                }
            }
            e.preventDefault();
        }

        function handleWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newZoom = Math.max(0.5, Math.min(3, currentZoom * delta));
            
            if (newZoom !== currentZoom) {
                currentZoom = newZoom;
                updateTransform();
                updateZoomInfo();
            }
        }

        function zoomIn() {
            if (currentZoom < 3) {
                currentZoom = Math.min(3, currentZoom * 1.2);
                updateTransform();
                updateZoomInfo();
            }
        }

        function zoomOut() {
            if (currentZoom > 0.5) {
                currentZoom = Math.max(0.5, currentZoom / 1.2);
                updateTransform();
                updateZoomInfo();
            }
        }

        function resetZoom() {
            currentZoom = 1;
            currentX = 0;
            currentY = 0;
            updateTransform();
            updateZoomInfo();
        }

        function updateTransform() {
            const svg = document.getElementById('rulerSvg');
            if (svg) {
                svg.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentZoom})`;
            }
        }

        function updateZoomInfo() {
            const zoomInfo = document.getElementById('zoomInfo');
            if (zoomInfo) {
                const zoomPercent = Math.round(currentZoom * 100);
                zoomInfo.textContent = `縮放: ${zoomPercent}% | 點擊 + − 調整大小，拖動移動視角`;
            }
        }

        // 頁面載入後初始化
        window.onload = init;
    </script>
</body>
</html>
