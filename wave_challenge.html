<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>繩波闖關</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#080c18;--panel:rgba(16,24,48,.92);--text:#d8e4ff;--dim:#6880a8;--accent:#00e87b;--cyan:#00ccff;
  --gold:#ffd700;--warn:#ff6644;--btn:#1a3068;--btn-hi:#2a48a0;--glow-g:0 0 12px #00e87b88;
  --f-title:"LXGW WenKai TC","Noto Sans TC",serif;--f-body:"Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.screen[hidden]{display:none}

/* title */
#titleScreen{background:radial-gradient(ellipse at 50% 40%,#0e1838,#080c18)}
#titleScreen h1{font-family:var(--f-title);font-size:clamp(32px,7vw,56px);font-weight:700;
  background:linear-gradient(135deg,#00e87b,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#titleScreen .sub{color:var(--dim);font-size:16px;margin:8px 0 32px}
.big-btn{background:linear-gradient(135deg,#00b86e,#0090cc);color:#fff;font-size:18px;font-weight:700;
  padding:14px 48px;border-radius:40px;box-shadow:0 0 24px #00e87b44;transition:transform .15s}
.big-btn:hover{transform:scale(1.05)}.big-btn:active{transform:scale(.97)}

/* level select */
#levelsScreen{background:var(--bg);justify-content:flex-start;padding-top:24px;overflow-y:auto}
#levelsScreen h2{font-family:var(--f-title);font-size:20px;margin:20px 0 10px;color:var(--cyan)}
.lvl-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:460px}
.lvl-card{width:68px;height:78px;border-radius:12px;background:var(--btn);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;transition:background .15s,transform .15s}
.lvl-card:hover:not(.locked){background:var(--btn-hi);transform:scale(1.06)}
.lvl-card:active:not(.locked){transform:scale(.95)}
.lvl-card.locked{opacity:.35;pointer-events:none}
.lvl-card .stars-row{font-size:11px;letter-spacing:1px}
.lvl-card.done{border:1px solid var(--accent)}
.back-btn{margin:24px 0;color:var(--dim);font-size:14px;text-decoration:underline}

/* game */
#gameScreen{padding:0;justify-content:stretch}
#gameHeader{display:flex;align-items:center;gap:8px;padding:8px 12px;width:100%;flex:none}
#gameHeader .lv-title{flex:1;font-family:var(--f-title);font-size:17px;font-weight:700}
#gameHeader .star-disp{color:var(--gold);font-size:15px;letter-spacing:2px}
.icon-btn{width:36px;height:36px;border-radius:8px;background:var(--btn);display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:background .12s}
.icon-btn:hover{background:var(--btn-hi)}
#mission{padding:4px 14px 6px;font-size:13px;color:var(--dim);width:100%;text-align:center;flex:none;min-height:28px}
#cvWrap{flex:1;min-height:0;width:100%;position:relative;overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none}

/* ─── Source controls overlay ─── */
#srcControls{position:absolute;z-index:5;display:flex;flex-direction:column;gap:5px;pointer-events:auto;touch-action:none}
#srcControls[hidden]{display:none}
#scDragHandle{display:none;text-align:center;font-size:11px;color:rgba(100,140,200,.5);cursor:grab;
  padding:2px 0;user-select:none;-webkit-user-select:none;letter-spacing:2px}
#scDragHandle:active{cursor:grabbing}
#srcControls.draggable #scDragHandle{display:block}
.sc-row{display:flex;align-items:center;gap:4px;background:rgba(12,20,44,.92);border:1px solid rgba(0,200,255,.18);
  border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap}
.sc-label{color:var(--cyan);font-weight:700;min-width:28px}
.sc-hint{color:rgba(100,140,200,.45);font-size:10px}
.sc-btn{width:26px;height:26px;border-radius:5px;background:var(--btn);display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;transition:background .1s;cursor:pointer;flex:none}
.sc-btn:hover{background:var(--btn-hi)}
.sc-btn:active{background:var(--accent);color:#082}
.sc-input{width:56px;background:rgba(0,0,0,.5);border:1px solid rgba(100,140,200,.25);border-radius:4px;
  color:var(--text);text-align:center;font-size:12px;font-family:inherit;padding:3px 2px;outline:none}
.sc-input:focus{border-color:var(--cyan)}
.sc-unit{color:var(--dim);font-size:11px}

/* calculator pad */
#calcPad{background:rgba(12,20,44,.95);border:1px solid rgba(0,200,255,.2);border-radius:10px;padding:6px;margin-top:2px}
#calcPad[hidden]{display:none}
#calcExpr{font-size:11px;color:rgba(160,190,255,.5);text-align:right;padding:0 4px;min-height:14px;overflow:hidden;white-space:nowrap}
#calcDisp{font-size:17px;font-weight:700;color:var(--text);text-align:right;padding:2px 6px 4px;
  background:rgba(0,0,0,.4);border-radius:6px;margin-bottom:5px;min-height:24px;overflow:hidden;white-space:nowrap}
.calc-row{display:flex;gap:4px;margin-bottom:4px}.calc-row:last-child{margin-bottom:0}
.calc-btn{flex:1;height:32px;border-radius:6px;background:var(--btn);font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s;min-width:36px}
.calc-btn:hover{background:var(--btn-hi)}.calc-btn:active{background:var(--accent);color:#082}
.calc-op{background:rgba(0,140,200,.25);color:var(--cyan)}
.calc-op:hover{background:rgba(0,140,200,.4)}
.calc-wide{flex:1}
.calc-fill{background:linear-gradient(135deg,#00b86e,#0090cc);color:#fff;font-size:12px}

/* bottom bar */
#bottomBar{display:flex;align-items:center;gap:8px;padding:6px 12px;width:100%;flex:none;flex-wrap:wrap;justify-content:center}
.bar-group{display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px}
.bar-group label{color:var(--dim);margin-right:2px}
.t-btn{min-width:32px;height:28px;border-radius:6px;background:var(--btn);font-size:14px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.t-btn:hover{background:var(--btn-hi)}.t-btn.active{background:var(--accent);color:#082}
#matchWrap{display:flex;align-items:center;gap:6px;flex:1;min-width:150px}
#matchWrap .lbl{font-size:12px;color:var(--dim);white-space:nowrap}
#matchTrack{flex:1;height:10px;border-radius:5px;background:#152040;overflow:hidden}
#matchFill{height:100%;border-radius:5px;background:var(--accent);width:0%;transition:width .12s,background .12s}
#matchPct{font-size:13px;font-weight:700;min-width:55px;text-align:right}
#btnConfirm{padding:6px 18px;border-radius:16px;font-size:14px;font-weight:700;
  background:linear-gradient(135deg,#00b86e,#0090cc);color:#fff;box-shadow:0 0 12px #00e87b33;transition:transform .1s}
#btnConfirm:active{transform:scale(.93)}
#btnConfirm[hidden]{display:none}
.speed-note{font-size:11px;color:var(--dim);text-align:center;width:100%;flex:none;min-height:16px}

/* hint bubble */
#hintBubble{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--cyan);border-radius:10px;padding:8px 16px;font-size:13px;color:var(--cyan);
  max-width:320px;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;z-index:6}
#hintBubble.show{opacity:1}

/* ─── Result panel (bottom card, NOT full overlay) ─── */
#resultPanel{position:absolute;bottom:0;left:0;right:0;z-index:10;
  background:rgba(8,12,24,.88);backdrop-filter:blur(8px);border-top:2px solid var(--accent);
  padding:16px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:slideUp .35s ease}
#resultPanel[hidden]{display:none}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#resultPanel .big-stars{font-size:40px;letter-spacing:10px}
#resultPanel .msg{font-family:var(--f-title);font-size:24px;font-weight:700}
#resultPanel .detail{font-size:13px;color:var(--dim)}
.res-btns{display:flex;gap:12px;margin-top:4px}
.res-btn{padding:9px 24px;border-radius:18px;font-size:14px;font-weight:700;transition:transform .12s}
.res-btn:active{transform:scale(.93)}
.res-btn.retry{background:var(--btn);border:1px solid var(--dim)}
.res-btn.next{background:linear-gradient(135deg,#00b86e,#0090cc);color:#fff;box-shadow:0 0 16px #00e87b44}

/* toast */
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,100,60,.9);
  color:#fff;font-weight:700;padding:10px 24px;border-radius:12px;font-size:15px;z-index:12;
  pointer-events:none;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}

@media(max-width:480px){
  #gameHeader{padding:6px 8px}#gameHeader .lv-title{font-size:15px}
  .sc-row{padding:3px 6px;font-size:11px}.sc-input{width:48px;font-size:11px}.sc-btn{width:24px;height:24px}
  .t-btn{min-width:28px;height:26px;font-size:13px}
}
</style>

<div id="app">
  <div class="screen" id="titleScreen">
    <h1>繩波闖關</h1>
    <p class="sub">用你的雙手掌握波動！</p>
    <button class="big-btn" id="startBtn">開始挑戰</button>
  </div>
  <div class="screen" id="levelsScreen" hidden>
    <div id="levelGrid"></div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:8px">
      <button class="back-btn" id="backToTitle">← 返回</button>
      <button class="back-btn" id="btnClearData" style="color:#ff6b6b">清空紀錄</button>
    </div>
  </div>
  <div class="screen" id="completeScreen" hidden style="overflow-y:auto;justify-content:flex-start;padding-top:20px">
    <h1 style="font-size:clamp(24px,5vw,40px);margin-bottom:6px">🎉 全部過關！</h1>
    <p class="sub" id="completeSub" style="margin-bottom:8px"></p>
    <div id="completeSummary" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:700px;margin:8px auto;font-size:14px;line-height:1.8"></div>
    <button class="big-btn" onclick="sfxClick();showScreen('levels')" style="margin:16px 0 24px;flex-shrink:0">返回選關</button>
  </div>
  <div class="screen" id="gameScreen" hidden>
    <div id="gameHeader">
      <span class="lv-title" id="lvTitle"></span>
      <span class="star-disp" id="starDisp"></span>
      <button class="icon-btn" id="btnHint" title="提示">💡</button>
      <button class="icon-btn" id="btnReset" title="重置">🔄</button>
      <button class="icon-btn" id="btnBack" title="返回">✕</button>
    </div>
    <div id="mission"></div>
    <div id="cvWrap">
      <canvas id="cv"></canvas>
      <div id="hintBubble"></div>
      <div id="srcControls" hidden>
        <div id="scDragHandle">⠿ 拖曳移動</div>
        <div class="sc-row" id="freqRow">
          <span class="sc-label">頻率</span>
          <span class="sc-hint">慢</span>
          <button class="sc-btn" data-adj="freq" data-d="-0.1">−</button>
          <input type="number" class="sc-input" id="freqInput" step="0.1" min="0.3" max="5.0">
          <span class="sc-unit">Hz</span>
          <button class="sc-btn" data-adj="freq" data-d="0.1">+</button>
          <span class="sc-hint">快</span>
        </div>
        <div class="sc-row" id="ampRow" hidden>
          <span class="sc-label">振幅</span>
          <span class="sc-hint">小</span>
          <button class="sc-btn" data-adj="amp" data-d="-0.02">−</button>
          <input type="number" class="sc-input" id="ampInput" step="0.02" min="0.05" max="0.60">
          <button class="sc-btn" data-adj="amp" data-d="0.02">+</button>
          <span class="sc-hint">大</span>
        </div>
        <div class="sc-row" id="tensionRow" hidden>
          <span class="sc-label">張力</span>
          <span class="sc-hint">慢</span>
          <button class="sc-btn" data-adj="tension" data-d="-0.1">−</button>
          <input type="number" class="sc-input" id="tensionInput" step="0.1" min="0.5" max="15">
          <span class="sc-unit">N</span>
          <button class="sc-btn" data-adj="tension" data-d="0.1">+</button>
          <span class="sc-hint">快</span>
        </div>
        <div class="sc-row" id="muRow" hidden>
          <span class="sc-label">線密度</span>
          <span class="sc-hint">細</span>
          <button class="sc-btn" data-adj="mu" data-d="-0.1">−</button>
          <input type="number" class="sc-input" id="muInput" step="0.1" min="0.05" max="2.0">
          <span class="sc-unit">kg/m</span>
          <button class="sc-btn" data-adj="mu" data-d="0.1">+</button>
          <span class="sc-hint">粗</span>
        </div>
        <div class="sc-row" id="answerRow" hidden>
          <span class="sc-label">答案</span>
          <input type="number" class="sc-input" id="answerInput" step="0.01" style="width:70px">
          <span class="sc-unit" id="answerUnit">m</span>
          <button class="sc-btn" id="btnCalcToggle" onclick="toggleCalc()" style="font-size:14px;margin-left:4px" title="計算機">🔢</button>
        </div>
        <div id="measureInfo" hidden style="color:rgba(255,215,0,.8);font-size:13px;text-align:center;padding:2px 4px"></div>
        <div id="calcPad" hidden>
          <div id="calcExpr"></div>
          <div id="calcDisp">0</div>
          <div class="calc-row"><button class="calc-btn" onclick="calcKey('7')">7</button><button class="calc-btn" onclick="calcKey('8')">8</button><button class="calc-btn" onclick="calcKey('9')">9</button><button class="calc-btn calc-op" onclick="calcKey('/')">÷</button></div>
          <div class="calc-row"><button class="calc-btn" onclick="calcKey('4')">4</button><button class="calc-btn" onclick="calcKey('5')">5</button><button class="calc-btn" onclick="calcKey('6')">6</button><button class="calc-btn calc-op" onclick="calcKey('*')">×</button></div>
          <div class="calc-row"><button class="calc-btn" onclick="calcKey('1')">1</button><button class="calc-btn" onclick="calcKey('2')">2</button><button class="calc-btn" onclick="calcKey('3')">3</button><button class="calc-btn calc-op" onclick="calcKey('-')">−</button></div>
          <div class="calc-row"><button class="calc-btn" onclick="calcKey('0')">0</button><button class="calc-btn" onclick="calcKey('.')">.</button><button class="calc-btn calc-op" onclick="calcKey('=')">=</button><button class="calc-btn calc-op" onclick="calcKey('+')">+</button></div>
          <div class="calc-row"><button class="calc-btn" onclick="calcKey('C')">C</button><button class="calc-btn" onclick="calcKey('⌫')">⌫</button><button class="calc-btn calc-fill" onclick="calcFill()" style="flex:2">↓ 帶入答案</button></div>
        </div>
      </div>
      <div id="toast"></div>
    </div>
    <div id="bottomBar">
      <div class="bar-group">
        <label>速度</label>
        <button class="t-btn" id="sp05">0.5×</button>
        <button class="t-btn active" id="sp1">1×</button>
      </div>
      <div id="matchWrap">
        <span class="lbl">符合度</span>
        <div id="matchTrack"><div id="matchFill"></div></div>
        <span id="matchPct">—</span>
      </div>
      <button class="t-btn" id="btnResetBar" style="font-size:13px">🔄 重置</button>
      <button id="btnConfirm" hidden>確認送出</button>
    </div>
    <div class="speed-note" id="speedNote"></div>
    <div id="resultPanel" hidden>
      <div class="big-stars" id="resStars"></div>
      <div class="msg" id="resMsg"></div>
      <div class="detail" id="resDetail"></div>
      <div class="res-btns">
        <button class="res-btn retry" id="resRetry">重試</button>
        <button class="res-btn next" id="resNext">下一關 →</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   繩波闖關 — Rope Wave Challenge Game  v2
   ============================================================ */
const $ = s => document.getElementById(s);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
const randRange = (a,b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ─── Audio ─── */
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playTone(f,d,t='sine',v=.08){
  if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
  o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);
}
function sfxClick(){playTone(800,.06,'square',.04)}
function sfxWin(){setTimeout(()=>playTone(523,.12),0);setTimeout(()=>playTone(659,.12),120);setTimeout(()=>playTone(784,.2),240)}
function sfxStar(){playTone(1200,.15);playTone(1600,.15)}

/* ─── Level definitions ─── */
const CHAPTERS = [
  { title:'第一章：波形操作', color:'#00e87b' },
  { title:'第二章：波長控制', color:'#00ccff' },
  { title:'第三章：波的測量', color:'#ff66cc' },
  { title:'第四章：波速控制', color:'#ffa040' },
];
const LEVELS = [
  // ── Ch1: 波形操作 (manual, no direction hints, random target) ──
  { ch:0, title:'初次波動',
    desc:'拉動波源，讓波通過檢核區時符合目標虛線！',
    hint:'觀察目標形狀，拉動圓球產生波',
    mode:'manual', L:6, F:4, mu:.25, srcPos:0,
    shapes:['crest','trough'], ampR:[.20,.35], widthR:[1.6,2.8] },

  { ch:0, title:'再接再厲',
    desc:'新的隨機目標！注意形狀和大小。',
    hint:'波的高度取決於你拉多高，寬度取決於你拉多久',
    mode:'manual', L:6, F:4, mu:.25, srcPos:0,
    shapes:['crest','trough'], ampR:[.25,.45], widthR:[1.3,2.5] },

  { ch:0, title:'完整波形',
    desc:'這次是完整的一個波！仔細觀察形狀。',
    hint:'需要先往一邊拉，再往另一邊拉',
    mode:'manual', L:6, F:4, mu:.25, srcPos:0,
    threshold:.70,
    shapes:['fullwave','inv_fullwave'], ampR:[.18,.35], widthR:[2.0,3.4] },

  { ch:0, title:'波形挑戰',
    desc:'不同的波形，注意上下順序！',
    hint:'行進波的空間順序可能跟你拉動的順序不同喔',
    mode:'manual', L:6, F:4, mu:.25, srcPos:0,
    threshold:.70,
    shapes:['fullwave','inv_fullwave'], ampR:[.22,.40], widthR:[1.8,3.0] },

  { ch:0, title:'換個方向',
    desc:'波源在右邊了！目標在左邊。',
    hint:'想想波從右邊出發，到左邊時會怎樣',
    mode:'manual', L:6, F:4, mu:.25, srcPos:1,
    threshold:.70,
    shapes:['crest','trough'], ampR:[.22,.38], widthR:[1.5,2.8] },

  { ch:0, title:'右手高手',
    desc:'右邊波源，完整波形！',
    hint:'注意波傳過去後，形狀的前後順序',
    mode:'manual', L:6, F:4, mu:.25, srcPos:1,
    threshold:.70,
    shapes:['fullwave','inv_fullwave'], ampR:[.20,.35], widthR:[2.0,3.2] },

  // ── Ch2: 頻率與波長 (periodic, zone point-by-point match) ──
  { ch:1, title:'調頻入門',
    desc:'調整頻率，讓波形符合檢核區的目標虛線！',
    hint:'波長 = 波速 ÷ 頻率',
    mode:'periodic', L:8, F:4, mu:.25, srcPos:0,
    initFreq:1.0, initAmp:.25,
    tgtLambdaR:[1.8,2.8], tgtAmpFixed:true,  // only match wavelength
    adjAmp:false },

  { ch:1, title:'精準調頻',

/* ─── Physics engine ─── */
function initRope(cfg){
  const L=cfg.L||6, N=Math.round(L*50), dx=L/N;
  const F=cfg.F||4, mu=cfg.mu||.25, c=Math.sqrt(F/mu);
  const gN=Math.max(12,Math.round(N*.22)), M=gN+N+gN;
  const h=Math.min(.85*dx/c,.004), damp=.03;
  const rope={L,N,M,dx,o:gN,oR:gN,h,c,F,mu,
    y:new Float64Array(M+1),yp:new Float64Array(M+1),yn:new Float64Array(M+1),
    c2:new Float64Array(M+1).fill(F/mu),
    gB:null, srcIdx:gN+Math.round((cfg.srcPos||0)*N), srcY:0, damping:damp,
    color:cfg.color||'#00ff88', tSim:0,
    periodic:false, freq:cfg.freq||1, amp:cfg.amp||.25 };
  const gMax=28; rope.gB=new Float64Array(M+1);
  for(let i=0;i<=M;i++){
    let ex=0;
    if(i<gN){const u=1-i/gN;ex=gMax*u*u*u}
    if(i>gN+N){const u=(i-gN-N)/gN;ex=gMax*u*u*u}
    rope.gB[i]=(damp+ex)*h/2;
  }
  return rope;
}
function updateRopeSpeed(rope){
  rope.c=Math.sqrt(rope.F/rope.mu);rope.c2.fill(rope.F/rope.mu);
  const gN=rope.o,N=rope.N;rope.h=Math.min(.85*rope.dx/rope.c,.004);
  const gMax=28;
  for(let i=0;i<=rope.M;i++){
    let ex=0;if(i<gN){const u=1-i/gN;ex=gMax*u*u*u}
    if(i>gN+N){const u=(i-gN-N)/gN;ex=gMax*u*u*u}
    rope.gB[i]=(rope.damping+ex)*rope.h/2;
  }
}
function murBC(yn,y,e,nb,ch,dx){yn[e]=y[nb]+(ch-dx)/(ch+dx)*(yn[nb]-y[e])}
function stepRope(rope,dt){
  const{N,M,o,dx,c2,gB,h}=rope; let{y,yp,yn}=rope;
  const n=Math.min(Math.floor(dt/h+1e-9),4000); if(n<=0)return;
  const lam=h*h/(dx*dx);
  const chL=Math.sqrt(c2[0])*h, chR=Math.sqrt(c2[M])*h;
  for(let s=0;s<n;s++){
    rope.tSim+=h;
    for(let i=1;i<M;i++){const bi=gB[i];yn[i]=(2*y[i]-(1-bi)*yp[i]+lam*c2[i]*(y[i+1]-2*y[i]+y[i-1]))/(1+bi)}
    murBC(yn,y,0,1,chL,dx);murBC(yn,y,M,M-1,chR,dx);
    if(rope.periodic) yn[rope.srcIdx]=rope.amp*Math.sin(TAU*rope.freq*rope.tSim);
    else yn[rope.srcIdx]=rope.srcY;
    const tmp=yp;yp=y;y=yn;yn=tmp;
  }
  rope.y=y;rope.yp=yp;rope.yn=yn;
  for(let i=0;i<=M;i+=20)if(!(Math.abs(y[i])<40)){y.fill(0);yp.fill(0);break}
}

/* ─── Canvas ─── */
const cv=$('cv'), cc=cv.getContext('2d');
let W=800,H=400,dpr=1;
function resizeCanvas(){
  const wrap=$('cvWrap'),w=wrap.clientWidth,h=wrap.clientHeight;
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W=w*dpr;cv.height=H=h*dpr;

/* ─── Layout helpers ─── */
const PAD={l:.16,r:.09,t:.08,b:.08};
function layout(nR){
  const lx=W*PAD.l,rx=W*(1-PAD.r),dw=rx-lx;
  const ty=H*PAD.t,by=H*(1-PAD.b),dh=by-ty;
  const cys=nR===1?[ty+dh*.5]:[ty+dh*.28,ty+dh*.72];
  return{lx,rx,dw,ty,by,dh,cys};
}
function wx2c(wx,L,lay){return lay.lx+(wx/L)*lay.dw}
function wy2c(wy,cy,as){return cy-wy*as}

/* ─── Target functions ─── */
function makeManualTarget(shape,amp,z0,w){
  return function(x){
    if(x<z0||x>z0+w)return 0;
    const u=(x-z0)/w;
    switch(shape){
      case'crest':return amp*Math.sin(Math.PI*u);
      case'trough':return -amp*Math.sin(Math.PI*u);
      case'fullwave':return amp*Math.sin(TAU*u);
      case'inv_fullwave':return -amp*Math.sin(TAU*u);
    }return 0;
  };
}
// For periodic: phase-aligned target (phase computed each frame)
function periodicTargetFn(x,lambda,amp,phase){
  return amp*Math.cos(TAU/lambda*x - phase);
}

/* ─── Zone match computation ─── */
function computeZoneMatch(rope,z0,zEnd,targetFn){
  const iS=clamp(Math.round(z0/rope.dx),0,rope.N);
  const iE=clamp(Math.round(zEnd/rope.dx),0,rope.N);
  const n=iE-iS+1; if(n<5)return 0;
  let sse=0,sst=0;
  for(let i=iS;i<=iE;i++){
    const x=i*rope.dx;
    const a=rope.y[rope.o+i], e=targetFn(x);
    sse+=(a-e)*(a-e); sst+=e*e;
  }
  if(sst<1e-10)return 0;
  return clamp(1-Math.sqrt(sse/n)/Math.sqrt(sst/n),0,1);
}
function computePeriodicMatch(rope,z0,zEnd,lambda,amp){
  const iS=clamp(Math.round(z0/rope.dx),0,rope.N);
  const iE=clamp(Math.round(zEnd/rope.dx),0,rope.N);
  const n=iE-iS+1; if(n<10)return{match:0,phase:0};
  const k=TAU/lambda;
  // Fourier to find best phase
  let C=0,S=0;
  for(let i=iS;i<=iE;i++){const x=i*rope.dx;const y=rope.y[rope.o+i];C+=y*Math.cos(k*x);S+=y*Math.sin(k*x)}
  if(C*C+S*S<1e-12)return{match:0,phase:0};
  const phase=Math.atan2(S,C);
  // Point-by-point match with best phase
  let sse=0; const tgtRMS2=amp*amp/2;
  for(let i=iS;i<=iE;i++){
    const x=i*rope.dx, a=rope.y[rope.o+i], e=amp*Math.cos(k*x-phase);
    sse+=(a-e)*(a-e);
  }
  const rmse=Math.sqrt(sse/n), tgtRMS=Math.sqrt(tgtRMS2);
  return{match:clamp(1-rmse/tgtRMS,0,1), phase};
}

/* ─── Measure mode rendering ─── */
function drawMeasureWave(ctx){
  const mw=G.mWave, lv=LEVELS[G.level];
  const lay=layout(1);
  const cy=lay.cys[0], maxAV=.65, as=lay.dh/2/maxAV;
  const L=mw.length;
  const waveLen=mw.axis==='x'?mw.lambda:mw.period;
  const axisLabel=mw.axis==='x'?'位置 (m)':'時間 (s)';

  // Axis lines
  ctx.strokeStyle='rgba(120,160,220,.5)';ctx.lineWidth=1.5*dpr;
  ctx.beginPath();ctx.moveTo(lay.lx,cy);ctx.lineTo(lay.rx,cy);ctx.stroke(); // horizontal
  ctx.beginPath();ctx.moveTo(lay.lx,cy-lay.dh/2);ctx.lineTo(lay.lx,cy+lay.dh/2);ctx.stroke(); // vertical

  // Tick marks and labels
  ctx.font=`${10*dpr}px "Noto Sans TC",sans-serif`;
  ctx.fillStyle='rgba(160,190,230,.7)';ctx.textAlign='center';ctx.textBaseline='top';
  const tickStep=mw.axis==='x'?1:0.5;
  for(let v=0;v<=L;v+=tickStep){
    const px=lay.lx+v/L*lay.dw;
    ctx.beginPath();ctx.moveTo(px,cy-4*dpr);ctx.lineTo(px,cy+4*dpr);ctx.stroke();
    ctx.fillText(mw.axis==='x'?v.toFixed(0):v.toFixed(1),px,cy+6*dpr);
  }
  // Y-axis ticks
  ctx.textAlign='right';ctx.textBaseline='middle';
  for(let a=-0.4;a<=0.41;a+=0.2){
    if(Math.abs(a)<.01) continue;
    const yy=wy2c(a,cy,as);
    ctx.beginPath();ctx.moveTo(lay.lx-4*dpr,yy);ctx.lineTo(lay.lx+4*dpr,yy);ctx.stroke();
    ctx.fillText(a.toFixed(1),lay.lx-6*dpr,yy);
  }
  // Axis labels
  ctx.font=`${11*dpr}px "Noto Sans TC",sans-serif`;ctx.textAlign='center';
  ctx.fillText(axisLabel,(lay.lx+lay.rx)/2,cy+22*dpr);
  ctx.save();ctx.translate(lay.lx-28*dpr,cy);ctx.rotate(-Math.PI/2);
  ctx.textBaseline='middle';ctx.fillText('位移 (m)',0,0);ctx.restore();

  // Draw sine wave
  ctx.beginPath();
  for(let px=lay.lx;px<=lay.rx;px+=1){
    const wx=(px-lay.lx)/lay.dw*L;
    const val=mw.amp*Math.sin(2*Math.PI*wx/waveLen);
    const y=wy2c(val,cy,as);
    px===lay.lx?ctx.moveTo(px,y):ctx.lineTo(px,y);
  }
  ctx.save();ctx.shadowColor='#00ccff';ctx.shadowBlur=10*dpr;
  ctx.strokeStyle='#00ccff';ctx.lineWidth=3*dpr;ctx.lineCap='round';ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.2*dpr;ctx.stroke();

  // Snap dots
  G.snapDots.forEach((dot,i)=>{
    const px=lay.lx+dot.pos/L*lay.dw;
    const py=wy2c(dot.val,cy,as);
    const sel=G.selectedDots.includes(i);
    const r=sel?8*dpr:6*dpr;
    ctx.beginPath();ctx.arc(px,py,r,0,TAU);
    if(sel){
      ctx.fillStyle='rgba(255,215,0,.9)';ctx.shadowColor='#ffd700';ctx.shadowBlur=12*dpr;
    } else {
      ctx.fillStyle='rgba(255,255,255,.7)';ctx.shadowColor='#fff';ctx.shadowBlur=6*dpr;
    }
    ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle=sel?'#ff8800':'rgba(255,255,255,.4)';ctx.lineWidth=1.5*dpr;ctx.stroke();
  });

  // Measurement line between selected dots
  if(G.selectedDots.length===2){
    const d0=G.snapDots[G.selectedDots[0]], d1=G.snapDots[G.selectedDots[1]];
    const x0=lay.lx+d0.pos/L*lay.dw, x1=lay.lx+d1.pos/L*lay.dw;
    const baseY=cy+lay.dh/2-8*dpr;
    ctx.strokeStyle='rgba(255,215,0,.7)';ctx.lineWidth=2*dpr;ctx.setLineDash([]);
    ctx.beginPath();
    // Bracket: vertical lines + horizontal
    ctx.moveTo(x0,baseY-8*dpr);ctx.lineTo(x0,baseY+4*dpr);
    ctx.moveTo(x1,baseY-8*dpr);ctx.lineTo(x1,baseY+4*dpr);
    ctx.moveTo(x0,baseY);ctx.lineTo(x1,baseY);
    // Arrows
    const dir=x1>x0?1:-1;
    ctx.moveTo(x0+dir*8*dpr,baseY-4*dpr);ctx.lineTo(x0,baseY);ctx.lineTo(x0+dir*8*dpr,baseY+4*dpr);
    ctx.moveTo(x1-dir*8*dpr,baseY-4*dpr);ctx.lineTo(x1,baseY);ctx.lineTo(x1-dir*8*dpr,baseY+4*dpr);
    ctx.stroke();
    // Value label
    const dist=Math.abs(d1.pos-d0.pos);
    const unit=mw.axis==='x'?'m':'s';
    const prefix=mw.axis==='x'?'Δx':'Δt';
    ctx.font=`bold ${13*dpr}px "Noto Sans TC",sans-serif`;
    ctx.fillStyle='rgba(255,215,0,.9)';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(`${prefix} = ${dist.toFixed(2)} ${unit}`,(x0+x1)/2,baseY+8*dpr);
  }

  // Period info for speed question
  if(lv.mShowPeriod){
    ctx.font=`bold ${13*dpr}px "Noto Sans TC",sans-serif`;
    ctx.fillStyle='rgba(255,160,64,.8)';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(`已知：T = ${mw.period} s`,lay.lx,lay.cys[0]-lay.dh/2+4*dpr);
  }
}

/* ─── Rendering ─── */
function render(){
  const ctx=cc, nR=Math.max(1,G.ropes.length), lay=layout(nR);
  const lv=LEVELS[G.level];
  const maxAV=.65, as=lay.dh/(nR===1?2:4)/maxAV;

  // Background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0e1a');bg.addColorStop(1,'#060a14');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Measure mode: separate rendering
  if(lv.mode==='measure'){
    drawMeasureWave(ctx);
    return;
  }

  // Grid
  ctx.strokeStyle='rgba(40,60,100,.25)';ctx.lineWidth=dpr;
  G.ropes.forEach((r,ri)=>{
    const cy=lay.cys[ri];
    ctx.beginPath();ctx.moveTo(lay.lx,cy);ctx.lineTo(lay.rx,cy);ctx.stroke();
    for(let a=-.5;a<=.5;a+=.25){
      if(Math.abs(a)<.01)continue;
      const yy=wy2c(a,cy,as);
      ctx.beginPath();ctx.moveTo(lay.lx,yy);ctx.lineTo(lay.rx,yy);ctx.stroke();
    }
    for(let x=0;x<=r.L;x+=1){
      const xx=wx2c(x,r.L,lay);const hh=lay.dh/(nR===1?2:4);
      ctx.beginPath();ctx.moveTo(xx,cy-hh);ctx.lineTo(xx,cy+hh);ctx.stroke();
    }
  });

  // Amplitude reference lines at source
  if(lv.mode==='manual' && G.phase!=='done'){
    const rope=G.ropes[0], cy=lay.cys[0];
    const srcX=wx2c((rope.srcIdx-rope.o)*rope.dx,rope.L,lay);
    const ampH=20*dpr; // short horizontal lines
    for(const sign of [-1,1]){
      const yy=wy2c(sign*G.tgtAmp,cy,as);
      ctx.strokeStyle='rgba(255,215,0,.35)';ctx.lineWidth=1.5*dpr;
      ctx.setLineDash([3*dpr,3*dpr]);
      ctx.beginPath();ctx.moveTo(srcX-ampH,yy);ctx.lineTo(srcX+ampH,yy);ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // Target overlay
  drawTarget(ctx,lv,lay,as);

  // Ropes
  G.ropes.forEach((r,ri)=>drawRope(ctx,r,lay.cys[ri],r.L,lay,as));

  // Source handle (manual mode)
  if(lv.mode==='manual') drawHandle(ctx,G.ropes[0],lay.cys[0],G.ropes[0].L,lay,as);

  // Labels
  G.ropes.forEach((r,ri)=>{
    const cy=lay.cys[ri];
    ctx.font=`${11*dpr}px "Noto Sans TC",sans-serif`;ctx.fillStyle='rgba(100,130,180,.6)';
    ctx.textAlign='left';ctx.textBaseline='top';
    if(nR>1)ctx.fillText(ri===0?'目標':'你的繩子',lay.lx,cy-lay.dh/(nR===1?2:4)-14*dpr);
    ctx.textAlign='center';ctx.textBaseline='top';
    for(let x=0;x<=r.L;x+=1)
      ctx.fillText(x+'m',wx2c(x,r.L,lay),cy+lay.dh/(nR===1?2:4)+2*dpr);
  });
}

function drawRope(ctx,rope,cy,L,lay,as){
  ctx.beginPath();
  for(let i=0;i<=rope.N;i++){
    const x=wx2c(i*rope.dx,L,lay),y=wy2c(rope.y[rope.o+i],cy,as);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  const muW=clamp(1.5+rope.mu*6,1.5,8);
  ctx.save();ctx.shadowColor=rope.color;ctx.shadowBlur=10*dpr;
  ctx.strokeStyle=rope.color;ctx.lineWidth=muW*dpr;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,muW*.45)*dpr;ctx.stroke();
}

function drawTarget(ctx,lv,lay,as){
  const rope=G.ropes[G.ropes.length-1];
  const cy=lay.cys[G.ropes.length-1], L=rope.L;

  if(lv.mode==='manual'){
    // Draw zone background
    const zx0=wx2c(G.zoneStart,L,lay), zx1=wx2c(G.zoneEnd,L,lay);
    const hh=lay.dh/(G.ropes.length===1?2:4);
    ctx.fillStyle='rgba(0,204,255,.05)';
    ctx.fillRect(zx0,cy-hh,zx1-zx0,hh*2);
    // Zone border
    ctx.strokeStyle='rgba(0,204,255,.25)';ctx.lineWidth=dpr;
    ctx.setLineDash([4*dpr,4*dpr]);
    ctx.strokeRect(zx0,cy-hh,zx1-zx0,hh*2);
    ctx.setLineDash([]);
    // Label
    ctx.font=`${11*dpr}px "Noto Sans TC",sans-serif`;
    ctx.fillStyle='rgba(0,204,255,.5)';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText('檢核區',( zx0+zx1)/2,cy+hh+2*dpr);
    // Target waveform as dashed curve
    ctx.strokeStyle='rgba(255,215,0,.65)';ctx.lineWidth=2.5*dpr;
    ctx.setLineDash([5*dpr,4*dpr]);ctx.beginPath();
    let started=false;
    for(let px=Math.max(0,zx0-2);px<=Math.min(W,zx1+2);px+=1.5){
      const wx=(px-lay.lx)/lay.dw*L;
      const val=G.targetFn(wx);
      const y=wy2c(val,cy,as);
      if(!started){ctx.moveTo(px,y);started=true}else ctx.lineTo(px,y);
    }
    ctx.stroke();ctx.setLineDash([]);
    // Peak match indicator
    if(G.peakMatch>0){
      ctx.font=`bold ${12*dpr}px "Noto Sans TC",sans-serif`;
      ctx.fillStyle=G.peakMatch>.65?'rgba(0,232,123,.8)':G.peakMatch>.45?'rgba(255,200,0,.7)':'rgba(255,100,60,.6)';
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(`最高 ${Math.round(G.peakMatch*100)}%`,(zx0+zx1)/2,cy-hh-4*dpr);
    }
  }

  if(lv.mode==='periodic'){
    // Phase-aligned target dashed sine
    const z0=G.zoneStart, zE=G.zoneEnd;
    const zx0=wx2c(z0,L,lay), zx1=wx2c(zE,L,lay);
    const hh=lay.dh/(G.ropes.length===1?2:4);
    // Zone background
    ctx.fillStyle='rgba(0,204,255,.04)';
    ctx.fillRect(zx0,cy-hh,zx1-zx0,hh*2);
    ctx.strokeStyle='rgba(0,204,255,.15)';ctx.lineWidth=dpr;
    ctx.setLineDash([4*dpr,4*dpr]);ctx.strokeRect(zx0,cy-hh,zx1-zx0,hh*2);ctx.setLineDash([]);
    ctx.font=`${10*dpr}px "Noto Sans TC",sans-serif`;
    ctx.fillStyle='rgba(0,204,255,.4)';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText('檢核區',(zx0+zx1)/2,cy+hh+2*dpr);

    // Draw target sine with phase alignment
    ctx.strokeStyle='rgba(255,215,0,.55)';ctx.lineWidth=2.5*dpr;
    ctx.setLineDash([5*dpr,4*dpr]);ctx.beginPath();
    let started=false;
    for(let px=Math.max(0,zx0-5);px<=Math.min(W,zx1+5);px+=1.5){
      const wx=(px-lay.lx)/lay.dw*L;
      if(wx<z0||wx>zE)continue;
      const val=periodicTargetFn(wx,G.tgtLambda,G.tgtAmp,G.tgtPhase);
      const y=wy2c(val,cy,as);
      if(!started){ctx.moveTo(px,y);started=true}else ctx.lineTo(px,y);
    }
    ctx.stroke();ctx.setLineDash([]);
    // Info
    ctx.font=`${11*dpr}px "Noto Sans TC",sans-serif`;
    ctx.fillStyle='rgba(255,215,0,.5)';ctx.textAlign='left';ctx.textBaseline='bottom';
    let info=`目標 λ=${G.tgtLambda.toFixed(2)}m`;
    if(lv.adjAmp) info+=` A=${G.tgtAmp.toFixed(2)}`;
    ctx.fillText(info,zx0,cy-hh-2*dpr);
  }

  if(lv.mode==='speed'){
    const ref=G.ropes[0],stu=G.ropes[1];
    if(ref&&stu){
      ctx.font=`bold ${13*dpr}px "Noto Sans TC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillStyle='rgba(255,160,64,.7)';
      ctx.fillText(`目標波速: ${ref.c.toFixed(2)} m/s`,W/2,lay.cys[0]-lay.dh/4-4*dpr);
      ctx.fillStyle='rgba(0,232,123,.7)';
      ctx.fillText(`你的波速: ?.?? m/s`,W/2,lay.cys[1]-lay.dh/4-4*dpr);
    }
  }
}

function drawHandle(ctx,rope,cy,L,lay,as){
  const vp=(rope.srcIdx-rope.o)*rope.dx;
  const sx=wx2c(vp,L,lay), sy=wy2c(rope.srcY,cy,as);
  const r=14*dpr;
  ctx.beginPath();ctx.arc(sx,sy,r+4*dpr,0,TAU);
  ctx.fillStyle=G.dragging?'rgba(255,200,0,.18)':'rgba(255,136,68,.1)';ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,r,0,TAU);
  const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
  if(G.dragging){gr.addColorStop(0,'#ffe066');gr.addColorStop(1,'#ff8800')}
  else{gr.addColorStop(0,'#ffaa55');gr.addColorStop(1,'#cc5500')}
  ctx.fillStyle=gr;ctx.shadowColor=G.dragging?'#ffcc00':'#ff8844';ctx.shadowBlur=16*dpr;
  ctx.fill();ctx.shadowBlur=0;
  if(G.phase==='ready'&&!G.dragging){
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2*dpr;
    ctx.beginPath();ctx.moveTo(sx,sy-r-6*dpr);ctx.lineTo(sx,sy-r-18*dpr);
    ctx.moveTo(sx-5*dpr,sy-r-14*dpr);ctx.lineTo(sx,sy-r-18*dpr);ctx.lineTo(sx+5*dpr,sy-r-14*dpr);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx,sy+r+6*dpr);ctx.lineTo(sx,sy+r+18*dpr);
    ctx.moveTo(sx-5*dpr,sy+r+14*dpr);ctx.lineTo(sx,sy+r+18*dpr);ctx.lineTo(sx+5*dpr,sy+r+14*dpr);ctx.stroke();
  }
}

/* ─── Match display ─── */
function updateMatchUI(cur,peak){
  const pct=Math.round(cur*100);
  $('matchFill').style.width=pct+'%';
  $('matchFill').style.background=cur>.7?'var(--accent)':cur>.4?'#ffa040':'var(--warn)';
  const lv=LEVELS[G.level];
  if(lv.mode==='manual')
    $('matchPct').textContent=peak>0?`${pct}% (最高 ${Math.round(peak*100)}%)`:`${pct}%`;
  else
    $('matchPct').textContent=`${pct}%`;
}

/* ─── Level check ─── */
function checkLevel(){
  const lv=LEVELS[G.level];
  const rope=G.ropes[G.ropes.length-1];

  if(lv.mode==='manual'){
    const m=computeZoneMatch(rope,G.zoneStart,G.zoneEnd,G.targetFn);
    G.curMatch=m;
    if(m>G.peakMatch) G.peakMatch=m;
    updateMatchUI(m,G.peakMatch);
    // Auto-pass when peak match exceeds threshold (pulse passes briefly)
    const passT=lv.threshold||.75;
    if(G.peakMatch>=passT && G.t>1.0 && G.phase==='active') finishLevel();
  }

  if(lv.mode==='periodic'){
    const{match,phase}=computePeriodicMatch(rope,G.zoneStart,G.zoneEnd,G.tgtLambda,G.tgtAmp);
    G.curMatch=match; G.tgtPhase=phase;
    if(match>G.peakMatch) G.peakMatch=match;
    updateMatchUI(match,G.peakMatch);
  }

  if(lv.mode==='speed'){
    const refC=G.ropes[0].c, stuC=G.ropes[1].c;
    const err=Math.abs(stuC-refC)/refC;
    const m=clamp(1-err*4,0,1);
    G.curMatch=m;
    if(m>G.peakMatch) G.peakMatch=m;
    updateMatchUI(m,G.peakMatch);
  }
}

/* ─── Star computation ─── */
function computeStars(match){
  const slow=G.speed<1;
  // Tighter thresholds for slow speed
  const t1=slow?.65:.60, t2=slow?.82:.78, t3=slow?.92:.88;
  if(match>=t3)return 3;
  if(match>=t2)return 2;
  if(match>=t1)return 1;
  return 0;
}

function finishLevel(){
  if(G.phase==='done')return;
  G.phase='done'; G.running=false;
  const lv=LEVELS[G.level];
  let match=G.peakMatch;

  // For speed mode, use direct error for stars
  if(lv.mode==='speed'){
    const err=Math.abs(G.ropes[1].c-G.ropes[0].c)/G.ropes[0].c;
    const slow=G.speed<1;
    const t1=slow?.12:.15, t2=slow?.06:.08, t3=slow?.025:.04;
    G.earnedStars=err<=t3?3:err<=t2?2:err<=t1?1:0;
  } else if(lv.mode==='measure'){
    const userAns=parseFloat($('answerInput').value)||0;
    const relErr=Math.abs(userAns-G.mAnswer)/Math.abs(G.mAnswer);
    G.earnedStars=relErr<=.02?3:relErr<=.08?2:1;
  } else {
    G.earnedStars=computeStars(match);
  }
  if(G.earnedStars<1) G.earnedStars=1; // passed = at least 1
  if(G.earnedStars>G.stars[G.level]){G.stars[G.level]=G.earnedStars;saveProgress()}
  setTimeout(()=>showResult(G.earnedStars),300);
}

function showResult(stars){
  $('resStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('resMsg').textContent=stars>=3?'完美！':stars>=2?'很棒！':'過關！';
  $('resMsg').style.color=stars>=3?'var(--gold)':stars>=2?'var(--accent)':'var(--text)';
  const lv=LEVELS[G.level];
  if(lv.mode==='speed'){
    const stu=G.ropes[1], ref=G.ropes[0];
    const err=Math.abs(stu.c-ref.c)/ref.c;
    $('resDetail').textContent=`波速：${stu.c.toFixed(2)} m/s（目標 ${ref.c.toFixed(2)} m/s，誤差 ${Math.round(err*100)}%）`;
  } else if(lv.mode==='measure'){
    const userAns=parseFloat($('answerInput').value)||0;
    $('resDetail').textContent=`你的答案：${userAns} ${lv.qUnit}（正確答案：${G.mAnswer} ${lv.qUnit}）`;
  } else {
    const pct=Math.round(G.peakMatch*100);
    $('resDetail').textContent=`符合度：${pct}%`+(G.speed<1?' （慢速 — 標準更嚴格）':'');
  }
  if(G.level>=LEVELS.length-1){
    const allDone=G.stars.every(s=>s>0);
    $('resNext').textContent=allDone?'🏆 查看總結':'🏠 返回選關';
    $('resNext').onclick=function(){sfxClick();$('resultPanel').hidden=true;showScreen(allDone?'complete':'levels')};
    $('resNext').hidden=false;
  } else {
    $('resNext').textContent='下一關 ▶';
    $('resNext').onclick=function(){sfxClick();$('resultPanel').hidden=true;G.level++;startLevel(G.level)};
    $('resNext').hidden=false;
  }
  $('resultPanel').hidden=false;
  if(stars>=2) sfxWin(); else sfxStar();
}

function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

/* ─── Confirm for periodic/speed ─── */
function confirmLevel(){
  sfxClick(); initAudio();
  const lv=LEVELS[G.level];
  if(lv.mode==='periodic'){
    if(G.curMatch<.60){showToast('再調整看看！符合度需達 60% 以上');return}
    finishLevel();
  }
  if(lv.mode==='speed'){
    const err=Math.abs(G.ropes[1].c-G.ropes[0].c)/G.ropes[0].c;
    if(err>.15){showToast('波速差異還太大！');return}
    finishLevel();
  }
  if(lv.mode==='measure'){
    const userAns=parseFloat($('answerInput').value);
    if(isNaN(userAns)){showToast('請輸入數值！');return}
    const correct=G.mAnswer;
    const relErr=Math.abs(userAns-correct)/Math.abs(correct);
    if(relErr>.15){
      showToast(`不太對喔！再想想看（誤差 ${Math.round(relErr*100)}%）`);
      return;
    }
    // Calculate match score from error
    G.peakMatch=clamp(1-relErr*5,0,1);
    finishLevel();
  }
}

/* ─── Input handling ─── */
function getPointerPos(e){
  const rect=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return{x:(t.clientX-rect.left)*dpr,y:(t.clientY-rect.top)*dpr};
}
function handleDown(e){
  e.preventDefault();initAudio();
  const lv=LEVELS[G.level];

  // Measure mode: dot selection
  if(lv.mode==='measure'&&G.phase!=='done'){
    const p=getPointerPos(e);
    const lay=layout(1), cy=lay.cys[0], maxAV=.65, as=lay.dh/2/maxAV;
    const L=G.mWave.length;
    let closest=-1, minD=30*dpr;
    G.snapDots.forEach((dot,i)=>{
      const px=lay.lx+dot.pos/L*lay.dw;
      const py=wy2c(dot.val,cy,as);
      const d=Math.hypot(p.x-px,p.y-py);
      if(d<minD){minD=d;closest=i}
    });
    if(closest>=0){
      sfxClick();
      const idx=G.selectedDots.indexOf(closest);
      if(idx>=0){
        G.selectedDots.splice(idx,1); // deselect
      } else {
        if(G.selectedDots.length>=2) G.selectedDots.shift(); // replace oldest
        G.selectedDots.push(closest);
      }
      // Update measure info
      if(G.selectedDots.length===2){
        const d0=G.snapDots[G.selectedDots[0]], d1=G.snapDots[G.selectedDots[1]];
        const dist=Math.abs(d1.pos-d0.pos);
        const unit=G.mWave.axis==='x'?'m':'s';
        const prefix=G.mWave.axis==='x'?'Δx':'Δt';
        $('measureInfo').textContent=`${prefix} = ${dist.toFixed(2)} ${unit}　→ 輸入答案後按確認`;
      } else {
        $('measureInfo').textContent='👆 再選一個點';
      }
    }
    return;
  }

  if(lv.mode!=='manual'||G.phase==='done')return;
  const p=getPointerPos(e), rope=G.ropes[0];
  const lay=layout(G.ropes.length), cy=lay.cys[0];
  const as=lay.dh/2/.65;
  const vp=(rope.srcIdx-rope.o)*rope.dx;
  const sx=wx2c(vp,rope.L,lay), sy=wy2c(rope.srcY,cy,as);
  if(Math.hypot(p.x-sx,p.y-sy)<40*dpr){G.dragging=true;G.phase='active';sfxClick()}
}
function handleMove(e){
  if(!G.dragging)return;e.preventDefault();
  const p=getPointerPos(e),lay=layout(G.ropes.length);
  const cy=lay.cys[0],as=lay.dh/2/.65;
  G.sourceY=clamp(-(p.y-cy)/as,-.6,.6);
  G.ropes[0].srcY=G.sourceY;
}
function handleUp(){G.dragging=false}
cv.addEventListener('pointerdown',handleDown);
cv.addEventListener('pointermove',handleMove);
cv.addEventListener('pointerup',handleUp);
cv.addEventListener('pointercancel',handleUp);

// ─── Calculator ───
let calcBuf='', calcOp='', calcPrev=0, calcExprStr='', calcResult=0, calcJustEval=false;
const opSymbol={'+':'+','-':'−','*':'×','/':'÷'};
function calcUpdateDisp(){
  $('calcDisp').textContent=calcBuf||String(calcResult);
  $('calcExpr').textContent=calcExprStr;
}
function toggleCalc(){
  const pad=$('calcPad');
  pad.hidden=!pad.hidden;
  $('btnCalcToggle').style.background=pad.hidden?'':'var(--accent)';
  $('btnCalcToggle').style.color=pad.hidden?'':'#082';
}
function calcEval(a,op,b){
  if(op==='+')return a+b;if(op==='-')return a-b;
  if(op==='*')return a*b;if(op==='/')return b!==0?a/b:0;return b;
}
function calcKey(k){
  sfxClick();
  if(k==='C'){
    calcBuf='';calcOp='';calcPrev=0;calcExprStr='';calcResult=0;calcJustEval=false;
    calcUpdateDisp();return;
  }
  if(k==='⌫'){ calcBuf=calcBuf.slice(0,-1);calcUpdateDisp();return; }
  if('0123456789.'.includes(k)){
    if(k==='.'&&calcBuf.includes('.'))return;
    if(calcJustEval){calcBuf='';calcExprStr='';calcOp='';calcPrev=0;calcJustEval=false;}
    calcBuf+=k; calcUpdateDisp(); return;
  }
  const cur=parseFloat(calcBuf)||0;
  if(k==='='){
    if(!calcOp){calcResult=cur;calcExprStr=cur+'=';calcBuf=String(+cur.toFixed(4));calcJustEval=true;calcUpdateDisp();return;}
    calcResult=+calcEval(calcPrev,calcOp,cur).toFixed(4);
    calcExprStr+=calcBuf+' =';
    calcBuf=String(calcResult); calcOp=''; calcPrev=0; calcJustEval=true;
    calcUpdateDisp();
  } else {
    if(calcJustEval){
      // chain from previous result
      calcPrev=calcResult; calcOp=k;
      calcExprStr=calcResult+' '+opSymbol[k]+' ';
      calcBuf=''; calcJustEval=false;
      calcUpdateDisp();return;
    }
    if(calcOp){
      const res=+calcEval(calcPrev,calcOp,cur).toFixed(4);
      calcExprStr=res+' '+opSymbol[k]+' ';
      calcPrev=res;
    } else {
      calcExprStr=cur+' '+opSymbol[k]+' ';
      calcPrev=cur;
    }
    calcOp=k; calcBuf=''; calcJustEval=false;
    calcUpdateDisp();
  }
}

  const val=$('calcDisp').textContent;
  if(val) $('answerInput').value=val;
}

// Position source controls near the wave source
function positionSrcControls(){
  const ctrl=$('srcControls');
  if(ctrl.hidden)return;
  const wrapRect=$('cvWrap');
  const wrapW=wrapRect.clientWidth, wrapH=wrapRect.clientHeight;
  if(G.ropes.length===0){
    // measure mode: center controls below the wave area
    const ctrlW=ctrl.offsetWidth||180;
    let left=(wrapW-ctrlW)/2;
    left=clamp(left,4,wrapW-ctrlW-4);
    ctrl.style.left=left+'px';
    ctrl.style.top=(wrapH-ctrl.offsetHeight-8)+'px';
    return;
  }
  const rope=G.ropes[G.ropes.length-1];
  const lay=layout(G.ropes.length);
  const riCtrl=G.ropes.length===1?0:1; // control student's rope
  const srcRope=G.ropes.length===1?G.ropes[0]:G.ropes[1];
  const srcX=(srcRope.srcIdx-srcRope.o)*srcRope.dx;
  const cx=wx2c(srcX,srcRope.L,lay)/dpr; // CSS px
  const cy=lay.cys[G.ropes.length-1]/dpr;
  // Position: below center of rope, near source X
  const ctrlW=ctrl.offsetWidth||180;
  let left=cx-ctrlW/2;
  // Clamp to canvas bounds
  left=clamp(left,4,wrapW-ctrlW-4);
  const top=Math.min(cy+55,wrapH-ctrl.offsetHeight-4);
  ctrl.style.left=left+'px';
  ctrl.style.top=top+'px';
}

/* ─── Level start ─── */
function startLevel(idx){
  G.level=idx; const lv=LEVELS[idx];
  G.t=0;G.running=true;G.phase='ready';
  G.peakMatch=0;G.curMatch=0;G.matchAboveCount=0;G.sourceY=0;G.dragging=false;
  G.speed=1; G.tgtPhase=0;
  $('resultPanel').hidden=true;
  $('sp05').classList.remove('active');$('sp1').classList.add('active');

  // Randomize target
  if(lv.mode==='manual'){
    G.tgtShape=pick(lv.shapes);
    G.tgtAmp=randRange(lv.ampR[0],lv.ampR[1]);
    G.tgtWidth=randRange(lv.widthR[0],lv.widthR[1]);
    // Zone on far side from source
    if(lv.srcPos===0){
      G.zoneStart=lv.L*.55;
      G.zoneEnd=G.zoneStart+G.tgtWidth;
      if(G.zoneEnd>lv.L*.92){G.zoneEnd=lv.L*.92;G.zoneStart=G.zoneEnd-G.tgtWidth}
    } else {
      G.zoneEnd=lv.L*.45;
      G.zoneStart=G.zoneEnd-G.tgtWidth;
      if(G.zoneStart<lv.L*.08){G.zoneStart=lv.L*.08;G.zoneEnd=G.zoneStart+G.tgtWidth}
    }
    G.targetFn=makeManualTarget(G.tgtShape,G.tgtAmp,G.zoneStart,G.tgtWidth);
    // Init rope
    const r=initRope({L:lv.L,F:lv.F,mu:lv.mu,srcPos:lv.srcPos});
    r.periodic=false;
    G.ropes=[r];
  }

  if(lv.mode==='periodic'){
    G.freq=lv.initFreq; G.amp=lv.initAmp;
    G.tension=lv.F; G.mu=lv.mu;
    G.tgtLambda=randRange(lv.tgtLambdaR[0],lv.tgtLambdaR[1]);
    G.tgtAmp=lv.tgtAmpFixed?lv.initAmp:randRange(lv.tgtAmpR[0],lv.tgtAmpR[1]);
    G.zoneStart=lv.L*.25; G.zoneEnd=lv.L*.88;
    const r=initRope({L:lv.L,F:lv.F,mu:lv.mu,srcPos:lv.srcPos,freq:G.freq,amp:G.amp});
    r.periodic=true;
    G.ropes=[r];
    G.phase='active';
  }

  if(lv.mode==='measure'){
    let param;
    if(lv.axis==='x'){
      param=Math.round(randRange(lv.mLambdaR[0],lv.mLambdaR[1])*4)/4;
    } else {
      param=Math.round(randRange(lv.mPeriodR[0],lv.mPeriodR[1])*20)/20;
    }
    const waveLen=param;
    G.mWave={axis:lv.axis, lambda:lv.axis==='x'?param:null, period:lv.axis==='t'?param:null,
             amp:lv.mAmp, length:lv.mLength, qType:lv.qType};
    if(lv.mShowPeriod) G.mWave.period=Math.round(randRange(0.3,0.8)*20)/20;
    if(lv.qType==='wavelength') G.mAnswer=G.mWave.lambda;
    else if(lv.qType==='period') G.mAnswer=G.mWave.period;
    else if(lv.qType==='frequency') G.mAnswer=+(1/G.mWave.period).toFixed(2);
    else if(lv.qType==='speed') G.mAnswer=+(G.mWave.lambda/G.mWave.period).toFixed(2);
    G.snapDots=[]; G.selectedDots=[];
    const step=waveLen/4;
    for(let n=0; n*step<=lv.mLength+.001; n++){
      const pos=n*step;
      const val=lv.mAmp*Math.sin(2*Math.PI*pos/waveLen);
      G.snapDots.push({pos,val});
    }
    G.ropes=[]; G.phase='active';
  }

  if(lv.mode==='speed'){
    G.freq=lv.srcFreq; G.amp=lv.srcAmp;
    const refF=randRange(lv.refFR[0],lv.refFR[1]);
    const refMu=lv.refMuR?randRange(lv.refMuR[0],lv.refMuR[1]):lv.mu;
    G.tension=lv.F; G.mu=lv.mu;
    const ref=initRope({L:lv.L,F:refF,mu:refMu,srcPos:lv.srcPos,freq:lv.srcFreq,amp:lv.srcAmp,color:'#ffa040'});
    ref.periodic=true;
    const stu=initRope({L:lv.L,F:lv.F,mu:lv.mu,srcPos:lv.srcPos,freq:lv.srcFreq,amp:lv.srcAmp,color:'#00ff88'});
    stu.periodic=true;
    G.ropes=[ref,stu];
    G.phase='active';
  }

  // UI
  const chStart=LEVELS.findIndex(l=>l.ch===lv.ch);
  $('lvTitle').textContent=`${lv.ch+1}-${idx-chStart+1}  ${lv.title}`;
  $('starDisp').textContent='☆☆☆';
  $('mission').textContent=lv.desc;
  $('hintBubble').textContent=lv.hint||'';
  $('hintBubble').classList.remove('show');
  updateMatchUI(0,0);
  updateSpeedNote();

  // Source controls visibility
  const sc=$('srcControls');
  sc.classList.remove('draggable');
  if(lv.mode==='periodic'||lv.mode==='speed'){
    sc.hidden=false;
    const showFreq=lv.mode==='periodic'&&lv.adjFreq!==false;
    const showTension=lv.mode==='speed'||!!lv.adjTension;
    const showMu=lv.mode==='speed';
    $('freqRow').hidden=!showFreq;
    $('ampRow').hidden=!lv.adjAmp;
    $('tensionRow').hidden=!showTension;
    $('muRow').hidden=!showMu;
    $('answerRow').hidden=true;
    $('measureInfo').hidden=true;
    $('calcPad').hidden=true;
    if(showFreq) $('freqInput').value=G.freq.toFixed(1);
    if(lv.adjAmp) $('ampInput').value=G.amp.toFixed(2);
    if(showTension) $('tensionInput').value=G.tension.toFixed(1);
    if(showMu) $('muInput').value=G.mu.toFixed(2);
    setTimeout(positionSrcControls,50);
  } else if(lv.mode==='measure'){
    sc.hidden=false;
    sc.classList.add('draggable');
    $('freqRow').hidden=true;$('ampRow').hidden=true;
    $('tensionRow').hidden=true;$('muRow').hidden=true;
    $('answerRow').hidden=false;
    $('answerInput').value='';
    $('answerUnit').textContent=lv.qUnit;
    $('calcPad').hidden=true; calcBuf='';calcOp='';calcPrev=0;calcExprStr='';calcResult=0;calcJustEval=false;
    $('calcDisp').textContent='0';$('calcExpr').textContent='';
    $('btnCalcToggle').style.background='';$('btnCalcToggle').style.color='';
    $('measureInfo').hidden=false;
    $('measureInfo').textContent='👆 點選波上的圓點來測量';
    if(lv.mShowPeriod) $('measureInfo').textContent=`已知週期 T = ${G.mWave.period} s　👆 點選圓點測量波長`;
    setTimeout(positionSrcControls,50);
  } else {
    sc.hidden=true;
  }

  // Confirm button
  $('btnConfirm').hidden=lv.mode==='manual';
}

function updateSpeedNote(){
  $('speedNote').textContent=G.speed<1?'⚡ 慢速模式：看得更清楚，但評分標準更嚴格':'';
}

/* ─── Screens ─── */
function showScreen(name){
  $('titleScreen').hidden=name!=='title';
  $('levelsScreen').hidden=name!=='levels';
  $('gameScreen').hidden=name!=='game';
  $('completeScreen').hidden=name!=='complete';
  G.screen=name;
  if(name==='levels') buildLevelGrid();
  if(name==='game'){resizeCanvas();startLevel(G.level)}
  if(name==='complete') buildCompleteSummary();
}

function buildLevelGrid(){
  const unlocked=unlockedCount();
  let html='',curCh=-1;
  LEVELS.forEach((lv,i)=>{
    if(lv.ch!==curCh){
      if(curCh>=0)html+='</div>';
      curCh=lv.ch;
      html+=`<h2>${CHAPTERS[curCh].title}</h2><div class="lvl-grid">`;
    }
    const locked=i>=unlocked;
    const chIdx=i-LEVELS.findIndex(l=>l.ch===lv.ch)+1;
    const starStr=G.stars[i]>0?'★'.repeat(G.stars[i])+'☆'.repeat(3-G.stars[i]):'☆☆☆';
    html+=`<button class="lvl-card ${locked?'locked':''} ${G.stars[i]>0?'done':''}"
      onclick="selectLevel(${i})" ${locked?'disabled':''}><span>${locked?'🔒':chIdx}</span>
      <span class="stars-row">${locked?'':starStr}</span></button>`;
  });
  html+='</div>';
  $('levelGrid').innerHTML=html;
}
window.selectLevel=function(i){sfxClick();G.level=i;showScreen('game')};

function buildCompleteSummary(){
  const total=G.stars.reduce((a,b)=>a+b,0);
  const max=LEVELS.length*3;
  const now=new Date();
  const ts=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  $('completeSub').textContent=`總星數：${'★'.repeat(total)}  ${total} / ${max}`;
  let html=`<div style="width:100%;text-align:center;color:rgba(255,255,255,.45);font-size:13px;margin-bottom:4px">完成時間：${ts}</div>`;
  // Group by chapter, render as horizontal cards
  CHAPTERS.forEach((ch,ci)=>{
    const lvs=LEVELS.map((l,i)=>({...l,idx:i})).filter(l=>l.ch===ci);
    if(!lvs.length)return;
    let card=`<div style="background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;min-width:140px;flex:1 1 140px;max-width:200px">`;
    card+=`<div style="color:${ch.color};font-weight:bold;font-size:13px;margin-bottom:6px;white-space:nowrap">${ch.title}</div>`;
    lvs.forEach((lv,li)=>{
      const s=G.stars[lv.idx];
      const starStr=s>0?'★'.repeat(s)+'☆'.repeat(3-s):'☆☆☆';
      card+=`<div style="display:flex;justify-content:space-between;gap:4px;font-size:13px;line-height:1.7"><span>${ci+1}-${li+1}</span><span style="color:var(--gold);letter-spacing:1px">${starStr}</span></div>`;
    });
    card+='</div>';
    html+=card;
  });
  $('completeSummary').innerHTML=html;
}

/* ─── Game loop ─── */
let lastTs=0;
function gameLoop(ts){
  requestAnimationFrame(gameLoop);
  if(G.screen!=='game')return;
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;

  if(G.running&&G.phase!=='done'){
    const simDt=dt*G.speed;
    G.t+=simDt;

    if(!G.dragging&&LEVELS[G.level].mode==='manual'){
      G.sourceY*=.88;if(Math.abs(G.sourceY)<.001)G.sourceY=0;
      G.ropes[0].srcY=G.sourceY;
    }

    G.ropes.forEach(r=>stepRope(r,simDt));
    if(G.phase==='active') checkLevel();
  }

  render();
}

/* ─── Event listeners ─── */
$('startBtn').onclick=()=>{initAudio();sfxClick();showScreen('levels')};
$('backToTitle').onclick=()=>{sfxClick();showScreen('title')};
$('btnClearData').onclick=()=>{
  if(!confirm('確定要清空所有過關紀錄嗎？')) return;
  sfxClick();G.stars.fill(0);
  try{localStorage.removeItem('rwc_stars2')}catch(e){}
  buildLevelGrid();
};
$('btnBack').onclick=()=>{sfxClick();showScreen('levels')};
$('btnReset').onclick=$('btnResetBar').onclick=()=>{sfxClick();startLevel(G.level)};
$('btnHint').onclick=()=>{
  sfxClick();const hb=$('hintBubble');hb.classList.toggle('show');
  if(hb.classList.contains('show'))setTimeout(()=>hb.classList.remove('show'),4000);
};
$('resRetry').onclick=()=>{sfxClick();$('resultPanel').hidden=true;startLevel(G.level)};
$('btnConfirm').onclick=confirmLevel;

// Speed buttons
$('sp05').onclick=()=>{G.speed=.5;sfxClick();$('sp05').classList.add('active');$('sp1').classList.remove('active');updateSpeedNote()};
$('sp1').onclick=()=>{G.speed=1;sfxClick();$('sp1').classList.add('active');$('sp05').classList.remove('active');updateSpeedNote()};

window.addEventListener('resize',()=>{
  if(G.screen==='game'){resizeCanvas();positionSrcControls()}
});

/* ─── Init ─── */
loadProgress();
requestAnimationFrame(gameLoop);
</script>

</body></html>
