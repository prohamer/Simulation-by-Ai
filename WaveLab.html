<title>WaveLabV11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: wood-framed blackboard stage on the left, instrument panel on the right; stacks to one column on phones */
:root{
  --bg:#e9ece6; --panel:#f7f8f4; --ink:#1d2824; --muted:#5d6b65; --line:#d2d9d3;
  --accent:#1d6b58; --accent-ink:#ffffff; --chip:#e1e7e2; --warn:#a9482a; --field:#ffffff;
  --board:#1c322c; --board-hi:#26443c; --chalk:#eef0e6; --chalk-dim:rgba(238,240,230,.66); --chalk-faint:rgba(238,240,230,.16);
  --frame:#6e5235; --frame-hi:#8a6a46; --frost:#a9dcf2;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Sans TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#101614; --panel:#161e1b; --ink:#e3eae6; --muted:#93a29b; --line:#2a3632;
    --accent:#6fcdb0; --accent-ink:#08130f; --chip:#212c28; --warn:#f08f6d; --field:#0f1513; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#101614; --panel:#161e1b; --ink:#e3eae6; --muted:#93a29b; --line:#2a3632;
  --accent:#6fcdb0; --accent-ink:#08130f; --chip:#212c28; --warn:#f08f6d; --field:#0f1513; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
button,.chip,.preset,label{touch-action:manipulation}
#stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#panel h1{display:flex;align-items:baseline;gap:8px}
#panel h1 .hide{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
#panel h1 .hide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app.nopanel{grid-template-columns:minmax(0,1fr)}
#app.nopanel #panel{display:none}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* ---------- stage ---------- */
#stage{position:relative;min-height:0;min-width:0;border-radius:12px;overflow:hidden;background:var(--board);
  border:7px solid var(--frame);box-shadow:inset 0 0 0 1px var(--frame-hi),0 2px 0 var(--frame-hi)}
#stage canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;touch-action:none}
#overlay.on{pointer-events:auto;cursor:crosshair}
.hud{position:absolute;z-index:3;color:var(--chalk);font-family:var(--f-body)}
.chalkcard{background:rgba(16,30,26,.82);border:1px solid var(--chalk-faint);border-radius:10px;backdrop-filter:blur(3px)}

#scn{top:10px;left:10px;max-width:min(360px,calc(100% - 20px));padding:10px 12px}
#scn h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.25;text-wrap:balance;display:flex;gap:8px;align-items:center}
#scn h2 button{margin-left:auto;background:none;border:1px solid var(--chalk-faint);border-radius:6px;color:var(--chalk-dim);font-size:12px;padding:1px 7px;cursor:pointer}
#scn ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--chalk-dim)}
#scn li{margin:2px 0}
#scn.collapsed ul{display:none}

#chart{top:10px;right:10px;width:300px;height:150px}
#formula{left:10px;bottom:62px;padding:10px 14px;font-size:13px;max-width:min(380px,calc(100% - 20px))}
#formula{cursor:pointer}
#formula.mini .eq{display:none}
#formula .tip{font-size:11px;color:var(--chalk-dim);margin-top:2px}
#formula .eq{font-family:var(--f-mono);font-size:14px;line-height:1.7;white-space:nowrap;overflow-x:auto}
#formula .eq b{color:#f2c14e;font-weight:500}
#formula .say{font-family:var(--f-display);font-size:16px;margin-top:4px;color:var(--chalk)}
#drawBar{top:10px;left:10px;right:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
#drawBar .msg{flex:1 1 220px;min-width:0}
#drawBar .msg b{font-family:var(--f-display);font-size:16px;font-weight:700}

#transport{left:0;right:0;bottom:0;padding:8px 10px;display:flex;gap:6px;align-items:center;overflow-x:auto;
  background:linear-gradient(to top,rgba(10,22,18,.92),rgba(10,22,18,.55));scrollbar-width:thin}
.tb{flex:none;height:34px;min-width:34px;padding:0 10px;border-radius:8px;border:1px solid var(--chalk-faint);
  background:rgba(238,240,230,.06);color:var(--chalk);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;font-size:13px;white-space:nowrap}
.tb:hover{background:rgba(238,240,230,.14)}
.tb.on{background:var(--chalk);color:var(--board);border-color:var(--chalk)}
.tb.big{background:#f2c14e;color:#22190a;border-color:#f2c14e;font-weight:700}
.tb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tsep{flex:none;width:1px;height:22px;background:var(--chalk-faint);margin:0 4px}
.tclock{flex:none;font-family:var(--f-mono);font-size:13px;color:var(--chalk);min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.tspeed{flex:none;display:flex;align-items:center;gap:6px;color:var(--chalk-dim);font-size:12px}
.tspeed input{width:96px;accent-color:#f2c14e}
.tspeed output{font-family:var(--f-mono);color:var(--chalk);min-width:44px;font-variant-numeric:tabular-nums}

#toast{position:absolute;z-index:6;left:50%;bottom:64px;transform:translateX(-50%);padding:7px 14px;border-radius:8px;
  background:var(--chalk);color:var(--board);font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* ---------- panel ---------- */
#panel{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#panel header{padding:12px 14px 0}
#panel h1{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em}
#panel h1 small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:2px;margin-top:10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:7px 2px 8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#pbody{flex:1;overflow:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:14px}

.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{margin:0;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--field)}
.card h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.card h4 .sp{flex:1}
.fr{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:8px;align-items:center}
.fr label{font-size:13px;color:var(--muted)}
.fr input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.num{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--panel)}
.num input{width:100%;min-width:0;border:0;background:none;padding:3px 0;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.num i{font-style:normal;color:var(--muted);font-size:11px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row>label{font-size:13px;color:var(--muted);min-width:68px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.warn{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-size:13px}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--panel)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.readout{font-family:var(--f-mono);font-size:12.5px;background:var(--chip);border-radius:8px;padding:8px 10px;line-height:1.7;font-variant-numeric:tabular-nums;overflow-x:auto}
.readout b{font-weight:500;color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.status{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:500}
.status.live{background:var(--accent);color:var(--accent-ink)}
.status.arm{background:#f2c14e;color:#22190a}
select{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:4px 6px;font-size:13px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.ck input{margin-top:3px;accent-color:var(--accent)}
.ck span small{display:block;color:var(--muted);font-size:12px}
.swatches{display:flex;gap:6px}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--ink)}
.presets{display:grid;grid-template-columns:1fr;gap:8px}
.preset{text-align:left;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 11px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline}
.preset:hover{border-color:var(--accent)}
.preset.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.preset .tag{grid-row:span 2;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.06em;min-width:2.6em}
.preset b{font-family:var(--f-display);font-size:16px;font-weight:700}
.preset span{font-size:12.5px;color:var(--muted)}
.arrows{display:flex;flex-direction:column;gap:4px}
.arow{display:grid;grid-template-columns:26px minmax(0,1fr) 30px;gap:6px;align-items:center}
.arow .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;color:#22190a}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px;font-family:var(--f-mono);font-size:12px;resize:vertical}
canvas.freehand{width:100%;height:130px;display:block;border-radius:8px;background:var(--board);touch-action:none;cursor:crosshair}
.saves{display:flex;flex-direction:column;gap:6px}
.save{display:flex;gap:6px;align-items:center;font-size:13px}
.save span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:900px){
  html,body{height:auto}
  #app{grid-template-columns:minmax(0,1fr);height:auto}
  #stage{height:62vh;height:62dvh;min-height:380px}
  #app.nopanel #stage{height:calc(100vh - 24px);height:calc(100dvh - 24px)}
  #panel{max-height:none}
  #pbody{overflow:visible}
  #chart{width:220px;height:118px}
}
@media (max-width:520px){
  #chart{display:none}
  #scn h2{font-size:17px}
  #formula{bottom:56px;padding:7px 10px}
  #formula .eq{font-size:11.5px;line-height:1.55}
  #formula .say{font-size:13px}
}
/* 觸控裝置（iPad 等）：整體高度降約 15%，避開瀏覽器網址列與分頁列 */
@media (pointer: coarse) and (min-width: 901px){
  html,body{height:auto}
  #app{height:85vh;height:85dvh}
}
@media (pointer: coarse) and (max-width: 900px){
  #stage{height:53vh;height:53dvh;min-height:340px}
  #app.nopanel #stage{height:85vh;height:85dvh}
}
/* 觸控裝置（iPad 等）：放大可點範圍、避免 iOS 對焦輸入框時自動放大 */
@media (pointer: coarse){
  .tb{height:44px;min-width:44px;padding:0 12px;font-size:14px}
  .tb svg{width:18px;height:18px}
  .tspeed input{width:130px;height:32px}
  .tclock{font-size:14px}
  #transport{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:8px}
  #formula{bottom:72px}
  #toast{bottom:76px}
  .tabs button{padding:12px 2px 13px;font-size:15px}
  .btn{padding:10px 14px;font-size:14px}
  .btn.sm{padding:8px 12px;font-size:13px}
  .seg button{padding:10px 14px;font-size:14px}
  .chip{padding:8px 14px;font-size:14px}
  .preset{padding:12px 14px}
  input,select,textarea,.num input{font-size:16px}
  select{padding:8px 8px}
  .num{padding:2px 8px}
  .fr{grid-template-columns:74px minmax(0,1fr) 108px;gap:10px}
  .fr input[type=range]{height:34px}
  .ck{padding:4px 0}
  .ck input{width:22px;height:22px;margin-top:0}
  .swatches button{width:30px;height:30px}
  .arow{grid-template-columns:30px minmax(0,1fr) 40px}
  .arow .n{width:26px;height:26px}
  #scn h2 button{padding:6px 12px;font-size:13px}
  #drawBar .tb{min-width:64px}
  canvas.freehand{height:170px}
  #panel h1 .hide{padding:8px 12px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>

<div id="app">
  <section id="stage" aria-label="3D 模擬畫面">
    <canvas id="overlay"></canvas>
    <div id="scn" class="hud chalkcard"><h2><span id="scnTitle">繩波實驗台</span><button id="scnToggle" type="button">收合</button></h2><ul id="scnNotes"></ul></div>
    <div id="drawBar" class="hud chalkcard" hidden>
      <div class="msg"><b>繪製波源振動</b>　從畫面任意處上下拖曳，畫出第 <span id="drawN">1</span> 支箭頭；箭頭長度＝位移量，依序接續。</div>
      <button class="tb" data-act="drawUndo" type="button">復原</button>
      <button class="tb" data-act="drawClear" type="button">清除</button>
      <button class="tb big" data-act="drawDone" type="button">完成</button>
    </div>
    <canvas id="chart" class="hud chalkcard" width="600" height="300" aria-label="位移–時間圖"></canvas>
    <div id="formula" class="hud chalkcard" hidden></div>
    <div id="transport" class="hud">
      <button class="tb" id="bTool" data-act="togglePanel" type="button" title="顯示／收合右側工具箱（T）" aria-label="工具箱" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 9h18v10H3z"/><path d="M8 9V6a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3"/><path d="M3 13h18"/><path d="M10 13v2h4v-2"/></svg><span>工具箱</span></button>
      <span class="tsep"></span>
      <button class="tb" id="bPlay" data-act="play" type="button" title="播放／暫停（空白鍵）"></button>
      <button class="tb" data-act="stepBack1" type="button" title="後退一格（←）"><svg viewBox="0 0 24 24"><path d="M18 19l-9-7 9-7z"/><path d="M6 5v14"/></svg></button>
      <button class="tb" data-act="step" type="button" title="前進一格（→）"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg></button>
      <button class="tb" data-act="stepBack" type="button" title="後退 ¼T（Shift+←）"><svg viewBox="0 0 24 24"><path d="M18 19l-9-7 9-7z"/><path d="M6 5v14"/></svg>−¼T</button>
      <button class="tb" data-act="stepFwd" type="button" title="前進 ¼T（Shift+→）"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg>+¼T</button>
      <button class="tb" data-act="resetWave" type="button" title="清除波形、時間歸零"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>歸零</button>
      <span class="tsep"></span>
      <button class="tb big" data-act="fireAll" type="button" title="觸發所有波源（P）">發射</button>
      <span class="tsep"></span>
      <span class="tspeed"><label for="speed">速度</label><input id="speed" type="range" min="0" max="100" step="1"><output id="speedOut">1×</output></span>
      <button class="tb" data-act="speed" data-v="0.1" type="button">0.1×</button>
      <button class="tb" data-act="speed" data-v="0.25" type="button">¼×</button>
      <button class="tb" data-act="speed" data-v="1" type="button">1×</button>
      <span class="tsep"></span>
      <button class="tb" id="bMeasure" data-act="toggleMeasure" type="button" title="顯示／隱藏波長振幅量測（M）">量測</button>
      <button class="tb" id="bVelArr" data-act="toggleVelArrows" type="button" title="顯示質點振動方向小箭頭（V）">振動方向</button>
      <button class="tb" data-act="ghost" type="button" title="留下目前波形的殘影">殘影</button>
      <button class="tb" data-act="ghostClear" type="button" title="清除殘影">清殘影</button>
      <span class="tsep"></span>
      <button class="tb" data-act="view" data-v="front" type="button">正視</button>
      <button class="tb" data-act="view" data-v="oblique" type="button">斜視</button>
      <button class="tb" data-act="view" data-v="top" type="button">俯視</button>
      <button class="tb" id="bLock" data-act="lockView" type="button" title="鎖定／解鎖視角旋轉縮放（L）">🔓</button>
      <span class="tclock" id="clock">t = 0.000 s</span>
    </div>
    <div id="toast" hidden></div>
  </section>

  <aside id="panel" aria-label="設定面板">
    <header>
      <h1>繩波實驗台<small>力學波・3D 互動模擬</small><button type="button" class="hide" data-act="togglePanel" title="收合工具箱（T）"><svg viewBox="0 0 24 24"><path d="M3 9h18v10H3z"/><path d="M8 9V6a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3"/><path d="M3 13h18"/><path d="M10 13v2h4v-2"/></svg>收合</button></h1>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="scene">情境</button>
        <button role="tab" data-tab="medium">介質</button>
        <button role="tab" data-tab="source">波源</button>
        <button role="tab" data-tab="display">顯示</button>
        <button role="tab" data-tab="file">檔案</button>
      </nav>
    </header>
    <div id="pbody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
/* =========================================================
   基本工具
   ========================================================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;

    const mx = (A1.x + A2.x) / 2 + sideSign * px * 14, my = (A1.y + A2.y) / 2 + sideSign * py * 14;
    octx.fillStyle = col; octx.beginPath(); octx.arc(mx, my, 10, 0, TAU); octx.fill();
    octx.fillStyle = '#1c322c'; octx.font = '700 12px "JetBrains Mono", monospace'; octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.fillText(String(k + 1), mx, my + 0.5);
    octx.fillStyle = '#eef0e6'; octx.font = '500 11px "JetBrains Mono", monospace'; octx.textAlign = 'left';
    octx.fillText((q.d > 0 ? '+' : '') + fmt(q.d, 2) + 'm', A2.x + 6, A2.y);
    octx.globalAlpha = 1; octx.textBaseline = 'alphabetic';
    lowY = Math.max(lowY, A1.y, A2.y);
    cur += q.d;
  });
  if (list.length) {
    const k = list.length;
    if (src.custom.loop && Math.abs(cur - base0) > 1e-3) {
      const A1 = P(cur, k), A2 = P(base0, k);
      octx.setLineDash([5, 5]); octx.globalAlpha = playing === k ? 1 : 0.55;
      arrowHead(octx, A1.x, A1.y, A2.x, A2.y, 'rgba(238,240,230,.8)', 2); octx.setLineDash([]); octx.globalAlpha = 1;
      octx.fillStyle = 'rgba(238,240,230,.75)'; octx.font = '500 11px "Noto Sans TC", sans-serif'; octx.textAlign = 'left'; octx.fillText('重複播放：回到起點', A2.x + 8, A2.y + 14);
    } else if (Math.abs(cur) > 1e-3) {
      const E = P(cur, k - 0.4);
      octx.fillStyle = 'rgba(238,240,230,.8)'; octx.font = '500 11px "Noto Sans TC", sans-serif'; octx.textAlign = 'left';
      octx.fillText('結束後停在這裡', E.x + 16, E.y + 4);
    }
  }
  if (!DR.on && s.armed) {
    octx.fillStyle = '#f2c14e'; octx.font = '700 14px "LXGW WenKai TC", "Noto Sans TC", sans-serif';
    octx.textAlign = 'left'; octx.fillText('已備妥：按「播放」開始', a.bx - 20, lowY + 26);
  }
}

/* =========================================================
   位移–時間圖
   ========================================================= */
const CH = { t: [], a: [], b: [] };
const chart = $('#chart'), cctx = chart.getContext('2d');
function chartSample() {
  const r0 = S.ropes[clamp(S.probe.rope, 0, S.ropes.length - 1)]; if (!r0) return;
  const R = rt(r0), src = r0.sources[0];
  const vs = src ? R.y[Math.round(src.pos * R.N)] : 0, vp = R.y[Math.round(S.probe.pos * R.N)];
  const n = CH.t.length; if (n && S.t - CH.t[n - 1] < 0.004) return;
  CH.t.push(S.t); CH.a.push(vs); CH.b.push(vp);
  while (CH.t.length && S.t - CH.t[0] > 6.5) { CH.t.shift(); CH.a.shift(); CH.b.shift(); }
}
function drawChart() {
  chart.hidden = !S.display.chart; if (!S.display.chart) return;
  const W = chart.width, H = chart.height, c = cctx, d = W / chart.clientWidth || 2;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
  c.scale(d, d);
  const w = W / d, h = H / d, l = 30, rr = 8, tp = 22, bt = 18;
  const r0 = S.ropes[clamp(S.probe.rope, 0, S.ropes.length - 1)]; if (!r0) return;
  const A = Math.max(0.1, ropeAmpEst(r0)) * 1.15, win = 5;
  c.fillStyle = 'rgba(238,240,230,.85)'; c.font = '600 11px "Noto Sans TC", sans-serif';
  c.fillText('位移–時間圖', 8, 14);
  c.fillStyle = r0.color; c.fillRect(84, 7, 10, 3); c.fillStyle = 'rgba(238,240,230,.75)'; c.fillText('波源', 97, 14);
  c.fillStyle = '#ff5a4e'; c.fillRect(128, 7, 10, 3); c.fillStyle = 'rgba(238,240,230,.75)'; c.fillText('紅點 x=' + fmt(S.probe.pos * r0.L, 1) + 'm', 141, 14);
  const X = t => l + (t - (S.t - win)) / win * (w - l - rr), Y = v => tp + (h - tp - bt) / 2 * (1 - v / A);
  c.strokeStyle = 'rgba(238,240,230,.15)'; c.lineWidth = 1; c.beginPath();
  c.moveTo(l, Y(0)); c.lineTo(w - rr, Y(0)); c.moveTo(l, tp); c.lineTo(l, h - bt); c.stroke();
  c.fillStyle = 'rgba(238,240,230,.6)'; c.font = '10px "JetBrains Mono", monospace';
  c.fillText('+' + fmt(A, 1), 2, tp + 8); c.fillText('-' + fmt(A, 1), 2, h - bt);
  for (let k = Math.ceil(S.t - win); k <= S.t; k++) { if (k < 0) continue; const x = X(k); c.fillText(k + 's', x - 6, h - 4); c.strokeStyle = 'rgba(238,240,230,.08)'; c.beginPath(); c.moveTo(x, tp); c.lineTo(x, h - bt); c.stroke(); }
  const line = (arr, col) => { c.strokeStyle = col; c.lineWidth = 1.8; c.beginPath(); let st = false; for (let i = 0; i < CH.t.length; i++) { if (CH.t[i] < S.t - win) continue; const x = X(CH.t[i]), y = Y(clamp(arr[i], -A, A)); st ? c.lineTo(x, y) : c.moveTo(x, y); st = true; } c.stroke(); };
  line(CH.a, r0.color); line(CH.b, '#ff5a4e');
}

/* =========================================================
   主迴圈
   ========================================================= */
let last = performance.now(), frameN = 0;
function loop(now) {
  const real = clamp((now - last) / 1000, 0, 0.05); last = now; frameN++;
  if (!S.paused && !DR.on) {
    let dt = real * S.timeScale;
    // 步進模式：到達目標後暫停
    if (stepping) {
      const remain = stepping.target - S.t;
      if (remain <= dt + 1e-9) {
        dt = Math.max(0, remain);
        advance(dt);
        S.timeScale = stepping.origScale;
        stepping = null;
        setPaused(true);
        chartSample();
        if (S.display.measure) buildMeasure();
      } else {
        advance(dt);
      }
    } else {
      advance(dt);
    }
    chartSample();
    if (S.display.measure && frameN % 12 === 0) buildMeasure();
    // 定期快照（每 1/8T 一次）
    if (frameN % 4 === 0) takeSnapshot();
  }
  updateVisuals(); updateFormula();
  controls.update();
  renderer.render(scene, camera);
  drawOverlay(); drawChart();
  $('#clock').textContent = 't = ' + S.t.toFixed(3) + ' s';
  if (frameN % 10 === 0) updateStatus();
  requestAnimationFrame(loop);
}

const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>播放';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>暫停';
function setPaused(p) {
  const was = S.paused; S.paused = p;
  $('#bPlay').innerHTML = p ? ICON_PLAY : ICON_PAUSE;
  $('#bPlay').classList.toggle('on', p);
  if (!p) {
    if (DR.on) exitDraw();
    if (was) allSourceRefs().forEach(e => { if (e.s.armed) startSource(e.src, e.s); });
    last = performance.now();
  }
  if (p && S.display.measure) buildMeasure();
}
const SPEED_MIN = 0.02, SPEED_MAX = 2;
const speedToSlider = v => Math.round(100 * Math.log(v / SPEED_MIN) / Math.log(SPEED_MAX / SPEED_MIN));
const sliderToSpeed = p => SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, p / 100);
function setSpeed(v) {
  S.timeScale = clamp(v, SPEED_MIN, SPEED_MAX);
  $('#speed').value = speedToSlider(S.timeScale);
  $('#speedOut').textContent = (S.timeScale < 0.1 ? S.timeScale.toFixed(2) : S.timeScale < 1 ? S.timeScale.toFixed(2).replace(/0$/, '') : S.timeScale.toFixed(1).replace(/\.0$/, '')) + '×';
}
$('#speed').addEventListener('input', e => setSpeed(sliderToSpeed(+e.target.value)));

/* ---------- 快照系統（步退用）---------- */
const SNAP = { list: [], maxLen: 200, interval: 0 };
function takeSnapshot() {
  const snap = { t: S.t, ropes: [] };
  S.ropes.forEach(r => {
    const R = rt(r);
    snap.ropes.push({ y: new Float64Array(R.y), yp: new Float64Array(R.yp) });
  });
  SNAP.list.push(snap);
  if (SNAP.list.length > SNAP.maxLen) SNAP.list.shift();
}
function restoreSnapshot(snap) {
  S.t = snap.t;
  S.ropes.forEach((r, i) => {
    const R = rt(r);
    R.y.set(snap.ropes[i].y);
    R.yp.set(snap.ropes[i].yp);
    R.tSim = snap.t;
  });
}
function findSnapshot(tTarget) {
  // 找到最接近但不超過目標時間的快照
  let best = null;
  for (let i = SNAP.list.length - 1; i >= 0; i--) {
    if (SNAP.list[i].t <= tTarget + 1e-9) { best = SNAP.list[i]; break; }
  }
  return best;
}

/* ---------- 步進步退 ¼T（動畫播放）---------- */
let stepping = null; // { target, dir }
function getQuarterT() {
  const r = selRope();
  const src = r.sources[0];
  if (!src) return 0.05;
  return 0.25 / src.freq;
}
function stepQuarter(dir) {
  const qt = getQuarterT();
  const tTarget = Math.max(0, S.t + dir * qt);
  if (dir < 0) {
    const snap = findSnapshot(tTarget);
    if (!snap || tTarget < 1e-9) {
      resetWaves(); buildMeasure(); toast('已回到起點');
      return;
    }
    restoreSnapshot(snap);
  }
  // 步進前若有未發射的波源，自動發射
  if (dir > 0) {
    allSourceRefs().forEach(e => {
      if (!e.s.kind && (e.src.mode === 'periodic' || e.src.mode === 'custom' || e.src.mode === 'pulse')) startSource(e.src, e.s);
      else if (e.s.armed) startSource(e.src, e.s);
    });
  }
  S.paused = false; last = performance.now();
  stepping = { target: tTarget, origScale: S.timeScale };
  const dist = Math.abs(tTarget - S.t);
  S.timeScale = Math.max(0.5, dist / 0.4);
  $('#bPlay').innerHTML = ICON_PAUSE;
}

function stepBack1Frame() {
  if (!S.paused) setPaused(true);
  const dt = 1 / 60 * Math.max(0.25, S.timeScale);
  const tTarget = Math.max(0, S.t - dt);
  const snap = findSnapshot(tTarget);
  if (!snap) { resetWaves(); buildMeasure(); return; }
  restoreSnapshot(snap);
  // 從快照向前播到 tTarget
  while (S.t < tTarget - 1e-9) {
    const step = Math.min(rt(selRope()).h, tTarget - S.t);
    advance(step);
  }
  chartSample();
  if (S.display.measure) buildMeasure();
}

function fireAll() {
  let n = 0;
  allSourceRefs().forEach(e => { if (e.src.mode === 'pulse' || e.src.mode === 'custom' || (e.src.mode === 'periodic' && !e.s.kind)) { if (startSource(e.src, e.s)) n++; } });
  if (!n) toast('沒有可觸發的波源（手動模式請直接拖曳握把）');
  if (S.paused && n) setPaused(false);
}
function fireRope(r) {
  r.sources.forEach((_, j) => { const e = eff(r, j); if (e.src.mode !== 'manual') startSource(e.src, e.s); });
  if (S.paused) setPaused(false);
}

    const e = eff(r, j);
    const held = seqDone(e.src, e.s);
    const [txt, cls] = held ? ['停在 ' + fmt(heldVal(e.src, e.s), 2) + ' m', 'arm'] : e.s.kind === 'return' ? ['回到平衡位置中', 'live'] : e.s.kind ? ['振動中', 'live'] : e.s.armed ? ['已備妥', 'arm'] : ['閒置', ''];
    if (el.textContent !== txt) { el.textContent = txt; el.className = 'status ' + cls; }
  });
}

/* ---------- 綁定 ---------- */
function getRoot(bind) {
  const [head, ...rest] = bind.split('.');
  if (head === 'rope') return [selRope(), rest];
  if (head === 'src') return [selRope().sources[+rest[0]], rest.slice(1)];
  if (head === 'disp') return [S.display, rest];
  if (head === 'probe') return [S.probe, rest];
  if (head === 'formula') return [S.formula, rest];
  return [null, []];
}
function setBind(bind, v) {
  if (bind.startsWith('srcpos.')) { const r = selRope(), j = +bind.split('.')[1]; r.sources[j].pos = clamp(v / r.L, 0, 1); return; }
  const [obj, path] = getRoot(bind); if (!obj) return;
  let o = obj; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length - 1]] = v;
}
function afterChange(re, bind) {
  const set = new Set((re || '').split(',').filter(Boolean));
  const r = selRope();
  if (set.has('L')) { buildRT(r); r.sources.forEach(s => { srt(s).kind = null; }); set.add('scene'); set.add('fit'); }
  if (set.has('phys')) { updateC2(r); updateReadout(); if (S.formula.mode !== 'none') set.add('scene'); }
  if (set.has('amp') || set.has('fpanel')) { if (S.formula.mode !== 'none' && S.sel === 0) set.add('scene'); }
  if (bind === 'formula.mode' && S.formula.tStart === null && S.ropes[0]) { const e = eff(S.ropes[0], 0); if (e.s.kind) S.formula.tStart = e.s.t0; }
  if (/^src\.\d+\.mode$/.test(bind)) { const e = eff(r, +bind.split('.')[1]); e.s.kind = null; e.s.armed = false; }
  if (set.has('scene')) buildScene();
  if (set.has('fit')) fitView('front');
  if (set.has('measure')) buildMeasure();
  if (set.has('chips')) document.querySelectorAll('.chip.on').forEach(c => { const i = +c.dataset.i; if (S.ropes[i]) c.lastChild.textContent = S.ropes[i].name; });
  if (set.has('fh')) drawFreehandAll();
  if (set.has('panel')) renderPanel();
  if (S.tab === 'source') refreshSrcReadouts();
}
function refreshSrcReadouts() {
  const r = selRope(); if (!r) return;
  r.sources.forEach((src, j) => {
    const el = document.getElementById('rd-' + j); if (!el) return;
    const v = speed(r, src.pos * r.L);
    el.innerHTML = src.mode === 'periodic'
      ? `T = 1/f = <b>${fmt(1 / src.freq, 3)} s</b>　λ = v/f = <b>${fmt(v / src.freq, 2)} m</b>`
      : `脈衝寬度 ≈ 波速 × 持續時間 = <b>${fmt(v * src.width, 2)} m</b>`;
  });
}
pbody.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.arrow) {
    const [j, k] = el.dataset.arrow.split('.').map(Number), v = parseFloat(el.value);
    if (isFinite(v)) { const al = springAmpMax(selRope()); selRope().sources[j].custom.arrows[k].d = clamp(v, -al, al); }
    return;
  }
  if (el.dataset.adur) {
    const [j, k] = el.dataset.adur.split('.').map(Number), v = parseFloat(el.value);
    if (isFinite(v) && v >= 0.05) selRope().sources[j].custom.arrows[k].dur = clamp(v, 0.05, 3);
    return;
  }
  const b = el.dataset.bind; if (!b) return;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.dataset.num !== undefined) { v = parseFloat(el.value); if (!isFinite(v)) return; }
  else v = el.value;
  setBind(b, v);
  pbody.querySelectorAll(`[data-bind="${b}"]`).forEach(o => { if (o !== el && o.type !== 'checkbox') o.value = typeof v === 'number' ? +v.toFixed(4) : v; });
  if (el.type === 'text') { afterChange(el.dataset.re === 'scene,chips' ? 'chips' : '', b); clearTimeout(pbody._nt); pbody._nt = setTimeout(() => buildScene(), 500); return; }
  afterChange(el.dataset.re, b);
});
pbody.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.arrow) { renderPanel(); return; }
  if (/phys|\bL\b/.test(el.dataset.re || '') && S.tab === 'medium') renderPanel();
});
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-set],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; renderPanel(); return; }
  if (t.dataset.set) { let v = t.dataset.val; setBind(t.dataset.set, v); afterChange(t.dataset.re, t.dataset.set); return; }
  const a = t.dataset.act, r = selRope(), j = +t.dataset.j;
  switch (a) {
    case 'play': setPaused(!S.paused); break;
    case 'togglePanel': setPanel($('#app').classList.contains('nopanel')); break;
    case 'stepBack1': stepBack1Frame(); break;
    case 'step': if (!S.paused) setPaused(true); advance(1 / 60 * Math.max(0.25, S.timeScale)); chartSample(); if (S.display.measure) buildMeasure(); break;
    case 'stepFwd': stepQuarter(1); break;
    case 'stepBack': stepQuarter(-1); break;
    case 'resetWave': resetWaves(); clearGroup(ghosts); buildMeasure(); allSourceRefs().forEach(e => { if (e.src.mode === 'custom' && e.src.custom.arrows.length) e.s.armed = e.s.armed; }); toast('波形已清除，時間歸零'); break;
    case 'fireAll': fireAll(); break;
    case 'speed': setSpeed(+t.dataset.v); break;
    case 'toggleMeasure': S.display.measure = !S.display.measure; buildMeasure(); $('#bMeasure').classList.toggle('on', S.display.measure); if (S.tab === 'display') renderPanel(); break;
    case 'toggleVelArrows': S.display.velArrows = !S.display.velArrows; $('#bVelArr').classList.toggle('on', S.display.velArrows); if (S.tab === 'display') renderPanel(); break;
    case 'ghost': captureGhost(); break;
    case 'ghostClear': clearGroup(ghosts); break;
    case 'view': fitView(t.dataset.v); break;
    case 'lockView': setViewLock(!viewLocked); break;
    case 'preset': loadPreset(t.dataset.id); break;
    case 'sel': S.sel = +t.dataset.i; renderPanel(); break;
    case 'addRope': {
      const i = S.ropes.length; S.ropes.push(newRope({ name: '繩' + (i + 1), color: ROPE_COLORS[i % ROPE_COLORS.length] }));
      S.sel = i; buildScene(); fitView(); renderPanel(); break;
    }
    case 'dupRope': {
      const c = deep(r); delete c.id; c.name = r.name + ' 複本'; c.color = ROPE_COLORS[S.ropes.length % ROPE_COLORS.length];
      S.ropes.splice(S.sel + 1, 0, newRope(c)); S.sel = S.sel + 1; buildScene(); fitView(); renderPanel(); toast('已複製整組「' + r.name + '」（介質、端點、所有波源與自訂振動）'); break;
    }
    case 'moveRope': {
      const i = S.sel, k = i + (+t.dataset.d); if (k < 0 || k >= S.ropes.length) break;
      [S.ropes[i], S.ropes[k]] = [S.ropes[k], S.ropes[i]]; S.sel = k;
      if (S.ropes[0].sync) S.ropes[0].sync = false;
      buildScene(); fitView(); renderPanel(); break;
    }
    case 'delRope': if (S.ropes.length > 1) { S.ropes.splice(S.sel, 1); S.sel = Math.max(0, S.sel - 1); S.probe.rope = clamp(S.probe.rope, 0, S.ropes.length - 1); buildScene(); fitView(); renderPanel(); } break;
    case 'addSrc': r.sources.push(newSource({ pos: r.sources.length === 1 ? 1 : 0.5 })); buildScene(); renderPanel(); break;
    case 'delSrc': r.sources.splice(j, 1); buildScene(); renderPanel(); break;
    case 'fire': { const e = eff(r, j); if (startSource(e.src, e.s) && S.paused) setPaused(false); break; }
    case 'stop': { const e = eff(r, j); stopSource(e.src, e.s); e.s.armed = false; break; }
    case 'fireRope': fireRope(r); break;
    case 'returnEq': { const e = eff(r, j); returnToEq(e.src, e.s); e.s.armed = false; if (S.paused) setPaused(false); break; }
    case 'harm': {
      const src = r.sources[0]; src.mode = 'periodic'; src.freq = +(+t.dataset.f).toFixed(4); if (src.amp > 0.12) src.amp = 0.05;
      if (r.damping < 0.2) r.damping = 0.35;
      const s = srt(src); resetWaves(); startSource(src, s); if (S.paused) setPaused(false); renderPanel(); toast('波源改為 ' + fmt(src.freq, 2) + ' Hz'); break;
    }
    case 'draw': enterDraw(r, j); break;
    case 'drawUndo': if (DR.on) { DR.r.sources[DR.j].custom.arrows.pop(); $('#drawN').textContent = DR.r.sources[DR.j].custom.arrows.length + 1; renderPanel(); } break;
    case 'drawClear': if (DR.on) { DR.r.sources[DR.j].custom.arrows.length = 0; $('#drawN').textContent = 1; renderPanel(); } break;
    case 'drawDone': exitDraw(); break;
    case 'addArrow': { const ar = r.sources[j].custom.arrows; ar.push({ d: ar.length % 2 ? -0.3 : 0.3 }); renderPanel(); break; }
    case 'delArrow': r.sources[j].custom.arrows.splice(+t.dataset.k, 1); renderPanel(); break;
    case 'clearArrows': r.sources[j].custom.arrows.length = 0; srt(r.sources[j]).armed = false; renderPanel(); break;
    case 'clearCurve': r.sources[j].custom.curve = []; drawFreehandAll(); break;
    case 'arm': { const s = srt(r.sources[j]); if (!buildSeq(r.sources[j])) { toast('請先畫出振動'); break; } s.armed = true; setPaused(true); toast('已備妥，按 ▶ 恢復模擬時開始'); break; }
    case 'copyExp': {
      const ta = $('#expTxt'), txt = exportJSON(); ta.value = txt;
      try { navigator.clipboard.writeText(txt).then(() => toast('已複製到剪貼簿'), () => { ta.select(); toast('請按 Ctrl+C 複製已選取的文字'); }); }
      catch (e) { ta.select(); toast('請按 Ctrl+C 複製已選取的文字'); }
      break;
    }
    case 'import': importJSON($('#impTxt').value); break;
    case 'save': {
      const name = ($('#saveName').value || '').trim() || S.scenario.title || '未命名';
      const list = loadSaves(); list.unshift({ name, at: new Date().toLocaleString('zh-TW', { hour12: false }), data: exportJSON() });
      storeSaves(list.slice(0, 30)); renderPanel(); toast('已儲存「' + name + '」'); break;
    }
    case 'loadSave': { const s = loadSaves()[+t.dataset.i]; if (s) importJSON(s.data); break; }
    case 'delSave': { const l = loadSaves(); l.splice(+t.dataset.i, 1); storeSaves(l); renderPanel(); break; }
  }
});

/* ---------- 手繪曲線 ---------- */
function drawFreehand(cv) {
  const j = +cv.dataset.j, src = selRope().sources[j]; if (!src) return;
  const c = cv.getContext('2d'), W = cv.width, H = cv.height;
  c.clearRect(0, 0, W, H);
  c.strokeStyle = 'rgba(238,240,230,.12)'; c.lineWidth = 1;
  for (let i = 1; i < 8; i++) { c.beginPath(); c.moveTo(i * W / 8, 0); c.lineTo(i * W / 8, H); c.stroke(); }
  for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(0, i * H / 4); c.lineTo(W, i * H / 4); c.stroke(); }
  c.strokeStyle = 'rgba(238,240,230,.4)'; c.beginPath(); c.moveTo(0, H / 2); c.lineTo(W, H / 2); c.stroke();
  c.fillStyle = 'rgba(238,240,230,.7)'; c.font = '22px "JetBrains Mono", monospace';
  c.fillText('+' + fmt(src.amp, 2) + ' m', 8, 26); c.fillText('−' + fmt(src.amp, 2) + ' m', 8, H - 10);
  c.fillText(fmt(src.custom.curveDur, 1) + ' s', W - 70, H / 2 - 8);
  const cu = src.custom.curve; if (!cu.length) { c.fillStyle = 'rgba(238,240,230,.5)'; c.font = '26px "Noto Sans TC", sans-serif'; c.fillText('在這裡由左往右畫', W / 2 - 110, H / 2 + 44); return; }
  c.strokeStyle = '#f2c14e'; c.lineWidth = 4; c.beginPath();
  cu.forEach((v, i) => { const x = i / (cu.length - 1) * W, y = H / 2 - v * (H / 2 - 8); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke();
}
function drawFreehandAll() { document.querySelectorAll('canvas.freehand').forEach(drawFreehand); }
function initFreehand() {
  document.querySelectorAll('canvas.freehand').forEach(cv => {
    drawFreehand(cv);
    let down = false, lastI = -1;
    const pt = ev => { const rc = cv.getBoundingClientRect(); return { u: clamp((ev.clientX - rc.left) / rc.width, 0, 1), v: clamp(1 - 2 * (ev.clientY - rc.top) / rc.height, -1, 1) }; };
    const put = ev => {
      const src = selRope().sources[+cv.dataset.j], n = 120, p = pt(ev);
      if (src.custom.curve.length !== n) src.custom.curve = new Array(n).fill(0);
      const i = Math.round(p.u * (n - 1));
      if (lastI < 0) src.custom.curve[i] = p.v;
      else { const a = Math.min(lastI, i), b = Math.max(lastI, i), va = src.custom.curve[lastI]; for (let k = a; k <= b; k++) src.custom.curve[k] = b === a ? p.v : va + (p.v - va) * (k - lastI) / (i - lastI); }
      lastI = i; drawFreehand(cv);
    };
    cv.addEventListener('pointerdown', ev => { down = true; lastI = -1; cv.setPointerCapture(ev.pointerId); put(ev); });
    cv.addEventListener('pointermove', ev => { if (down) put(ev); });
    cv.addEventListener('pointerup', () => { down = false; });
  });
}

/* ---------- 匯入匯出 ---------- */
function exportJSON() {
  return JSON.stringify({
    app: 'rope-wave-lab', version: 1, title: S.scenario.title, notes: S.scenario.notes,
    timeScale: S.timeScale, display: S.display, probe: S.probe, formula: S.formula.mode,
    ropes: S.ropes.map(r => { const c = deep(r); delete c.id; return c; })
  }, null, 2);
}
function importJSON(txt) {
  let o;
  try { o = JSON.parse(txt); } catch (e) { toast('無法解析：請確認貼上的是完整的 JSON 文字'); return; }
  if (!o || !Array.isArray(o.ropes) || !o.ropes.length) { toast('格式不符：找不到 ropes 介質清單'); return; }
  const num = (v, a, b, d) => (typeof v === 'number' && isFinite(v)) ? clamp(v, a, b) : d;
  const ropes = o.ropes.slice(0, 6).map(r => Object.assign({}, r, {
    L: num(r.L, 1, 12, 6), F: num(r.F, 0.2, 50, 4), mu: num(r.mu, 0.02, 2, 0.25), damping: num(r.damping, 0, 2, 0.05),
    sources: (Array.isArray(r.sources) && r.sources.length ? r.sources : [{}]).slice(0, 3)
  }));
  applyState({ ropes, title: o.title || '匯入的設定', notes: Array.isArray(o.notes) ? o.notes : [], speed: num(o.timeScale, SPEED_MIN, SPEED_MAX, 1),
    display: o.display, probe: o.probe, formula: ['strip', 'bus'].includes(o.formula) ? o.formula : 'none', start: null });
  toast('已匯入「' + (o.title || '設定') + '」');
}
function onFile(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => { $('#impTxt').value = rd.result; importJSON(rd.result); }; rd.readAsText(f);
}
function loadSaves() { try { return JSON.parse(localStorage.getItem('rwl.saves') || '[]'); } catch (e) { return []; } }
function storeSaves(l) { try { localStorage.setItem('rwl.saves', JSON.stringify(l)); } catch (e) { toast('此瀏覽器無法儲存，請改用匯出'); } }

/* ---------- 提示 ---------- */
let toastT;
function toastQuiet(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1200); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- 鍵盤 ---------- */
document.addEventListener('keydown', ev => {
  if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  if (ev.code === 'Space') { ev.preventDefault(); setPaused(!S.paused); }
  else if (ev.key === 'ArrowRight' && ev.shiftKey) { ev.preventDefault(); stepQuarter(1); }
  else if (ev.key === 'ArrowLeft' && ev.shiftKey) { ev.preventDefault(); stepQuarter(-1); }
  else if (ev.key === 'ArrowRight') { if (!S.paused) setPaused(true); advance(1 / 60 * Math.max(0.25, S.timeScale)); chartSample(); if (S.display.measure) buildMeasure(); }
  else if (ev.key === 'ArrowLeft') { stepBack1Frame(); }
  else if (ev.key === 'p' || ev.key === 'P') fireAll();
  else if (ev.key === 'v' || ev.key === 'V') { S.display.velArrows = !S.display.velArrows; $('#bVelArr').classList.toggle('on', S.display.velArrows); if (S.tab === 'display') renderPanel(); }
  else if (ev.key === 'm' || ev.key === 'M') { S.display.measure = !S.display.measure; buildMeasure(); $('#bMeasure').classList.toggle('on', S.display.measure); if (S.tab === 'display') renderPanel(); }
  else if (ev.key === 'g' || ev.key === 'G') captureGhost();
  else if (ev.key === 't' || ev.key === 'T') setPanel($('#app').classList.contains('nopanel'));
  else if (ev.key === 'l' || ev.key === 'L') setViewLock(!viewLocked);
  else if (ev.key === 'Escape' && DR.on) exitDraw();
});

/* ---------- 啟動 ---------- */
resize();
try { if (localStorage.getItem('rwl.panel') === '0') setPanel(false); } catch (e) {}
setPaused(false);
loadPreset('strip');
S.tab = 'scene'; renderPanel();
if (window.innerWidth < 900) { $('#scn').classList.add('collapsed'); $('#scnToggle').textContent = '展開'; }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { labelCache.clear(); buildScene(); });
requestAnimationFrame(loop);
</script>
