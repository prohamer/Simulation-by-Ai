<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 針對行動裝置優化，禁止原生網頁縮放，確保觸控手勢給 3D 畫布使用 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 分子建構器</title>
    <!-- 引入 Tailwind CSS 快速建立 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Three.js 核心與軌道控制器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; touch-action: none; font-family: sans-serif; }
        /* 【更新】將背景色移到容器上，讓 WebGL 畫布本身維持透明，以利匯出透明 PNG */
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background-color: #1a1a2e; }
        
        /* UI 覆蓋層 */
        #ui-layer { position: absolute; z-index: 10; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* 隱藏捲軸但允許滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .tool-btn { transition: all 0.2s; }
        .tool-btn.active { background-color: #3b82f6; color: white; border-color: #2563eb; transform: scale(1.05); }
        .element-btn { transition: all 0.2s; border-width: 2px; }
        .element-btn.active { border-color: #3b82f6; transform: scale(1.1); box-shadow: 0 0 10px rgba(59,130,246,0.5); }
    </style>
</head>
<body>

    <!-- 3D 畫布容器 -->
    <div id="canvas-container"></div>

    <!-- UI 層 -->
    <div id="ui-layer">
        <!-- 頂部列：標題與存檔 -->
        <div class="p-4 flex justify-between items-center bg-gray-900 bg-opacity-80 pointer-events-auto text-white backdrop-blur-sm shadow-md">
            <h1 class="text-lg font-bold">🧪 3D 分子建構器</h1>
            <div class="flex gap-2">
                <!-- 【新增】匯出 PNG 按鈕 -->
                <button onclick="exportPNG()" class="bg-purple-600 hover:bg-purple-500 px-3 py-1.5 rounded text-sm font-semibold shadow transition-colors">📸 PNG</button>
                <button onclick="exportMC()" class="bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded text-sm font-semibold shadow transition-colors">⬇️ .mc</button>
                <button onclick="document.getElementById('import-file').click()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-sm font-semibold shadow transition-colors">⬆️ 匯入</button>
                <input type="file" id="import-file" accept=".mc" class="hidden" onchange="importMC(event)">
            </div>
        </div>

        <!-- 底部列：工具與元素 -->
        <div class="bg-gray-900 bg-opacity-90 pointer-events-auto rounded-t-2xl pb-6 pt-4 px-2 backdrop-blur-md shadow-lg border-t border-gray-700">
            
            <!-- 視圖樣式切換 (四種模式) -->
            <div class="flex justify-center gap-2 mb-4 px-2">
                <button onclick="setStyle('ball_and_stick')" id="style-ball" class="bg-gray-700 text-white px-3 py-1 rounded-full text-xs active bg-blue-600 transition-colors">球棍模型</button>
                <button onclick="setStyle('atom_mode')" id="style-atom" class="bg-gray-700 text-white px-3 py-1 rounded-full text-xs transition-colors">原子模式</button>
                <button onclick="setStyle('spacefill')" id="style-space" class="bg-gray-700 text-white px-3 py-1 rounded-full text-xs transition-colors">空間填充</button>
                <!-- 【新增】元素符號模式按鈕 -->
                <button onclick="setStyle('symbol_mode')" id="style-symbol" class="bg-gray-700 text-white px-3 py-1 rounded-full text-xs transition-colors">符號模式</button>
            </div>

            <!-- 工具列 (可橫向滑動) -->
            <div class="flex gap-3 overflow-x-auto no-scrollbar px-2 mb-4 snap-x">
                <button onclick="setTool('camera')" id="tool-camera" class="tool-btn active flex-none bg-gray-800 text-gray-200 border border-gray-600 px-4 py-2 rounded-xl flex flex-col items-center snap-center">
                    <span class="text-xl">✋</span><span class="text-xs mt-1">旋轉/縮放</span>
                </button>
                <button onclick="setTool('add')" id="tool-add" class="tool-btn flex-none bg-gray-800 text-gray-200 border border-gray-600 px-4 py-2 rounded-xl flex flex-col items-center snap-center">
                    <span class="text-xl">➕</span><span class="text-xs mt-1">加原子</span>
                </button>
                <button onclick="setTool('bond')" id="tool-bond" class="tool-btn flex-none bg-gray-800 text-gray-200 border border-gray-600 px-4 py-2 rounded-xl flex flex-col items-center snap-center">
                    <span class="text-xl">🔗</span><span class="text-xs mt-1">連線/換鍵</span>
                </button>
                <button onclick="setTool('delete-bond')" id="tool-delete-bond" class="tool-btn flex-none bg-gray-800 text-gray-200 border border-gray-600 px-4 py-2 rounded-xl flex flex-col items-center snap-center">
                    <span class="text-xl">✂️</span><span class="text-xs mt-1">刪除連線</span>
                </button>
                <button onclick="setTool('delete')" id="tool-delete" class="tool-btn flex-none bg-gray-800 text-gray-200 border border-gray-600 px-4 py-2 rounded-xl flex flex-col items-center snap-center">
                    <span class="text-xl">🗑️</span><span class="text-xs mt-1">刪除物件</span>
                </button>
                <button onclick="centerCamera()" id="tool-center" class="tool-btn flex-none bg-gray-800 text-gray-200 border border-gray-600 px-4 py-2 rounded-xl flex flex-col items-center snap-center active:bg-blue-600 transition-colors">
                    <span class="text-xl">🎯</span><span class="text-xs mt-1">置中視角</span>
                </button>
                <button onclick="startOptimization()" id="tool-optimize" class="tool-btn flex-none bg-indigo-700 text-gray-200 border border-indigo-500 px-4 py-2 rounded-xl flex flex-col items-center snap-center active:bg-indigo-500 transition-colors shadow-lg shadow-indigo-500/30">
                    <span class="text-xl">✨</span><span class="text-xs mt-1">最佳化</span>
                </button>
            </div>

            <!-- 元素列 (只有在新增模式時顯示) -->
            <div id="element-bar" class="flex gap-3 overflow-x-auto no-scrollbar px-2 pb-2 hidden">
                <!-- Javascript 動態產生元素按鈕 -->
            </div>
        </div>
    </div>

    <script>
        // --- 1. 化學資料定義 ---
        const ELEMENTS = {
            'C':  { color: 0x555555, covalent: 0.77, vdw: 1.70, maxBonds: 4 }, // 碳
            'H':  { color: 0xffffff, covalent: 0.37, vdw: 1.20, maxBonds: 1 }, // 氫
            'O':  { color: 0xff0000, covalent: 0.73, vdw: 1.52, maxBonds: 2 }, // 氧
            'N':  { color: 0x0000ff, covalent: 0.75, vdw: 1.55, maxBonds: 3 }, // 氮
            'Cl': { color: 0x00ff00, covalent: 0.99, vdw: 1.75, maxBonds: 1 }, // 氯
            'S':  { color: 0xffff00, covalent: 1.02, vdw: 1.80, maxBonds: 6 }, // 硫
            'P':  { color: 0xffa500, covalent: 1.06, vdw: 1.80, maxBonds: 5 }, // 磷
        };

        // --- 2. 系統狀態 ---
        let scene, camera, renderer, controls;
        let atoms = []; // { id, element, mesh, sprite, x, y, z }
        let bonds = []; // { id, atom1_id, atom2_id, order, group }
        
        let currentTool = 'camera'; 
        let currentElement = 'C';
        let currentStyle = 'ball_and_stick'; // 'ball_and_stick', 'atom_mode', 'spacefill', 'symbol_mode'
        let bondSelection = null; 
        let deleteBondSelection = null; 
        let dragStartAtomId = null; 

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownPos = new THREE.Vector2();

        let optimizationFrames = 0;

        function getAtomValency(atomId) {
            let valency = 0;
            bonds.forEach(b => {
                if (b.atom1_id === atomId || b.atom2_id === atomId) valency += b.order;
            });
            return valency;
        }

        function showToast(message) {
            let toast = document.createElement('div');
            toast.className = 'absolute top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg text-sm z-50 pointer-events-none transition-opacity duration-300 border border-gray-600';
            toast.innerText = message;
            document.getElementById('ui-layer').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function toggleBond(atom1Id, atom2Id) {
            let existingBond = bonds.find(b => 
                (b.atom1_id === atom1Id && b.atom2_id === atom2Id) || 
                (b.atom2_id === atom1Id && b.atom1_id === atom2Id)
            );

            if (!existingBond) {
                let a1Data = atoms.find(a => a.id === atom1Id);
                let a2Data = atoms.find(a => a.id === atom2Id);
                if (getAtomValency(atom1Id) >= ELEMENTS[a1Data.element].maxBonds) {
                    showToast(`${a1Data.element} 元素已達鍵結上限！`); return;
                }
                if (getAtomValency(atom2Id) >= ELEMENTS[a2Data.element].maxBonds) {
                    showToast(`${a2Data.element} 元素已達鍵結上限！`); return;
                }
                createBond(atom1Id, atom2Id);
            } else {
                let nextOrder = (existingBond.order % 3) + 1; 
                if (nextOrder > existingBond.order) {
                    let additionalValency = nextOrder - existingBond.order;
                    let a1 = atoms.find(a => a.id === existingBond.atom1_id);
                    let a2 = atoms.find(a => a.id === existingBond.atom2_id);
                    
                    if (getAtomValency(a1.id) + additionalValency > ELEMENTS[a1.element].maxBonds || 
                        getAtomValency(a2.id) + additionalValency > ELEMENTS[a2.element].maxBonds) {
                        nextOrder = 1; 
                        showToast("原子價數不足，自動退回單鍵！");
                    }
                }
                existingBond.order = nextOrder;
                updateBondMesh(existingBond);
            }
        }

        function decreaseBondOrder(bondId) {
            let bondData = bonds.find(b => b.id === bondId);
            if (bondData) {
                if (bondData.order > 1) {
                    bondData.order -= 1; 
                    updateBondMesh(bondData);
                } else {
                    deleteBond(bondId); 
                }
            }
        }

        function removeBondBetween(atom1Id, atom2Id) {
            let existingBond = bonds.find(b => 
                (b.atom1_id === atom1Id && b.atom2_id === atom2Id) || 
                (b.atom2_id === atom1Id && b.atom1_id === atom2Id)
            );
            if (existingBond) decreaseBondOrder(existingBond.id);
        }

        function startOptimization() {
            if (atoms.length === 0) return;
            optimizationFrames = 200;
            atoms.forEach(a => { a.velocity = new THREE.Vector3(0, 0, 0); });
            showToast("✨ 結構最佳化中...");
        }

        function stepOptimization() {
            if (optimizationFrames <= 0) return;
            optimizationFrames--;

            const k_bond = 2.0;       
            const damping = 0.8;      
            const max_step = 0.2;     

            let forces = {};
            atoms.forEach(a => forces[a.id] = new THREE.Vector3(0, 0, 0));

            bonds.forEach(b => {
                let a1 = atoms.find(a => a.id === b.atom1_id);
                let a2 = atoms.find(a => a.id === b.atom2_id);
                if (!a1 || !a2) return;
                
                let idealL = ELEMENTS[a1.element].covalent + ELEMENTS[a2.element].covalent;
                let diff = new THREE.Vector3().subVectors(a1.mesh.position, a2.mesh.position);
                let dist = diff.length();
                
                if (dist > 0.001) {
                    let forceMag = (idealL - dist) * k_bond; 
                    let f = diff.normalize().multiplyScalar(forceMag);
                    forces[a1.id].add(f);
                    forces[a2.id].sub(f);
                }
            });

            for (let i = 0; i < atoms.length; i++) {
                for (let j = i + 1; j < atoms.length; j++) {
                    let a1 = atoms[i];
                    let a2 = atoms[j];
                    let isBonded = bonds.some(b => (b.atom1_id === a1.id && b.atom2_id === a2.id) || (b.atom2_id === a1.id && b.atom1_id === a2.id));
                    
                    if (isBonded) continue; 

                    let diff = new THREE.Vector3().subVectors(a1.mesh.position, a2.mesh.position);
                    let dist = diff.length();
                    
                    if (dist > 0.001) {
                        let idealDist = ELEMENTS[a1.element].vdw + ELEMENTS[a2.element].vdw;
                        let forceMag = 0.5 / (dist * dist); 
                        if (dist < idealDist) forceMag += (idealDist - dist) * 0.1; 
                        if (forceMag > 1.0) forceMag = 1.0; 
                        
                        let f = diff.normalize().multiplyScalar(forceMag);
                        forces[a1.id].add(f);
                        forces[a2.id].sub(f);
                    }
                }
            }

            let avgVelocity = new THREE.Vector3();
            atoms.forEach(a => {
                let f = forces[a.id];
                a.velocity.add(f).multiplyScalar(damping);
                if (a.velocity.length() > max_step) a.velocity.setLength(max_step);
                avgVelocity.add(a.velocity);
            });
            avgVelocity.divideScalar(atoms.length);

            atoms.forEach(a => {
                a.velocity.sub(avgVelocity); 
                a.mesh.position.add(a.velocity);
            });

            bonds.forEach(b => updateBondMesh(b));
        }

        function getIdealBondDirection(centerAtomId, clickNormal) {
            let centerAtom = atoms.find(a => a.id === centerAtomId);
            let centerPos = centerAtom.mesh.position;
            let neighbors = [];
            bonds.forEach(b => {
                if (b.atom1_id === centerAtomId) neighbors.push(atoms.find(a => a.id === b.atom2_id));
                if (b.atom2_id === centerAtomId) neighbors.push(atoms.find(a => a.id === b.atom1_id));
            });

            let N = neighbors.length;
            if (N === 0) return clickNormal.clone().normalize();

            if (N === 1) {
                let v1 = new THREE.Vector3().subVectors(neighbors[0].mesh.position, centerPos).normalize();
                let proj = new THREE.Vector3().copy(clickNormal).sub(v1.clone().multiplyScalar(clickNormal.dot(v1)));
                if (proj.lengthSq() < 0.001) { 
                    let up = Math.abs(v1.y) > 0.9 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
                    proj.crossVectors(v1, up);
                }
                proj.normalize();
                let cosTetra = -1.0 / 3.0; 
                let sinTetra = Math.sqrt(8.0 / 9.0); 
                return v1.clone().multiplyScalar(cosTetra).add(proj.multiplyScalar(sinTetra)).normalize();
            }

            if (N === 2) {
                let v1 = new THREE.Vector3().subVectors(neighbors[0].mesh.position, centerPos).normalize();
                let v2 = new THREE.Vector3().subVectors(neighbors[1].mesh.position, centerPos).normalize();
                let v_sum = new THREE.Vector3().addVectors(v1, v2);
                let cross = new THREE.Vector3().crossVectors(v1, v2);

                if (cross.lengthSq() < 0.001) { 
                    return new THREE.Vector3().copy(clickNormal).sub(v1.clone().multiplyScalar(clickNormal.dot(v1))).normalize();
                }

                cross.normalize();
                let sign = clickNormal.dot(cross) > 0 ? 1 : -1;
                let dir = new THREE.Vector3();
                dir.addScaledVector(v_sum, -0.5); 
                dir.addScaledVector(cross, sign * Math.sqrt(2.0/3.0)); 
                return dir.normalize();
            }

            let v_sum = new THREE.Vector3();
            neighbors.forEach(n => {
                let v = new THREE.Vector3().subVectors(n.mesh.position, centerPos).normalize();
                v_sum.add(v);
            });
            if (v_sum.lengthSq() < 0.01) return clickNormal.clone().normalize(); 
            return v_sum.multiplyScalar(-1).normalize();
        }

        // --- 3. 初始化 Three.js ---
        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            // 【更新】移除場景預設背景色，使其完全透明，才能匯出透明 PNG
            // scene.background = new THREE.Color(0x1a1a2e); 

            const ambientLight = new THREE.AmbientLight(0x404040, 1.5); 
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);
            const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
            backLight.position.set(-5, -10, -7);
            scene.add(backLight);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 15);

            // 【更新】開啟 alpha 透明通道與 preserveDrawingBuffer (用於擷取畫面匯出 PNG)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 確保清除時是透明的
            renderer.setClearColor(0x000000, 0); 
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);

            buildUI();
            animate();
        }

        function onPointerDown(event) {
            pointerDownPos.set(event.clientX, event.clientY);
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            let interactables = atoms.map(a => a.mesh);
            let intersects = raycaster.intersectObjects(interactables, true);
            dragStartAtomId = intersects.length > 0 ? intersects[0].object.userData.id : null;
        }

        function onPointerUp(event) {
            let isDrag = pointerDownPos.distanceTo(new THREE.Vector2(event.clientX, event.clientY)) > 10;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            let interactables = [];
            atoms.forEach(a => interactables.push(a.mesh));
            bonds.forEach(b => interactables.push(b.group));

            const intersects = raycaster.intersectObjects(interactables, true);

            if (currentTool === 'camera') return; 

            if (isDrag) {
                if (intersects.length > 0 && intersects[0].object.userData.type === 'atom') {
                    let dragEndAtomId = intersects[0].object.userData.id;
                    if (dragStartAtomId && dragStartAtomId !== dragEndAtomId) {
                        if (currentTool === 'bond') {
                            toggleBond(dragStartAtomId, dragEndAtomId);
                        } else if (currentTool === 'delete-bond') {
                            removeBondBetween(dragStartAtomId, dragEndAtomId);
                        }
                    }
                }
                if (bondSelection) { highlightAtom(bondSelection, false); bondSelection = null; }
                if (deleteBondSelection) { highlightAtom(deleteBondSelection, false); deleteBondSelection = null; }
                dragStartAtomId = null;
                return; 
            }

            if (currentTool === 'add') {
                if (intersects.length > 0) {
                    let hitObject = intersects[0].object;
                    if (hitObject.userData.type === 'atom') {
                        let parentAtomId = hitObject.userData.id;
                        let parentAtomData = atoms.find(a => a.id === parentAtomId);
                        
                        let currentValency = getAtomValency(parentAtomId);
                        let maxValency = ELEMENTS[parentAtomData.element].maxBonds;
                        
                        if (currentValency >= maxValency) {
                            showToast(`${parentAtomData.element} 元素已達到最大鍵結數 (${maxValency})！`);
                            return; 
                        }

                        let normal = intersects[0].face.normal.clone();
                        normal.transformDirection(hitObject.matrixWorld).normalize(); 
                        
                        let idealDir = getIdealBondDirection(parentAtomId, normal);
                        let bondLength = ELEMENTS[parentAtomData.element].covalent + ELEMENTS[currentElement].covalent; 
                        let pos = hitObject.position.clone().add(idealDir.multiplyScalar(bondLength));
                        
                        let newAtom = createAtom(currentElement, pos);
                        createBond(parentAtomId, newAtom.id);
                    }
                } else {
                    let target = new THREE.Vector3();
                    raycaster.ray.at(15, target); 
                    createAtom(currentElement, target);
                }
            } 
            else if (currentTool === 'bond') {
                if (intersects.length > 0) {
                    let hitObject = intersects[0].object;
                    if (hitObject.userData.type === 'atom') {
                        let clickedAtomId = hitObject.userData.id;
                        if (!bondSelection) {
                            let aData = atoms.find(a => a.id === clickedAtomId);
                            if (getAtomValency(clickedAtomId) >= ELEMENTS[aData.element].maxBonds) {
                                showToast(`${aData.element} 元素無法再建立更多連線！`);
                                return;
                            }
                            bondSelection = clickedAtomId;
                            highlightAtom(bondSelection, true, 0x555555);
                        } else {
                            if (bondSelection !== clickedAtomId) toggleBond(bondSelection, clickedAtomId);
                            highlightAtom(bondSelection, false);
                            bondSelection = null;
                        }
                    } else if (hitObject.userData.type === 'bond') {
                        let bondData = bonds.find(b => b.id === hitObject.userData.id);
                        if (bondData) toggleBond(bondData.atom1_id, bondData.atom2_id);
                    }
                } else {
                    if (bondSelection) { highlightAtom(bondSelection, false); bondSelection = null; }
                }
            }
            else if (currentTool === 'delete-bond') {
                if (intersects.length > 0) {
                    let hitObject = intersects[0].object;
                    if (hitObject.userData.type === 'atom') {
                        let clickedAtomId = hitObject.userData.id;
                        if (!deleteBondSelection) {
                            deleteBondSelection = clickedAtomId;
                            highlightAtom(deleteBondSelection, true, 0xaa0000); 
                        } else {
                            if (deleteBondSelection !== clickedAtomId) removeBondBetween(deleteBondSelection, clickedAtomId);
                            highlightAtom(deleteBondSelection, false);
                            deleteBondSelection = null;
                        }
                    } else if (hitObject.userData.type === 'bond') {
                        decreaseBondOrder(hitObject.userData.id);
                    }
                } else {
                    if (deleteBondSelection) { highlightAtom(deleteBondSelection, false); deleteBondSelection = null; }
                }
            }
            else if (currentTool === 'delete') {
                if (intersects.length > 0) {
                    let hitObject = intersects[0].object;
                    if (hitObject.userData.type === 'atom') {
                        deleteAtom(hitObject.userData.id);
                    } else if (hitObject.userData.type === 'bond') {
                        deleteBond(hitObject.userData.id);
                    }
                }
            }
        }

        // --- 5. 核心化學繪圖邏輯 ---
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function getAtomRadius(element, style) {
            let elData = ELEMENTS[element];
            if (style === 'spacefill') return elData.vdw;         
            if (style === 'atom_mode') return elData.covalent * 1.25; 
            return elData.covalent * 0.4;                         
        }

        // 【新增】產生元素符號 2D 文字 Sprite 的函數
        function createTextSprite(element) {
            let elData = ELEMENTS[element];
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.font = 'bold 72px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 繪製深色粗外框，確保在任何背景或重疊化學鍵上都清晰可見
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 12;
            ctx.lineJoin = 'round';
            ctx.strokeText(element, 64, 64);
            
            // 繪製元素專屬色彩的文字
            let colorHex = '#' + elData.color.toString(16).padStart(6, '0');
            ctx.fillStyle = colorHex;
            ctx.fillText(element, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true }); 
            const sprite = new THREE.Sprite(spriteMaterial);
            
            sprite.scale.set(1.5, 1.5, 1);
            return sprite;
        }

        function createAtom(element, position, id = null) {
            let elData = ELEMENTS[element];
            let radius = getAtomRadius(element, currentStyle);
            
            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            const material = new THREE.MeshPhongMaterial({ 
                color: elData.color,
                shininess: 60
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            
            // 【新增】為每個原子附加專屬的文字 Sprite
            const sprite = createTextSprite(element);
            sprite.visible = (currentStyle === 'symbol_mode'); // 只有符號模式才顯示文字
            mesh.material.visible = (currentStyle !== 'symbol_mode'); // 符號模式隱藏圓球
            mesh.add(sprite); // 將 Sprite 綁定在圓球上跟隨移動
            
            let atomId = id || generateId();
            mesh.userData = { type: 'atom', id: atomId, element: element };
            scene.add(mesh);

            let atomObj = { id: atomId, element: element, mesh: mesh, sprite: sprite, x: position.x, y: position.y, z: position.z };
            atoms.push(atomObj);
            return atomObj;
        }

        function createBond(atom1_id, atom2_id, order = 1, id = null) {
            let bondId = id || generateId();
            let bondObj = { id: bondId, atom1_id: atom1_id, atom2_id: atom2_id, order: order, group: new THREE.Group() };
            scene.add(bondObj.group);
            bonds.push(bondObj);
            updateBondMesh(bondObj);
            return bondObj;
        }

        function updateBondMesh(bondObj) {
            while(bondObj.group.children.length > 0){ 
                let child = bondObj.group.children[0];
                bondObj.group.remove(child); 
                child.geometry.dispose();
                child.material.dispose();
            }

            // 【更新】符號模式也要顯示化學鍵，讓字母之間有連線
            if (currentStyle !== 'ball_and_stick' && currentStyle !== 'symbol_mode') return; 

            let a1 = atoms.find(a => a.id === bondObj.atom1_id).mesh.position;
            let a2 = atoms.find(a => a.id === bondObj.atom2_id).mesh.position;
            
            let distance = a1.distanceTo(a2);
            let direction = new THREE.Vector3().subVectors(a2, a1).normalize();

            let up = new THREE.Vector3(0, 1, 0);
            if (Math.abs(direction.y) > 0.9) up.set(1, 0, 0); 
            let perpendicular = new THREE.Vector3().crossVectors(direction, up).normalize();

            // 【修改】依據模式設定不同的鍵結粗細與間距
            let bondRadius = (currentStyle === 'symbol_mode') ? 0.04 : 0.12;
            let offsetDist = (currentStyle === 'symbol_mode') ? 0.15 : 0.3; 
            
            let offsets = [];
            if (bondObj.order === 1) offsets = [0];
            else if (bondObj.order === 2) offsets = [-offsetDist/2, offsetDist/2];
            else if (bondObj.order === 3) offsets = [-offsetDist, 0, offsetDist];

            offsets.forEach(offset => {
                const geometry = new THREE.CylinderGeometry(bondRadius, bondRadius, distance, 16);
                geometry.translate(0, distance / 2, 0);
                geometry.rotateX(Math.PI / 2);

                const material = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
                const mesh = new THREE.Mesh(geometry, material);
                
                let pos = a1.clone().add(perpendicular.clone().multiplyScalar(offset));
                mesh.position.copy(pos);
                mesh.lookAt(pos.clone().add(direction));

                mesh.userData = { type: 'bond', id: bondObj.id };
                bondObj.group.add(mesh);
            });
        }

        function deleteAtom(id) {
            let index = atoms.findIndex(a => a.id === id);
            if (index > -1) {
                scene.remove(atoms[index].mesh);
                atoms[index].mesh.geometry.dispose();
                atoms[index].mesh.material.dispose();
                atoms.splice(index, 1);
            }
            let bondsToDelete = bonds.filter(b => b.atom1_id === id || b.atom2_id === id);
            bondsToDelete.forEach(b => deleteBond(b.id));
        }

        function deleteBond(id) {
            let index = bonds.findIndex(b => b.id === id);
            if (index > -1) {
                scene.remove(bonds[index].group);
                bonds.splice(index, 1);
            }
        }

        function highlightAtom(id, isHighlighted, colorHex = 0x555555) {
            let atom = atoms.find(a => a.id === id);
            if (atom) {
                if (isHighlighted) {
                    atom.mesh.material.emissive.setHex(colorHex);
                    // 【新增】連同文字 Sprite 也一起做選取提示效果
                    atom.sprite.material.color.setHex(0xaaaaaa); 
                    atom.sprite.scale.set(1.8, 1.8, 1);
                } else {
                    atom.mesh.material.emissive.setHex(0x000000);
                    atom.sprite.material.color.setHex(0xffffff); 
                    atom.sprite.scale.set(1.5, 1.5, 1);
                }
            }
        }

        // --- 6. UI 與樣式控制 ---
        function setTool(tool) {
            currentTool = tool;
            
            ['camera', 'add', 'bond', 'delete-bond', 'delete'].forEach(t => {
                let btn = document.getElementById(`tool-${t}`);
                if (btn) btn.classList.remove('active', 'bg-blue-600', 'bg-red-600', 'border-blue-500', 'border-red-500');
            });
            
            let activeBtn = document.getElementById(`tool-${tool}`);
            if (tool === 'delete' || tool === 'delete-bond') {
                activeBtn.classList.add('active', 'bg-red-600', 'border-red-500'); 
            } else {
                activeBtn.classList.add('active', 'bg-blue-600', 'border-blue-500');
            }

            let elementBar = document.getElementById('element-bar');
            if (tool === 'add') {
                elementBar.classList.remove('hidden');
                controls.enabled = false; 
            } else {
                elementBar.classList.add('hidden');
                if (bondSelection) { highlightAtom(bondSelection, false); bondSelection = null; }
                if (deleteBondSelection) { highlightAtom(deleteBondSelection, false); deleteBondSelection = null; }
                controls.enabled = (tool === 'camera'); 
            }
        }

        // 【更新】加入第四種切換模式：符號模式
        function setStyle(style) {
            currentStyle = style;
            
            document.getElementById('style-ball').classList.toggle('bg-blue-600', style === 'ball_and_stick');
            document.getElementById('style-atom').classList.toggle('bg-blue-600', style === 'atom_mode');
            document.getElementById('style-space').classList.toggle('bg-blue-600', style === 'spacefill');
            document.getElementById('style-symbol').classList.toggle('bg-blue-600', style === 'symbol_mode');
            
            atoms.forEach(a => {
                // 如果是符號模式，隱藏圓球、顯示文字
                if (style === 'symbol_mode') {
                    a.mesh.material.visible = false;
                    a.sprite.visible = true;
                } else {
                    a.mesh.material.visible = true;
                    a.sprite.visible = false;
                    let radius = getAtomRadius(a.element, style);
                    a.mesh.geometry.dispose();
                    a.mesh.geometry = new THREE.SphereGeometry(radius, 32, 32);
                }
            });

            bonds.forEach(b => updateBondMesh(b));
        }

        function centerCamera() {
            if (atoms.length === 0) {
                controls.target.set(0, 0, 0);
                camera.position.set(0, 0, 15);
                controls.update();
                return;
            }

            let box = new THREE.Box3();
            atoms.forEach(a => {
                let r = getAtomRadius(a.element, currentStyle);
                let minNode = new THREE.Vector3(a.mesh.position.x - r, a.mesh.position.y - r, a.mesh.position.z - r);
                let maxNode = new THREE.Vector3(a.mesh.position.x + r, a.mesh.position.y + r, a.mesh.position.z + r);
                box.expandByPoint(minNode);
                box.expandByPoint(maxNode);
            });

            let center = new THREE.Vector3();
            box.getCenter(center);
            let size = new THREE.Vector3();
            box.getSize(size);
            
            let maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim < 2) maxDim = 2; 

            let fov = camera.fov * (Math.PI / 180);
            let cameraDistance = (maxDim / 2) / Math.tan(fov / 2) * 1.5; 
            
            let dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
            if (dir.lengthSq() < 0.01) dir.set(0, 0, 1);
            
            controls.target.copy(center);
            camera.position.copy(center).add(dir.multiplyScalar(cameraDistance));
            camera.lookAt(center);
            controls.update();
        }

        function selectElement(el) {
            currentElement = el;
            document.querySelectorAll('.element-btn').forEach(btn => btn.classList.remove('active', 'border-blue-500'));
            document.getElementById(`el-${el}`).classList.add('active', 'border-blue-500');
        }

        function buildUI() {
            const bar = document.getElementById('element-bar');
            for (const [symbol, data] of Object.entries(ELEMENTS)) {
                let colorHex = '#' + data.color.toString(16).padStart(6, '0');
                if (symbol === 'H') colorHex = '#e2e8f0'; 
                
                let btn = document.createElement('button');
                btn.id = `el-${symbol}`;
                btn.className = `element-btn flex-none w-12 h-12 rounded-full font-bold text-gray-800 border-gray-400 bg-white snap-center ${symbol === currentElement ? 'active border-blue-500' : ''}`;
                btn.style.boxShadow = `inset 0 0 10px ${colorHex}55`;
                btn.innerHTML = `<div style="color:${symbol==='H'?'#333':colorHex}">${symbol}</div>`;
                btn.onclick = () => selectElement(symbol);
                bar.appendChild(btn);
            }
        }

        // --- 7. 匯出功能 ---
        // 【新增】匯出透明背景的 PNG
        function exportPNG() {
            renderer.render(scene, camera); // 確保擷取到最新一幀
            const dataURL = renderer.domElement.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'molecule.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("📸 成功匯出透明背景 PNG！");
        }

        function exportMC() {
            let saveData = {
                version: "1.0",
                atoms: atoms.map(a => ({ id: a.id, element: a.element, x: a.mesh.position.x, y: a.mesh.position.y, z: a.mesh.position.z })),
                bonds: bonds.map(b => ({ id: b.id, atom1_id: b.atom1_id, atom2_id: b.atom2_id, order: b.order }))
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(saveData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "molecule.mc");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importMC(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    atoms.slice().forEach(a => deleteAtom(a.id));
                    atoms = [];
                    bonds = [];

                    if (data.atoms) {
                        data.atoms.forEach(a => createAtom(a.element, new THREE.Vector3(a.x, a.y, a.z), a.id));
                    }
                    if (data.bonds) {
                        data.bonds.forEach(b => createBond(b.atom1_id, b.atom2_id, b.order, b.id));
                    }
                    showToast("載入成功！");
                } catch (err) {
                    showToast("檔案格式錯誤或不相容！");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        // --- 8. 系統循環 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(controls.enabled) controls.update(); 
            if (optimizationFrames > 0) stepOptimization();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
