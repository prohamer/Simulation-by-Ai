
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans, sans-serif); }
#app { display: flex; flex-direction: column; gap: 0; min-height: 580px; padding: 12px; }
#top-row { display: flex; gap: 12px; }
#sim-panel { flex: 1; min-width: 0; }
#ctrl-panel { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
#sim-canvas { width: 100%; height: 240px; border: 0.5px solid var(--color-border-tertiary); border-radius: 8px; background: var(--color-background-secondary); position: relative; overflow: hidden; cursor: ew-resize; user-select: none; touch-action: none; }
#chart-row { display: flex; gap: 12px; margin-top: 10px; }
#force-diagram { flex: 1; height: 160px; border: 0.5px solid var(--color-border-tertiary); border-radius: 8px; background: var(--color-background-secondary); overflow: hidden; }
#scatter-chart { flex: 1.4; height: 160px; border: 0.5px solid var(--color-border-tertiary); border-radius: 8px; background: var(--color-background-secondary); overflow: hidden; }
.section-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; letter-spacing: 0.04em; }
.ctrl-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
.ctrl-row button { width: 22px; height: 22px; font-size: 14px; border: 0.5px solid var(--color-border-secondary); border-radius: 4px; background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; flex-shrink: 0; }
.ctrl-row button:hover { background: var(--color-background-secondary); }
.ctrl-row input[type=range] { flex: 1; min-width: 0; }
.ctrl-row span.val { min-width: 38px; text-align: right; font-size: 12px; font-weight: 500; color: var(--color-text-primary); }
select { width: 100%; font-size: 12px; border: 0.5px solid var(--color-border-secondary); border-radius: 6px; background: var(--color-background-primary); color: var(--color-text-primary); padding: 4px 6px; }
.check-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); cursor: pointer; }
.chip-row { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-size: 11px; padding: 2px 8px; border: 0.5px solid var(--color-border-secondary); border-radius: 12px; cursor: pointer; background: var(--color-background-primary); color: var(--color-text-secondary); }
.chip.active { background: var(--color-background-info); color: var(--color-text-info); border-color: transparent; }
.info-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.info-chip { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--color-background-secondary); color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); }
.info-chip b { color: var(--color-text-primary); }
.scatter-legend { font-size: 10px; color: var(--color-text-tertiary); }
#reset-btn { font-size: 11px; padding: 3px 10px; border: 0.5px solid var(--color-border-secondary); border-radius: 6px; background: transparent; color: var(--color-text-secondary); cursor: pointer; }
#reset-btn:hover { background: var(--color-background-secondary); }
#status-badge { font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 500; }
.badge-static { background: var(--color-background-warning); color: var(--color-text-warning); }
.badge-moving { background: var(--color-background-success); color: var(--color-text-success); }
.badge-still { background: var(--color-background-secondary); color: var(--color-text-secondary); }
</style>

<div id="app">
  <div id="top-row">
    <div id="sim-panel">
      <div class="section-label">左右拖曳物體施加拉力　　<span id="status-badge" class="badge-still">靜止</span></div>
      <div id="sim-canvas">
        <canvas id="main-canvas"></canvas>
      </div>
      <div class="info-row" id="info-row">
        <div class="info-chip">拉力 F = <b id="f-val">0.0</b> N</div>
        <div class="info-chip">摩擦力 f = <b id="fr-val">0.0</b> N</div>
        <div class="info-chip">正向力 N = <b id="n-val">0.0</b> N</div>
        <div class="info-chip">加速度 a = <b id="a-val">0.0</b> m/s²</div>
      </div>
    </div>
    <div id="ctrl-panel">
      <div class="section-label">物體選擇</div>
      <div class="chip-row" id="obj-chips">
        <span class="chip active" data-obj="brick">磚塊</span>
        <span class="chip" data-obj="box">木箱</span>
        <span class="chip" data-obj="book">書本</span>
        <span class="chip" data-obj="stone">石頭</span>
      </div>
      <div class="section-label" style="margin-top:6px">翻轉面</div>
      <div class="chip-row" id="face-chips">
        <span class="chip active" data-face="large">寬面</span>
        <span class="chip" data-face="small">窄面</span>
      </div>

      <select id="surface-sel">
        <option value="wood">木板地板</option>
        <option value="concrete">混凝土</option>

    </div>
  </div>
</div>

<script>
const OBJECTS = {
  brick: { label:'磚塊', mass:2.5, w:80, h:40, wSmall:40, hSmall:60, color:'#C1634A', colorD:'#9B4A35' },
  box:   { label:'木箱', mass:3.0, w:70, h:55, wSmall:55, hSmall:70, color:'#C8A35A', colorD:'#A07B38' },
  book:  { label:'書本', mass:0.8, w:90, h:28, wSmall:28, hSmall:70, color:'#4A7AC1', colorD:'#2D5A9A' },
  stone: { label:'石頭', mass:4.0, w:75, h:50, wSmall:50, hSmall:65, color:'#888', colorD:'#555' },
};
const SURFACES = {
  wood:     { label:'木板', mus:0.40, muk:0.30, color:'#C4A35A', stripe:'#B8923F' },
  concrete: { label:'混凝土', mus:0.55, muk:0.42, color:'#9E9E9E', stripe:'#8A8A8A' },
  ice:      { label:'冰面', mus:0.10, muk:0.03, color:'#B8D8F0', stripe:'#A0C5E0' },
  carpet:   { label:'地毯', mus:0.65, muk:0.50, color:'#8A5B7A', stripe:'#7A4A6A' },
  rubber:   { label:'橡膠', mus:0.80, muk:0.65, color:'#3C3C3C', stripe:'#2A2A2A' },
};
const g = 9.8;
let curObj='brick', curFace='large', curSurf='wood';
// appliedForce is signed: positive = rightward, negative = leftward
let appliedForce=0, velocity=0, objX=0;
let isMoving=false, isDragging=false;
let dragStartX=0, dragInitF=0;
let constForce=false;
let dataPoints=[];
let lastTime=null, lastRecordTime=0;

const mainCanvas=document.getElementById('main-canvas');
const mCtx=mainCanvas.getContext('2d');
const forceCanvas=document.getElementById('force-canvas');
const fCtx=forceCanvas.getContext('2d');
const scatterCanvas=document.getElementById('scatter-canvas');
const sCtx=scatterCanvas.getContext('2d');

function getObj(){ return OBJECTS[curObj]; }
function getSurf(){ return SURFACES[curSurf]; }
function getW(){ const o=getObj(); return curFace==='large'?o.w:o.wSmall; }
function getH(){ const o=getObj(); return curFace==='large'?o.h:o.hSmall; }
function getMass(){ return getObj().mass; }
function getN(){ return getMass()*g; }
function getMaxStatic(){ return getSurf().mus*getN(); }
function getKinetic(){ return getSurf().muk*getN(); }

// friction has same sign as velocity (opposes motion), or opposes applied force when static
function getFriction(){
  const absF = Math.abs(appliedForce);
  if(!isMoving){
    // static: opposes applied force, magnitude capped at max static
    const mag = Math.min(absF, getMaxStatic());
    return appliedForce===0 ? 0 : -Math.sign(appliedForce)*mag;
  } else {
    // kinetic: opposes velocity
    return -Math.sign(velocity)*getKinetic();
  }
}

function resizeAll(){
  const sim=document.getElementById('sim-canvas');
  mainCanvas.width=sim.clientWidth; mainCanvas.height=sim.clientHeight;
  const fd=document.getElementById('force-diagram');
  forceCanvas.width=fd.clientWidth; forceCanvas.height=fd.clientHeight;
  const sc=document.getElementById('scatter-chart');
  scatterCanvas.width=sc.clientWidth; scatterCanvas.height=sc.clientHeight;
}

function getCSSVar(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888'; }

function drawArrow(ctx,x1,y1,x2,y2,color,label,labelPos){
  const dx=x2-x1, dy=y2-y1;
  if(Math.sqrt(dx*dx+dy*dy)<2) return;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a=Math.atan2(dy,dx);
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-10*Math.cos(a-0.4),y2-10*Math.sin(a-0.4));
  ctx.lineTo(x2-10*Math.cos(a+0.4),y2-10*Math.sin(a+0.4));
  ctx.closePath(); ctx.fill();
  if(label){
    ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    if(labelPos==='above') ctx.fillText(label,mx,my-8);
    else if(labelPos==='below') ctx.fillText(label,mx,my+14);
    else ctx.fillText(label,mx,my-8);
  }
  ctx.restore();
}

function drawSim(){
  const W=mainCanvas.width, H=mainCanvas.height;
  mCtx.clearRect(0,0,W,H);
  const surf=getSurf();
  const groundY=H-40;
  mCtx.fillStyle=surf.color;
  mCtx.fillRect(0,groundY,W,40);
  for(let x=0;x<W;x+=18){
    mCtx.fillStyle=surf.stripe;
    mCtx.fillRect(x,groundY,9,40);
  }
  mCtx.fillStyle='#fff'; mCtx.globalAlpha=0.7;
  mCtx.font='bold 11px sans-serif';
  mCtx.fillText(surf.label,8,groundY+24);
  mCtx.globalAlpha=1;

  const obj=getObj(), ow=getW(), oh=getH();
  const cx=W/2+objX, ox=cx-ow/2, oy=groundY-oh;

  mCtx.fillStyle='rgba(0,0,0,0.12)';
  mCtx.fillRect(ox+4,groundY-2,ow,6);

  const grad=mCtx.createLinearGradient(ox,oy,ox,oy+oh);
  grad.addColorStop(0,obj.color); grad.addColorStop(1,obj.colorD);
  mCtx.fillStyle=grad;
  mCtx.beginPath();
  if(mCtx.roundRect) mCtx.roundRect(ox,oy,ow,oh,4);
  else mCtx.rect(ox,oy,ow,oh);
  mCtx.fill();
  mCtx.strokeStyle='rgba(0,0,0,0.2)'; mCtx.lineWidth=1; mCtx.stroke();

  mCtx.fillStyle='#fff'; mCtx.font='bold 11px sans-serif';
  mCtx.textAlign='center';
  mCtx.fillText(obj.label,cx,oy+oh/2+4);
  mCtx.textAlign='left';

  const friction=getFriction();
  const midY=oy+oh/2;

  // Normal force (upward)
  const N=getN(), nLen=Math.min(60,N*2);
  drawArrow(mCtx,cx,oy,cx,oy-nLen,'#3B8BD4',`N=${N.toFixed(1)}N`,'above');

  // Applied force arrow — direction matches sign
  if(Math.abs(appliedForce)>0.01){
    const fLen=Math.min(80,Math.abs(appliedForce)*2.2);
    const dir=Math.sign(appliedForce);
    // attach to the leading edge of the object
    const edgeX=cx+dir*ow/2;
    drawArrow(mCtx,edgeX,midY,edgeX+dir*fLen,midY,'#E85D24',`F=${Math.abs(appliedForce).toFixed(1)}N`,'above');
  }

  // Friction arrow — attach to trailing edge
  if(Math.abs(friction)>0.01){
    const fLen=Math.min(80,Math.abs(friction)*2.2);
    const fDir=Math.sign(friction);
    const edgeX=cx-fDir*ow/2;
    const fc=isMoving?'#EF9F27':'#4A9A5C';
    const lbl=isMoving?`fk=${Math.abs(friction).toFixed(1)}N`:`fs=${Math.abs(friction).toFixed(1)}N`;
    drawArrow(mCtx,edgeX,midY,edgeX+fDir*fLen,midY,fc,lbl,'above');
  }

  // Weight (downward, semi-transparent)
  drawArrow(mCtx,cx,groundY,cx,groundY+20,'rgba(120,80,180,0.8)',`W=${N.toFixed(1)}N`,'below');
}

function drawForceDiagram(){
  const W=forceCanvas.width, H=forceCanvas.height;
  fCtx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2;
  const N=getN(), F=appliedForce, fr=getFriction();
  const maxMag=Math.max(getMaxStatic(),Math.abs(F),N,1);
  const scale=Math.min(W,H)*0.38/maxMag;

  fCtx.font='11px sans-serif';
  fCtx.fillStyle=getCSSVar('--color-text-tertiary')||'#aaa';
  fCtx.textAlign='left';
  fCtx.fillText('受力圖',6,14);

  fCtx.beginPath(); fCtx.arc(cx,cy,3,0,2*Math.PI);
  fCtx.fillStyle=getCSSVar('--color-text-secondary')||'#888';
  fCtx.fill();

  const drawFA=(dx,dy,color,lbl)=>{
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len<1) return;
    const ex=cx+dx, ey=cy+dy;
    fCtx.save();
    fCtx.strokeStyle=color; fCtx.fillStyle=color; fCtx.lineWidth=2;
    fCtx.beginPath(); fCtx.moveTo(cx,cy); fCtx.lineTo(ex,ey); fCtx.stroke();
    const a=Math.atan2(dy,dx);
    fCtx.beginPath();
    fCtx.moveTo(ex,ey);
    fCtx.lineTo(ex-8*Math.cos(a-0.45),ey-8*Math.sin(a-0.45));
    fCtx.lineTo(ex-8*Math.cos(a+0.45),ey-8*Math.sin(a+0.45));
    fCtx.closePath(); fCtx.fill();
    fCtx.font='bold 10px sans-serif'; fCtx.textAlign='center';
    fCtx.fillText(lbl,ex+Math.cos(a)*18,ey+Math.sin(a)*18);
    fCtx.restore();
  };

  const Fscaled=Math.min(Math.abs(F)*scale,W/2-22)*Math.sign(F)||0;
  drawFA(Fscaled,0,'#E85D24',`F=${Math.abs(F).toFixed(1)}`);
  const frScaled=Math.min(Math.abs(fr)*scale,W/2-22)*(fr<0?-1:fr>0?1:0);
  if(Math.abs(fr)>0.01) drawFA(frScaled,0,isMoving?'#EF9F27':'#4A9A5C',`f=${Math.abs(fr).toFixed(1)}`);
  const nScaled=Math.min(N*scale,H/2-22);
  drawFA(0,-nScaled,'#3B8BD4',`N=${N.toFixed(1)}`);
  drawFA(0,nScaled,'#8B5CF6',`W=${N.toFixed(1)}`);
}

// compute a nice round axis max >= value, with ~4-5 ticks
function niceMax(val){
  if(val<=0) return 10;
  const raw=val*1.25;
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,5,10].map(s=>s*mag).find(s=>raw<=s*5&&raw/s<=5);
  return Math.ceil(raw/(step||mag))*(step||mag);
}

function drawScatter(){
  const W=scatterCanvas.width, H=scatterCanvas.height;
  sCtx.clearRect(0,0,W,H);
  const pad={l:40,r:16,t:16,b:32};

  // Determine axis ranges
  const ms=getMaxStatic(), mk=getKinetic();
  const allF=dataPoints.map(p=>p.absF);
  const allFric=dataPoints.map(p=>p.absFric);
  const maxFData=allF.length?Math.max(...allF):0;
  const maxFrData=allFric.length?Math.max(...allFric):0;
  const maxFAxis=niceMax(Math.max(maxFData,Math.abs(appliedForce),ms+2,20));
  const maxFrAxis=niceMax(Math.max(maxFrData,Math.abs(getFriction()),ms+2,10));

  sCtx.font='10px sans-serif';
  sCtx.fillStyle=getCSSVar('--color-text-tertiary')||'#aaa';
  sCtx.textAlign='left';
  sCtx.fillText('外力 vs 摩擦力',6,11);

  const px=f=>pad.l+(f/maxFAxis)*(W-pad.l-pad.r);
  const py=f=>H-pad.b-(f/maxFrAxis)*(H-pad.t-pad.b);

  // Axes
  sCtx.strokeStyle=getCSSVar('--color-border-secondary')||'#ccc';
  sCtx.lineWidth=0.5;
  sCtx.beginPath();
  sCtx.moveTo(pad.l,pad.t); sCtx.lineTo(pad.l,H-pad.b);
  sCtx.moveTo(pad.l,H-pad.b); sCtx.lineTo(W-pad.r,H-pad.b);
  sCtx.stroke();

  // Ticks
  sCtx.fillStyle=getCSSVar('--color-text-tertiary')||'#aaa';
  sCtx.font='9px sans-serif';
  const xTicks=5, yTicks=4;
  for(let i=0;i<=xTicks;i++){
    const v=parseFloat(((maxFAxis/xTicks)*i).toFixed(1));
    sCtx.textAlign='center';
    sCtx.fillText(v,px(v),H-pad.b+11);
  }
  for(let i=0;i<=yTicks;i++){
    const v=parseFloat(((maxFrAxis/yTicks)*i).toFixed(1));
    sCtx.textAlign='right';
    sCtx.fillText(v,pad.l-4,py(v)+3);
  }
  sCtx.textAlign='center';
  sCtx.fillText('|外力| F (N)',pad.l+(W-pad.l-pad.r)/2,H-1);
  sCtx.save();
  sCtx.translate(10,pad.t+(H-pad.t-pad.b)/2);
  sCtx.rotate(-Math.PI/2);
  sCtx.fillText('摩擦力 f (N)',0,0);
  sCtx.restore();

  // Reference lines
  sCtx.setLineDash([3,3]); sCtx.lineWidth=0.8;
  sCtx.strokeStyle='#4A9A5C88';
  const msY=py(ms);
  if(msY>pad.t && msY<H-pad.b){
    sCtx.beginPath(); sCtx.moveTo(pad.l,msY); sCtx.lineTo(W-pad.r,msY); sCtx.stroke();
  }
  sCtx.strokeStyle='#EF9F2788';
  const mkY=py(mk);
  if(mkY>pad.t && mkY<H-pad.b){
    sCtx.beginPath(); sCtx.moveTo(pad.l,mkY); sCtx.lineTo(W-pad.r,mkY); sCtx.stroke();
  }
  sCtx.setLineDash([]);

  sCtx.font='9px sans-serif';
  if(msY>pad.t+10 && msY<H-pad.b){
    sCtx.fillStyle='#4A9A5C';
    sCtx.textAlign='right';
    sCtx.fillText(`最大靜摩擦 ${ms.toFixed(1)}N`,W-pad.r-2,msY-2);
  }
  if(mkY>pad.t+10 && mkY<H-pad.b){
    sCtx.fillStyle='#EF9F27';
    sCtx.textAlign='right';
    sCtx.fillText(`動摩擦 ${mk.toFixed(1)}N`,W-pad.r-2,mkY-2);
  }

  // Historical data points
  for(const pt of dataPoints){
    const x=px(pt.absF), y=py(pt.absFric);
    if(x<pad.l||x>W-pad.r||y<pad.t||y>H-pad.b) continue;
    sCtx.beginPath();
    sCtx.arc(x,y,3,0,2*Math.PI);
    sCtx.fillStyle=pt.moving?'rgba(239,159,39,0.75)':'rgba(74,154,92,0.75)';
    sCtx.fill();
  }

  // Current point highlight
  const cF=Math.abs(appliedForce), cf=Math.abs(getFriction());
  if(cF>0.1){
    const cx2=px(cF), cy2=py(cf);
    if(cx2>=pad.l&&cx2<=W-pad.r&&cy2>=pad.t&&cy2<=H-pad.b){
      sCtx.beginPath(); sCtx.arc(cx2,cy2,5,0,2*Math.PI);
      sCtx.fillStyle=isMoving?'#EF9F27':'#4A9A5C';
      sCtx.fill();
      sCtx.strokeStyle='#fff'; sCtx.lineWidth=1.5; sCtx.stroke();
    }
  }
}

function updateInfoRow(){
  const F=appliedForce, fr=getFriction(), m=getMass();
  document.getElementById('f-val').textContent=Math.abs(F).toFixed(1);
  document.getElementById('fr-val').textContent=Math.abs(fr).toFixed(1);
  document.getElementById('n-val').textContent=getN().toFixed(1);
  const a=isMoving?Math.max(0,(Math.abs(F)-Math.abs(fr))/m):0;
  document.getElementById('a-val').textContent=a.toFixed(2);
  document.getElementById('f-slider-val').textContent=Math.abs(F).toFixed(1)+' N';
  document.getElementById('f-slider').value=Math.abs(F);

  const badge=document.getElementById('status-badge');
  if(!isMoving&&Math.abs(F)<0.1){badge.className='badge-still';badge.textContent='靜止';}
  else if(!isMoving){badge.className='badge-static';badge.textContent='靜摩擦';}
  else{badge.className='badge-moving';badge.textContent='運動中';}
}

function render(){
  drawSim(); drawForceDiagram(); drawScatter(); updateInfoRow();
}

function recordPoint(){
  if(Math.abs(appliedForce)>0.2){
    dataPoints.push({absF:Math.abs(appliedForce),absFric:Math.abs(getFriction()),moving:isMoving});
    document.getElementById('pts-count').textContent=dataPoints.length+' 個資料點';
  }
}

function update(dt){
  if(dt<=0) return;
  const F=appliedForce;
  if(!isMoving){
    if(Math.abs(F)>getMaxStatic()){
      isMoving=true;
      velocity=0.01*Math.sign(F);
    }
  }
  if(isMoving){
    const fr=getFriction(); // already has correct sign
    const netF=F+fr; // fr opposes motion
    const a=netF/getMass();
    velocity+=a*dt;
    // stopped?
    if(Math.sign(velocity)!==Math.sign(velocity+a*dt*0.01)&&Math.abs(velocity)<0.3){
      velocity=0; isMoving=false;
    }
    objX+=velocity*dt*30;
    const hw=getW()/2;
    const maxX=mainCanvas.width/2-hw-10;
    const minX=-mainCanvas.width/2+hw+10;
    if(objX>maxX){objX=maxX; velocity=0; isMoving=false;}
    if(objX<minX){objX=minX; velocity=0; isMoving=false;}
  }
}

function loop(ts){
  if(!lastTime) lastTime=ts;
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  update(dt);
  if(ts-lastRecordTime>500){recordPoint();lastRecordTime=ts;}
  render();
  requestAnimationFrame(loop);
}

// Pointer events (unified for mouse + touch)
function pointerDown(clientX){
  isDragging=true;
  dragStartX=clientX;
  dragInitF=appliedForce;
}
function pointerMove(clientX){
  if(!isDragging) return;
  const dx=clientX-dragStartX;
  // dx positive = dragged right → positive force; dx negative = dragged left → negative force
  appliedForce=dragInitF+dx*0.6;
  appliedForce=Math.max(-60,Math.min(60,appliedForce));
}
function pointerUp(){
  isDragging=false;
  if(!constForce){ appliedForce=0; velocity=0; isMoving=false; }
}

const simDiv=document.getElementById('sim-canvas');
simDiv.addEventListener('mousedown',e=>pointerDown(e.clientX));
simDiv.addEventListener('mousemove',e=>pointerMove(e.clientX));
simDiv.addEventListener('mouseup',pointerUp);
simDiv.addEventListener('mouseleave',()=>{ if(isDragging) pointerUp(); });
simDiv.addEventListener('touchstart',e=>{e.preventDefault();pointerDown(e.touches[0].clientX);},{passive:false});
simDiv.addEventListener('touchmove',e=>{e.preventDefault();pointerMove(e.touches[0].clientX);},{passive:false});
simDiv.addEventListener('touchend',e=>{e.preventDefault();pointerUp();},{passive:false});

// Slider (magnitude only; keeps current direction)
document.getElementById('f-slider').addEventListener('input',e=>{
  const mag=parseFloat(e.target.value);
  appliedForce=mag*(appliedForce<0?-1:1);
});
document.getElementById('f-minus').addEventListener('click',()=>{
  const mag=Math.max(0,Math.abs(appliedForce)-0.5);
  appliedForce=mag*(appliedForce<0?-1:1);
});
document.getElementById('f-plus').addEventListener('click',()=>{
  const mag=Math.min(60,Math.abs(appliedForce)+0.5);
  appliedForce=mag*(appliedForce<=0?1:1); // default rightward if zero
});
document.getElementById('const-force').addEventListener('change',e=>{ constForce=e.target.checked; });

document.querySelectorAll('#obj-chips .chip').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('#obj-chips .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); curObj=c.dataset.obj;
    velocity=0; isMoving=false; objX=0; appliedForce=0;
  });
});
document.querySelectorAll('#face-chips .chip').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('#face-chips .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); curFace=c.dataset.face;
    velocity=0; isMoving=false; objX=0;
  });
});
document.getElementById('surface-sel').addEventListener('change',e=>{
  curSurf=e.target.value; velocity=0; isMoving=false;
});
document.getElementById('reset-btn').addEventListener('click',()=>{
  dataPoints=[]; document.getElementById('pts-count').textContent='0 個資料點';
});

resizeAll(); objX=0;
requestAnimationFrame(loop);
window.addEventListener('resize',resizeAll);
</script>
