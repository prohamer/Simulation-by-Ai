const CAT_FORMS = { Cu: ['Cu', 'CuOH'], Zn: ['Zn', 'ZnOH'], Ca: ['Ca'], Ba: ['Ba'] };

  { id: 'Na2SO4', name: '強酸強鹼鹽 (中性)', formula: 'Na₂SO₄', spawn: { Na: 2, SO4: 1 }, uiColor: 'bg-neutral-50 border-neutral-300 text-neutral-700' },
  { id: 'HCl', name: '強酸 (對照組)', formula: 'HCl', spawn: { H: 1, Cl: 1 }, uiColor: 'bg-red-100 border-red-400 text-red-900 font-bold' },
  { id: 'NaOH', name: '強鹼 (對照組)', formula: 'NaOH', spawn: { Na: 1, OH: 1 }, uiColor: 'bg-purple-100 border-purple-400 text-purple-900 font-bold' },
  { id: 'C2H5OH', name: '非電解質', formula: 'C₂H₅OH', spawn: { C2H5OH: 1 }, uiColor: 'bg-teal-50 border-teal-300 text-teal-800' },
  { id: 'C6H12O6', name: '非電解質', formula: 'C₆H₁₂O₆', spawn: { C6H12O6: 1 }, uiColor: 'bg-orange-50 border-orange-300 text-orange-800' },

// ---------------------------------------------------------------------
//  巨觀求解器
// ---------------------------------------------------------------------
function chargeAt(T, h) {
  const D = h * h + h * KA1_C + KA1_C * KA2_C;
  return h + T.Na + T.K + 2 * T.Ca + 2 * T.Ba
    + T.N * h / (h + KA_NH4)
    + T.Cu * (2 * h + KA_CU) / (h + KA_CU)
    + T.Zn * (2 * h + KA_ZN) / (h + KA_ZN)
    - KW / h - T.Cl - T.NO3 - 2 * T.SO4
    - T.Ac * KA_AC / (KA_AC + h)
    - T.C * (h * KA1_C + 2 * KA1_C * KA2_C) / D;
}

// 電荷總和對 h 單調遞增 → 二分法必收斂到唯一解
function solveH(T) {
  let lo = -16, hi = 1.5;
  for (let i = 0; i < 56; i++) {
    const m = (lo + hi) / 2;
    if (chargeAt(T, Math.pow(10, m)) > 0) hi = m; else lo = m;
  }
  return Math.pow(10, (lo + hi) / 2);
}

function speciate(T, h) {
  const D = h * h + h * KA1_C + KA1_C * KA2_C;
  return {
    H: h, OH: KW / h, Na: T.Na, K: T.K, Ca: T.Ca, Ba: T.Ba, Cl: T.Cl, NO3: T.NO3, SO4: T.SO4,
    CH3COO: T.Ac * KA_AC / (KA_AC + h), CH3COOH: T.Ac * h / (KA_AC + h),
    NH4: T.N * h / (h + KA_NH4), NH3: T.N * KA_NH4 / (h + KA_NH4),
    H2CO3: T.C * h * h / D, HCO3: T.C * h * KA1_C / D, CO3: T.C * KA1_C * KA2_C / D,
    Cu: T.Cu * h / (h + KA_CU), CuOH: T.Cu * KA_CU / (h + KA_CU),
    Zn: T.Zn * h / (h + KA_ZN), ZnOH: T.Zn * KA_ZN / (h + KA_ZN),
    C2H5OH: T.EtOH, C6H12O6: T.Glu,
  };
}

const KSP = {}; PRECIPITATES.forEach(p => { KSP[p.id] = p.ksp; });
const SOLID_CATS = ['Cu', 'Zn', 'Ca', 'Ba'];

// 固定 h、自由 CO₃²⁻ 濃度 c、自由 SO₄²⁻ 濃度 s 時，單一陽離子的狀態
// 自由陽離子濃度受「各沉澱的 Ksp 上限」中最小者限制；超出的部分成為該沉澱
function cationAt(M, TM, h, c, s) {
  const alpha = M === 'Cu' ? h / (h + KA_CU) : M === 'Zn' ? h / (h + KA_ZN) : 1;
  const OH = KW / h;
  const kOH = KSP[M + 'OH2'], kC = KSP[M + 'CO3'], kS = KSP[M + 'SO4'];
  const caps = {
    hyd: kOH ? kOH / (OH * OH) : Infinity,
    carb: kC && c > 0 ? kC / c : Infinity,
    sulf: kS && s > 0 ? kS / s : Infinity,
  };
  const capMin = Math.min(caps.hyd, caps.carb, caps.sulf);
  const free = Math.min(TM * alpha, capMin);
  const P = Math.max(0, TM - free / alpha);
  let cat = null;
  if (P > 0) cat = caps.carb === capMin ? 'carb' : caps.sulf === capMin ? 'sulf' : 'hyd';
  return { dissolved: TM - P, P, caps, capMin, cat };
}

// 固定 h：巢狀二分求自由 SO₄²⁻（Ca、Ba 共用）與自由 CO₃²⁻（Cu、Zn、Ca、Ba 共用）的質量平衡
function solidsAtH(base, h) {
  const D = h * h + h * KA1_C + KA1_C * KA2_C, beta = KA1_C * KA2_C / D;
  const TC = base.C, TS = base.SO4;
  const cats = SOLID_CATS.filter(M => base[M] > 0);
  // 熱迴圈：預先算好每個陽離子在此 h 下的常數，求和時不配置任何物件
  const n = cats.length, OH = KW / h;
  const TMa = new Float64Array(n), AL = new Float64Array(n), CH = new Float64Array(n), KC = new Float64Array(n), KS = new Float64Array(n);
  cats.forEach((M, i) => {
    TMa[i] = base[M];
    AL[i] = M === 'Cu' ? h / (h + KA_CU) : M === 'Zn' ? h / (h + KA_ZN) : 1;
    CH[i] = KSP[M + 'OH2'] ? KSP[M + 'OH2'] / (OH * OH) : Infinity;
    KC[i] = KSP[M + 'CO3'] || 0; KS[i] = KSP[M + 'SO4'] || 0;
  });
  let sumCarb = 0, sumSulf = 0;
  const sums = (c, s) => {
    sumCarb = 0; sumSulf = 0;
    for (let i = 0; i < n; i++) {
      const cc = KC[i] && c > 0 ? KC[i] / c : Infinity, cs = KS[i] && s > 0 ? KS[i] / s : Infinity, ch = CH[i];
      const capMin = cc < cs ? (cc < ch ? cc : ch) : (cs < ch ? cs : ch);
      const all = TMa[i] * AL[i];
      if (capMin >= all) continue;
      const P = TMa[i] - capMin / AL[i];
      if (cc === capMin) sumCarb += P; else if (cs === capMin) sumSulf += P;
    }
  };
  const evalAt = (c, s) => {
    const out = {};
    for (const M of cats) out[M] = cationAt(M, base[M], h, c, s);
    return { out };
  };
  const anyCarb = n > 0 && TC > 0;
  const solveC = (s) => {
    if (TC <= 0) return 0;
    if (!anyCarb || !KC.some(k => k > 0)) return TC * beta;
    let lo = -40, hi = Math.log10(TC * beta);
    for (let i = 0; i < 46 && hi - lo > 1e-11; i++) {
      const m = (lo + hi) / 2, cm = Math.pow(10, m);
      sums(cm, s);
      if (cm / beta + sumCarb - TC > 0) hi = m; else lo = m;
    }
    return Math.pow(10, hi);
  };
  let s = TS;
  if (TS > 0 && KS.some(k => k > 0)) {
    let lo = -40, hi = Math.log10(TS);
    for (let i = 0; i < 46 && hi - lo > 1e-11; i++) {
      const m = (lo + hi) / 2, sm = Math.pow(10, m);
      const cc = solveC(sm);
      sums(cc, sm);
      if (sm + sumSulf - TS > 0) hi = m; else lo = m;
    }
    s = Math.pow(10, hi);
  }
  const c = solveC(s);
  const ev = evalAt(c, s);
  // 分配沉澱：同一陽離子兩種沉澱共存（Ksp 上限相等）時，依質量平衡分配
  const carbTotal = TC > 0 ? Math.max(0, TC - c / beta) : 0, sulfTotal = Math.max(0, TS - s);
  const res = {}; const multi = []; let carbSingle = 0, sulfSingle = 0;
  for (const M of cats) {
    const r = ev.out[M]; const z = { hyd: 0, carb: 0, sulf: 0 };
    if (r.P > 0) {
      const tol = r.capMin * (1 + 1e-6);
      const b = ['hyd', 'carb', 'sulf'].filter(k => r.caps[k] <= tol);
      if (b.length === 1) { z[b[0]] = r.P; if (b[0] === 'carb') carbSingle += r.P; if (b[0] === 'sulf') sulfSingle += r.P; }
      else multi.push([M, b, r.P]);
    }
    res[M] = z;
  }
  const Rc = Math.max(0, carbTotal - carbSingle), Rs = Math.max(0, sulfTotal - sulfSingle);
  const Pm = multi.reduce((a, x) => a + x[2], 0);
  for (const [M, b, P] of multi) {
    const w = P / Pm;
    let carb = b.includes('carb') ? Math.min(P, Rc * w) : 0;
    let sulf = b.includes('sulf') ? Math.min(P - carb, Rs * w) : 0;
    let hyd = 0;
    const rem = P - carb - sulf;
    if (b.includes('hyd')) hyd = rem; else if (b.includes('carb')) carb += rem; else sulf += rem;
    res[M] = { hyd, carb, sulf };
  }
  const T = { ...base };
  for (const M of cats) T[M] = ev.out[M].dissolved;
  T.C = TC > 0 ? c / beta : 0;
  T.SO4 = s;
  const solids = {};
  PRECIPITATES.forEach(p => {
    const z = res[p.cat];
    solids[p.id] = !z ? 0 : p.an === 'OH' ? z.hyd : p.an === 'CO3' ? z.carb : z.sulf;
  });
  return { T, solids };
}

function solveWithSolids(totalsN, vol = VOLUME) {
  const base = {};
  TOTAL_KEYS.forEach(k => { base[k] = (totalsN[k] || 0) * UNIT / vol; });
  let h, sol;
  if (base.Cu + base.Zn + base.Ca + base.Ba === 0) {
    h = solveH(base);
    sol = { T: base, solids: {} };
    PRECIPITATES.forEach(p => { sol.solids[p.id] = 0; });
  } else {
    // 外層：電荷守恆對 h 仍單調（升高 h 只會溶解沉澱、釋出陽離子）
    let lo = -16, hi = 1.5;
    for (let i = 0; i < 56; i++) {
      const m = (lo + hi) / 2, hm = Math.pow(10, m);
      if (chargeAt(solidsAtH(base, hm).T, hm) > 0) hi = m; else lo = m;
    }
    h = Math.pow(10, (lo + hi) / 2);
    sol = solidsAtH(base, h);
  }
  const conc = speciate(sol.T, h);
  const species = {};
  Object.keys(conc).forEach(k => { species[k] = conc[k] * vol; });
  const solids = {};
  PRECIPITATES.forEach(p => { solids[p.id] = (sol.solids[p.id] || 0) * vol; });
  return { h, pH: -Math.log10(h), species, solids, T: sol.T };
}

// 含不可逆 CO₂ 逸出（以整數粒子為單位扣除碳酸總量）
function solveEquilibrium(totalsN, vol = VOLUME) {
  const totals = { ...totalsN };
  let lostN = 0, res = null;
  for (let guard = 0; guard < 60; guard++) {
    res = solveWithSolids(totals, vol);
    const exMol = (res.species.H2CO3 / vol - CO2_CAP) * vol;
    if (exMol >= UNIT * 0.5 && totals.C > 0) {
      const n = Math.max(1, Math.min(totals.C, Math.round(exMol / UNIT)));
      totals.C -= n; lostN += n;
      continue;
    }
    break;
  }
  res.totals = totals;
  res.lostN = lostN;
  let ionic = 0;
  for (const k in res.species) {
    const d = SPECIES_DEFS[k];
    if (d && d.charge) ionic += Math.abs(d.charge) * res.species[k];
  }
  res.ionicMol = ionic;
  res.volume = vol;
  res.condRatio = Math.min(1, Math.sqrt(ionic / 0.5)); // 非線性：弱電解質也看得出微亮
  return res;
}

// 把巨觀結果量化成「粒子目標數」，並以構造保證電中性
function buildTarget(eq, tot) {
  const avail = { ...tot };
  const solids = {};
  for (const p of PRECIPITATES) {
    let n = Math.round(eq.solids[p.id] / UNIT);
    n = Math.min(n, Math.floor(avail[p.cat] / p.catN), p.anKey ? Math.floor(avail[p.anKey] / p.anN) : Infinity);
    n = Math.max(0, n);
    solids[p.id] = n;
    avail[p.cat] -= n * p.catN;
    if (p.anKey) avail[p.anKey] -= n * p.anN;
  }
  const c = {
    Na: avail.Na, K: avail.K, Ca: avail.Ca, Ba: avail.Ba, Cl: avail.Cl, NO3: avail.NO3, SO4: avail.SO4,
    C2H5OH: avail.EtOH, C6H12O6: avail.Glu,
  };
  let hN = Math.round(eq.species.H / UNIT), oN = Math.round(eq.species.OH / UNIT);
  const S = c.Na + c.K + 2 * c.Ca + 2 * c.Ba - c.Cl - c.NO3 - 2 * c.SO4;
  const B = -avail.Ac - 2 * avail.C + avail.Cu + avail.Zn;
  const cap = { Ac: avail.Ac, N: avail.N, C: 2 * avail.C, Cu: avail.Cu, Zn: avail.Zn };
  const capTotal = cap.Ac + cap.N + cap.C + cap.Cu + cap.Zn;
  let Pf = -(S + B + hN - oN);
  if (Pf < 0) { const need = -Pf, dh = Math.min(hN, need); hN -= dh; oN += need - dh; Pf = 0; }
  if (Pf > capTotal) { const ex = Pf - capTotal, dO = Math.min(oN, ex); oN -= dO; hN += ex - dO; Pf = capTotal; }
  const h = eq.h, D = h * h + h * KA1_C + KA1_C * KA2_C;
  const r = {
    Ac: avail.Ac * h / (KA_AC + h),
    N: avail.N * h / (h + KA_NH4),
    C: avail.C * (h * KA1_C + 2 * h * h) / D,
    Cu: avail.Cu * h / (h + KA_CU),
    Zn: avail.Zn * h / (h + KA_ZN),
  };
  const a = {};
  let sum = 0;
  FAMILY_KEYS.forEach(k => { a[k] = Math.max(0, Math.min(cap[k], Math.round(r[k]))); sum += a[k]; });
  while (sum > Pf) {
    let best = null, bv = -Infinity;
    FAMILY_KEYS.forEach(k => { if (a[k] > 0 && a[k] - r[k] > bv) { bv = a[k] - r[k]; best = k; } });
    a[best]--; sum--;
  }
  while (sum < Pf) {
    let best = null, bv = -Infinity;
    FAMILY_KEYS.forEach(k => { if (a[k] < cap[k] && r[k] - a[k] > bv) { bv = r[k] - a[k]; best = k; } });
    a[best]++; sum++;
  }
  c.CH3COOH = a.Ac; c.CH3COO = avail.Ac - a.Ac;
  c.NH4 = a.N; c.NH3 = avail.N - a.N;
  c.Cu = a.Cu; c.CuOH = avail.Cu - a.Cu;
  c.Zn = a.Zn; c.ZnOH = avail.Zn - a.Zn;
  const n = avail.C, k = a.C;
  let nH2 = Math.round(n * h * h / D);
  nH2 = Math.max(Math.max(0, k - n), Math.min(Math.floor(k / 2), nH2));
  c.H2CO3 = nH2; c.HCO3 = k - 2 * nH2; c.CO3 = n - c.HCO3 - nH2;
  c.H = hN; c.OH = oN;
  return { counts: c, solids };
}

// ---------------------------------------------------------------------
//  微觀粒子模擬
// ---------------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const ION_JOB = { ion: true, pull: ION_PULL, grow: ION_PULL_GROW, timeout: ION_TIMEOUT };
// 示意對壽命：同種離子越多，越快被結合（勒沙特列），但不短於 1.2 秒，避免交接重疊堆積
const demoLife = (n) => Math.max(1.2, rand(1.4, 2.6) / (1 + Math.min(n, 12) / 4));

class MicroSim {
  constructor() { this.listeners = new Set(); this.reset(); }

  reset() {
    this.particles = []; this.fading = []; this.bubbles = []; this.flakes = [];
    this.jobs = []; this.demos = []; this.eJob = null;
    this.totals = {}; TOTAL_KEYS.forEach(k => { this.totals[k] = 0; });
    this.solidsN = {}; PRECIPITATES.forEach(p => { this.solidsN[p.id] = 0; });
    this.plated = { left: { Cu: 0, Zn: 0 }, right: { Cu: 0, Zn: 0 } };
    this.localExcess = { left: 0, right: 0 };
    this.eCharge = 0; this.co2LostN = 0; this.co2Bubbled = 0;
    this.gas = { H2: 0, O2: 0, Cl2: 0 };
    this.tokens = 5; this.time = 0; this.nextId = 1; this.stuck = 0; this.forcedFixes = 0;
    this.demoLast = {}; this.needyFam = new Set();
    this.volume = VOLUME;
    if (this.showWater === undefined) this.showWater = false; // 預設忽略水的自解離（只影響畫面，不影響計算）
    this.env = {
      width: 400, height: 400, waterTop: 80, leftSurface: 35, rightSurface: 365, solidBaseY: 400,
      powerOn: false, voltage: 12, leftPolarity: 1, leftElectrode: 'graphite', rightElectrode: 'graphite', paused: false,
    };
    this.recompute();
  }

  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit() { this.listeners.forEach(fn => fn()); }

  recompute() {
    const eq = solveEquilibrium(this.totals, this.volume);
    if (eq.lostN > 0) { this.totals = { ...eq.totals }; this.co2LostN += eq.lostN; }
    this.eq = eq;
    this.condRatio = eq.condRatio;
    this.target = buildTarget(eq, this.totals);
    this.emit();
  }

  setVolume(v) { this.volume = v; this.recompute(); }
  // 顯示／隱藏水的示意解離對；隱藏時，正在進行的水解離對立即開始再結合
  setShowWater(v) {
    this.showWater = v;
    if (!v) this.demos.forEach(d => { if (d.fam === 'W' && !d.rejoin) d.life = d.t; });
  }

  // ---------- 粒子工具 ----------
  waterBox() {
    const e = this.env, m = BASE_PARTICLE_RADIUS + 10;
    return { x0: e.leftSurface + m, x1: e.rightSurface - m, y0: e.waterTop + m, y1: Math.max(e.waterTop + m + 10, e.solidBaseY - m) };
  }
  randomPos() { const b = this.waterBox(); return { x: rand(b.x0, b.x1), y: rand(b.y0, b.y1) }; }

  spawn(type, x, y, opt = {}) {
    const p = {
      id: this.nextId++, type, x, y,
      vx: opt.vx !== undefined ? opt.vx : rand(-1, 1), vy: opt.vy !== undefined ? opt.vy : rand(-1, 1),
      age: opt.anim ? 0 : 1, src: opt.src || null, morph: 1, prevType: null,
      busy: null, future: undefined, demo: null, demoOrig: null, hold: opt.hold || 0, dead: false,
    };
    this.particles.push(p);
    return p;
  }
  kill(p, fadeAs) {
    if (p.dead) return;
    p.dead = true;
    if (fadeAs) this.fading.push({ x: p.x, y: p.y, vx: p.vx * 0.4, vy: p.vy * 0.4, type: fadeAs, life: 1 });
  }
  convert(p, newType) { p.prevType = p.type; p.type = newType; p.morph = 0; }
  selectable(p) { return !p.dead && !p.busy && !p.demo && p.hold <= 0; }

  nearest(types, x, y, n = 1, exclude = null) {
    const list = [];
    for (const p of this.particles) {
      if (!this.selectable(p) || !types.includes(p.type) || (exclude && exclude.has(p))) continue;
      list.push([p, (p.x - x) ** 2 + (p.y - y) ** 2]);
    }
    list.sort((a, b) => a[1] - b[1]);
    return list.slice(0, n).map(v => v[0]);
  }
  closestPair(typesA, typesB) {
    let best = null, bd = Infinity;
    const A = this.particles.filter(p => this.selectable(p) && typesA.includes(p.type));
    const Bs = this.particles.filter(p => this.selectable(p) && typesB.includes(p.type));
    for (const a of A) for (const b of Bs) {
      if (a === b) continue;
      const d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
      if (d < bd) { bd = d; best = [a, b]; }
    }
    return best;
  }

  // 依投射（含進行中的反應結果）統計各物種數；示意對以原形態計算
  counts() {
    const c = {};
    for (const p of this.particles) {
      if (p.dead || p.demo === 'partner') continue;
      let t = p.demo === 'parent' ? p.demoOrig : p.type;
      if (p.future !== undefined) t = p.future;
      if (t) c[t] = (c[t] || 0) + 1;
    }
    for (const j of this.jobs) for (const t of (j.spawns || [])) c[t] = (c[t] || 0) + 1;
    return c;
  }
  solidsProjected() {
    const s = { ...this.solidsN };
    for (const j of this.jobs) if (j.solid) s[j.solid] += j.solidDelta;
    return s;
  }
  heldCount() { return this.particles.reduce((n, p) => n + (!p.dead && p.hold > 0 && !p.demo ? 1 : 0), 0); }

  // ---------- 加藥 ----------
  addElectrolyte(el, mol) {
    const n = Math.round(mol / UNIT);
    for (const [sp, coef] of Object.entries(el.spawn)) {
      const k = coef * n;
      if (TOTAL_OF[sp]) this.totals[TOTAL_OF[sp]] += k;
      // 直接溶解的粒子不播水膠囊（水膠囊只用於「與水反應」產生的粒子，同 V6/V22）
      for (let i = 0; i < k; i++) { const q = this.randomPos(); this.spawn(sp, q.x, q.y); }
    }
    this.recompute();
  }

  // ---------- 反應工作（粒子互相靠近後才反應） ----------
  makeJob(kind, parts, opt = {}) {
    const job = { kind, parts, t: 0, timeout: opt.timeout || 1.2, near: opt.near || 26, spawns: opt.spawns || [],
      pull: opt.pull || 0.9, grow: opt.grow || 0, ion: !!opt.ion,
      solid: opt.solid || null, solidDelta: opt.solidDelta || 0, done: opt.done };
    parts.forEach((p, i) => { p.busy = job; if (opt.futures) p.future = opt.futures[i]; });
    this.jobs.push(job);
    return job;
  }
  // 電荷補償：需要「增加」q 單位電荷時，優先吃掉附近相反的水離子，否則由水產生
  planCompensation(q, x, y, exclude) {
    const parts = [], spawns = [];
    for (let i = 0; i < Math.abs(q); i++) {
      const t = q > 0 ? 'OH' : 'H';
      const cand = this.nearest([t], x, y, 1, exclude);
      if (cand.length) { parts.push(cand[0]); exclude.add(cand[0]); } else spawns.push(q > 0 ? 'H' : 'OH');
    }
    return { parts, spawns };
  }
  finishSpawns(job, x, y) {
    for (const t of job.spawns) {
      const a = Math.random() * Math.PI * 2;
      this.spawn(t, x + Math.cos(a) * 22, y + Math.sin(a) * 22, { anim: true, src: 'H2O', vx: Math.cos(a) * 1.5, vy: Math.sin(a) * 1.5 });
    }
  }

  updateJobs(dt) {
    const s = dt * 60;
    const keep = [];
    for (const job of this.jobs) {
      job.t += dt;
      const parts = job.parts.filter(p => !p.dead);
      if (!parts.length) { job.done(job, null); continue; }
      const a = parts[0];
      let allNear = true;
      for (let i = 1; i < parts.length; i++) {
        const p = parts[i];
        const dx = a.x - p.x, dy = a.y - p.y, d = Math.hypot(dx, dy) || 1;
        if (d > job.near) allNear = false;
        const pull = job.pull + job.grow * job.t;
        p.vx += dx / d * pull * s; p.vy += dy / d * pull * s;
        a.vx -= dx / d * pull * 0.28 * s; a.vy -= dy / d * pull * 0.28 * s;
      }
      if (allNear || job.t > job.timeout) {
        job.done(job, a);
        parts.forEach(p => { if (p.busy === job) { p.busy = null; p.future = undefined; } });
      } else keep.push(job);
    }
    this.jobs = keep;
  }

  // ---------- 調和：讓粒子組成追上巨觀目標（只用轉換，不憑空增減） ----------
  reconcile(dt) {
    const tg = this.target;
    this.tokens = Math.min(5, this.tokens + dt * 14);
    if (this.tokens < 1 || this.jobs.length >= 14) return;
    this.needyFam = new Set(); // 有待處理變化的家族：暫停產生新的示意對，讓粒子可被取用
    const c = this.counts(), T = tg.counts;
    const g = k => c[k] || 0, gt = k => T[k] || 0;
    const held = this.heldCount();
    const ionBusy = this.jobs.filter(j => j.ion).length >= ION_MAX_CONCURRENT; // 已達同時進行上限

    // A. 沉澱／溶解
    const sp = this.solidsProjected();
    let reservedC = 0; // 尚未能開始沉澱、但已預留給碳酸鹽沉澱的碳酸粒子
    for (const pd of PRECIPITATES) {
      const want = tg.solids[pd.id] || 0;
      if (want > sp[pd.id]) {
        if (this.startPrecip(pd)) { this.tokens--; return; }
        if (FAMILY_OF[pd.cat]) this.needyFam.add(pd.cat);
        if (pd.anKey === 'C') { reservedC += want - sp[pd.id]; this.needyFam.add('C'); }
      }
      else if (want < sp[pd.id]) { this.startDissolve(pd); this.tokens--; return; }
    }
    // B. CO₂ 逸出（不可逆）
    const cProj = g('CO3') + g('HCO3') + g('H2CO3'), cTgt = gt('CO3') + gt('HCO3') + gt('H2CO3');
    if (cProj > cTgt + reservedC && this.startCO2()) { this.tokens--; return; }

    // C. 中和：H⁺ 與 OH⁻ 同時存在 → 最高優先
    if (g('H') > 0 && g('OH') > 0) {
      if (ionBusy) { this.stuck = 0; return; }
      const pr = this.closestPair(['H'], ['OH']);
      if (pr) {
        this.makeJob('neutral', pr, { futures: [null, null], ...ION_JOB, done: (j, a) => {
          j.parts.forEach(p => this.kill(p)); if (a) this.fading.push({ x: a.x, y: a.y, vx: 0, vy: -0.3, type: 'H2O', life: 1 });
        } });
        this.tokens--; return;
      }
      this.stuck = 0; return; // 只剩剛生成、仍在擴散中的離子 → 等待
    }

    // D. 弱酸弱鹼家族的質子分配
    let up = null, down = null;
    const push = (dir, from, to, fam) => {
      if (g(from) <= 0) return;
      this.needyFam.add(fam);
      if (dir > 0 && !up) up = { from, to, fam };
      if (dir < 0 && !down) down = { from, to, fam };
    };
    for (const f of ['Ac', 'N', 'Cu', 'Zn']) {
      const [b, a] = FAMILIES[f].forms;
      if (g(a) < gt(a)) push(1, b, a, f);
      else if (g(a) > gt(a)) push(-1, a, b, f);
    }
    {
      const [c0, c1, c2] = FAMILIES.C.forms;
      const P = g(c1) + 2 * g(c2), Pt = gt(c1) + 2 * gt(c2);
      if (P < Pt) { if (g(c0) > gt(c0)) push(1, c0, c1, 'C'); else push(1, c1, c2, 'C'); }
      else if (P > Pt) { if (g(c2) > gt(c2)) push(-1, c2, c1, 'C'); else push(-1, c1, c0, 'C'); }
      else if (g(c1) < gt(c1)) { push(-1, c2, c1, 'C'); push(1, c0, c1, 'C'); }
      else if (g(c1) > gt(c1)) { push(-1, c1, c0, 'C'); push(1, c1, c2, 'C'); }
    }
    const exH = g('H') - gt('H'), exOH = g('OH') - gt('OH');

    if (up && exH > 0) {                       // 1. 強酸的 H⁺ 先被弱鹼接走
      if (ionBusy) return;
      const pr = this.closestPair([up.from], ['H']);
      if (pr) { this.jobProtonate(pr[0], pr[1], up.to); return; }
      if (held) return;
    }
    if (down && exOH > 0) {                    // 2. 強鹼的 OH⁻ 奪走弱酸的質子
      if (ionBusy) return;
      const pr = this.closestPair([down.from], ['OH']);
      if (pr) { this.jobDeprotonate(pr[0], pr[1], down.to); return; }
      if (held) return;
    }
    if (up && down) {                          // 3. 弱酸直接把質子交給弱鹼
      const pr = this.closestPair([down.from], [up.from]);
      if (pr) { this.jobTransfer(pr[0], down.to, pr[1], up.to); return; }
    }
    if (up && exOH < 0 && !held) {             // 4. 與水作用（水解）產生 OH⁻
      const p = this.nearest([up.from], 0, 0, 1)[0];
      if (p) { this.instantHydrolysis(p, up.to); return; }
    }
    if (down && exH < 0 && !held) {            // 5. 解離產生 H⁺
      const p = this.nearest([down.from], 0, 0, 1)[0];
      if (p) { this.instantDissociate(p, down.to); return; }
    }

    // E. 保險：若組成與目標仍不符且無任何進行中反應，4 秒後強制修正（測試中應為 0 次）
    const mismatch = exH !== 0 || exOH !== 0 || up || down;
    // 正在等待示意對結束（其粒子暫時不可取用）屬於正常等待，不計入卡住時間
    const waitingDemo = this.demos.some(d => d.fam === 'W' ? (exH !== 0 || exOH !== 0) : this.needyFam.has(d.fam));
    if (mismatch && !this.jobs.length && !held && !this.eJob && !waitingDemo) {
      this.stuck += dt;
      if (this.stuck > 4) { this.forceFix(); this.stuck = 0; }
    } else this.stuck = 0;
  }

  jobProtonate(base, h, to) {
    this.makeJob('protonate', [base, h], { futures: [to, null], ...ION_JOB, done: (j) => {
      if (!base.dead) this.convert(base, to); this.kill(h);
    } });
    this.tokens--;
  }
  jobDeprotonate(acid, oh, to) {
    this.makeJob('deprotonate', [acid, oh], { futures: [to, null], ...ION_JOB, done: () => {
      if (!acid.dead) this.convert(acid, to); this.kill(oh, 'H2O');
    } });
    this.tokens--;
  }
  jobTransfer(donor, dTo, acc, aTo) {
    this.makeJob('transfer', [donor, acc], { futures: [dTo, aTo], timeout: 1.4, done: () => {
      if (!donor.dead) this.convert(donor, dTo); if (!acc.dead) this.convert(acc, aTo);
    } });
    this.tokens--;
  }
  instantHydrolysis(p, to) {
    this.convert(p, to);
    const a = Math.random() * Math.PI * 2;
    this.spawn('OH', p.x + Math.cos(a) * 24, p.y + Math.sin(a) * 24, { anim: true, src: 'H2O', vx: Math.cos(a) * 1.5, vy: Math.sin(a) * 1.5 });
    this.tokens--;
  }
  instantDissociate(p, to) {
    this.convert(p, to);
    const a = Math.random() * Math.PI * 2;
    this.spawn('H', p.x + Math.cos(a) * 24, p.y + Math.sin(a) * 24, { vx: Math.cos(a) * 1.5, vy: Math.sin(a) * 1.5 });
    this.tokens--;
  }
  forceFix() {
    this.forcedFixes++;
    const c = this.counts(), T = this.target.counts;
    for (const t of ['H', 'OH']) {
      let d = (T[t] || 0) - (c[t] || 0);
      while (d > 0) { const q = this.randomPos(); this.spawn(t, q.x, q.y, { anim: true, src: 'H2O' }); d--; }
      while (d < 0) { const p = this.nearest([t], 0, 0, 1)[0]; if (!p) break; this.kill(p, 'H2O'); d++; }
    }
  }

  startPrecip(pd) {
    const pair = pd.anKey ? this.closestPair(CAT_FORMS[pd.cat], AN_FORMS[pd.an]) : null;
    let parts;
    if (pd.anKey) { if (!pair) return false; parts = pair; }
    else { const cat = this.nearest(CAT_FORMS[pd.cat], 0, 0, 1)[0]; if (!cat) return false; parts = [cat]; }
    const removedQ = parts.reduce((s, p) => s + SPECIES_DEFS[p.type].charge, 0);
    const comp = this.planCompensation(removedQ, parts[0].x, parts[0].y, new Set(parts));
    const all = parts.concat(comp.parts);
    this.makeJob('precip', all, { futures: all.map(() => null), spawns: comp.spawns, solid: pd.id, solidDelta: 1, timeout: 1.5,
      done: (j, a) => {
        const x = a ? a.x : all[0].x, y = a ? a.y : all[0].y;
        all.forEach(p => this.kill(p));
        this.solidsN[pd.id]++;
        for (let i = 0; i < 3; i++) this.flakes.push({ x: x + rand(-6, 6), y: y + rand(-6, 6), vy: rand(0.8, 1.6), phase: rand(0, 6.28), color: pd.color });
        this.finishSpawns(j, x, y);
      } });

  }
  startDissolve(pd) {
    const types = [CAT_MAIN[pd.cat]].concat(pd.anKey ? [pd.an] : []);
    const addQ = types.reduce((s, t) => s + SPECIES_DEFS[t].charge, 0);
    const b = this.waterBox();
    const x = rand(b.x0, b.x1), y = b.y1 - 4;

      spawns: types.slice(1).concat(comp.spawns), solid: pd.id, solidDelta: -1, timeout: 0.8,
      done: (j, a) => {

  }
  startCO2() {
    const p = this.nearest(['H2CO3'], 0, 0, 1)[0] || this.nearest(['HCO3'], 0, 0, 1)[0] || this.nearest(['CO3'], 0, 0, 1)[0];
    if (!p) return false;
    const q = SPECIES_DEFS[p.type].charge;
    const comp = this.planCompensation(q, p.x, p.y, new Set([p]));
    const all = [p].concat(comp.parts);
    this.makeJob('co2', all, { futures: all.map(() => null), spawns: comp.spawns, done: (j, a) => {
      const x = a ? a.x : p.x, y = a ? a.y : p.y;
      all.forEach(pp => this.kill(pp));
      this.co2Bubbled++;
      for (let i = 0; i < 2; i++) this.bubbles.push({ x: x + rand(-5, 5), y, vy: rand(-2.6, -1.8), radius: rand(4, 6), phase: rand(0, 6.28), color: 'rgba(255,255,255,0.65)' });

  }

  // ---------- 示意解離對：每種弱電解質（含水）常駐 1 對、輪替交接 ----------
  presentFamilies() {
    const T = this.target.counts;
    return FAMILY_KEYS.filter(f => FAMILIES[f].forms.some(t => (T[t] || 0) > 0));
  }
  freeCount(t) { let n = 0; for (const p of this.particles) if (!p.dead && !p.demo && p.type === t) n++; return n; }

  spawnDemo(fam) {
    const last = this.demoLast[fam];
    const pickNear = (cands) => {
      if (!cands.length) return null;
      if (last && Math.random() < 0.7) {
        const w = cands.map(p => Math.exp(-Math.hypot(p.x - last.x, p.y - last.y) / 90));
        let r = Math.random() * w.reduce((a, b) => a + b, 0);
        for (let i = 0; i < cands.length; i++) { r -= w[i]; if (r <= 0) return cands[i]; }
      }
      return cands[Math.floor(Math.random() * cands.length)];
    };
    if (fam === 'W') {
      let pos;
      if (last && Math.random() < 0.7) pos = { x: last.x + rand(-40, 40), y: last.y + rand(-40, 40) };
      else pos = this.randomPos();
      const b = this.waterBox();
      pos.x = Math.min(b.x1, Math.max(b.x0, pos.x)); pos.y = Math.min(b.y1, Math.max(b.y0, pos.y));
      const a = Math.random() * Math.PI * 2;
      const h = this.spawn('H', pos.x + Math.cos(a) * 14, pos.y + Math.sin(a) * 14, { anim: true, src: 'H2O', vx: Math.cos(a) * 1.6, vy: Math.sin(a) * 1.6 });
      const o = this.spawn('OH', pos.x - Math.cos(a) * 14, pos.y - Math.sin(a) * 14, { anim: true, src: 'H2O', vx: -Math.cos(a) * 1.6, vy: -Math.sin(a) * 1.6 });
      h.demo = o.demo = 'partner';
      const n = this.freeCount('H') + this.freeCount('OH');
      this.demos.push({ fam, parent: null, partners: [h, o], t: 0, life: demoLife(n), ending: false, rejoin: false, rt: 0, ion: 'W' });
      this.demoLast[fam] = pos;
      return;
    }
    const T = this.target.counts, forms = FAMILIES[fam].forms;
    let M = forms[0];
    forms.forEach(t => { if ((T[t] || 0) > (T[M] || 0)) M = t; });
    const cands = this.particles.filter(p => this.selectable(p) && p.type === M && p.age >= 1);
    const parent = pickNear(cands);
    if (!parent) return;
    const rx = DEMO_RXN[M];
    parent.demo = 'parent'; parent.demoOrig = M;
    this.convert(parent, rx.product);
    const a = Math.random() * Math.PI * 2;
    const ion = this.spawn(rx.ion, parent.x + Math.cos(a) * 24, parent.y + Math.sin(a) * 24,
      { anim: rx.ion === 'OH', src: rx.ion === 'OH' ? 'H2O' : null, vx: Math.cos(a) * 1.4, vy: Math.sin(a) * 1.4 });
    ion.demo = 'partner';
    const n = this.freeCount(rx.ion);
    this.demos.push({ fam, parent, partners: [ion], t: 0, life: demoLife(n), ending: false, rejoin: false, rt: 0, ion: rx.ion, M });
    this.demoLast[fam] = { x: parent.x, y: parent.y };
  }

  updateDemos(dt) {
    const s = dt * 60, keep = [];
    for (const d of this.demos) {
      d.t += dt;
      const partners = d.partners.filter(p => !p.dead);
      if (d.parent && d.parent.dead) { partners.forEach(p => this.kill(p, 'H2O')); continue; }
      if (!d.rejoin && d.t > d.life) { d.rejoin = true; d.ending = true; } // 開始再結合的同時，下一對解離（短暫 2 對）
      if (d.rejoin) {
        d.rt += dt;
        const anchor = d.parent || partners[0];
        let close = true;
        for (const p of partners) {
          if (p === anchor) continue;
          const dx = anchor.x - p.x, dy = anchor.y - p.y, dd = Math.hypot(dx, dy) || 1;
          if (dd > 22) close = false;
          const k = Math.min(1, dt * 7); // 約 0.3 秒內滑向對方
          p.x += dx * k; p.y += dy * k; p.vx *= 0.5; p.vy *= 0.5;
        }
        if (close || d.rt > 0.45) {
          if (d.parent) {
            this.demoLast[d.fam] = { x: d.parent.x, y: d.parent.y };
            this.convert(d.parent, d.M);
            d.parent.demo = null; d.parent.demoOrig = null;
            partners.forEach(p => this.kill(p, d.ion === 'OH' ? 'H2O' : null));
          } else {
            this.demoLast[d.fam] = { x: anchor.x, y: anchor.y };
            partners.forEach((p, i) => this.kill(p, i === 0 ? 'H2O' : null));
          }
          continue;
        }
      }
      keep.push(d);
    }
    this.demos = keep;
    const fams = this.presentFamilies().concat(this.showWater ? ['W'] : []);
    for (const f of fams) {
      if (f !== 'W' && this.needyFam.has(f)) continue;
      if (!this.demos.some(d => d.fam === f && !d.ending)) this.spawnDemo(f);
    }
  }

  // ---------- 電解：以「2 個電子」為一個單位，陰陽兩極同時完成 ----------
  electrodes(dt) {
    const e = this.env;
    if (this.eJob) { this.updateEJob(dt); return; }
    if (!e.powerOn || this.condRatio < COND_MIN) { this.eCharge = 0; return; }
    this.eCharge += dt * 0.07 * e.voltage * this.condRatio;
    if (this.eCharge >= 1) { this.eCharge -= 1; this.planE(); }
  }
  surf(side) { return side === 'left' ? this.env.leftSurface + BASE_PARTICLE_RADIUS + 6 : this.env.rightSurface - BASE_PARTICLE_RADIUS - 6; }
  planE() {
    const e = this.env;
    const anode = e.leftPolarity === 1 ? 'left' : 'right', cathode = anode === 'left' ? 'right' : 'left';
    const mat = side => side === 'left' ? e.leftElectrode : e.rightElectrode;
    const ax = this.surf(anode), cx = this.surf(cathode), my = (e.waterTop + e.solidBaseY) / 2;
    const job = { t: 0, anode, cathode, an: null, ca: null };
    const used = new Set();
    const pick = (types, x, n) => { const r = this.nearest(types, x, my, n, used); r.forEach(p => used.add(p)); return r; };
    const pl = this.plated[anode];
    if (pl.Zn > 0) job.an = { kind: 'Zn', parts: [] };
    else if (pl.Cu > 0) job.an = { kind: 'Cu', parts: [] };
    else if (mat(anode) === 'copper') job.an = { kind: 'CuMat', parts: [] };
    else {
      const cl = pick(['Cl'], ax, 2);
      if (cl.length === 2) job.an = { kind: 'Cl2', parts: cl };
      else {
        cl.forEach(p => used.delete(p));
        const oh = pick(['OH'], ax, 2);
        if (oh.length === 2) job.an = { kind: 'O2_OH', parts: oh };
        else { oh.forEach(p => used.delete(p)); job.an = { kind: 'O2', parts: [] }; }
      }
    }
    const cu = pick(['Cu', 'CuOH'], cx, 1);
    if (cu.length) job.ca = { kind: 'plateCu', parts: cu };
    else {
      const zn = pick(['Zn', 'ZnOH'], cx, 1);
      if (zn.length) job.ca = { kind: 'plateZn', parts: zn };
      else {
        const h = pick(['H'], cx, 2);
        if (h.length === 2) job.ca = { kind: 'H2', parts: h };
        else { h.forEach(p => used.delete(p)); job.ca = { kind: 'H2O', parts: [] }; }
      }
    }
    job.an.parts.forEach(p => { p.busy = 'E'; p.eX = ax; });
    job.ca.parts.forEach(p => { p.busy = 'E'; p.eX = cx; });
    this.eJob = job;
  }
  updateEJob(dt) {
    const j = this.eJob, s = dt * 60;
    j.t += dt;
    let arrived = true;
    for (const p of j.an.parts.concat(j.ca.parts)) {
      if (p.dead) continue;
      const dx = p.eX - p.x;
      if (Math.abs(dx) > 26) arrived = false;
      p.vx += Math.sign(dx) * 1.2 * s;
    }
    if (arrived || j.t > 1.6) this.execE();
  }
  execE() {
    const j = this.eJob, e = this.env;
    const ax = this.surf(j.anode), cx = this.surf(j.cathode);
    const dirA = j.anode === 'left' ? 1 : -1, dirC = -dirA;
    const yIn = () => rand(e.waterTop + 25, e.solidBaseY - 25);
    const bub = (x, y, color) => this.bubbles.push({ x, y, vy: rand(-3, -2), radius: rand(3, 6), phase: rand(0, 6.28), color });
    const yA = j.an.parts.length ? j.an.parts[0].y : yIn();
    switch (j.an.kind) {
      case 'Zn': case 'Cu': case 'CuMat': {
        const m = j.an.kind === 'Zn' ? 'Zn' : 'Cu';
        if (j.an.kind !== 'CuMat') this.plated[j.anode][m]--;
        this.totals[m]++;
        this.spawn(m, ax, yA, { vx: dirA * 3, vy: rand(-1, 1) });
        break;
      }
      case 'Cl2':
        j.an.parts.forEach(p => this.kill(p)); this.totals.Cl -= 2; this.gas.Cl2++;
        bub(ax, yA, 'rgba(163, 230, 53, 0.75)'); bub(ax, yA + 8, 'rgba(163, 230, 53, 0.75)');
        break;
      case 'O2_OH':
        j.an.parts.forEach(p => this.kill(p, 'H2O')); this.gas.O2 += 0.5;
        this.localExcess[j.anode] += 2 * UNIT; bub(ax, yA, 'rgba(255,255,255,0.75)');
        break;
      default: // O2：水被氧化，產生 H⁺
        for (let i = 0; i < 2; i++) this.spawn('H', ax, yA + (i ? 14 : -14), { vx: dirA * 2.5, vy: rand(-1, 1), hold: 1.2 });
        this.gas.O2 += 0.5; this.localExcess[j.anode] += 2 * UNIT; bub(ax, yA, 'rgba(255,255,255,0.75)');
    }
    const p0 = j.ca.parts[0];
    const yC = p0 ? p0.y : yIn();
    switch (j.ca.kind) {
      case 'plateCu': case 'plateZn': {
        const m = j.ca.kind === 'plateCu' ? 'Cu' : 'Zn';
        if (!p0.dead && p0.type.includes('OH')) {
          this.spawn('OH', cx, yC, { vx: dirC * 2.5, hold: 1.2 }); this.localExcess[j.cathode] -= UNIT;
        }
        this.kill(p0); this.totals[m]--; this.plated[j.cathode][m]++;
        break;
      }
      case 'H2':
        j.ca.parts.forEach(p => this.kill(p)); this.gas.H2++;
        this.localExcess[j.cathode] -= 2 * UNIT; bub(cx, yC, 'rgba(255,255,255,0.75)'); bub(cx, yC + 8, 'rgba(255,255,255,0.75)');
        break;
      default: // H2O：水被還原，產生 OH⁻
        for (let i = 0; i < 2; i++) this.spawn('OH', cx, yC + (i ? 14 : -14), { vx: dirC * 2.5, vy: rand(-1, 1), hold: 1.2 });
        this.gas.H2++; this.localExcess[j.cathode] -= 2 * UNIT;
        bub(cx, yC, 'rgba(255,255,255,0.75)'); bub(cx, yC + 8, 'rgba(255,255,255,0.75)');
    }
    j.an.parts.concat(j.ca.parts).forEach(p => { if (p.busy === 'E') p.busy = null; });
    this.eJob = null;
    this.recompute();
  }

  localPH(side) {
    const h = this.eq.h;
    const net = (h - KW / h) + this.localExcess[side] / LOCAL_VOL;
    const hh = (net + Math.sqrt(net * net + 4 * KW)) / 2;
    return Math.max(0, Math.min(14, -Math.log10(hh)));
  }

  // ---------- 物理 ----------
  physics(dt) {
    const e = this.env, s = dt * 60, P = this.particles, R = BASE_PARTICLE_RADIUS;
    const Ef = e.powerOn && this.condRatio >= COND_MIN ? e.leftPolarity * e.voltage * 0.05 : 0;
    const fr = Math.pow(FRICTION, s), minDist = R * 2.2, cutSq = 160 * 160;
    for (let i = 0; i < P.length; i++) {
      const p1 = P[i];
      if (p1.dead) continue;
      const q1 = SPECIES_DEFS[p1.type].charge;
      p1.vx += (Math.random() - 0.5) * THERMAL_JITTER * s;
      p1.vy += (Math.random() - 0.5) * THERMAL_JITTER * s;
      if (Ef && p1.busy !== 'E' && p1.demo !== 'partner') p1.vx += Ef * q1 * s;
      for (let j = i + 1; j < P.length; j++) {
        const p2 = P[j];
        if (p2.dead) continue;
        let dx = p2.x - p1.x, dy = p2.y - p1.y;
        if (dx === 0 && dy === 0) { dx = (Math.random() - 0.5) * 0.1; dy = (Math.random() - 0.5) * 0.1; }
        const d2 = dx * dx + dy * dy;
        if (d2 > cutSq) continue;
        const dist = Math.max(1, Math.sqrt(d2));
        let force = (K_COULOMB * q1 * SPECIES_DEFS[p2.type].charge) / Math.max(d2, 100);
        if (dist < minDist) force += K_REPULSION * (minDist - dist);
        const fx = dx / dist * force * s, fy = dy / dist * force * s;
        p1.vx -= fx; p2.vx += fx; p1.vy -= fy; p2.vy += fy;
      }
    }
    const r = R + 4;
    for (const p of P) {
      if (p.dead) continue;
      p.vx = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, p.vx)) * fr;
      p.vy = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, p.vy)) * fr;
      p.x += p.vx * s; p.y += p.vy * s;
      // 粒子只在水中運動：兩側電極、水面、沉澱層頂部皆為邊界
      if (p.x < e.leftSurface + r) { p.x = e.leftSurface + r; p.vx = Math.abs(p.vx) * 0.8; }
      else if (p.x > e.rightSurface - r) { p.x = e.rightSurface - r; p.vx = -Math.abs(p.vx) * 0.8; }
      if (p.y < e.waterTop + r) { p.y = e.waterTop + r; p.vy = Math.abs(p.vy) * 0.8; }
      if (p.y > e.solidBaseY - r) { p.y = e.solidBaseY - r; p.vy = -Math.abs(p.vy) * 0.8; }
      if (p.age < 1) p.age = Math.min(1, p.age + dt / 1.4);
      if (p.morph < 1) p.morph = Math.min(1, p.morph + dt / 0.6);
      if (p.hold > 0) p.hold -= dt;
    }
  }

  updateFx(dt) {
    const s = dt * 60, e = this.env;
    this.fading = this.fading.filter(f => { f.x += f.vx * s; f.y += f.vy * s; f.life -= 0.02 * s; return f.life > 0; });
    this.flakes = this.flakes.filter(f => { f.y += f.vy * s; f.x += Math.sin(this.time * 2 + f.phase) * 0.5 * s; return f.y < e.solidBaseY; });
    this.bubbles = this.bubbles.filter(b => { b.y += b.vy * s; b.x += Math.sin(this.time * 3 + b.phase) * 0.8 * s; return b.y > e.waterTop; });
  }

  step(dt, env) {
    if (env) Object.assign(this.env, env);
    if (this.env.paused) return;
    dt = Math.min(Math.max(dt, 0), 0.05);
    this.time += dt;
    this.physics(dt);
    this.updateJobs(dt);
    this.electrodes(dt);
    this.reconcile(dt);
    this.updateDemos(dt);
    this.updateFx(dt);
    const k = Math.pow(0.5, dt);
    this.localExcess.left *= k; this.localExcess.right *= k;
    if (this.particles.some(p => p.dead)) this.particles = this.particles.filter(p => !p.dead);
  }
}

}

      return (
        <div className="relative w-full h-36 rounded-xl overflow-hidden border-2 border-slate-300 shadow-inner">
          <div className="absolute inset-0 opacity-80" style={{ background: 'linear-gradient(to top, #dc2626 0%, #f97316 21%, #eab308 42%, #22c55e 50%, #3b82f6 78%, #9333ea 100%)' }}></div>
          <div className="absolute inset-0 bg-white/20"></div>
          <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="absolute inset-0 w-full h-full">
            <line x1="0" x2={width} y1={height / 2} y2={height / 2} stroke="rgba(255,255,255,0.5)" strokeWidth="1" strokeDasharray="3 3" vectorEffect="non-scaling-stroke" />
            <polyline points={pts('anode')} fill="none" stroke="#ef4444" strokeWidth="2.5" strokeDasharray="4 2" vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
            <polyline points={pts('cathode')} fill="none" stroke="#2563eb" strokeWidth="2.5" strokeDasharray="4 2" vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
            <polyline points={pts('bulk')} fill="none" stroke="rgba(255,255,255,0.95)" strokeWidth="2" vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
          </svg>
          <div className="absolute top-1 left-2 flex flex-col gap-0.5">
            <span className="text-[9px] font-bold text-white drop-shadow-md flex items-center gap-1"><span className="inline-block w-3 h-[2px] bg-white"></span> 整體 pH</span>
            <span className="text-[9px] font-bold text-white drop-shadow-md flex items-center gap-1"><span className="inline-block w-3 h-[2px] bg-red-500"></span> 陽極(+) 附近 pH</span>
            <span className="text-[9px] font-bold text-white drop-shadow-md flex items-center gap-1"><span className="inline-block w-3 h-[2px] bg-blue-600"></span> 陰極(-) 附近 pH</span>
          </div>
          <span className="absolute top-0.5 right-2 text-[10px] font-bold text-white drop-shadow-md">14</span>
          <span className="absolute top-1/2 -translate-y-1/2 right-2 text-[10px] font-bold text-white drop-shadow-md">7</span>
          <span className="absolute bottom-0.5 right-2 text-[10px] font-bold text-white drop-shadow-md">0</span>
        </div>
      );
    };

    const FormatSciNum = ({ num, digits = 3 }) => {
      if (num === 0) return <span>0</span>;
      if (num >= 0.001 && num < 1000) return <span>{num.toFixed(digits)}</span>;
      const [base, exp] = num.toExponential(2).split('e');
      return (
        <span className="inline-flex items-baseline">
          {base}<span className="mx-0.5">×</span>10<sup className="text-[0.7em]">{parseInt(exp, 10)}</sup>
        </span>
      );
    };
    const Pct = ({ frac }) => {
      const v = frac * 100;
      if (v >= 0.1) return <span>{v >= 99.95 && v < 100 ? '>99.9' : v.toFixed(v >= 10 ? 1 : 2)}%</span>;
      if (v <= 0) return <span>0%</span>;
      return <span><FormatSciNum num={v} />%</span>;
    };

    // 每個家族在面板中要顯示的形態（依質子數由少到多）
    const FAMILY_ROWS = {
      Ac: { label: '醋酸', eq: 'CH₃COOH ⇌ CH₃COO⁻ + H⁺' },
      N:  { label: '銨根／氨', eq: 'NH₄⁺ ⇌ NH₃ + H⁺' },
      C:  { label: '碳酸系', eq: 'H₂CO₃ ⇌ HCO₃⁻ ⇌ CO₃²⁻' },
      Cu: { label: '銅離子水解', eq: 'Cu²⁺ + H₂O ⇌ Cu(OH)⁺ + H⁺' },
      Zn: { label: '鋅離子水解', eq: 'Zn²⁺ + H₂O ⇌ Zn(OH)⁺ + H⁺' },
    };

    function App() {
      const [sim] = useState(() => new MicroSim());
      const [, setVer] = useState(0);
      const [addAmount, setAddAmount] = useState(0.5);
      const [draggedItem, setDraggedItem] = useState(null);
      const [isPaused, setIsPaused] = useState(false);
      const [showMicroscopic, setShowMicroscopic] = useState(false);
      const [powerOn, setPowerOn] = useState(false);
      const [voltage, setVoltage] = useState(12);
      const [leftPolarity, setLeftPolarity] = useState(1);
      const [leftElectrode, setLeftElectrode] = useState('graphite');
      const [rightElectrode, setRightElectrode] = useState('graphite');
      const [phHistory, setPhHistory] = useState([{ bulk: 7.0, anode: 7.0, cathode: 7.0 }]);
      const [showHelp, setShowHelp] = useState(false);
      const [ignoreWater, setIgnoreWater] = useState(true); // 預設忽略水的自解離（只影響畫面）
      useEffect(() => { sim.setShowWater(!ignoreWater); }, [sim, ignoreWater]);

      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const uiRef = useRef({});
      uiRef.current = { isPaused, showMicroscopic, powerOn, voltage, leftPolarity, leftElectrode, rightElectrode };

      // 巨觀狀態改變時重新繪製面板
      useEffect(() => sim.on(() => setVer(v => v + 1)), [sim]);

      // 每秒記錄 pH 歷程（暫停時凍結）
      useEffect(() => {
        const timer = setInterval(() => {
          if (uiRef.current.isPaused) return;
          const anode = uiRef.current.leftPolarity === 1 ? 'left' : 'right';
          const cathode = anode === 'left' ? 'right' : 'left';
          setPhHistory(prev => {
            const next = [...prev, { bulk: sim.eq.pH, anode: sim.localPH(anode), cathode: sim.localPH(cathode) }];
            return next.length > 40 ? next.slice(next.length - 40) : next;
          });
          setVer(v => v + 1);
        }, 1000);
        return () => clearInterval(timer);
      }, [sim]);

      // 畫布：高解析度 + ResizeObserver + 以時間差 dt 推進
      useEffect(() => {
        const canvas = canvasRef.current, parent = containerRef.current;
        const ctx = canvas.getContext('2d');
        const size = { w: parent.clientWidth || 400, h: parent.clientHeight || 400 };
        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          size.w = parent.clientWidth || size.w; size.h = parent.clientHeight || size.h;
          canvas.width = Math.round(size.w * dpr); canvas.height = Math.round(size.h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        const ro = new ResizeObserver(resize);
        ro.observe(parent);

        let raf = 0, last = performance.now(), running = true;

        const drawParticle = (type, x, y, alpha = 1.0, scale = 1.0) => {
          const def = SPECIES_DEFS[type] || SPECIES_DEFS.H2O;
          ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
          ctx.font = `bold ${11 * scale}px sans-serif`;
          const textWidth = ctx.measureText(def.symbol).width;
          const R = BASE_PARTICLE_RADIUS * scale;
          const radius = Math.max(BASE_PARTICLE_RADIUS, textWidth / 2 + 4) * scale;
          ctx.beginPath();
          if (radius > R) {
            if (ctx.roundRect) ctx.roundRect(x - radius, y - R, radius * 2, R * 2, R);
            else ctx.rect(x - radius, y - R, radius * 2, R * 2);
          } else ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = def.bg; ctx.fill(); ctx.lineWidth = 2 * scale; ctx.strokeStyle = def.color; ctx.stroke();
          ctx.fillStyle = def.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(def.symbol, x, y);
          ctx.globalAlpha = 1.0;
        };

        const sedimentLayers = (height) => {
          const layers = PRECIPITATES.map(p => ({ p, mol: sim.eq.solids[p.id] || 0 })).filter(l => l.mol >= 1e-4);
          let total = layers.reduce((s, l) => s + l.mol * 40, 0);
          const k = total > height * 0.4 ? (height * 0.4) / total : 1;
          layers.forEach(l => { l.h = l.mol * 40 * k; });
          return { layers, totalH: total * k };
        };

        const frame = (now) => {
          if (!running) return;
          const dt = Math.min(0.05, (now - last) / 1000); last = now;
          const ui = uiRef.current;
          const width = size.w, height = size.h;
          const waterTop = height * (1 - VOLUME / MAX_VOLUME);
          const sed = sedimentLayers(height);
          const solidBaseY = height - sed.totalH;
          const LEFT_X = ELECTRODE_X, RIGHT_X = width - ELECTRODE_X - ELECTRODE_W;
          const env = {
            width, height, waterTop, solidBaseY,
            leftSurface: LEFT_X + ELECTRODE_W, rightSurface: RIGHT_X,
            powerOn: ui.powerOn, voltage: ui.voltage, leftPolarity: ui.leftPolarity,
            leftElectrode: ui.leftElectrode, rightElectrode: ui.rightElectrode, paused: ui.isPaused,
          };
          sim.step(dt, env);

          ctx.clearRect(0, 0, width, height);
          const time = sim.time;
          const condRatio = sim.condRatio;
          const isConductive = condRatio >= COND_MIN;
          const pOn = ui.powerOn, vol = ui.voltage, lPol = ui.leftPolarity, rPol = -lPol;

          // --- 沉澱層（與粒子底線使用同一組高度） ---
          let yy = height;
          for (const l of sed.layers) {
            yy -= l.h;
            ctx.fillStyle = l.p.color; ctx.fillRect(0, yy, width, l.h);
            ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(width, yy); ctx.stroke();
            if (l.h >= 11) {
              ctx.fillStyle = '#1e293b'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillText(`${l.p.formula} 沉澱`, width / 2, yy + l.h / 2);
            }
          }

          // --- 電路 ---
          const batW = 60, batH = 24, batX = width / 2 + 10, batY = 15;
          const bulbRadius = 16, bulbX = width / 2 - 70, bulbY = batY + batH / 2;
          const l_p0 = { x: bulbX - bulbRadius, y: bulbY }, l_p1 = { x: bulbX - 30, y: bulbY };
          const l_p2 = { x: LEFT_X + ELECTRODE_W / 2, y: batY + 10 }, l_p3 = { x: LEFT_X + ELECTRODE_W / 2, y: waterTop - 40 };
          const m_p0 = { x: bulbX + bulbRadius, y: bulbY }, m_p1 = { x: batX, y: batY + batH / 2 };
          const r_p0 = { x: batX + batW, y: batY + batH / 2 }, r_p1 = { x: batX + batW + 30, y: batY + batH / 2 };
          const r_p2 = { x: RIGHT_X + ELECTRODE_W / 2, y: batY + 10 }, r_p3 = { x: RIGHT_X + ELECTRODE_W / 2, y: waterTop - 40 };

          ctx.lineWidth = 3;
          ctx.strokeStyle = lPol === 1 ? '#ef4444' : '#1e293b';
          ctx.beginPath(); ctx.moveTo(l_p0.x, l_p0.y); ctx.bezierCurveTo(l_p1.x, l_p1.y, l_p2.x, l_p2.y, l_p3.x, l_p3.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(m_p0.x, m_p0.y); ctx.lineTo(m_p1.x, m_p1.y); ctx.stroke();
          ctx.strokeStyle = rPol === 1 ? '#ef4444' : '#1e293b';
          ctx.beginPath(); ctx.moveTo(r_p0.x, r_p0.y); ctx.bezierCurveTo(r_p1.x, r_p1.y, r_p2.x, r_p2.y, r_p3.x, r_p3.y); ctx.stroke();

          const lit = pOn && isConductive;
          ctx.beginPath(); ctx.arc(bulbX, bulbY - 6, bulbRadius, 0, Math.PI * 2); ctx.fillStyle = '#f8fafc'; ctx.fill();
          if (lit) {
            ctx.beginPath(); ctx.arc(bulbX, bulbY - 6, bulbRadius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(250, 204, 21, ${0.2 + 0.8 * condRatio})`;
            ctx.shadowColor = '#facc15'; ctx.shadowBlur = 10 + 20 * condRatio; ctx.fill(); ctx.shadowBlur = 0;
          }
          ctx.lineWidth = 2; ctx.strokeStyle = '#cbd5e1'; ctx.stroke();
          ctx.fillStyle = '#94a3b8'; ctx.fillRect(bulbX - 8, bulbY + bulbRadius - 8, 16, 10);
          ctx.fillStyle = '#475569'; ctx.fillRect(bulbX - 6, bulbY + bulbRadius + 2, 12, 4);
          ctx.beginPath(); ctx.moveTo(bulbX - 6, bulbY + bulbRadius - 8); ctx.lineTo(bulbX - 3, bulbY - 6); ctx.lineTo(bulbX + 3, bulbY - 6); ctx.lineTo(bulbX + 6, bulbY + bulbRadius - 8);
          ctx.strokeStyle = lit ? `rgba(255, 255, 255, ${0.5 + 0.5 * condRatio})` : '#64748b'; ctx.lineWidth = 1.5; ctx.stroke();
          if (lit) {
            ctx.beginPath(); ctx.moveTo(bulbX - 3, bulbY - 6); ctx.lineTo(bulbX + 3, bulbY - 6);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 5; ctx.stroke(); ctx.shadowBlur = 0;
          }

          ctx.fillStyle = '#ffffff'; ctx.fillRect(batX, batY, batW, batH);
          ctx.strokeStyle = '#475569'; ctx.lineWidth = 2; ctx.strokeRect(batX, batY, batW, batH);
          ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const bumpW = 6, bumpH = 10;
          if (lPol === 1) {
            ctx.fillStyle = '#ef4444'; ctx.fillRect(batX - bumpW, batY + batH / 2 - bumpH / 2, bumpW, bumpH);
            ctx.fillText('+', batX + 15, batY + batH / 2 + 1);
            ctx.fillStyle = '#1e293b'; ctx.fillText('-', batX + batW - 15, batY + batH / 2 + 1);
          } else {
            ctx.fillStyle = '#ef4444'; ctx.fillRect(batX + batW, batY + batH / 2 - bumpH / 2, bumpW, bumpH);
            ctx.fillStyle = '#1e293b'; ctx.fillText('-', batX + 15, batY + batH / 2 + 1);
            ctx.fillStyle = '#ef4444'; ctx.fillText('+', batX + batW - 15, batY + batH / 2 + 1);
          }
          ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.fillText(vol + 'V', batX + batW / 2, batY + batH / 2 + 1);

          if (lit) {
            const E_speed = 0.2 + 0.6 * condRatio;
            const numE = Math.max(2, Math.floor(6 * condRatio));
            const getBez = (t, p0, p1, p2, p3) => {
              const u = 1 - t;
              return { x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
                       y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y };
            };
            const dot = (ex, ey) => {
              ctx.beginPath(); ctx.arc(ex, ey, 6, 0, Math.PI * 2); ctx.fillStyle = '#3b82f6'; ctx.fill();
              ctx.lineWidth = 1; ctx.strokeStyle = '#ffffff'; ctx.stroke();
              ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('-', ex, ey + 1);
            };
            const along = (fn, rev) => { for (let i = 0; i < numE; i++) { const raw = ((time * E_speed * 0.5) + i / numE) % 1.0; const p = fn(rev ? raw : 1 - raw); dot(p.x, p.y); } };
            along(t => getBez(t, l_p0, l_p1, l_p2, l_p3), lPol === -1);
            along(t => ({ x: m_p0.x + (m_p1.x - m_p0.x) * t, y: m_p0.y + (m_p1.y - m_p0.y) * t }), lPol === 1);
            along(t => getBez(t, r_p0, r_p1, r_p2, r_p3), rPol === -1);
          }

          // --- 電極與鍍層 ---
          const drawElectrode = (side, xPos, isLeft) => {
            const material = side === 'left' ? ui.leftElectrode : ui.rightElectrode;
            ctx.fillStyle = material === 'graphite' ? '#334155' : '#b45309';
            ctx.fillRect(xPos, waterTop - 40, ELECTRODE_W, height - waterTop + 40);
            const pl = sim.plated[side];
            let cur = 0;
            const layer = (mol, color) => {
              if (mol <= 0) return;
              const thick = Math.min(6, mol * 4);
              ctx.fillStyle = color;
              ctx.fillRect(isLeft ? xPos + ELECTRODE_W + cur : xPos - cur - thick, waterTop, thick, height - waterTop);
              cur += thick;
            };
            layer(pl.Zn * UNIT, '#94a3b8');
            layer(pl.Cu * UNIT, '#c2410c');
          };
          drawElectrode('left', LEFT_X, true);
          drawElectrode('right', RIGHT_X, false);

          // --- 微觀粒子 ---
          if (ui.showMicroscopic) {
            for (const p of sim.particles) {
              if (p.dead) continue;
              if (p.age < 1) {
                if (p.age < 0.5) {
                  drawParticle(p.src || p.type, p.x, p.y);
                  drawParticle('H2O', p.x, p.y, p.age * 1.5, 1.3 + Math.sin(p.age * Math.PI * 4) * 0.1);
                } else {
                  const k = (p.age - 0.5) * 2;
                  drawParticle(p.type, p.x, p.y);
                  drawParticle('H2O', p.x, p.y, 0.75 * (1 - k), 1.3 + k * 0.6);
                }
              } else if (p.morph < 1 && p.prevType) {
                drawParticle(p.morph < 0.45 ? p.prevType : p.type, p.x, p.y);
                const def = SPECIES_DEFS[p.type];
                ctx.beginPath(); ctx.arc(p.x, p.y, BASE_PARTICLE_RADIUS + 4 + p.morph * 14, 0, Math.PI * 2);
                ctx.globalAlpha = 1 - p.morph; ctx.lineWidth = 2; ctx.strokeStyle = def.color; ctx.stroke(); ctx.globalAlpha = 1;
              } else drawParticle(p.type, p.x, p.y);
            }
            for (const f of sim.fading) drawParticle(f.type, f.x, f.y, f.life);
          }

          // --- 巨觀現象（氣泡、沉澱雪花）始終繪製 ---
          for (const s of sim.flakes) {
            ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI * 2); ctx.fillStyle = s.color; ctx.fill();
            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.stroke();
          }
          for (const b of sim.bubbles) {
            ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = b.color; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
          }

          raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);
        return () => { running = false; cancelAnimationFrame(raf); ro.disconnect(); };
      }, [sim]);

      const handleReset = () => {
        sim.reset();
        setPowerOn(false); setIsPaused(false);
        setPhHistory([{ bulk: 7.0, anode: 7.0, cathode: 7.0 }]);
      };
      const handleAddElectrolyte = (id) => {
        const el = ELECTROLYTES.find(e => e.id === id);
        if (el) sim.addElectrolyte(el, parseFloat(addAmount));
      };
      const onDragStart = (e, id) => { e.dataTransfer.setData('text/plain', id); setDraggedItem(id); };
      const onDragEnd = () => setDraggedItem(null);
      const onDragOver = (e) => e.preventDefault();
      const onDrop = (e) => { e.preventDefault(); handleAddElectrolyte(e.dataTransfer.getData('text/plain')); setDraggedItem(null); };

      const getPhColor = (ph) => {
        if (ph < 3) return 'text-red-600'; if (ph < 6) return 'text-orange-500';
        if (ph < 8) return 'text-green-600'; if (ph < 11) return 'text-blue-600'; return 'text-purple-600';
      };

      const eq = sim.eq;
      const pHShown = Math.max(0, Math.min(14, eq.pH));
      const sp = eq.species;
      const famPresent = FAMILY_KEYS.filter(f => FAMILIES[f].forms.reduce((s, t) => s + (sp[t] || 0), 0) > 1e-6);
      const hM = sp.H / VOLUME, ohM = sp.OH / VOLUME;
      const waterSelf = Math.min(hM, ohM) / 55.5;
      const g = sim.gas;
      const products = [];
      if (g.Cl2 > 0) products.push(['Cl₂(g)', g.Cl2 * UNIT]);
      if (g.O2 > 0) products.push(['O₂(g)', g.O2 * UNIT]);
      if (g.H2 > 0) products.push(['H₂(g)', g.H2 * UNIT]);
      ['left', 'right'].forEach(s => {
        const n = s === 'left' ? '左' : '右';
        if (sim.plated[s].Cu > 0) products.push([`${n}極 Cu(s) 鍍層`, sim.plated[s].Cu * UNIT]);
        if (sim.plated[s].Zn > 0) products.push([`${n}極 Zn(s) 鍍層`, sim.plated[s].Zn * UNIT]);
      });
      if (sim.co2LostN > 0) products.push(['CO₂(g) 逸出', sim.co2LostN * UNIT]);

      return (
        <div className="min-h-screen text-slate-800 font-sans p-4 md:p-6 flex flex-col">
          <header className="mb-4 flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div className="flex items-center gap-3">
              <IconFlaskConical className="w-8 h-8 text-indigo-600" />
              <h1 className="text-2xl font-bold text-slate-800">酸鹼鹽水解與電解動態模擬器 <span className="text-sm font-medium text-slate-400">V7</span></h1>
            </div>
            <div className="flex items-center gap-3 bg-slate-100 px-6 py-2 rounded-full border border-slate-200 shadow-inner">
              <span className="font-bold text-slate-600 tracking-wider">目前整體 pH 值</span>
              <span className={`text-3xl font-black ${getPhColor(pHShown)}`}>{pHShown.toFixed(2)}</span>
            </div>
          </header>

          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 lg:h-[650px]">
            <div className="lg:col-span-3 flex flex-col gap-4 h-full min-h-0">
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-amber-400 shrink-0">
                <h2 className="text-md font-bold mb-3 flex items-center gap-2"><IconBattery className="w-5 h-5 text-amber-500" /> 電極材質設定</h2>
                <div className="flex justify-between text-xs font-bold font-mono mb-3">
                  <div className={`px-2 py-1 rounded transition-colors ${leftPolarity === 1 ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>左: {leftPolarity === 1 ? '(+) 陽極' : '(-) 陰極'}</div>
                  <div className={`px-2 py-1 rounded transition-colors ${leftPolarity === -1 ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>右: {leftPolarity === -1 ? '(+) 陽極' : '(-) 陰極'}</div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  {[['左側電極', leftElectrode, setLeftElectrode], ['右側電極', rightElectrode, setRightElectrode]].map(([label, val, set]) => (
                    <div key={label}>
                      <label className="block text-slate-500 mb-1">{label}</label>
                      <select value={val} onChange={e => set(e.target.value)} disabled={powerOn} className="w-full p-1.5 border rounded bg-slate-50 disabled:opacity-50 font-medium">
                        <option value="graphite">石墨 (惰性)</option>
                        <option value="copper">銅片 (活性)</option>
                      </select>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex-1 overflow-y-auto min-h-0">
                <div className="flex justify-between items-center mb-3">
                  <h2 className="text-md font-bold flex items-center gap-2 shrink-0"><IconMousePointer2 className="w-5 h-5 text-indigo-500" /> 藥品櫃</h2>
                  <select value={addAmount} onChange={e => setAddAmount(parseFloat(e.target.value))} className="text-xs border rounded p-1">
                    <option value={0.1}>加 0.1 mol</option><option value={0.5}>加 0.5 mol</option><option value={1.0}>加 1.0 mol</option>
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {ELECTROLYTES.map(el => (
                    <div key={el.id} draggable onDragStart={(e) => onDragStart(e, el.id)} onDragEnd={onDragEnd} onClick={() => handleAddElectrolyte(el.id)}
                      className={`p-2 border-2 border-dashed rounded-lg cursor-grab hover:shadow-md transition-all flex flex-col items-center justify-center gap-1 ${el.uiColor}`}>
                      <span className="font-bold text-sm tracking-wider">{el.formula}</span>
                      <span className="text-[10px] font-medium">{el.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="lg:col-span-5 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 p-4 relative h-[500px] lg:h-full min-h-0">
              <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-2 mb-3 shrink-0">
                <div className="flex flex-wrap items-center gap-2">
                  <h2 className="text-lg font-bold text-slate-800 whitespace-nowrap">實驗觀察區</h2>
                  <div className="flex items-center gap-2 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-200 ml-2 shadow-sm">
                    <span className="text-xs font-bold text-indigo-700">微觀粒子</span>
                    <button onClick={() => setShowMicroscopic(!showMicroscopic)} aria-label="切換微觀粒子"
                      className={`relative inline-flex h-5 w-9 items-center rounded-full transition-colors ${showMicroscopic ? 'bg-indigo-600' : 'bg-slate-300'}`}>
                      <span className={`inline-block h-3.5 w-3.5 transform rounded-full bg-white transition-transform ${showMicroscopic ? 'translate-x-4' : 'translate-x-1'}`} />
                    </button>
                  </div>
                  <div className="flex items-center gap-2 bg-sky-50 px-3 py-1 rounded-full border border-sky-200 shadow-sm" title="只影響畫面；pH 與數值計算一律包含水的解離">
                    <span className="text-xs font-bold text-sky-700 whitespace-nowrap">忽略水的解離</span>
                    <button onClick={() => setIgnoreWater(!ignoreWater)} aria-label="切換忽略水的解離"
                      className={`relative inline-flex h-5 w-9 items-center rounded-full transition-colors ${ignoreWater ? 'bg-sky-600' : 'bg-slate-300'}`}>
                      <span className={`inline-block h-3.5 w-3.5 transform rounded-full bg-white transition-transform ${ignoreWater ? 'translate-x-4' : 'translate-x-1'}`} />
                    </button>
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-2 justify-end w-full">
                  <div className="flex items-center gap-2 bg-slate-50 px-2 py-1.5 rounded-md border border-slate-200">
                    <span className="text-xs font-bold text-slate-600 w-12">電壓 {voltage}V</span>
                    <input type="range" min="1" max="24" step="1" value={voltage} onChange={(e) => setVoltage(parseFloat(e.target.value))} className="w-16 accent-amber-500" disabled={powerOn} />
                  </div>
                  <button onClick={() => !powerOn && setLeftPolarity(leftPolarity * -1)} disabled={powerOn}
                    className="flex items-center gap-1 text-xs bg-slate-100 px-2 py-1.5 rounded-md hover:bg-slate-200 disabled:opacity-50 font-bold text-slate-700 border border-slate-200 transition-colors">🔄 反轉</button>
                  <button onClick={() => setPowerOn(!powerOn)} className={`flex items-center gap-1 text-sm px-3 py-1.5 rounded-md font-bold transition-all ${powerOn ? 'bg-red-500 text-white shadow-md shadow-red-200' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}>
                    <IconPower className="w-4 h-4" /> {powerOn ? 'ON' : 'OFF'}
                  </button>
                  <div className="hidden sm:block w-px h-5 bg-slate-300 mx-1"></div>
                  <button onClick={() => setIsPaused(!isPaused)} className={`flex items-center gap-1 text-sm px-3 py-1.5 rounded-md transition-colors ${isPaused ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 font-bold'}`}>
                    {isPaused ? <IconPlay className="w-4 h-4" /> : <IconPause className="w-4 h-4" />} {isPaused ? '繼續' : '暫停'}
                  </button>
                  <button onClick={handleReset} className="flex items-center gap-1 text-sm text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md font-bold transition-colors">
                    <IconRefreshCcw className="w-4 h-4" /> 清空
                  </button>
                </div>
              </div>

              <div className={`text-[11px] text-slate-500 text-center mb-1 shrink-0 ${showMicroscopic ? '' : 'invisible'}`}>
                示意：1 粒子 = 0.05 mol；弱電解質{ignoreWater ? '' : '與水'}各顯示 1 對解離中的粒子
              </div>
              <div className={`flex-1 relative border-b-8 border-l-8 border-r-8 border-slate-300 rounded-b-[40px] overflow-hidden ${draggedItem ? 'bg-indigo-50/50' : 'bg-transparent'}`}
                onDragOver={onDragOver} onDrop={onDrop} ref={containerRef} style={{ width: '90%', margin: '0 auto' }}>
                <div className="absolute bottom-0 w-full bg-blue-400/20 border-t border-blue-400/40" style={{ height: `${(VOLUME / MAX_VOLUME) * 100}%` }} />
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-20" />
                {isPaused && (
                  <div className="absolute inset-0 z-30 flex items-center justify-center pointer-events-none">
                    <div className="bg-black/20 text-white backdrop-blur-sm px-6 py-2 rounded-full font-bold tracking-widest text-lg shadow-lg">畫面已凍結</div>
                  </div>
                )}
              </div>
            </div>

            <div className="lg:col-span-4 flex flex-col gap-4 h-full min-h-0 overflow-y-auto">
              <div className="bg-indigo-50 rounded-xl shadow-sm border border-indigo-100 shrink-0 overflow-hidden">
                <button onClick={() => setShowHelp(!showHelp)} className="w-full p-3 md:p-4 flex justify-between items-center text-left hover:bg-indigo-100/50 transition-colors">
                  <span className="font-bold text-indigo-800 flex items-center gap-2 text-sm md:text-base">
                    <IconInfo className="w-5 h-5" /> 🧪 學習流程建議：從巨觀到微觀
                  </span>
                  <svg className={`w-5 h-5 text-indigo-500 transform transition-transform ${showHelp ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                {showHelp && (
                  <div className="px-4 pb-4 text-sm text-indigo-800 border-t border-indigo-100/50 pt-3">
                    <ol className="list-decimal pl-5 space-y-1.5 marker:font-bold marker:text-indigo-600">
                      <li><b>酸鹼中性：</b>不開啟微觀粒子，加入不同藥品，觀察右上方的「整體 pH 值」，分類出酸、鹼、中性物質。</li>
                      <li><b>電解質定義：</b>開啟電源，觀察燈泡是否發亮。能讓溶液導電（燈泡發亮）的物質即為電解質；弱電解質（如醋酸）只會微亮。</li>
                      <li><b>酸鹼與導電：</b>觀察酸鹼性物質是否通常也會讓燈泡發亮（為電解質）？乙醇、葡萄糖呢？</li>
                      <li><b>微觀解釋：</b>打開「微觀粒子」開關，觀察溶液中游離的帶電離子，了解導電的原因。</li>
                      <li><b>水的解離：</b>清空水槽，開啟微觀並<b>關閉「忽略水的解離」</b>，會看到一對 H⁺ 與 OH⁻ 不斷生成、再結合成水：水會解離，只是非常少；平常溶液中水的貢獻極小，因此預設忽略。</li>
                      <li><b>弱酸的解離與逆反應：</b>加入醋酸，大部分仍是 CH₃COOH 分子，只有一對解離後又結合；再加入 HCl，觀察 H⁺ 變多時解離受到抑制。</li>
                      <li><b>鹽類水解：</b>加入碳酸鈉，觀察 CO₃²⁻ 與水作用產生 OH⁻；再逐次加入 HCl，觀察 CO₃²⁻ → HCO₃⁻ → H₂CO₃ → CO₂ 氣泡。</li>
                      <li><b>電極反應：</b>觀察陽極與陰極的氣泡、金屬溶解／析出，以及兩極附近的 pH；嘗試更換為銅電極觀察變化。</li>
                    </ol>
                    <p className="mt-2 text-xs text-indigo-600">※ 微觀畫面為示意：1 個粒子代表 0.05 mol；弱電解質（以及關閉開關時的水）的解離被放大成「固定 1 對」；「忽略水的解離」只影響畫面，pH 計算一律包含水的解離，真實比例請看右側「真實解離程度」。</p>
                  </div>
                )}
              </div>

              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 shrink-0">
                <h2 className="text-md font-bold mb-3 flex items-center gap-2"><IconActivity className="w-5 h-5 text-rose-500" /> 歷程 pH 曲線與局部分區模型</h2>
                <PhChart history={phHistory} />
                <p className="bg-sky-50 text-sky-800 p-2 rounded text-xs leading-relaxed mt-3 border border-sky-100">
                  <strong>💡 局部與整體 pH：</strong>電解時陽極附近偏酸（<span className="text-red-500 font-bold">紅</span>）、陰極附近偏鹼（<span className="text-blue-600 font-bold">藍</span>），擴散後兩者會互相中和；<span className="font-bold text-slate-800">白線</span>是整杯溶液的 pH。
                </p>
              </div>

              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 shrink-0">
                <h2 className="text-md font-bold mb-2 flex items-center gap-2">⚖️ 真實解離程度</h2>
                <div className="text-xs space-y-2">
                  <div className="border-b border-slate-100 pb-2">
                    <div className="font-bold text-slate-700">水的自解離 <span className="font-normal text-slate-400">H₂O ⇌ H⁺ + OH⁻</span></div>
                    <div className="text-slate-600 font-mono">[H⁺] = <FormatSciNum num={hM} /> M，[OH⁻] = <FormatSciNum num={ohM} /> M</div>
                    <div className="text-slate-500">約每 <FormatSciNum num={1 / waterSelf} /> 個水分子中，有 1 個解離{ignoreWater && <span className="text-sky-600">（畫面已忽略，可關閉開關觀察）</span>}</div>
                  </div>
                  {famPresent.map(f => {
                    const forms = FAMILIES[f].forms.slice().reverse();
                    const tot = forms.reduce((s, t) => s + (sp[t] || 0), 0);
                    return (
                      <div key={f} className="border-b border-slate-100 pb-2">
                        <div className="font-bold text-slate-700">{FAMILY_ROWS[f].label} <span className="font-normal text-slate-400">{FAMILY_ROWS[f].eq}</span></div>
                        <div className="flex flex-wrap gap-x-3 text-slate-600 font-mono">
                          {forms.map(t => <span key={t}>{SPECIES_DEFS[t].symbol} <Pct frac={(sp[t] || 0) / tot} /></span>)}
                        </div>
                      </div>
                    );
                  })}
                  {!famPresent.length && <div className="text-slate-400">加入弱酸、弱鹼或可水解的鹽後，這裡會顯示各形態的真實比例。</div>}
                </div>
              </div>

              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 shrink-0">
                <h2 className="text-md font-bold mb-3 flex items-center gap-2"><IconZap className="w-5 h-5 text-amber-500" /> 平衡後物種莫耳數 (mol)</h2>
                <div className="grid grid-cols-2 gap-x-6 gap-y-1">
                  {Object.entries(sp).map(([id, moles]) => {
                    if (moles < 1e-6 && id !== 'H' && id !== 'OH') return null;
                    const def = SPECIES_DEFS[id];
                    if (!def) return null;
                    return (
                      <div key={id} className="flex justify-between items-center text-sm py-1 border-b border-slate-50">
                        <div className="flex items-center gap-2 shrink-0">
                          <span className="w-2 h-2 rounded-full" style={{ backgroundColor: def.color }}></span>
                          <span className="font-medium text-slate-700">{def.symbol}</span>
                        </div>
                        <span className="font-mono text-slate-600"><FormatSciNum num={moles} /></span>
                      </div>
                    );
                  })}
                  {PRECIPITATES.map(p => {
                    const moles = eq.solids[p.id] || 0;
                    if (moles < 1e-4) return null;
                    return (
                      <div key={p.id} className="flex justify-between items-center text-sm py-1 border-b border-slate-50">
                        <div className="flex items-center gap-2 shrink-0">
                          <span className="w-2 h-2 rounded-sm border border-slate-300" style={{ backgroundColor: p.color }}></span>
                          <span className="font-medium text-slate-700">{p.formula} (固)</span>
                        </div>
                        <span className="font-mono text-slate-600"><FormatSciNum num={moles} /></span>
                      </div>
                    );
                  })}
                </div>
                {products.length > 0 && (
                  <div className="mt-3 pt-2 border-t border-slate-200">
                    <div className="text-xs font-bold text-slate-500 mb-1">累計產物</div>
                    <div className="grid grid-cols-2 gap-x-6 gap-y-0.5 text-xs">
                      {products.map(([k, v]) => (
                        <div key={k} className="flex justify-between"><span className="text-slate-600">{k}</span><span className="font-mono text-slate-600">{v.toFixed(3)}</span></div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
