<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>光學法線練習 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; user-select: none; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #e2e8f0; overflow-x: hidden; }
        canvas { border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); cursor: crosshair; touch-action: none; background: #1e293b; }
        .btn { transition: all 0.15s ease; font-weight: 500; }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .shape-btn { width: 42px; height: 42px; border-radius: 8px; background: rgba(30, 41, 59, 0.8); border: 2px solid rgba(148, 163, 184, 0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; color: #cbd5e1; }
        .shape-btn:hover { border-color: rgba(96, 165, 250, 0.6); background: rgba(59, 130, 246, 0.15); color: #fff; }
        .shape-btn.active { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border-color: #93c5fd; color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .shape-icon { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; }
        .control-panel { backdrop-filter: blur(16px); background: rgba(15, 23, 42, 0.92); border-bottom: 1px solid rgba(148, 163, 184, 0.15); }
        @media (max-width: 768px) { .shape-btn { width: 36px; height: 36px; } .shape-icon { width: 20px; height: 20px; } }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- 頂部控制列 -->
    <header class="control-panel z-30 px-3 py-2 flex-shrink-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-base md:text-lg font-bold text-blue-400 leading-tight">光學法線練習</h1>
                    <div class="text-xs md:text-sm font-medium mt-0.5"><span id="feedback" class="text-slate-400">請選擇上方幾何形狀開始練習</span></div>
                </div>
            </div>

            <!-- 形狀選擇器 -->
            <div class="flex flex-wrap gap-1.5 justify-center" id="shapeSelector">
                <button class="shape-btn" data-curve="circle" title="圓形"><svg class="shape-icon" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14"/></svg></button>
                <button class="shape-btn" data-curve="ellipse" title="橢圓"><svg class="shape-icon" viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="15" ry="10"/></svg></button>
                <button class="shape-btn" data-curve="parabola_convex" title="拋物面(凸)"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 12 6 Q 32 20 12 34"/></svg></button>
                <button class="shape-btn" data-curve="parabola_concave" title="拋物面(凹)"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 28 6 Q 8 20 28 34"/></svg></button>
                <button class="shape-btn" data-curve="sine" title="正弦波表面"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 3 20 Q 11 6 20 20 T 37 20"/></svg></button>
                <button class="shape-btn" data-curve="square" title="方形稜鏡"><svg class="shape-icon" viewBox="0 0 40 40"><rect x="9" y="9" width="22" height="22"/></svg></button>
                <button class="shape-btn" data-curve="triangle" title="三稜鏡"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 20 7 L 33 32 L 7 32 Z"/></svg></button>
                <button class="shape-btn" data-curve="biconvex" title="雙凸透鏡"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 20 6 Q 32 20 20 34 Q 8 20 20 6 Z"/></svg></button>
                <button class="shape-btn" data-curve="biconcave" title="雙凹透鏡"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 11 7 L 29 7 Q 22 20 29 33 L 11 33 Q 18 20 11 7 Z"/></svg></button>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-1" title="調整容許角度誤差">
                    <span class="text-xs text-slate-400 hidden sm:inline">容差</span>
                    <button id="toleranceDown" class="btn px-1.5 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">−</button>
                    <span id="toleranceValue" class="text-xs md:text-sm font-bold text-blue-400 min-w-[2.2rem] text-center">10°</span>
                    <button id="toleranceUp" class="btn px-1.5 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">+</button>
                </div>
                <button id="newPoint" class="btn px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs md:text-sm font-bold shadow" title="快捷鍵: Space">新題目</button>
                <button id="showAnswer" class="btn px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-lg text-xs md:text-sm font-bold shadow" title="快捷鍵: Enter">看答案</button>
                <button id="toggleStatsBtn" class="btn px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs md:text-sm font-bold shadow flex items-center gap-1">
                    <span>成果</span>
                    <span id="badgeCount" class="bg-emerald-800 text-emerald-200 px-1.5 py-0.2 rounded-full text-xs">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 畫布主區域 -->
    <main class="flex-1 flex items-center justify-center p-2 md:p-4 overflow-hidden relative" id="canvasContainer">
        <canvas id="canvas"></canvas>
    </main>

    <!-- 統計彈出視窗 Modal -->
    <div id="statsModal" class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-white">📊 練習成果統計</h3>
                <button id="closeStatsModal" class="text-slate-400 hover:text-white text-xl font-bold px-2">✕</button>
            </div>

            <div class="mb-4">
                <label class="block text-xs text-slate-400 mb-1">學生資訊（匯出圖片時顯示）</label>
                <input type="text" id="studentName" placeholder="請輸入班級、座號、姓名（選填）" class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-4 gap-2 text-center mb-4">
                <div class="bg-slate-700/50 rounded-lg p-2.5">
                    <div class="text-xs text-slate-400">總題數</div>
                    <div class="text-xl font-bold text-blue-400 mt-0.5" id="totalCount">0</div>
                </div>
                <div class="bg-slate-700/50 rounded-lg p-2.5">
                    <div class="text-xs text-slate-400">正確</div>
                    <div class="text-xl font-bold text-emerald-400 mt-0.5" id="correctCount">0</div>
                </div>
                <div class="bg-slate-700/50 rounded-lg p-2.5">
                    <div class="text-xs text-slate-400">待加強</div>
                    <div class="text-xl font-bold text-amber-400 mt-0.5" id="wrongCount">0</div>
                </div>
                <div class="bg-slate-700/50 rounded-lg p-2.5">
                    <div class="text-xs text-slate-400">準確率</div>
                    <div class="text-xl font-bold text-yellow-400 mt-0.5" id="accuracy">0%</div>
                </div>
            </div>

            <div class="mb-4">
                <h4 class="text-xs font-bold text-slate-300 mb-1.5">📝 作答明細</h4>
                <div id="recordsList" class="max-h-48 overflow-y-auto bg-slate-900/70 border border-slate-700/60 rounded-lg p-2 text-xs">
                    <div class="text-slate-500 text-center py-4">尚無練習記錄</div>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="exportStats" class="flex-1 btn py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-bold shadow">📷 匯出成果圖片</button>
                <button id="resetStats" class="btn px-4 py-2 bg-slate-700 hover:bg-red-600/80 text-slate-200 hover:text-white rounded-lg text-sm">清空記錄</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 1. 狀態與設定管理 (State Management)
         */
        const State = {
            curveKey: null,
            t: null,               // 儲存正規化參數 t (0~1)，確保視窗縮放時位置不跑掉
            userAngle: null,       // 使用者繪製的角度 (弧度)
            userLengthRatio: 0.22, // 使用者線段長度比例
            userColor: '#fbbf24',
            isDrawing: false,
            showingAnswer: false,
            answered: false,
            answerViewed: false,
            tolerance: 10,
            logicalWidth: 800,
            logicalHeight: 600,
            records: JSON.parse(localStorage.getItem('optics_normal_records') || '[]')
        };

        const ShapeNames = {
            circle: '圓形',
            ellipse: '橢圓',
            parabola_convex: '拋物面(凸)',
            parabola_concave: '拋物面(凹)',
            sine: '正弦波表面',
            square: '方形稜鏡',
            triangle: '三稜鏡',
            biconvex: '雙凸透鏡',
            biconcave: '雙凹透鏡'
        };

        /**
         * 2. 幾何與數值微分引擎 (Geometry & Numerical Differentiation Engine)
         * 只需定義 getPoint(t, w, h)，切線與法線由中央差分法自動精確求導！
         */
        const GeometryEngine = {
            // 取得迴避轉角頂點的安全隨機參數 t
            sampleValidT(curveKey) {
                const eps = 0.04; // 避開頂點的緩衝區
                const randRange = (min, max) => min + Math.random() * (max - min);

                if (curveKey === 'square') {
                    const side = Math.floor(Math.random() * 4);
                    return side * 0.25 + randRange(eps, 0.25 - eps);
                }
                if (curveKey === 'triangle') {
                    const side = Math.floor(Math.random() * 3);
                    const step = 1 / 3;
                    return side * step + randRange(eps, step - eps);
                }
                if (curveKey === 'biconvex') {
                    const side = Math.random() < 0.5 ? 0 : 0.5;
                    return side + randRange(eps, 0.5 - eps);
                }
                if (curveKey === 'biconcave') {
                    // 集中在左右兩個凹弧面上抽題，也可抽上下平面但避開轉角
                    const segments = [
                        [0.02, 0.08], // 上平面
                        [0.13, 0.47], // 右凹面
                        [0.52, 0.58], // 下平面
                        [0.63, 0.97]  // 左凹面
                    ];
                    // 提高左右凹弧面被抽中的權重
                    const weights = [0.1, 0.4, 0.1, 0.4];
                    let r = Math.random(), acc = 0, chosen = segments[1];
                    for (let i = 0; i < weights.length; i++) {
                        acc += weights[i];
                        if (r <= acc) { chosen = segments[i]; break; }
                    }
                    return randRange(chosen[0], chosen[1]);
                }
                // 一般開放或平滑封閉曲線
                return randRange(0.1, 0.9);
            },

            // 通用數值微分：計算參數 t 處的切線與法線角度
            getAngles(curveKey, t, w, h) {
                const dt = 0.0001;
                const t1 = Math.max(0, t - dt);
                const t2 = Math.min(1, t + dt);
                const p1 = this.shapes[curveKey].getPoint(t1, w, h);
                const p2 = this.shapes[curveKey].getPoint(t2, w, h);
                const tangentAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                const normalAngle = tangentAngle + Math.PI / 2;
                return { tangentAngle, normalAngle };
            },

            // 雙凹透鏡共用座標轉換輔助函式
            getBiconcavePath(w, h) {
                const cx = w / 2, cy = h / 2;
                const scale = (h * 0.68) / 450;
                const curvature = 2.4;
                const raw = [
                    { x: 603.69, y: 227.39 },
                    { x: 749.63, y: 225.89 },
                    { x: 700.04, y: 450.58, ctrl: true },
                    { x: 754.24, y: 674.20 },
                    { x: 608.30, y: 675.70 },
                    { x: 657.90, y: 451.01, ctrl: true }
                ];
                const origCx = (603.69 + 754.24) / 2;
                const origCy = (225.89 + 675.70) / 2;
                return raw.map(p => {
                    const px = p.ctrl ? origCx + (p.x - origCx) * (2 - curvature) : p.x;
                    return { x: cx + (px - origCx) * scale, y: cy + (p.y - origCy) * scale };
                });
            },

            shapes: {
                circle: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const r = Math.min(w, h) * 0.28;
                        const angle = t * Math.PI * 2;
                        return { x: w / 2 + r * Math.cos(angle), y: h / 2 + r * Math.sin(angle) };
                    },
                    draw(ctx, w, h) {
                        const r = Math.min(w, h) * 0.28;
                        ctx.beginPath();
                        ctx.arc(w / 2, h / 2, r, 0, Math.PI * 2);
                    }
                },
                ellipse: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const rx = w * 0.32, ry = h * 0.24;
                        const angle = t * Math.PI * 2;
                        return { x: w / 2 + rx * Math.cos(angle), y: h / 2 + ry * Math.sin(angle) };
                    },
                    draw(ctx, w, h) {
                        ctx.beginPath();
                        ctx.ellipse(w / 2, h / 2, w * 0.32, h * 0.24, 0, 0, Math.PI * 2);
                    }
                },
                parabola_convex: {
                    isClosed: false,
                    getPoint(t, w, h) {
                        const pw = w * 0.35, ph = h * 0.7;
                        const startX = w * 0.32, startY = h * 0.15;
                        const y = startY + t * ph;
                        const ny = (y - h / 2) / (ph / 2);
                        const x = startX + pw * (1 - ny * ny);
                        return { x, y };
                    },
                    draw(ctx, w, h) {
                        ctx.beginPath();
                        for (let i = 0; i <= 80; i++) {
                            const p = this.getPoint(i / 80, w, h);
                            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
                        }
                    }
                },
                parabola_concave: {
                    isClosed: false,
                    getPoint(t, w, h) {
                        const pw = w * 0.35, ph = h * 0.7;
                        const startX = w * 0.68, startY = h * 0.15;
                        const y = startY + t * ph;
                        const ny = (y - h / 2) / (ph / 2);
                        const x = startX - pw * (1 - ny * ny);
                        return { x, y };
                    },
                    draw(ctx, w, h) {
                        ctx.beginPath();
                        for (let i = 0; i <= 80; i++) {
                            const p = this.getPoint(i / 80, w, h);
                            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
                        }
                    }
                },
                sine: {
                    isClosed: false,
                    getPoint(t, w, h) {
                        const sw = w * 0.76, sh = h * 0.28;
                        return {
                            x: w * 0.12 + t * sw,
                            y: h / 2 + sh * Math.sin(t * Math.PI * 3)
                        };
                    },
                    draw(ctx, w, h) {
                        ctx.beginPath();
                        for (let i = 0; i <= 100; i++) {
                            const p = this.getPoint(i / 100, w, h);
                            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
                        }
                    }
                },
                square: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const size = Math.min(w, h) * 0.5;
                        const half = size / 2, cx = w / 2, cy = h / 2;
                        const d = t * size * 4;
                        if (d < size) return { x: cx - half + d, y: cy - half };
                        if (d < size * 2) return { x: cx + half, y: cy - half + (d - size) };
                        if (d < size * 3) return { x: cx + half - (d - size * 2), y: cy + half };
                        return { x: cx - half, y: cy + half - (d - size * 3) };
                    },
                    draw(ctx, w, h) {
                        const size = Math.min(w, h) * 0.5;
                        ctx.beginPath();
                        ctx.rect(w / 2 - size / 2, h / 2 - size / 2, size, size);
                    }
                },
                triangle: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const size = Math.min(w, h) * 0.56;
                        const cx = w / 2, cy = h / 2;
                        const triH = size * Math.sqrt(3) / 2;
                        const pts = [
                            { x: cx, y: cy - triH * 0.6 },
                            { x: cx + size / 2, y: cy + triH * 0.4 },
                            { x: cx - size / 2, y: cy + triH * 0.4 }
                        ];
                        const seg = Math.min(2, Math.floor(t * 3));
                        const localT = (t * 3) - seg;
                        const p1 = pts[seg], p2 = pts[(seg + 1) % 3];
                        return {
                            x: p1.x + localT * (p2.x - p1.x),
                            y: p1.y + localT * (p2.y - p1.y)
                        };
                    },
                    draw(ctx, w, h) {
                        const p0 = this.getPoint(0, w, h);
                        const p1 = this.getPoint(1 / 3, w, h);
                        const p2 = this.getPoint(2 / 3, w, h);
                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.closePath();
                    }
                },
                biconvex: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const cx = w / 2, cy = h / 2;
                        const r = h * 0.55;
                        const halfAngle = Math.PI / 4; // 45度圓弧
                        const offsetX = r * Math.cos(halfAngle);
                        if (t < 0.5) {
                            const tt = t * 2;
                            const angle = -halfAngle + tt * (2 * halfAngle);
                            return { x: cx - offsetX + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
                        } else {
                            const tt = (t - 0.5) * 2;
                            const angle = Math.PI - halfAngle + tt * (2 * halfAngle);
                            return { x: cx + offsetX + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
                        }
                    },
                    draw(ctx, w, h) {
                        const cx = w / 2, cy = h / 2;
                        const r = h * 0.55;
                        const halfAngle = Math.PI / 4;
                        const offsetX = r * Math.cos(halfAngle);
                        ctx.beginPath();
                        ctx.arc(cx - offsetX, cy, r, -halfAngle, halfAngle);
                        ctx.arc(cx + offsetX, cy, r, Math.PI - halfAngle, Math.PI + halfAngle);
                        ctx.closePath();
                    }
                },
                biconcave: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const path = GeometryEngine.getBiconcavePath(w, h);
                        const quad = (p0, p1, p2, tt) => {
                            const s = 1 - tt;
                            return {
                                x: s * s * p0.x + 2 * s * tt * p1.x + tt * tt * p2.x,
                                y: s * s * p0.y + 2 * s * tt * p1.y + tt * tt * p2.y
                            };
                        };
                        if (t < 0.1) {
                            const tt = t / 0.1;
                            return { x: path[0].x + (path[1].x - path[0].x) * tt, y: path[0].y + (path[1].y - path[0].y) * tt };
                        } else if (t < 0.5) {
                            return quad(path[1], path[2], path[3], (t - 0.1) / 0.4);
                        } else if (t < 0.6) {
                            const tt = (t - 0.5) / 0.1;
                            return { x: path[3].x + (path[4].x - path[3].x) * tt, y: path[3].y + (path[4].y - path[3].y) * tt };
                        } else {
                            return quad(path[4], path[5], path[0], (t - 0.6) / 0.4);
                        }
                    },
                    draw(ctx, w, h) {
                        const path = GeometryEngine.getBiconcavePath(w, h);
                        ctx.beginPath();
                        ctx.moveTo(path[0].x, path[0].y);
                        ctx.lineTo(path[1].x, path[1].y);
                        ctx.quadraticCurveTo(path[2].x, path[2].y, path[3].x, path[3].y);
                        ctx.lineTo(path[4].x, path[4].y);
                        ctx.quadraticCurveTo(path[5].x, path[5].y, path[0].x, path[0].y);
                        ctx.closePath();
                    }
                }
            }
        };

        /**
         * 3. 畫面渲染器 (Canvas Renderer)
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            const maxW = container.clientWidth - 16;
            const maxH = container.clientHeight - 16;
            const aspect = 4 / 3;

            let w = maxW, h = maxW / aspect;
            if (h > maxH) {
                h = maxH;
                w = maxH * aspect;
            }

            const dpr = window.devicePixelRatio || 1;
            State.logicalWidth = w;
            State.logicalHeight = h;

            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            render();
        }

        function render() {
            const w = State.logicalWidth;
            const h = State.logicalHeight;

            // 背景與格線
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
            ctx.lineWidth = 1;
            const grid = Math.max(w, h) / 22;
            for (let x = 0; x < w; x += grid) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
            }
            for (let y = 0; y < h; y += grid) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            if (!State.curveKey) {
                ctx.fillStyle = '#60a5fa';
                ctx.font = 'bold 20px "Noto Sans TC"';
                ctx.textAlign = 'center';
                ctx.fillText('👆 請點擊上方任一光學元件圖示開始練習', w / 2, h / 2);
                return;
            }

            // 繪製光學元件
            const shape = GeometryEngine.shapes[State.curveKey];
            shape.draw(ctx, w, h);
            if (shape.isClosed) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.08)'; // 玻璃透鏡質感
                ctx.fill();
            }
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 3;
            ctx.stroke();

            if (State.t === null) return;

            const target = shape.getPoint(State.t, w, h);
            const { tangentAngle, normalAngle } = GeometryEngine.getAngles(State.curveKey, State.t, w, h);
            const refLength = Math.min(w, h) * 0.26;

            // 顯示標準答案 (切線、法線、直角記號)
            if (State.showingAnswer) {
                // 繪製垂直直角記號 (Right-angle symbol)
                const sq = 14;
                const tx = Math.cos(tangentAngle) * sq, ty = Math.sin(tangentAngle) * sq;
                const nx = Math.cos(normalAngle) * sq, ny = Math.sin(normalAngle) * sq;
                ctx.beginPath();
                ctx.moveTo(target.x + tx, target.y + ty);
                ctx.lineTo(target.x + tx + nx, target.y + ty + ny);
                ctx.lineTo(target.x + nx, target.y + ny);
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 切線 (黃色虛線)
                ctx.beginPath();
                ctx.moveTo(target.x - refLength * Math.cos(tangentAngle), target.y - refLength * Math.sin(tangentAngle));
                ctx.lineTo(target.x + refLength * Math.cos(tangentAngle), target.y + refLength * Math.sin(tangentAngle));
                ctx.strokeStyle = '#eab308';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([7, 5]);
                ctx.stroke();

                // 法線 (紅色虛線)
                ctx.beginPath();
                ctx.moveTo(target.x - refLength * Math.cos(normalAngle), target.y - refLength * Math.sin(normalAngle));
                ctx.lineTo(target.x + refLength * Math.cos(normalAngle), target.y + refLength * Math.sin(normalAngle));
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.font = 'bold 15px "Noto Sans TC"';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#eab308';
                ctx.fillText('切線', target.x + refLength * Math.cos(tangentAngle) + 8, target.y + refLength * Math.sin(tangentAngle));
                ctx.fillStyle = '#ef4444';
                ctx.fillText('法線', target.x + refLength * Math.cos(normalAngle) + 8, target.y + refLength * Math.sin(normalAngle));
            }

            // 繪製使用者拉出的法線（含反向延伸輔助虛線）
            if (State.userAngle !== null) {
                const userLen = Math.min(w, h) * State.userLengthRatio;
                const endX = target.x + userLen * Math.cos(State.userAngle);
                const endY = target.y + userLen * Math.sin(State.userAngle);
                const oppX = target.x - userLen * 0.65 * Math.cos(State.userAngle);
                const oppY = target.y - userLen * 0.65 * Math.sin(State.userAngle);

                // 反向延伸虛線（幫助視覺對齊貫穿介面）
                ctx.beginPath();
                ctx.moveTo(target.x, target.y);
                ctx.lineTo(oppX, oppY);
                ctx.strokeStyle = State.userColor;
                ctx.globalAlpha = 0.45;
                ctx.lineWidth = 2.5;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1.0;

                // 主向實線與箭頭
                ctx.beginPath();
                ctx.moveTo(target.x, target.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = State.userColor;
                ctx.lineWidth = 3.5;
                ctx.stroke();

                const arrow = 14;
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - arrow * Math.cos(State.userAngle - Math.PI / 6), endY - arrow * Math.sin(State.userAngle - Math.PI / 6));
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - arrow * Math.cos(State.userAngle + Math.PI / 6), endY - arrow * Math.sin(State.userAngle + Math.PI / 6));
                ctx.stroke();
            }

            // 繪製紅點目標
            ctx.beginPath();
            ctx.arc(target.x, target.y, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        /**
         * 4. 互動邏輯與計分系統 (Controller)
         */
        function setFeedback(text, color = '#94a3b8') {
            const el = document.getElementById('feedback');
            el.textContent = text;
            el.style.color = color;
        }

        function generateNewPoint() {
            if (!State.curveKey) return;
            State.t = GeometryEngine.sampleValidT(State.curveKey);
            State.userAngle = null;
            State.userColor = '#fbbf24';
            State.showingAnswer = false;
            State.answered = false;
            State.answerViewed = false;
            render();
            setFeedback(`請從「${ShapeNames[State.curveKey]}」上的紅點拖曳畫出法線`, '#60a5fa');
        }

        function showAnswer() {
            if (!State.curveKey || State.t === null) return;
            State.showingAnswer = true;
            State.answerViewed = true; // 統一標記已看答案（包含按 Enter 鍵）
            render();
            if (!State.answered) {
                setFeedback('已顯示標準切線與法線（本題將不列入計分）', '#c084fc');
            }
        }

        function checkAnswer() {
            if (State.userAngle === null || State.t === null || State.answered) return;

            const { normalAngle } = GeometryEngine.getAngles(State.curveKey, State.t, State.logicalWidth, State.logicalHeight);
            let diff = Math.abs(State.userAngle - normalAngle) * 180 / Math.PI;
            diff = diff % 360;
            if (diff > 180) diff = 360 - diff;

            const error = Math.min(diff, Math.abs(180 - diff));
            const isCorrect = error <= State.tolerance;
            State.answered = true;

            if (!State.answerViewed) {
                if (isCorrect) {
                    State.userColor = '#10b981';
                    setFeedback(`✓ 正確！角度誤差僅 ${error.toFixed(1)}° (按空白鍵下一題)`, '#10b981');
                } else {
                    State.userColor = '#f59e0b';
                    State.showingAnswer = true; // 答錯時自動顯示正確法線供對照學習
                    setFeedback(`✗ 誤差 ${error.toFixed(1)}° (需 ≤ ${State.tolerance}°)，已顯示正確解答供對照`, '#f59e0b');
                }

                State.records.push({
                    shape: ShapeNames[State.curveKey],
                    correct: isCorrect,
                    error: error.toFixed(1),
                    tolerance: State.tolerance,
                    timestamp: new Date().toLocaleTimeString('zh-TW', { hour12: false })
                });
                saveAndRefreshStats();
            } else {
                State.userColor = '#94a3b8';
                setFeedback(`已查看過答案，本次練習誤差 ${error.toFixed(1)}°（不計分）`, '#94a3b8');
            }

            render();
        }

        // 統一使用 Pointer Events 處理滑鼠、觸控與觸控筆
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!State.curveKey || State.t === null) return;
            const pos = getPointerPos(e);
            const target = GeometryEngine.shapes[State.curveKey].getPoint(State.t, State.logicalWidth, State.logicalHeight);
            const dist = Math.hypot(pos.x - target.x, pos.y - target.y);

            if (dist < 45) {
                // 若該題已作答完畢，再次點擊紅點允許重畫體驗（不重複計分）
                if (State.answered) State.answerViewed = true;
                State.answered = false;
                State.isDrawing = true;
                State.userColor = '#fbbf24';
                canvas.setPointerCapture(e.pointerId);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!State.isDrawing || State.t === null) return;
            const pos = getPointerPos(e);
            const target = GeometryEngine.shapes[State.curveKey].getPoint(State.t, State.logicalWidth, State.logicalHeight);
            const dist = Math.hypot(pos.x - target.x, pos.y - target.y);

            if (dist > 10) {
                State.userAngle = Math.atan2(pos.y - target.y, pos.x - target.x);
                State.userLengthRatio = Math.min(0.42, Math.max(0.12, dist / Math.min(State.logicalWidth, State.logicalHeight)));
                render();
            }
        });

        function finishPointer(e) {
            if (!State.isDrawing) return;
            State.isDrawing = false;
            const pos = getPointerPos(e);
            const target = GeometryEngine.shapes[State.curveKey].getPoint(State.t, State.logicalWidth, State.logicalHeight);
            const dist = Math.hypot(pos.x - target.x, pos.y - target.y);

            // 避免誤觸：拉線距離需超過 25px 才判定為有效作答
            if (dist < 25) {
                State.userAngle = null;
                render();
                setFeedback('拉線距離太短，請從紅點向外拖曳長一點的線段', '#fbbf24');
                return;
            }
            checkAnswer();
        }

        canvas.addEventListener('pointerup', finishPointer);
        canvas.addEventListener('pointercancel', finishPointer);

        /**
         * 5. UI 綁定與統計匯出
         */
        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                State.curveKey = btn.dataset.curve;
                generateNewPoint();
            });
        });

        document.getElementById('toleranceDown').addEventListener('click', () => {
            if (State.tolerance > 3) {
                State.tolerance--;
                document.getElementById('toleranceValue').textContent = State.tolerance + '°';
            }
        });

        document.getElementById('toleranceUp').addEventListener('click', () => {
            if (State.tolerance < 15) {
                State.tolerance++;
                document.getElementById('toleranceValue').textContent = State.tolerance + '°';
            }
        });

        document.getElementById('newPoint').addEventListener('click', generateNewPoint);
        document.getElementById('showAnswer').addEventListener('click', showAnswer);

        const statsModal = document.getElementById('statsModal');
        document.getElementById('toggleStatsBtn').addEventListener('click', () => {
            saveAndRefreshStats();
            statsModal.classList.remove('hidden');
        });
        document.getElementById('closeStatsModal').addEventListener('click', () => {
            statsModal.classList.add('hidden');
        });
        statsModal.addEventListener('click', (e) => {
            if (e.target === statsModal) statsModal.classList.add('hidden');
        });

        document.getElementById('resetStats').addEventListener('click', () => {
            if (confirm('確定要清空所有練習統計記錄嗎？')) {
                State.records = [];
                saveAndRefreshStats();
            }
        });

        function saveAndRefreshStats() {
            localStorage.setItem('optics_normal_records', JSON.stringify(State.records));
            const total = State.records.length;
            const correct = State.records.filter(r => r.correct).length;
            const wrong = total - correct;
            const acc = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;

            document.getElementById('badgeCount').textContent = total;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('accuracy').textContent = acc + '%';

            const listEl = document.getElementById('recordsList');
            if (total === 0) {
                listEl.innerHTML = '<div class="text-slate-500 text-center py-4">尚無練習記錄</div>';
            } else {
                listEl.innerHTML = State.records.map((r, i) => `
                    <div class="flex items-center justify-between py-1.5 px-2 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="text-slate-500 w-5">${i + 1}.</span>
                            <span class="${r.correct ? 'text-emerald-400' : 'text-amber-400'} font-bold">${r.correct ? '✓' : '✗'}</span>
                            <span class="text-slate-200">${r.shape}</span>
                        </div>
                        <div class="flex items-center gap-3 text-slate-400">
                            <span>誤差 ${r.error}° (容差 ${r.tolerance}°)</span>
                            <span class="text-slate-500">${r.timestamp}</span>
                        </div>
                    </div>
                `).reverse().join('');
            }
        }

        // 匯出完整成果圖片
        document.getElementById('exportStats').addEventListener('click', () => {
            const total = State.records.length;
            const correct = State.records.filter(r => r.correct).length;
            const wrong = total - correct;
            const acc = total > 0 ? ((correct / total) * 100).toFixed(1) + '%' : '0%';
            const student = document.getElementById('studentName').value.trim();

            const rowHeight = 28;
            const listHeight = Math.max(80, total * rowHeight + 40);
            const outCanvas = document.createElement('canvas');
            outCanvas.width = 860;
            outCanvas.height = 380 + listHeight;
            const c = outCanvas.getContext('2d');

            c.fillStyle = '#0f172a';
            c.fillRect(0, 0, outCanvas.width, outCanvas.height);

            c.fillStyle = '#ffffff';
            c.font = 'bold 32px "Noto Sans TC", sans-serif';
            c.textAlign = 'center';
            c.fillText('光學法線練習 — 學習成果報告', 430, 55);

            const now = new Date();
            c.font = '16px "Noto Sans TC", sans-serif';
            c.fillStyle = '#94a3b8';
            const infoText = (student ? `學生：${student}  ｜  ` : '') + `匯出時間：${now.toLocaleDateString('zh-TW')} ${now.toLocaleTimeString('zh-TW')}`;
            c.fillText(infoText, 430, 90);

            const cards = [
                { label: '總題數', val: total, color: '#60a5fa', x: 130 },
                { label: '正確數', val: correct, color: '#34d399', x: 330 },
                { label: '待加強', val: wrong, color: '#fbbf24', x: 530 },
                { label: '準確率', val: acc, color: '#facc15', x: 730 }
            ];
            cards.forEach(card => {
                c.fillStyle = '#1e293b';
                c.fillRect(card.x - 85, 120, 170, 115);
                c.fillStyle = '#94a3b8';
                c.font = '16px "Noto Sans TC", sans-serif';
                c.fillText(card.label, card.x, 152);
                c.fillStyle = card.color;
                c.font = 'bold 36px "Noto Sans TC", sans-serif';
                c.fillText(String(card.val), card.x, 205);
            });

            c.fillStyle = '#e2e8f0';
            c.font = 'bold 20px "Noto Sans TC", sans-serif';
            c.textAlign = 'left';
            c.fillText('📝 作答明細記錄', 50, 285);

            if (total === 0) {
                c.fillStyle = '#64748b';
                c.font = '16px "Noto Sans TC", sans-serif';
                c.textAlign = 'center';
                c.fillText('尚無練習記錄', 430, 335);
            } else {
                c.font = '15px "Noto Sans TC", sans-serif';
                State.records.slice().reverse().forEach((r, idx) => {
                    const y = 325 + idx * rowHeight;
                    const num = total - idx;
                    c.fillStyle = '#64748b';
                    c.textAlign = 'right';
                    c.fillText(`${num}.`, 80, y);

                    c.fillStyle = r.correct ? '#34d399' : '#fbbf24';
                    c.textAlign = 'left';
                    c.fillText(r.correct ? '✓ 正確' : '✗ 待加強', 95, y);

                    c.fillStyle = '#f1f5f9';
                    c.fillText(r.shape, 190, y);

                    c.fillStyle = '#94a3b8';
                    c.fillText(`誤差 ${r.error}° (容差 ≤${r.tolerance}°)`, 370, y);

                    c.fillStyle = '#64748b';
                    c.fillText(r.timestamp, 650, y);
                });
            }

            outCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `光學法線練習_${student || '成果'}_${now.toISOString().slice(0, 10)}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return; // 輸入姓名時不觸發快捷鍵
            if (e.code === 'Space') {
                e.preventDefault();
                generateNewPoint();
            } else if (e.code === 'Enter') {
                e.preventDefault();
                showAnswer();
            }
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => {
            saveAndRefreshStats();
            resizeCanvas();
        });
    </script>
</body>
</html>
