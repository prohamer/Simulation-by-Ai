<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>光學法線練習 2.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; user-select: none; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #e2e8f0; overflow-x: hidden; }
        canvas { border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); cursor: crosshair; touch-action: none; background: #1e293b; }
        .btn { transition: all 0.15s ease; font-weight: 500; }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .shape-btn { width: 42px; height: 42px; border-radius: 8px; background: rgba(30, 41, 59, 0.8); border: 2px solid rgba(148, 163, 184, 0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; color: #cbd5e1; position: relative; }
        .shape-btn:hover { border-color: rgba(96, 165, 250, 0.6); background: rgba(59, 130, 246, 0.15); color: #fff; }
        .shape-btn.active { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border-color: #93c5fd; color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .shape-icon { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; }
        .laser-active { background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%) !important; border-color: #67e8f9 !important; color: #fff !important; box-shadow: 0 0 15px rgba(6, 182, 212, 0.55); }
        .launcher-active { background: linear-gradient(135deg, #ea580c 0%, #f97316 100%) !important; border-color: #fdba74 !important; color: #fff !important; box-shadow: 0 0 15px rgba(249, 115, 22, 0.55); }
        .control-panel { backdrop-filter: blur(16px); background: rgba(15, 23, 42, 0.92); border-bottom: 1px solid rgba(148, 163, 184, 0.15); }
        @media (max-width: 768px) { .shape-btn { width: 36px; height: 36px; } .shape-icon { width: 20px; height: 20px; } }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- 頂部控制列 -->
    <header class="control-panel z-30 px-3 py-2 flex-shrink-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-base md:text-lg font-bold text-blue-400 leading-tight">光學法線練習</h1>
                    <div class="text-xs md:text-sm font-medium mt-0.5"><span id="feedback" class="text-slate-400">請選擇上方幾何形狀開始練習</span></div>
                </div>
            </div>

            <!-- 形狀選擇器 -->
            <div class="flex flex-wrap gap-1.5 justify-center" id="shapeSelector">
                <button class="shape-btn" data-curve="circle" title="圓形"><svg class="shape-icon" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14"/></svg></button>
                <button class="shape-btn" data-curve="ellipse" title="橢圓"><svg class="shape-icon" viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="15" ry="10"/></svg></button>
                <button class="shape-btn" data-curve="parabola_convex" title="拋物面(凸)"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 12 6 Q 32 20 12 34"/></svg></button>
                <button class="shape-btn" data-curve="parabola_concave" title="拋物面(凹)"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 28 6 Q 8 20 28 34"/></svg></button>
                <button class="shape-btn" data-curve="sine" title="正弦波表面"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 3 20 Q 11 6 20 20 T 37 20"/></svg></button>
                <button class="shape-btn" data-curve="square" title="方形稜鏡"><svg class="shape-icon" viewBox="0 0 40 40"><rect x="9" y="9" width="22" height="22"/></svg></button>
                <button class="shape-btn" data-curve="triangle" title="三稜鏡"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 20 7 L 33 32 L 7 32 Z"/></svg></button>
                <button class="shape-btn" data-curve="biconvex" title="雙凸透鏡"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 20 6 Q 32 20 20 34 Q 8 20 20 6 Z"/></svg></button>
                <button class="shape-btn" data-curve="biconcave" title="雙凹透鏡"><svg class="shape-icon" viewBox="0 0 40 40"><path d="M 11 7 L 29 7 Q 22 20 29 33 L 11 33 Q 18 20 11 7 Z"/></svg></button>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex items-center gap-1.5 md:gap-2 flex-wrap">
                <!-- 雷射光筆輔助按鈕 -->
                <button id="laserToggleBtn" class="btn px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 rounded-lg text-xs md:text-sm font-bold flex items-center gap-1.5" title="開啟/關閉雷射光筆輔助 (按住按鈕或雷射筆才會發光)">
                    <svg class="w-4 h-4 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 4.5l5 5L7 22H2v-5L14.5 4.5z"/>
                        <path d="M12 7l5 5"/>
                        <path d="M18 2l4 4" stroke="#22d3ee"/>
                        <circle cx="20" cy="4" r="1" fill="#22d3ee"/>
                    </svg>
                    <span>雷射</span>
                </button>

                <!-- 發球機輔助按鈕 -->
                <button id="launcherToggleBtn" class="btn px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 rounded-lg text-xs md:text-sm font-bold flex items-center gap-1.5" title="開啟/關閉發球機輔助 (點擊發射按鈕射出球)">
                    <svg class="w-4 h-4 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="9" width="12" height="8" rx="2"/>
                        <path d="M14 11h4v4h-4z"/>
                        <circle cx="21" cy="13" r="2" fill="#fb923c" stroke="none"/>
                        <path d="M5 17l-2 4M11 17l2 4"/>
                    </svg>
                    <span>發球機</span>
                </button>

                <div class="flex items-center gap-1 bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-1" title="調整容許角度誤差 (3°~12°)">
                    <span class="text-xs text-slate-400 hidden sm:inline">容差</span>
                    <button id="toleranceDown" class="btn px-1.5 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">−</button>
                    <span id="toleranceValue" class="text-xs md:text-sm font-bold text-blue-400 min-w-[2.2rem] text-center">10°</span>
                    <button id="toleranceUp" class="btn px-1.5 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">+</button>
                </div>
                <button id="newPoint" class="btn px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs md:text-sm font-bold shadow" title="快捷鍵: Space">新題目</button>
                <button id="showAnswer" class="btn px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-lg text-xs md:text-sm font-bold shadow" title="快捷鍵: Enter">看答案</button>
                <button id="toggleStatsBtn" class="btn px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs md:text-sm font-bold shadow flex items-center gap-1">
                    <span>成果</span>
                    <span id="badgeCount" class="bg-emerald-800 text-emerald-200 px-1.5 py-0.2 rounded-full text-xs">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 畫布主區域 -->
    <main class="flex-1 flex items-center justify-center p-2 md:p-4 overflow-hidden relative" id="canvasContainer">
        <canvas id="canvas"></canvas>
    </main>

    <!-- 統計彈出視窗 Modal -->
    <div id="statsModal" class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-xl w-full p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-lg font-bold text-white">📊 練習成果統計</h3>
                <button id="closeStatsModal" class="text-slate-400 hover:text-white text-xl font-bold px-2">✕</button>
            </div>

            <div class="mb-3">
                <label class="block text-xs text-slate-400 mb-1">學生資訊（匯出證書時顯示）</label>
                <input type="text" id="studentName" placeholder="請輸入班級、座號、姓名（選填）" class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <!-- 各形狀通過次數一覽（圖示 + 數字） -->
            <div class="mb-3">
                <div class="text-xs text-slate-400 mb-1.5">各形狀過關次數</div>
                <div id="shapePassGrid" class="grid grid-cols-9 gap-1.5 bg-slate-900/70 border border-slate-700/60 rounded-lg p-2"></div>
            </div>

            <!-- 總計數據 -->
            <div class="grid grid-cols-4 gap-2 text-center mb-3">
                <div class="bg-slate-700/50 rounded-lg p-2">
                    <div class="text-xs text-slate-400">總題數</div>
                    <div class="text-xl font-bold text-blue-400 mt-0.5" id="totalCount">0</div>
                </div>
                <div class="bg-slate-700/50 rounded-lg p-2">
                    <div class="text-xs text-slate-400">正確</div>
                    <div class="text-xl font-bold text-emerald-400 mt-0.5" id="correctCount">0</div>
                </div>
                <div class="bg-slate-700/50 rounded-lg p-2">
                    <div class="text-xs text-slate-400">待加強</div>
                    <div class="text-xl font-bold text-amber-400 mt-0.5" id="wrongCount">0</div>
                </div>
                <div class="bg-slate-700/50 rounded-lg p-2">
                    <div class="text-xs text-slate-400">準確率</div>
                    <div class="text-xl font-bold text-yellow-400 mt-0.5" id="accuracy">0%</div>
                </div>
            </div>

            <div class="mb-4">
                <h4 class="text-xs font-bold text-slate-300 mb-1.5">📝 作答明細</h4>
                <div id="recordsList" class="max-h-40 overflow-y-auto bg-slate-900/70 border border-slate-700/60 rounded-lg p-2 text-xs">
                    <div class="text-slate-500 text-center py-4">尚無練習記錄</div>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="exportStats" class="flex-1 btn py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-bold shadow">📷 匯出成果證書</button>
                <button id="resetStats" class="btn px-4 py-2 bg-slate-700 hover:bg-red-600/80 text-slate-200 hover:text-white rounded-lg text-sm">清空記錄</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 1. 狀態與設定管理 (State Management)
         */
        const MAX_TOLERANCE = 12; // 角度容許值上限 12°
        const MIN_TOLERANCE = 3;

        const ShapeOrder = [
            'circle', 'ellipse', 'parabola_convex', 'parabola_concave',
            'sine', 'square', 'triangle', 'biconvex', 'biconcave'
        ];

        const ShapeNames = {
            circle: '圓形',
            ellipse: '橢圓',
            parabola_convex: '拋物面(凸)',
            parabola_concave: '拋物面(凹)',
            sine: '正弦波表面',
            square: '方形稜鏡',
            triangle: '三稜鏡',
            biconvex: '雙凸透鏡',
            biconcave: '雙凹透鏡'
        };

        const ShapeSVGs = {
            circle: '<circle cx="20" cy="20" r="14"/>',
            ellipse: '<ellipse cx="20" cy="20" rx="15" ry="10"/>',
            parabola_convex: '<path d="M 12 6 Q 32 20 12 34"/>',
            parabola_concave: '<path d="M 28 6 Q 8 20 28 34"/>',
            sine: '<path d="M 3 20 Q 11 6 20 20 T 37 20"/>',
            square: '<rect x="9" y="9" width="22" height="22"/>',
            triangle: '<path d="M 20 7 L 33 32 L 7 32 Z"/>',
            biconvex: '<path d="M 20 6 Q 32 20 20 34 Q 8 20 20 6 Z"/>',
            biconcave: '<path d="M 11 7 L 29 7 Q 22 20 29 33 L 11 33 Q 18 20 11 7 Z"/>'
        };

        const State = {
            curveKey: null,
            t: null,
            userAngle: null,
            userLengthRatio: 0.22,
            userColor: '#fbbf24',
            dragMode: null,        // 'normal' | 'tool_source' | 'target_pending' | 'target_move' | 'laser_hold_btn'
            dragStartPos: null,
            showingAnswer: false,
            answered: false,
            answerViewed: false,
            tolerance: 10,
            // 輔助工具狀態（雷射光筆 & 發球機共用位置與入射角度）
            laserEnabled: false,
            laserFiring: false,    // 雷射筆是否正在按住發光中（放開即滅，訓練空間工作記憶）
            launcherEnabled: false,
            laserSide: 1,          // 1 或 -1，代表法線外側方向
            laserIncidenceRad: 0,  // 相對於外側法線的隨機/手動入射角 (-85° ~ +85°)
            laserDistRatio: 0.28,  // 工具距離紅點的比例
            balls: [],             // 發球機飛行中的球陣列
            animFrameId: null,
            actionBtnRect: { x: 18, y: 18, w: 136, h: 42 }, // 畫布左上角互動按鈕區域
            logicalWidth: 800,
            logicalHeight: 600,
            records: JSON.parse(localStorage.getItem('optics_normal_records') || '[]')
        };

        /**
         * 2. 幾何與數值微分引擎 (Geometry & Numerical Differentiation Engine)
         */
        const GeometryEngine = {
            sampleValidT(curveKey) {
                const eps = 0.04;
                const randRange = (min, max) => min + Math.random() * (max - min);

                if (curveKey === 'square') {
                    const side = Math.floor(Math.random() * 4);
                    return side * 0.25 + randRange(eps, 0.25 - eps);
                }
                if (curveKey === 'triangle') {
                    const side = Math.floor(Math.random() * 3);
                    const step = 1 / 3;
                    return side * step + randRange(eps, step - eps);
                }
                if (curveKey === 'biconvex') {
                    const side = Math.random() < 0.5 ? 0 : 0.5;
                    return side + randRange(eps, 0.5 - eps);
                }
                if (curveKey === 'biconcave') {
                    const segments = [
                        [0.02, 0.08],
                        [0.13, 0.47],
                        [0.52, 0.58],
                        [0.63, 0.97]
                    ];
                    const weights = [0.1, 0.4, 0.1, 0.4];
                    let r = Math.random(), acc = 0, chosen = segments[1];
                    for (let i = 0; i < weights.length; i++) {
                        acc += weights[i];
                        if (r <= acc) { chosen = segments[i]; break; }
                    }
                    return randRange(chosen[0], chosen[1]);
                }
                return randRange(0.1, 0.9);
            },

            getAngles(curveKey, t, w, h) {
                const dt = 0.0001;
                const t1 = Math.max(0, t - dt);
                const t2 = Math.min(1, t + dt);
                const p1 = this.shapes[curveKey].getPoint(t1, w, h);
                const p2 = this.shapes[curveKey].getPoint(t2, w, h);
                const tangentAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                const normalAngle = tangentAngle + Math.PI / 2;
                return { tangentAngle, normalAngle };
            },

            getOutwardSide(curveKey, t, w, h) {
                const target = this.shapes[curveKey].getPoint(t, w, h);
                const { normalAngle } = this.getAngles(curveKey, t, w, h);
                const nx = Math.cos(normalAngle), ny = Math.sin(normalAngle);
                const vx = target.x - w / 2, vy = target.y - h / 2;
                if (this.shapes[curveKey].isClosed) {
                    return (nx * vx + ny * vy) >= 0 ? 1 : -1;
                }
                return (nx * vx + ny * vy) <= 0 ? 1 : -1;
            },

            findClosestT(curveKey, px, py, w, h) {
                const shape = this.shapes[curveKey];
                let bestT = State.t;
                let minDist = Infinity;
                const steps = 250;
                for (let i = 1; i < steps; i++) {
                    const candidateT = i / steps;
                    const pt = shape.getPoint(candidateT, w, h);
                    const d = Math.hypot(pt.x - px, pt.y - py);
                    if (d < minDist) {
                        minDist = d;
                        bestT = candidateT;
                    }
                }
                return bestT;
            },

            getBiconcavePath(w, h) {
                const cx = w / 2, cy = h / 2;
                const scale = (h * 0.68) / 450;
                const curvature = 2.4;
                const raw = [
                    { x: 603.69, y: 227.39 },
                    { x: 749.63, y: 225.89 },
                    { x: 700.04, y: 450.58, ctrl: true },
                    { x: 754.24, y: 674.20 },
                    { x: 608.30, y: 675.70 },
                    { x: 657.90, y: 451.01, ctrl: true }
                ];
                const origCx = (603.69 + 754.24) / 2;
                const origCy = (225.89 + 675.70) / 2;
                return raw.map(p => {
                    const px = p.ctrl ? origCx + (p.x - origCx) * (2 - curvature) : p.x;
                    return { x: cx + (px - origCx) * scale, y: cy + (p.y - origCy) * scale };
                });
            },

            drawMiniIcon(ctx, key, cx, cy, color) {
                ctx.save();
                ctx.translate(cx - 20, cy - 20);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();

                switch (key) {
                    case 'circle':
                        ctx.arc(20, 20, 12, 0, Math.PI * 2);
                        break;
                    case 'ellipse':
                        ctx.ellipse(20, 20, 14, 9, 0, 0, Math.PI * 2);
                        break;
                    case 'parabola_convex':
                        ctx.moveTo(13, 7);
                        ctx.quadraticCurveTo(30, 20, 13, 33);
                        break;
                    case 'parabola_concave':
                        ctx.moveTo(27, 7);
                        ctx.quadraticCurveTo(10, 20, 27, 33);
                        break;
                    case 'sine':
                        ctx.moveTo(4, 20);
                        ctx.quadraticCurveTo(12, 6, 20, 20);
                        ctx.quadraticCurveTo(28, 34, 36, 20);
                        break;
                    case 'square':
                        ctx.rect(9, 9, 22, 22);
                        break;
                    case 'triangle':
                        ctx.moveTo(20, 8);
                        ctx.lineTo(32, 31);
                        ctx.lineTo(8, 31);
                        ctx.closePath();
                        break;
                    case 'biconvex':
                        ctx.moveTo(20, 6);
                        ctx.quadraticCurveTo(31, 20, 20, 34);
                        ctx.quadraticCurveTo(9, 20, 20, 6);
                        ctx.closePath();
                        break;
                    case 'biconcave':
                        ctx.moveTo(11, 8);
                        ctx.lineTo(29, 8);
                        ctx.quadraticCurveTo(22, 20, 29, 32);
                        ctx.lineTo(11, 32);
                        ctx.quadraticCurveTo(18, 20, 11, 8);
                        ctx.closePath();
                        break;
                }
                ctx.stroke();
                ctx.restore();
            },

            shapes: {
                circle: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const r = Math.min(w, h) * 0.28;
                        const angle = t * Math.PI * 2;
                        return { x: w / 2 + r * Math.cos(angle), y: h / 2 + r * Math.sin(angle) };
                    },
                    draw(ctx, w, h) {
                        const r = Math.min(w, h) * 0.28;
                        ctx.beginPath();
                        ctx.arc(w / 2, h / 2, r, 0, Math.PI * 2);
                    }
                },
                ellipse: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const rx = w * 0.32, ry = h * 0.24;
                        const angle = t * Math.PI * 2;
                        return { x: w / 2 + rx * Math.cos(angle), y: h / 2 + ry * Math.sin(angle) };
                    },
                    draw(ctx, w, h) {
                        ctx.beginPath();
                        ctx.ellipse(w / 2, h / 2, w * 0.32, h * 0.24, 0, 0, Math.PI * 2);
                    }
                },
                parabola_convex: {
                    isClosed: false,
                    getPoint(t, w, h) {
                        const pw = w * 0.35, ph = h * 0.7;
                        const startX = w * 0.32, startY = h * 0.15;
                        const y = startY + t * ph;
                        const ny = (y - h / 2) / (ph / 2);
                        const x = startX + pw * (1 - ny * ny);
                        return { x, y };
                    },
                    draw(ctx, w, h) {
                        ctx.beginPath();
                        for (let i = 0; i <= 80; i++) {
                            const p = this.getPoint(i / 80, w, h);
                            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
                        }
                    }
                },
                parabola_concave: {
                    isClosed: false,
                    getPoint(t, w, h) {
                        const pw = w * 0.35, ph = h * 0.7;
                        const startX = w * 0.68, startY = h * 0.15;
                        const y = startY + t * ph;
                        const ny = (y - h / 2) / (ph / 2);
                        const x = startX - pw * (1 - ny * ny);
                        return { x, y };
                    },
                    draw(ctx, w, h) {
                        ctx.beginPath();
                        for (let i = 0; i <= 80; i++) {
                            const p = this.getPoint(i / 80, w, h);
                            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
                        }
                    }
                },
                sine: {
                    isClosed: false,
                    getPoint(t, w, h) {
                        const sw = w * 0.76, sh = h * 0.28;
                        return {
                            x: w * 0.12 + t * sw,
                            y: h / 2 + sh * Math.sin(t * Math.PI * 3)
                        };
                    },
                    draw(ctx, w, h) {
                        ctx.beginPath();
                        for (let i = 0; i <= 100; i++) {
                            const p = this.getPoint(i / 100, w, h);
                            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
                        }
                    }
                },
                square: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const size = Math.min(w, h) * 0.5;
                        const half = size / 2, cx = w / 2, cy = h / 2;
                        const d = t * size * 4;
                        if (d < size) return { x: cx - half + d, y: cy - half };
                        if (d < size * 2) return { x: cx + half, y: cy - half + (d - size) };
                        if (d < size * 3) return { x: cx + half - (d - size * 2), y: cy + half };
                        return { x: cx - half, y: cy + half - (d - size * 3) };
                    },
                    draw(ctx, w, h) {
                        const size = Math.min(w, h) * 0.5;
                        ctx.beginPath();
                        ctx.rect(w / 2 - size / 2, h / 2 - size / 2, size, size);
                    }
                },
                triangle: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const size = Math.min(w, h) * 0.56;
                        const cx = w / 2, cy = h / 2;
                        const triH = size * Math.sqrt(3) / 2;
                        const pts = [
                            { x: cx, y: cy - triH * 0.6 },
                            { x: cx + size / 2, y: cy + triH * 0.4 },
                            { x: cx - size / 2, y: cy + triH * 0.4 }
                        ];
                        const seg = Math.min(2, Math.floor(t * 3));
                        const localT = (t * 3) - seg;
                        const p1 = pts[seg], p2 = pts[(seg + 1) % 3];
                        return {
                            x: p1.x + localT * (p2.x - p1.x),
                            y: p1.y + localT * (p2.y - p1.y)
                        };
                    },
                    draw(ctx, w, h) {
                        const p0 = this.getPoint(0, w, h);
                        const p1 = this.getPoint(1 / 3, w, h);
                        const p2 = this.getPoint(2 / 3, w, h);
                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.closePath();
                    }
                },
                biconvex: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const cx = w / 2, cy = h / 2;
                        const r = h * 0.55;
                        const halfAngle = Math.PI / 4;
                        const offsetX = r * Math.cos(halfAngle);
                        if (t < 0.5) {
                            const tt = t * 2;
                            const angle = -halfAngle + tt * (2 * halfAngle);
                            return { x: cx - offsetX + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
                        } else {
                            const tt = (t - 0.5) * 2;
                            const angle = Math.PI - halfAngle + tt * (2 * halfAngle);
                            return { x: cx + offsetX + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
                        }
                    },
                    draw(ctx, w, h) {
                        const cx = w / 2, cy = h / 2;
                        const r = h * 0.55;
                        const halfAngle = Math.PI / 4;
                        const offsetX = r * Math.cos(halfAngle);
                        ctx.beginPath();
                        ctx.arc(cx - offsetX, cy, r, -halfAngle, halfAngle);
                        ctx.arc(cx + offsetX, cy, r, Math.PI - halfAngle, Math.PI + halfAngle);
                        ctx.closePath();
                    }
                },
                biconcave: {
                    isClosed: true,
                    getPoint(t, w, h) {
                        const path = GeometryEngine.getBiconcavePath(w, h);
                        const quad = (p0, p1, p2, tt) => {
                            const s = 1 - tt;
                            return {
                                x: s * s * p0.x + 2 * s * tt * p1.x + tt * tt * p2.x,
                                y: s * s * p0.y + 2 * s * tt * p1.y + tt * tt * p2.y
                            };
                        };
                        if (t < 0.1) {
                            const tt = t / 0.1;
                            return { x: path[0].x + (path[1].x - path[0].x) * tt, y: path[0].y + (path[1].y - path[0].y) * tt };
                        } else if (t < 0.5) {
                            return quad(path[1], path[2], path[3], (t - 0.1) / 0.4);
                        } else if (t < 0.6) {
                            const tt = (t - 0.5) / 0.1;
                            return { x: path[3].x + (path[4].x - path[3].x) * tt, y: path[3].y + (path[4].y - path[3].y) * tt };
                        } else {
                            return quad(path[4], path[5], path[0], (t - 0.6) / 0.4);
                        }
                    },
                    draw(ctx, w, h) {
                        const path = GeometryEngine.getBiconcavePath(w, h);
                        ctx.beginPath();
                        ctx.moveTo(path[0].x, path[0].y);
                        ctx.lineTo(path[1].x, path[1].y);
                        ctx.quadraticCurveTo(path[2].x, path[2].y, path[3].x, path[3].y);
                        ctx.lineTo(path[4].x, path[4].y);
                        ctx.quadraticCurveTo(path[5].x, path[5].y, path[0].x, path[0].y);
                        ctx.closePath();
                    }
                }
            }
        };

        /**
         * 3. 雷射光筆與發球機輔助系統 (Laser & Ball Launcher System)
         */
        function randomizeToolPosition() {
            if (!State.curveKey || State.t === null) return;
            State.laserSide = GeometryEngine.getOutwardSide(State.curveKey, State.t, State.logicalWidth, State.logicalHeight);
            // 隨機 0° ~ 60° 入射角
            const deg = Math.random() * 60;
            const sign = Math.random() < 0.5 ? 1 : -1;
            State.laserIncidenceRad = sign * (deg * Math.PI / 180);
            State.laserDistRatio = 0.27;
            State.balls = [];
            State.laserFiring = false;
        }

        function getToolPositions(target, normalAngle, w, h) {
            const outwardNormal = State.laserSide === 1 ? normalAngle : normalAngle + Math.PI;
            const dist = Math.min(w, h) * State.laserDistRatio;
            const srcAngle = outwardNormal + State.laserIncidenceRad;
            const reflAngle = outwardNormal - State.laserIncidenceRad;

            const srcPos = {
                x: target.x + dist * Math.cos(srcAngle),
                y: target.y + dist * Math.sin(srcAngle)
            };
            const reflPos = {
                x: target.x + dist * 1.25 * Math.cos(reflAngle),
                y: target.y + dist * 1.25 * Math.sin(reflAngle)
            };
            return { srcPos, reflPos, srcAngle, reflAngle, outwardNormal };
        }

        function fireBall() {
            if (!State.launcherEnabled || !State.curveKey || State.t === null) return;
            State.balls.push({
                progress: 0,
                trail: []
            });
            startBallAnimation();
        }

        function startBallAnimation() {
            if (State.animFrameId) return;
            function step() {
                if (!State.launcherEnabled || State.balls.length === 0) {
                    State.animFrameId = null;
                    render();
                    return;
                }
                const w = State.logicalWidth, h = State.logicalHeight;
                const target = GeometryEngine.shapes[State.curveKey].getPoint(State.t, w, h);
                const { normalAngle } = GeometryEngine.getAngles(State.curveKey, State.t, w, h);
                const { srcPos, reflPos } = getToolPositions(target, normalAngle, w, h);

                State.balls.forEach(b => {
                    const prevP = b.progress;
                    b.progress += 0.028;

                    let bx, by;
                    if (b.progress <= 1) {
                        bx = srcPos.x + (target.x - srcPos.x) * b.progress;
                        by = srcPos.y + (target.y - srcPos.y) * b.progress;
                    } else {
                        if (prevP < 1) b.trail.push({ x: target.x, y: target.y });
                        const u = (b.progress - 1) / 1.25;
                        bx = target.x + (reflPos.x - target.x) * u;
                        by = target.y + (reflPos.y - target.y) * u;
                    }
                    b.x = bx;
                    b.y = by;
                    b.trail.push({ x: bx, y: by });
                    if (b.trail.length > 28) b.trail.shift();
                });

                State.balls = State.balls.filter(b => b.progress <= 2.35);
                render();

                if (State.balls.length > 0) {
                    State.animFrameId = requestAnimationFrame(step);
                } else {
                    State.animFrameId = null;
                }
            }
            State.animFrameId = requestAnimationFrame(step);
        }

        // 繪製雷射光筆（僅在 State.laserFiring === true 按住時才射出光束！）
        function drawLaserRayAndPointer(ctx, target, normalAngle, w, h) {
            const { srcPos, reflPos, srcAngle, reflAngle } = getToolPositions(target, normalAngle, w, h);

            ctx.save();

            if (State.laserFiring) {
                // 按住發光狀態：顯示完整入射光與反射光束
                ctx.shadowColor = '#22d3ee';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(srcPos.x, srcPos.y);
                ctx.lineTo(target.x, target.y);
                ctx.strokeStyle = '#22d3ee';
                ctx.lineWidth = 3.2;
                ctx.stroke();

                const midInX = (srcPos.x + target.x) / 2;
                const midInY = (srcPos.y + target.y) / 2;
                const inDir = srcAngle + Math.PI;
                const arr = 10;
                ctx.beginPath();
                ctx.moveTo(midInX + arr * 0.5 * Math.cos(inDir), midInY + arr * 0.5 * Math.sin(inDir));
                ctx.lineTo(midInX - arr * Math.cos(inDir - Math.PI / 6), midInY - arr * Math.sin(inDir - Math.PI / 6));
                ctx.moveTo(midInX + arr * 0.5 * Math.cos(inDir), midInY + arr * 0.5 * Math.sin(inDir));
                ctx.lineTo(midInX - arr * Math.cos(inDir + Math.PI / 6), midInY - arr * Math.sin(inDir + Math.PI / 6));
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(target.x, target.y);
                ctx.lineTo(reflPos.x, reflPos.y);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(reflPos.x, reflPos.y);
                ctx.lineTo(reflPos.x - 12 * Math.cos(reflAngle - Math.PI / 6), reflPos.y - 12 * Math.sin(reflAngle - Math.PI / 6));
                ctx.moveTo(reflPos.x, reflPos.y);
                ctx.lineTo(reflPos.x - 12 * Math.cos(reflAngle + Math.PI / 6), reflPos.y - 12 * Math.sin(reflAngle + Math.PI / 6));
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.font = 'bold 13px "Noto Sans TC"';
                ctx.fillStyle = '#7dd3fc';
                ctx.textAlign = 'center';
                ctx.fillText('反射光', reflPos.x, reflPos.y - 10);
            } else {
                // 未按住時：只顯示筆頭前方的短瞄準虛線，不顯示光束，訓練學生視覺記憶
                const aimX = srcPos.x + (target.x - srcPos.x) * 0.3;
                const aimY = srcPos.y + (target.y - srcPos.y) * 0.3;
                ctx.beginPath();
                ctx.moveTo(srcPos.x, srcPos.y);
                ctx.lineTo(aimX, aimY);
                ctx.strokeStyle = 'rgba(34, 211, 238, 0.4)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 繪製雷射筆機身
            ctx.save();
            ctx.translate(srcPos.x, srcPos.y);
            ctx.rotate(srcAngle);
            const bodyLen = 40, bodyW = 13;

            ctx.fillStyle = '#334155';
            ctx.strokeStyle = State.laserFiring ? '#22d3ee' : '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(0, -bodyW / 2, bodyLen, bodyW, 4);
            ctx.fill();
            ctx.stroke();

            // 筆頭發光孔
            ctx.fillStyle = State.laserFiring ? '#22d3ee' : '#475569';
            ctx.fillRect(0, -bodyW / 2 + 2, 6, bodyW - 4);

            // 筆身按壓開關鈕（按住時變亮綠色/青色）
            ctx.fillStyle = State.laserFiring ? '#22d3ee' : '#f43f5e';
            ctx.beginPath();
            ctx.arc(18, 0, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.font = 'bold 13px "Noto Sans TC"';
            ctx.fillStyle = State.laserFiring ? '#22d3ee' : '#67e8f9';
            ctx.textAlign = 'center';
            ctx.fillText('雷射筆(按住發光/可拖曳)', srcPos.x, srcPos.y - 20);

            // 在畫布左上角繪製「🔦 按住發光」瞬時按鈕
            const btn = State.actionBtnRect;
            ctx.save();
            if (State.laserFiring) {
                ctx.shadowColor = 'rgba(34, 211, 238, 0.75)';
                ctx.shadowBlur = 16;
                ctx.fillStyle = '#06b6d4';
                ctx.strokeStyle = '#cffafe';
            } else {
                ctx.shadowColor = 'rgba(8, 145, 178, 0.4)';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#0e7490';
                ctx.strokeStyle = '#67e8f9';
            }
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 10);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px "Noto Sans TC"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(State.laserFiring ? '⚡ 發光中...' : '🔦 按住發光', btn.x + btn.w / 2, btn.y + btn.h / 2);
            ctx.restore();

            ctx.restore();
        }

        // 繪製發球機、飛行球體與畫布上的「發射球」按鈕
        function drawLauncherAndBalls(ctx, target, normalAngle, w, h) {
            const { srcPos, srcAngle } = getToolPositions(target, normalAngle, w, h);

            ctx.save();

            const aimX = srcPos.x + (target.x - srcPos.x) * 0.35;
            const aimY = srcPos.y + (target.y - srcPos.y) * 0.35;
            ctx.beginPath();
            ctx.moveTo(srcPos.x, srcPos.y);
            ctx.lineTo(aimX, aimY);
            ctx.strokeStyle = 'rgba(251, 146, 60, 0.45)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            State.balls.forEach(b => {
                if (b.trail.length > 1) {
                    for (let i = 1; i < b.trail.length; i++) {
                        const alpha = (i / b.trail.length) * 0.65;
                        ctx.beginPath();
                        ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y);
                        ctx.lineTo(b.trail[i].x, b.trail[i].y);
                        ctx.strokeStyle = `rgba(251, 191, 36, ${alpha})`;
                        ctx.lineWidth = (i / b.trail.length) * 6;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }
                }
                if (Math.abs(b.progress - 1.0) < 0.08) {
                    ctx.beginPath();
                    ctx.arc(target.x, target.y, 18, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(253, 224, 71, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                if (b.x !== undefined) {
                    ctx.save();
                    ctx.shadowColor = '#f59e0b';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 7.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#fde047';
                    ctx.fill();
                    ctx.strokeStyle = '#ea580c';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                }
            });

            ctx.save();
            ctx.translate(srcPos.x, srcPos.y);
            ctx.rotate(srcAngle);

            ctx.fillStyle = '#475569';
            ctx.strokeStyle = '#fb923c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(-4, -9, 26, 18, 3);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#f97316';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.roundRect(14, -14, 30, 28, 7);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(29, 0, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fca5a5';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();

            ctx.font = 'bold 13px "Noto Sans TC"';
            ctx.fillStyle = '#fdba74';
            ctx.textAlign = 'center';
            ctx.fillText('發球機(可拖曳/點擊發射)', srcPos.x, srcPos.y - 22);

            const btn = State.actionBtnRect;
            ctx.save();
            ctx.shadowColor = 'rgba(234, 88, 12, 0.45)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#ea580c';
            ctx.strokeStyle = '#fdba74';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 10);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px "Noto Sans TC"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎯 發射球', btn.x + btn.w / 2, btn.y + btn.h / 2);
            ctx.restore();

            ctx.restore();
        }

        /**
         * 4. 畫面渲染器 (Canvas Renderer)
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            const maxW = container.clientWidth - 16;
            const maxH = container.clientHeight - 16;
            const aspect = 4 / 3;

            let w = maxW, h = maxW / aspect;
            if (h > maxH) {
                h = maxH;
                w = maxH * aspect;
            }

            const dpr = window.devicePixelRatio || 1;
            State.logicalWidth = w;
            State.logicalHeight = h;

            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            render();
        }

        function render() {
            const w = State.logicalWidth;
            const h = State.logicalHeight;

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
            ctx.lineWidth = 1;
            const grid = Math.max(w, h) / 22;
            for (let x = 0; x < w; x += grid) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
            }
            for (let y = 0; y < h; y += grid) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            if (!State.curveKey) {
                ctx.fillStyle = '#60a5fa';
                ctx.font = 'bold 20px "Noto Sans TC"';
                ctx.textAlign = 'center';
                ctx.fillText('👆 請點擊上方任一光學元件圖示開始練習', w / 2, h / 2);
                return;
            }

            const shape = GeometryEngine.shapes[State.curveKey];
            shape.draw(ctx, w, h);
            if (shape.isClosed) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
                ctx.fill();
            }
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 3;
            ctx.stroke();

            if (State.t === null) return;

            const target = shape.getPoint(State.t, w, h);
            const { tangentAngle, normalAngle } = GeometryEngine.getAngles(State.curveKey, State.t, w, h);
            const refLength = Math.min(w, h) * 0.26;

            // 繪製雷射光筆或發球機輔助
            if (State.laserEnabled) {
                drawLaserRayAndPointer(ctx, target, normalAngle, w, h);
            }
            if (State.launcherEnabled) {
                drawLauncherAndBalls(ctx, target, normalAngle, w, h);
            }

            if (State.showingAnswer) {
                const sq = 14;
                const tx = Math.cos(tangentAngle) * sq, ty = Math.sin(tangentAngle) * sq;
                const nx = Math.cos(normalAngle) * sq, ny = Math.sin(normalAngle) * sq;
                ctx.beginPath();
                ctx.moveTo(target.x + tx, target.y + ty);
                ctx.lineTo(target.x + tx + nx, target.y + ty + ny);
                ctx.lineTo(target.x + nx, target.y + ny);
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(target.x - refLength * Math.cos(tangentAngle), target.y - refLength * Math.sin(tangentAngle));
                ctx.lineTo(target.x + refLength * Math.cos(tangentAngle), target.y + refLength * Math.sin(tangentAngle));
                ctx.strokeStyle = '#eab308';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([7, 5]);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(target.x - refLength * Math.cos(normalAngle), target.y - refLength * Math.sin(normalAngle));
                ctx.lineTo(target.x + refLength * Math.cos(normalAngle), target.y + refLength * Math.sin(normalAngle));
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.font = 'bold 15px "Noto Sans TC"';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#eab308';
                ctx.fillText('切線', target.x + refLength * Math.cos(tangentAngle) + 8, target.y + refLength * Math.sin(tangentAngle));
                ctx.fillStyle = '#ef4444';
                ctx.fillText('法線', target.x + refLength * Math.cos(normalAngle) + 8, target.y + refLength * Math.sin(normalAngle));
            }

            if (State.userAngle !== null) {
                const userLen = Math.min(w, h) * State.userLengthRatio;
                const endX = target.x + userLen * Math.cos(State.userAngle);
                const endY = target.y + userLen * Math.sin(State.userAngle);
                const oppX = target.x - userLen * 0.65 * Math.cos(State.userAngle);
                const oppY = target.y - userLen * 0.65 * Math.sin(State.userAngle);

                ctx.beginPath();
                ctx.moveTo(target.x, target.y);
                ctx.lineTo(oppX, oppY);
                ctx.strokeStyle = State.userColor;
                ctx.globalAlpha = 0.45;
                ctx.lineWidth = 2.5;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1.0;

                ctx.beginPath();
                ctx.moveTo(target.x, target.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = State.userColor;
                ctx.lineWidth = 3.5;
                ctx.stroke();

                const arrow = 14;
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - arrow * Math.cos(State.userAngle - Math.PI / 6), endY - arrow * Math.sin(State.userAngle - Math.PI / 6));
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - arrow * Math.cos(State.userAngle + Math.PI / 6), endY - arrow * Math.sin(State.userAngle + Math.PI / 6));
                ctx.stroke();
            }

            // 繪製紅點（入射點）
            ctx.beginPath();
            ctx.arc(target.x, target.y, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        /**
         * 5. 互動邏輯與計分系統 (Controller)
         */
        function setFeedback(text, color = '#94a3b8') {
            const el = document.getElementById('feedback');
            el.textContent = text;
            el.style.color = color;
        }

        function generateNewPoint() {
            if (!State.curveKey) return;
            State.t = GeometryEngine.sampleValidT(State.curveKey);
            State.userAngle = null;
            State.userColor = '#fbbf24';
            State.showingAnswer = false;
            State.answered = false;
            State.answerViewed = false;
            randomizeToolPosition();
            render();
            if (State.launcherEnabled) {
                fireBall();
                setFeedback(`已發射球！可按左上角「🎯 發射球」重發，或拖曳發球機與紅點`, '#fb923c');
            } else if (State.laserEnabled) {
                setFeedback(`按住「🔦 按住發光」或「雷射筆」觀察光路，放開熄滅後憑記憶畫出法線`, '#38bdf8');
            } else {
                setFeedback(`請從「${ShapeNames[State.curveKey]}」上的紅點拖曳畫出法線`, '#60a5fa');
            }
        }

        function showAnswer() {
            if (!State.curveKey || State.t === null) return;
            State.showingAnswer = true;
            State.answerViewed = true;
            render();
            if (!State.answered) {
                setFeedback('已顯示標準切線與法線（本題將不列入計分）', '#c084fc');
            }
        }

        function checkAnswer() {
            if (State.userAngle === null || State.t === null || State.answered) return;

            const { normalAngle } = GeometryEngine.getAngles(State.curveKey, State.t, State.logicalWidth, State.logicalHeight);
            let diff = Math.abs(State.userAngle - normalAngle) * 180 / Math.PI;
            diff = diff % 360;
            if (diff > 180) diff = 360 - diff;

            const error = Math.min(diff, Math.abs(180 - diff));
            const isCorrect = error <= State.tolerance;
            State.answered = true;

            if (!State.answerViewed) {
                if (isCorrect) {
                    State.userColor = '#10b981';
                    setFeedback(`✓ 正確！角度誤差僅 ${error.toFixed(1)}° (按空白鍵下一題)`, '#10b981');
                } else {
                    State.userColor = '#f59e0b';
                    State.showingAnswer = true;
                    setFeedback(`✗ 誤差 ${error.toFixed(1)}° (需 ≤ ${State.tolerance}°)，已顯示正確解答供對照`, '#f59e0b');
                }

                State.records.push({
                    shapeKey: State.curveKey,
                    shape: ShapeNames[State.curveKey],
                    correct: isCorrect,
                    error: error.toFixed(1),
                    tolerance: State.tolerance,
                    timestamp: new Date().toLocaleTimeString('zh-TW', { hour12: false })
                });
                saveAndRefreshStats();
            } else {
                State.userColor = '#94a3b8';
                setFeedback(`已查看過答案，本次練習誤差 ${error.toFixed(1)}°（不計分）`, '#94a3b8');
            }

            render();
        }

        function getShapePassCounts() {
            const counts = {};
            ShapeOrder.forEach(k => counts[k] = 0);
            State.records.forEach(r => {
                if (!r.correct) return;
                if (r.shapeKey && counts[r.shapeKey] !== undefined) {
                    counts[r.shapeKey]++;
                } else {
                    const foundKey = ShapeOrder.find(k => ShapeNames[k] === r.shape);
                    if (foundKey) counts[foundKey]++;
                }
            });
            return counts;
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function normalizeAngleDiff(angle, ref) {
            let d = (angle - ref) % (Math.PI * 2);
            if (d > Math.PI) d -= Math.PI * 2;
            if (d < -Math.PI) d += Math.PI * 2;
            return d;
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!State.curveKey || State.t === null) return;
            const pos = getPointerPos(e);
            const w = State.logicalWidth, h = State.logicalHeight;
            const target = GeometryEngine.shapes[State.curveKey].getPoint(State.t, w, h);
            const { normalAngle } = GeometryEngine.getAngles(State.curveKey, State.t, w, h);

            // 1. 優先檢測是否點擊了畫布左上角的互動按鈕（🔦 按住發光 / 🎯 發射球）
            if (State.laserEnabled || State.launcherEnabled) {
                const b = State.actionBtnRect;
                if (pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) {
                    if (State.launcherEnabled) {
                        fireBall();
                    } else if (State.laserEnabled) {
                        State.laserFiring = true;
                        State.dragMode = 'laser_hold_btn';
                        canvas.setPointerCapture(e.pointerId);
                        render();
                    }
                    return;
                }
            }

            // 2. 檢測是否點擊在「雷射筆 / 發球機」機身上
            if (State.laserEnabled || State.launcherEnabled) {
                const { srcPos, srcAngle } = getToolPositions(target, normalAngle, w, h);
                const bodyCenter = {
                    x: srcPos.x + 20 * Math.cos(srcAngle),
                    y: srcPos.y + 20 * Math.sin(srcAngle)
                };
                if (Math.hypot(pos.x - srcPos.x, pos.y - srcPos.y) < 34 || Math.hypot(pos.x - bodyCenter.x, pos.y - bodyCenter.y) < 34) {
                    State.dragStartPos = pos;
                    State.dragMode = 'tool_source';
                    // 按住雷射筆機身時，同步點亮雷射光束，放開手即熄滅
                    if (State.laserEnabled) {
                        State.laserFiring = true;
                        render();
                    }
                    canvas.setPointerCapture(e.pointerId);
                    return;
                }
            }

            // 3. 檢測是否點擊在「紅點（入射點）」上
            const distToTarget = Math.hypot(pos.x - target.x, pos.y - target.y);
            if (distToTarget < 42) {
                State.dragStartPos = pos;
                State.dragMode = (State.laserEnabled || State.launcherEnabled) ? 'target_pending' : 'normal';
                canvas.setPointerCapture(e.pointerId);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!State.dragMode || State.t === null) return;
            if (State.dragMode === 'laser_hold_btn') return;

            const pos = getPointerPos(e);
            const w = State.logicalWidth, h = State.logicalHeight;
            const target = GeometryEngine.shapes[State.curveKey].getPoint(State.t, w, h);
            const { tangentAngle, normalAngle } = GeometryEngine.getAngles(State.curveKey, State.t, w, h);

            // A. 拖曳雷射筆或發球機：動態調整位置與入射角度
            if (State.dragMode === 'tool_source') {
                const dx = pos.x - target.x, dy = pos.y - target.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 25) {
                    const pointerAngle = Math.atan2(dy, dx);
                    const outwardNormal = State.laserSide === 1 ? normalAngle : normalAngle + Math.PI;
                    let relAngle = normalizeAngleDiff(pointerAngle, outwardNormal);

                    if (Math.abs(relAngle) > Math.PI * 0.55) {
                        State.laserSide *= -1;
                        const newOutward = State.laserSide === 1 ? normalAngle : normalAngle + Math.PI;
                        relAngle = normalizeAngleDiff(pointerAngle, newOutward);
                    }
                    const maxRad = 85 * Math.PI / 180;
                    State.laserIncidenceRad = Math.max(-maxRad, Math.min(maxRad, relAngle));
                    State.laserDistRatio = Math.min(0.42, Math.max(0.15, dist / Math.min(w, h)));
                    render();
                }
                return;
            }

            // B. 判斷從紅點出發的手勢：沿切線滑動 = 移動紅點；離開曲線向外拉 = 畫法線
            if (State.dragMode === 'target_pending') {
                const moveDist = Math.hypot(pos.x - State.dragStartPos.x, pos.y - State.dragStartPos.y);
                if (moveDist > 12) {
                    const moveAngle = Math.atan2(pos.y - target.y, pos.x - target.x);
                    const cosTangent = Math.abs(Math.cos(moveAngle - tangentAngle));
                    if (cosTangent > 0.78) {
                        State.dragMode = 'target_move';
                    } else {
                        if (State.answered) State.answerViewed = true;
                        State.answered = false;
                        State.userColor = '#fbbf24';
                        State.dragMode = 'normal';
                    }
                }
                return;
            }

            // C. 沿曲線拖曳紅點（入射點位置）
            if (State.dragMode === 'target_move') {
                State.t = GeometryEngine.findClosestT(State.curveKey, pos.x, pos.y, w, h);
                State.userAngle = null;
                State.answered = false;
                State.showingAnswer = false;
                render();
                return;
            }

            // D. 拖曳繪製法線
            if (State.dragMode === 'normal') {
                if (State.answered) {
                    State.answerViewed = true;
                    State.answered = false;
                    State.userColor = '#fbbf24';
                }
                const dist = Math.hypot(pos.x - target.x, pos.y - target.y);
                if (dist > 10) {
                    State.userAngle = Math.atan2(pos.y - target.y, pos.x - target.x);
                    State.userLengthRatio = Math.min(0.42, Math.max(0.12, dist / Math.min(w, h)));
                    render();
                }
            }
        });

        function finishPointer(e) {
            if (!State.dragMode) return;
            const mode = State.dragMode;
            const pos = getPointerPos(e);
            State.dragMode = null;

            // 放開左上角發光鈕，立即關閉雷射光束
            if (mode === 'laser_hold_btn') {
                State.laserFiring = false;
                render();
                setFeedback('雷射已熄滅，請回想剛剛的光路對稱關係，從紅點向外拉出法線', '#38bdf8');
                return;
            }

            if (mode === 'normal') {
                const target = GeometryEngine.shapes[State.curveKey].getPoint(State.t, State.logicalWidth, State.logicalHeight);
                const dist = Math.hypot(pos.x - target.x, pos.y - target.y);

                if (dist < 25) {
                    State.userAngle = null;
                    render();
                    setFeedback('拉線距離太短，請從紅點向外拖曳長一點的線段', '#fbbf24');
                    return;
                }
                checkAnswer();
            } else if (mode === 'tool_source') {
                // 放開雷射筆機身時，立即熄滅光束
                if (State.laserEnabled) {
                    State.laserFiring = false;
                    render();
                }
                const moveDist = State.dragStartPos ? Math.hypot(pos.x - State.dragStartPos.x, pos.y - State.dragStartPos.y) : 99;
                if (State.launcherEnabled && moveDist < 8) {
                    fireBall();
                    return;
                }
                const deg = Math.abs(State.laserIncidenceRad * 180 / Math.PI).toFixed(0);
                if (State.launcherEnabled) {
                    setFeedback(`目前發球機入射角約 ${deg}°，可從紅點向外拖曳畫出法線`, '#fb923c');
                } else {
                    setFeedback(`雷射已熄滅（目前入射角約 ${deg}°），請憑記憶從紅點向外拉出法線`, '#38bdf8');
                }
            } else if (mode === 'target_move') {
                const deg = Math.abs(State.laserIncidenceRad * 180 / Math.PI).toFixed(0);
                setFeedback(`已移動入射點（目前入射角約 ${deg}°），可從紅點向外拖曳畫出法線`, '#60a5fa');
            }
        }

        canvas.addEventListener('pointerup', finishPointer);
        canvas.addEventListener('pointercancel', finishPointer);

        /**
         * 6. UI 綁定與統計證書匯出
         */
        const laserToggleBtn = document.getElementById('laserToggleBtn');
        const launcherToggleBtn = document.getElementById('launcherToggleBtn');

        // 雷射光筆切換
        laserToggleBtn.addEventListener('click', () => {
            State.laserEnabled = !State.laserEnabled;
            State.laserFiring = false;
            if (State.laserEnabled) {
                State.launcherEnabled = false;
                State.balls = [];
                launcherToggleBtn.classList.remove('launcher-active');
                randomizeToolPosition();
                if (State.curveKey) {
                    const deg = Math.abs(State.laserIncidenceRad * 180 / Math.PI).toFixed(0);
                    setFeedback(`雷射已就緒（入射角 ${deg}°）！請按住左上角「🔦 按住發光」或按住雷射筆觀察光路`, '#38bdf8');
                }
            } else if (State.curveKey) {
                setFeedback(`已關閉雷射輔助，請從紅點拖曳畫出法線`, '#60a5fa');
            }
            laserToggleBtn.classList.toggle('laser-active', State.laserEnabled);
            render();
        });

        // 發球機切換
        launcherToggleBtn.addEventListener('click', () => {
            State.launcherEnabled = !State.launcherEnabled;
            State.laserFiring = false;
            if (State.launcherEnabled) {
                State.laserEnabled = false;
                laserToggleBtn.classList.remove('laser-active');
                randomizeToolPosition();
                if (State.curveKey) {
                    const deg = Math.abs(State.laserIncidenceRad * 180 / Math.PI).toFixed(0);
                    setFeedback(`發球機已開啟（入射角 ${deg}°）！點擊畫面左上角「🎯 發射球」或拖曳調整位置`, '#fb923c');
                    fireBall();
                }
            } else {
                State.balls = [];
                if (State.curveKey) {
                    setFeedback(`已關閉發球機輔助，請從紅點拖曳畫出法線`, '#60a5fa');
                }
            }
            launcherToggleBtn.classList.toggle('launcher-active', State.launcherEnabled);
            render();
        });

        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                State.curveKey = btn.dataset.curve;
                generateNewPoint();
            });
        });

        document.getElementById('toleranceDown').addEventListener('click', () => {
            if (State.tolerance > MIN_TOLERANCE) {
                State.tolerance--;
                document.getElementById('toleranceValue').textContent = State.tolerance + '°';
            }
        });

        document.getElementById('toleranceUp').addEventListener('click', () => {
            if (State.tolerance < MAX_TOLERANCE) {
                State.tolerance++;
                document.getElementById('toleranceValue').textContent = State.tolerance + '°';
            }
        });

        document.getElementById('newPoint').addEventListener('click', generateNewPoint);
        document.getElementById('showAnswer').addEventListener('click', showAnswer);

        const statsModal = document.getElementById('statsModal');
        document.getElementById('toggleStatsBtn').addEventListener('click', () => {
            saveAndRefreshStats();
            statsModal.classList.remove('hidden');
        });
        document.getElementById('closeStatsModal').addEventListener('click', () => {
            statsModal.classList.add('hidden');
        });
        statsModal.addEventListener('click', (e) => {
            if (e.target === statsModal) statsModal.classList.add('hidden');
        });

        document.getElementById('resetStats').addEventListener('click', () => {
            if (confirm('確定要清空所有練習統計記錄嗎？')) {
                State.records = [];
                saveAndRefreshStats();
            }
        });

        function saveAndRefreshStats() {
            localStorage.setItem('optics_normal_records', JSON.stringify(State.records));
            const total = State.records.length;
            const correct = State.records.filter(r => r.correct).length;
            const wrong = total - correct;
            const acc = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;

            document.getElementById('badgeCount').textContent = total;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('accuracy').textContent = acc + '%';

            const passCounts = getShapePassCounts();
            const gridEl = document.getElementById('shapePassGrid');
            gridEl.innerHTML = ShapeOrder.map(key => {
                const count = passCounts[key];
                const passed = count > 0;
                return `
                    <div class="flex flex-col items-center justify-center py-1.5 px-1 rounded border ${passed ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-400' : 'bg-slate-800/40 border-slate-700/50 text-slate-500'}" title="${ShapeNames[key]}：通過 ${count} 次">
                        <svg class="w-6 h-6 stroke-current fill-none stroke-[2.2]" viewBox="0 0 40 40">${ShapeSVGs[key]}</svg>
                        <span class="text-xs font-bold mt-1 ${passed ? 'text-emerald-300' : 'text-slate-500'}">${count}</span>
                    </div>
                `;
            }).join('');

            const listEl = document.getElementById('recordsList');
            if (total === 0) {
                listEl.innerHTML = '<div class="text-slate-500 text-center py-4">尚無練習記錄</div>';
            } else {
                listEl.innerHTML = State.records.map((r, i) => `
                    <div class="flex items-center justify-between py-1.5 px-2 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="text-slate-500 w-5">${i + 1}.</span>
                            <span class="${r.correct ? 'text-emerald-400' : 'text-amber-400'} font-bold">${r.correct ? '✓' : '✗'}</span>
                            <span class="text-slate-200">${r.shape}</span>
                        </div>
                        <div class="flex items-center gap-3 text-slate-400">
                            <span>誤差 ${r.error}° (容差 ${r.tolerance}°)</span>
                            <span class="text-slate-500">${r.timestamp}</span>
                        </div>
                    </div>
                `).reverse().join('');
            }
        }

        // 匯出完整成果證書圖片
        document.getElementById('exportStats').addEventListener('click', () => {
            const total = State.records.length;
            const correct = State.records.filter(r => r.correct).length;
            const wrong = total - correct;
            const acc = total > 0 ? ((correct / total) * 100).toFixed(1) + '%' : '0%';
            const student = document.getElementById('studentName').value.trim();
            const passCounts = getShapePassCounts();

            const rowHeight = 28;
            const listHeight = Math.max(80, total * rowHeight + 40);
            const outCanvas = document.createElement('canvas');
            outCanvas.width = 860;
            outCanvas.height = 500 + listHeight;
            const c = outCanvas.getContext('2d');

            c.fillStyle = '#0f172a';
            c.fillRect(0, 0, outCanvas.width, outCanvas.height);

            c.strokeStyle = '#334155';
            c.lineWidth = 2;
            c.strokeRect(20, 20, outCanvas.width - 40, outCanvas.height - 40);

            c.fillStyle = '#ffffff';
            c.font = 'bold 30px "Noto Sans TC", sans-serif';
            c.textAlign = 'center';
            c.fillText('光學法線練習 — 學習成果證書', 430, 65);

            const now = new Date();
            c.font = '15px "Noto Sans TC", sans-serif';
            c.fillStyle = '#94a3b8';
            const infoText = (student ? `學生：${student}  ｜  ` : '') + `時間：${now.toLocaleDateString('zh-TW')} ${now.toLocaleTimeString('zh-TW')}`;
            c.fillText(infoText, 430, 96);

            // 最上方：9 種形狀通過次數一覽（圖示 + 數字）
            const startX = 50;
            const boxW = 76;
            const boxH = 88;
            const gap = 9.5;
            const shapeBarY = 118;

            ShapeOrder.forEach((key, idx) => {
                const bx = startX + idx * (boxW + gap);
                const count = passCounts[key];
                const passed = count > 0;

                c.fillStyle = passed ? 'rgba(6, 78, 59, 0.45)' : '#1e293b';
                c.fillRect(bx, shapeBarY, boxW, boxH);
                c.strokeStyle = passed ? '#10b981' : '#334155';
                c.lineWidth = passed ? 2 : 1;
                c.strokeRect(bx, shapeBarY, boxW, boxH);

                const iconColor = passed ? '#34d399' : '#64748b';
                GeometryEngine.drawMiniIcon(c, key, bx + boxW / 2, shapeBarY + 28, iconColor);

                c.fillStyle = passed ? '#ffffff' : '#64748b';
                c.font = 'bold 22px "Noto Sans TC", sans-serif';
                c.textAlign = 'center';
                c.fillText(String(count), bx + boxW / 2, shapeBarY + 74);
            });

            const cardsY = 228;
            const cards = [
                { label: '總題數', val: total, color: '#60a5fa', x: 135 },
                { label: '正確數', val: correct, color: '#34d399', x: 332 },
                { label: '待加強', val: wrong, color: '#fbbf24', x: 528 },
                { label: '準確率', val: acc, color: '#facc15', x: 725 }
            ];
            cards.forEach(card => {
                c.fillStyle = '#1e293b';
                c.fillRect(card.x - 85, cardsY, 170, 105);
                c.fillStyle = '#94a3b8';
                c.font = '15px "Noto Sans TC", sans-serif';
                c.textAlign = 'center';
                c.fillText(card.label, card.x, cardsY + 30);
                c.fillStyle = card.color;
                c.font = 'bold 34px "Noto Sans TC", sans-serif';
                c.fillText(String(card.val), card.x, cardsY + 80);
            });

            const detailTitleY = 375;
            c.fillStyle = '#e2e8f0';
            c.font = 'bold 19px "Noto Sans TC", sans-serif';
            c.textAlign = 'left';
            c.fillText('📝 作答明細記錄', 50, detailTitleY);

            if (total === 0) {
                c.fillStyle = '#64748b';
                c.font = '16px "Noto Sans TC", sans-serif';
                c.textAlign = 'center';
                c.fillText('尚無練習記錄', 430, detailTitleY + 50);
            } else {
                c.font = '15px "Noto Sans TC", sans-serif';
                State.records.slice().reverse().forEach((r, idx) => {
                    const y = detailTitleY + 38 + idx * rowHeight;
                    const num = total - idx;
                    c.fillStyle = '#64748b';
                    c.textAlign = 'right';
                    c.fillText(`${num}.`, 80, y);

                    c.fillStyle = r.correct ? '#34d399' : '#fbbf24';
                    c.textAlign = 'left';
                    c.fillText(r.correct ? '✓ 正確' : '✗ 待加強', 95, y);

                    c.fillStyle = '#f1f5f9';
                    c.fillText(r.shape, 190, y);

                    c.fillStyle = '#94a3b8';
                    c.fillText(`誤差 ${r.error}° (容差 ≤${r.tolerance}°)`, 370, y);

                    c.fillStyle = '#64748b';
                    c.fillText(r.timestamp, 650, y);
                });
            }

            outCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `光學法線證書_${student || '成果'}_${now.toISOString().slice(0, 10)}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                generateNewPoint();
            } else if (e.code === 'Enter') {
                e.preventDefault();
                showAnswer();
            } else if (e.code === 'KeyL' && State.laserEnabled && !State.laserFiring) {
                State.laserFiring = true;
                render();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyL' && State.laserEnabled && State.laserFiring) {
                State.laserFiring = false;
                render();
            }
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => {
            saveAndRefreshStats();
            resizeCanvas();
        });
    </script>
</body>
</html>
