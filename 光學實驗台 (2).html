<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>光學實驗台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane lab bench — chapter rail | darkroom stage | instrument panel. Stage is always a darkroom; UI chrome follows theme. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d7dde4; --ink:#16202b; --ink-2:#4c5a6a; --ink-3:#7d8a98;
  --accent:#0d7a86; --accent-ink:#ffffff; --accent-soft:#d9eef0; --warn:#b4560f;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --stage:#070b12;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#141b23; --surface-2:#1a222c; --line:#27313d; --ink:#e3e9f0; --ink-2:#a9b6c4; --ink-3:#74828f;
  --accent:#43c3cf; --accent-ink:#04191c; --accent-soft:#16333a; --warn:#f0a35e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#141b23; --surface-2:#1a222c; --line:#27313d; --ink:#e3e9f0; --ink-2:#a9b6c4; --ink-3:#74828f;
  --accent:#43c3cf; --accent-ink:#04191c; --accent-soft:#16333a; --warn:#f0a35e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100%;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
.top{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-family:var(--f-disp);font-size:20px;margin:0;letter-spacing:.04em}
.top p{margin:0;color:var(--ink-3);font-size:13px}

.rail{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 10px 18px}
.chap{margin-top:10px}
.chap h2{font-size:12px;font-weight:700;color:var(--ink-3);margin:0 6px 4px;letter-spacing:.06em;display:flex;gap:8px}
.chap h2 b{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.scene-btn{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2)}
.scene-btn:hover{background:var(--surface-2);color:var(--ink)}
.scene-btn[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}

.stage-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.toolbar .scene-name{font-family:var(--f-disp);font-size:17px;font-weight:700;margin-right:auto;display:flex;gap:10px;align-items:baseline}
.toolbar .scene-name small{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--ink-2)}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--warn)}
.stage{position:relative;flex:1;min-height:0;margin:0 12px;border-radius:10px;overflow:hidden;background:var(--stage)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{font-size:12px;color:var(--ink-3);padding:6px 14px 10px}
.err3d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c9d6e8;padding:20px;text-align:center}

/* floating tool palette (always on the darkroom stage) */
.tools{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px;max-height:calc(100% - 20px);z-index:2;pointer-events:none}
.tools .grp{display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:9px;background:rgba(14,20,30,0.86);border:1px solid rgba(150,175,210,0.2);pointer-events:auto}
.tbtn{width:34px;height:34px;border:0;border-radius:7px;background:transparent;color:#c9d6e8;display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tbtn:hover:not(:disabled){background:rgba(150,175,210,0.18)}
.tbtn[aria-pressed="true"]{background:#43c3cf;color:#04191c}
.tbtn:disabled{opacity:.25;cursor:not-allowed}
.tbtn .sw{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.75)}
.tip{position:absolute;left:42px;top:50%;transform:translateY(-50%);background:#0b1018;color:#e3e9f0;border:1px solid rgba(150,175,210,.3);padding:3px 8px;border-radius:6px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5}
.tbtn:hover .tip,.tbtn:focus-visible .tip{opacity:1}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}

.snaps{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;align-items:stretch;min-height:80px}
.snaps.drop{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:10px}
.snaps .head{display:flex;flex-direction:column;gap:5px;justify-content:center;flex:none}
.snaps .head .lab{font-size:12px;color:var(--ink-3);white-space:nowrap}
.snaps .head .icons{display:flex;gap:4px}
.snaps .empty{font-size:12px;color:var(--ink-3);align-self:center;max-width:46ch}
.ibtn{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn svg,.snapcard .acts svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover:not(:disabled){border-color:var(--accent);color:var(--ink)}
.ibtn:disabled{opacity:.4;cursor:not-allowed}
.snapcard{flex:none;position:relative;width:120px;height:72px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--stage)}
.snapcard>button.th{border:0;padding:0;background:none;cursor:pointer;display:block;width:100%;height:100%}
.snapcard img{width:100%;height:100%;object-fit:cover;display:block}
.snapcard .cap{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;color:#e3e9f0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:10px 5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;pointer-events:none}
.snapcard .acts{position:absolute;top:3px;right:3px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
.snapcard:hover .acts,.snapcard:focus-within .acts{opacity:1}
@media (hover:none){.snapcard .acts{opacity:1}}
.snapcard .acts button{width:24px;height:24px;border:0;border-radius:6px;background:rgba(10,14,20,.85);color:#e3e9f0;display:grid;place-items:center;cursor:pointer;padding:0}
.snapcard .acts svg{width:14px;height:14px}
.snapcard .acts button:hover{background:#43c3cf;color:#04191c}
#jsonText{width:min(720px,80vw);max-width:100%;height:40vh;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px;resize:vertical}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 10px 8px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.toast .btn{padding:3px 10px}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.72);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:12px;padding:14px;max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;min-width:0}
.modal img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:var(--stage)}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal .cap{margin-right:auto;font-size:13px;color:var(--ink-2)}

.panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px}
.panel h3{font-size:12px;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px;font-weight:700}
.controls{display:flex;flex-direction:column;gap:12px}
.selbox{border:1px solid var(--accent);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.selbox .ttl{font-weight:700;font-size:13px}
.ctl label,.ctl .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:3px}
.ctl label.tog{justify-content:flex-start;margin-bottom:0}
.ctl output{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl .seg{display:flex}
.ctl .seg button{flex:1;padding:5px 6px;font-size:13px}
.ctl select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.tog input{accent-color:var(--accent);width:16px;height:16px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btnrow .btn{font-size:13px;padding:4px 10px}
.swatches{display:flex;gap:6px}
.swatches button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline-offset:1px}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}

.info{font-size:13px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.kv dd.t{font-family:var(--f-body);font-weight:700}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.objtab{width:100%;border-collapse:collapse;font-size:12.5px}
.objtab th{text-align:left;color:var(--ink-3);font-weight:500;padding:3px 4px;border-bottom:1px solid var(--line)}
.objtab td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.objtab td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.objtab tr.sel td{background:var(--accent-soft)}
.objtab tr{cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.x{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0 4px;font-size:14px}
.x:hover{color:var(--warn)}
.notes ul{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
.notes li{max-width:60ch}
.zones{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.zones td,.zones th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
.zones th{color:var(--ink-3);font-weight:500}
.note-sm{font-size:12px;color:var(--ink-3)}

@media (max-width:1100px){.app{grid-template-columns:190px minmax(0,1fr) 290px}}
@media (max-width:860px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto;padding-left:0;padding-right:0}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
  .rail{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px))}
  .chap{margin:0;display:flex;align-items:center;gap:2px;flex-shrink:0}
  .chap h2{margin:0 4px 0 6px}
  .chap h2 span{display:none}
  .scene-btn{width:auto;white-space:nowrap;padding:6px 9px}
  .toolbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage{flex:none;height:66vh;min-height:320px;margin:0 max(16px,env(safe-area-inset-left,0px))}
  .snaps{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .hint{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .tbtn{width:30px;height:30px}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){.flash,.tip{transition:none}}
</style>

<div class="app">
  <header class="top">
    <h1>光學實驗台</h1>
    <p>國中自然 第 4 章　光、影像與顏色</p>

  <nav class="rail" id="rail" aria-label="實驗場景"></nav>

      </div>
      <button class="btn" id="resetView">重設視角</button>
      <button class="btn" id="resetScene">重設實驗</button>

  <aside class="panel">

</div>
<div class="modal" id="jsonModal" hidden>

    <textarea id="jsonText" spellcheck="false" readonly aria-label="快照 JSON 內容"></textarea>
    <div class="row"><span class="cap"></span><button class="btn" id="jsonCopy">複製</button><button class="btn primary" id="jsonClose">關閉</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button class="btn" id="toastUndo" hidden>復原</button></div>

function wl2rgb(w){
  let r=0,g=0,b=0;
  if(w<440){r=-(w-440)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=-(w-510)/20}
  else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=-(w-645)/65}else{r=1}
  let f=w<420?0.35+0.65*(w-380)/40:w>680?0.35+0.65*(720-w)/40:1;
  const h=v=>Math.round(255*Math.pow(clamp(v*f,0,1),0.8)).toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(b);
}
/* ---- general ray tracer used by custom light sources ----
   optics elements: {kind:'mirror',pts} {kind:'absorb',pts} {kind:'region',pts,n} {kind:'lens',x,H,f} {kind:'arc',C,R,H,cc} */
function traceGeneric(p,d,opt,b,maxN=30){
  const pts=[p], regions=opt.filter(e=>e.kind==='region');
  const nAt=q=>{let n=1;for(const r of regions) if(pip(q,r.pts)) n=r.n;return n;};
  let cur=p, dir=nrm(d);
  for(let k=0;k<maxN;k++){
    let best=null;
    const take=(t,e,x)=>{if(t>1e-6&&(!best||t<best.t)) best=Object.assign({t,e},x);};
    for(const e of opt){
      if(e.kind==='mirror'||e.kind==='absorb'){for(let i=1;i<e.pts.length;i++){const h=raySeg(cur,dir,e.pts[i-1],e.pts[i]);if(h)take(h.t,e,{a:e.pts[i-1],c:e.pts[i]});}}
      else if(e.kind==='region'){const q=e.pts;for(let i=0;i<q.length;i++){const a=q[i],c=q[(i+1)%q.length],h=raySeg(cur,dir,a,c);if(h)take(h.t,e,{a,c});}}
      else if(e.kind==='lens'){const h=raySeg(cur,dir,[e.x,-e.H],[e.x,e.H]);if(h)take(h.t,e,{});}
      else if(e.kind==='arc'){const o=sub(cur,e.C),B=dot(o,dir),Cq=dot(o,o)-e.R*e.R,disc=B*B-Cq;
        if(disc>=0)for(const t of [-B-Math.sqrt(disc),-B+Math.sqrt(disc)]){if(t<1e-4)continue;const q=add(cur,mul(dir,t));
          if(Math.abs(q[1])<=e.H&&(e.cc?q[0]>=e.C[0]:q[0]<=e.C[0])){take(t,e,{});break;}}}
    }
    if(!best){pts.push(toEdge(cur,dir,b));break;}
    const q=add(cur,mul(dir,best.t)), e=best.e; pts.push(q);
    if(e.kind==='absorb') break;
    if(e.kind==='mirror'){const s=sub(best.c,best.a);let n=nrm([-s[1],s[0]]);if(dot(n,dir)>0)n=mul(n,-1);dir=reflectDir(dir,n);}
    else if(e.kind==='arc'){let n=nrm(sub(q,e.C));if(dot(n,dir)>0)n=mul(n,-1);dir=reflectDir(dir,n);}
    else if(e.kind==='lens'){const s=Math.sign(dir[0])||1,m=dir[1]/dir[0],m2=m-s*q[1]/e.f;dir=nrm([s,s*m2]);}
    else{const s=sub(best.c,best.a),nv=nrm([-s[1],s[0]]),n1=nAt(add(q,mul(dir,-1e-4))),n2=nAt(add(q,mul(dir,1e-4)));
      if(Math.abs(n1-n2)>1e-9) dir=refractDir(dir,nv,n1,n2).d;}
    cur=q;
  }
  return pts;
}

/* ================= thin-lens / mirror imaging ================= */
function imageOf(u,fs){
  if(Math.abs(u-fs)<0.15) return {inf:true};
  const v=u*fs/(u-fs), m=-v/u;
  return {inf:false,v,m,real:v>0};
}
function zoneName(u,f,kind){
  const t=0.2, two=kind==='mirror'?'C（2F）':'2F';
  if(Math.abs(u-f)<t) return '焦點 F 上';
  if(Math.abs(u-2*f)<t) return two+' 上';
  if(u>2*f) return two+' 外';
  if(u>f) return 'F 與 '+two+' 之間';
  return '焦點 F 內';
}
function propsText(img){
  if(img.inf) return '不成像（光線平行射出）';
  const am=Math.abs(img.m);
  const size=Math.abs(am-1)<0.02?'等大':am>1?'放大':'縮小';
  return (img.m<0?'倒立':'正立')+'、'+size+'、'+(img.real?'實像':'虛像');
}
function lensProfile(H,convex,f){
  const p=clamp(12/Math.abs(f),0.35,2.2);
  const tc=convex?0.35+p*1.6:0.35, te=convex?0.35:0.35+p*1.6;
  return r=>{const q=(r/H)**2;return convex?te/2+(tc-te)/2*(1-q):tc/2+(te-tc)/2*q;};
}
function idealRay(P,yh,img,surfX,b,o={}){
  const Hp=[surfX(yh),yh], out=[];
  const main={t:'ray',pts:[P,Hp],c:o.c,w:o.w||1.7,a:o.a??1};
  out.push(main);
  if(img.inf){main.pts.push(toEdge(Hp,img.dir,b));return out;}
  const I=[img.x,img.y];
  if(img.real){ main.pts.push(toEdge(Hp,nrm(sub(I,Hp)),b)); }
  else{ main.pts.push(toEdge(Hp,nrm(sub(Hp,I)),b)); out.push({t:'ray',pts:[Hp,o.backTo||I],c:o.c,w:1.2,a:(o.a??1)*0.75,dash:true}); }
  return out;
}

function reflSurf(st){if(st.mode==='beam'&&st.rough){const s=[];for(let x=-34,k=0;x<=34.01;x+=2,k++)s.push([x,(seeded(k)-0.5)*1.6]);return s;}return [[-34,0],[34,0]];}
function aimRefl(st){const i=st.i*D2R, side=st.lx>0?1:-1;
  if(st.mode==='laser'){st.lx=side*26*Math.sin(i);st.ly=26*Math.cos(i);st.la=Math.atan2(-st.ly,-st.lx);}
  else{const d=[Math.sin(i),-Math.cos(i)];st.bx=-d[0]*30;st.by=-d[1]*30;st.ba=Math.atan2(d[1],d[0]);}}

    const idg=d[1]<0?Math.acos(clamp(-d[1],0,1))*R2D:null; if(idg!=null) st.i=Math.round(idg);
    const objects=[{id:'beam',x:c0[0],y:c0[1],ang:st.ba,label:'平行光源',move:(x,y)=>{st.bx=clamp(x,-38,38);st.by=clamp(y,1,28)},rotate:a=>{st.ba=a}}];
    return {prims:P,handles:[],objects,optics,info:`<dl class="kv"><dt>入射角</dt><dd>${idg==null?'—':idg.toFixed(1)+'°'}</dd><dt>反射方式</dt><dd class="t">${st.rough?'漫射（散射）':'單向反射'}</dd></dl>
      <p class="note-sm">${st.rough?'粗糙表面每一點的法線方向不同，反射光射向四面八方，所以從各方向都看得到紙。每條光線仍然遵守反射定律（虛線是各點的法線）。':'平滑表面的法線方向都一樣，平行光反射後仍然平行。'}</p>`};
  },
  notes:['入射線、反射線和法線在同一平面上，入射線與反射線分在法線兩側。','入射角等於反射角。','光沿反射光的路徑射回去，會沿原來的入射路徑射出，這是光的可逆性。','平滑表面產生單向反射；粗糙表面產生漫射，我們才能從各方向看見物體。']
});

/* ---------- 4-2 平面鏡成像 ---------- */
SCENES.push({id:'plane-mirror',ch:'4-2',name:'平面鏡成像',bounds:[-44,44,-20,20],
  tools:{top:'showTop',bottom:'showBot',image:'showImg',eye:'eyeOn'},
  init:()=>({ox:-18,oy:-6,h:8,ex:-30,ey:9,fan:false,showTop:true,showBot:true,showImg:true,eyeOn:true}),
  controls:()=>[
    {type:'slider',key:'ox',label:'物體位置（負值在鏡前）',min:-40,max:-2,step:0.5,unit:'cm'},
    {type:'slider',key:'h',label:'物體高度',min:2,max:14,step:0.5,unit:'cm'},
    {type:'toggle',key:'fan',label:'顯示物體頂端發出的更多光線'}],
  build(st,b){
    const P=[], M=16, {ox,oy,h,ex,ey}=st, E=[ex,ey];
    P.push({t:'mirror',pts:[[0,-M],[0,M]],back:1});
    P.push({t:'arrowObj',x:ox,y0:oy,h,c:C.obj,c0:C.base,label:'物體'});
    if(st.showImg) P.push({t:'arrowObj',x:-ox,y0:oy,h,c:C.obj,c0:C.base,virtual:true,image:true,label:'像（虛像）'});
    let seen=0, tried=0;
    if(st.eyeOn) for(const [py,c,show] of [[oy+h,C.obj,st.showTop],[oy,C.base,st.showBot]]){
      if(!show) continue; tried++;
      const I=[-ox,py], t=(0-ex)/(I[0]-ex), ry=ey+t*(py-ey);
      if(Math.abs(ry)<=M){seen++;P.push({t:'ray',pts:[[ox,py],[0,ry],E],c,w:1.7});if(st.showImg)P.push({t:'ray',pts:[[0,ry],I],c,w:1.1,a:0.7,dash:true});}
    }
    const fanFrom=[];
    if(st.fan&&st.showTop) fanFrom.push([oy+h,C.obj]);
    if(!st.eyeOn){ if(st.showTop) fanFrom.push([oy+h,C.obj]); if(st.showBot) fanFrom.push([oy,C.base]); }
    for(const [py,c] of fanFrom){const tip=[ox,py], I=[-ox,py];
      for(const yy of lin(-M+1,M-1,7)){const R=[0,yy], d=nrm(sub(R,tip)), r=[-d[0],d[1]];
        P.push({t:'ray',pts:[tip,R,toEdge(R,r,b)],c,w:1,a:0.45});if(st.showImg)P.push({t:'ray',pts:[R,I],c,w:0.8,a:0.3,dash:true});}}
    const yl=oy-3;
    P.push({t:'line',pts:[[ox,yl],[0,yl]],c:C.dim,a:0.8});
    P.push({t:'label',x:ox/2,y:yl-1.6,text:'物距 '+f1(-ox)+' cm',c:C.text});
    if(st.showImg){P.push({t:'line',pts:[[0,yl],[-ox,yl]],c:C.dim,a:0.8,dash:true});P.push({t:'label',x:-ox/2,y:yl-1.6,text:'像距 '+f1(-ox)+' cm',c:C.text});}
    if(st.eyeOn) P.push({t:'eye',x:ex,y:ey,dir:nrm(sub([0,(ey+oy)/2],E))});
    const H=[{x:ox,y:oy,cursor:'move',drag:(x,y)=>{st.ox=clamp(Math.round(x*2)/2,-40,-2);st.oy=clamp(Math.round(y*2)/2,-15,15-st.h)}},
      {x:ox,y:oy+h,cursor:'ns-resize',drag:(x,y)=>{st.h=clamp(Math.round((y-st.oy)*2)/2,2,Math.min(14,16-st.oy))}}];
    if(st.eyeOn) H.push({x:ex,y:ey,cursor:'move',drag:(x,y)=>{st.ex=clamp(x,-42,-3);st.ey=clamp(y,-18,18)}});
    return {prims:P,handles:H,optics:[{kind:'mirror',pts:[[0,-M],[0,M]]}],info:`<dl class="kv"><dt>物距</dt><dd>${f1(-ox)} cm</dd><dt>像距</dt><dd>${st.showImg?f1(-ox)+' cm':'？'}</dd>
      <dt>物高 / 像高</dt><dd>${f1(h)} / ${st.showImg?f1(h):'？'} cm</dd><dt>像的性質</dt><dd class="t">${st.showImg?'正立、等大、虛像':'？'}</dd></dl>
      ${st.eyeOn&&tried&&seen<tried?'<p><span class="pill warn">眼睛目前無法看到完整的像</span></p><p class="note-sm">反射光沒有進入眼睛。移動眼睛或物體試試看。</p>':''}
      <p class="note-sm">拖曳眼睛可以改變觀察位置。虛線是反射光的反向延長線，交會處就是像的位置。</p>`};
  },
  notes:['平面鏡成正立、等大的虛像，像與物左右相反。','物體到鏡面的距離（物距）等於像到鏡面的距離（像距）。','虛像不是光線真的會聚形成，而是反射光反向延長線的交點，所以無法用紙屏接收。']
});

/* ---------- 4-2 凹面鏡與凸面鏡 ---------- */
SCENES.push({id:'curved-mirror',ch:'4-2',name:'凹面鏡與凸面鏡',bounds:[-64,40,-22,22],
  tools:st=>st.src==='object'?{r1:'r1',r2:'r2',r3:'r3',image:'showImg'}:{},
  init:()=>({type:'concave',R:40,src:'parallel',n:7,sx:-20,sy:0,ox:-30,oh:5,r1:true,r2:true,r3:true,showImg:true}),
  controls:st=>[
    {type:'seg',key:'type',label:'面鏡種類',options:[['concave','凹面鏡'],['convex','凸面鏡']]},
    {type:'seg',key:'src',label:'光源',options:[['parallel','平行光'],['point','點光源'],['object','物體成像']]},
    {type:'slider',key:'R',label:'曲率半徑（焦距 = 半徑 ÷ 2）',min:24,max:60,step:1,unit:'cm'},
    ...(st.src==='object'?[{type:'slider',key:'ox',label:'物體位置',min:-60,max:-2,step:0.5,unit:'cm'}]:[{type:'slider',key:'n',label:'光線數量',min:3,max:13,step:2}]),
    ...(st.src==='point'?[{type:'buttons',items:[{label:'光源放到焦點',onClick:s=>{s.sx=s.type==='concave'?-s.R/2:-20;s.sy=0;}}]}]:[])],
  build(st,b){
    const P=[], R=st.R, f=R/2, cc=st.type==='concave', H=Math.min(15,R*0.42), Cx=cc?-R:R;
    const sag=y=>cc?Cx+Math.sqrt(R*R-y*y):Cx-Math.sqrt(R*R-y*y);
    const arc=lin(-H,H,41).map(y=>[sag(y),y]);
    const optics=[{kind:'arc',C:[Cx,0],R,H,cc}];
    P.push({t:'axis',x0:b[0],x1:b[1]});
    P.push({t:'mirror',pts:arc,back:1});
    const Fx=cc?-f:f;
    P.push({t:'mark',x:Fx,y:0,label:cc?'F':'F（虛焦點）'});
    if(Cx>b[0]&&Cx<b[1]) P.push({t:'mark',x:Cx,y:0,label:'C',dimmed:true});
    let info='';
    const hit=(p,d)=>{const o=sub(p,[Cx,0]),B=dot(o,d),Cq=dot(o,o)-R*R,disc=B*B-Cq; if(disc<0) return null;
      for(const t of [-B-Math.sqrt(disc),-B+Math.sqrt(disc)]){ if(t<1e-4) continue; const q=add(p,mul(d,t));
        if(Math.abs(q[1])<=H && (cc?q[0]>=Cx:q[0]<=Cx)) return q;} return null;};
    const traceTo=(S,d,c,a=1)=>{const q=hit(S,d); if(!q){P.push({t:'ray',pts:[S,toEdge(S,d,b)],c,w:1.5,a});return;}
      let n=nrm(sub(q,[Cx,0])); if(dot(n,d)>0) n=mul(n,-1); const r=reflectDir(d,n);
      P.push({t:'ray',pts:[S,q,toEdge(q,r,b)],c,w:1.5,a});
      if(r[0]<0 && (!cc || st.src==='point')){
        const div=!cc || (st.src==='point' && -st.sx<f);
        if(div){const tb=(Math.max(f,12)+6-q[0])/(-r[0]); P.push({t:'ray',pts:[q,add(q,mul(r,-Math.min(tb,60)))],c,w:0.9,a:0.45*a,dash:true});}
      }};
    if(st.src==='parallel'){
      for(const y of lin(-H*0.9,H*0.9,st.n)) traceTo([b[0]-2,y],[1,0],C.warm);
      info=`<dl class="kv"><dt>焦距 f</dt><dd>${f1(f)} cm</dd><dt>平行光反射後</dt><dd class="t">${cc?'會聚於焦點':'發散'}</dd></dl>
        <p class="note-sm">${cc?'凹面鏡能把平行光會聚到焦點（太陽灶、衛星天線）。離主軸較遠的光線會聚點略偏，這是球面鏡的特性。':'凸面鏡使平行光發散，反射光的延長線（虛線）交於鏡後的虛焦點。'}</p>`;
      return {prims:P,handles:[],info,optics};
    }
    if(st.src==='point'){
      const S=[st.sx,st.sy];
      for(const y of lin(-H*0.92,H*0.92,st.n)){const tg=[sag(y),y]; traceTo(S,nrm(sub(tg,S)),'#ffe066');}
      P.push({t:'lamp',x:S[0],y:S[1]});
      const u=-st.sx;
      info=`<dl class="kv"><dt>焦距 f</dt><dd>${f1(f)} cm</dd><dt>光源到鏡面</dt><dd>${f1(u)} cm</dd></dl>
        <p class="note-sm">${cc?(Math.abs(u-f)<0.6&&Math.abs(st.sy)<0.5?'光源在焦點上，反射光成為平行光，手電筒和車燈就是這樣設計的。':'拖曳光源到焦點 F，看看反射光有什麼變化。'):'凸面鏡讓反射光散開，看到的範圍較廣，常用於道路轉角反射鏡。'}</p>`;
      return {prims:P,handles:[{x:S[0],y:S[1],cursor:'move',drag:(x,y)=>{st.sx=clamp(x,b[0]+2,-3);st.sy=clamp(y,-H,H);
        if(Math.abs(st.sx+f)<0.8&&Math.abs(st.sy)<0.8&&cc){st.sx=-f;st.sy=0;}}}],info,optics};
    }
    const u=-st.ox, fs=cc?f:-f, img=imageOf(u,fs), P0=[st.ox,st.oh];
    if(!img.inf){img.x=-img.v;img.y=img.m*st.oh;} else img.dir=nrm([st.ox,-st.oh]);
    const sx=y=>sag(clamp(y,-R*0.95,R*0.95));
    const yF=-st.oh*fs/(u-fs);
    const mirrorRay=(yh,c,back)=>{const Hp=[sx(yh),yh];
      if(img.inf){P.push({t:'ray',pts:[P0,Hp,toEdge(Hp,img.dir,b)],c,w:1.7});return;}
      const I=[img.x,img.y];
      if(img.real){P.push({t:'ray',pts:[P0,Hp,toEdge(Hp,nrm(sub(I,Hp)),b)],c,w:1.7});}
      else{P.push({t:'ray',pts:[P0,Hp,toEdge(Hp,nrm(sub(Hp,I)),b)],c,w:1.7});P.push({t:'ray',pts:[Hp,back||I],c,w:1.1,a:0.7,dash:true});}};
    if(st.r1) mirrorRay(st.oh,'#ffd166',cc?null:[f,0]);
    if(st.r2) mirrorRay(0,'#7ee0a0',null);
    if(st.r3){mirrorRay(yF,'#ff8fb8',null);
      if(cc&&u<f) P.push({t:'ray',pts:[[-f,0],P0],c:'#ff8fb8',w:1,a:0.5,dash:true});
      if(!cc) P.push({t:'ray',pts:[[sx(yF),yF],[f,0]],c:'#ff8fb8',w:1,a:0.5,dash:true});}
    P.push({t:'arrowObj',x:st.ox,y0:0,h:st.oh,c:C.obj,label:'物體'});
    if(st.showImg&&!img.inf&&Math.abs(img.v)<150) P.push({t:'arrowObj',x:img.x,y0:0,h:img.y,c:C.obj,virtual:!img.real,image:true,label:img.real?'實像':'虛像'});
    const hide=!st.showImg;
    info=`<dl class="kv"><dt>物體位置</dt><dd class="t">${cc?zoneName(u,f,'mirror'):'鏡前任意位置'}</dd><dt>物距</dt><dd>${f1(u)} cm</dd>
      <dt>像距</dt><dd>${hide?'？':img.inf?'—':f1(Math.abs(img.v))+' cm（'+(img.real?'鏡前':'鏡後')+'）'}</dd>
      <dt>放大率</dt><dd>${hide?'？':img.inf?'—':f2(Math.abs(img.m))+' 倍'}</dd><dt>像的性質</dt><dd class="t">${hide?'？':propsText(img)}</dd></dl>
      <p class="note-sm">${cc?'黃線：平行主軸 → 反射後通過焦點；綠線：射向鏡面中心 → 對稱反射；粉紅線：通過焦點 → 反射後平行主軸。':'凸面鏡永遠成正立、縮小的虛像。'}</p>`;
    return {prims:P,handles:[{x:st.ox,y:0,cursor:'ew-resize',drag:x=>{let v=clamp(Math.round(x*2)/2,-60,-2);if(cc){if(Math.abs(-v-f)<0.8)v=-f;if(Math.abs(-v-2*f)<0.8)v=-2*f;}st.ox=v;}},
      {x:st.ox,y:st.oh,cursor:'ns-resize',drag:(x,y)=>{st.oh=clamp(Math.round(y*2)/2,1,12)}}],info,optics};
  },
  notes:['凹面鏡使平行光會聚於焦點；把光源放在焦點，反射光變成平行光（手電筒、車燈）。','凸面鏡使平行光發散，反射光的延長線交於鏡後的焦點，視野較廣（道路反射鏡、汽車後照鏡）。','物體在凹面鏡焦點內，成正立放大的虛像（化妝鏡）；在焦點外，成倒立的實像。']
});

/* ---------- 4-3 折射 ---------- */
function aimRefr(st){const i=st.i*D2R, sg=st.from==='top'?1:-1, side=st.lx>0?1:-1;st.lx=side*24*Math.sin(i);st.ly=sg*Math.max(24*Math.cos(i),0.6);st.la=Math.atan2(-st.ly,-st.lx);}
SCENES.push({id:'refraction',ch:'4-3',name:'光的折射',bounds:[-40,40,-27,27],
  init:()=>{const s={top:'air',bot:'water',i:45,from:'top',lx:-1,ly:1,la:0};aimRefr(s);return s;},
  controls:()=>[
    {type:'select',key:'top',label:'上方介質',options:Object.entries(MEDIA).map(([k,v])=>[k,v.name+'（n = '+v.n.toFixed(2)+'）'])},
    {type:'select',key:'bot',label:'下方介質',options:Object.entries(MEDIA).map(([k,v])=>[k,v.name+'（n = '+v.n.toFixed(2)+'）'])},
    {type:'seg',key:'from',label:'雷射筆位置',options:[['top','在上方'],['bot','在下方']],onInput:aimRefr},
    {type:'slider',key:'i',label:'入射角（設定後雷射對準中央）',min:0,max:89,step:1,unit:'°',onInput:aimRefr}],
  build(st,b){
    const P=[], top=MEDIA[st.top], bot=MEDIA[st.bot];
    const topR=[[-40,0],[40,0],[40,27],[-40,27]], botR=[[-40,-27],[40,-27],[40,0],[-40,0]];
    P.push({t:'medium',pts:topR,c:top.fill,label:top.name+'　n = '+top.n.toFixed(2),lx:-38,ly:24});
    P.push({t:'medium',pts:botR,c:bot.fill,label:bot.name+'　n = '+bot.n.toFixed(2),lx:-38,ly:-24});
    P.push({t:'line',pts:[[-40,0],[40,0]],c:'rgba(200,220,240,0.5)'});
    const optics=[{kind:'region',pts:topR,n:top.n},{kind:'region',pts:botR,n:bot.n}];
    const S=[st.lx,st.ly], d=dirOf(st.la);
    P.push({t:'laser',x:S[0],y:S[1],dir:d});
    const objects=[{id:'laser',x:S[0],y:S[1],ang:st.la,label:'雷射筆',move:(x,y)=>{st.lx=clamp(x,-39,39);st.ly=clamp(y,-26,26);if(Math.abs(st.ly)<0.6)st.ly=st.ly<0?-0.6:0.6;},rotate:a=>{st.la=a}}];
    const t=Math.abs(d[1])>1e-6?-S[1]/d[1]:-1, hx=S[0]+d[0]*t;
    if(!(t>0)||Math.abs(hx)>40){P.push({t:'ray',pts:[S,toEdge(S,d,b)],c:C.laser,w:2.2});
      return {prims:P,handles:[],objects,optics,info:'<p><span class="pill warn">雷射光沒有射到兩種介質的界面</span></p><p class="note-sm">點一下雷射筆，用箭頭拖移、用藍色圓環旋轉。</p>'};}
    const Hp=[hx,0], up=S[1]>0, sg=up?1:-1, n1=up?top.n:bot.n, n2=up?bot.n:top.n, m1=up?top:bot, m2=up?bot:top;
    const idg=Math.acos(clamp(Math.abs(d[1]),0,1))*R2D; st.i=Math.round(idg); st.from=up?'top':'bot';
    const res=refractDir(d,[0,sg],n1,n2), R=res.R;
    P.push({t:'line',pts:[[hx,-26],[hx,26]],c:C.dim,dash:true});
    P.push({t:'ray',pts:[S,Hp],c:C.laser,w:2.2});
    let tdeg=null;
    if(res.tir) P.push({t:'ray',pts:[Hp,toEdge(Hp,res.d,b)],c:C.laser,w:2.2});
    else{
      P.push({t:'ray',pts:[Hp,toEdge(Hp,res.d,b)],c:C.laser,w:2.2,a:clamp(1-R,0.25,1)});
      P.push({t:'ray',pts:[Hp,toEdge(Hp,res.refl,b)],c:C.laser,w:1.6,a:clamp(R*1.6,0.08,1)});
      tdeg=Math.asin(clamp(n1/n2*Math.sin(idg*D2R),-1,1))*R2D;
      if(idg>0.5) P.push({t:'arc',x:hx,y:0,r:10,v1:[0,-sg],v2:res.d,c:'#7ee0a0',label:'折射角 '+tdeg.toFixed(1)+'°'});
    }
    if(idg>0.5) P.push({t:'arc',x:hx,y:0,r:7,v1:[0,sg],v2:mul(d,-1),c:'#ffd166',label:'入射角 '+idg.toFixed(0)+'°'});
    if(res.tir&&idg>0.5) P.push({t:'arc',x:hx,y:0,r:10,v1:[0,sg],v2:res.d,c:'#7ee0a0',label:'反射角 '+idg.toFixed(0)+'°'});
    const crit=n1>n2?Math.asin(n2/n1)*R2D:null;
    const bend=Math.abs(n1-n2)<1e-6?'不偏折（兩邊介質相同）':idg<0.5?'垂直入射，不偏折':n2>n1?'折射光偏向法線':'折射光偏離法線';
    const v=n=>(3/n).toFixed(2)+' × 10⁸ m/s';
    const info=`<dl class="kv"><dt>光從</dt><dd class="t">${m1.name} → ${m2.name}</dd><dt>入射角</dt><dd>${idg.toFixed(1)}°</dd>
      <dt>折射角</dt><dd>${res.tir?'—':tdeg.toFixed(1)+'°'}</dd><dt>反射光比例</dt><dd>${(R*100).toFixed(1)}%</dd>
      ${crit!==null?`<dt>臨界角</dt><dd>${crit.toFixed(1)}°</dd>`:''}
      <dt>光速（${m1.name}）</dt><dd>${v(n1)}</dd><dt>光速（${m2.name}）</dt><dd>${v(n2)}</dd></dl>
      <p><span class="pill ${res.tir?'warn':''}">${res.tir?'全反射：光完全反射回 '+m1.name:bend}</span></p>`;
    return {prims:P,handles:[],objects,optics,info};
  },
  notes:['光從一種介質斜射入另一種介質時，行進方向會改變，這叫做折射。','光從空氣進入水或玻璃（光速變慢）時，折射光偏向法線；反過來則偏離法線。','垂直入射時不偏折。折射時也有一部分光被反射。','光從水或玻璃射向空氣、且入射角大於臨界角時，光全部反射回來，稱為全反射。']

      ${hide?'':`<dt>公式檢查 1/物距 + 1/像距</dt><dd>${sel.img.inf?'—':f2(1/sel.u+1/sel.img.v)+' ≈ 1/f = '+f2(1/fs)}</dd>`}</dl>

      <tr><td>F～2F</td><td>2F 外</td><td>倒立放大實像</td><td>投影機</td></tr><tr><td>F 上</td><td>—</td><td>不成像</td><td></td></tr>

  notes:['三條特殊光線：① 平行主軸的光，折射後通過焦點；② 通過透鏡中心的光，方向不變；③ 通過焦點的光，折射後平行主軸。兩條光線的交點就是像點。','凸透鏡：物體由遠處移近透鏡（仍在焦點外）時，像愈來愈大、離透鏡愈來愈遠。','實像可以用光屏接收；虛像是光線延長線（虛線）的交點，只能透過透鏡用眼睛看到。','凹透鏡不論物體在哪裡，都成正立、縮小的虛像。']
});

/* ---------- 4-4 眼睛與視力矯正 ---------- */
SCENES.push({id:'eye',ch:'4-4',name:'眼睛與視力矯正',bounds:[-78,32,-19,19],
  init:()=>({eye:'myopia',dist:'far',glasses:false}),
  controls:()=>[
    {type:'seg',key:'eye',label:'眼睛',options:[['normal','正常'],['myopia','近視'],['hyper','遠視']]},
    {type:'seg',key:'dist',label:'觀看',options:[['far','遠處物體'],['near','近處物體']]},
    {type:'toggle',key:'glasses',label:'戴上矯正眼鏡'}],
  build(st,b){
    const P=[], RET=24, NEAR=60, GX=-12;
    const range={normal:[16.5,24],myopia:[14.5,20],hyper:[20,28]}[st.eye];
    let fg=null;
    if(st.glasses&&st.eye==='myopia'){const fp=1/(1/range[1]-1/RET); fg=-(fp+GX);}
    if(st.glasses&&st.eye==='hyper'){const np=1/(1/range[0]-1/RET), u=NEAR+GX, vi=np+GX; fg=1/(1/u-1/vi);}
    let uEff=st.dist==='far'?Infinity:NEAR;
    if(fg!==null){const ug=st.dist==='far'?Infinity:NEAR+GX; const vg=ug===Infinity?fg:ug*fg/(ug-fg); uEff=-(GX+vg);}
    const fNeed=uEff===Infinity?RET:1/(1/uEff+1/RET), fe=clamp(fNeed,range[0],range[1]);
    const v=uEff===Infinity?fe:1/(1/fe-1/uEff);
    P.push({t:'axis',x0:b[0],x1:b[1]});
    P.push({t:'eyeball',cx:12,r:12.6,ret:RET});
    P.push({t:'lens',x:0,H:5,convex:true,f:fe*0.55,post:false});
    if(fg!==null) P.push({t:'lens',x:GX,H:9,convex:fg>0,f:Math.abs(fg)/5,post:false,label:fg>0?'凸透鏡':'凹透鏡'});
    const retina=lin(-0.85,0.85,20).map(a=>[12+12.6*Math.cos(a),12.6*Math.sin(a)]);
    const optics=[{kind:'lens',x:0,H:5,f:fe},{kind:'absorb',pts:retina}]; if(fg!==null) optics.unshift({kind:'lens',x:GX,H:9,f:fg});
    for(const y of lin(-4,4,5)){
      let p, m;
      if(st.dist==='far'){p=[b[0]-1,y];m=0;}else{p=[-NEAR,0];m=y/(fg!==null?(NEAR+GX):NEAR);}
      const pts=[p]; let x=p[0], yy=p[1];
      const lenses=fg!==null?[[GX,fg],[0,fe]]:[[0,fe]];
      for(const [lx,lf] of lenses){yy=yy+m*(lx-x);x=lx;pts.push([x,yy]);m=m-yy/lf;}
      const yr=yy+m*(RET-x); pts.push([RET,yr]);
      P.push({t:'ray',pts,c:'#ffe066',w:1.5});
      if(v>RET&&v<60) P.push({t:'ray',pts:[[RET,yr],[v,yy+m*(v-x)]],c:'#ffe066',w:0.9,a:0.45,dash:true});
    }
    if(st.dist==='near') P.push({t:'lamp',x:-NEAR,y:0});
    if(v<60) P.push({t:'point',x:v,y:0,c:'#ffffff'});
    P.push({t:'label',x:v<60?v:RET,y:-6,text:'成像點',c:C.text});
    const err=v-RET, ok=Math.abs(err)<0.3, where=ok?'視網膜上':err<0?'視網膜前':'視網膜後';
    const blur=Math.abs(err)*8/Math.max(v,1);
    const info=`<dl class="kv"><dt>成像位置</dt><dd class="t">${where}</dd><dt>看起來</dt><dd class="t">${ok?'清楚':'模糊'}</dd>
      ${fg!==null?`<dt>矯正鏡片</dt><dd class="t">${fg>0?'凸透鏡':'凹透鏡'}（焦距 ${f1(Math.abs(fg))}）</dd>`:''}</dl>
      <p class="note-sm">${st.eye==='myopia'?'近視：晶狀體太凸或眼球太長，遠處物體成像在視網膜前。戴凹透鏡讓光先發散一些，就能成像在視網膜上。':st.eye==='hyper'?'遠視：晶狀體太扁或眼球太短，近處物體成像在視網膜後。戴凸透鏡讓光先會聚一些。':'正常眼睛會自動調整晶狀體的厚薄，遠近物體都能成像在視網膜上。'}</p>
      <p class="note-sm">圖中尺寸為示意，眼球已放大。</p>`;
    return {prims:P,handles:[],info,optics,sv:{kind:'eye',title:'眼睛看到的',blur}};
  },
  notes:['眼睛的晶狀體相當於凸透鏡，在視網膜上形成倒立縮小的實像。','近視看不清遠處：成像在視網膜前，用凹透鏡矯正。','遠視看不清近處：成像在視網膜後，用凸透鏡矯正。']
});

/* ---------- 4-5 色散 ---------- */
const PRISM=(cx,cy,up,rot=0,s=22)=>{const h=s*Math.sqrt(3)/2, k=up?1:-1;
  let pts=[[cx,cy+k*2*h/3],[cx-s/2,cy-k*h/3],[cx+s/2,cy-k*h/3]]; pts=up?[pts[1],pts[2],pts[0]]:[pts[0],pts[2],pts[1]];
  const c=Math.cos(rot*D2R),sn=Math.sin(rot*D2R); return pts.map(([x,y])=>[cx+(x-cx)*c-(y-cy)*sn,cy+(x-cx)*sn+(y-cy)*c]);};
const GLASS={crown:{A:1.5046,B:0.0042,name:'冕牌玻璃'},flint:{A:1.62,B:0.0095,name:'火石玻璃'},ex:{A:1.53,B:0.028,name:'誇張示範'}};
SCENES.push({id:'prism',ch:'4-5',name:'三稜鏡色散',bounds:[-50,50,-28,28],
  init:()=>({light:'white',glass:'flint',ang:27.5,sx:-42,sy:-14,px:0,py:0,rot:0,second:false,p2x:22,p2y:-12,rot2:0}),
  controls:()=>[
    {type:'seg',key:'light',label:'光源',options:[['white','白光'],['red','紅光'],['green','綠光'],['blue','藍光']]},
    {type:'select',key:'glass',label:'稜鏡材料',options:Object.entries(GLASS).map(([k,v])=>[k,v.name])},
    {type:'slider',key:'ang',label:'光線方向',min:-60,max:60,step:0.5,unit:'°'},
    {type:'slider',key:'rot',label:'稜鏡旋轉',min:-60,max:60,step:1,unit:'°'},
    {type:'toggle',key:'second',label:'加上第二個（倒放的）三稜鏡'}],
  build(st,b){
    const P=[], g=GLASS[st.glass], SX=44;
    const polys=[{pts:PRISM(st.px,st.py,true,st.rot)}]; if(st.second) polys.push({pts:PRISM(st.p2x,st.p2y,false,st.rot2)});
    for(const p of polys) P.push({t:'prism',pts:p.pts});
    P.push({t:'screen',x:SX,h:52,main:true});
    const wls=st.light==='white'?lin(400,700,25):st.light==='red'?[650]:st.light==='green'?[530]:[465];
    const S=[st.sx,st.sy], d0=dirOf(st.ang*D2R);
    const items=[]; let firstSeg=null; const devs={};
    for(const wl of wls){
      const n=g.A+g.B/((wl/1000)**2), col=wl2rgb(wl);
      const opt=[...polys.map(p=>({kind:'region',pts:p.pts,n})),{kind:'absorb',pts:[[SX,-26],[SX,26]]}];
      const pts=traceGeneric(S,d0,opt,b);
      const last=pts[pts.length-1]; if(Math.abs(last[0]-SX)<1e-6) items.push({y:last[1],c:col});
      if(!firstSeg) firstSeg=[pts[0],pts[1]];
      P.push({t:'ray',pts:st.light==='white'?pts.slice(1):pts,c:col,w:st.light==='white'?1.4:2,a:st.light==='white'?0.55:1,arrow:false});
      const a=pts[pts.length-2],z=pts[pts.length-1]; devs[wl]=Math.atan2(z[1]-a[1],z[0]-a[0])*R2D;
    }
    if(st.light==='white') P.unshift({t:'ray',pts:firstSeg,c:C.white,w:2.4});
    P.push({t:'lamp',x:S[0],y:S[1],c:st.light==='white'?C.white:wl2rgb(wls[0])});
    const n589=g.A+g.B/0.589**2, optics=[...polys.map(p=>({kind:'region',pts:p.pts,n:n589})),{kind:'absorb',pts:[[SX,-26],[SX,26]]}];
    const nr=g.A+g.B/0.65**2, nv=g.A+g.B/0.40**2;
    const objects=[
      {id:'src',x:S[0],y:S[1],ang:st.ang*D2R,label:'光源',move:(x,y)=>{st.sx=clamp(x,-49,40);st.sy=clamp(y,-27,27)},rotate:a=>{let dg=a*R2D;st.ang=Math.round(clamp(dg,-90,90)*2)/2}},
      {id:'p1',x:st.px,y:st.py,ang:(st.rot+90)*D2R,label:'三稜鏡',move:(x,y)=>{st.px=clamp(x,-35,35);st.py=clamp(y,-20,20)},rotate:a=>{let dg=Math.round(a*R2D-90);while(dg>180)dg-=360;while(dg<-180)dg+=360;st.rot=dg}}];
    if(st.second) objects.push({id:'p2',x:st.p2x,y:st.p2y,ang:(st.rot2-90)*D2R,label:'第二個稜鏡',move:(x,y)=>{st.p2x=clamp(x,-35,40);st.p2y=clamp(y,-22,22)},rotate:a=>{let dg=Math.round(a*R2D+90);while(dg>180)dg-=360;while(dg<-180)dg+=360;st.rot2=dg}});
    const spread=st.light==='white'&&devs[400]!=null?Math.abs(devs[400]-devs[700]):0;
    const info=`<dl class="kv"><dt>紅光折射率</dt><dd>${nr.toFixed(3)}</dd><dt>紫光折射率</dt><dd>${nv.toFixed(3)}</dd>
      ${st.light==='white'?`<dt>紅、紫光分開角度</dt><dd>${spread.toFixed(1)}°</dd>`:''}</dl>
      <p><span class="pill">${st.light==='white'?(st.second?'第二個稜鏡可讓色光重新合成白光':'白光分散成紅橙黃綠藍靛紫'):'單色光經過稜鏡只會偏折，不會再分散'}</span></p>
      <p class="note-sm">點一下光源或稜鏡，可以用箭頭拖移、用藍色圓環旋轉。${st.second?'調整第二個稜鏡的位置與角度，讓色光重新會合。':'紫光偏折最多，紅光偏折最少。'}</p>`;
    return {prims:P,handles:[],objects,optics,info,sv:{kind:'spectrum',title:'屏幕上看到的',range:26,items}};
  },
  notes:['白光是由各種顏色的光混合而成。','白光經三稜鏡折射後，不同色光偏折程度不同而分開，這叫做色散（紫光偏折最大，紅光最小）。','牛頓用第二個倒放的稜鏡，把色光重新合成白光；單色光經過稜鏡不會再分散。','雨後的彩虹就是陽光被小水滴色散形成的。']
});

/* ---------- 4-5 色光與物體的顏色 ---------- */
const LIGHTS={white:['白光',[1,1,1]],red:['紅光',[1,0,0]],green:['綠光',[0,1,0]],blue:['藍光',[0,0,1]],yellow:['黃光（紅＋綠）',[1,1,0]],magenta:['洋紅光（紅＋藍）',[1,0,1]],cyan:['青光（綠＋藍）',[0,1,1]]};
const FILTERS={none:['不加玻璃紙',[1,1,1]],red:['紅色玻璃紙',[1,0.04,0.04]],green:['綠色玻璃紙',[0.04,1,0.04]],blue:['藍色玻璃紙',[0.04,0.04,1]]};
const PAPERS=[['紅紙',[0.95,0.06,0.06]],['綠紙',[0.06,0.85,0.12]],['藍紙',[0.08,0.12,0.95]],['黃紙',[0.95,0.9,0.06]],['白紙',[0.95,0.95,0.95]],['黑紙',[0.04,0.04,0.04]]];
function colorName(c){const t=c.map(v=>v>0.28?1:0).join('');return {'000':'黑色','100':'紅色','010':'綠色','001':'藍色','110':'黃色','101':'洋紅色','011':'青色','111':'白色'}[t];}
const rgbCss=(c,k=1)=>`rgb(${c.map(v=>Math.round(255*clamp(v*k,0,1))).join(',')})`;
function effLight(st){const L=LIGHTS[st.light][1], a=FILTERS[st.f1][1], b2=FILTERS[st.f2][1]; return L.map((v,i)=>v*a[i]*b2[i]);}
SCENES.push({id:'color',ch:'4-5',name:'色光與物體的顏色',noOptics:true,bounds:st=>st.mode==='mix'?[-30,30,-22,22]:[-38,38,-18,26],
  init:()=>({mode:'mix',r:1,g:1,b:1,onr:true,ong:true,onb:true,pos:{r:[-6,4],g:[6,4],b:[0,-6]},light:'white',f1:'none',f2:'none'}),
  controls:st=>[
    {type:'seg',key:'mode',label:'實驗',options:[['mix','色光三原色'],['object','物體的顏色']]},
    ...(st.mode==='mix'?[
      {type:'toggle',key:'onr',label:'紅光手電筒'},{type:'slider',key:'r',label:'紅光亮度',min:0,max:1,step:0.05,fmt:v=>Math.round(v*100)+'%'},
      {type:'toggle',key:'ong',label:'綠光手電筒'},{type:'slider',key:'g',label:'綠光亮度',min:0,max:1,step:0.05,fmt:v=>Math.round(v*100)+'%'},
      {type:'toggle',key:'onb',label:'藍光手電筒'},{type:'slider',key:'b',label:'藍光亮度',min:0,max:1,step:0.05,fmt:v=>Math.round(v*100)+'%'}]:[
      {type:'select',key:'light',label:'光源顏色',options:Object.entries(LIGHTS).map(([k,v])=>[k,v[0]])},
      {type:'select',key:'f1',label:'光源前的玻璃紙（第 1 張）',options:Object.entries(FILTERS).map(([k,v])=>[k,v[0]])},
      {type:'select',key:'f2',label:'光源前的玻璃紙（第 2 張）',options:Object.entries(FILTERS).map(([k,v])=>[k,v[0]])}])],
  build(st,b){
    if(st.mode==='mix'){
      const H=['r','g','b'].map(k=>({x:st.pos[k][0],y:st.pos[k][1],cursor:'move',drag:(x,y)=>{st.pos[k]=[clamp(x,-20,20),clamp(y,-12,12)]}}));
      const c=[st.onr?st.r:0,st.ong?st.g:0,st.onb?st.b:0];
      return {prims:[],handles:H,custom:'mix',info:`<dl class="kv"><dt>三光重疊處</dt><dd class="t"><span class="dot" style="background:${rgbCss(c)}"></span>${colorName(c)}</dd></dl>
        <table class="zones"><tr><th>混合</th><th>結果</th></tr><tr><td>紅 ＋ 綠</td><td>黃</td></tr><tr><td>綠 ＋ 藍</td><td>青</td></tr><tr><td>紅 ＋ 藍</td><td>洋紅</td></tr><tr><td>紅 ＋ 綠 ＋ 藍</td><td>白</td></tr></table>
        <p class="note-sm">拖曳光圈可移動位置。試著調整亮度，看重疊處的顏色怎麼變。</p>`};
    }
    const L=effLight(st);
    const info=`<dl class="kv"><dt>照到紙上的光</dt><dd class="t"><span class="dot" style="background:${rgbCss(L)}"></span>${colorName(L)==='黑色'?'沒有光（全被濾掉）':colorName(L)+'光'}</dd></dl>
      <table class="zones"><tr><th>紙</th><th>白光下</th><th>現在看起來</th></tr>${PAPERS.map(([n,r])=>{const s=r.map((v,i)=>v*L[i]);return `<tr><td>${n}</td><td>${colorName(r)}</td><td><span class="dot" style="background:${rgbCss(s)}"></span>${colorName(s)}</td></tr>`}).join('')}</table>
      <p class="note-sm">不透明物體只反射和自己相同顏色的色光，其他色光被吸收。玻璃紙只讓和自己相同顏色的色光通過。</p>`;
    return {prims:[],handles:[],custom:'object',info};
  },
  notes:['色光三原色是紅、綠、藍，混合可以得到各種顏色；三種等量混合成白光。','不透明物體的顏色，由它反射的色光決定：紅紙只反射紅光，在綠光下看起來是黑色。','透明物體的顏色，由透過的色光決定：紅色玻璃紙只讓紅光通過。','螢幕和投影機就是用紅、綠、藍三種色光組合出各種顏色。']
});

/* ================= app state ================= */
const app={idx:0,states:{},hist:{},mode:'2d',view:{zoom:1,px:0,py:0},out:null,handles:[],hover:-1,sync:[],tool:'select',selObj:null,color:DRAW_COLORS[1],snaps:[],srcId:1,drawId:1,capturing:false};
const cur=()=>SCENES[app.idx];
const ser=st=>JSON.stringify(st,(k,v)=>k[0]==='_'?undefined:v);
const S=()=>{const id=cur().id;let st=app.states[id];if(!st){st=app.states[id]=cur().init();}if(!st.sources)st.sources=[];if(!st.draw)st.draw=[];
  if(!app.hist[id]) app.hist[id]={stack:[ser(st)],idx:0};return st;};
/* ---- undo / redo: one history of whole-scene states per scene ---- */
function pushHist(){const st=S(),h=app.hist[cur().id],s=ser(st);if(h.stack[h.idx]===s)return;h.stack.splice(h.idx+1);h.stack.push(s);if(h.stack.length>150)h.stack.shift();h.idx=h.stack.length-1;updateToolbar();}
function commit(){refresh();pushHist();}
function fixIds(st){if(!st.sources)st.sources=[];if(!st.draw)st.draw=[];
  for(const s of st.sources)app.srcId=Math.max(app.srcId,(+s.id||0)+1);
  for(const d of st.draw){if(d.id==null)d.id=app.drawId++;if(d.w==null)d.w=2.4;app.drawId=Math.max(app.drawId,(+d.id||0)+1);}}
function applyHist(dir){const h=app.hist[cur().id];if(!h)return;const ni=h.idx+dir;if(ni<0||ni>=h.stack.length)return;
  h.idx=ni;const st=JSON.parse(h.stack[ni]);app.states[cur().id]=st;fixIds(st);renderPanel();refresh();updateToolbar();}
const bounds=()=>{const b=cur().bounds;return typeof b==='function'?b(S()):b;};

function renderRail(){

function selectScene(i,fromHash){

function selSource(){const s=app.selObj;if(!s||!String(s).startsWith('u'))return null;return S().sources.find(x=>'u'+x.id===s)||null;}
function renderPanel(){
  const sc=cur(), st=S();

  els.controls.innerHTML=''; app.sync=[];

    cs.push({type:'buttons',items:[{label:'複製一份',onClick:()=>dupDraw(dr)},{label:'刪除',onClick:()=>deleteSel()}]});

function makeControl(c,st){
  const id='c-'+cur().id+'-'+(c.key||c.label||'b').toString().replace(/\W/g,'');
  const w=el('div','ctl');
  const get=()=>c.get?c.get():st[c.key], set=v=>{if(c.set)c.set(v);else st[c.key]=v;};
  if(c.type==='slider'){
    const fmt=v=>c.fmt?c.fmt(v):(Number.isInteger(c.step)?v:(+v).toFixed(1))+(c.unit?(c.unit==='°'?'°':' '+c.unit):'');
    const lab=el('label');lab.htmlFor=id;lab.innerHTML=`<span>${c.label}</span>`;const out=el('output');lab.appendChild(out);
    const inp=el('input');inp.type='range';inp.id=id;inp.min=c.min;inp.max=c.max;inp.step=c.step;inp.value=get();
    inp.oninput=()=>{set(+inp.value);c.onInput&&c.onInput(st);out.textContent=fmt(get());refresh();};
    inp.onchange=()=>pushHist();
    out.textContent=fmt(get()); w.append(lab,inp);
    app.sync.push(()=>{if(document.activeElement!==inp)inp.value=get();out.textContent=fmt(get());});
  }else if(c.type==='seg'){
    w.appendChild(el('div','lab',`<span>${c.label}</span>`));
    const g=el('div','seg');g.setAttribute('role','group');g.setAttribute('aria-label',c.label);
    for(const [v,l] of c.options){const bt=el('button',null,l);bt.type='button';bt.setAttribute('aria-pressed',get()===v?'true':'false');
      bt.onclick=()=>{set(v);c.onInput&&c.onInput(st);renderPanel();commit();};g.appendChild(bt);}
    w.appendChild(g);
    app.sync.push(()=>{[...g.children].forEach((bt,k)=>bt.setAttribute('aria-pressed',get()===c.options[k][0]?'true':'false'));});
  }else if(c.type==='toggle'){
    const lab=el('label','tog');const inp=el('input');inp.type='checkbox';inp.id=id;inp.checked=!!get();
    inp.onchange=()=>{set(inp.checked);if(c.rebuild)renderPanel();commit();};lab.append(inp,document.createTextNode(c.label));w.appendChild(lab);
    app.sync.push(()=>{inp.checked=!!get();});
  }else if(c.type==='select'){
    const lab=el('label');lab.htmlFor=id;lab.innerHTML=`<span>${c.label}</span>`;
    const s=el('select');s.id=id;for(const [v,l] of c.options){const o=el('option',null,l);o.value=v;s.appendChild(o);}s.value=get();
    s.onchange=()=>{set(s.value);commit();};w.append(lab,s);
  }else if(c.type==='swatches'){
    w.appendChild(el('div','lab',`<span>${c.label}</span>`));const r=el('div','swatches');
    for(const col of c.options){const bt=el('button');bt.type='button';bt.style.background=col;bt.setAttribute('aria-label','顏色 '+col);bt.setAttribute('aria-pressed',get()===col?'true':'false');
      bt.onclick=()=>{set(col);[...r.children].forEach(x=>x.setAttribute('aria-pressed',x===bt?'true':'false'));commit();};r.appendChild(bt);}
    w.appendChild(r);
  }else if(c.type==='buttons'){
    if(c.label) w.appendChild(el('div','lab',`<span>${c.label}</span>`));
    const r=el('div','btnrow');
    for(const it of c.items){const bt=el('button','btn'+(it.primary?' primary':''),it.label);bt.type='button';bt.disabled=!!it.disabled;
      bt.onclick=()=>{it.onClick(st);if(it.rebuild)renderPanel();commit();};r.appendChild(bt);}
    w.appendChild(r);
  }
  return w;
}

const tbtns={};
function buildToolbar(){
  els.tools.innerHTML='';
  for(const grp of TOOLBAR){const g=el('div','grp');
    for(const [id,kind,tip] of grp){const bt=el('button','tbtn');bt.type='button';bt.dataset.tip=tip;
      bt.innerHTML=(id==='color'?'<span class="sw"></span>':`<svg viewBox="0 0 20 20" aria-hidden="true">${ICON[id]}</svg>`)+`<span class="tip">${tip}</span>`;
      bt.setAttribute('aria-label',tip);
      bt.onclick=()=>toolClick(id,kind);g.appendChild(bt);tbtns[id]={bt,kind,tip};}
    els.tools.appendChild(g);}
}
function updateToolbar(){
  const sc=cur(),st=S(),tm=toolsOf(),hasOpt=!sc.noOptics&&app.out&&app.out.optics;
  for(const [id,{bt,kind,tip}] of Object.entries(tbtns)){
    let en=true,on=null;
    if(kind==='mode'){if(['point','laser','beam'].includes(id))en=!!hasOpt;on=app.tool===id;}
    else if(kind==='toggle'){en=!!tm[id];on=en&&!!st[tm[id]];}
    else if(id==='delete') en=!!(selSource()||selDraw());
    else if(id==='clear') en=st.draw.length>0;
    else if(id==='undo'){const h=app.hist[sc.id];en=!!h&&h.idx>0;}
    else if(id==='redo'){const h=app.hist[sc.id];en=!!h&&h.idx<h.stack.length-1;}
    bt.disabled=!en; if(on!==null) bt.setAttribute('aria-pressed',on?'true':'false'); else bt.removeAttribute('aria-pressed');
    const t=en?tip:tip+'（此實驗不適用）'; bt.querySelector('.tip').textContent=t; bt.setAttribute('aria-label',t);
    if(id==='color') bt.querySelector('.sw').style.background=app.color;
  }
}
function toolClick(id,kind){
  const st=S();
  if(kind==='mode'){setTool(app.tool===id&&id!=='select'?'select':id);return;}
  if(kind==='toggle'){const k=toolsOf()[id];if(!k)return;st[k]=!st[k];renderPanel();commit();return;}
  if(id==='delete') deleteSel();
  else if(id==='undo') applyHist(-1);
  else if(id==='redo') applyHist(1);
  else if(id==='clear'){st.draw=[];if(String(app.selObj||'').startsWith('d')){app.selObj=null;renderPanel();}commit();}
  else if(id==='color'){app.color=DRAW_COLORS[(DRAW_COLORS.indexOf(app.color)+1)%DRAW_COLORS.length];const d=selDraw();if(d){d.c=app.color;renderPanel();commit();}else updateToolbar();}
  else if(id==='snap') saveSnapshot();
}
function setTool(t){app.tool=t;updateToolbar();setHint();const cvs=[els.cv2,els.cv3];cvs.forEach(c=>c.style.cursor=t==='select'?'default':'crosshair');}
function setHint(){
  const m={point:'點一下畫面放置發光點（放好後可拖移）',laser:'點一下畫面放置雷射光（放好後可拖移、旋轉）',beam:'點一下畫面放置平行光源（放好後可拖移、旋轉）',
    pen:'在畫面上拖曳繪圖　·　Esc 結束',line:'拖曳畫出一條手繪光線　·　Esc 結束',ruler:'拖曳量測兩點距離（單位 cm）　·　Esc 結束'};
  els.hint.textContent=m[app.tool]||(app.mode==='2d'?'拖曳虛線圓圈可移動物體　·　點一下光源、稜鏡或繪圖可選取、拖移、旋轉與編輯　·　滾輪或雙指縮放　·　拖曳空白處平移'
    :'3D：拖曳圓點或箭頭可在實驗平面上移動物體　·　拖曳空白處旋轉　·　滾輪縮放　·　右鍵或 Shift＋拖曳平移');
}
function deleteSel(){const st=S(),s=selSource(),d=selDraw();if(s)st.sources=st.sources.filter(x=>x!==s);else if(d)st.draw=st.draw.filter(x=>x!==d);else return;app.selObj=null;renderPanel();commit();}
function selDraw(){const s=app.selObj;if(!s||!String(s).startsWith('d'))return null;return S().draw.find(x=>'d'+x.id===s)||null;}
function dupDraw(d){const c=JSON.parse(JSON.stringify(d));c.id=app.drawId++;const o=[2,-2];if(c.pts)c.pts=c.pts.map(p=>add(p,o));else{c.a=add(c.a,o);c.b=add(c.b,o);}
  S().draw.push(c);app.selObj='d'+c.id;renderPanel();commit();}
function newDraw(t,w){const it={id:app.drawId++,t,c:app.color,w:t==='ruler'?1.6:2.4,dash:false};if(t==='pen')it.pts=[w];else{it.a=w;it.b=w;if(t==='line')it.arrow=true;}return it;}
function placeSource(type,w){const st=S();const s={id:app.srcId++,type,x:w[0],y:w[1],ang:0,n:type==='point'?16:7,w:10,c:type==='laser'?SRC_COLORS[1]:type==='beam'?SRC_COLORS[5]:SRC_COLORS[0]};
  st.sources.push(s);app.selObj='u'+s.id;renderPanel();}
function addExtras(out){
  const sc=cur(),st=S(),b=bounds(); out.objects=out.objects||[];
  if(sc.noOptics||!out.optics) return;
  for(const s of st.sources){
    const d=dirOf(s.ang), starts=[];
    if(s.type==='point'){for(let i=0;i<s.n;i++){const a=s.ang+i*2*Math.PI/s.n;starts.push([[s.x,s.y],dirOf(a)]);}out.prims.push({t:'lamp',x:s.x,y:s.y,c:s.c});}
    else if(s.type==='laser'){starts.push([[s.x,s.y],d]);out.prims.push({t:'laser',x:s.x,y:s.y,dir:d,c:s.c});}
    else{const pp=[-d[1],d[0]];for(const o of lin(-s.w/2,s.w/2,s.n))starts.push([add([s.x,s.y],mul(pp,o)),d]);out.prims.push({t:'beamSrc',x:s.x,y:s.y,ang:s.ang,w:s.w,c:s.c});}
    for(const [p,dd] of starts) out.prims.push({t:'ray',pts:traceGeneric(p,dd,out.optics,b),c:s.c,w:s.type==='laser'?2:1.4,a:s.type==='point'?0.75:1});
    out.objects.push({id:'u'+s.id,x:s.x,y:s.y,ang:s.ang,label:SRC_NAMES[s.type],move:(x,y)=>{s.x=clamp(x,b[0]-5,b[1]+5);s.y=clamp(y,b[2]-5,b[3]+5);},rotate:s.type==='point'?null:(a=>{s.ang=a;})});
  }
}

/* ================= handles & gizmo ================= */
function gizmoScale(){return app.mode==='2d'?1/makeT().s:(T3.orb?T3.orb.dist*0.0011:0.1);}
function selObjData(){return (app.out&&app.out.objects||[]).find(o=>o.id===app.selObj)||null;}
function buildHandles(){
  const out=app.out,k=gizmoScale(),H=[...out.handles];
  for(const o of out.objects){
    H.push({x:o.x,y:o.y,obj:o.id,rel:!!o.move,cursor:o.move?'move':'pointer',o0:()=>({x:o.x,y:o.y}),drag:o.move?((dx,dy,s0)=>o.move(s0.x+dx,s0.y+dy)):null});
    if(app.selObj!==o.id) continue;
    const g=k*58,r=k*44;
    if(o.move){H.push({x:o.x+g,y:o.y,gz:'x',rel:true,cursor:'ew-resize',o0:()=>({x:o.x,y:o.y}),drag:(dx,dy,s0)=>o.move(s0.x+dx,s0.y)});
      H.push({x:o.x,y:o.y+g,gz:'y',rel:true,cursor:'ns-resize',o0:()=>({x:o.x,y:o.y}),drag:(dx,dy,s0)=>o.move(s0.x,s0.y+dy)});}
    if(o.rotate){const a=o.ang||0;H.push({x:o.x+r*Math.cos(a),y:o.y+r*Math.sin(a),gz:'r',cursor:'grab',o0:()=>({x:o.x,y:o.y}),
      drag:(wx,wy,s0,ev)=>{let ang=Math.atan2(wy-s0.y,wx-s0.x);const stp=(ev&&ev.shiftKey?15:1)*D2R;ang=Math.round(ang/stp)*stp;o.rotate(ang);}});}
  }
  const d=selDraw();
  if(d&&d.t!=='pen') for(const key of ['a','b']) H.push({x:d[key][0],y:d[key][1],dh:true,cursor:'crosshair',drag:(wx,wy)=>{d[key]=[wx,wy];}});
  app.handles=H;
}

let W=0,Hh=0,DPR=1;
function makeT(){const b=bounds(),pad=26,s0=Math.min((W-2*pad)/(b[1]-b[0]),(Hh-2*pad)/(b[3]-b[2]));
  const s=s0*app.view.zoom,cx=(b[0]+b[1])/2+app.view.px,cy=(b[2]+b[3])/2+app.view.py;

function renderSnaps(){
  const box=els.snaps; box.innerHTML='';
  const head=el('div','head'); const lab=el('span','lab'); lab.textContent='情境快照'+(app.snaps.length?' · '+app.snaps.length+' 個':''); head.appendChild(lab);
  const ic=el('div','icons');
  const mk=(icon,label,fn,dis)=>{const b=el('button','ibtn',SVG(icon));b.type='button';b.title=label;b.setAttribute('aria-label',label);b.disabled=!!dis;b.onclick=fn;return b;};
  ic.append(mk('snap','儲存目前情境',saveSnapshot),mk('import','匯入快照（JSON 檔，也可以拖曳到這裡）',()=>els.importFile.click()),
    mk('export','匯出全部快照為 JSON',()=>exportSnaps(app.snaps,'光學實驗台快照-'+stamp()+'.json'),!app.snaps.length));
  head.appendChild(ic); box.appendChild(head);
  if(!app.snaps.length){box.appendChild(el('div','empty','按相機圖示儲存目前的實驗情境，之後可一鍵回復，也能匯出成 JSON 檔與同學分享。'));}
  for(const s of app.snaps){
    const card=el('div','snapcard'), th=el('button','th'); th.type='button'; th.title='回復這個情境'; th.setAttribute('aria-label','回復情境 '+s.cap);
    if(s.thumb){const im=el('img');im.src=s.thumb;im.alt='';th.appendChild(im);}
    const cap=el('span','cap'); cap.textContent=s.cap; th.appendChild(cap); th.onclick=()=>restoreSnap(s); card.appendChild(th);
    const acts=el('div','acts');
    const ab=(icon,label,fn)=>{const b=el('button',null,SVG(icon));b.type='button';b.title=label;b.setAttribute('aria-label',label+'：'+s.cap);b.onclick=e=>{e.stopPropagation();fn();};return b;};
    acts.append(ab('restore','回復情境',()=>restoreSnap(s)),
      ab('export','匯出這個快照',()=>exportSnaps([s],((SCENES.find(x=>x.id===s.scene)||{}).name||'快照')+'-'+stamp()+'.json')),
      ab('delete','刪除快照',()=>deleteSnap(s)));
    card.appendChild(acts); box.appendChild(card);
  }
}

/* ================= main loop ================= */
function refresh(){
  const sc=cur(),st=S();
  app.out=sc.build(st,bounds());
  addExtras(app.out);
  if(app.selObj&&!app.out.objects.some(o=>o.id===app.selObj)&&!selDraw()){app.selObj=null;renderPanel();}
  buildHandles();
  if(app.hover>=app.handles.length) app.hover=-1;
  els.info.innerHTML=app.out.info||'';
  app.sync.forEach(f=>f());
  updateToolbar();
  redraw();
}
function setMode(m){
  if(m==='3d'&&!ensure3D()){els.err3d.hidden=false;els.cv2.hidden=true;els.cv3.hidden=true;app.mode='3d';}
  else{els.err3d.hidden=true;app.mode=m;els.cv2.hidden=m!=='2d';els.cv3.hidden=m!=='3d';}
  document.getElementById('m2d').setAttribute('aria-pressed',m==='2d');document.getElementById('m3d').setAttribute('aria-pressed',m==='3d');
  app.hover=-1; setHint(); resize(); if(T3.ok&&m==='3d') render3D(); refresh();
}
document.getElementById('m2d').onclick=()=>setMode('2d');
document.getElementById('m3d').onclick=()=>setMode('3d');
document.getElementById('resetView').onclick=()=>{app.view={zoom:1,px:0,py:0};reset3DCamera();refresh();};
document.getElementById('resetScene').onclick=()=>{app.states[cur().id]=cur().init();app.selObj=null;renderPanel();commit();};
new ResizeObserver(()=>{resize();if(app.out){buildHandles();redraw();}}).observe(els.stage);
function fromHash(){const id=(location.hash||'').slice(1);return SCENES.findIndex(s=>s.id===id);}
window.addEventListener('hashchange',()=>{const i=fromHash();if(i>=0&&i!==app.idx)selectScene(i,true);});
const hi=fromHash(); app.idx=hi>=0?hi:SCENES.findIndex(s=>s.id==='lens-image');
buildToolbar(); loadSnaps(); renderSnaps(); resize(); renderRail(); renderPanel(); reset3DCamera(); setMode('2d');
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{if(app.mode==='2d')draw2D();});
window.__optics={app,SCENES,setMode,selectScene,refresh,imageOf,S,setTool,toWorld,handlePx};
})();
</script>
