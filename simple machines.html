<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>簡單機械實驗台V3</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0f172a;--ink2:#334155;--dim:#64748b;--line:#dbe2ea;--acc:#0e7490;--accs:#cffafe;--o:#ea580c;--b:#2563eb;--g:#16a34a;--warn:#b45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=text],textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}

.app{--railw:236px;--panelw:340px;height:100vh;height:100dvh;display:grid;grid-template-columns:var(--railw) minmax(0,1fr) var(--panelw);grid-template-rows:auto minmax(0,1fr)}
.app.norail{--railw:0px}.app.norail .rail{display:none}
.app.nopanel{--panelw:0px}.app.nopanel .panel{display:none}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
.top .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0e7490,#2563eb);color:#fff;display:grid;place-items:center;font-size:19px}
.top h1{font-size:18px;margin:0;letter-spacing:.04em}
.top p{margin:0 auto 0 6px;color:var(--dim);font-size:13px}.top #panelBtn,.top #fsBtn{width:36px;height:36px;border-radius:10px;font-size:16px}

/* 左側 */
.rail{grid-column:1;grid-row:2;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px 10px 18px}
.tabs{display:flex;gap:4px;background:#eef2f7;padding:3px;border-radius:11px;margin-bottom:6px;position:sticky;top:0;z-index:2}
.tabs button{flex:1;border:0;background:none;height:38px;border-radius:9px;font-weight:700;color:var(--ink2);cursor:pointer}
.tabs button[aria-selected="true"]{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(15,23,42,.18)}
.grp{margin-top:10px}
.grp h2{font-size:12.5px;color:var(--dim);margin:0 4px 4px;display:flex;justify-content:space-between;gap:6px;letter-spacing:.05em}
.grp h2 small{font-weight:500;letter-spacing:0}
.crow{display:flex;align-items:center;gap:2px;border-radius:9px}
.crow.on{background:var(--accs)}
.sbtn{flex:1;min-width:0;text-align:left;border:0;background:none;padding:8px 8px;border-radius:9px;cursor:pointer;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn:hover{background:#f1f5f9}.crow.on .sbtn{font-weight:700;color:var(--ink)}.crow.on .sbtn:hover{background:transparent}
.sbtn b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;margin-right:6px}
.mini{flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;color:var(--dim);padding:0}
.mini:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}.mini:disabled{opacity:.3}
.mini.on{background:var(--acc);color:#fff;border-color:transparent}
.course{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:6px}
.soon{font-size:12px;color:var(--dim);margin:2px 6px}
.railfoot{margin-top:14px;display:flex;gap:6px}
.libtip{font-size:12.5px;color:var(--dim);margin:4px 4px 0}
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:grab;font-size:13px;font-weight:600;color:var(--ink2);touch-action:none}
.tile .ic{font-size:24px;line-height:1.2}.tile small{font-size:11px;font-weight:500;color:var(--dim)}
.tile:hover:not(:disabled){border-color:var(--acc);background:#f0fdff}.tile:disabled{opacity:.45;cursor:default}
.ghost{position:fixed;z-index:80;transform:translate(-50%,-120%);background:rgba(14,116,144,.95);color:#fff;padding:6px 12px;border-radius:10px;font-weight:700;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2);margin:6px 2px}
.fld select,.fld input,.fld textarea{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#f8fafc}
.fld textarea{resize:vertical}

/* 中間 */
.stagewrap{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap}
.scname{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.scname{flex:1 1 120px}.scname span{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scname small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scname small{font-size:12px;color:var(--dim)}
.sp{flex:1}
.seg{display:inline-flex;background:#e2e8f0;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:34px;padding:0 10px;border-radius:8px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(15,23,42,.2)}
.btn{height:36px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:600;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}.btn:disabled{opacity:.4}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.danger{color:#b91c1c}.btn.danger.pri{background:#dc2626;color:#fff}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn[aria-pressed="true"]{background:#ecfeff;border-color:var(--acc);color:var(--acc)}
.btn.sel select{border:0;background:none;font-weight:700;padding:0;cursor:pointer}
.ibtn{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:16px;color:var(--ink2);display:inline-grid;place-items:center;padding:0}
.ibtn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}.ibtn:disabled{opacity:.35}
.top .ibtn{width:28px;height:28px;border-radius:50%;font-weight:800;font-size:14px}
.grp2{display:inline-flex;gap:3px}
.stage{position:relative;flex:1;min-height:0;margin:0 10px 10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#eef2f6}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:rgba(15,23,42,.92);color:#fff;padding:9px 16px;border-radius:11px;font-size:14px;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}

/* 右側 */
.panel{grid-column:3;grid-row:2;overflow:auto;padding:10px 10px 24px 0;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .sub{font-weight:500;font-size:12px;color:var(--dim)}
.note{font-size:13px;color:var(--dim);margin:4px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:700;background:#f1f5f9;color:var(--ink2)}
.chip.good{background:#dcfce7;color:#166534}.chip.warn{background:#ffedd5;color:#9a3412}.chip.info{background:#dbeafe;color:#1e40af}.chip.bad{background:#fee2e2;color:#991b1b}
.rows{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14.5px}
.rows .k{display:flex;align-items:center;gap:7px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .k i{width:10px;height:10px;border-radius:3px;background:transparent;flex:none}
.rows .k i.o{background:var(--o)}.rows .k i.b{background:var(--b)}.rows .k i.y{background:#d97706}
.rows .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.rows .v.o{color:var(--o)}.rows .v.b{color:var(--b)}.rows .v.y{color:#b45309}
.rows .note2{grid-column:1/-1;font-size:12px;color:var(--dim);margin-top:-3px}
.eq{margin-top:8px;padding:7px 10px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;font-size:13.5px;text-align:center;font-variant-numeric:tabular-nums}
.warn{margin-top:8px;padding:7px 10px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:13px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ebar{margin:4px 0 9px}
.elab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);margin-bottom:3px}
.track{height:20px;border-radius:10px;background:#eef2f7;overflow:hidden}
.fill{height:100%;border-radius:10px}.fill.o{background:linear-gradient(90deg,#fb923c,#ea580c)}.fill.g{background:linear-gradient(90deg,#4ade80,#16a34a)}
.eval{font-size:13.5px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}.eval small{font-weight:500;color:var(--dim);margin-left:4px}
.verdict{padding:8px 10px;border-radius:10px;font-size:13.5px;background:#f1f5f9;color:var(--ink2)}.verdict.ok{background:#dcfce7;color:#14532d}
.utog{display:inline-flex;gap:2px;background:#eef2f7;border-radius:8px;padding:2px}
.utog button{border:0;background:none;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;color:#475569}
.utog button[aria-pressed="true"]{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(15,23,42,.2)}
.ctl{margin:6px 0}
.ctl label,.ctl .lab{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:2px}
.ctl output{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.ctl input[type=range]{width:100%;height:30px;accent-color:var(--acc);margin:0;touch-action:pan-y}
.ctl input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:#f8fafc}
.seg2{display:flex;flex-wrap:wrap;gap:4px}
.seg2 button{flex:1 0 auto;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2)}
.seg2 button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:transparent}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:8px 0 2px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--acc)}
.locked .ctl,.locked .seg2{opacity:.45;pointer-events:none}
.recwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.rec{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.rec th,table.rec td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line)}
table.rec th{background:#f1f5f9;color:#475569}
table.rec td.eqc{font-weight:800;color:var(--g)}
.story p{margin:0 0 8px;font-size:14.5px;color:var(--ink2)}
.ask{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ask li{display:flex;gap:8px;font-size:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:6px 9px}
.ask li b{color:var(--o);flex:none}

/* 對話框 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:16px 18px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .box.helpbox{width:min(800px,100%)}
.modal h2{margin:0 0 4px;font-size:19px}
.modal .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.modal textarea#jText{width:100%;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:#f8fafc}
.helpbody h3{font-size:15px;margin:12px 0 4px}
.helpbody li,.helpbody td,.helpbody p{font-size:14px;color:var(--ink2);line-height:1.7}
.helpbody table{width:100%;border-collapse:collapse}.helpbody th{text-align:left;font-size:12.5px;color:var(--dim);border-bottom:1px solid var(--line);padding:3px 6px}
.helpbody td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}.helpbody td:first-child{white-space:nowrap;font-weight:700;color:var(--ink)}
.helpbody ol,.helpbody ul{padding-left:20px;margin:0}

/* 上課模式 */
body.teach .stage{margin:0 8px 8px}

@media (max-width:1180px){.app{--railw:200px;--panelw:300px}.top p{display:none}}
@media (max-width:900px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--line);max-height:34vh}
  .stage{flex:none;height:62vh;min-height:340px}
  .panel{padding:0 10px 24px}
}
@media (pointer:coarse){.btn,.ibtn{height:42px}.ibtn{width:42px}.seg button{height:38px}.mini{width:36px;height:36px}}

@media (max-width:1300px){.hs{display:none}.seg button{padding:0 8px}}

.top .ibtn.round{width:28px;height:28px;border-radius:50%;font-weight:800;font-size:14px}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;margin:2px 0;border-radius:11px;white-space:normal}
.sbtn .ic{width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;font-size:19px;flex:none}
.sbtn small{display:block;font-size:11.5px;color:var(--dim);font-weight:500}
.sbtn.on{background:var(--accs);font-weight:700;color:var(--ink)}
.howto{margin:4px 0;padding-left:18px;font-size:12.5px;color:var(--ink2);display:grid;gap:5px}
.toolbar{gap:8px}
.toolbar .grp{display:inline-flex;gap:4px;align-items:center}
.scname{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 140px;min-width:90px}
.ibtn.big{width:46px;font-size:18px}
.ibtn.on{background:var(--acc);color:#fff;border-color:transparent}
.tlabel{font:700 13px ui-monospace,Menlo,monospace;color:var(--ink2);min-width:78px;text-align:center}
.tools button{font-size:16px;display:inline-flex;align-items:center;gap:4px}
.tools button span{font-size:13px}
.stage{background:#e6ebf0}
.rows .k.sub,.rows .v.sub{font-size:12.5px;color:var(--dim);font-weight:500}
.fill.gneg{background:linear-gradient(90deg,#86efac,#4ade80);opacity:.6}
.fill.k{background:linear-gradient(90deg,#c4b5fd,#7c3aed)}
.fill.q{background:linear-gradient(90deg,#fca5a5,#dc2626)}
.elab b{font-variant-numeric:tabular-nums}
.verdict small{font-weight:500}
.modal .box h2{margin:0}
@media (max-width:1300px){.tools button span{display:none}}

.crow{display:flex;align-items:center;gap:3px;border-radius:11px}
.crow .sbtn{flex:1;min-width:0;margin:1px 0}
.crow.on .sbtn,.crow.on .cbtn{background:var(--accs);font-weight:700}
.cbtn{flex:1;min-width:0;text-align:left;border:0;background:none;padding:7px 8px;border-radius:9px;cursor:pointer;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;margin-right:6px}
.course{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:6px}
.railfoot{margin-top:12px}
.modal textarea#jText{width:100%;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:#f8fafc}
.cbtn{white-space:normal;line-height:1.3}@media (max-width:1180px){.app{--railw:220px}}

.snapacts{display:inline-flex;gap:4px}
.snapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.snapcard{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f8fafc}
.snapcard .th{display:block;width:100%;aspect-ratio:16/10;border:0;padding:0;background:#2d5a47;cursor:pointer}
.snapcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.snapcard .nothumb{color:#e2e8f0;font-size:12px}
.snapcard .cap{padding:4px 7px 5px;line-height:1.25}
.snapcard .cap b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snapcard .cap small{font-size:11px;color:var(--dim)}
.snapcard .acts{position:absolute;top:4px;right:4px;display:flex;gap:3px}
.snapcard .acts button{width:28px;height:28px;border:0;border-radius:7px;background:rgba(15,23,42,.78);color:#fff;cursor:pointer;font-size:13px;padding:0}
.snapcard .acts button:hover{background:var(--acc)}
.modal .box.wide{width:min(1100px,100%)}
.viewer{background:#1f3a2f;border-radius:10px;overflow:hidden;display:flex;justify-content:center}
.viewer img{max-width:100%;max-height:62vh;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp select{width:100%;margin-bottom:6px;padding:6px;border:1px solid var(--line);border-radius:8px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
@media (max-width:700px){.cmp{grid-template-columns:1fr}}

/* 左右收合按鈕 */
.top .ibtn.side{flex:none;width:36px;height:36px;border-radius:10px;font-weight:800;font-size:16px;color:var(--acc)}
@media (max-width:1180px){.top p{display:block!important;visibility:hidden}}
/* 右側卡片：各自的顏色、可收合 */
.card{--cc:#64748b;--ct:#f8fafc;border-top:4px solid var(--cc);padding-top:9px}
.card h3{cursor:pointer;margin:-9px -13px 8px;padding:8px 13px;background:var(--ct);border-radius:10px 10px 0 0;color:var(--cc)}
.card h3::after{content:'▾';font-size:13px;color:var(--cc);transition:transform .15s;flex:none}
.card h3 > span:first-child{flex:1;font-weight:800}
.card.fold{padding-bottom:0}
.card.fold > :not(h3){display:none!important}
.card.fold h3{margin-bottom:0;border-radius:10px}
.card.fold h3::after{transform:rotate(-90deg)}
.c-sel{--cc:#0e7490;--ct:#ecfeff}
.c-read{--cc:#1d4ed8;--ct:#eff6ff}
.c-energy{--cc:#c2410c;--ct:#fff7ed}
.c-snap{--cc:#7e22ce;--ct:#faf5ff}
.c-story{--cc:#a16207;--ct:#fefce8}
.c-set{--cc:#475569;--ct:#f1f5f9}
.card.sel{border-color:var(--line);box-shadow:none;border-top-color:var(--cc)}
@media (max-width:900px){.app.norail .rail,.app.nopanel .panel{display:none}}

.ibtn.trash:hover:not(:disabled){border-color:#dc2626;color:#dc2626;background:#fef2f2}

/* ===== 精簡版面：減少留白，讓工作台最大 ===== */
.top{padding:4px 8px;gap:8px}
.top .logo{width:28px;height:28px;font-size:16px;border-radius:8px}
.top h1{font-size:16px}
.top .ibtn.side{width:32px;height:32px}
.toolbar{padding:4px 4px;gap:4px}
.toolbar .grp{gap:3px}
.stage{margin:0 4px 4px;border-radius:10px}
body.teach .stage{margin:0 4px 4px}
.rail{padding:6px 6px 12px}
.panel{padding:4px 4px 12px 0;gap:6px}
.card{padding:7px 10px}
.card h3{margin:-7px -10px 6px;padding:6px 10px}
.seg{padding:2px}
.seg button{padding:0 8px;height:32px}
.ibtn,.btn{height:34px}.ibtn{width:34px}
.ibtn.big{width:40px}
.tools button{font-size:17px;padding:0 9px}
#mEdit,#mTeach{font-size:17px;padding:0 9px}
.ibtn.mag[aria-pressed="true"]{background:#ecfeff;border-color:var(--acc);color:var(--acc)}
.tlabel{min-width:70px}
@media (pointer:coarse){.btn,.ibtn{height:40px}.ibtn{width:40px}.seg button{height:36px}}
/* 垃圾桶：紅色 */
.ibtn.trash{color:#dc2626;border-color:#fecaca;background:#fef2f2}
.ibtn.trash:hover:not(:disabled){border-color:#dc2626;background:#fee2e2;color:#b91c1c}
.ibtn.trash:disabled{color:#dc2626;opacity:.35}
/* 數值輸入 */
.numrow{display:flex;align-items:center;gap:6px}
.numrow input[type=range]{flex:1}
.numrow input.num{width:64px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#f8fafc;font-weight:700;text-align:right;-webkit-user-select:text;user-select:text}
.numrow .unit{font-weight:700;color:var(--ink2)}

.scnav{flex:1;min-width:0;display:flex;align-items:center;gap:4px;margin-left:8px}
.top .scnav .ibtn{width:30px;height:30px;border-radius:8px;font-size:13px;font-weight:400}
.top .scname{flex:0 1 auto;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.ibtn.spd{width:40px;font-weight:800;font-size:13px}.ibtn.spd.slow{background:#fff7ed;border-color:#fb923c;color:#c2410c}
.toolbar .ibtn{width:32px}.toolbar .ibtn.big{width:38px}.toolbar .ibtn.spd{width:36px}
.tools button,#mEdit,#mTeach{padding:0 7px}
.tlabel{min-width:62px;font-size:12px}

/* 左側最下方固定的按鈕列 */
.rail{display:flex;flex-direction:column}
.railfoot{position:sticky;bottom:-12px;margin:auto -6px -12px;padding:8px 6px 10px;background:#fff;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.railfoot .btn{flex:1 1 auto;justify-content:center}
/* 專注模式（瀏覽器不允許全螢幕時）：只留工具列和工作台 */
.fs2{display:none}
body.focus .top,body.focus .rail,body.focus .panel{display:none!important}
body.focus .app{grid-template-columns:0 minmax(0,1fr) 0;grid-template-rows:0 minmax(0,1fr)}
body.focus .fs2{display:inline-grid}

/* 工具列：所有按鈕同一個高度 */
.toolbar{align-items:center}
.toolbar .seg{padding:2px;height:34px;box-sizing:border-box;align-items:center}
.toolbar .seg button{height:30px}
.toolbar .ibtn,.toolbar .btn{height:34px;box-sizing:border-box}
@media (pointer:coarse){.toolbar .seg{height:40px}.toolbar .seg button{height:36px}.toolbar .ibtn,.toolbar .btn{height:40px}}
.toolbar .grp{margin:0}

</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="ibtn side" id="railTog" type="button" aria-label="收合或展開左側" aria-expanded="true">⟨</button>
    <span class="logo">⚙</span><h1>簡單機械實驗台</h1>
    <button class="ibtn round" id="helpBtn" type="button" title="使用說明" aria-label="使用說明">?</button>
    <div class="scnav"><button class="ibtn" id="prevBtn" type="button" title="上一個情境" aria-label="上一個情境">◀</button><div class="scname" id="sceneName"></div><button class="ibtn" id="nextBtn" type="button" title="下一個情境" aria-label="下一個情境">▶</button></div>
    <button class="ibtn side" id="fsBtn" type="button" title="全螢幕" aria-label="全螢幕">⛶</button>
    <button class="ibtn side" id="panelTog" type="button" aria-label="收合或展開右側面板" aria-expanded="true">⟩</button>
  </header>
  <nav class="rail" id="rail" aria-label="情境與元件"></nav>
  <main class="stagewrap">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="模式"><button id="mEdit" type="button" title="編輯模式：組裝、調整元件" aria-label="編輯模式">✏️</button><button id="mTeach" type="button" title="上課模式：鎖定的元件不能移動" aria-label="上課模式">🎓</button></div>
      <div class="grp play">
        <button class="ibtn big" id="playBtn" type="button" title="播放（空白鍵）" aria-label="播放或暫停">▶</button>
        <button class="ibtn" id="stopBtn" type="button" title="停止：物體留在目前位置，回到可以編輯的狀態" aria-label="停止">■</button>
        <button class="ibtn" id="stepBtn" type="button" title="單步" aria-label="單步">⏭</button>
        <button class="ibtn" id="resetBtn" type="button" title="重設到播放前" aria-label="重設">↺</button>
        <span class="tlabel" id="tLabel">t = 0.00 s</span>
        <button class="ibtn spd" id="speedBtn" type="button" title="播放速度（點一下切換 1×、½×、¼×）" aria-label="播放速度">1×</button>
      </div>
      <div class="seg tools" id="tools" role="group" aria-label="工具">
        <button data-tool="select" type="button" title="選取／移動（Esc）">✋</button>
        <button data-tool="scale" type="button" title="手拉式彈簧秤">⚖️</button>
        <button data-tool="force" type="button" title="在物體上畫力">➚</button>
        <button data-tool="rope" type="button" title="拉繩子連接兩個物件">〰</button>
        <button data-tool="pin" type="button" title="用轉軸釘把物體釘在一起或釘在黑板上">📌</button>
      </div>
      <div class="grp">
        <button class="ibtn mag" id="snapBtn" type="button" title="磁吸對齊格線" aria-label="磁吸對齊格線">🧲</button>
        <button class="ibtn" id="undoBtn" type="button" title="復原 Ctrl+Z" aria-label="復原">↶</button>
        <button class="ibtn" id="redoBtn" type="button" title="重做" aria-label="重做">↷</button>
        <button class="ibtn trash" id="delBtn" type="button" title="刪除選取的物件（Delete）" aria-label="刪除選取的物件">🗑</button>
        <button class="ibtn" id="shotBtn" type="button" title="拍快照（P）" aria-label="拍快照">📷</button>
        <button class="ibtn" id="viewBtn" type="button" title="重設視角" aria-label="重設視角">⤢</button>
        <button class="ibtn fs2" id="fsBtn2" type="button" title="離開專注模式" aria-label="離開專注模式">🗗</button>
      </div>
    </div>
    <section class="stage" id="stage" aria-label="工作台">
      <canvas id="cv"></canvas>
      <div id="toast" hidden></div>
      <div id="flash"></div>
    </section>
  </main>
  <aside class="panel" id="panel" aria-label="面板">
    <section class="card sel c-sel" id="selbox" hidden></section>
    <section class="card c-read" id="readout"></section>
    <section class="card c-energy" id="energy"></section>
    <section class="card story c-story" id="story"></section>
    <section class="card c-set" id="settings"></section>
    <section class="card c-snap" id="snaps"></section>
  </aside>
</div>
<div class="modal" id="modal" hidden></div>
<script>

    head1: '<path d="M3 10h14M12.5 6l4.5 4-4.5 4"/>',

  };
  const svg = k => `<svg viewBox="0 0 20 20" aria-hidden="true">${ICON[k]}</svg>`;

  const TOOL_INFO = {
    select:      { name: '選取', key: 'V', hint: '點標註可選取、拖移；拖兩端方塊可調整；雙擊文字或描點可修改' },

    highlighter: { name: '螢光筆', key: 'H', hint: '半透明粗線，用來強調區域' },
    line:        { name: '直線', key: 'L', hint: 'Shift：鎖定 15° 倍數；端點會吸附重要位置' },
    arrow:       { name: '箭頭／光線', key: 'A', hint: 'Shift：鎖定 15° 倍數；樣式列可切換「中段箭頭」畫光線' },
    ellipse:     { name: '圓／橢圓', key: 'O', hint: '拖曳畫出橢圓；Shift：正圓' },
    point:       { name: '描點', key: 'D', hint: '自動標 A、B、C…；靠近光線轉折點、元件中心或像時會吸附' },
    text:        { name: '文字', key: 'T', hint: '點一下打字，Enter 完成、Shift+Enter 換行、Esc 取消；點已有文字可修改' },
    ruler:       { name: '量尺', key: 'M', hint: '拖曳量兩點距離與角度；Shift：鎖定 15° 倍數' },
    laser:       { name: '雷射筆', key: 'K', hint: '上課指示用，軌跡會自動消失、不會留下' },
    eraser:      { name: '橡皮擦', key: 'E', hint: '點或拖過哪個標註就刪掉哪個' }
  };

  const DEFAULTS = {
    position: 'top-left',                // top-left | top-right | bottom-left | bottom-right
    collapsed: true,                     // 預設收合
    rememberCollapsed: false,            // true：記住上次展開/收合（localStorage）
    storageKey: 'sketch-layer',
    tools: ['select', 'pen', 'highlighter', 'line', 'arrow', 'ellipse', 'point', 'text', 'ruler', 'laser', 'eraser'],
    colors: ['#facc15', '#f8fafc', '#f87171', '#4ade80', '#22d3ee', '#e879f9', '#fb923c'],
    customColor: true,
    widths: [[2, '細'], [3.5, '中'], [6, '粗']],
    textSizes: [[16, '小'], [22, '中'], [30, '大']],

    shortcuts: true,
    palmRejection: true,                 // 偵測到觸控筆後，手指觸控不畫圖（交給宿主平移）
    exportButton: true,
    theme: 'dark',                       // dark | light
    font: '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif'
  };

  const CSS = `
.sk-root{--sk-bg:rgba(15,23,42,.92);--sk-line:rgba(148,163,184,.25);--sk-fg:#cbd5e1;--sk-dim:#94a3b8;--sk-hover:rgba(148,163,184,.16);--sk-accent:#06b6d4;--sk-on:#03121a;

  font:13px/1.25 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
.sk-root.sk-light{--sk-bg:rgba(255,255,255,.94);--sk-line:rgba(15,23,42,.14);--sk-fg:#334155;--sk-dim:#64748b;--sk-hover:rgba(15,23,42,.07);--sk-accent:#0891b2;--sk-on:#fff}
.sk-root>*{pointer-events:auto}
.sk-tl{top:12px;left:12px}.sk-tr{top:12px;right:12px;align-items:flex-end}
.sk-bl{bottom:12px;left:12px;flex-direction:column-reverse}.sk-br{bottom:12px;right:12px;align-items:flex-end;flex-direction:column-reverse}
.sk-panel{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:5px;background:var(--sk-bg);border:1px solid var(--sk-line);border-radius:12px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.28)}

  overflow:hidden;white-space:pre;font-weight:700;line-height:1.25;min-width:60px}
.sk-text[hidden]{display:none}
.sk-toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:45;padding:7px 14px;border-radius:9px;background:rgba(15,23,42,.94);color:#e2e8f0;
  font:13px system-ui,"Noto Sans TC",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none;transition:opacity .2s}
.sk-toast[hidden]{display:none}`;

  function injectCSS() {
    if (document.getElementById('sk-style')) return;
    const s = document.createElement('style');
    s.id = 'sk-style'; s.textContent = CSS;
    document.head.appendChild(s);
  }

  const DRAW_TOOLS = ['pen', 'highlighter', 'line', 'arrow', 'ellipse', 'point', 'text', 'ruler'];
  const clone = o => JSON.parse(JSON.stringify(o));
  const hypot = Math.hypot;
  function distToSeg(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy;
    const t = L2 ? Math.max(0, Math.min(1, ((p.x - a.x) * vx + (p.y - a.y) * vy) / L2)) : 0;
    return hypot(p.x - a.x - t * vx, p.y - a.y - t * vy);
  }

  function create(canvas, host = {}, options = {}) {
    injectCSS();
    const opt = Object.assign({}, DEFAULTS, options);
    opt.units = Object.assign({}, DEFAULTS.units, options.units || {});

      toWorld: (sx, sy) => ({ x: sx, y: sy }),
      toScreen: (x, y) => ({ x, y }),
      zoom: () => 1,
      snapPoints: () => [],
      gridSize: 0,
      hitTest: null, onChange: null, onCommit: null, zoomBy: null, panBy: null
    }, host);

    /* ---------- 狀態 ---------- */
    const st = {
      items: [], nextId: 1, tool: 'select', selId: null, visible: true,
      style: { color: opt.colors[0], width: opt.widths[1] ? opt.widths[1][0] : opt.widths[0][0], size: opt.textSizes[1] ? opt.textSizes[1][0] : opt.textSizes[0][0], dash: false, head: 1 },
      current: null, gesture: null, eraser: null, laser: [], sawPen: false, space: false,
      touches: new Map(), pinch: null, hist: { stack: ['[]'], idx: 0 }, lastTap: { id: null, t: 0 },
      collapsed: opt.collapsed, cursorSet: false
    };
    if (opt.rememberCollapsed) { try { const v = localStorage.getItem(opt.storageKey + ':collapsed'); if (v != null) st.collapsed = v === '1'; } catch (e) {} }

    /* ---------- DOM ---------- */
    const parent = canvas.parentElement;
    if (getComputedStyle(parent).position === 'static') parent.style.position = 'relative';

    /* ---------- 工具切換、收合 ---------- */

    }
    function saveCollapsed() { if (opt.rememberCollapsed) { try { localStorage.setItem(opt.storageKey + ':collapsed', st.collapsed ? '1' : '0'); } catch (e) {} } }

    function collapse() { setTool('select'); st.selId = null; st.collapsed = true; saveCollapsed(); refreshUI(); render(); fab.focus({ preventScroll: true }); }
    function setVisible(v) { st.visible = v; if (!v) { st.selId = null; if (st.tool !== 'select' && st.tool !== 'laser') setTool('select'); } refreshUI(); render(); }

    /* ---------- 歷史與變更通知 ---------- */

      } else if (H.onCommit) H.onCommit(reason, item);

    function restore(s) { st.items = JSON.parse(s); fixIds(); if (!selItem()) st.selId = null; refreshUI(); render(); if (H.onChange) H.onChange(clone(st.items), { reason: 'history', item: null }); }

    function fixIds() { st.items.forEach(d => { if (d.id == null) d.id = st.nextId++; st.nextId = Math.max(st.nextId, d.id + 1); }); }
    function clear() {

    function duplicate() {
      const d = selItem(); if (!d) return;

    }
    function moveItem(d, dx, dy) {
      if (d.pts) d.pts = d.pts.map(p => [p[0] + dx, p[1] + dy].concat(p.length > 2 ? [p[2]] : []));
      if (d.a) { d.a = [d.a[0] + dx, d.a[1] + dy]; d.b = [d.b[0] + dx, d.b[1] + dy]; }
      if (d.x != null) { d.x += dx; d.y += dy; }
    }
    function nextPointLabel() {
      const used = new Set(st.items.filter(d => d.t === 'point').map(d => d.label));
      for (let i = 0; i < 26; i++) { const L = String.fromCharCode(65 + i); if (!used.has(L)) return L; }
      let k = 1; while (used.has('P' + k)) k++; return 'P' + k;
    }

    /* ---------- 座標、吸附 ---------- */
    let rect = canvas.getBoundingClientRect();
    const scr = (p) => H.toScreen(p[0], p[1]);
    const wld = (sx, sy) => { const w = H.toWorld(sx, sy); return [w.x, w.y]; };
    const K = () => opt.scaleWithZoom ? (H.zoom() || 1) : 1;
    const coarse = () => matchMedia('(pointer:coarse)').matches;
    function evPos(e) { rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

    function snapScreen(sp) {                         // 回傳世界座標
      const R = opt.snapRadius;
      let best = null, bd = R;

      (H.snapPoints() || []).concat(own).forEach(q => { const s = H.toScreen(q.x, q.y), d = hypot(s.x - sp.x, s.y - sp.y); if (d < bd) { bd = d; best = q; } });

    }
    function lockAngle(a, sp) {                        // 在螢幕上鎖定角度

    }
    function rulerLabel(d) {

      const A = scr(d.a), B = scr(d.b);

    /* ---------- 命中測試（螢幕座標） ---------- */
    function textBox(d) {

    }

      }

      if (d.t === 'text') { const b = textBox(d); return p.x > b.x - tol && p.x < b.x + b.w + tol && p.y > b.y - tol && p.y < b.y + b.h + tol; }

    function topHit(p, tol) {                       // 描點、文字目標小，優先選到
      for (const pass of [d => d.t === 'point' || d.t === 'text', () => true])
        for (let i = st.items.length - 1; i >= 0; i--) if (pass(st.items[i]) && hitItem(st.items[i], p, tol)) return st.items[i];
      return null;
    }
    function handleHit(p) {
      const d = selItem(); if (!d || !d.a) return null;
      const lim = coarse() ? 22 : 12;
      for (const key of ['b', 'a']) { const s = scr(d[key]); if (hypot(s.x - p.x, s.y - p.y) < lim) return key; }

    }

    /* ---------- 繪製 ---------- */
    let raf = 0;
    function render() { if (!raf) raf = requestAnimationFrame(paint); }
    function syncOverlay() {
      const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
      overlay.style.left = canvas.offsetLeft + 'px'; overlay.style.top = canvas.offsetTop + 'px';
      overlay.style.width = w + 'px'; overlay.style.height = h + 'px';
      if (overlay.width !== Math.round(w * dpr) || overlay.height !== Math.round(h * dpr)) { overlay.width = Math.round(w * dpr); overlay.height = Math.round(h * dpr); }

    function strokeSmooth(c, pts) {

// 吸附用的點（局部座標）
function anchorPoints(p) {

/* ---------- 姿態來源：編輯時用模型，執行時用物理物體 ---------- */
function poseOf(id) {

/* ---------- 繩子節點（給引擎與繪圖共用） ---------- */
function ropeNodes(m, rope, bodyOf) {
  const end = e => {
    if (!e.part) return { body: Phys.WORLD, lp: [e.wx, e.wy], r: 0 };
    const p = partOf(m, e.part);
    if (!p) return { body: Phys.WORLD, lp: [e.wx || 0, e.wy || 0], r: 0 };
    if (p.type === 'pivot' || p.type === 'pulley') return { body: Phys.WORLD, lp: [p.x, p.y], r: 0 };
    const body = bodyOf ? bodyOf[p.id] : fakeBody(p);

    else nodes.push({ body: bodyOf ? bodyOf[q.id] : fakeBody(q), lp: [0, 0], r: q.r, s: v.s });

/* ---------- 建立物理世界 ---------- */
function buildWorld(m) {
  const W = new Phys.World({ iters: 40, mu: m.mu, damp: m.damp == null ? 3 : m.damp });
  const bodyOf = {};
  const box = (w, h) => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
  // 桌面與左右擋板（黑板框）
  W.add({ isStatic: true, id: 'floor', x: m.W / 2, y: -0.1, verts: box(m.W + 1, 0.2) });
  W.add({ isStatic: true, id: 'wallL', x: -0.1, y: m.H, verts: box(0.2, m.H * 3) });
  W.add({ isStatic: true, id: 'wallR', x: m.W + 0.1, y: m.H, verts: box(0.2, m.H * 3) });
  for (const p of m.parts) if (p.type === 'pulley') W.add({ isStatic: true, id: p.id, x: p.x, y: p.y, r: p.r });
  for (const p of m.parts) {
    if (!isBody(p)) continue;
    const def = { id: p.id, x: p.x, y: p.y, a: p.a || 0, m: p.type === 'handle' ? 0.1 : p.m, I: inertia(p), verts: polyOf(p), group: null };
    if (p.type === 'handle') { def.gScale = 0; def.noCollide = true; def.dampAll = true; }
    if (p.type === 'mpulley' || p.type === 'wheel') def.noCollide = true;
    if (p.type === 'incline' && p.fixed) { def.isStatic = true; }
    if (p.type === 'plank' && !m.leverWeight) def.gScale = 0;
    const bd = W.add(def); bd.a0 = bd.a; bodyOf[p.id] = bd;
  }
  for (const j of m.pins) {
    const A = bodyOf[j.a]; if (!A) continue;
    const bp = j.b && partOf(m, j.b);
    if (!bp || bp.type === 'pivot' || bp.type === 'pulley') { const wp = bp ? [bp.x, bp.y] : j.lb; W.pins.push({ a: A, b: null, la: j.la, lb: wp, id: j.id }); }
    else if (bodyOf[j.b]) W.pins.push({ a: A, b: bodyOf[j.b], la: j.la, lb: j.lb, id: j.id });
  }
  for (const r of m.ropes) {
    const rope = { id: r.id, nodes: ropeNodes(m, r, bodyOf) };
    rope.L = Math.max(r.L || 0, Phys.ropeGeom(rope).total); W.ropes.push(rope);
  }
  for (const s of m.scales) {
    const b = bodyOf[s.hook.part]; if (!b) continue;
    const hk = pW(b, s.hook.lx, s.hook.ly), dx = s.hand[0] - hk[0], dy = s.hand[1] - hk[1], d = Math.hypot(dx, dy) || 1;
    let Mref = 0; for (const id of linkedParts(s.hook.part)) { const q = partOf(m, id); if (q && isBody(q) && q.type !== 'handle' && !(q.type === 'incline' && q.fixed)) Mref += q.m || 0; }
    W.springs.push({ id: s.id, body: b, lp: [s.hook.lx, s.hook.ly], hand: s.hand.slice(), target: s.hand.slice(), L0: s.L0, k: s.k, zeta: 1, Mref,
      mode: s.mode || 'hand', v: s.v || 0.05, maxDist: s.maxDist || 0.3, dir: [dx / d, dy / d], moved: 0, tRun: 0 });
  }
  for (const f of m.forces) {
    const b = bodyOf[f.part]; if (!b) continue;
    W.forces.push({ id: f.id, body: b, lp: [f.lx, f.ly], ang: f.ang, a0: b.a, follow: !!f.follow, N: f.mag * KGW, mode: f.mode, v: f.v, maxDist: f.maxDist, allowPush: false, target: null, work: 0, dist: 0 });
  }
  return { W, bodyOf };
}

/* ================= 2D 繪製：磁吸黑板、桌面、元件、繩子、力 ================= */
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const V = { s: 600, ox: 40, oy: 600, dpr: 1, w: 800, h: 600 };
const toS = (x, y) => [V.ox + x * V.s, V.oy - y * V.s];

let ctx = null;

function worldTf() { ctx.setTransform(V.dpr * V.s, 0, 0, -V.dpr * V.s, V.dpr * V.ox, V.dpr * V.oy); }

function label(str, wx, wy, o = {}) {

  c.font = `${o.weight || 700} ${px}px ${FONT}`; c.textAlign = o.align || 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(str).width, dx = o.dx || 0, dy = o.dy || 0;
  if (o.bg) { const pad = 5, h = px + 8, L = (o.align === 'left' ? sx : o.align === 'right' ? sx - tw : sx - tw / 2) - pad + dx; c.fillStyle = o.bg; rr(c, L, sy - h / 2 + dy, tw + pad * 2, h, h / 2); c.fill(); }
  c.fillStyle = o.color || '#fff'; c.fillText(str, sx + dx, sy + dy); worldTf();

/* ---------- 黑板與桌面 ---------- */
function drawBench(m) {
  const c = ctx, W = m.W, H = m.H, F = 0.035;

  c.fillStyle = '#8a5528'; c.fillRect(-F, -0.06, W + 2 * F, 0.06);
  // 黑板

  const g = c.createRadialGradient(W * 0.4, H * 0.7, 0.1, W * 0.5, H * 0.5, W * 0.8); g.addColorStop(0, 'rgba(255,255,255,.05)'); g.addColorStop(1, 'rgba(0,0,0,.12)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // 粉筆格線：5 cm 細、25 cm 粗
  const lw = 1 / V.s;
  for (let x = 0; x <= W + 1e-6; x += m.grid) { const major = Math.abs(Math.round(x * 100) % 25) < 0.5; c.strokeStyle = COL.chalk + (major ? '.22)' : '.09)'); c.lineWidth = lw * (major ? 1.4 : 1); c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = 0; y <= H + 1e-6; y += m.grid) { const major = Math.abs(Math.round(y * 100) % 25) < 0.5; c.strokeStyle = COL.chalk + (major ? '.22)' : '.09)'); c.lineWidth = lw * (major ? 1.4 : 1); c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  // 桌面
  c.fillStyle = '#d6a66d'; c.fillRect(-F, -0.012, W + 2 * F, 0.012);
  c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, 0, W, 0.004);
  for (let x = 0; x <= W + 1e-6; x += 0.25) label(String(Math.round(x * 100)), x, -0.035, { px: 10.5, color: 'rgba(255,240,220,.85)', weight: 600 });
  for (let y = 0.25; y <= H + 1e-6; y += 0.25) label(String(Math.round(y * 100)), -0.018, y, { px: 10.5, color: 'rgba(255,240,220,.85)', weight: 600 });
}

/* ---------- 元件 ---------- */
function drawPart(p, q, sel) {
  const c = ctx;
  c.save(); c.translate(q.x, q.y); c.rotate(q.a || 0);
  const lw = 1 / V.s;
  switch (p.type) {
    case 'plank': {
      const a = p.L / 2, b = p.T / 2;
      c.fillStyle = '#e7b67a'; c.strokeStyle = '#7c4a1e'; c.lineWidth = 1.4 * lw; rr(c, -a, -b, p.L, p.T, 0.004); c.fill(); c.stroke();
      c.fillStyle = 'rgba(124,74,30,.25)'; c.fillRect(-a, -b, p.L, p.T * 0.3);
      const n = Math.round(p.L / 0.05);
      for (let i = 0; i <= n; i++) { const x = -a + i * p.L / n; c.fillStyle = '#5b3410'; circ(c, x, 0, Math.min(0.0045, b * 0.4)); c.fill(); }
      break;
    }
    case 'block': {
      const a = p.w / 2, b = p.h / 2;
      c.fillStyle = '#93c5fd'; c.strokeStyle = '#1e40af'; c.lineWidth = 1.6 * lw; rr(c, -a, -b, p.w, p.h, Math.min(0.008, a * 0.3)); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-a + 0.004, b - p.h * 0.22, p.w - 0.008, p.h * 0.12);
      break;
    }
    case 'pivot': {
      c.fillStyle = 'rgba(0,0,0,.3)'; circ(c, 0.002, -0.002, 0.019); c.fill();
      c.fillStyle = '#dc2626'; circ(c, 0, 0, 0.018); c.fill(); c.fillStyle = '#e5e7eb'; circ(c, 0, 0, 0.009); c.fill();
      c.fillStyle = '#374151'; circ(c, 0, 0, 0.0035); c.fill();
      break;
    }
    case 'pulley': case 'mpulley': {
      const r = p.r;
      if (p.type === 'pulley') { c.fillStyle = '#6b7280'; rr(c, -0.008, 0, 0.016, r + 0.03, 0.004); c.fill(); }
      c.fillStyle = '#9ca3af'; circ(c, 0, 0, r); c.fill(); c.strokeStyle = '#374151'; c.lineWidth = 1.5 * lw; c.stroke();
      c.strokeStyle = '#4b5563'; c.lineWidth = 1 * lw; circ(c, 0, 0, r * 0.82); c.stroke();
      c.fillStyle = '#e5e7eb'; circ(c, 0, 0, r * 0.3); c.fill(); c.fillStyle = '#1f2937'; circ(c, 0, 0, r * 0.12); c.fill();
      if (p.type === 'mpulley') { c.strokeStyle = '#d1d5db'; c.lineWidth = 2.2 * lw; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r - 0.012); c.stroke(); }
      break;
    }
    case 'incline': {
      const V = triOf(p);
      c.beginPath(); V.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath();
      c.fillStyle = p.fixed ? '#cbd5e1' : '#e2c9a0'; c.fill(); c.strokeStyle = '#475569'; c.lineWidth = 1.6 * lw; c.stroke();
      c.save(); c.clip(); c.strokeStyle = 'rgba(71,85,105,.18)'; c.lineWidth = 1 * lw;
      for (let k = -1; k < 2; k += 0.025) { c.beginPath(); c.moveTo(k, -0.5); c.lineTo(k + 0.6, 0.5); c.stroke(); } c.restore();
      break;

      c.fillStyle = '#fbbf24'; circ(c, 0, 0, p.R); c.fill(); c.strokeStyle = '#92400e'; c.lineWidth = 1.8 * lw; c.stroke();
      c.strokeStyle = '#b45309'; c.lineWidth = 1.2 * lw; circ(c, 0, 0, p.R * 0.88); c.stroke();
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; c.beginPath(); c.moveTo(Math.cos(a) * p.r, Math.sin(a) * p.r); c.lineTo(Math.cos(a) * p.R * 0.88, Math.sin(a) * p.R * 0.88); c.stroke(); }
      c.fillStyle = '#78716c'; circ(c, 0, 0, p.r); c.fill(); c.strokeStyle = '#292524'; c.lineWidth = 1.6 * lw; c.stroke();
      c.fillStyle = '#e7e5e4'; circ(c, 0, 0, Math.min(0.008, p.r * 0.3)); c.fill();
      c.strokeStyle = '#ef4444'; c.lineWidth = 2 * lw; c.beginPath(); c.moveTo(p.r, 0); c.lineTo(p.R * 0.88, 0); c.stroke();   // 看得出轉動的記號

}
function drawSelOutline(p, q) {
  const c = ctx, lw = 1 / V.s; c.save(); c.strokeStyle = COL.sel; c.lineWidth = 2.2 * lw; c.setLineDash([6 * lw, 4 * lw]);

  else { const r = (p.type === 'pivot' ? 0.018 : p.type === 'handle' ? 0.016 : p.type === 'wheel' ? p.R : p.r) + 0.01; circ(c, q.x, q.y, r); c.stroke(); }
  c.restore();
}
function drawPin(wp, sel) { const c = ctx; c.fillStyle = COL.pin; circ(c, wp[0], wp[1], 0.0065); c.fill(); c.strokeStyle = '#78350f'; c.lineWidth = 1.2 / V.s; c.stroke(); if (sel) { c.strokeStyle = COL.sel; c.lineWidth = 2 / V.s; circ(c, wp[0], wp[1], 0.013); c.stroke(); } }

/* ---------- 繩子 ---------- */
function drawRope(G, nodes, sel, T, L) {
  const c = ctx, lw = 1 / V.s, slack = L != null ? L - G.total : 0;
  c.strokeStyle = sel ? COL.sel : COL.rope; c.lineWidth = (sel ? 3.2 : 2.4) * lw; c.lineCap = 'round';
  c.beginPath();
  const free = G.segs.reduce((a, s) => a + s.len, 0) || 1;
  G.segs.forEach((s, i) => {
    c.moveTo(s.T1[0], s.T1[1]);
    if (slack > 0.002) {      // 繩子比距離長：畫成下垂
      const extra = slack * s.len / free, sag = Math.sqrt(Math.max(0, (s.len + extra) ** 2 - s.len ** 2)) * 0.45;
      let nx = -s.u[1], ny = s.u[0]; if (ny > 0 || (Math.abs(ny) < 0.2 && nx < 0)) { nx = -nx; ny = -ny; }   // 往下垂；直的繩子往旁邊彎
      c.quadraticCurveTo((s.T1[0] + s.T2[0]) / 2 + nx * sag * 2, (s.T1[1] + s.T2[1]) / 2 + ny * sag * 2, s.T2[0], s.T2[1]);
    } else c.lineTo(s.T2[0], s.T2[1]);
    const nd = nodes[i + 1];
    if (nd.r && i + 1 < G.segs.length) {
      const C = G.C[i + 1], a1 = Math.atan2(s.T2[1] - C[1], s.T2[0] - C[0]), n2 = G.segs[i + 1].T1, a2 = Math.atan2(n2[1] - C[1], n2[0] - C[0]);
      c.moveTo(s.T2[0], s.T2[1]); c.arc(C[0], C[1], nd.r, a1, a2, nd.s > 0);
    }
  });

  for (const s of [G.segs[0].T1, G.segs[G.segs.length - 1].T2]) { c.fillStyle = COL.rope; circ(c, s[0], s[1], 0.004); c.fill(); }
  for (const i of [0, nodes.length - 1]) { const nd = nodes[i]; if (!nd.wind) continue; const C = G.C[i]; c.strokeStyle = COL.rope; c.lineWidth = 3 * lw; circ(c, C[0], C[1], nd.r - 1.5 * lw); c.stroke(); }

    const mx = (best.T1[0] + best.T2[0]) / 2, my = (best.T1[1] + best.T2[1]) / 2;
    const side = mx < G.C[0][0] - 0.005 ? -1 : 1;
    label(`T = ${fmtF(T)}`, mx, my, { px: 12, color: '#fef3c7', bg: 'rgba(20,40,32,.8)', dx: side * 40 });
  }
}

/* ---------- 手拉式彈簧秤：手把在 hand，外殼往掛勾方向，拉桿伸出 ---------- */

  const c = ctx, lw = 1 / V.s, dx = hook[0] - hand[0], dy = hook[1] - hand[1], d = Math.hypot(dx, dy) || 1e-9, ux = dx / d, uy = dy / d;
  const body = 0.11, ang = Math.atan2(uy, ux);
  c.save(); c.translate(hand[0], hand[1]); c.rotate(ang);
  // 手把（圓環）
  c.strokeStyle = '#fb923c'; c.lineWidth = 3.6 * lw; circ(c, -0.016, 0, 0.014); c.stroke();

  // 刻度與指針
  c.strokeStyle = '#92400e'; c.lineWidth = 1 * lw;
  for (let k = 0; k <= 10; k++) { const x = 0.012 + k * 0.0085; c.beginPath(); c.moveTo(x, 0.013); c.lineTo(x, k % 5 ? 0.007 : 0.002); c.stroke(); }
  const ext = Math.max(0, d - L0), px = 0.012 + Math.min(10, (F || 0) / 9.8 * 2) * 0.0085;
  c.fillStyle = '#dc2626'; c.fillRect(px - 0.0015, -0.012, 0.003, 0.024);
  // 拉桿與掛勾
  const rodEnd = d; c.strokeStyle = '#475569'; c.lineWidth = 2 * lw; c.beginPath(); c.moveTo(body, 0); c.lineTo(rodEnd - 0.008, 0); c.stroke();
  c.beginPath(); c.arc(rodEnd - 0.004, 0.004, 0.005, Math.PI * 0.9, Math.PI * 2.4); c.stroke();
  // 彈簧伸長的部分（鋸齒）
  if (ext > 0.002) { c.strokeStyle = '#64748b'; c.lineWidth = 1.2 * lw; const x0 = body, x1 = Math.min(rodEnd - 0.01, body + ext), n = 8; c.beginPath(); c.moveTo(x0, 0); for (let i = 1; i <= n; i++) c.lineTo(x0 + (x1 - x0) * i / n, i % 2 ? 0.006 : -0.006); c.stroke(); }
  c.restore();
  label(kgwTxt, hand[0] + ux * body / 2, hand[1] + uy * body / 2, { px: 13, color: '#7c2d12', bg: 'rgba(255,251,235,.95)', dx: 52 });
}

/* ---------- 角度標示：從點 p 沿方向 u 的線段和水平線的夾角 ---------- */
function angleOf(u) { return Math.acos(Math.min(1, Math.abs(u[0]))) * 180 / Math.PI; }
function drawAngleMark(p, u, color, extra) {
  const c = ctx, lw = 1 / V.s, sx = u[0] < -1e-6 ? -1 : 1, R = 0.045, deg = angleOf(u);
  c.save(); c.strokeStyle = color || '#e0f2fe'; c.lineWidth = 1.4 * lw; c.setLineDash([4 * lw, 3 * lw]);
  c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[0] + sx * R * 1.5, p[1]); c.stroke(); c.setLineDash([]);
  const a0 = sx > 0 ? 0 : Math.PI, a1 = Math.atan2(u[1], u[0]);
  let d = a1 - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  if (deg > 0.5) { c.beginPath(); c.arc(p[0], p[1], R, a0, a0 + d, d < 0); c.stroke(); }
  c.restore();
  const am = a0 + d / 2, txt = (Math.round(deg) === 90 ? '鉛直 90°' : Math.round(deg) === 0 ? '水平 0°' : `與水平 ${fmt(deg, 0)}°`) + (extra || '');
  label(txt, p[0] + Math.cos(am) * (R + 0.03), p[1] + Math.sin(am) * (R + 0.03), { px: 12, color: '#0c4a6e', bg: 'rgba(224,242,254,.95)' });
}

/* ---------- 力的箭頭 ---------- */
function drawArrow(tail, head, color, w, dashed) {
  const c = ctx, lw = 1 / V.s, dx = head[0] - tail[0], dy = head[1] - tail[1], L = Math.hypot(dx, dy); if (L < 1e-4) return;
  const ux = dx / L, uy = dy / L, hl = Math.min(0.03, L * 0.45), hw = hl * 0.55;
  c.strokeStyle = color; c.fillStyle = color; c.lineWidth = w * lw; c.lineCap = 'round';
  if (dashed) c.setLineDash([6 * lw, 4 * lw]);
  c.beginPath(); c.moveTo(tail[0], tail[1]); c.lineTo(head[0] - ux * hl * 0.8, head[1] - uy * hl * 0.8); c.stroke(); c.setLineDash([]);
  c.beginPath(); c.moveTo(head[0], head[1]); c.lineTo(head[0] - ux * hl - uy * hw, head[1] - uy * hl + ux * hw); c.lineTo(head[0] - ux * hl + uy * hw, head[1] - uy * hl - ux * hw); c.closePath(); c.fill();
}

/* ================= 預設情境 ================= */
function sideOver(m, prev, pul, next, under) {        // 選繩子繞滑輪的方向：繞得最少；差不多時，定滑輪從上方、動滑輪從下方
  const cand = [1, -1].map(s => {
    const G = Phys.ropeGeom({ nodes: [{ body: Phys.WORLD, lp: prev, r: 0 }, { body: Phys.WORLD, lp: [pul[0], pul[1]], r: pul.r, s }, { body: Phys.WORLD, lp: next, r: 0 }] });
    const t1 = G.segs[0].T2, t2 = G.segs[1].T1;
    const a1 = Math.atan2(t1[1] - pul[1], t1[0] - pul[0]), a2 = Math.atan2(t2[1] - pul[1], t2[0] - pul[0]);
    let d = a2 - a1; if (s < 0) { while (d < 0) d += 2 * Math.PI; } else { while (d > 0) d -= 2 * Math.PI; }
    return { s, wrap: Math.abs(d), mid: pul[1] + pul.r * Math.sin(a1 + d / 2) };
  });
  const [A, B] = cand;
  if (Math.abs(A.wrap - B.wrap) > 0.6) return A.wrap < B.wrap ? A.s : B.s;
  return (under ? A.mid < B.mid : A.mid > B.mid) ? A.s : B.s;
}
function pulleyPt(q) { const a = [q.x, q.y]; a.r = q.r; return a; }

const within = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
function anchorDownload(filename, text) {
  try { const url = URL.createObjectURL(new Blob([text], { type: 'application/json' })), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true; } catch (e) { return false; }
}
// 依序嘗試：Claude 的下載功能 → 瀏覽器直接下載 → 顯示文字讓使用者複製
async function saveJSON(filename, text, msgEl, ta) {
  msgEl.textContent = '準備下載…';
  if (dlNS === undefined) await within(dlReady, 1500);
  if (dlNS) {
    try { await dlNS.save({ filename, data: text }); msgEl.textContent = '已下載：' + filename; return; }
    catch (e) { const c = e && e.code; if (c === 'declined') { msgEl.textContent = '已取消下載'; return; } if (c === 'rate_limited') { msgEl.textContent = '有另一個下載視窗還沒完成，請稍候再按一次'; return; } }
  }
  const top = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
  const ok = anchorDownload(filename, text);
  if (ok && top) { msgEl.textContent = '已下載：' + filename + '（若沒看到檔案，請檢查瀏覽器的下載列）'; return; }
  // 在不允許下載的框架裡：把文字放進框內並選取
  if (ta) { ta.value = text; ta.focus(); ta.select(); }
  let copied = false; try { await within(navigator.clipboard.writeText(text).then(() => { copied = true; }), 1200); } catch (e) {}
  msgEl.textContent = (copied ? '這裡無法直接下載，已把內容複製到剪貼簿' : '這裡無法直接下載，內容已選取在上方文字框，請按 Ctrl+C 複製') + `，貼到記事本存成「${filename}」即可。`;
}

  <h3>施力的三種模式</h3><ul><li><b>固定力</b>：一直用同樣大小的力。力不夠就拉不動，力太大物體會越來越快。</li><li><b>等速</b>：程式自動調整力，讓施力點等速移動；課本「等速抬起」的力就用這個量。</li><li><b>跟著手</b>：播放時拖曳箭頭，施力點跟著手移動，讀數是手出的力。</li></ul>
  <h3>功與能</h3><p>播放時計算每個力作的功 W、重力位能變化 ΔU、動能 K（有摩擦時還有熱 Q），並檢查 W ＝ ΔU ＋ K ＋ Q。等速時 K 幾乎為 0，就回到課本的「省力就費時、功不變」。</p>
  <h3>教學建議</h3><ol><li>先讓學生預測需要多大的力，再用「等速」量。</li><li>改成「固定力」，力太小、剛好、太大各試一次，觀察動能。</li><li>比較施力點移動的距離與物體上升的距離，算 F×s 與 W×h。</li><li>把摩擦打開，看看多作的功跑到哪裡。</li></ol>
  <h3>老師的課堂準備</h3><ol><li>在<b>編輯模式</b>組好裝置，按 💾 存成「我的情境」，寫下故事與想一想。</li><li>按情境旁的 <b>＋</b> 加入課堂清單，用 ▲▼ 排順序；工具列 ◀ ▶ 依清單切換。</li><li>選取元件時勾選「鎖定」，切到<b>上課模式</b>後學生就不能移動、刪除它；元件庫也會隱藏。</li><li>用「匯出／匯入」把情境傳給學生或其他老師。</li></ol>
  <h3>情境快照</h3><p>按 📷 拍下目前的裝置、位置、讀數和繪圖標註（播放中也能拍）。點縮圖可以放大檢視、用 ←→ 切換；「並排比較」可以左右對照兩張；↺ 載入後按 ▶ 就從那個狀態繼續。可以匯出成文字或匯入 .json 檔。</p>
  <p class="note">快捷鍵：P 拍快照、空白鍵 播放／暫停、Delete 刪除、Ctrl+Z 復原、Esc 回到選取。</p></div></div>`;
  m.hidden = false; $('#hClose').onclick = () => { m.hidden = true; }; m.onclick = e => { if (e.target === m) m.hidden = true; };
}

/* ---------- 啟動 ---------- */
function boot() {
  cv = $('#cv'); ctx = cv.getContext('2d');
  cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove); cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => { e.preventDefault(); app.zoom = clamp((app.zoom || 1) * Math.exp(-e.deltaY * 0.0015), 0.7, 3); fitView(); }, { passive: false });
  $('#playBtn').onclick = () => { if (app.running) pause(); else { startWorld(); } };
  $('#stepBtn').onclick = stepOnce;
  $('#resetBtn').onclick = resetWorld;
  $('#stopBtn').onclick = stopHere;
  document.querySelectorAll('#tools button').forEach(b => b.onclick = () => setTool(app.tool === b.dataset.tool && b.dataset.tool !== 'select' ? 'select' : b.dataset.tool));
  $('#speedBtn').onclick = () => { app.speed = app.speed === 1 ? 0.5 : app.speed === 0.5 ? 0.25 : 1; updateToolbar(); };
  $('#snapBtn').onclick = () => { app.snap = !app.snap; updateToolbar(); toast(app.snap ? '磁吸：開（對齊 5 cm 格線與刻度）' : '磁吸：關（可以任意擺放）'); };
  $('#delBtn').onclick = () => { if (app.sel) deleteSel(); };
  $('#undoBtn').onclick = () => undo(-1); $('#redoBtn').onclick = () => undo(1);
  $('#viewBtn').onclick = () => { app.zoom = 1; app.panX = 0; app.panY = 0; fitView(); };
  $('#helpBtn').onclick = helpBox;
  $('#mEdit').onclick = () => { app.edit = true; updateToolbar(); renderRail(); renderPanel(); };
  $('#mTeach').onclick = () => { app.edit = false; updateToolbar(); renderRail(); renderPanel(); };
  $('#shotBtn').onclick = takeSnapshot;
  const pan = $('#panel'); pan.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); } });
  pan.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (!f || !/json/i.test(f.type + f.name)) return; e.preventDefault(); const rd = new FileReader(); rd.onload = () => { snapIO(); setTimeout(() => { $('#jText').value = rd.result; $('#jImp').click(); }, 50); }; rd.readAsText(f); });
  $('#prevBtn').onclick = () => stepCourse(-1); $('#nextBtn').onclick = () => stepCourse(1);
  $('#energy').addEventListener('click', e => { const b = e.target.closest('[data-ue]'); if (b) { app.unitE = b.dataset.ue; renderReadout(); } });
  window.addEventListener('keydown', e => {
    const tg = e.target; if (tg && /INPUT|TEXTAREA|SELECT/.test(tg.tagName)) return;
    if (!$('#modal').hidden) { if (e.key === 'Escape') $('#modal').hidden = true; else if (snapViewer.key && $('#modal .viewer')) snapViewer.key(e); return; }
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (e.code === 'Space') { e.preventDefault(); $('#playBtn').click(); return; }
    if (!mod && k === 'p') { takeSnapshot(); return; }
    if (mod && (k === 'z' || k === 'y')) { e.preventDefault(); undo(k === 'y' || e.shiftKey ? 1 : -1); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && app.sel) { e.preventDefault(); deleteSel(); return; }
    if (e.key === 'Escape') { if (app.tool !== 'select') setTool('select'); else if (app.sel) { app.sel = null; renderPanel(); } }
  });
  initLayout();
  new ResizeObserver(() => fitView()).observe($('#stage'));
  sketch = SketchLayer.create(cv, {
    toWorld: (sx, sy) => { const w = toW(sx, sy); return { x: w[0], y: w[1] }; },
    toScreen: (x, y) => { const s = toS(x, y); return { x: s[0], y: s[1] }; },
    zoom: () => V.s / 600,
    hitTest: (sx, sy) => { const w = toW(sx, sy); return !!(hitForce(w) || hitPart(w) || hitPin(w)); },
    units: () => ({ perWorld: 100, label: 'cm', decimals: 1 })
  }, { theme: 'dark', position: 'top-left', exportButton: false, colors: ['#ffffff', '#fde047', '#f87171', '#86efac', '#67e8f9', '#f0abfc', '#fdba74'] });
  loadStore();
  const h = location.hash.slice(1); loadScene(sceneById(h) ? h : 'lever');
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== app.sceneId && sceneById(id)) loadScene(id); });
  fitView(); requestAnimationFrame(frame);
  window.SMD = { app, toS, toW, V, poseOf, poseW, loadScene, startWorld, pause, simStep, partOf, forceGeom, setTool, addFromLib };
}
window.addEventListener('DOMContentLoaded', boot);

})();
</script>
