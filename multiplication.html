<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>位值乘法學習系統</title>
<meta name="theme-color" content="#1F2A44">
<style>
    /* 沿用加減法版的配色與版面（刻意維持單一淺色教室主題）；新增千位紫色、引導步驟列 */
    :root {

    .nav-buttons { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
    .nav-buttons::-webkit-scrollbar { display: none; }

    @media (hover: hover) { .nav-btn:hover { background: #45537A; } }

    .ans-row.done .input-box { border-color: #9ED3B8; background: #E3F5EC; color: #146C43; }

    /* 呼叫小人 */
    #action-card { flex-shrink: 0; padding: 10px 12px; }

    .step-pill { flex-shrink: 0; background: var(--zc); color: #fff; border-radius: 999px; padding: 1px 10px; font-size: .85rem; margin-top: 1px; }
    .action-bar { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
    .action-group { flex: 1 1 260px; min-width: 0; }
    .action-bar .hint { margin: 0 0 5px; }
    .zone-tabs { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,20,35,.55); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: #fff; padding: 20px; border-radius: 14px; width: 100%; max-width: 680px; max-height: 84vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

</div>

                <option value="m21b">二位數 × 一位數（連續進位）</option>

                <button id="btn-redo-q" class="ctrl-btn">🔄 本題重來</button>

        </div>

        <div class="card" id="eq-card">
            <div class="card-title" id="eq-title">2. 直式計算</div>
            <div id="equation-container"></div>
        </div>

    <div id="play-area">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="900" height="600"></canvas>
        </div>

        <div class="card" id="action-card">
            <div id="step-banner" class="step-banner"></div>
            <div class="action-bar">
                <div class="action-group">
                    <div class="hint">① 工作區</div>
                    <div id="zone-tabs" class="zone-tabs"></div>
                </div>
                <div class="action-group">
                    <div class="hint">② 呼叫小人</div>
                    <div class="action-grid">
                        <button id="btn-char-add" class="action-btn add"></button>
                        <button id="btn-char-sub" class="action-btn sub"></button>

                <span>⠿ 輸入答案</span>

                    <button id="keypad-toggle" class="kp-icon" title="收合 / 展開">－</button>
                </span>

                <div class="keyboard">
                    <button class="key-btn" data-key="1">1</button><button class="key-btn" data-key="2">2</button><button class="key-btn" data-key="3">3</button>
                    <button class="key-btn" data-key="4">4</button><button class="key-btn" data-key="5">5</button><button class="key-btn" data-key="6">6</button>
                    <button class="key-btn" data-key="7">7</button><button class="key-btn" data-key="8">8</button><button class="key-btn" data-key="9">9</button>
                    <button class="key-btn key-action" data-key="clear">清除</button><button class="key-btn key-zero" data-key="0">0</button>
                    <button id="btn-submit" class="key-btn key-submit">✅ 確認送出</button>

<div class="modal-overlay" id="modal-container">
    <div class="modal-content">
        <button class="close-btn" id="modal-close">關閉</button>
        <div class="modal-header" id="modal-title"></div>
        <div id="modal-body"></div>

</div>

<script>
(() => {
    'use strict';

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            r = Math.min(typeof r === 'number' ? r : 0, w / 2, h / 2);
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
            this.closePath(); return this;
        };
    }

    // ---------- 1. 本地儲存（與加減法版分開） ----------
    const memStore = {};
    const KEYS = { rc: 'mul_records_challenge', rp: 'mul_records_practice', wrong: 'mul_wrongs', kp: 'mul_keypad_v1' };
    const DB = {
        maxRecords: 40,
        load(key) {
            try { const v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; }
            catch (e) { return memStore[key] ? memStore[key].slice() : []; }
        },
        save(key, data) {
            memStore[key] = data;
            try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
        },
        addRecord(mode, stats) {
            const key = mode === 'challenge' ? KEYS.rc : KEYS.rp;
            const r = DB.load(key); r.unshift(stats); DB.save(key, r.slice(0, DB.maxRecords));
        },
        sameQ: (x, y) => x.a === y.a && x.b === y.b,
        addWrong(q) {
            const w = DB.load(KEYS.wrong);
            if (!w.some(x => DB.sameQ(x, q))) { w.unshift(q); DB.save(KEYS.wrong, w.slice(0, DB.maxRecords)); }
        },
        removeWrong(q) { DB.save(KEYS.wrong, DB.load(KEYS.wrong).filter(x => !DB.sameQ(x, q))); }
    };

    // ---------- 2. 常數與狀態 ----------
    const W = 900, H = 600, TOP = 104, BOTTOM = 462;
    const FONT = '"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
    const ALL = ['tho', 'hun', 'ten', 'one'];
    const IDX = { one: 0, ten: 1, hun: 2, tho: 3 };
    const BY_IDX = ['one', 'ten', 'hun', 'tho'];
    const NAME = { tho: '千位', hun: '百位', ten: '十位', one: '個位' };
    const UNIT = { tho: '千', hun: '百', ten: '十', one: '一' };
    const VAL = { tho: 1000, hun: 100, ten: 10, one: 1 };
    const C = {
        tho: { color: '#8C55C9', ink: '#6A38A8', rgb: [140, 85, 201], r: 15 },
        hun: { color: '#3B6FD8', ink: '#2A5BC0', rgb: [59, 111, 216], r: 15 },
        ten: { color: '#E8901A', ink: '#B86A00', rgb: [232, 144, 26], r: 15 },
        one: { color: '#159A72', ink: '#0E7A5A', rgb: [21, 154, 114], r: 15 }
    };
    const tint = (t, a) => `rgba(${C[t].rgb.join(',')},${a})`;
    const digitAt = (n, p) => Math.floor(n / VAL[p]) % 10;

    const LEVELS = ['m11', 'm21a', 'm21b', 'm31', 'm22'];
    const LEVEL_NAMES = { m11: '一位×一位', m21a: '二位×一位(一次進位)', m21b: '二位×一位(連續進位)', m31: '三位×一位', m22: '二位×二位' };
    const PER_LEVEL = 5;

    const state = {
        sysMode: 'practice', levelId: 'm11', a: 7, b: 8,
        plan: [], stageIdx: 0, zones: ['hun', 'ten', 'one'],
        balls: {}, geo: {}, characters: [], groupCount: {}, regroup: {},
        inputs: [], activeInput: 'one', workZone: 'one',
        guide: { steps: [], idx: 0, phase: 'done' }, frames: [], multiplied: [],
        flashState: false, animating: false, animToken: 0, flowToken: 0, locked: false,
        lasso: null, dragHint: null, zoneError: null,
        sessionStats: {}, challengeIndex: 0, challengeLvlCorrect: 0, resumes: 0, lastFrom: null
    };
    ALL.forEach(p => { state.balls[p] = []; });
    let dragInfo = null;
    const $ = id => document.getElementById(id);
    const CHECK_KEY = 'mul_check_groups';
    state.checkGroups = (() => { try { return localStorage.getItem(CHECK_KEY) !== '0'; } catch (e) { return true; } })();
    $('chk-groups').checked = state.checkGroups;
    $('chk-groups').addEventListener('change', e => {
        state.checkGroups = e.target.checked;
        try { localStorage.setItem(CHECK_KEY, state.checkGroups ? '1' : '0'); } catch (err) {}
        if (state.sysMode !== 'challenge') initGame(true);
        toast((state.checkGroups ? '✅ 檢查份數：先進位，再乘下一位' : '📢 不檢查：乘完就到下一位，可以先乘完再進位') + '\n本題重新開始。', 'info', 2800);
    });

    const canvas = $('gameCanvas');
    const ctx = canvas.getContext('2d');
    setInterval(() => { state.flashState = !state.flashState; }, 400);

    const isGuided = () => state.sysMode !== 'challenge';
    const curStage = () => state.plan[state.stageIdx];
    const curStep = () => {
        const g = state.guide;
        return isGuided() && g.idx < g.steps.length ? g.steps[g.idx] : null;
    };
    const zoneW = () => W / state.zones.length;
    const zoneX = p => state.zones.indexOf(p) * zoneW();
    const zoneAt = px => state.zones[Math.max(0, Math.min(state.zones.length - 1, Math.floor(px / zoneW())))];
    const leftOf = p => state.zones[state.zones.indexOf(p) - 1];
    const rightOf = p => state.zones[state.zones.indexOf(p) + 1];
    const multPlaceName = st => st.shift ? '十位' : '個位';

    // 這一位「一份」有幾顆：被乘數對應位的數字（第二列整體往左移一位）
    function groupSize(p) {
        const st = curStage();
        if (!st || st.kind !== 'mul') return 0;
        const i = IDX[p] - st.shift;
        if (i < 0 || i > 3) return 0;
        const q = BY_IDX[i];
        return state.a >= VAL[q] ? digitAt(state.a, q) : 0;
    }

    function later(fn, ms) {
        const tok = state.flowToken;
        setTimeout(() => { if (tok === state.flowToken) fn(); }, ms);
    }

    // ---------- 3. 提示訊息 ----------
    let toastTimer = null;
    function toast(msg, type = 'info', ms = 2200) {
        const el = $('toast');
        el.textContent = msg;
        el.className = 'show toast-' + type;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = 'toast-' + type; }, ms);
    }

    // ---------- 4. 模式切換 ----------
    // 計時：只算網頁開著的時間；切到別的分頁或關閉時暫停
    const clock = { base: 0, seg: Date.now(), running: true };
    function clockReset(base = 0) { clock.base = base; clock.seg = Date.now(); clock.running = !document.hidden; }
    const elapsed = () => clock.base + (clock.running ? Date.now() - clock.seg : 0);
    function clockPause() { if (clock.running) { clock.base += Date.now() - clock.seg; clock.running = false; } }
    function clockResume() { if (!clock.running) { clock.seg = Date.now(); clock.running = true; } }

    function resetSessionStats() {
        state.sessionStats = {};
        LEVELS.forEach(l => { state.sessionStats[l] = { correct: 0, wrong: 0 }; });
        state.resumes = 0; state.lastFrom = null;
        clockReset();
    }
    const totals = st => LEVELS.reduce((t, l) => { const v = (st || {})[l] || {}; t.c += v.correct || 0; t.w += v.wrong || 0; return t; }, { c: 0, w: 0 });
    const hasAnswers = st => { const t = totals(st); return t.c + t.w > 0; };
    const nowStr = () => new Date().toLocaleString('zh-TW', { hour12: false });
    const SAVE = { ch: 'mul_challenge_save', pr: 'mul_practice_pending' };
    function loadObj(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return memStore[k] || null; } }
    function saveObj(k, v) { memStore[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function dropObj(k) { delete memStore[k]; try { localStorage.removeItem(k); } catch (e) {} }

    // 練習：每次作答都暫存；沒按結算就離開，下次打開時自動存成「未結算」紀錄
    function savePractice() {
        if (state.sysMode !== 'practice') return;
        if (hasAnswers(state.sessionStats)) saveObj(SAVE.pr, { stats: state.sessionStats, time: elapsed(), date: nowStr() });
        else dropObj(SAVE.pr);
    }
    function flushPractice(note) {
        const pd = loadObj(SAVE.pr);
        dropObj(SAVE.pr);
        if (!pd || !hasAnswers(pd.stats)) return false;
        const t = totals(pd.stats);
        DB.addRecord('practice', { date: pd.date, time: pd.time, totalC: t.c, totalW: t.w, details: pd.stats, note });
        return true;
    }
    // 闖關：隨時暫存進度，下次可以接著玩
    function saveChallenge(force = false) {
        if (state.sysMode !== 'challenge') return;
        if (state.challengeIndex >= LEVELS.length) { dropObj(SAVE.ch); return; }
        if (!force && state.challengeIndex === 0 && !hasAnswers(state.sessionStats)) return;
        saveObj(SAVE.ch, { levelIdx: state.challengeIndex, lvlCorrect: state.challengeLvlCorrect, stats: state.sessionStats,
            time: elapsed(), resumes: state.resumes, lastFrom: state.lastFrom, date: nowStr() });
    }
    function abandonChallenge(sv) {
        dropObj(SAVE.ch);
        if (!sv || (!hasAnswers(sv.stats) && !sv.levelIdx)) return;
        const t = totals(sv.stats);
        DB.addRecord('challenge', { date: sv.date, time: sv.time, totalC: t.c, totalW: t.w, details: sv.stats,
            note: `闖關中斷（停在第 ${sv.levelIdx + 1} 關，答對 ${sv.lvlCorrect}/${PER_LEVEL}）` });
    }
    function persist() { savePractice(); saveChallenge(); }
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { clockPause(); persist(); } else clockResume();
    });
    window.addEventListener('pagehide', () => { clockPause(); persist(); });
    setInterval(() => { if (!document.hidden) persist(); }, 20000);

    function askResume(sv) {
        const html = `
            <div class="resume-box">
                上次闖到 <b>第 ${sv.levelIdx + 1} 關</b>（${LEVEL_NAMES[LEVELS[sv.levelIdx]]}），這一關答對 <b>${sv.lvlCorrect}/${PER_LEVEL}</b> 題。<br>
                已經用了 <b>${formatTime(sv.time || 0)}</b>，暫存於 ${sv.date}。
            </div>
            <div class="resume-btns">
                <button class="btn-resume" data-action="resume">▶ 接著上次繼續</button>
                <button class="btn-restart-ch" data-action="restart-ch">↺ 從第 1 關重新開始</button>
            </div>
            <p class="fb-note" style="margin-top:10px;">重新開始的話，上次的進度會存成一筆「闖關中斷」紀錄。</p>`;
        showModal('🏆 要接著上次的闖關嗎？', html);
    }
    function enterChallenge() {
        if (state.sysMode === 'challenge') return;
        const sv = loadObj(SAVE.ch);
        if (sv) askResume(sv); else switchSysMode('challenge');
    }
    function setNavActive(mode) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-mode'));
        const el = mode && $('nav-' + mode);
        if (el) el.classList.add('active-mode');
    }
    function switchSysMode(newMode, opt = {}) {
        if (!opt.skipSave) {
            if (state.sysMode === 'practice') { savePractice(); if (flushPractice('未按結算（切換模式）')) toast('📝 剛才的練習已自動存進歷史紀錄', 'info'); }
            if (state.sysMode === 'challenge') { saveChallenge(); if (loadObj(SAVE.ch)) toast('💾 闖關進度已暫存，下次可以接著玩', 'info'); }
        }
        state.sysMode = newMode;
        state.flowToken++; state.locked = false;
        setNavActive(newMode);
        resetSessionStats();
        $('btn-restart').style.display = '';
        if (newMode === 'practice') {
            $('mode-title-display').textContent = '1. 練習設定（引導）';
            $('level-select').disabled = false;
            $('challenge-progress').style.display = 'none';
            $('btn-finish-practice').style.display = '';
            $('btn-save-challenge').style.display = 'none';
            $('check-row').hidden = false;
            state.levelId = $('level-select').value;
        } else {
            $('mode-title-display').textContent = '1. 闖關進度';
            $('level-select').disabled = true;
            $('challenge-progress').style.display = '';
            $('btn-finish-practice').style.display = 'none';
            $('btn-save-challenge').style.display = '';
            $('check-row').hidden = true;
            state.challengeIndex = 0; state.challengeLvlCorrect = 0;
            const sv = opt.resume;
            if (sv) {
                state.challengeIndex = sv.levelIdx; state.challengeLvlCorrect = sv.lvlCorrect;
                LEVELS.forEach(l => { if (sv.stats && sv.stats[l]) state.sessionStats[l] = sv.stats[l]; });
                state.resumes = (sv.resumes || 0) + 1; state.lastFrom = sv.levelIdx;
                clockReset(sv.time || 0);
            }
            state.levelId = LEVELS[state.challengeIndex];
            updateChallengeUI();
        }
        initGame();
    }
    function updateChallengeUI() {
        $('level-select').value = state.levelId;
        $('challenge-progress').textContent = `關卡 ${state.challengeIndex + 1}/${LEVELS.length}（答對 ${state.challengeLvlCorrect}/${PER_LEVEL}）`;
    }
    function startReview(idx) {
        const q = DB.load(KEYS.wrong)[idx];
        if (!q) return;
        if (state.sysMode === 'practice') { savePractice(); flushPractice('未按結算（進入錯題重作）'); }
        if (state.sysMode === 'challenge') saveChallenge();
        state.sysMode = 'review_wrong';
        state.flowToken++; state.locked = false;
        state.a = q.a; state.b = q.b; state.levelId = q.level;
        setNavActive(null);
        $('mode-title-display').textContent = '📓 錯題重作中';
        if (q.level) $('level-select').value = q.level;
        $('level-select').disabled = true;
        $('challenge-progress').style.display = 'none';
        $('btn-finish-practice').style.display = 'none';
        $('btn-save-challenge').style.display = 'none';
        $('btn-restart').style.display = 'none';
        $('check-row').hidden = false;
        closeModal();
        initGame(true);
    }
    const formatTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}分 ${s % 60}秒`; };

    // ---------- 5. Modal ----------
    function showModal(title, html) {
        $('modal-title').textContent = title;
        $('modal-body').innerHTML = html;
        $('modal-container').style.display = 'flex';
    }
    function closeModal() { $('modal-container').style.display = 'none'; }
    const modalOpen = () => $('modal-container').style.display === 'flex';
    $('modal-close').addEventListener('click', closeModal);
    $('modal-container').addEventListener('click', e => { if (e.target.id === 'modal-container') closeModal(); });
    $('modal-body').addEventListener('click', e => {
        const tab = e.target.closest('.help-tab');
        if (tab) {
            document.querySelectorAll('.help-tab').forEach(t => t.classList.toggle('active', t === tab));
            document.querySelectorAll('.help-page').forEach(pg => { pg.hidden = pg.dataset.page !== tab.dataset.help; });
            return;
        }
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const { action, idx, key } = btn.dataset;
        if (action === 'close') { closeModal(); return; }
        if (action === 'clear') {
            if (btn.dataset.armed) { DB.save(key, []); showRecordsModal(); }
            else {
                btn.dataset.armed = '1'; btn.textContent = '再按一次確認清空';
                setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = '清空紀錄'; } }, 3000);
            }
        } else if (action === 'delrec') {
            const r = DB.load(key); r.splice(parseInt(idx, 10), 1);
            DB.save(key, r); showRecordsModal();
        } else if (action === 'resume') {
            const sv = loadObj(SAVE.ch); closeModal();
            if (sv) { switchSysMode('challenge', { resume: sv }); toast(`▶ 從第 ${sv.levelIdx + 1} 關接著闖！`, 'ok'); }
        } else if (action === 'restart-ch') {
            abandonChallenge(loadObj(SAVE.ch)); closeModal();
            switchSysMode('challenge'); toast('↺ 從第 1 關重新開始！', 'info');
        } else if (action === 'redo') startReview(parseInt(idx, 10));
        else if (action === 'del') {
            const w = DB.load(KEYS.wrong); w.splice(parseInt(idx, 10), 1);
            DB.save(KEYS.wrong, w); showWrongsModal();
        }
    });

    function showSummaryAndSave(force = false) {
        let totalC = 0, totalW = 0, rows = '';
        LEVELS.forEach(l => {
            const s = state.sessionStats[l];
            if (s.correct || s.wrong) {
                totalC += s.correct; totalW += s.wrong;
                rows += `<tr><td>${LEVEL_NAMES[l]}</td><td class="c-ok">${s.correct}</td><td class="c-bad">${s.wrong}</td></tr>`;
            }
        });
        if (!force && totalC + totalW === 0) { toast('📭 這次還沒有作答紀錄喔！', 'info'); return; }
        const timeSpent = elapsed();
        const date = nowStr();
        const wasChallenge = state.sysMode === 'challenge';
        const note = wasChallenge && state.resumes ? `中斷後接續 ${state.resumes} 次，最後一次從第 ${state.lastFrom + 1} 關接續` : '';
        const html = `
            <p>📅 完成時間：<b>${date}</b></p>
            <p>⏱️ 總耗時：<b>${formatTime(timeSpent)}</b>${note ? '（多次作答時間累加）' : ''}</p>
            ${note ? `<p>🔁 ${note}</p>` : ''}
            <p>📊 總計：✅ 答對 <b class="c-ok">${totalC}</b> 題 ／ ❌ 答錯 <b class="c-bad">${totalW}</b> 次</p>
            <div class="table-wrap"><table>
                <tr><th>關卡題型</th><th>答對</th><th>答錯</th></tr>
                ${rows || '<tr><td colspan="3">本次尚無作答紀錄</td></tr>'}
            </table></div>`;
        const rec = { date, time: timeSpent, totalC, totalW, details: JSON.parse(JSON.stringify(state.sessionStats)) };
        if (note) rec.note = note;
        DB.addRecord(state.sysMode, rec);
        if (wasChallenge) { dropObj(SAVE.ch); switchSysMode('practice', { skipSave: true }); }
        else { dropObj(SAVE.pr); resetSessionStats(); }
        showModal(wasChallenge ? '🏆 闖關完成結算' : '📊 本次練習結果', html);
    }

    function showRecordsModal() {
        const build = (data, title, key) => {
            const head = `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;">
                <h3 style="margin:0;">${title}（${data.length}/40）</h3>
                ${data.length ? `<button class="mini-btn" data-action="clear" data-key="${key}">清空紀錄</button>` : ''}</div>`;
            if (!data.length) return head + '<p style="color:#6B7280;">尚無歷史紀錄</p>';
            const rows = data.map((r, i) => {
                const detail = Object.entries(r.details || {})
                    .filter(([, v]) => v.correct || v.wrong)
                    .map(([k, v]) => `${LEVEL_NAMES[k] || k}(${v.correct}/${v.wrong})`).join('、');
                return `<tr><td>${r.date}${r.note ? `<span class="rec-note">${r.note}</span>` : ''}</td><td>${formatTime(r.time || 0)}</td>
                    <td><span class="c-ok">${r.totalC}</span> / <span class="c-bad">${r.totalW}</span></td>
                    <td style="font-size:.85rem;text-align:left;">${detail || '無'}</td>
                    <td><button class="rec-del" data-action="delrec" data-key="${key}" data-idx="${i}">刪除</button></td></tr>`;
            }).join('');
            return head + `<div class="table-wrap"><table style="margin-top:8px;"><tr><th>完成時間</th><th>總耗時</th><th>對/錯</th><th>各關明細(對/錯)</th><th></th></tr>${rows}</table></div>`;
        };
        showModal('📜 歷史紀錄（上限 40 筆）',
            build(DB.load(KEYS.rc), '🏆 闖關模式', KEYS.rc) + build(DB.load(KEYS.rp), '📝 練習模式', KEYS.rp));
    }

    function showWrongsModal() {
        const wrongs = DB.load(KEYS.wrong);
        if (!wrongs.length) { showModal('📓 錯題本', '<p>太棒了！目前沒有任何錯題紀錄。</p>'); return; }
        const rows = wrongs.map((q, i) => `
            <div class="wrong-item">
                <span>【${LEVEL_NAMES[q.level] || '練習題'}】 <b style="font-size:1.1rem">${q.a} × ${q.b}</b></span>
                <div><button class="btn-redo" data-action="redo" data-idx="${i}">挑戰重作</button><button class="btn-delete" data-action="del" data-idx="${i}">刪除</button></div>
            </div>`).join('');
        showModal(`📓 錯題本（${wrongs.length}/40）`, rows);
    }

    // ---------- 6. 出題（一定有進位；被乘數各位不為 0） ----------
    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    function generate(level) {
        let a, b, ok = false;
        while (!ok) {
            if (level === 'm11') { a = rand(2, 9); b = rand(2, 9); ok = a * b >= 10; }
            else if (level === 'm21a' || level === 'm21b') {
                const t = rand(1, 9), o = rand(2, 9); b = rand(2, 9); a = t * 10 + o;
                const second = t * b + Math.floor(o * b / 10) >= 10;
                ok = o * b >= 10 && (level === 'm21b' ? second : !second);
            } else if (level === 'm31') {
                const o = rand(2, 9); a = rand(1, 9) * 100 + rand(1, 9) * 10 + o; b = rand(2, 9); ok = o * b >= 10;
            } else {
                const o = rand(2, 9), b1 = rand(2, 9);
                a = rand(1, 9) * 10 + o; b = rand(1, 9) * 10 + b1; ok = o * b1 >= 10;
            }
        }
        state.a = a; state.b = b;
    }

    // 一位數乘數：一個階段；二位數乘數：第一列、第二列、相加
    function buildPlan() {
        const a = state.a, b = state.b;
        if (b < 10) state.plan = [{ kind: 'mul', mult: b, shift: 0, target: a * b, label: `${a} × ${b}` }];
        else {
            const b1 = b % 10, b10 = Math.floor(b / 10);
            state.plan = [
                { kind: 'mul', mult: b1, shift: 0, target: a * b1, label: `第一列：${a} × ${b1}` },
                { kind: 'mul', mult: b10, shift: 1, target: a * b10 * 10, label: `第二列：${a} × ${b10} 個十` },
                { kind: 'add', target: a * b, label: '相加：兩列合起來' }
            ];
        }
        state.zones = a * b >= 1000 ? ALL.slice() : ALL.slice(1);
    }

    // ---------- 7. 直式算式 ----------
    function buildEquation() {
        const eq = $('equation-container'); eq.innerHTML = '';
        const Z = state.zones;
        const row = (cls, id) => { const r = document.createElement('div'); r.className = 'eq-row' + (cls ? ' ' + cls : ''); if (id) r.id = id; eq.appendChild(r); return r; };
        const cell = (r, cls, text, id) => { const s = document.createElement('span'); s.className = cls; if (text != null) s.textContent = text; if (id) s.id = id; r.appendChild(s); return s; };
        const line = () => { const d = document.createElement('div'); d.className = 'eq-line'; eq.appendChild(d); };
        const show = (n, p) => (n >= VAL[p] || p === 'one') ? String(digitAt(n, p)) : '';

        const cr = document.createElement('div'); cr.className = 'carry-row'; eq.appendChild(cr);
        Z.forEach(p => cell(cr, 'carry-mark', '', 'carry-' + p));
        const ra = row(''); Z.forEach(p => cell(ra, 'digit', show(state.a, p), 'eq-a-' + p));
        const rb = row(''); cell(rb, 'operator', '×'); Z.forEach(p => cell(rb, 'digit', show(state.b, p), 'eq-b-' + p));
        line();
        state.plan.forEach((st, s) => {
            if (s === 2) line();
            const r = row('ans-row', 'ans-' + s);
            Z.forEach(p => {
                if (st.shift === 1 && p === 'one') { cell(r, 'faint-zero', '0'); return; }
                if (st.target >= VAL[p]) {
                    const box = document.createElement('div');
                    box.className = 'input-box'; box.id = `in-${s}-${p}`;
                    box.addEventListener('click', () => { if (s === state.stageIdx && !state.locked) setActiveInput(p); });
                    r.appendChild(box);
                } else cell(r, 'input-spacer');
            });
        });
    }

    function refreshEquation() {
        state.plan.forEach((st, s) => {
            const r = $('ans-' + s); if (!r) return;
            r.classList.toggle('current', s === state.stageIdx);
            r.classList.toggle('done', s < state.stageIdx);
            r.classList.toggle('future', s > state.stageIdx);
            state.zones.forEach(p => {
                const el = $(`in-${s}-${p}`);
                if (el) { el.textContent = state.inputs[s][p] || ''; el.classList.toggle('active', s === state.stageIdx && p === state.activeInput); }
            });
        });
        document.querySelectorAll('.digit.focus').forEach(el => el.classList.remove('focus'));
        const st = curStage();
        if (st && st.kind === 'mul') {
            const bEl = $('eq-b-' + (st.shift ? 'ten' : 'one')); if (bEl) bEl.classList.add('focus');
            const step = curStep();
            if (step && step.kind === 'mul') { const aEl = $('eq-a-' + BY_IDX[IDX[step.zone] - st.shift]); if (aEl) aEl.classList.add('focus'); }
        }
        $('eq-title').textContent = state.plan.length > 1 ? `2. 直式｜${st.label}` : '2. 直式計算';
    }

    function updateCarryMarks() {
        state.zones.forEach(p => {
            const el = $('carry-' + p); if (!el) return;
            const n = state.regroup[p] || 0;
            el.textContent = n ? String(n) : '';
        });
    }

    const boxesOf = s => state.zones.filter(p => $(`in-${s}-${p}`));
    function setActiveInput(p) { state.activeInput = p; refreshEquation(); }
    function inputDigit(v) {
        if (state.locked) return;
        const s = state.stageIdx, Z = state.zones;
        state.inputs[s][state.activeInput] = v;
        for (let j = Z.indexOf(state.activeInput) - 1; j >= 0; j--) { if ($(`in-${s}-${Z[j]}`)) { state.activeInput = Z[j]; break; } }
        refreshEquation();
    }
    function clearDigit() { state.inputs[state.stageIdx][state.activeInput] = ''; refreshEquation(); }
    function moveInput(dir) {
        const boxes = boxesOf(state.stageIdx), i = boxes.indexOf(state.activeInput);
        const n = boxes[Math.max(0, Math.min(boxes.length - 1, i + dir))];
        if (n) setActiveInput(n);
    }
    document.querySelectorAll('.key-btn[data-key]').forEach(btn => {
        btn.addEventListener('click', () => { const k = btn.dataset.key; if (k === 'clear') clearDigit(); else inputDigit(k); });
    });
    document.addEventListener('keydown', e => {
        if (modalOpen()) { if (e.key === 'Escape') closeModal(); return; }
        if (e.target.tagName === 'SELECT') return;
        if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
        else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); clearDigit(); }
        else if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); }
        else if (e.key === 'ArrowLeft') moveInput(-1);
        else if (e.key === 'ArrowRight') moveInput(1);
    });

    // ---------- 8. 工作區、按鈕、引導步驟 ----------
    const addBtn = $('btn-char-add'), subBtn = $('btn-char-sub'), doneBtn = $('btn-step-done');

    function buildZoneTabs() {
        const tabs = $('zone-tabs');
        tabs.innerHTML = '';
        tabs.style.setProperty('--n', state.zones.length);
        state.zones.forEach(p => {
            const b = document.createElement('button');
            b.className = 'zone-tab'; b.dataset.zone = p;
            b.style.setProperty('--tab', C[p].ink);
            b.style.setProperty('--dot', C[p].color);
            b.innerHTML = `<span class="dot"></span>${NAME[p]}`;
            b.addEventListener('click', () => selectZone(p, true));
            tabs.appendChild(b);
        });
    }

    function selectZone(p, fromTab) {
        if (isGuided()) {
            const step = curStep();
            if (step && step.zone !== p && fromTab) toast(`照順序來：先完成【${NAME[step.zone]}】喔！`, 'info', 1600);
            return;
        }
        state.workZone = p;
        refreshActionUI();
    }

    function bannerHTML() {
        const st = curStage(), step = curStep(), pill = t => `<span class="step-pill">${t}</span>`;
        if (!isGuided()) {
            return pill('闖關') + `<span>${state.plan.length > 1 ? st.label + '。' : ''}${st.kind === 'add'
                ? '兩列的球已經放好，框選 10 顆（或 20、30 顆……）拖到左邊進位。'
                : '自己選工作區放入幾份；框選 10 顆（或 20、30 顆……）拖到左邊一格進位。'}</span>`;
        }
        if (!step) return pill('完成') + `<span>每一區都整理好了！數數看各區有幾顆球，寫下${state.plan.length > 1 ? '這一列的' : ''}答案，按「確認送出」。</span>`;
        const z = step.zone, n = state.guide.idx + 1;
        if (state.guide.phase === 'place') {
            const pre = (st.shift && state.guide.idx === 0) ? `乘數十位的 ${st.mult} 代表 ${st.mult} 個十，所以從【十位】開始放，個位補 0。` : '';
            const opt = state.frames.length ? '右邊框起來的球，可以現在進位，也可以全部乘完再進位。' : '';
            return pill(`第 ${n} 步`) + `<span>${pre}【${NAME[z]}】一份是 ${groupSize(z)} 個${UNIT[z]}。乘數的${multPlaceName(st)}是幾，就放幾份，放好按「乘完了」。${opt}</span>`;
        }
        const L = leftOf(z);
        if (!L) return pill(`第 ${n} 步`) + '<span>這一位不用進位。</span>';
        return pill(`第 ${n} 步`) + `<span>${st.kind === 'add' ? `【${NAME[z]}】兩列合起來，` : step.kind === 'carry' ? `每一位都乘完了，現在從個位開始進位。【${NAME[z]}】` : ''}把框起來的一排（10 個${UNIT[z]}）拖到左邊的【${NAME[L]}】，換成 1 個${UNIT[L]}。</span>`;
    }

    function refreshActionUI() {
        const card = $('action-card'), g = isGuided(), st = curStage(), step = curStep(), z = state.workZone;
        card.classList.toggle('guided', g);
        card.style.setProperty('--zc', C[z].ink);
        const k = groupSize(z);
        const canPlace = st.kind === 'mul' && k > 0 && (!g || (step && step.zone === z && state.guide.phase === 'place'));
        addBtn.disabled = !canPlace; subBtn.disabled = !canPlace;
        const badge = g && st.kind === 'mul' && step && state.guide.phase === 'place' ? `<span class="count-badge" aria-label="已放份數">${state.groupCount[z] || 0}</span>` : '';
        addBtn.innerHTML = k > 0
            ? `➕ 放入 1 份<small>一份 ${k} 個${UNIT[z]}</small>${badge}`
            : `➕ 放入 1 份<small>${st.kind === 'add' ? '這一步只要進位' : '這一位不用放'}</small>`;
        subBtn.innerHTML = `➖ 搬走 1 份<small>從【${NAME[z]}】</small>`;
        doneBtn.hidden = !g;
        doneBtn.disabled = !(g && step && step.kind === 'mul' && state.guide.phase === 'place');
        doneBtn.innerHTML = `✔ 乘完了<small>${NAME[step ? step.zone : z]}・${state.checkGroups ? '檢查份數' : '直接框起'}</small>`;
        document.querySelectorAll('.zone-tab').forEach(b => {
            b.classList.toggle('active', b.dataset.zone === z);
            b.classList.toggle('locked', g && (!step || b.dataset.zone !== step.zone));
        });
        $('step-banner').innerHTML = bannerHTML();
    }

    function refreshAll() { refreshEquation(); refreshActionUI(); updateCarryMarks(); }

    function buildSteps() {
        const st = curStage(), steps = [];
        if (st.kind === 'mul') {
            const len = String(state.a).length;
            for (let i = 0; i < len; i++) {
                if (digitAt(state.a, BY_IDX[i]) > 0) steps.push({ zone: BY_IDX[i + st.shift], kind: 'mul' });
            }
            // 不檢查模式：乘完不必先進位；全部乘完後，再從個位開始一位一位進位
            if (!state.checkGroups) [...state.zones].reverse().forEach(z => steps.push({ zone: z, kind: 'carry' }));
        } else [...state.zones].reverse().forEach(z => steps.push({ zone: z, kind: 'add' }));
        state.guide = { steps, idx: 0, phase: 'place' };
    }

    function activateStep() {
        const step = curStep();
        if (!step) { state.guide.phase = 'done'; state.frames = []; refreshAll(); return; }
        state.workZone = step.zone;
        state.guide.phase = step.kind === 'mul' ? 'place' : 'carry';
        arrangeBalls(true);
        refreshAll();
        if (state.guide.phase === 'carry' && state.balls[step.zone].length < 10) later(advanceStep, 300);
    }

    function advanceStep() {
        state.guide.idx++;
        if (!curStep()) {
            state.guide.phase = 'done'; state.frames = []; refreshAll();
            toast('👍 每一區都整理好了！\n數數看各區有幾顆球，寫下答案再送出。', 'ok', 2800);
            return;
        }
        activateStep();
    }

    function stepDone() {
        if (state.locked) return;
        const step = curStep();
        if (!step || state.guide.phase !== 'place') return;
        const z = step.zone;
        if (state.characters.some(c => c.zone === z && c.state !== 'walking_out')) { toast('⏳ 等小人把球放好喔！', 'warn'); return; }
        const st = curStage(), n = state.groupCount[z] || 0;
        if (!n) { toast(`先按「放入 1 份」，把球放進【${NAME[z]}】喔！`, 'warn'); return; }
        if (state.checkGroups && n !== st.mult) {
            toast(`🤔 一份是 ${groupSize(z)} 個${UNIT[z]}。\n乘數的${multPlaceName(st)}是幾，就要放幾份。數數看你放了幾份？`, 'warn', 3600);
            return;
        }
        if (!state.checkGroups) {
            if (!state.multiplied.includes(z)) state.multiplied.push(z);
            const more = state.balls[z].length >= 10;
            toast(`👍 ${NAME[z]}乘完了！${more ? '\n滿 10 的已經框起來：可以現在進位，也可以全部乘完再進位。' : ''}`, 'ok', more ? 3000 : 1500);
            advanceStep();
            return;
        }
        state.guide.phase = 'carry';
        arrangeBalls(true);
        refreshAll();
        if (state.balls[z].length >= 10) toast(`✨ 滿 10 個${UNIT[z]}的已經框起來了！\n把框拖到左邊的【${NAME[leftOf(z)]}】。`, 'info', 3000);
        else { toast(`👍 ${NAME[z]}乘完了，不用進位！`, 'ok', 1600); later(advanceStep, 600); }
    }

    function afterMerge(from) {
        const step = curStep();
        if (step && state.guide.phase === 'carry' && step.zone === from && state.balls[from].length < 10) later(advanceStep, 500);
        refreshActionUI();
    }

    addBtn.addEventListener('click', () => triggerAdd(state.workZone));
    subBtn.addEventListener('click', () => triggerSub(state.workZone));
    doneBtn.addEventListener('click', stepDone);

    // ---------- 9. 判定答案 ----------
    function nextAfter(fn, delay = 900) {
        state.locked = true;
        const tok = state.flowToken;
        setTimeout(() => { if (tok !== state.flowToken) return; state.locked = false; fn(); }, delay);
    }

    function submitAnswer() {
        if (state.locked) return;
        if (state.animating || state.characters.some(c => c.state !== 'walking_out')) { toast('⏳ 小人還在搬、或球還在變化，等一下再送出喔！', 'warn'); return; }
        const s = state.stageIdx, st = curStage(), Z = state.zones, inp = state.inputs[s];
        const boxes = boxesOf(s);
        if (!boxes.some(p => inp[p])) { toast('✏️ 請先輸入答案喔！', 'warn'); return; }

        const over = Z.filter(p => state.balls[p].length > 9);
        if (over.length) {
            toast(`⚠️【${over.map(p => NAME[p]).join('、')}】有 10 個以上的球，要「進位」喔！\n${isGuided() ? '照著上方的步驟，一位一位完成。' : '框選 10 個，拖到左邊一格換成 1 個大球。'}`, 'warn', 3600);
            return;
        }

        const target = st.target;
        const userAns = boxes.reduce((t, p) => t + parseInt(inp[p] || '0', 10) * VAL[p], 0);
        const exp = {}; Z.forEach(p => { exp[p] = digitAt(target, p); });
        const ballsOk = Z.every(p => state.balls[p].length === exp[p]);
        const stat = state.sessionStats[state.levelId];

        if (userAns === target && ballsOk) {
            if (s < state.plan.length - 1) {
                toast(s === 0 ? `✅ 第一列對了！\n接著算 ${state.a} × ${state.plan[1].mult} 個十。` : '✅ 第二列也對了！\n最後把兩列加起來。', 'ok', 2600);
                nextAfter(() => startStage(s + 1), 1100);
                return;
            }
            if (state.sysMode !== 'review_wrong' && stat) stat.correct++;
            if (state.sysMode === 'challenge') {
                state.challengeLvlCorrect++;
                let msg = '🎉 答對了！繼續挑戰！';
                if (state.challengeLvlCorrect >= PER_LEVEL) {
                    state.challengeIndex++; state.challengeLvlCorrect = 0;
                    if (state.challengeIndex >= LEVELS.length) {
                        toast('🏆 恭喜！你已經全破所有關卡了！', 'ok', 3000);
                        nextAfter(() => showSummaryAndSave(true));
                        return;
                    }
                    msg = `🎉 過關！下一關：${LEVEL_NAMES[LEVELS[state.challengeIndex]]}`;
                }
                toast(msg, 'ok');
                state.levelId = LEVELS[state.challengeIndex];
                updateChallengeUI();
                persist();
                nextAfter(() => initGame());
            } else if (state.sysMode === 'review_wrong') {
                DB.removeWrong({ a: state.a, b: state.b });
                toast('🎉 訂正成功！此題已從錯題本移除。', 'ok');
                nextAfter(() => { switchSysMode('practice', { skipSave: true }); showWrongsModal(); });
            } else {
                persist();
                toast('🎉 答對了！前往下一題！', 'ok');
                nextAfter(() => initGame());
            }
        } else {
            if (state.sysMode !== 'review_wrong') {
                if (stat) stat.wrong++;
                DB.addWrong({ a: state.a, b: state.b, level: state.levelId });
            }
            showCheckResult(userAns, target, exp, boxes);
        }
        persist();
    }
    $('btn-submit').addEventListener('click', submitAnswer);

    function showCheckResult(userAns, target, exp, boxes) {
        const st = curStage(), Z = state.zones, inp = state.inputs[state.stageIdx];
        const zones = Z.filter(p => exp[p] > 0 || state.balls[p].length > 0 || boxes.includes(p));
        const bad = zones.filter(p => state.balls[p].length !== exp[p]);
        const ansOk = userAns === target;
        const row = (label, ok, okText, badText) => `<div class="fb-row ${ok ? 'ok' : 'bad'}"><span>${label}</span><b>${ok ? okText : badText}</b></div>`;
        let tip;
        if (ansOk && bad.length) tip = '答案算對了！再把畫面上的球擺成跟答案一樣。';
        else if (!ansOk && !bad.length) tip = '球都擺對了！數數看每一區有幾個，再對照你寫的答案。';
        else tip = '先把每一區的球擺好，再數數看答案是多少。';
        const typed = Z.map(p => boxes.includes(p) ? (inp[p] || '□') : (st.shift === 1 && p === 'one' ? '0' : '')).join('');
        const html = `
            <div class="fb-sec"><div class="fb-h">① 各區的球</div>
                ${zones.map(p => row(`${NAME[p]}的球`, !bad.includes(p), '✅ 正確', '❌ 再檢查')).join('')}
            </div>
            <div class="fb-sec"><div class="fb-h">② ${state.plan.length > 1 && state.stageIdx < 2 ? '這一列的答案' : '整體答案'}</div>
                ${row(`你的答案：<b class="fb-ans">${typed}</b>`, ansOk, '✅ 正確', '❌ 不正確')}
            </div>
            <p class="fb-tip">💡 ${tip}</p>
            ${state.sysMode !== 'review_wrong' ? '<p class="fb-note">（本題已加入錯題本）</p>' : ''}
            <button class="fb-close" data-action="close">繼續修正</button>`;
        state.zoneError = { zones: bad, until: Date.now() + 5000 };
        showModal('📝 檢查結果', html);
    }

    // ---------- 10. 球的排列（每排 10 顆，依份交替墊底色） ----------
    function computeGeo(p, n) {
        const sx = (zoneW() - 16) / 10;
        const rows = Math.max(1, Math.ceil(n / 10));
        const sy = Math.min(sx * 1.3, (BOTTOM - TOP) / rows);
        return { x0: zoneX(p) + 8, sx, sy, r: Math.max(5, Math.min(C[p].r, sx * 0.41, sy * 0.4)) };
    }
    function cellPos(p, i) {
        const g = state.geo[p] || computeGeo(p, i + 1);
        return { x: g.x0 + g.sx * (i % 10 + 0.5), y: TOP + g.sy * (Math.floor(i / 10) + 0.5) };
    }

    class Ball {
        constructor(x, y, type, group = 0, carried = false) {
            this.x = x; this.y = y; this.type = type; this.group = group; this.carried = carried;
            this.selected = false; this.isTargeted = false; this.busy = false; this.dragging = false;
            this.targetX = null; this.targetY = null; this.onReachTarget = null;
        }
        update() {
            if (this.targetX === null) return;
            const dx = this.targetX - this.x, dy = this.targetY - this.y;
            this.x += dx * 0.14; this.y += dy * 0.14;
            if (Math.abs(dx) < 1.2 && Math.abs(dy) < 1.2) {
                this.x = this.targetX; this.y = this.targetY; this.targetX = this.targetY = null;
                if (this.onReachTarget) { const cb = this.onReachTarget; this.onReachTarget = null; cb(this); }
            }
        }
    }

    function arrangeBalls(animate = false) {
        state.zones.forEach(p => {
            const arr = state.balls[p];
            arr.sort((x, y) => (x.carried ? 0 : x.group + 1) - (y.carried ? 0 : y.group + 1)); // 進位來的球排最前面，其餘依份排列
            state.geo[p] = computeGeo(p, arr.length);
            arr.forEach((b, i) => {
                if (b.dragging || b.onReachTarget) return;
                const pos = cellPos(p, i);
                if (animate) { b.targetX = pos.x; b.targetY = pos.y; }
                else { b.x = pos.x; b.y = pos.y; b.targetX = b.targetY = null; }
            });
        });
        computeFrames();
    }

    // 引導模式：乘完後，把每一整排 10 顆框起來
    function computeFrames() {
        state.frames = [];
        const step = curStep();
        if (!step) return;
        const zones = new Set(state.multiplied); // 不檢查模式：乘完的位隨時可以進位
        if (state.guide.phase === 'carry') zones.add(step.zone);
        zones.forEach(z => {
            const arr = state.balls[z], g = state.geo[z]; let first = true;
            for (let r = 0; r * 10 + 10 <= arr.length; r++) {
                const row = arr.slice(r * 10, r * 10 + 10);
                if (row.some(b => b.busy)) continue;
                state.frames.push({ zone: z, balls: row, first, x: g.x0 - 2, y: TOP + g.sy * r + 1, w: g.sx * 10 + 4, h: g.sy - 2, dx: 0, dy: 0 });
                first = false;
            }
        });
    }

    // ---------- 11. 小人：一次端一份 ----------
    class Character {
        constructor(mode, zone, k, group, targets) {
            this.mode = mode; this.zone = zone; this.k = k; this.group = group; this.targets = targets || [];
            this.x = W + 40; this.y = 500 + (IDX[zone] % 2) * 26;
            this.state = 'walking_in'; this.speed = 5; this.stepCount = 0; this.t = 0;
            this.hasLoad = mode === 'add';
        }
        update() {
            this.stepCount += 0.22;
            if (this.state === 'walking_in') {
                let tx, ty;
                if (this.mode === 'sub') {
                    const alive = this.targets.filter(b => state.balls[this.zone].includes(b));
                    if (!alive.length) { this.state = 'walking_out'; return; }
                    tx = alive[0].x; ty = alive[0].y + 30;
                } else {
                    const pos = cellPos(this.zone, state.balls[this.zone].length); tx = pos.x; ty = pos.y + 30;
                }
                const dx = tx - this.x, dy = ty - this.y, dist = Math.hypot(dx, dy);
                if (dist <= this.speed) this.state = 'acting';
                else { this.x += dx / dist * this.speed; this.y += dy / dist * this.speed; }
            } else if (this.state === 'acting') {
                if (++this.t > 14) {
                    const z = this.zone;
                    if (this.mode === 'sub') {
                        state.balls[z] = state.balls[z].filter(b => !this.targets.includes(b));
                        this.hasLoad = true;
                    } else {
                        for (let j = 0; j < this.k; j++) state.balls[z].push(new Ball(this.x + (j - (this.k - 1) / 2) * 7, this.y - 34, z, this.group));
                        this.hasLoad = false;
                    }
                    arrangeBalls(true);
                    this.state = 'walking_out';
                }
            } else { this.x += this.speed * 1.2; this.y += this.speed * 0.12; }
        }
        draw() {
            const bounce = Math.abs(Math.sin(this.stepCount)) * 4, leg = Math.sin(this.stepCount) * 5, dy = this.y - bounce;
            ctx.fillStyle = '#3F4A5E';
            ctx.beginPath(); ctx.roundRect(this.x - 8 + leg, dy + 10, 6, 12, 3); ctx.fill();
            ctx.beginPath(); ctx.roundRect(this.x + 2 - leg, dy + 10, 6, 12, 3); ctx.fill();
            ctx.fillStyle = C[this.zone].color;
            ctx.beginPath(); ctx.roundRect(this.x - 12, dy - 20, 24, 32, 12); ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
            const eo = this.state === 'walking_in' ? -3 : (this.state === 'walking_out' ? 3 : 0);
            ctx.fillStyle = '#1A202C';
            ctx.beginPath(); ctx.arc(this.x - 4 + eo, dy - 6, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(this.x + 4 + eo, dy - 6, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,120,120,.6)';
            ctx.beginPath(); ctx.arc(this.x - 8 + eo, dy - 1, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(this.x + 8 + eo, dy - 1, 3, 0, Math.PI * 2); ctx.fill();
            if (this.hasLoad) { // 頭上端著一盤（一份）
                const n = this.k, tw = n * 9 + 8, tx = this.x - tw / 2, ty = dy - 40;
                ctx.beginPath(); ctx.roundRect(tx, ty, tw, 14, 6);
                ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = C[this.zone].ink; ctx.stroke();
                ctx.fillStyle = C[this.zone].color;
                for (let j = 0; j < n; j++) { ctx.beginPath(); ctx.arc(tx + 8.5 + j * 9, ty + 7, 3.5, 0, Math.PI * 2); ctx.fill(); }
            }
        }
    }

    function triggerAdd(p) {
        if (state.locked) return;
        const st = curStage(), k = groupSize(p);
        if (st.kind !== 'mul' || k === 0) { toast(`【${NAME[p]}】這一步不用放球喔！`, 'info'); return; }
        if (isGuided()) { const step = curStep(); if (!step || step.zone !== p || state.guide.phase !== 'place') return; }
        if ((state.groupCount[p] || 0) >= 9) { toast('一位最多放 9 份喔！', 'warn'); return; }
        const g = (state.groupCount[p] || 0) + 1;
        state.groupCount[p] = g;
        state.characters.push(new Character('add', p, k, g));
        refreshActionUI();
    }

    function triggerSub(p) {
        if (state.locked) return;
        const st = curStage(), k = groupSize(p);
        if (st.kind !== 'mul' || k === 0) return;
        if (isGuided()) { const step = curStep(); if (!step || step.zone !== p || state.guide.phase !== 'place') return; }
        const g = state.groupCount[p] || 0;
        if (!g) { toast(`【${NAME[p]}】還沒有放任何一份喔！`, 'warn'); return; }
        if (state.characters.some(c => c.zone === p && c.mode === 'add' && c.state !== 'walking_out')) { toast('⏳ 等小人把球放好再搬走喔！', 'warn'); return; }
        const targets = state.balls[p].filter(b => b.group === g && !b.carried && !b.busy && !b.isTargeted);
        if (targets.length !== k) { toast('這一份已經有球拿去進位了，\n不能整份搬走喔！可以按「本題重來」。', 'warn', 3000); return; }
        targets.forEach(b => { b.isTargeted = true; b.selected = false; });
        state.groupCount[p] = g - 1;
        state.characters.push(new Character('sub', p, k, g, targets));
        refreshActionUI();
    }

    // ---------- 12. 進位（合併 10 顆） ----------
    function startAnim() { state.animating = true; return ++state.animToken; }
    function endAnim(tok) { setTimeout(() => { if (tok === state.animToken) state.animating = false; }, 400); }

    function merge(arr, from, to, dx, dy) {
        const tok = startAnim(), x0 = zoneX(to), zw = zoneW();
        dx = Math.max(x0 + 30, Math.min(x0 + zw - 30, dx));
        dy = Math.max(TOP + 10, Math.min(BOTTOM - 10, dy));
        let reached = 0;
        arr.forEach(b => {
            b.busy = true; b.selected = false; b.dragging = false; b.targetX = dx; b.targetY = dy;
            b.onReachTarget = () => {
                if (tok !== state.animToken) return;
                if (++reached === arr.length) {
                    state.balls[from] = state.balls[from].filter(x => !arr.includes(x));
                    const k = Math.floor(arr.length / 10); // 每 10 顆換 1 顆
                    for (let j = 0; j < k; j++) state.balls[to].push(new Ball(dx + (j - (k - 1) / 2) * 14, dy, to, 0, true));
                    state.regroup[to] = (state.regroup[to] || 0) + k;
                    arrangeBalls(true); updateCarryMarks(); endAnim(tok);
                    afterMerge(from);
                }
            };
        });
        computeFrames();
    }

    // ---------- 13. 觸控 / 滑鼠 ----------
    const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    function canvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        return { px: (e.clientX - rect.left) * W / rect.width, py: (e.clientY - rect.top) * H / rect.height };
    }
    function findBallAt(px, py) {
        let best = null, bestD = Infinity;
        state.zones.forEach(t => {
            const r = (state.geo[t] || { r: 10 }).r;
            state.balls[t].forEach(b => {
                if (b.busy || b.isTargeted) return;
                const d = Math.hypot(px - b.x, py - b.y);
                if (d <= r + 10 && d < bestD) { bestD = d; best = b; }
            });
        });
        return best;
    }
    function dropAction(t, dz, n) {
        if (t === dz) return null;
        const L = leftOf(t);
        if (dz === rightOf(t)) return { ok: false, text: '乘法不用把球拆開喔！\n滿 10 個才往左邊進位。' };
        if (dz === L) return n > 0 && n % 10 === 0 ? { ok: true } : { ok: false, text: `沒有換成功！\n每 10 個${UNIT[t]}換 1 個${UNIT[L]}，要選 10 個、20 個、30 個……\n數數看你選了幾個？` };
        return { ok: false, text: '只能拖到左邊隔壁的位數喔！' };
    }
    const clearSel = () => state.zones.forEach(p => state.balls[p].forEach(b => { b.selected = false; b.dragging = false; }));

    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('pointerdown', e => {
        if (!e.isPrimary || dragInfo || state.animating || state.locked) return;
        e.preventDefault();
        const { px, py } = canvasPoint(e);
        if (isGuided()) {
            const f = state.frames.find(f => px >= f.x - 6 && px <= f.x + f.w + 6 && py >= f.y - 8 && py <= f.y + f.h + 8);
            if (!f) return;
            dragInfo = { frame: f, sx: px, sy: py, moved: false, pointerId: e.pointerId };
            f.balls.forEach(b => { b.dragging = true; b.dsx = b.x; b.dsy = b.y; b.targetX = b.targetY = null; });
        } else {
            const hit = findBallAt(px, py);
            if (hit) {
                const t = hit.type;
                state.zones.forEach(p => { if (p !== t) state.balls[p].forEach(b => { b.selected = false; }); });
                dragInfo = { type: t, sx: px, sy: py, moved: false, target: hit, orig: hit.selected, pointerId: e.pointerId };
                hit.selected = true;
                state.balls[t].forEach(b => { if (b.selected) { b.dsx = b.x; b.dsy = b.y; } });
                selectZone(t, false);
            } else {
                clearSel();
                dragInfo = { lasso: true, zone: zoneAt(px), sx: px, sy: py, moved: false, pointerId: e.pointerId };
            }
        }
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    });

    canvas.addEventListener('pointermove', e => {
        if (!dragInfo || e.pointerId !== dragInfo.pointerId) return;
        e.preventDefault();
        const { px, py } = canvasPoint(e);
        const dx = px - dragInfo.sx, dy = py - dragInfo.sy;
        if (!dragInfo.moved && Math.hypot(dx, dy) > 8) dragInfo.moved = true;
        if (!dragInfo.moved) return;
        if (dragInfo.frame) {
            const f = dragInfo.frame; f.dx = dx; f.dy = dy;
            f.balls.forEach(b => { b.x = b.dsx + dx; b.y = b.dsy + dy; });
            const dz = zoneAt(px);
            state.dragHint = dz !== f.zone ? { zone: dz } : null;
            return;
        }
        if (dragInfo.lasso) {
            const z = dragInfo.zone, zx0 = zoneX(z) + 6, zx1 = zoneX(z) + zoneW() - 6;
            const x0 = Math.max(zx0, Math.min(dragInfo.sx, px)), x1 = Math.min(zx1, Math.max(dragInfo.sx, px));
            const rect = { x: x0, y: Math.min(dragInfo.sy, py), w: Math.max(0, x1 - x0), h: Math.abs(dy) };
            state.lasso = rect;
            state.balls[z].forEach(b => { b.selected = !b.busy && !b.isTargeted && inRect(b.x, b.y, rect); });
            return;
        }
        state.balls[dragInfo.type].filter(b => b.selected).forEach(b => { b.dragging = true; b.targetX = b.targetY = null; b.x = b.dsx + dx; b.y = b.dsy + dy; });
        const dz = zoneAt(px);
        state.dragHint = dz !== dragInfo.type ? { zone: dz } : null;
    });

    function endDrag(e, cancelled) {
        if (!dragInfo || e.pointerId !== dragInfo.pointerId) return;
        const { px, py } = canvasPoint(e);
        const info = dragInfo; dragInfo = null;
        state.dragHint = null;
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

        if (info.frame) {
            const f = info.frame, L = leftOf(f.zone), dz = zoneAt(px);
            f.balls.forEach(b => { b.dragging = false; }); f.dx = f.dy = 0;
            if (info.moved && !cancelled && dz === L) merge(f.balls, f.zone, L, px, py);
            else { if (info.moved && dz !== f.zone) toast(`要拖到左邊的【${NAME[L]}】喔！`, 'warn'); arrangeBalls(true); }
            return;
        }
        if (info.lasso) {
            if (!info.moved) selectZone(info.zone, false);
            state.lasso = null;
            return;
        }
        const t = info.type;
        if (!info.moved) { if (info.orig) info.target.selected = false; }
        else {
            const sel = state.balls[t].filter(b => b.selected);
            const act = cancelled ? null : dropAction(t, zoneAt(px), sel.length);
            if (act && act.ok) merge(sel, t, zoneAt(px), px, py);
            else if (act) toast(act.text, 'warn', 3000);
            clearSel();
        }
        arrangeBalls(true);
    }
    canvas.addEventListener('pointerup', e => endDrag(e, false));
    canvas.addEventListener('pointercancel', e => endDrag(e, true));

    // ---------- 14. 初始化 ----------
    function startStage(s) {
        state.flowToken++;
        state.stageIdx = s;
        state.animToken++; state.animating = false;
        ALL.forEach(p => { state.balls[p] = []; });
        state.groupCount = {}; state.regroup = {}; state.characters = []; state.frames = []; state.multiplied = [];
        state.lasso = null; state.dragHint = null; state.zoneError = null; dragInfo = null;
        const st = curStage();
        if (st.kind === 'add') { // 第一列的球淺底、第二列的球深底
            const p1 = state.plan[0].target, p2 = state.plan[1].target;
            state.zones.forEach(p => {
                for (let k = 0; k < digitAt(p1, p); k++) state.balls[p].push(new Ball(0, 0, p, 1));
                for (let k = 0; k < digitAt(p2, p); k++) state.balls[p].push(new Ball(0, 0, p, 2));
            });
        }
        const boxes = boxesOf(s);
        state.activeInput = boxes.length ? boxes[boxes.length - 1] : 'one';
        buildSteps();
        arrangeBalls(false);
        if (isGuided()) activateStep();
        else {
            state.guide.phase = 'done';
            const first = [...state.zones].reverse().find(p => groupSize(p) > 0);
            state.workZone = first || 'one';
            refreshAll();
        }
    }

    function initGame(skipGen = false) {
        if (!skipGen) {
            if (state.sysMode === 'practice') state.levelId = $('level-select').value;
            generate(state.levelId);
        }
        buildPlan();
        state.inputs = state.plan.map(() => ({}));
        buildZoneTabs();
        buildEquation();
        startStage(0);
    }

    $('btn-restart').addEventListener('click', () => { if (!state.locked) initGame(state.sysMode === 'review_wrong'); });
    $('btn-redo-q').addEventListener('click', () => {
        if (state.locked) return;
        initGame(true);
        toast('🔄 本題重新開始！', 'info', 1200);
    });
    $('level-select').addEventListener('change', () => initGame(false));
    $('btn-finish-practice').addEventListener('click', () => showSummaryAndSave(false));
    $('btn-save-challenge').addEventListener('click', () => {
        saveChallenge(true);
        toast(`💾 已暫存：第 ${state.challengeIndex + 1} 關（答對 ${state.challengeLvlCorrect}/${PER_LEVEL}）\n可以關掉網頁，下次按「闖關模式」接著玩。`, 'ok', 3200);
    });
    $('nav-practice').addEventListener('click', () => { if (state.sysMode !== 'practice') switchSysMode('practice'); });
    $('nav-challenge').addEventListener('click', enterChallenge);
    $('nav-records').addEventListener('click', showRecordsModal);
    $('nav-wrongs').addEventListener('click', showWrongsModal);

    // ---------- 15. 使用說明 ----------
    function showHelpModal() {
        const html = `

            <div class="help-tabs">
                <button class="help-tab active" data-help="use">📖 使用說明</button>

            </section>

            <section class="help-page" data-page="one" hidden>
                <p class="help-key">🔑 從<b>個位</b>開始乘，滿 10 個就換成 1 個十，送到左邊，再加進下一位。</p>
                <div class="help-eg">
                    <div class="help-eq"><span class="carry"> 1 </span><br> 23<br>× 4<br><span class="line"> <span class="ans">92</span></span></div>
                    <ol>
                        <li><b>先乘個位</b>：一份 3 個一，放 4 份。3 × 4 = 12，個位有 12 個。</li>
                        <li><b>滿 10 就進位</b>：把 10 個一拖到十位，換成 1 個十。個位剩 2 個，寫 <b>2</b>；十位上方記一個小 <b>1</b>。</li>
                        <li><b>再乘十位</b>：一份 2 個十，放 4 份。2 × 4 = 8，再加進位的 1，等於 9，寫 <b>9</b>。</li>
                        <li><b>答案</b>：92。數數畫面上的球：9 個十、2 個一，跟答案一樣。</li>
                    </ol>
                </div>
                <p class="help-tip">💡 最常忘記的地方：乘完之後，要<b>再加上進位的數</b>！</p>
                <p class="help-tip">💡 三位數也一樣：個位 → 十位 → 百位，一位一位往左乘。</p>
            </section>

            <section class="help-page" data-page="two" hidden>
                <p class="help-key">🔑 23 × 14，就是 14 份 23。把 14 份拆成 <b>4 份</b>和 <b>10 份</b>，分兩列算，最後加起來。</p>
                <div class="help-eg">
                    <div class="help-eq">  23<br>× 14<br><span class="line">  <span class="ans">92</span></span><br> <span class="ans">23</span><span class="faint">0</span><br><span class="line"> <span class="ans">322</span></span></div>
                    <ol>
                        <li><b>第一列 23 × 4</b>：跟一位數乘法一樣，從個位開始乘、進位，得到 <b>92</b>。</li>
                        <li><b>第二列 23 × 1 個十</b>：乘數十位的 1 代表 1 個十。乘以 10，每一位都往左移一格，所以球直接放到十位和百位，寫成 <b>23</b>，往左空一格。</li>
                        <li><b>相加</b>：把兩列的球合起來，滿 10 一樣進位。92 + 230 = <b>322</b>。</li>
                    </ol>
                </div>
                <p class="help-tip">💡 第二列個位那個淡淡的 0 可以不寫，但要記得：<b>第二列是從十位開始寫</b>。</p>
            </section>
        </div>`;
        showModal('❓ 使用說明', html);
    }
    $('nav-help').addEventListener('click', showHelpModal);

    // ---------- 16. 畫布尺寸 ----------
    function resizeCanvas() {
        const wrap = $('canvas-wrapper');
        const rw = wrap.clientWidth, rh = wrap.clientHeight;
        if (!rw || !rh) return;
        const scale = Math.min(rw / W, rh / H);
        const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
        canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    }
    if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe($('canvas-wrapper'));
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

    // ---------- 17. 繪圖 ----------
    function drawCell(b) {
        const g = state.geo[b.type]; if (!g) return;
        const w = g.sx - 2, h = g.sy - 4;
        ctx.beginPath(); ctx.roundRect(b.x - w / 2, b.y - h / 2, w, h, Math.min(5, w / 4));
        if (b.carried) {
            ctx.fillStyle = '#FFFFFF'; ctx.fill();
            ctx.save(); ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5; ctx.strokeStyle = C[b.type].ink; ctx.stroke(); ctx.restore();
        } else { ctx.fillStyle = tint(b.type, b.group % 2 === 1 ? 0.10 : 0.42); ctx.fill(); }
    }

    function drawBall(b) {
        const r = (state.geo[b.type] || { r: 10 }).r, x = b.x, y = b.y, t = b.type;
        if (b.selected) {
            ctx.beginPath(); ctx.arc(x, y, r + 6, 0, Math.PI * 2); ctx.fillStyle = 'rgba(31,42,68,.85)'; ctx.fill();
            ctx.beginPath(); ctx.arc(x, y, r + 4, 0, Math.PI * 2); ctx.fillStyle = '#FFD43B'; ctx.fill();
        }
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = C[t].color; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
        ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.38, r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
        let label = null, fs = 0;
        if (b.carried) {
            ctx.save(); ctx.setLineDash([3, 2]); ctx.lineWidth = 1.6; ctx.strokeStyle = C[t].ink;
            ctx.beginPath(); ctx.arc(x, y, r + 2.6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
            label = '進'; fs = r * 1.1;
        } else {
            label = String(VAL[t]); fs = r * [1.05, 0.85, 0.62, 0.5][label.length - 1];
        }
        if (fs >= 7.5) {
            ctx.font = `800 ${Math.round(fs)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.strokeText(label, x, y + 1);
            ctx.fillStyle = '#fff'; ctx.fillText(label, x, y + 1);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
        const errZones = (state.zoneError && Date.now() < state.zoneError.until) ? state.zoneError.zones : [];
        const zw = zoneW(), step = curStep(), g = isGuided();

        state.zones.forEach(p => {
            const x = zoneX(p), sel = state.workZone === p, cx = x + zw / 2;
            ctx.beginPath(); ctx.roundRect(x + 6, 8, zw - 12, H - 16, 16);
            ctx.fillStyle = tint(p, sel ? 0.12 : 0.04); ctx.fill();
            if (sel && (!g || step)) { ctx.lineWidth = 3; ctx.strokeStyle = tint(p, 0.75); ctx.stroke(); }
            ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
            ctx.font = `800 24px ${FONT}`; ctx.fillStyle = C[p].ink;
            ctx.fillText(NAME[p], cx, 38);
            ctx.font = `600 14px ${FONT}`; ctx.fillStyle = '#6B7280';
            ctx.fillText(`1 個 = ${VAL[p]}`, cx, 57);
            const k = groupSize(p);
            if (k > 0) { ctx.font = `700 14px ${FONT}`; ctx.fillStyle = tint(p, 0.9); ctx.fillText(`一份 ${k} 個${UNIT[p]}`, cx, 78); }
            if (sel && (!g || step)) { ctx.font = `800 15px ${FONT}`; ctx.fillStyle = C[p].ink; ctx.fillText('▼ 小人工作區 ▼', cx, H - 18); }
            if (errZones.includes(p)) {
                ctx.save(); ctx.lineWidth = 5; ctx.strokeStyle = state.flashState ? '#E0483E' : 'rgba(224,72,62,.45)';
                ctx.beginPath(); ctx.roundRect(x + 6, 8, zw - 12, H - 16, 16); ctx.stroke(); ctx.restore();
                ctx.font = `800 16px ${FONT}`; ctx.fillStyle = '#E0483E';
                ctx.fillText('❌ 這一區再檢查', cx, H - 44);
            }
        });

        // 底色 → 球（拖曳中的畫在最上層）
        state.zones.forEach(p => state.balls[p].forEach(b => { b.update(); drawCell(b); }));
        state.zones.forEach(p => state.balls[p].forEach(b => { if (!b.dragging && !b.selected) drawBall(b); }));

        // 引導模式：鎖住的區淡化（進位時左邊那格不淡化）
        if (g && step) {
            state.zones.forEach(p => {
                const open = p === step.zone || (state.guide.phase === 'carry' && p === leftOf(step.zone))
                    || state.frames.some(f => f.zone === p || leftOf(f.zone) === p);
                if (open) return;
                ctx.beginPath(); ctx.roundRect(zoneX(p) + 6, 8, zw - 12, H - 16, 16);
                ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
            });
        }

        state.frames.forEach(f => {
            const x = f.x + f.dx, y = f.y + f.dy;
            ctx.save();
            ctx.beginPath(); ctx.roundRect(x, y, f.w, f.h, 8);
            ctx.fillStyle = 'rgba(242,183,5,.10)'; ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = state.flashState ? '#F2B705' : '#C98F00'; ctx.stroke();
            if (!f.first && !f.dx && !f.dy) { ctx.restore(); return; } // 每一區只在第一個框（或拖曳中的框）標示
            const tw = 40, tx = x + f.w - tw - 4, ty = y - 10;
            ctx.beginPath(); ctx.roundRect(tx, ty, tw, 18, 9); ctx.fillStyle = '#F2B705'; ctx.fill();
            ctx.font = `800 12px ${FONT}`; ctx.fillStyle = '#3D2E00'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('◀ 拖我', tx + tw / 2, ty + 9.5);
            ctx.restore();
        });
        state.zones.forEach(p => state.balls[p].forEach(b => { if (b.dragging || b.selected) drawBall(b); }));

        if (state.dragHint) {
            const z = state.dragHint.zone;
            ctx.save(); ctx.setLineDash([12, 8]); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(31,42,68,.45)';
            ctx.beginPath(); ctx.roundRect(zoneX(z) + 6, 8, zw - 12, H - 16, 16); ctx.stroke(); ctx.restore();
        }
        if (state.lasso) {
            const r = state.lasso;
            ctx.save(); ctx.setLineDash([8, 6]); ctx.lineWidth = 2.5; ctx.strokeStyle = '#1F2A44';
            ctx.fillStyle = 'rgba(255,212,59,.18)';
            ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill(); ctx.stroke(); ctx.restore();
        }

        state.characters.forEach(c => { c.update(); c.draw(); });
        state.characters = state.characters.filter(c => c.x < W + 120);
        requestAnimationFrame(draw);
    }

    // ---------- 18. 小鍵盤（停靠 / 浮動） ----------
    const keypad = $('keypad'), kpHandle = $('keypad-handle'), kpToggle = $('keypad-toggle'), kpDockBtn = $('keypad-dock');
    const dock = $('right-dock'), mainBox = $('main-container');
    let kpPos = { x: 0, y: 0 }, kpDrag = null;
    const isDocked = () => keypad.classList.contains('docked');
    function saveKp() { try { localStorage.setItem(KEYS.kp, JSON.stringify({ docked: isDocked(), x: kpPos.x, y: kpPos.y, collapsed: keypad.classList.contains('collapsed') })); } catch (e) {} }
    function loadKp() { try { return JSON.parse(localStorage.getItem(KEYS.kp) || 'null'); } catch (e) { return null; } }
    function placeKeypad(x, y) {
        const w = keypad.offsetWidth, h = keypad.offsetHeight;
        const maxX = Math.max(4, window.innerWidth - w - 4), maxY = Math.max(4, window.innerHeight - h - 4);
        kpPos = { x: Math.min(Math.max(4, x), maxX), y: Math.min(Math.max(4, y), maxY) };
        keypad.style.transform = `translate(${kpPos.x}px, ${kpPos.y}px)`;
    }
    function dockKeypad() {
        if (keypad.parentElement !== dock) dock.appendChild(keypad);
        keypad.classList.add('docked'); keypad.style.transform = '';
        mainBox.classList.remove('dock-empty');
    }
    function undockKeypad(x, y) {
        if (keypad.parentElement !== document.body) document.body.appendChild(keypad);
        keypad.classList.remove('docked');
        mainBox.classList.add('dock-empty');
        placeKeypad(x, y);
    }
    kpHandle.addEventListener('pointerdown', e => {
        if (!e.isPrimary || e.target.closest('.kp-icon')) return;
        e.preventDefault();
        const r = keypad.getBoundingClientRect();
        kpDrag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, started: false };
        try { kpHandle.setPointerCapture(e.pointerId); } catch (_) {}
    });
    kpHandle.addEventListener('pointermove', e => {
        if (!kpDrag || e.pointerId !== kpDrag.id) return;
        if (!kpDrag.started) {
            if (Math.hypot(e.clientX - kpDrag.sx, e.clientY - kpDrag.sy) < 6) return;
            kpDrag.started = true;
            keypad.classList.add('dragging');
            if (isDocked()) { undockKeypad(e.clientX - kpDrag.dx, e.clientY - kpDrag.dy); try { kpHandle.setPointerCapture(e.pointerId); } catch (_) {} }
        }
        placeKeypad(e.clientX - kpDrag.dx, e.clientY - kpDrag.dy);
    });
    const endKpDrag = e => {
        if (!kpDrag || e.pointerId !== kpDrag.id) return;
        const started = kpDrag.started;
        kpDrag = null; keypad.classList.remove('dragging');
        try { kpHandle.releasePointerCapture(e.pointerId); } catch (_) {}
        if (started) saveKp();
    };
    kpHandle.addEventListener('pointerup', endKpDrag);
    kpHandle.addEventListener('pointercancel', endKpDrag);
    kpToggle.addEventListener('click', () => {
        const c = keypad.classList.toggle('collapsed');
        kpToggle.textContent = c ? '＋' : '－';
        if (!isDocked()) placeKeypad(kpPos.x, kpPos.y);
        saveKp();
    });
    kpDockBtn.addEventListener('click', () => { dockKeypad(); saveKp(); });
    window.addEventListener('resize', () => { if (!isDocked()) placeKeypad(kpPos.x, kpPos.y); });
    (function initKeypad() {
        const saved = loadKp();
        if (saved && saved.collapsed) { keypad.classList.add('collapsed'); kpToggle.textContent = '＋'; }
        if (saved && saved.docked === false) undockKeypad(saved.x, saved.y); else dockKeypad();
        keypad.classList.add('ready');
    })();

    // ---------- 19. 全螢幕 ----------
    const fsBtn = $('nav-fullscreen');
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    function updateFsBtn() { fsBtn.textContent = fsElement() ? '🗗 離開全螢幕' : '⛶ 全螢幕'; }
    fsBtn.addEventListener('click', async () => {
        if (!fsSupported) { toast('這台裝置的瀏覽器不支援全螢幕。', 'info', 3000); return; }
        try {
            if (fsElement()) await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
            else { const el = document.documentElement; await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen()); }
        } catch (err) { toast('這裡無法切換全螢幕，可以用瀏覽器本身的全螢幕功能。', 'warn', 3000); }
    });
    document.addEventListener('fullscreenchange', () => { updateFsBtn(); setTimeout(resizeCanvas, 100); });
    document.addEventListener('webkitfullscreenchange', () => { updateFsBtn(); setTimeout(resizeCanvas, 100); });

    resizeCanvas();
    const recovered = flushPractice('未按結算（網頁關閉）');
    switchSysMode('practice', { skipSave: true });
    requestAnimationFrame(draw);
    const pendingCh = loadObj(SAVE.ch);
    if (pendingCh) askResume(pendingCh);
    else if (recovered) toast('📝 上次沒有結算的練習，已自動存進歷史紀錄', 'info', 3000);
})();
</script>

</body></html>
