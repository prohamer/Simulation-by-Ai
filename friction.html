<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摩擦力教學實驗室</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:system-ui,sans-serif;background:#eef0f3;color:#1d1d1f;}
:root{--fs:13px;}
#app{display:flex;flex-direction:column;height:100%;padding:8px;gap:0;}
#top{display:flex;gap:8px;overflow:hidden;flex-shrink:0;min-height:0;align-items:stretch;}
/* divider */
#divider{
  height:6px;flex-shrink:0;cursor:row-resize;
  display:flex;align-items:center;justify-content:center;
  margin:3px 0;
}
#divider-handle{
  width:48px;height:4px;border-radius:2px;
  background:#d0d0d0;transition:background .15s;
}
#divider:hover #divider-handle,#divider.dragging #divider-handle{background:#999;}
#sidebar{width:82px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden;}
#s-label{font-size:calc(var(--fs)*0.8);color:#999;text-align:center;line-height:1.3;}
#shelf{display:flex;flex-direction:column;gap:5px;align-items:center;padding:5px 3px;border:1.5px dashed #ccc;border-radius:8px;background:#f8f8f8;flex:1;}
#shelf.em{border-color:#4A7AC1;background:rgba(74,122,193,.06);}
.si{display:block;user-select:none;touch-action:none;border-radius:3px;}
#right{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden;}
canvas#sim{width:100%;flex:1;min-height:0;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;display:block;touch-action:none;user-select:none;cursor:ew-resize;}
canvas#sim.em{border-color:#4A7AC1;cursor:default;}
#ov{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;}
#irow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.ic{font-size:var(--fs);padding:2px 8px;border-radius:5px;background:#f0f0f0;color:#555;border:1px solid #e5e5e5;white-space:nowrap;}
.ic b{color:#111;}
#sb{font-size:var(--fs);padding:2px 8px;border-radius:7px;font-weight:600;white-space:nowrap;}
.bs{background:#eee;color:#666;}.bst{background:#fff3cd;color:#856404;}.bm{background:#d1edda;color:#155724;}.bc{background:#cfe2ff;color:#084298;}
.eb{font-size:var(--fs);padding:2px 8px;border-radius:7px;background:rgba(74,122,193,.12);color:#4A7AC1;border:1px solid rgba(74,122,193,.25);display:none;font-weight:500;}
.eb.v{display:inline-block;}
.ibtn{font-size:var(--fs);padding:2px 9px;border:1px solid #ddd;border-radius:5px;background:#fff;color:#555;cursor:pointer;white-space:nowrap;}
.ibtn:hover{background:#f0f0f0;}
#ctrl{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;flex-shrink:0;}
#fc{flex:1;min-width:150px;}
#rc{flex-shrink:0;}
.sl{font-size:var(--fs);color:#555;margin-bottom:2px;font-weight:500;}
.cl{display:flex;align-items:center;gap:5px;}
.cl button{width:24px;height:24px;font-size:15px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#333;cursor:pointer;flex-shrink:0;font-weight:bold;line-height:1;}
.cl button:hover{background:#f0f0f0;}
.cl input[type=range]{flex:1;min-width:0;accent-color:#4A7AC1;}
.fv{font-size:var(--fs);font-weight:600;color:#111;min-width:52px;text-align:right;white-space:nowrap;}
select{font-size:var(--fs);border:1px solid #ddd;border-radius:6px;background:#fff;color:#333;padding:3px 6px;}
.cr{display:flex;align-items:center;gap:5px;font-size:var(--fs);color:#555;cursor:pointer;user-select:none;white-space:nowrap;}
.cr input{cursor:pointer;accent-color:#4A7AC1;}
#sh{font-size:calc(var(--fs)*0.75);color:#bbb;text-align:center;margin-top:2px;}
#charts{display:flex;gap:6px;min-height:0;overflow:hidden;flex-shrink:0;}
.cw{flex:1;min-height:0;border:1px solid #e5e5e5;border-radius:8px;background:#f8f8f8;overflow:hidden;position:relative;}
.chart-hdr{position:absolute;top:3px;left:6px;right:6px;display:flex;justify-content:space-between;align-items:center;z-index:2;pointer-events:none;}
.chart-hdr>span{font-size:calc(var(--fs)*0.85);color:#aaa;}
.chart-hdr>button{pointer-events:all;font-size:calc(var(--fs)*0.85);padding:2px 7px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#555;cursor:pointer;}
.chart-hdr>button:hover{background:#f0f0f0;}
#exp-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.exp-tab{font-size:var(--fs);padding:2px 9px;border-radius:5px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#555;}
.exp-tab.active{font-weight:600;}
.exp-tab.add-btn{border-style:dashed;color:#4A7AC1;border-color:#4A7AC1;}
.exp-tab.add-btn:hover{background:rgba(74,122,193,.07);}
.del-x{font-size:var(--fs);padding:1px 5px;border-radius:4px;border:1px solid #fcc;background:#fff8f8;color:#c00;cursor:pointer;}
.del-x:hover{background:#ffe0e0;}
.ldot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:middle;}
/* Exp preview popup (floats, no layout impact) */
#exp-preview{
  display:none;position:fixed;z-index:5000;
  background:#fff;border:1px solid #ddd;border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  padding:8px 10px;gap:8px;align-items:center;flex-wrap:wrap;
  max-width:320px;
}
#exp-preview.open{display:flex;}
#exp-preview-close{font-size:11px;padding:0 5px;border:none;background:none;color:#aaa;cursor:pointer;margin-left:auto;line-height:1;}
#exp-preview-close:hover{color:#555;}
/* Fullscreen */
#fs-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:10000;flex-direction:column;padding:10px;gap:6px;}
#fs-overlay.open{display:flex;}
#fs-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#fs-close{font-size:var(--fs);padding:3px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#333;cursor:pointer;}
#fs-close:hover{background:#f0f0f0;}
#fs-title{font-size:calc(var(--fs)*1.1);font-weight:600;color:#333;}
#fs-canvas-wrap{flex:1;min-height:0;position:relative;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;background:#fafafa;}
#fs-canvas{display:block;width:100%;height:100%;cursor:grab;}
#fs-hint{font-size:calc(var(--fs)*0.85);color:#aaa;text-align:center;}
#fs-exp-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
/* font size toolbar */
#font-ctrl{display:flex;align-items:center;gap:3px;}
#font-ctrl button{font-size:calc(var(--fs)*0.9);padding:1px 7px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#333;cursor:pointer;font-weight:bold;}
#font-ctrl button:hover{background:#f0f0f0;}
/* sim fullscreen overlay */
#sim-fs-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:10000;flex-direction:column;padding:10px;gap:6px;}
#sim-fs-overlay.open{display:flex;}
#sim-fs-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#sim-fs-close{font-size:var(--fs);padding:3px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#333;cursor:pointer;}
#sim-fs-close:hover{background:#f0f0f0;}
#sim-fs-canvas-wrap{flex:1;min-height:0;border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#f8f8f8;position:relative;}
#sim-fs-canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;}
/* sim fullscreen button */
#sim-fs-btn{font-size:calc(var(--fs)*0.85);padding:1px 7px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#555;cursor:pointer;white-space:nowrap;}
#sim-fs-btn:hover{background:#f0f0f0;}
/* sim wrap */
#sim-wrap{position:relative;flex:1;min-height:60px;display:flex;flex-direction:column;}
#sim-hdr{position:absolute;top:4px;right:6px;z-index:3;display:flex;gap:4px;}
/* Point detail replay banner on sim canvas */
#pt-replay-bar{
  display:none;position:absolute;top:4px;left:4px;right:42px;z-index:4;
  background:rgba(255,255,255,0.92);border:1px solid #ddd;border-radius:7px;
  padding:4px 8px;display:none;align-items:center;gap:8px;flex-wrap:wrap;
  pointer-events:none;
}
#pt-replay-bar.open{display:flex;pointer-events:all;}
#pt-replay-close{border:none;background:none;font-size:14px;color:#aaa;cursor:pointer;margin-left:auto;padding:0 2px;}
#pt-replay-close:hover{color:#555;}
.pt-replay-chip{font-size:calc(var(--fs)*0.85);padding:1px 7px;border-radius:5px;background:#f0f0f0;color:#333;white-space:nowrap;}
#pt-replay-title{font-size:calc(var(--fs)*0.9);font-weight:600;white-space:nowrap;}
#pt-replay-hint{font-size:calc(var(--fs)*0.75);color:#aaa;width:100%;}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="sidebar">
      <div id="s-label">待選物體<br>(可重複加入)</div>
      <div id="shelf"></div>
    </div>
    <div id="right">
      <div id="sim-wrap">
        <canvas id="sim"></canvas>
        <div id="sim-hdr">
          <button id="sim-fs-btn">⛶ 全螢幕</button>
        </div>
        <div id="pt-replay-bar">
          <span id="pt-replay-title"></span>
          <span class="pt-replay-chip" id="pr-f"></span>
          <span class="pt-replay-chip" id="pr-fr"></span>
          <span class="pt-replay-chip" id="pr-n"></span>
          <span class="pt-replay-chip" id="pr-a"></span>
          <span class="pt-replay-chip" id="pr-v"></span>
          <span class="pt-replay-chip" id="pr-state"></span>
          <button id="pt-replay-close">✕ 離開回放</button>
          <span id="pt-replay-hint">點選其他資料點繼續回放，或取消勾選「點選查看情境」退出</span>
        </div>
      </div>
      <canvas id="ov"></canvas>
      <div id="irow">
        <div class="ic">F=<b id="fv">0.0</b><span class="uL">N</span></div>
        <div class="ic">f=<b id="frv">0.0</b><span class="uL">N</span></div>
        <div class="ic">N=<b id="nv">0.0</b><span class="uL">N</span></div>
        <div class="ic">a=<b id="av">0.0</b>m/s²</div>
        <span id="sb" class="bs">靜止</span>
        <span class="eb" id="eb">✏️增減</span>
        <div id="font-ctrl">
          <button id="fa-btn" title="放大字體">A+</button>
          <button id="fs-btn2" title="縮小字體">A-</button>
        </div>
        <button class="ibtn" id="unit-toggle">N⇄kgw</button>
        <button class="ibtn" id="hb" style="margin-left:auto">⌂歸位</button>
        <button class="ibtn" id="rb">清除全部</button>
      </div>
      <div id="ctrl">
        <div id="fc">
          <div class="sl">拉力（負=向左，正=向右）</div>
          <div class="cl">
            <button id="fm">−</button>
            <input type="range" id="fs" min="-60" max="60" step="0.5" value="0">
            <button id="fp">+</button>
            <span class="fv" id="fsv">0.0 N</span>
          </div>
          <div id="sh">←向左 | 0 | 向右→</div>
          <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">
            <label class="cr"><input type="checkbox" id="cf">拉力恆定</label>
            <label class="cr"><input type="checkbox" id="em">物體增減</label>
            <label class="cr"><input type="checkbox" id="show-lines">繪製理論線</label>
            <label class="cr"><input type="checkbox" id="show-pt-detail">點選查看情境</label>
          </div>
        </div>
        <div id="rc">
          <div class="sl">地面材質</div>
          <select id="ss">
            <option value="wood">木板地板</option>
            <option value="concrete">混凝土</option>
            <option value="ice">冰面</option>
            <option value="carpet">地毯</option>
            <option value="rubber">橡膠墊</option>
          </select>
        </div>
      </div>
      <div id="exp-row">
        <span style="font-size:var(--fs);color:#888;font-weight:500;white-space:nowrap">實驗組：</span>
      </div>
      <!-- exp-preview is a fixed popup, injected by JS -->
    </div>
  </div>
  <div id="divider"><div id="divider-handle"></div></div>
  <div id="charts">
    <div class="cw" id="fd-wrap">
      <div class="chart-hdr"><span>受力圖</span></div>
      <canvas id="fc2"></canvas>
    </div>
    <div class="cw" id="sc-wrap">
      <div class="chart-hdr">
        <span>外力 vs 摩擦力</span>
        <button id="fs-open-btn">⛶ 全螢幕</button>
      </div>
      <canvas id="sc"></canvas>
    </div>
  </div>
</div>

<!-- Fullscreen scatter overlay -->
<div id="fs-overlay">
  <div id="fs-top">
    <span id="fs-title">外力 vs 摩擦力</span>
    <div id="fs-exp-row"></div>
    <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
      <button class="ibtn" id="fs-reset-view">重置視圖</button>
      <button id="fs-close">✕ 關閉</button>
    </div>
  </div>
  <div id="fs-canvas-wrap">
    <canvas id="fs-canvas"></canvas>
  </div>
  <div id="fs-hint">滾輪/捏合縮放　拖曳平移　懸停資料點顯示數值</div>
</div>

<!-- Fullscreen sim overlay -->
<div id="sim-fs-overlay">
  <div id="sim-fs-top">
    <span style="font-size:calc(var(--fs)*1.1);font-weight:600;color:#333">操作模擬</span>
    <div id="sim-fs-irow" style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-left:12px;"></div>
    <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
      <button id="sim-fs-close">✕ 關閉</button>
    </div>
  </div>
  <div id="sim-fs-canvas-wrap">
    <canvas id="sim-fs-canvas"></canvas>
  </div>
</div>



<script>
const OD={
  brick:{label:'磚塊',mass:2.5,w:70,h:34,wS:34,hS:52,col:'#C1634A',colD:'#9B4A35'},
  box:  {label:'木箱',mass:3.0,w:62,h:48,wS:48,hS:62,col:'#C8A35A',colD:'#A07B38'},
  book: {label:'書本',mass:0.8,w:82,h:22,wS:22,hS:62,col:'#4A7AC1',colD:'#2D5A9A'},
  stone:{label:'石頭',mass:4.0,w:66,h:44,wS:44,hS:58,col:'#888',   colD:'#555'},
};
const SD={
  wood:    {label:'木板',mus:.40,muk:.30,col:'#C4A35A',stripe:'#B8923F'},
  concrete:{label:'混凝土',mus:.55,muk:.42,col:'#9E9E9E',stripe:'#8A8A8A'},
  ice:     {label:'冰面',mus:.10,muk:.03,col:'#B8D8F0',stripe:'#A0C5E0'},
  carpet:  {label:'地毯',mus:.65,muk:.50,col:'#8A5B7A',stripe:'#7A4A6A'},
  rubber:  {label:'橡膠',mus:.80,muk:.65,col:'#3C3C3C',stripe:'#2A2A2A'},
};
const AK=['brick','box','book','stone'];
const EXP_COLS=['#4A7AC1','#E85D24','#4A9A5C','#9B59B6','#D08030'];
const g=9.8;

// Font size
let fontSize=13;
function setFontSize(v){
  fontSize=Math.max(10,Math.min(22,v));
  document.documentElement.style.setProperty('--fs',fontSize+'px');
}

let surf='wood',F=0,vel=0,ox=0;
let moving=false,coasting=false,homing=false;
let constF=false,editMode=false;
// unit: 'N' | 'kgw' | 'kg'  (kgw = kgf = N/9.8)
let unitMode='N'; // cycles N → kgw → kg (kgw and kg are same numerically here)
let showLines=false;
let stack=[];
let experiments=[{name:'實驗1',pts:[],col:EXP_COLS[0],stack:[],surf:'wood'}];
let curExp=0;
let hoverPt=null;
let lt=null,lrt=0;
let drag=null,applyDrag=null,hoverIdx=-1,moved=false;
let fsOpen=false;
let simFsOpen=false;
let showPtDetail=false;
let selectedPt=null; // {ei, pi} — the clicked point for detail view
// Trail effect: ring buffer of recent ox positions, shown as fading ghosts
const TRAIL_LEN=10;
let trailOxBuf=new Array(TRAIL_LEN).fill(null); // ring buffer of ox values
let trailHead=0;
let trailActive=false; // only draw trails right after burst moment
let burstTimer=0;
let fsView={ox:0,oy:0,scale:1};
let fsDragState=null,fsHoverPt=null,fsPinchBase=null;

const simC=document.getElementById('sim'),sCtx=simC.getContext('2d');
const ovC=document.getElementById('ov'),oCtx=ovC.getContext('2d');
const fc2=document.getElementById('fc2'),fCtx=fc2.getContext('2d');
const scC=document.getElementById('sc'),scCtx=scC.getContext('2d');
const fsC=document.getElementById('fs-canvas'),fsCtx=fsC.getContext('2d');

function resize(){
  simC.width=simC.clientWidth||680; simC.height=Math.max(80,simC.clientHeight||200);
  ovC.width=window.innerWidth; ovC.height=window.innerHeight;
  const fdw=document.getElementById('fd-wrap');
  fc2.width=fdw.clientWidth||200; fc2.height=fdw.clientHeight||150;
  const scw=document.getElementById('sc-wrap');
  scC.width=scw.clientWidth||260; scC.height=scw.clientHeight||150;
  if(fsOpen){const cw=document.getElementById('fs-canvas-wrap');fsC.width=cw.clientWidth||800;fsC.height=cw.clientHeight||500;}
  if(simFsOpen){const sw=document.getElementById('sim-fs-canvas-wrap');if(sw){simFsC.width=sw.clientWidth||900;simFsC.height=sw.clientHeight||600;}}
}

// Unit conversions
function cvU(v){ // raw N → display unit
  if(unitMode==='N') return v;
  return v/g; // kgw or kg
}
function unitLabel(){
  if(unitMode==='N') return 'N';
  if(unitMode==='kgw') return 'kgw';
  return 'kg';
}
function disp(v,d){
  const val=cvU(v);
  const dec=d!=null?d:(unitMode==='N'?1:2);
  return val.toFixed(dec);
}
function unit(){return unitLabel();}
function cycleUnit(){
  if(unitMode==='N') unitMode='kgw';
  else if(unitMode==='kgw') unitMode='N';
  document.getElementById('unit-toggle').textContent='單位:'+unit();
  document.querySelectorAll('.uL').forEach(el=>el.textContent=unit());
  // Refresh replay bar if active
  if(replayData) enterReplay(replayData.ei, replayData.pi);
}

const totM=()=>stack.reduce((s,it)=>s+OD[it.key].mass,0);
const Nf=()=>totM()*g;
const getSurf=()=>SD[surf];
const maxS=()=>getSurf().mus*Nf();
const kinF=()=>getSurf().muk*Nf();
const botDim=()=>{if(!stack.length)return{w:0,h:0};const o=OD[stack[0].key],f=stack[0].face;return f==='large'?{w:o.w,h:o.h}:{w:o.wS,h:o.hS};};

function fric(){
  if(!stack.length)return 0;
  const aF=Math.abs(F);
  if(!moving&&!coasting){if(aF<.01)return 0;return-Math.sign(F)*Math.min(aF,maxS());}
  return vel!==0?-Math.sign(vel)*kinF():0;
}

function blocks(){
  const W=simC.width,H=simC.height,gy=H-38,cx=W/2+ox;
  let bl=[],cy=gy;
  for(let i=0;i<stack.length;i++){
    const it=stack[i],o=OD[it.key];
    const bw=it.face==='large'?o.w:o.wS,bh=it.face==='large'?o.h:o.hS;
    cy-=bh; bl.push({key:it.key,face:it.face,x:cx-bw/2,y:cy,w:bw,h:bh,idx:i});
  }
  return bl;
}

function drawBlk(ctx,x,y,w,h,key,face,alpha){
  const o=OD[key]; ctx.save();
  if(alpha!=null)ctx.globalAlpha=alpha;
  const gr=ctx.createLinearGradient(x,y,x,y+h);
  gr.addColorStop(0,o.col); gr.addColorStop(1,o.colD);
  ctx.fillStyle=gr; ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,3);else ctx.rect(x,y,w,h);
  ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=.8; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.min(fontSize,h*.45)}px system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(o.label,x+w/2,y+h/2);
  if(face==='small'){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font=Math.max(7,fontSize*0.6)+'px system-ui';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('窄',x+w-2,y+2);}
  ctx.restore();
}

function arrow(ctx,x1,y1,x2,y2,col,lbl,side){
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  if(len<3)return;
  ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a=Math.atan2(dy,dx);
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-9*Math.cos(a-.4),y2-9*Math.sin(a-.4));
  ctx.lineTo(x2-9*Math.cos(a+.4),y2-9*Math.sin(a+.4));
  ctx.closePath(); ctx.fill();
  if(!lbl){ctx.restore();return;}
  ctx.font=`bold ${fontSize}px system-ui`;
  const isHoriz=Math.abs(dy)<Math.abs(dx)*0.5;
  let tx,ty,align;
  if(isHoriz){
    // Beyond the tip, away from object
    const gap=7;
    if(dx>0){tx=x2+gap;align='left';}else{tx=x2-gap;align='right';}
    ty=y2-fontSize*0.55-3;
  } else {
    // Vertical: midpoint, shifted left of line
    tx=(x1+x2)/2-8; align='right';
    ty=(y1+y2)/2+(side==='b'?fontSize+2:-(fontSize*0.3));
  }
  // Background pill for readability
  const tw=ctx.measureText(lbl).width;
  const ph=fontSize+5,pw=tw+8;
  const bx=align==='left'?tx-2:tx-pw+2,by=ty-fontSize;
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(bx,by,pw,ph,3);else ctx.rect(bx,by,pw,ph);
  ctx.fill();
  ctx.fillStyle=col; ctx.textAlign=align;
  ctx.fillText(lbl,tx,ty);
  ctx.restore();
}

function drawSim(){

  sCtx.strokeStyle='rgba(128,128,128,.15)'; sCtx.lineWidth=1; sCtx.setLineDash([4,4]);
  sCtx.beginPath(); sCtx.moveTo(W/2,gy-6); sCtx.lineTo(W/2,gy); sCtx.stroke(); sCtx.setLineDash([]);
  if(editMode){
    sCtx.fillStyle='rgba(74,122,193,.04)'; sCtx.fillRect(0,0,W,gy);
    sCtx.font=`${fontSize}px system-ui`; sCtx.fillStyle='rgba(74,122,193,.5)'; sCtx.textAlign='center';
    sCtx.fillText('✏️增減模式　拖入添加 | 拖到左側移除 | 單擊改順序 | 雙擊翻轉面',W/2,16); sCtx.textAlign='left';
  }
  if(!stack.length){
    sCtx.font=`${fontSize+1}px system-ui`; sCtx.fillStyle='rgba(128,128,128,.35)'; sCtx.textAlign='center';
    sCtx.fillText(editMode?'將物體拖曳到此處':'（勾選「物體增減」後可加入物體）',W/2,gy-25);
    sCtx.textAlign='left'; return;
  }
  const bl=blocks(),cx=W/2+ox,bot=bl[0],top=bl[bl.length-1];
  // Trail ghosts: draw past positions from ring buffer, behind current block
  if(trailActive && stack.length>0){
    // Flash at burst instant
    if(burstTimer<0.15){
      const fa=0.2*(1-burstTimer/0.15);
      sCtx.save(); sCtx.fillStyle=`rgba(255,240,160,${fa})`; sCtx.fillRect(0,0,W,gy); sCtx.restore();
    }
    // Draw ghost frames: oldest = most faded, newest = least faded
    for(let i=0;i<TRAIL_LEN;i++){
      // idx goes from oldest to newest relative to trailHead
      const idx=(trailHead+i)%TRAIL_LEN;
      const pastOx=trailOxBuf[idx];
      if(pastOx==null)continue;
      // alpha: older frames more transparent
      const age=i/TRAIL_LEN; // 0=oldest,1=newest
      const alpha=age*0.38*(1-burstTimer/0.6);
      if(alpha<0.02)continue;
      const pastCx=W/2+pastOx;
      stack.forEach((it,si)=>{
        const o=OD[it.key];
        const bw=it.face==='large'?o.w:o.wS, bh=it.face==='large'?o.h:o.hS;
        // Recompute y for this stack item (same stacking logic)
        let pastY=gy;
        for(let k=0;k<=si;k++){
          const oit=stack[k], oo=OD[oit.key];
          const obh=oit.face==='large'?oo.h:oo.hS;
          pastY-=obh;
        }
        drawBlk(sCtx, pastCx-bw/2, pastY, bw, bh, it.key, it.face, alpha);
      });
    }
  }
  sCtx.fillStyle='rgba(0,0,0,.08)'; sCtx.fillRect(bot.x+3,gy-2,bot.w,4);
  bl.forEach(b=>drawBlk(sCtx,b.x,b.y,b.w,b.h,b.key,b.face));
  if(editMode&&hoverIdx>=0&&hoverIdx<bl.length){
    const b=bl[hoverIdx]; sCtx.save(); sCtx.strokeStyle='#4A7AC1'; sCtx.lineWidth=2; sCtx.globalAlpha=.6;
    sCtx.beginPath(); if(sCtx.roundRect)sCtx.roundRect(b.x-1,b.y-1,b.w+2,b.h+2,4);else sCtx.rect(b.x-1,b.y-1,b.w+2,b.h+2);
    sCtx.stroke(); sCtx.restore();
  }
  const fr=fric(),Nv=Nf(),midY=bot.y+(gy-bot.y)/2;
  // Vertical: N upward from top of stack, W downward below ground (subtle)
  arrow(sCtx,cx,top.y,cx,top.y-Math.max(36,Math.min(54,Nv*1.1)),'#3B8BD4',`N=${disp(Nv)}${unit()}`,'a');
  arrow(sCtx,cx,gy,cx,gy+22,'rgba(120,80,180,.7)',`W=${disp(Nv)}${unit()}`,'b');
  // Horizontal: attach at the leading/trailing edge, label appears beyond tip
  // Ensure minimum arrow length = fontSize*5 so label has room outside tip
  const minFL=fontSize*4.5;
  if(Math.abs(F)>.05){
    const d=Math.sign(F);
    const fl=Math.max(minFL,Math.min(80,Math.abs(F)*1.6));
    // F arrow: tip is on the far right/left, start from block edge
    const fx1=cx+d*bot.w/2, fx2=cx+d*(bot.w/2+fl);
    // Label row: slightly above midY so it doesn't clash with friction label
    arrow(sCtx,fx1,midY-4,fx2,midY-4,'#E85D24',`F=${disp(Math.abs(F))}${unit()}`,'a');
  }
  if(Math.abs(fr)>.05){
    const fd=Math.sign(fr);
    const fl=Math.max(minFL,Math.min(80,Math.abs(fr)*1.6));
    const fc=(!moving&&!coasting)?'#4A9A5C':coasting?'#E08030':'#EF9F27';
    const tag=(!moving&&!coasting)?'fs':'fk';
    // Friction acts at contact surface (bottom of lowest block = gy)
    // Arrow starts from bottom-center, hugs the ground line
    const contactY=gy;
    arrow(sCtx,cx,contactY,cx+fd*fl,contactY,fc,`${tag}=${disp(Math.abs(fr))}${unit()}`,'a');
  }
  if(coasting&&Math.abs(vel)>.05){sCtx.font=`${fontSize}px system-ui`;sCtx.fillStyle='#E08030';sCtx.textAlign='center';sCtx.fillText('慣性滑行',cx,top.y-10);sCtx.textAlign='left';}
}

function drawFD(){
  const W=fc2.width,H=fc2.height,cx=W/2,cy=H/2;
  fCtx.clearRect(0,0,W,H);
  const Nv=Nf(),fr=fric(),mxM=Math.max(maxS(),Math.abs(F),Nv,1);
  const sc=Math.min(W,H)*.36/mxM;
  const rng=mxM*2,mag=Math.pow(10,Math.floor(Math.log10(rng/4)));
  const gridStep=[1,2,5,10].map(x=>x*mag).find(s=>rng/s<=8&&rng/s>=3)||mag;
  fCtx.save();
  fCtx.strokeStyle='rgba(180,180,180,.4)'; fCtx.lineWidth=.5; fCtx.setLineDash([2,3]);
  for(let v=gridStep;v<=mxM*1.3;v+=gridStep){
    const d=v*sc;
    [[0,cy-d,W,cy-d],[0,cy+d,W,cy+d],[cx-d,0,cx-d,H],[cx+d,0,cx+d,H]].forEach(([x1,y1,x2,y2])=>{
      fCtx.beginPath();fCtx.moveTo(x1,y1);fCtx.lineTo(x2,y2);fCtx.stroke();
    });
  }
  fCtx.setLineDash([]);
  fCtx.fillStyle='rgba(150,150,150,.75)'; fCtx.font=`${Math.max(8,fontSize-3)}px system-ui`;
  for(let v=gridStep;v<=mxM;v+=gridStep){
    const d=v*sc,lbl=disp(v,unitMode==='N'?0:1);
    if(cx+d<W-4){fCtx.textAlign='center';fCtx.fillText(lbl,cx+d,cy+fontSize*0.8);}
    if(cy-d>4){fCtx.textAlign='right';fCtx.fillText(lbl,cx-2,cy-d+fontSize*0.35);}
  }
  fCtx.restore();
  fCtx.strokeStyle='rgba(100,100,100,.2)'; fCtx.lineWidth=.7;
  fCtx.beginPath();fCtx.moveTo(0,cy);fCtx.lineTo(W,cy);fCtx.stroke();
  fCtx.beginPath();fCtx.moveTo(cx,0);fCtx.lineTo(cx,H);fCtx.stroke();
  fCtx.beginPath(); fCtx.arc(cx,cy,2.5,0,2*Math.PI); fCtx.fillStyle='#bbb'; fCtx.fill();
  const fa=(dx,dy,col,lbl)=>{
    if(Math.sqrt(dx*dx+dy*dy)<1)return;
    fCtx.save(); fCtx.strokeStyle=col; fCtx.fillStyle=col; fCtx.lineWidth=2;
    fCtx.beginPath(); fCtx.moveTo(cx,cy); fCtx.lineTo(cx+dx,cy+dy); fCtx.stroke();
    const a=Math.atan2(dy,dx);
    fCtx.beginPath(); fCtx.moveTo(cx+dx,cy+dy);
    fCtx.lineTo(cx+dx-6*Math.cos(a-.45),cy+dy-6*Math.sin(a-.45));
    fCtx.lineTo(cx+dx-6*Math.cos(a+.45),cy+dy-6*Math.sin(a+.45));
    fCtx.closePath(); fCtx.fill();
    fCtx.font=`bold ${fontSize}px system-ui`; fCtx.textAlign='center';
    fCtx.fillText(lbl,cx+dx+Math.cos(a)*16,cy+dy+Math.sin(a)*14);
    fCtx.restore();
  };
  fa(Math.min(Math.abs(F)*sc,W/2-24)*(F<0?-1:1),0,'#E85D24',`F=${disp(Math.abs(F))}`);
  if(Math.abs(fr)>.05){const fc=(!moving&&!coasting)?'#4A9A5C':coasting?'#E08030':'#EF9F27';fa(Math.min(Math.abs(fr)*sc,W/2-24)*(fr<0?-1:1),0,fc,`f=${disp(Math.abs(fr))}`);}
  const ns=Math.min(Nv*sc,H/2-20);
  fa(0,-ns,'#3B8BD4',`N=${disp(Nv)}`); fa(0,ns,'#8B5CF6',`W=${disp(Nv)}`);
}

// Scatter
function nMax(v){if(v<=0)return 10;const r=v*1.3,m=Math.pow(10,Math.floor(Math.log10(r))),st=[1,2,5,10].map(s=>s*m).find(s=>r/s<=5);return Math.ceil(r/(st||m))*(st||m);}

function getScatterBounds(){
  const ms=maxS();
  let mxF=Math.abs(F),mxFr=Math.abs(fric());
  experiments.forEach(e=>e.pts.forEach(p=>{mxF=Math.max(mxF,p.f);mxFr=Math.max(mxFr,p.fr);}));
  const mxBoth=nMax(Math.max(mxF,mxFr,ms+2,12));
  return{mxF:mxBoth,mxFr:mxBoth};
}

// Compute theoretical lines from experiment data points
function computeTheoryLines(pts){
  // Split into static (non-moving) and kinetic (moving)
  const staticPts=pts.filter(p=>!p.mv);
  const kineticPts=pts.filter(p=>p.mv);
  // Max static: take the max f among static points = estimate μs*N
  // Kinetic: average f among kinetic
  // Return {hasStatic, musN, hasKinetic, mukN}
  let result={hasStatic:false,musN:null,hasKinetic:false,mukN:null};
  if(staticPts.length>0){
    result.hasStatic=true;
    result.musN=Math.max(...staticPts.map(p=>p.fr));
  }
  if(kineticPts.length>0){
    result.hasKinetic=true;
    result.mukN=kineticPts.reduce((s,p)=>s+p.fr,0)/kineticPts.length;
  }
  return result;
}

function drawScatterOnCanvas(ctx,W,H,view,hovPt,isFs){
  ctx.clearRect(0,0,W,H);
  const pad={l:isFs?52:44,r:isFs?16:12,t:isFs?20:16,b:isFs?38:32};
  const {mxF,mxFr}=getScatterBounds();
  const ms=maxS(),mk=kinF();
  const aW=W-pad.l-pad.r,aH=H-pad.t-pad.b;
  const sc=isFs?view.scale:1;
  const panX=isFs?view.ox:0,panY=isFs?view.oy:0;
  const fScale=isFs?fontSize:Math.max(9,fontSize-2);

  const px=v=>pad.l+(cvU(v)/cvU(mxF)*aW)*sc+panX;
  const py=v=>H-pad.b-(cvU(v)/cvU(mxFr)*aH)*sc+panY;

  // Clip
  ctx.save(); ctx.beginPath(); ctx.rect(pad.l,pad.t,aW,aH); ctx.clip();

  // Grid
  const gridN=5;
  ctx.strokeStyle='rgba(200,200,200,.5)'; ctx.lineWidth=.4; ctx.setLineDash([2,3]);
  for(let i=0;i<=gridN;i++){
    const v=mxF*i/gridN,x=px(v),y=py(v);
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,H-pad.b);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
  }
  ctx.setLineDash([]);

  // y=x guide
  ctx.strokeStyle='rgba(180,180,180,.35)'; ctx.lineWidth=.7; ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(px(0),py(0));ctx.lineTo(px(mxF),py(mxF));ctx.stroke();
  ctx.setLineDash([]);

  // Theoretical lines from data (if showLines)
  if(showLines){
    experiments.forEach(exp=>{
      if(!exp.pts.length)return;
      const th=computeTheoryLines(exp.pts);
      ctx.save();
      // Static segment: f = F from (0,0) up to (musN, musN)
      if(th.hasStatic&&th.musN!=null){
        const musN=th.musN;
        ctx.strokeStyle=exp.col+'aa'; ctx.lineWidth=isFs?2:1.5; ctx.setLineDash([]);
        ctx.beginPath();ctx.moveTo(px(0),py(0));ctx.lineTo(px(musN),py(musN));ctx.stroke();
        // Vertical drop at musN
        ctx.setLineDash([3,3]);
        const dropY=th.hasKinetic?py(th.mukN):py(musN*0.75);
        ctx.beginPath();ctx.moveTo(px(musN),py(musN));ctx.lineTo(px(musN),dropY||py(0));ctx.stroke();
        ctx.setLineDash([]);
      }
      // Kinetic flat line
      if(th.hasKinetic&&th.mukN!=null){
        const mukN=th.mukN;
        ctx.strokeStyle=exp.col+'88'; ctx.lineWidth=isFs?2:1.5; ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(px(0),py(mukN));ctx.lineTo(px(mxF),py(mukN));ctx.stroke();
        ctx.setLineDash([]);
        // Label
        ctx.fillStyle=exp.col; ctx.font=`${fScale-1}px system-ui`; ctx.textAlign='left';
        ctx.fillText(`μk≈${cvU(mukN).toFixed(unitMode==='N'?1:2)}${unit()}`,px(mxF*0.05),py(mukN)-4);
      }
      if(th.hasStatic&&th.musN!=null){
        ctx.fillStyle=exp.col; ctx.font=`${fScale-1}px system-ui`; ctx.textAlign='left';
        ctx.fillText(`μsN≈${cvU(th.musN).toFixed(unitMode==='N'?1:2)}${unit()}`,px(th.musN)+4,py(th.musN)-4);
      }
      ctx.restore();
    });
  }

  // Data points
  experiments.forEach((exp,ei)=>{
    exp.pts.forEach((p,pi)=>{
      const x=px(p.f),y=py(p.fr);
      const isH=hovPt&&hovPt.ei===ei&&hovPt.pi===pi;
      ctx.beginPath(); ctx.arc(x,y,isH?6:4,0,2*Math.PI);
      ctx.fillStyle=p.mv?exp.col+'cc':exp.col+'99';
      if(isH){ctx.fillStyle=exp.col;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.fill();ctx.stroke();}
      else ctx.fill();
    });
  });

  // Selected point highlight (ring)
  if(selectedPt&&showPtDetail){
    const exp=experiments[selectedPt.ei], p=exp&&exp.pts[selectedPt.pi];
    if(p){
      const x=px(p.f),y=py(p.fr);
      ctx.save();
      ctx.beginPath();ctx.arc(x,y,isFs?9:7,0,2*Math.PI);
      ctx.strokeStyle=exp.col;ctx.lineWidth=2.5;ctx.stroke();
      ctx.restore();
    }
  }

  // Live point
  const cF=Math.abs(F),cfr=Math.abs(fric());
  if(cF>.1&&stack.length){
    const x2=px(cF),y2=py(cfr);
    ctx.beginPath(); ctx.arc(x2,y2,6,0,2*Math.PI);
    ctx.fillStyle=(moving||coasting)?'#EF9F27':'#4A9A5C';
    ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  }

  // Crosshair
  if(hovPt){
    const exp=experiments[hovPt.ei],p=exp.pts[hovPt.pi];
    if(p){
      const x=px(p.f),y=py(p.fr);
      ctx.strokeStyle=exp.col; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.globalAlpha=.75;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(x,y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,H-pad.b);ctx.lineTo(x,y);ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      const fx=cvU(p.f).toFixed(unitMode==='N'?2:3),fy=cvU(p.fr).toFixed(unitMode==='N'?2:3);
      // Y axis label
      ctx.font=`bold ${fScale}px system-ui`;
      const yw=ctx.measureText(fy).width+8;
      ctx.fillStyle=exp.col;
      ctx.beginPath();if(ctx.roundRect)ctx.roundRect(pad.l-yw-1,y-8,yw,16,2);else ctx.rect(pad.l-yw-1,y-8,yw,16);
      ctx.fill(); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(fy,pad.l-yw/2-1,y+fScale*0.35);
      // X axis label
      const xw=ctx.measureText(fx).width+8;
      ctx.fillStyle=exp.col;
      ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x-xw/2,H-pad.b+2,xw,16,2);else ctx.rect(x-xw/2,H-pad.b+2,xw,16);
      ctx.fill(); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(fx,x,H-pad.b+fScale*0.9+2);
      
      // Tooltip
      const tip=`F=${fx}${unit()}, f=${fy}${unit()}${p.mv?' [動]':' [靜]'}`;
      ctx.fillStyle='rgba(30,30,30,.82)'; ctx.font=`${fScale}px system-ui`;
      const tw=ctx.measureText(tip).width+10;
      const tx=Math.min(x+8,W-pad.r-tw-2),ty=Math.max(y-fScale*1.8-4,pad.t+2);
      ctx.beginPath();if(ctx.roundRect)ctx.roundRect(tx,ty,tw,fScale*1.6+4,3);else ctx.rect(tx,ty,tw,fScale*1.6+4);
      ctx.fill(); ctx.fillStyle='#fff'; ctx.textAlign='left';
      ctx.fillText(tip,tx+5,ty+fScale*1.15);
    }
  }
  ctx.restore(); // end clip

  // Axes
  ctx.strokeStyle='#bbb'; ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,H-pad.b);ctx.moveTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();

  // Tick labels
  ctx.fillStyle='#999'; ctx.font=`${fScale}px system-ui`;
  for(let i=0;i<=gridN;i++){
    const v=mxF*i/gridN,x=px(v),y=py(v);
    if(x>=pad.l-2&&x<=W-pad.r+2){ctx.textAlign='center';ctx.fillText(cvU(v).toFixed(unitMode==='N'?1:2),x,H-pad.b+fScale*0.85+3);}
    if(y>=pad.t-2&&y<=H-pad.b+2){ctx.textAlign='right';ctx.fillText(cvU(v).toFixed(unitMode==='N'?1:2),pad.l-4,y+fScale*0.35);}
  }
  ctx.textAlign='center'; ctx.fillText(`|F|(${unit()})`,pad.l+aW/2,H-(isFs?4:2));
  ctx.save(); ctx.translate(isFs?12:9,pad.t+aH/2); ctx.rotate(-Math.PI/2); ctx.fillText(`f(${unit()})`,0,0); ctx.restore();

  // FS legend
  if(isFs){
    let lx=pad.l+8,ly=pad.t+fScale*1.2;
    experiments.forEach(exp=>{
      ctx.fillStyle=exp.col; ctx.beginPath();ctx.arc(lx,ly-fScale*0.35,4,0,2*Math.PI);ctx.fill();
      ctx.fillStyle='#444'; ctx.font=`${fScale}px system-ui`; ctx.textAlign='left';
      ctx.fillText(`${exp.name}(${exp.pts.length})`,lx+8,ly);
      lx+=ctx.measureText(exp.name).width+40;
      if(lx>W-120){lx=pad.l+8;ly+=fScale*1.6;}
    });
  }
}

function phys(dt){
  if(dt<=0||!stack.length)return;
  if(homing){
    const d=ox>0?-1:1;ox+=d*280*dt;
    if((d>0&&ox>=0)||(d<0&&ox<=0)){ox=0;homing=false;}
    vel=0;moving=false;coasting=false;
    trailOxBuf.fill(null);trailActive=false;burstTimer=0;
    return;
  }
  const wasStatic=!moving&&!coasting;
  if(!moving&&!coasting){
    if(Math.abs(F)>maxS()+.001){
      moving=true; vel=.01*Math.sign(F);
      // Burst moment: start trail, pre-fill buffer with current ox so ghosts start here
      trailOxBuf.fill(ox); trailHead=0;
      trailActive=true; burstTimer=0;
    }
    return;
  }
  // Correct physics — unchanged
  const fr=fric(),a=(F+fr)/totM(),pv=vel;
  vel+=a*dt;
  if(Math.sign(pv)!==0&&Math.sign(vel)!==Math.sign(pv)){vel=0;moving=false;coasting=false;trailActive=false;return;}
  if(coasting&&Math.abs(vel)<.05){vel=0;moving=false;coasting=false;trailActive=false;return;}
  ox+=vel*dt*28;
  const hw=botDim().w/2,mxX=simC.width/2-hw-8,mnX=-simC.width/2+hw+8;
  if(ox>mxX){ox=mxX;vel=0;moving=false;coasting=false;trailActive=false;}
  if(ox<mnX){ox=mnX;vel=0;moving=false;coasting=false;trailActive=false;}
  // Push current position into ring buffer every frame
  if(trailActive){
    burstTimer+=dt;
    trailOxBuf[trailHead]=ox;
    trailHead=(trailHead+1)%TRAIL_LEN;
    // Trail fades out after 0.6s of motion
    if(burstTimer>0.6) trailActive=false;
  }
}

function recPt(){
  if(Math.abs(F)>.2&&stack.length&&!coasting){
    const fr=fric(), m=Math.max(totM(),.001);
    const a=(moving||coasting)?(F+fr)/m:0;
    experiments[curExp].pts.push({
      f:Math.abs(F), fr:Math.abs(fr), mv:moving||coasting,
      // Full state snapshot for point detail view
      Fraw:F, frRaw:fr, N:Nf(), W:Nf(), a:a,
      vel:vel, ox:ox,
      isMoving:moving, isCoasting:coasting,
      stackSnap:stack.map(it=>({...it})),
      surfSnap:surf,
      t: Date.now()
    });
    // Save stack snapshot to this experiment (only update if empty)
    if(!experiments[curExp].stack||!experiments[curExp].stack.length){
      experiments[curExp].stack=stack.map(it=>({...it}));
      experiments[curExp].surf=surf;
    }
    updateExpTabs();
  }
}

function loop(ts){
  if(!lt)lt=ts;
  const dt=Math.min((ts-lt)/1000,.05);lt=ts;
  phys(dt);
  if(ts-lrt>500){recPt();lrt=ts;}
  render();
  requestAnimationFrame(loop);
}

function editUp(e){
  if(!drag){clrG();return;}
  const sr=simC.getBoundingClientRect();
  const over=e.clientX>=sr.left&&e.clientX<=sr.right&&e.clientY>=sr.top&&e.clientY<=sr.bottom;
  if(over){
    if(drag.src==='shelf'){stack.push({key:drag.key,face:'large'});vel=0;moving=false;coasting=false;}
    else if(drag.src==='stack'&&drag.stackIdx!==stack.length-1){const it=stack.splice(drag.stackIdx,1)[0];stack.push(it);}
  } else if(drag.src==='stack'){stack.splice(drag.stackIdx,1);vel=0;moving=false;coasting=false;}
  hoverIdx=-1; buildShelf(); clrG(); drag=null;
}

function updateScatterHover(mx,my,W,H){
  const pad={l:44,r:12,t:16,b:32};
  const {mxF,mxFr}=getScatterBounds();
  const aW=W-pad.l-pad.r,aH=H-pad.t-pad.b;
  const px=v=>pad.l+(cvU(v)/cvU(mxF)*aW);
  const py=v=>H-pad.b-(cvU(v)/cvU(mxFr)*aH);
  let found=null;
  experiments.forEach((ex,ei)=>ex.pts.forEach((p,pi)=>{
    const dx=mx-px(p.f),dy=my-py(p.fr);
    if(Math.sqrt(dx*dx+dy*dy)<9)found={ei,pi};
  }));
  return found;
}

function drawSimFs(){
  if(!simFsOpen)return;
  const W=simFsC.width,H=simFsC.height,gy=H-50;
  simFsCtx.clearRect(0,0,W,H);
  const s=getSurf();
  simFsCtx.fillStyle=s.col; simFsCtx.fillRect(0,gy,W,50);
  for(let x=0;x<W;x+=22){simFsCtx.fillStyle=s.stripe;simFsCtx.fillRect(x,gy,11,50);}
  simFsCtx.globalAlpha=.6; simFsCtx.fillStyle='#fff'; simFsCtx.font=`bold ${fontSize+2}px system-ui`;
  simFsCtx.fillText(s.label,8,gy+28); simFsCtx.globalAlpha=1;
  simFsCtx.strokeStyle='rgba(128,128,128,.15)'; simFsCtx.lineWidth=1; simFsCtx.setLineDash([4,4]);
  simFsCtx.beginPath(); simFsCtx.moveTo(W/2,gy-10); simFsCtx.lineTo(W/2,gy); simFsCtx.stroke(); simFsCtx.setLineDash([]);
  if(!stack.length){
    simFsCtx.font=`${fontSize+2}px system-ui`; simFsCtx.fillStyle='rgba(128,128,128,.35)'; simFsCtx.textAlign='center';
    simFsCtx.fillText('（勾選「物體增減」後可加入物體）',W/2,gy-40); simFsCtx.textAlign='left'; return;
  }
  // Draw blocks scaled to fullscreen canvas
  const scaleFactor=(H-50)/simC.height;
  const origOxSave=ox;
  // compute block positions using the real sim logic but on fs canvas
  const fsBlocks=[];
  let cy=gy;
  const cx=W/2+ox*(W/simC.width);
  for(let i=0;i<stack.length;i++){
    const it=stack[i],o=OD[it.key];
    const bw=it.face==='large'?o.w:o.wS,bh=it.face==='large'?o.h:o.hS;
    const sw=Math.round(bw*scaleFactor),sh=Math.round(bh*scaleFactor);
    cy-=sh; fsBlocks.push({key:it.key,face:it.face,x:cx-sw/2,y:cy,w:sw,h:sh,idx:i});
  }
  simFsCtx.fillStyle='rgba(0,0,0,.08)'; simFsCtx.fillRect(fsBlocks[0].x+4,gy-2,fsBlocks[0].w,5);
  fsBlocks.forEach(b=>drawBlk(simFsCtx,b.x,b.y,b.w,b.h,b.key,b.face));
  // Arrows (reuse arrow function with fs canvas)
  const bot=fsBlocks[0],top=fsBlocks[fsBlocks.length-1];
  const fr=fric(),Nv=Nf(),midY=bot.y+(gy-bot.y)/2;
  const minFL=(fontSize+4)*4;
  // Use the same arrow() which works on any ctx — temporarily swap target
  const savedCtx=sCtx; // we can't swap, just call arrow directly
  function fsArrow(x1,y1,x2,y2,col,lbl,side){
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
    if(len<3)return;
    simFsCtx.save(); simFsCtx.strokeStyle=col; simFsCtx.fillStyle=col; simFsCtx.lineWidth=2.5;
    simFsCtx.beginPath(); simFsCtx.moveTo(x1,y1); simFsCtx.lineTo(x2,y2); simFsCtx.stroke();
    const a=Math.atan2(dy,dx);
    simFsCtx.beginPath(); simFsCtx.moveTo(x2,y2);
    simFsCtx.lineTo(x2-11*Math.cos(a-.4),y2-11*Math.sin(a-.4));
    simFsCtx.lineTo(x2-11*Math.cos(a+.4),y2-11*Math.sin(a+.4));
    simFsCtx.closePath(); simFsCtx.fill();
    if(!lbl){simFsCtx.restore();return;}
    simFsCtx.font=`bold ${fontSize+2}px system-ui`;
    const isH=Math.abs(dy)<Math.abs(dx)*0.5;
    let tx,ty,align;
    if(isH){const gap=8;if(dx>0){tx=x2+gap;align='left';}else{tx=x2-gap;align='right';}ty=y2-(fontSize+2)*0.55-3;}
    else{tx=(x1+x2)/2-8;align='right';ty=(y1+y2)/2+(side==='b'?(fontSize+2)+2:-(fontSize+2)*0.3);}
    const tw2=simFsCtx.measureText(lbl).width+8,ph2=fontSize+7,pw2=tw2+8;
    const bx=align==='left'?tx-2:tx-pw2+2,by=ty-fontSize-2;
    simFsCtx.fillStyle='rgba(255,255,255,0.85)';
    if(simFsCtx.roundRect)simFsCtx.roundRect(bx,by,pw2,ph2,3);else simFsCtx.rect(bx,by,pw2,ph2);
    simFsCtx.fill(); simFsCtx.fillStyle=col; simFsCtx.textAlign=align; simFsCtx.fillText(lbl,tx,ty);
    simFsCtx.restore();
  }
  const nLen=Math.max(44,Math.min(70,Nv*1.3));
  fsArrow(cx,top.y,cx,top.y-nLen,'#3B8BD4',`N=${disp(Nv)}${unit()}`,'a');
  fsArrow(cx,gy,cx,gy+28,'rgba(120,80,180,.7)',`W=${disp(Nv)}${unit()}`,'b');
  if(Math.abs(F)>.05){const fl=Math.max(minFL,Math.min(100,Math.abs(F)*1.8)),d=Math.sign(F);fsArrow(cx+d*bot.w/2,midY-5,cx+d*(bot.w/2+fl),midY-5,'#E85D24',`F=${disp(Math.abs(F))}${unit()}`,'a');}
  if(Math.abs(fr)>.05){const fl=Math.max(minFL,Math.min(100,Math.abs(fr)*1.8)),fd=Math.sign(fr);const fc=(!moving&&!coasting)?'#4A9A5C':coasting?'#E08030':'#EF9F27';// Friction at contact surface
fsArrow(cx,gy,cx+fd*fl,gy,fc,`${(!moving&&!coasting)?'fs':'fk'}=${disp(Math.abs(fr))}${unit()}`,'a');}
  if(coasting&&Math.abs(vel)>.05){simFsCtx.font=`${fontSize+1}px system-ui`;simFsCtx.fillStyle='#E08030';simFsCtx.textAlign='center';simFsCtx.fillText('慣性滑行',cx,top.y-14);simFsCtx.textAlign='left';}
  updateSimFsInfo();
}

let replayData=null; // null = live mode, else = {ptData, exp}

function enterReplay(ei, pi){
  const exp=experiments[ei];
  if(!exp||!exp.pts[pi])return;
  const p=exp.pts[pi];
  replayData={p, exp, ei, pi};
  selectedPt={ei, pi};

  // Update the replay bar chips
  const fDir=p.Fraw!=null?(p.Fraw<0?'←':'→'):'→';
  const frDir=p.frRaw!=null?(p.frRaw<0?'←':'→'):'←';
  document.getElementById('pt-replay-title').textContent=`📌 ${exp.name} · 第${pi+1}點`;
  document.getElementById('pt-replay-title').style.color=exp.col;
  document.getElementById('pr-f').textContent=`F=${disp(Math.abs(p.Fraw!=null?p.Fraw:p.f))}${unit()} ${fDir}`;
  document.getElementById('pr-fr').textContent=`f=${disp(p.fr)}${unit()} ${frDir}`;
  document.getElementById('pr-n').textContent=`N=${disp(p.N||0)}${unit()}`;
  document.getElementById('pr-a').textContent=`a=${p.a!=null?p.a.toFixed(2):0} m/s²`;
  document.getElementById('pr-v').textContent=`v=${p.vel!=null?Math.abs(p.vel).toFixed(2):0} m/s`;

// Draw replay snapshot onto main sim canvas
function drawSimReplay(){
  const {p}=replayData;
  const W=simC.width, H=simC.height, gy=H-38;
  sCtx.clearRect(0,0,W,H);

  // Ground (from snapshot)
  const s=SD[p.surfSnap||'wood'];
  sCtx.fillStyle=s.col; sCtx.fillRect(0,gy,W,38);
  for(let x=0;x<W;x+=16){sCtx.fillStyle=s.stripe;sCtx.fillRect(x,gy,8,38);}
  sCtx.globalAlpha=.6; sCtx.fillStyle='#fff'; sCtx.font=`bold ${fontSize}px system-ui`;
  sCtx.fillText(s.label,5,gy+22); sCtx.globalAlpha=1;

  // Center marker
  sCtx.strokeStyle='rgba(128,128,128,.15)'; sCtx.lineWidth=1; sCtx.setLineDash([4,4]);
  sCtx.beginPath(); sCtx.moveTo(W/2,gy-6); sCtx.lineTo(W/2,gy); sCtx.stroke(); sCtx.setLineDash([]);

  const snk=p.stackSnap||[];
  if(!snk.length) return;

  // Object position: use recorded ox, clamped to canvas
  const snapOx=Math.max(-(W/2-60), Math.min(W/2-60, p.ox||0));
  const cx=W/2+snapOx;
  let cy=gy;
  const snapBlocks=[];
  for(let i=0;i<snk.length;i++){
    const it=snk[i],o=OD[it.key];
    const bw=it.face==='large'?o.w:o.wS, bh=it.face==='large'?o.h:o.hS;
    cy-=bh; snapBlocks.push({key:it.key,face:it.face,x:cx-bw/2,y:cy,w:bw,h:bh});
  }
  const bot=snapBlocks[0], top=snapBlocks[snapBlocks.length-1];
  sCtx.fillStyle='rgba(0,0,0,.08)'; sCtx.fillRect(bot.x+3,gy-2,bot.w,4);
  snapBlocks.forEach(b=>drawBlk(sCtx,b.x,b.y,b.w,b.h,b.key,b.face));

  // Arrows using recorded values
  const Nv=p.N||0, Fv=p.Fraw||0, frv=p.frRaw||0;
  const midY=bot.y+(gy-bot.y)/2;
  const minFL=fontSize*4.5;
  arrow(sCtx,cx,top.y,cx,top.y-Math.max(36,Math.min(54,Nv*1.1)),'#3B8BD4',`N=${disp(Nv)}${unit()}`,'a');
  arrow(sCtx,cx,gy,cx,gy+22,'rgba(120,80,180,.7)',`W=${disp(Nv)}${unit()}`,'b');
  if(Math.abs(Fv)>.05){
    const d=Math.sign(Fv), fl=Math.max(minFL,Math.min(80,Math.abs(Fv)*1.6));
    arrow(sCtx,cx+d*bot.w/2,midY-4,cx+d*(bot.w/2+fl),midY-4,'#E85D24',`F=${disp(Math.abs(Fv))}${unit()}`,'a');
  }
  if(Math.abs(frv)>.05){
    const fd=Math.sign(frv), fl=Math.max(minFL,Math.min(80,Math.abs(frv)*1.6));
    const fc=p.mv?'#EF9F27':'#4A9A5C';
    const tag=p.mv?'fk':'fs';
    // Friction at contact surface
    arrow(sCtx,cx,gy,cx+fd*fl,gy,fc,`${tag}=${disp(Math.abs(frv))}${unit()}`,'a');
  }

  // Replay watermark
  sCtx.save();
  sCtx.fillStyle='rgba(180,120,0,.12)';
  sCtx.font=`bold ${fontSize*3}px system-ui`;
  sCtx.textAlign='center'; sCtx.textBaseline='middle';
  sCtx.fillText('回放',W/2,gy/2);
  sCtx.restore();
}

  let found=null;
  experiments.forEach((ex,ei)=>ex.pts.forEach((p,pi)=>{

});

// FS touch
let fsTouch=null;
fsC.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    fsTouch={t:'pan',sx:e.touches[0].clientX,sy:e.touches[0].clientY,ox:fsView.ox,oy:fsView.oy};
    fsPinchBase=null;
  } else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const r=fsC.getBoundingClientRect();
    fsPinchBase={dist,scale:fsView.scale,ox:fsView.ox,oy:fsView.oy,
      mx:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,
      my:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top};
    fsTouch={t:'pinch'};
  }
},{passive:false});
fsC.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!fsTouch)return;
  if(fsTouch.t==='pan'&&e.touches.length===1){
    fsView.ox=fsTouch.ox+(e.touches[0].clientX-fsTouch.sx);
    fsView.oy=fsTouch.oy+(e.touches[0].clientY-fsTouch.sy);
  } else if(fsTouch.t==='pinch'&&e.touches.length===2&&fsPinchBase){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const zf=dist/fsPinchBase.dist;
    fsView.scale=fsPinchBase.scale*zf;
    fsView.ox=fsPinchBase.ox+(fsPinchBase.mx*(1-zf));
    fsView.oy=fsPinchBase.oy+(fsPinchBase.my*(1-zf));
  }
  drawFS();
},{passive:false});
fsC.addEventListener('touchend',()=>{fsTouch=null;});

// Scatter canvas click → point detail
scC.addEventListener('click',e=>{
  if(!showPtDetail)return;
  const r=scC.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const W=scC.width,H=scC.height,pad={l:44,r:12,t:16,b:32};
  const {mxF,mxFr}=getScatterBounds();
  const aW=W-pad.l-pad.r,aH=H-pad.t-pad.b;
  const px=v=>pad.l+(cvU(v)/cvU(mxF)*aW);
  const py=v=>H-pad.b-(cvU(v)/cvU(mxFr)*aH);
  // Find closest point — prefer curExp, then latest experiment, then any
  let bestEi=-1,bestPi=-1,bestDist=12;
  // Priority: curExp first, then others descending
  const order=[curExp,...experiments.map((_,i)=>i).filter(i=>i!==curExp).reverse()];
  for(const ei of order){
    const exp=experiments[ei];
    for(let pi=exp.pts.length-1;pi>=0;pi--){
      const p=exp.pts[pi];
      const dx=mx-px(p.f),dy=my-py(p.fr);
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<bestDist){bestDist=dist;bestEi=ei;bestPi=pi;}
    }
    if(bestEi===ei&&bestEi===curExp)break; // found in curExp, stop
  }
  if(bestEi>=0) enterReplay(bestEi,bestPi);
});

  if(!divDrag)return;

  const minTop=80, minCharts=60;
  const newTopH=Math.max(minTop, divDrag.startTopH+dy);
  const newChartsH=Math.max(minCharts, divDrag.startChartsH-dy);
