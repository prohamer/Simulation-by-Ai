<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1F2A44">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>位值加減法學習系統</title>
    <style>
        :root {
            --bg: #F3EFE6; --surface: #FFFFFF; --surface-2: #F8F6F1; --border: #E3DDD0;
            --text: #1F2A44; --muted: #6B7280;
            --nav: #1F2A44; --nav-btn: #33405E; --accent: #F2B705; --accent-text: #3D2E00;
            --hun: #3B6FD8; --ten: #E8901A; --one: #159A72;
            --hun-ink: #2A5BC0; --ten-ink: #B86A00; --one-ink: #0E7A5A;
            --ok: #1F9D63; --bad: #E0483E; --warn: #F2B705;
            --radius: 14px;
            --cell: 36px;
            --zc: #0E7A5A;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
            display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
        }
        button, select { font-family: inherit; touch-action: manipulation; }
        button { cursor: pointer; }

        /* 頂部導覽列 */
        #top-nav {
            background: var(--nav); color: #fff; display: flex; gap: 10px; align-items: center; justify-content: space-between;
            padding: 8px calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));
            padding-top: calc(8px + env(safe-area-inset-top));
            box-shadow: 0 2px 6px rgba(0,0,0,.18); z-index: 10; flex-wrap: wrap;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .help-btn { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: transparent; color: #fff; font-size: 1.15rem; font-weight: 900; line-height: 1; }
        .help-btn:active { transform: scale(.92); }
        @media (hover: hover) { .help-btn:hover { background: rgba(255,255,255,.15); } }
        .nav-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; white-space: nowrap; }
        .nav-buttons { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
        .nav-buttons::-webkit-scrollbar { display: none; }
        .nav-btn { background: var(--nav-btn); color: #fff; border: none; min-height: 42px; padding: 0 14px; border-radius: 10px; font-weight: 700; font-size: .95rem; white-space: nowrap; transition: background .15s; }
        @media (hover: hover) { .nav-btn:hover { background: #45537A; } }
        .nav-btn:active { transform: scale(.96); }
        .nav-btn.active-mode { background: var(--accent); color: var(--accent-text); }
        .nav-btn.nav-fs { background: transparent; border: 1.5px solid rgba(255,255,255,.35); }

        /* 版面 */
        #main-container {
            display: flex; flex: 1; min-height: 0; gap: 12px;
            padding: 12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
        }
        #play-area { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
        #canvas-wrapper {
            flex: 1; min-width: 0; min-height: 0; background: var(--surface); border-radius: var(--radius);
            box-shadow: 0 4px 14px rgba(31,42,68,.08); display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        canvas { display: block; touch-action: none; }

        #side-panel {
            width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-right: 2px;
        }
        .card { background: var(--surface); border-radius: var(--radius); padding: 12px; box-shadow: 0 2px 8px rgba(31,42,68,.06); }
        .card-title { font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--surface-2); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .hint { font-size: .85rem; color: var(--muted); margin: 2px 0 6px; }

        select { width: 100%; min-height: 46px; padding: 8px 10px; font-size: 1rem; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text); margin-bottom: 8px; }
        select:disabled { opacity: .7; }
        .row-btns { display: flex; gap: 6px; }
        .ctrl-btn { flex: 1; min-height: 46px; border-radius: 10px; border: none; color: #fff; font-weight: 700; font-size: .95rem; }
        .ctrl-btn:active { transform: scale(.97); }
        #btn-restart { background: #6B7A99; }
        #btn-redo-q { background: #D9822B; }
        #btn-finish-practice { background: var(--ok); }

        /* 直式算式 */
        #equation-container { font-size: 2.1rem; font-weight: 800; font-family: "Courier New", Courier, monospace; display: flex; flex-direction: column; align-items: flex-end; padding: 4px 22px 4px 40px; }
        .eq-row { display: flex; justify-content: flex-end; align-items: center; min-height: 46px; gap: 10px; position: relative; }
        .operator { position: absolute; left: -36px; color: var(--muted); font-size: 2rem; }
        .eq-line { width: 100%; height: 4px; background: var(--text); margin: 4px 0 6px; border-radius: 2px; }
        .digit { width: var(--cell); text-align: center; transition: transform .25s, color .25s; display: inline-block; }
        .highlight { color: #D9480F; transform: scale(1.3); }
        .borrow-row { display: flex; justify-content: flex-end; width: 100%; gap: 10px; height: 22px; font-size: 1.05rem; color: var(--bad); }
        .borrow-mark { width: var(--cell); text-align: center; visibility: hidden; font-family: "Segoe UI", sans-serif; font-weight: 800; }
        .borrow-mark.active { visibility: visible; }
        .borrow-mark.carry { color: var(--hun-ink); }
        .strike { position: relative; }
        .strike::after { content: ''; position: absolute; left: 2px; right: 2px; top: 50%; height: 3px; background: var(--bad); transform: rotate(-20deg); visibility: hidden; }
        .strike.active::after { visibility: visible; }
        .input-box { width: var(--cell); height: 46px; border: 2px solid var(--border); border-radius: 8px; display: flex; justify-content: center; align-items: center; background: var(--surface-2); color: var(--hun-ink); font-size: 1.8rem; }
        .input-box.active { border-color: var(--hun-ink); background: #EEF3FD; box-shadow: 0 0 0 3px rgba(42,91,192,.25); }
        .input-spacer { width: var(--cell); }

        /* 呼叫小人區（畫面下方橫條） */
        #action-card { flex-shrink: 0; padding: 10px 12px; }
        .action-bar { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
        .action-group { flex: 1 1 260px; min-width: 0; }
        .action-bar .hint { margin: 0 0 5px; }
        .zone-tabs { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }
        .zone-tab { min-height: 48px; border-radius: 10px; border: 2px solid var(--tab); background: #fff; color: var(--tab); font-weight: 800; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, color .15s; }
        .zone-tab .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 2px #fff; }
        .zone-tab.active { background: var(--tab); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .action-btn { min-height: 52px; border-radius: 12px; font-weight: 800; font-size: 1.05rem; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; border: 2.5px solid var(--zc); transition: transform .1s; }
        .action-btn small { font-size: .8rem; font-weight: 700; opacity: .9; }
        .action-btn:active { transform: scale(.95); }
        .action-btn.add { background: var(--zc); color: #fff; }
        .action-btn.sub { background: #fff; color: var(--zc); }

        /* 右側停靠區 + 小鍵盤 */
        #right-dock { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; }
        #main-container.dock-empty #right-dock { display: none; }
        #keypad {
            position: fixed; left: 0; top: 0; width: 240px; z-index: 50;
            background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
            border: 1.5px solid rgba(31,42,68,.18); border-radius: 16px; box-shadow: 0 10px 28px rgba(31,42,68,.22);
            opacity: .82; transition: opacity .15s, box-shadow .15s; visibility: hidden;
        }
        #keypad.ready { visibility: visible; }
        #keypad.docked { position: static; width: 100%; transform: none !important; opacity: 1; background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; border-color: transparent; box-shadow: 0 2px 8px rgba(31,42,68,.06); }
        #keypad.docked #keypad-dock { display: none; }
        #keypad.docked .key-btn:not(.key-submit) { background: var(--surface-2); }
        #keypad.docked .key-action { background: #FDE8E6; }
        #keypad.dragging { opacity: .95; box-shadow: 0 16px 36px rgba(31,42,68,.32); }
        #keypad-handle {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 6px 6px 6px 12px; font-weight: 800; font-size: .95rem; color: var(--text);
            cursor: grab; touch-action: none; border-radius: 14px 14px 0 0; background: rgba(31,42,68,.08);
        }
        #keypad.dragging #keypad-handle { cursor: grabbing; }
        .kp-tools { display: flex; gap: 4px; }
        .kp-icon { width: 38px; height: 34px; border: none; border-radius: 8px; background: rgba(31,42,68,.12); color: var(--text); font-size: 1.1rem; font-weight: 800; }
        #keypad-body { padding: 8px; }
        #keypad.collapsed #keypad-body { display: none; }
        #keypad.collapsed #keypad-handle { border-radius: 14px; }
        .keyboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        #keypad .key-btn { background: rgba(255,255,255,.7); }
        #keypad .key-action { background: rgba(253,232,230,.85); }
        #keypad .key-submit { background: var(--hun-ink); }
        .key-btn { min-height: 50px; background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 10px; font-size: 1.35rem; font-weight: 800; color: var(--text); }
        .key-btn:active { background: #E9E4D8; transform: scale(.96); }
        .key-zero { grid-column: span 2; }
        .key-action { background: #FDE8E6; border-color: #F6C2BD; color: #B8352D; font-size: 1.05rem; }
        .key-submit { background: var(--hun-ink); border-color: var(--hun-ink); color: #fff; grid-column: span 3; font-size: 1.15rem; }
        .key-submit:active { background: #234C9F; }

        /* Toast */
        #toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translate(-50%, -16px); opacity: 0; pointer-events: none; z-index: 200; padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 1.02rem; max-width: min(92vw, 520px); text-align: center; white-space: pre-line; box-shadow: 0 8px 22px rgba(0,0,0,.2); transition: opacity .2s, transform .2s; }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast-ok { background: var(--ok); color: #fff; }
        .toast-bad { background: var(--bad); color: #fff; }
        .toast-warn { background: var(--warn); color: var(--accent-text); }
        .toast-info { background: var(--nav); color: #fff; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,20,35,.55); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
        .modal-content { background: #fff; padding: 20px; border-radius: 14px; width: 100%; max-width: 680px; max-height: 84vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
        .modal-header { font-size: 1.3rem; font-weight: 800; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--surface-2); }
        .close-btn { background: var(--surface-2); border: 1.5px solid var(--border); min-height: 42px; padding: 0 16px; border-radius: 10px; float: right; font-weight: 700; color: var(--text); }
        .table-wrap { overflow-x: auto; touch-action: pan-x pan-y; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: .95rem; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: center; }
        th { background: var(--surface-2); }
        .c-ok { color: var(--ok); font-weight: 800; } .c-bad { color: var(--bad); font-weight: 800; }
        .wrong-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .wrong-item button, .mini-btn { min-height: 40px; margin-left: 4px; padding: 0 14px; border: none; border-radius: 8px; font-weight: 700; color: #fff; }
        .btn-redo { background: var(--hun-ink); }
        .btn-delete, .mini-btn { background: var(--bad); }
        .help h3 { font-size: 1.05rem; margin: 16px 0 6px; color: var(--text); }
        .help ul, .help ol { margin: 0; padding-left: 22px; line-height: 1.7; }
        .help li { margin-bottom: 2px; }
        .help-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; position: sticky; top: -20px; background: #fff; padding: 4px 0; z-index: 1; }
        .help-tab { min-height: 44px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface-2); font-weight: 800; font-size: .95rem; color: var(--text); }
        .help-tab.active { background: var(--nav); border-color: var(--nav); color: #fff; }
        .help-key { background: #EEF3FD; border-radius: 10px; padding: 10px 14px; font-weight: 700; margin: 10px 0; }
        .help-eg { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
        .help-eg ol { flex: 1 1 260px; }
        .help-eq { font-family: "Courier New", monospace; font-size: 1.7rem; font-weight: 800; line-height: 1.2; text-align: right; background: var(--surface-2); border-radius: 10px; padding: 8px 18px; white-space: pre; }
        .help-eq .carry { font-size: 1rem; color: var(--bad); }
        .help-eq .line { display: inline-block; border-top: 3px solid var(--text); padding-top: 2px; color: var(--hun-ink); }
        .help-eq s { text-decoration-color: var(--bad); text-decoration-thickness: 3px; }
        .help-tip { background: #FFF6D6; border-radius: 10px; padding: 8px 14px; margin: 10px 0 0; font-weight: 600; }
        .fb-sec { margin-bottom: 14px; }
        .fb-h { font-weight: 800; color: var(--muted); margin-bottom: 6px; }
        .fb-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; margin-bottom: 6px; font-size: 1.08rem; }
        .fb-row.ok { background: #E3F5EC; color: #146C43; }
        .fb-row.bad { background: #FDE8E6; color: #B8352D; }
        .fb-ans { font-family: "Courier New", monospace; font-size: 1.3rem; letter-spacing: 2px; }
        .fb-tip { background: #FFF6D6; border-radius: 10px; padding: 10px 14px; margin: 4px 0 8px; font-weight: 700; }
        .fb-note { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
        .fb-close { width: 100%; min-height: 48px; border: none; border-radius: 10px; background: var(--hun-ink); color: #fff; font-weight: 800; font-size: 1.05rem; }

        /* 直式平板 / 手機 */
        @media (orientation: portrait), (max-width: 820px) {
            #main-container { display: grid; grid-template-columns: minmax(0, 1fr) 250px; grid-template-areas: "set set" "play play" "eq dock"; align-content: start; overflow-y: auto; touch-action: pan-y; }
            #main-container.dock-empty { grid-template-columns: minmax(0, 1fr); grid-template-areas: "set" "play" "eq"; }
            #side-panel { display: contents; }
            #settings-card { grid-area: set; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
            #settings-card .card-title { flex: 1 1 100%; margin-bottom: 0; }
            #settings-card select { flex: 1 1 200px; width: auto; margin: 0; }
            #settings-card .row-btns { flex: 1 1 240px; }
            #btn-finish-practice { flex: 1 1 150px; width: auto !important; margin-top: 0 !important; }
            #eq-card { grid-area: eq; }
            #play-area { grid-area: play; min-height: auto; }
            #side-panel, #right-dock { min-height: auto; }
            #canvas-wrapper { flex: 0 0 auto; width: 100%; aspect-ratio: 3 / 2; max-height: 50vh; }
            #side-panel { grid-area: side; width: auto; overflow: visible; }
            #right-dock { grid-area: dock; width: auto; }
        }
        /* 直立手機（很窄）：上下排 */
        @media (orientation: portrait) and (max-width: 560px) {
            #main-container, #main-container.dock-empty { grid-template-columns: minmax(0, 1fr); grid-template-areas: "set" "play" "eq" "dock"; }
            #settings-card { gap: 6px; }
            #settings-card select { flex-basis: 100%; }
            #settings-card .row-btns { flex: 2 1 0; min-width: 0; }
            #btn-finish-practice { flex: 1 1 0; min-width: 0; }
            #settings-card .ctrl-btn { font-size: .85rem; padding: 0 4px; white-space: nowrap; }
        }
        /* 橫放手機（高度很矮） */
        @media (orientation: landscape) and (max-height: 520px) {
            #top-nav { padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: 4px; }
            .nav-title { display: none; }
            .help-btn { width: 32px; height: 32px; }
            .nav-btn { min-height: 36px; }
            #main-container { padding-top: 8px; gap: 8px; }
            #side-panel { width: 230px; }
            #right-dock { width: 190px; }
            #side-panel .card { padding: 8px 10px; }
            #keypad-body { padding: 6px; }
            .keyboard { gap: 4px; }
            #equation-container { font-size: 1.7rem; }
            .key-btn { min-height: 40px; }
            #keypad:not(.docked) { width: 200px; }
            .action-bar .hint { display: none; }
            .action-bar { flex-wrap: nowrap; gap: 8px; }
            .action-group { flex: 1 1 0; }
            #action-card { padding: 6px 8px; }
            #play-area { gap: 8px; }
            .action-btn { min-height: 44px; font-size: .85rem; white-space: nowrap; }
            .action-btn small { display: none; }
            .zone-tab { min-height: 42px; }
        }
    </style>
</head>
<body>

    <div id="top-nav">
        <div class="nav-left">
            <div class="nav-title">📐 位值加減法學習系統</div>
            <button class="help-btn" id="nav-help" aria-label="使用說明" title="使用說明">?</button>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn active-mode" id="nav-practice">練習模式</button>
            <button class="nav-btn" id="nav-challenge">闖關模式</button>
            <button class="nav-btn" id="nav-records">歷史紀錄</button>
            <button class="nav-btn" id="nav-wrongs">錯題本</button>
            <button class="nav-btn nav-fs" id="nav-fullscreen" title="全螢幕">⛶ 全螢幕</button>
        </div>
    </div>

    <div id="main-container">
        <div id="side-panel">
            <!-- 1. 關卡設定 -->
            <div class="card" id="settings-card">
                <div class="card-title">
                    <span id="mode-title-display">1. 練習設定</span>
                    <span id="challenge-progress" style="color:#D9480F; display:none;"></span>
                </div>
                <select id="level-select">
                    <optgroup label="加法（必進位）">
                        <option value="add_1_1">個位 + 個位</option>
                        <option value="add_2_1">十位 + 個位</option>
                        <option value="add_2_2">十位 + 十位</option>
                        <option value="add_3_2">百位 + 十位</option>
                        <option value="add_3_3">百位 + 百位</option>
                    </optgroup>
                    <optgroup label="減法（必退位）">
                        <option value="sub_2_1">十位 - 個位</option>
                        <option value="sub_2_2">十位 - 十位</option>
                        <option value="sub_3_2">百位 - 十位</option>
                        <option value="sub_3_3">百位 - 百位</option>
                    </optgroup>
                </select>
                <div class="row-btns">
                    <button id="btn-redo-q" class="ctrl-btn">🔄 本題重來</button>
                    <button id="btn-restart" class="ctrl-btn">⏭️ 換一題</button>
                </div>
                <button id="btn-finish-practice" class="ctrl-btn" style="width:100%; margin-top:6px;">📊 結算本次練習</button>
            </div>

            <!-- 2. 直式算式 -->
            <div class="card" id="eq-card">
                <div class="card-title">2. 直式計算</div>
                <div id="equation-container">
                    <div class="borrow-row">
                        <div id="borrow-hun" class="borrow-mark"></div>
                        <div id="borrow-ten" class="borrow-mark"></div>
                        <div id="borrow-one" class="borrow-mark"></div>
                    </div>
                    <div class="eq-row" id="row-num1"></div>
                    <div class="eq-row" id="row-num2"></div>
                    <div class="eq-line"></div>
                    <div class="eq-row" id="row-input"></div>
                </div>
            </div>

        </div>

        <div id="play-area">
            <div id="canvas-wrapper">
                <canvas id="gameCanvas" width="900" height="600"></canvas>
            </div>

            <!-- 呼叫小人（畫面下方） -->
            <div class="card" id="action-card">
                <div class="action-bar">
                    <div class="action-group">
                        <div class="hint">① 選工作區（也可直接點畫面）</div>
                        <div id="zone-tabs" class="zone-tabs"></div>
                    </div>
                    <div class="action-group">
                        <div class="hint">② 呼叫小人</div>
                        <div class="action-grid">
                            <button id="btn-char-add" class="action-btn add"></button>
                            <button id="btn-char-sub" class="action-btn sub"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 小鍵盤：預設停靠右側，可拖出成半透明浮動視窗 -->
        <div id="right-dock">
            <div id="keypad">
                <div id="keypad-handle">
                    <span>⠿ 輸入答案</span>
                <span class="kp-tools">
                    <button id="keypad-dock" class="kp-icon" title="停靠回右側">📌</button>
                <button id="keypad-toggle" class="kp-icon" title="收合 / 展開">－</button>
                </span>
                </div>
                <div id="keypad-body">
                        <div class="keyboard">
                            <button class="key-btn" data-key="1">1</button><button class="key-btn" data-key="2">2</button><button class="key-btn" data-key="3">3</button>
                            <button class="key-btn" data-key="4">4</button><button class="key-btn" data-key="5">5</button><button class="key-btn" data-key="6">6</button>
                            <button class="key-btn" data-key="7">7</button><button class="key-btn" data-key="8">8</button><button class="key-btn" data-key="9">9</button>
                            <button class="key-btn key-action" data-key="clear">清除</button><button class="key-btn key-zero" data-key="0">0</button>
                            <button id="btn-submit" class="key-btn key-submit">✅ 確認送出</button>
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <div class="modal-overlay" id="modal-container">
        <div class="modal-content">
            <button class="close-btn" id="modal-close">關閉</button>
            <div class="modal-header" id="modal-title"></div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
    (() => {
        'use strict';

        // ---------- 0. 相容性：舊版 Safari 沒有 roundRect ----------
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                r = Math.min(typeof r === 'number' ? r : 0, w / 2, h / 2);
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
                this.closePath(); return this;
            };
        }

        // ---------- 1. 本地儲存（localStorage 失敗時退回記憶體） ----------
        const memStore = {};
        const DB = {
            maxRecords: 40,
            load(key) {
                try {
                    const v = JSON.parse(localStorage.getItem(key) || '[]');
                    return Array.isArray(v) ? v : [];
                } catch (e) { return memStore[key] ? memStore[key].slice() : []; }
            },
            save(key, data) {
                memStore[key] = data;
                try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { /* 私密模式等情況 */ }
            },
            addRecord(mode, stats) {
                const key = mode === 'challenge' ? 'math_records_challenge' : 'math_records_practice';
                const records = DB.load(key);
                records.unshift(stats);
                DB.save(key, records.slice(0, DB.maxRecords));
            },
            sameQ: (a, b) => a.num1 === b.num1 && a.num2 === b.num2 && a.mode === b.mode,
            addWrong(q) {
                const wrongs = DB.load('math_wrongs');
                if (!wrongs.some(w => DB.sameQ(w, q))) {
                    wrongs.unshift(q);
                    DB.save('math_wrongs', wrongs.slice(0, DB.maxRecords));
                }
            },
            removeWrong(q) { DB.save('math_wrongs', DB.load('math_wrongs').filter(w => !DB.sameQ(w, q))); }
        };

        // ---------- 2. 常數與狀態 ----------
        const W = 900, H = 600;
        const FONT = '"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
        const PLACES = ['hun', 'ten', 'one'];
        const PLACE_NAME = { hun: '百位', ten: '十位', one: '個位' };
        const PLACE_UNIT = { hun: '百', ten: '十', one: '一' };
        const PLACE_VALUE = { hun: 100, ten: 10, one: 1 };
        const C = {
            hun: { color: '#3B6FD8', ink: '#2A5BC0', rgb: [59, 111, 216], r: 30 },
            ten: { color: '#E8901A', ink: '#B86A00', rgb: [232, 144, 26], r: 22 },
            one: { color: '#159A72', ink: '#0E7A5A', rgb: [21, 154, 114], r: 15 }
        };
        const tint = (t, a) => `rgba(${C[t].rgb.join(',')},${a})`;
        const ZONES = { hun: 0, ten: 300, one: 600 };
        const LANE_Y = { hun: 480, ten: 510, one: 540 };

        const CHALLENGE_LEVELS = ['add_1_1', 'add_2_1', 'add_2_2', 'add_3_2', 'add_3_3', 'sub_2_1', 'sub_2_2', 'sub_3_2', 'sub_3_3'];
        const LEVEL_NAMES = {
            add_1_1: '個位+個位', add_2_1: '十位+個位', add_2_2: '十位+十位', add_3_2: '百位+十位', add_3_3: '百位+百位',
            sub_2_1: '十位-個位', sub_2_2: '十位-十位', sub_3_2: '百位-十位', sub_3_3: '百位-百位'
        };

        const state = {
            sysMode: 'practice',          // practice | challenge | review_wrong
            mathMode: 'add',
            levelId: 'add_1_1',
            num1: 8, num2: 5,
            balls: { hun: [], ten: [], one: [] },
            characters: [],
            flashState: false,
            activeInput: 'one',
            userAnswer: { hun: '', ten: '', one: '' },
            enabledZones: ['ten', 'one'],
            workZone: 'one',              // 使用者選定的小人工作區
            regroup: {},                  // 實際發生過的進位/退位紀錄
            animating: false,
            animToken: 0,
            flowToken: 0,
            locked: false,
            dragHint: null,
            sessionStats: {},
            startTime: 0,
            challengeIndex: 0,
            challengeLvlCorrect: 0
        };

        const $ = id => document.getElementById(id);
        const canvas = $('gameCanvas');
        const ctx = canvas.getContext('2d');

        setInterval(() => { state.flashState = !state.flashState; }, 400);

        // ---------- 3. 提示訊息（取代會卡住畫面的 alert） ----------
        let toastTimer = null;
        function toast(msg, type = 'info', ms = 2200) {
            const el = $('toast');
            el.textContent = msg;
            el.className = 'show toast-' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.className = 'toast-' + type; }, ms);
        }

        // ---------- 4. 模式切換 ----------
        function resetSessionStats() {
            state.sessionStats = {};
            CHALLENGE_LEVELS.forEach(l => { state.sessionStats[l] = { correct: 0, wrong: 0 }; });
            state.startTime = Date.now();
        }

        function setNavActive(mode) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-mode'));
            const el = mode && $('nav-' + mode);
            if (el) el.classList.add('active-mode');
        }

        function switchSysMode(newMode) {
            state.sysMode = newMode;
            state.flowToken++; state.locked = false;
            setNavActive(newMode);
            resetSessionStats();
            $('btn-restart').style.display = '';

            if (newMode === 'practice') {
                $('mode-title-display').textContent = '1. 練習設定';
                $('level-select').disabled = false;
                $('challenge-progress').style.display = 'none';
                $('btn-finish-practice').style.display = '';
                state.levelId = $('level-select').value;
            } else {
                $('mode-title-display').textContent = '1. 闖關進度';
                $('level-select').disabled = true;
                $('challenge-progress').style.display = '';
                $('btn-finish-practice').style.display = 'none';
                state.challengeIndex = 0;
                state.challengeLvlCorrect = 0;
                state.levelId = CHALLENGE_LEVELS[0];
                updateChallengeUI();
            }
            initGame();
        }

        function updateChallengeUI() {
            $('level-select').value = state.levelId;
            $('challenge-progress').textContent = `關卡 ${state.challengeIndex + 1}/9（答對 ${state.challengeLvlCorrect}/6）`;
        }

        function startReview(idx) {
            const q = DB.load('math_wrongs')[idx];
            if (!q) return;
            state.sysMode = 'review_wrong';
            state.flowToken++; state.locked = false;
            state.mathMode = q.mode; state.num1 = q.num1; state.num2 = q.num2; state.levelId = q.level;
            setNavActive(null);
            $('mode-title-display').textContent = '📓 錯題重作中';
            if (q.level) $('level-select').value = q.level;
            $('level-select').disabled = true;
            $('challenge-progress').style.display = 'none';
            $('btn-finish-practice').style.display = 'none';
            $('btn-restart').style.display = 'none';
            closeModal();
            initGame(true);
        }

        const formatTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}分 ${s % 60}秒`; };

        // ---------- 5. Modal：結算、歷史紀錄、錯題本 ----------
        function showModal(title, html) {
            $('modal-title').textContent = title;
            $('modal-body').innerHTML = html;
            $('modal-container').style.display = 'flex';
        }
        function closeModal() { $('modal-container').style.display = 'none'; }
        const modalOpen = () => $('modal-container').style.display === 'flex';

        $('modal-close').addEventListener('click', closeModal);
        $('modal-container').addEventListener('click', e => { if (e.target.id === 'modal-container') closeModal(); });
        $('modal-body').addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const { action, idx, key } = btn.dataset;
            if (action === 'close') { closeModal(); return; }
            if (action === 'clear') {
                if (confirm('確定要清空此分類的所有紀錄嗎？')) { DB.save(key, []); showRecordsModal(); }
            } else if (action === 'redo') {
                startReview(parseInt(idx, 10));
            } else if (action === 'del') {
                const w = DB.load('math_wrongs'); w.splice(parseInt(idx, 10), 1);
                DB.save('math_wrongs', w); showWrongsModal();
            }
        });

        function showSummaryAndSave(force = false) {
            let totalC = 0, totalW = 0, rows = '';
            CHALLENGE_LEVELS.forEach(l => {
                const s = state.sessionStats[l];
                if (s.correct || s.wrong) {
                    totalC += s.correct; totalW += s.wrong;
                    rows += `<tr><td>${LEVEL_NAMES[l]}</td><td class="c-ok">${s.correct}</td><td class="c-bad">${s.wrong}</td></tr>`;
                }
            });
            if (!force && totalC + totalW === 0) { toast('📭 這次還沒有作答紀錄喔！', 'info'); return; }

            const timeSpent = Date.now() - state.startTime;
            const date = new Date().toLocaleString('zh-TW', { hour12: false });
            const html = `
                <p>📅 完成時間：<b>${date}</b></p>
                <p>⏱️ 總耗時：<b>${formatTime(timeSpent)}</b></p>
                <p>📊 總計：✅ 答對 <b class="c-ok">${totalC}</b> 題 ／ ❌ 答錯 <b class="c-bad">${totalW}</b> 題</p>
                <div class="table-wrap"><table>
                    <tr><th>關卡題型</th><th>答對</th><th>答錯</th></tr>
                    ${rows || '<tr><td colspan="3">本次尚無作答紀錄</td></tr>'}
                </table></div>`;
            const wasChallenge = state.sysMode === 'challenge';
            DB.addRecord(state.sysMode, { date, time: timeSpent, totalC, totalW, details: JSON.parse(JSON.stringify(state.sessionStats)) });
            showModal(wasChallenge ? '🏆 闖關完成結算' : '📊 本次練習結果', html);
            if (wasChallenge) switchSysMode('practice'); else resetSessionStats();
        }

        function showRecordsModal() {
            const build = (data, title, key) => {
                let head = `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;">
                    <h3 style="margin:0;">${title}（${data.length}/40）</h3>
                    ${data.length ? `<button class="mini-btn" data-action="clear" data-key="${key}">清空紀錄</button>` : ''}</div>`;
                if (!data.length) return head + '<p style="color:#6B7280;">尚無歷史紀錄</p>';
                const rows = data.map(r => {
                    const detail = Object.entries(r.details || {})
                        .filter(([, v]) => v.correct || v.wrong)
                        .map(([k, v]) => `${LEVEL_NAMES[k] || k}(${v.correct}/${v.wrong})`).join('、');
                    return `<tr><td>${r.date}</td><td>${formatTime(r.time || 0)}</td>
                        <td><span class="c-ok">${r.totalC}</span> / <span class="c-bad">${r.totalW}</span></td>
                        <td style="font-size:.85rem;text-align:left;">${detail || '無'}</td></tr>`;
                }).join('');
                return head + `<div class="table-wrap"><table style="margin-top:8px;"><tr><th>完成時間</th><th>總耗時</th><th>對/錯</th><th>各關明細(對/錯)</th></tr>${rows}</table></div>`;
            };
            showModal('📜 歷史紀錄（上限 40 筆）',
                build(DB.load('math_records_challenge'), '🏆 闖關模式', 'math_records_challenge') +
                build(DB.load('math_records_practice'), '📝 練習模式', 'math_records_practice'));
        }

        function showWrongsModal() {
            const wrongs = DB.load('math_wrongs');
            if (!wrongs.length) { showModal('📓 錯題本', '<p>太棒了！目前沒有任何錯題紀錄。</p>'); return; }
            const rows = wrongs.map((q, i) => `
                <div class="wrong-item">
                    <span>【${LEVEL_NAMES[q.level] || '練習題'}】 <b style="font-size:1.1rem">${q.num1} ${q.mode === 'add' ? '+' : '−'} ${q.num2}</b></span>
                    <div><button class="btn-redo" data-action="redo" data-idx="${i}">挑戰重作</button><button class="btn-delete" data-action="del" data-idx="${i}">刪除</button></div>
                </div>`).join('');
            showModal(`📓 錯題本（${wrongs.length}/40）`, rows);
        }

        // ---------- 6. 出題（必定進位/退位，且不超過 999） ----------
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        function generateNumbers(levelStr) {
            const [mode, a, b] = levelStr.split('_');
            state.mathMode = mode;
            const d1 = +a, d2 = +b;
            if (mode === 'add') {
                if (d1 === 1) {
                    state.num1 = rand(5, 9); state.num2 = rand(10 - state.num1, 9);
                } else if (d1 === 2 && d2 === 1) {
                    const o1 = rand(5, 9), o2 = rand(10 - o1, 9);
                    state.num1 = rand(1, 8) * 10 + o1; state.num2 = o2;
                } else if (d1 === 2 && d2 === 2) {
                    const o1 = rand(5, 9), o2 = rand(10 - o1, 9), t1 = rand(1, 5), t2 = rand(1, 8 - t1);
                    state.num1 = t1 * 10 + o1; state.num2 = t2 * 10 + o2;
                } else if (d1 === 3 && d2 === 2) {
                    const t1 = rand(5, 9), t2 = rand(10 - t1, 9);
                    state.num1 = rand(1, 7) * 100 + t1 * 10 + rand(1, 9); state.num2 = t2 * 10 + rand(1, 9);
                } else {
                    const t1 = rand(5, 9), t2 = rand(10 - t1, 9), h1 = rand(1, 4), h2 = rand(1, 8 - h1);
                    state.num1 = h1 * 100 + t1 * 10 + rand(1, 9); state.num2 = h2 * 100 + t2 * 10 + rand(1, 9);
                }
            } else {
                if (d1 === 2 && d2 === 1) {
                    const o1 = rand(0, 7), o2 = rand(o1 + 1, 9);
                    state.num1 = rand(1, 9) * 10 + o1; state.num2 = o2;
                } else if (d1 === 2 && d2 === 2) {
                    const o1 = rand(0, 7), o2 = rand(o1 + 1, 9), t1 = rand(2, 9), t2 = rand(1, t1 - 1);
                    state.num1 = t1 * 10 + o1; state.num2 = t2 * 10 + o2;
                } else if (d1 === 3 && d2 === 2) {
                    const t1 = rand(0, 7), t2 = rand(t1 + 1, 9);
                    state.num1 = rand(1, 9) * 100 + t1 * 10 + rand(0, 9); state.num2 = t2 * 10 + rand(0, 9);
                } else {
                    const o1 = rand(0, 7), o2 = rand(o1 + 1, 9), t1 = rand(2, 9), t2 = rand(1, t1 - 1), h1 = rand(2, 9), h2 = rand(1, h1 - 1);
                    state.num1 = h1 * 100 + t1 * 10 + o1; state.num2 = h2 * 100 + t2 * 10 + o2;
                }
            }
        }

        // ---------- 7. 直式算式、工作區按鈕 ----------
        const targetAnswer = () => state.mathMode === 'add' ? state.num1 + state.num2 : state.num1 - state.num2;

        function setActiveInput(target) {
            PLACES.forEach(p => { const el = $('in-' + p); if (el) el.classList.toggle('active', p === target); });
            state.activeInput = target;
        }

        function buildUI() {
            const row1 = $('row-num1'), row2 = $('row-num2'), rowIn = $('row-input');
            row1.innerHTML = ''; row2.innerHTML = ''; rowIn.innerHTML = '';

            const op = document.createElement('span');
            op.className = 'operator';
            op.textContent = state.mathMode === 'add' ? '+' : '−';
            row2.appendChild(op);

            const n1 = String(state.num1).padStart(3, ' ');
            const n2 = String(state.num2).padStart(3, ' ');
            const ans = String(targetAnswer()).padStart(3, ' ');
            state.enabledZones = [];

            PLACES.forEach((p, i) => {
                const s1 = document.createElement('span');
                s1.className = 'digit strike'; s1.id = 'eq-n1-' + p; s1.textContent = n1[i].trim();
                row1.appendChild(s1);

                const s2 = document.createElement('span');
                s2.className = 'digit'; s2.id = 'eq-n2-' + p; s2.textContent = n2[i].trim();
                row2.appendChild(s2);

                if (n1[i] !== ' ' || ans[i] !== ' ') {
                    const box = document.createElement('div');
                    box.className = 'input-box'; box.id = 'in-' + p;
                    box.addEventListener('click', () => setActiveInput(p));
                    rowIn.appendChild(box);
                } else {
                    const sp = document.createElement('div'); sp.className = 'input-spacer'; rowIn.appendChild(sp);
                }
                if (n1[i] !== ' ' || n2[i] !== ' ' || ans[i] !== ' ') state.enabledZones.push(p);
            });

            if (!state.enabledZones.includes(state.workZone)) state.workZone = 'one';
            buildZoneTabs();
            setActiveInput('one');
            updateRegroupMarks();
        }

        function buildZoneTabs() {
            const tabs = $('zone-tabs');
            tabs.innerHTML = '';
            tabs.style.setProperty('--n', state.enabledZones.length);
            state.enabledZones.forEach(p => {
                const b = document.createElement('button');
                b.className = 'zone-tab'; b.dataset.zone = p;
                b.style.setProperty('--tab', C[p].ink);
                b.style.setProperty('--dot', C[p].color);
                b.innerHTML = `<span class="dot"></span>${PLACE_NAME[p]}`;
                b.addEventListener('click', () => { setWorkZone(p); highlightDigit(p); });
                tabs.appendChild(b);
            });
            refreshWorkZoneUI();
        }

        function setWorkZone(p) {
            if (!state.enabledZones.includes(p)) return;
            state.workZone = p;
            refreshWorkZoneUI();
        }

        function refreshWorkZoneUI() {
            const p = state.workZone;
            document.querySelectorAll('.zone-tab').forEach(b => b.classList.toggle('active', b.dataset.zone === p));
            $('action-card').style.setProperty('--zc', C[p].ink);
            $('btn-char-add').innerHTML = `➕ 放入 1 個${PLACE_UNIT[p]}<small>到【${PLACE_NAME[p]}】</small>`;
            $('btn-char-sub').innerHTML = `➖ 搬走 1 個${PLACE_UNIT[p]}<small>從【${PLACE_NAME[p]}】</small>`;
        }

        $('btn-char-add').addEventListener('click', () => { triggerCharacter('add', state.workZone); highlightDigit(state.workZone); });
        $('btn-char-sub').addEventListener('click', () => { triggerCharacter('sub', state.workZone); highlightDigit(state.workZone); });

        function highlightDigit(place) {
            const el2 = $('eq-n2-' + place), el1 = $('eq-n1-' + place);
            const el = (el2 && el2.textContent) ? el2 : el1;
            if (el && el.textContent) {
                el.classList.add('highlight');
                setTimeout(() => el.classList.remove('highlight'), 800);
            }
        }

        // 依實際發生的「拆開/合併」顯示退位、進位記號（不再用球數推測）
        function resetRegroup() {
            state.regroup = {};
            PLACES.forEach(p => { state.regroup[p] = { giveDown: 0, recvDown: 0, giveUp: 0, recvUp: 0 }; });
        }

        function updateRegroupMarks() {
            const n1 = String(state.num1).padStart(3, '0');
            PLACES.forEach((p, i) => {
                const g = state.regroup[p], orig = parseInt(n1[i], 10);
                const mark = $('borrow-' + p), digit = $('eq-n1-' + p);
                let text = '', strike = false, carry = false;
                if (g.giveDown > 0) {
                    strike = true;
                    text = String(orig - g.giveDown + 10 * g.recvDown - 10 * g.giveUp + g.recvUp);
                } else if (g.recvDown > 0) {
                    text = String(10 * g.recvDown);
                } else if (g.recvUp > 0) {
                    text = String(g.recvUp); carry = true;
                }
                mark.textContent = text;
                mark.classList.toggle('active', text !== '');
                mark.classList.toggle('carry', carry);
                if (digit) digit.classList.toggle('active', strike && digit.textContent !== '');
            });
        }

        function updateInputDisplay() {
            PLACES.forEach(p => { const el = $('in-' + p); if (el) el.textContent = state.userAnswer[p]; });
        }

        function inputDigit(v) {
            if (state.locked) return;
            state.userAnswer[state.activeInput] = v;
            const idx = PLACES.indexOf(state.activeInput);
            for (let i = idx - 1; i >= 0; i--) { if ($('in-' + PLACES[i])) { setActiveInput(PLACES[i]); break; } }
            updateInputDisplay();
        }
        function clearDigit() { state.userAnswer[state.activeInput] = ''; updateInputDisplay(); }
        function moveInput(dir) {
            const boxes = PLACES.filter(p => $('in-' + p));
            const i = boxes.indexOf(state.activeInput);
            const n = boxes[Math.max(0, Math.min(boxes.length - 1, i + dir))];
            if (n) setActiveInput(n);
        }

        document.querySelectorAll('.key-btn[data-key]').forEach(btn => {
            btn.addEventListener('click', () => {
                const k = btn.dataset.key;
                if (k === 'clear') clearDigit(); else inputDigit(k);
            });
        });

        // 實體鍵盤（桌機 / 外接鍵盤的平板）
        document.addEventListener('keydown', e => {
            if (modalOpen()) { if (e.key === 'Escape') closeModal(); return; }
            if (e.target.tagName === 'SELECT') return;
            if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
            else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); clearDigit(); }
            else if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); }
            else if (e.key === 'ArrowLeft') moveInput(-1);
            else if (e.key === 'ArrowRight') moveInput(1);
        });

        // ---------- 8. 判定答案 ----------
        function nextAfter(fn, delay = 900) {
            state.locked = true;
            const tok = state.flowToken;
            setTimeout(() => { if (tok !== state.flowToken) return; state.locked = false; fn(); }, delay);
        }

        function submitAnswer() {
            if (state.locked) return;
            if (state.animating || state.characters.some(c => c.state !== 'walking_out')) {
                toast('⏳ 小人還在搬、或球還在變化，等一下再送出喔！', 'warn'); return;
            }
            if (!PLACES.some(p => state.userAnswer[p] !== '')) { toast('✏️ 請先在下方輸入答案喔！', 'warn'); return; }

            const over = PLACES.filter(p => state.balls[p].length > 9);
            if (over.length) {
                const names = over.map(p => PLACE_NAME[p]).join('、');
                toast(state.mathMode === 'add'
                    ? `⚠️【${names}】有 10 個以上的球，要「進位」喔！\n選 10 個，拖到左邊一格換成 1 個大球。`
                    : `⚠️【${names}】有 10 個以上的球，\n別忘了請小人把要減掉的球搬走喔！`, 'warn', 3600);
                return;
            }

            const target = targetAnswer();
            const userAns = parseInt((state.userAnswer.hun || '0') + (state.userAnswer.ten || '0') + (state.userAnswer.one || '0'), 10);
            const exp = { hun: Math.floor(target / 100), ten: Math.floor(target % 100 / 10), one: target % 10 };
            const ballsOk = PLACES.every(p => state.balls[p].length === exp[p]);
            const stat = state.sessionStats[state.levelId];

            if (userAns === target && ballsOk) {
                if (state.sysMode !== 'review_wrong' && stat) stat.correct++;

                if (state.sysMode === 'challenge') {
                    state.challengeLvlCorrect++;
                    let msg = '🎉 答對了！繼續挑戰！';
                    if (state.challengeLvlCorrect >= 6) {
                        state.challengeIndex++;
                        state.challengeLvlCorrect = 0;
                        if (state.challengeIndex >= CHALLENGE_LEVELS.length) {
                            toast('🏆 恭喜！你已經全破所有關卡了！', 'ok', 3000);
                            nextAfter(() => showSummaryAndSave(true));
                            return;
                        }
                        msg = `🎉 過關！下一關：${LEVEL_NAMES[CHALLENGE_LEVELS[state.challengeIndex]]}`;
                    }
                    toast(msg, 'ok');
                    state.levelId = CHALLENGE_LEVELS[state.challengeIndex];
                    updateChallengeUI();
                    nextAfter(() => initGame());
                } else if (state.sysMode === 'review_wrong') {
                    DB.removeWrong({ num1: state.num1, num2: state.num2, mode: state.mathMode });
                    toast('🎉 訂正成功！此題已從錯題本移除。', 'ok');
                    nextAfter(() => { switchSysMode('practice'); showWrongsModal(); });
                } else {
                    toast('🎉 答對了！前往下一題！', 'ok');
                    nextAfter(() => initGame());
                }
            } else {
                if (state.sysMode !== 'review_wrong') {
                    if (stat) stat.wrong++;
                    DB.addWrong({ num1: state.num1, num2: state.num2, mode: state.mathMode, level: state.levelId });
                }
                showCheckResult(userAns, target, exp);
            }
        }
        $('btn-submit').addEventListener('click', submitAnswer);

        // 答錯時：分成「各區的球」與「整體答案」兩部分回饋
        function showCheckResult(userAns, target, exp) {
            const zones = PLACES.filter(p => state.enabledZones.includes(p) || exp[p] > 0 || state.balls[p].length > 0);
            const badZones = zones.filter(p => state.balls[p].length !== exp[p]);
            const ansOk = userAns === target;
            const row = (label, ok, okText, badText) =>
                `<div class="fb-row ${ok ? 'ok' : 'bad'}"><span>${label}</span><b>${ok ? okText : badText}</b></div>`;

            let tip;
            if (ansOk && badZones.length) tip = '答案算對了！再把畫面上的球擺成跟答案一樣。';
            else if (!ansOk && !badZones.length) tip = '球都擺對了！數數看每一區有幾個，再對照你寫的答案。';
            else tip = '先把每一區的球擺好，再數數看答案是多少。';

            const typed = PLACES.filter(p => $('in-' + p)).map(p => state.userAnswer[p] || '□').join('');
            const html = `
                <div class="fb-sec"><div class="fb-h">① 各區的球</div>
                    ${zones.map(p => row(`${PLACE_NAME[p]}的球`, !badZones.includes(p), '✅ 正確', '❌ 再檢查')).join('')}
                </div>
                <div class="fb-sec"><div class="fb-h">② 整體答案</div>
                    ${row(`你的答案：<b class="fb-ans">${typed}</b>`, ansOk, '✅ 正確', '❌ 不正確')}
                </div>
                <p class="fb-tip">💡 ${tip}</p>
                ${state.sysMode !== 'review_wrong' ? '<p class="fb-note">（本題已加入錯題本）</p>' : ''}
                <button class="fb-close" data-action="close">繼續修正</button>`;
            state.zoneError = { zones: badZones, until: Date.now() + 5000 };
            showModal('📝 檢查結果', html);
        }

        // ---------- 9. 球與小人 ----------
        function drawBallShape(x, y, type, r, opts = {}) {
            if (opts.selected) {
                ctx.beginPath(); ctx.arc(x, y, r + 8, 0, Math.PI * 2); ctx.fillStyle = 'rgba(31,42,68,.85)'; ctx.fill();
                ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2); ctx.fillStyle = '#FFD43B'; ctx.fill();
            } else {
                ctx.beginPath(); ctx.ellipse(x, y + r * 0.9, r * 0.8, r * 0.22, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fill();
            }
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = C[type].color; ctx.fill();
            if (opts.flash) { ctx.lineWidth = 5; ctx.strokeStyle = '#E0483E'; }
            else { ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; }
            ctx.stroke();
            ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.38, r * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
            // 球上標示位值，不只靠顏色辨識
            const fs = Math.round(r * (type === 'hun' ? 0.62 : type === 'ten' ? 0.74 : 0.95));
            ctx.font = `800 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.28)';
            ctx.strokeText(PLACE_VALUE[type], x, y + 1);
            ctx.fillStyle = '#fff'; ctx.fillText(PLACE_VALUE[type], x, y + 1);
        }

        class Ball {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type; this.r = C[type].r;
                this.selected = false; this.isTargeted = false; this.busy = false;
                this.targetX = null; this.targetY = null; this.onReachTarget = null;
            }
            update() {
                if (this.targetX === null) return;
                const dx = this.targetX - this.x, dy = this.targetY - this.y;
                this.x += dx * 0.1; this.y += dy * 0.1;
                if (Math.abs(dx) < 1.5 && Math.abs(dy) < 1.5) {
                    this.x = this.targetX; this.y = this.targetY; this.targetX = this.targetY = null;
                    if (this.onReachTarget) { const cb = this.onReachTarget; this.onReachTarget = null; cb(this); }
                }
            }
            draw(flash) { drawBallShape(this.x, this.y, this.type, this.r, { selected: this.selected, flash: flash && !this.selected }); }
        }

        class Character {
            constructor(actMode, type, targetBall, targetIndex) {
                this.actMode = actMode; this.type = type;
                this.x = W + 40; this.y = LANE_Y[type];
                this.targetBall = targetBall; this.targetIndex = targetIndex;
                this.state = 'walking_in'; this.speed = 4.5; this.stepCount = 0; this.actTimer = 0;
                this.hasBall = actMode === 'add';
            }
            update() {
                this.stepCount += 0.22;
                if (this.state === 'walking_in') {
                    let tx, ty;
                    if (this.actMode === 'sub') {
                        if (!state.balls[this.type].includes(this.targetBall)) { this.state = 'walking_out'; return; }
                        tx = this.targetBall.x; ty = this.targetBall.y + 32;
                    } else {
                        const pos = getGridPos(this.type, this.targetIndex); tx = pos.x; ty = pos.y + 32;
                    }
                    const dx = tx - this.x, dy = ty - this.y, dist = Math.hypot(dx, dy);
                    if (dist <= this.speed) this.state = 'acting';
                    else { this.x += dx / dist * this.speed; this.y += dy / dist * this.speed; }
                } else if (this.state === 'acting') {
                    if (++this.actTimer > 15) {
                        if (this.actMode === 'sub') {
                            state.balls[this.type] = state.balls[this.type].filter(b => b !== this.targetBall);
                            this.hasBall = true;
                        } else {
                            state.balls[this.type].push(new Ball(this.x, this.y - 32, this.type));
                            this.hasBall = false;
                        }
                        arrangeBalls(true);
                        this.state = 'walking_out';
                    }
                } else {
                    this.x += this.speed * 1.2; this.y += this.speed * 0.15;
                }
            }
            draw() {
                const bounce = Math.abs(Math.sin(this.stepCount)) * 4, leg = Math.sin(this.stepCount) * 5, dy = this.y - bounce;
                ctx.fillStyle = '#3F4A5E';
                ctx.beginPath(); ctx.roundRect(this.x - 8 + leg, dy + 10, 6, 12, 3); ctx.fill();
                ctx.beginPath(); ctx.roundRect(this.x + 2 - leg, dy + 10, 6, 12, 3); ctx.fill();
                ctx.fillStyle = C[this.type].color;
                ctx.beginPath(); ctx.roundRect(this.x - 12, dy - 20, 24, 32, 12); ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
                const eo = this.state === 'walking_in' ? -3 : (this.state === 'walking_out' ? 3 : 0);
                ctx.fillStyle = '#1A202C';
                ctx.beginPath(); ctx.arc(this.x - 4 + eo, dy - 6, 2.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 4 + eo, dy - 6, 2.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255,120,120,.6)';
                ctx.beginPath(); ctx.arc(this.x - 8 + eo, dy - 1, 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 8 + eo, dy - 1, 3, 0, Math.PI * 2); ctx.fill();
                if (this.hasBall) drawBallShape(this.x, dy - 34, this.type, C[this.type].r * 0.85);
            }
        }

        function getGridPos(type, index) {
            const cols = 5, spacing = type === 'hun' ? 54 : (type === 'ten' ? 48 : 42);
            const startX = ZONES[type] + (300 - (cols - 1) * spacing) / 2;
            return { x: startX + (index % cols) * spacing, y: 125 + Math.floor(index / cols) * spacing };
        }

        function arrangeBalls(animate = false) {
            PLACES.forEach(type => {
                state.balls[type].forEach((ball, idx) => {
                    if (ball.selected || ball.onReachTarget) return; // 正在拖曳或正在分解/合併的不動
                    const pos = getGridPos(type, idx);
                    if (animate) { ball.targetX = pos.x; ball.targetY = pos.y; }
                    else { ball.x = pos.x; ball.y = pos.y; ball.targetX = ball.targetY = null; }
                });
            });
        }

        function triggerCharacter(action, type) {
            if (state.locked || !state.enabledZones.includes(type)) return;
            if (action === 'add') {
                const pending = state.characters.filter(c => c.type === type && c.actMode === 'add' && c.state !== 'walking_out').length;
                state.characters.push(new Character('add', type, null, state.balls[type].length + pending));
            } else {
                const available = state.balls[type].filter(b => !b.isTargeted && !b.busy);
                if (available.length) {
                    const b = available[available.length - 1];
                    b.selected = false; b.isTargeted = true;
                    state.characters.push(new Character('sub', type, b, 0));
                } else {
                    const left = PLACES[PLACES.indexOf(type) - 1];
                    toast(left
                        ? `【${PLACE_NAME[type]}】已經沒有球可以搬走囉！\n可以把【${PLACE_NAME[left]}】的大球拖過來「退位」成 10 個。`
                        : `【${PLACE_NAME[type]}】已經沒有球可以搬走囉！`, 'warn', 3000);
                }
            }
        }

        // ---------- 10. 分解與合併（含動畫保護） ----------
        function startAnim() { state.animating = true; return ++state.animToken; }
        function endAnim(tok) { setTimeout(() => { if (tok === state.animToken) state.animating = false; }, 450); }

        function decompose(bigBall, toType) {
            const tok = startAnim(), from = bigBall.type;
            bigBall.busy = true; bigBall.selected = false;
            bigBall.targetX = ZONES[toType] + 150; bigBall.targetY = 220;
            bigBall.onReachTarget = () => {
                if (tok !== state.animToken) return;
                state.balls[from] = state.balls[from].filter(b => b !== bigBall);
                for (let i = 0; i < 10; i++) {
                    const a = Math.PI * 2 / 10 * i;
                    state.balls[toType].push(new Ball(bigBall.x + Math.cos(a) * 16, bigBall.y + Math.sin(a) * 16, toType));
                }
                state.regroup[from].giveDown++; state.regroup[toType].recvDown++;
                arrangeBalls(true); updateRegroupMarks(); endAnim(tok);
            };
        }

        function merge(arr, from, to, dx, dy) {
            const tok = startAnim();
            dx = Math.max(ZONES[to] + 50, Math.min(ZONES[to] + 250, dx));
            dy = Math.max(110, Math.min(400, dy));
            let reached = 0;
            arr.forEach(b => {
                b.busy = true; b.selected = false; b.targetX = dx; b.targetY = dy;
                b.onReachTarget = () => {
                    if (tok !== state.animToken) return;
                    if (++reached === arr.length) {
                        state.balls[from] = state.balls[from].filter(x => !arr.includes(x));
                        state.balls[to].push(new Ball(dx, dy, to));
                        state.regroup[from].giveUp++; state.regroup[to].recvUp++;
                        arrangeBalls(true); updateRegroupMarks(); endAnim(tok);
                    }
                };
            });
        }

        // ---------- 11. 觸控 / 滑鼠互動 ----------
        const zoneAt = px => px < ZONES.ten ? 'hun' : (px < ZONES.one ? 'ten' : 'one');
        const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

        function canvasPoint(e) {
            const rect = canvas.getBoundingClientRect();
            return { px: (e.clientX - rect.left) * W / rect.width, py: (e.clientY - rect.top) * H / rect.height };
        }

        function findBallAt(px, py) {
            let best = null, bestD = Infinity;
            PLACES.forEach(t => state.balls[t].forEach(b => {
                if (b.busy || b.isTargeted) return;
                const d = Math.hypot(px - b.x, py - b.y);
                if (d <= b.r + 14 && d - b.r < bestD) { bestD = d - b.r; best = b; } // 加大觸控判定範圍並取最近的球
            }));
            return best;
        }

        // 只檢查「能不能換」，不透露選了幾個
        function dropAction(t, dz, n) {
            if (t === dz) return null;
            const i = PLACES.indexOf(t), left = PLACES[i - 1], right = PLACES[i + 1];
            if (dz === right) return n === 1 ? { ok: true, kind: 'decompose' } : { ok: false, text: `一次只能把 1 個${PLACE_UNIT[t]}拆開喔！` };
            if (dz === left) return n === 10 ? { ok: true, kind: 'merge' } : { ok: false, text: `沒有換成功！\n要剛好 10 個${PLACE_UNIT[t]}才能換成 1 個${PLACE_UNIT[left]}，數數看你選了幾個？` };
            return { ok: false, text: '只能拖到隔壁的位數喔！' };
        }

        let dragInfo = null;
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        canvas.addEventListener('pointerdown', e => {
            if (!e.isPrimary || dragInfo || state.animating || state.locked) return;
            e.preventDefault();
            const { px, py } = canvasPoint(e);
            const hit = findBallAt(px, py);
            if (hit) {
                const t = hit.type;
                PLACES.forEach(p => { if (p !== t) state.balls[p].forEach(b => { b.selected = false; }); });
                dragInfo = { type: t, sx: px, sy: py, moved: false, target: hit, orig: hit.selected, pointerId: e.pointerId };
                hit.selected = true;
                state.balls[t].forEach(b => { if (b.selected) { b.dragStartX = b.x; b.dragStartY = b.y; b.targetX = b.targetY = null; } });
                setWorkZone(t);
            } else {
                // 空白處：點一下＝選工作區；拖曳＝框選多顆球
                PLACES.forEach(p => state.balls[p].forEach(b => { b.selected = false; }));
                dragInfo = { lasso: true, zone: zoneAt(px), sx: px, sy: py, moved: false, pointerId: e.pointerId };
            }
            try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        });

        canvas.addEventListener('pointermove', e => {
            if (!dragInfo || e.pointerId !== dragInfo.pointerId) return;
            e.preventDefault();
            const { px, py } = canvasPoint(e);
            const dx = px - dragInfo.sx, dy = py - dragInfo.sy;
            if (!dragInfo.moved && Math.hypot(dx, dy) > 8) dragInfo.moved = true;
            if (!dragInfo.moved) return;

            if (dragInfo.lasso) {
                const z = dragInfo.zone, zx0 = ZONES[z] + 8, zx1 = ZONES[z] + 292;
                const x0 = Math.max(zx0, Math.min(dragInfo.sx, px)), x1 = Math.min(zx1, Math.max(dragInfo.sx, px));
                const rect = { x: x0, y: Math.min(dragInfo.sy, py), w: Math.max(0, x1 - x0), h: Math.abs(dy) };
                state.lasso = rect;
                state.balls[z].forEach(b => { b.selected = !b.busy && !b.isTargeted && inRect(b.x, b.y, rect); });
                return;
            }

            state.balls[dragInfo.type].filter(b => b.selected).forEach(b => { b.x = b.dragStartX + dx; b.y = b.dragStartY + dy; });
            const dz = zoneAt(px);
            state.dragHint = dz !== dragInfo.type ? { zone: dz } : null; // 只標示要放到哪一區，不提示對錯
        });

        function endDrag(e, cancelled) {
            if (!dragInfo || e.pointerId !== dragInfo.pointerId) return;
            const { px, py } = canvasPoint(e);

            if (dragInfo.lasso) {
                const z = dragInfo.zone;
                if (state.enabledZones.includes(z)) { setWorkZone(z); if (!dragInfo.moved) highlightDigit(z); }
                state.lasso = null;
                dragInfo = null;
                try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
                return;
            }

            const t = dragInfo.type;
            if (!dragInfo.moved) {
                if (dragInfo.orig) dragInfo.target.selected = false; // 再點一次＝取消選取
            } else {
                const sel = state.balls[t].filter(b => b.selected);
                const dz = zoneAt(px);
                const act = cancelled ? null : dropAction(t, dz, sel.length);
                if (act && act.ok) {
                    if (act.kind === 'decompose') decompose(sel[0], dz); else merge(sel, t, dz, px, py);
                } else if (act) toast(act.text, 'warn', 3000);
                PLACES.forEach(p => state.balls[p].forEach(b => { b.selected = false; }));
            }
            state.dragHint = null;
            dragInfo = null;
            try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
            arrangeBalls(true);
        }
        canvas.addEventListener('pointerup', e => endDrag(e, false));
        canvas.addEventListener('pointercancel', e => endDrag(e, true));

        // ---------- 12. 初始化 ----------
        function initGame(skipGen = false) {
            if (!skipGen) {
                if (state.sysMode === 'practice') state.levelId = $('level-select').value;
                generateNumbers(state.levelId);
            }
            state.animToken++; state.animating = false;
            state.balls = { hun: [], ten: [], one: [] };
            state.characters = [];
            state.userAnswer = { hun: '', ten: '', one: '' };
            state.dragHint = null; state.lasso = null; state.zoneError = null; dragInfo = null;
            resetRegroup();

            const n1 = String(state.num1).padStart(3, '0');
            PLACES.forEach((p, i) => { for (let k = 0; k < parseInt(n1[i], 10); k++) state.balls[p].push(new Ball(0, 0, p)); });
            buildUI();
            updateInputDisplay();
            arrangeBalls(false);
        }

        // 換一題：出新題目（錯題重作時隱藏）
        $('btn-restart').addEventListener('click', () => {
            if (state.locked) return;
            initGame(state.sysMode === 'review_wrong');
        });
        // 本題重來：題目不變，球、小人、答案、進退位記號全部回到起點
        $('btn-redo-q').addEventListener('click', () => {
            if (state.locked) return;
            initGame(true);
            toast('🔄 本題重新開始！', 'info', 1200);
        });
        $('level-select').addEventListener('change', () => initGame(false));
        $('btn-finish-practice').addEventListener('click', () => showSummaryAndSave(false));
        $('nav-practice').addEventListener('click', () => switchSysMode('practice'));
        $('nav-challenge').addEventListener('click', () => switchSysMode('challenge'));
        $('nav-records').addEventListener('click', showRecordsModal);
        $('nav-wrongs').addEventListener('click', showWrongsModal);

        // ---------- 使用說明與建議算法 ----------
        function showHelpModal() {
            const html = `
            <div class="help">
                <div class="help-tabs">
                    <button class="help-tab active" data-help="use">📖 使用說明</button>
                    <button class="help-tab" data-help="add">➕ 加法算法</button>
                    <button class="help-tab" data-help="sub">➖ 減法算法</button>
                </div>

                <section class="help-page" data-page="use">
                    <h3>畫面怎麼看</h3>
                    <ul>
                        <li>中間分成 <b style="color:#2A5BC0">百位</b>、<b style="color:#B86A00">十位</b>、<b style="color:#0E7A5A">個位</b> 三個區。球上寫著 100、10、1，代表它的值。</li>
                        <li>一開始畫面上的球，就是算式<b>上面那個數</b>。球有幾個要自己數喔！</li>
                    </ul>

                    <h3>呼叫小人（畫面下方）</h3>
                    <ol>
                        <li>先選小人的<b>工作區</b>：按百位／十位／個位，或直接點畫面上的那一區。</li>
                        <li>按「➕ 放入 1 個」：小人會送 1 顆球進來（加法用）。</li>
                        <li>按「➖ 搬走 1 個」：小人會拿走 1 顆球（減法用）。</li>
                    </ol>

                    <h3>進位與退位（直接在畫面上拖球）</h3>
                    <ul>
                        <li><b>選球</b>：點一下球就選起來，再點一次取消；在空白處拖出一個框，可以一次選很多顆。</li>
                        <li><b>進位</b>：選剛好 10 顆，拖到<b>左邊一格</b>，會換成 1 顆大球。</li>
                        <li><b>退位（借位）</b>：選 1 顆大球，拖到<b>右邊一格</b>，會拆成 10 顆小球。</li>
                        <li>直式上方會自動出現進位、退位的記號。</li>
                    </ul>

                    <h3>輸入與送出</h3>
                    <ul>
                        <li>用右邊的小鍵盤輸入答案，會從個位開始，自動往左跳。點答案格可以改填別的位數。</li>
                        <li>按住小鍵盤的標題列可以拖到任何地方；按 📌 停回右邊，按 － 收起來。</li>
                        <li>送出後會檢查兩件事：<b>① 各區的球對不對</b>、<b>② 答案對不對</b>。兩個都對才過關。</li>
                        <li>答錯的題目會放進「錯題本」，之後可以挑戰重作。</li>
                    </ul>

                    <h3>其他按鈕</h3>
                    <ul>
                        <li>🔄 <b>本題重來</b>：同一題從頭再做一次。⏭️ <b>換一題</b>：出新題目。</li>
                        <li>⛶ <b>全螢幕</b>：畫面變大，比較好操作。</li>
                        <li><b>闖關模式</b>：9 個關卡，每關答對 6 題就前進下一關。</li>
                    </ul>
                </section>

                <section class="help-page" data-page="add" hidden>
                    <p class="help-key">🔑 從<b>個位</b>開始算，滿 10 個就換成 1 個十，送到左邊。</p>
                    <div class="help-eg">
                        <div class="help-eq"><span class="carry">1</span><br>&nbsp;47<br>+38<br><span class="line">&nbsp;85</span></div>
                        <ol>
                            <li><b>先算個位</b>：在個位放入 8 個一。7 + 8 = 15，個位有 15 個。</li>
                            <li><b>滿 10 就進位</b>：選 10 個一，拖到十位，換成 1 個十。個位剩 5 個，寫 <b>5</b>；十位上方記一個小 <b>1</b>。</li>
                            <li><b>再算十位</b>：在十位放入 3 個十。4 + 3 + 進位的 1 = 8，寫 <b>8</b>。</li>
                            <li><b>答案</b>：85。數數畫面上的球：8 個十、5 個一，跟答案一樣。</li>
                        </ol>
                    </div>
                    <p class="help-tip">💡 百位的題目也一樣：個位 → 十位 → 百位，一位一位往左算。記得加上進位的 1！</p>
                </section>

                <section class="help-page" data-page="sub" hidden>
                    <p class="help-key">🔑 從<b>個位</b>開始算，不夠減就向左邊借 1 個，拆成 10 個。</p>
                    <div class="help-eg">
                        <div class="help-eq"><span class="carry">4&nbsp;12</span><br>&nbsp;<s>5</s><s>2</s><br>−27<br><span class="line">&nbsp;25</span></div>
                        <ol>
                            <li><b>先看個位</b>：2 個一要拿走 7 個，不夠。</li>
                            <li><b>向十位借</b>：選 1 個十，拖到個位，拆成 10 個一。十位剩 4 個，個位變 12 個。</li>
                            <li><b>算個位</b>：搬走 7 個一，12 − 7 = 5，寫 <b>5</b>。</li>
                            <li><b>算十位</b>：搬走 2 個十，4 − 2 = 2，寫 <b>2</b>。</li>
                            <li><b>答案</b>：25。</li>
                        </ol>
                    </div>
                    <p class="help-tip">💡 借位後，被借的那一位要<b>少 1</b>，這是最常忘記的地方！</p>
                    <p class="help-tip">💡 遇到 0 不夠借（例如 302 − 157）：先把 1 個百拆成 10 個十，再把 1 個十拆成 10 個一。</p>
                </section>
            </div>`;
            showModal('❓ 使用說明', html);
        }
        $('nav-help').addEventListener('click', showHelpModal);
        $('modal-body').addEventListener('click', e => {
            const tab = e.target.closest('.help-tab');
            if (!tab) return;
            document.querySelectorAll('.help-tab').forEach(t => t.classList.toggle('active', t === tab));
            document.querySelectorAll('.help-page').forEach(pg => { pg.hidden = pg.dataset.page !== tab.dataset.help; });
        });



        // ---------- 13. 畫布尺寸（等比縮放 + 高解析度螢幕清晰） ----------
        function resizeCanvas() {
            const wrap = $('canvas-wrapper');
            const rw = wrap.clientWidth, rh = wrap.clientHeight;
            if (!rw || !rh) return;
            const scale = Math.min(rw / W, rh / H);
            const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
            canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
            ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
        }
        if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe($('canvas-wrapper'));
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

        // ---------- 14. 繪圖主迴圈 ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
            const errZones = (state.zoneError && Date.now() < state.zoneError.until) ? state.zoneError.zones : [];

            PLACES.forEach(t => {
                const enabled = state.enabledZones.includes(t), sel = state.workZone === t;
                ctx.beginPath(); ctx.roundRect(ZONES[t] + 8, 10, 284, H - 20, 18);
                ctx.fillStyle = tint(t, sel ? 0.13 : (enabled ? 0.05 : 0.02)); ctx.fill();
                if (sel) { ctx.lineWidth = 3; ctx.strokeStyle = tint(t, 0.75); ctx.stroke(); }

                // 只顯示位名，不顯示球數，讓學生自己數
                ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
                ctx.font = `800 26px ${FONT}`;
                ctx.fillStyle = enabled ? C[t].ink : '#B8BEC9';
                ctx.fillText(PLACE_NAME[t], ZONES[t] + 150, 50);
                ctx.font = `600 15px ${FONT}`; ctx.fillStyle = '#6B7280';
                ctx.fillText(`1 個 = ${PLACE_VALUE[t]}`, ZONES[t] + 150, 74);

                if (sel) {
                    ctx.font = `800 16px ${FONT}`; ctx.fillStyle = C[t].ink;
                    ctx.fillText('▼ 小人工作區 ▼', ZONES[t] + 150, H - 22);
                }

                if (errZones.includes(t)) { // 送出答案後，標出球不對的區域
                    ctx.save(); ctx.lineWidth = 5; ctx.strokeStyle = state.flashState ? '#E0483E' : 'rgba(224,72,62,.45)';
                    ctx.beginPath(); ctx.roundRect(ZONES[t] + 8, 10, 284, H - 20, 18); ctx.stroke(); ctx.restore();
                    ctx.font = `800 17px ${FONT}`; ctx.fillStyle = '#E0483E';
                    ctx.fillText('❌ 這一區再檢查', ZONES[t] + 150, H - 50);
                }
            });

            if (state.dragHint) {
                const z = state.dragHint.zone;
                ctx.save(); ctx.setLineDash([12, 8]); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(31,42,68,.45)';
                ctx.beginPath(); ctx.roundRect(ZONES[z] + 8, 10, 284, H - 20, 18); ctx.stroke(); ctx.restore();
            }
            if (state.lasso) {
                const r = state.lasso;
                ctx.save(); ctx.setLineDash([8, 6]); ctx.lineWidth = 2.5; ctx.strokeStyle = '#1F2A44';
                ctx.fillStyle = 'rgba(255,212,59,.18)';
                ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill(); ctx.stroke(); ctx.restore();
            }

            PLACES.forEach(t => state.balls[t].forEach(b => { if (!b.selected) { b.update(); b.draw(false); } }));
            PLACES.forEach(t => state.balls[t].forEach(b => { if (b.selected) b.draw(false); })); // 選取的球畫在最上層

            state.characters.forEach(c => { c.update(); c.draw(); });
            state.characters = state.characters.filter(c => c.x < W + 120);

            requestAnimationFrame(draw);
        }

        // ---------- 15. 小鍵盤：預設停靠右側；拖動標題列可拉出成浮動視窗，📌 停靠回去 ----------
        const keypad = $('keypad'), kpHandle = $('keypad-handle'), kpToggle = $('keypad-toggle'), kpDockBtn = $('keypad-dock');
        const dock = $('right-dock'), mainBox = $('main-container');
        const KP_KEY = 'math_keypad_v2';
        let kpPos = { x: 0, y: 0 }, kpDrag = null;

        const isDocked = () => keypad.classList.contains('docked');
        function saveKp() {
            try { localStorage.setItem(KP_KEY, JSON.stringify({ docked: isDocked(), x: kpPos.x, y: kpPos.y, collapsed: keypad.classList.contains('collapsed') })); } catch (e) {}
        }
        function loadKp() {
            try { return JSON.parse(localStorage.getItem(KP_KEY) || 'null'); } catch (e) { return null; }
        }
        function placeKeypad(x, y) {
            const w = keypad.offsetWidth, h = keypad.offsetHeight;
            const maxX = Math.max(4, window.innerWidth - w - 4), maxY = Math.max(4, window.innerHeight - h - 4);
            kpPos = { x: Math.min(Math.max(4, x), maxX), y: Math.min(Math.max(4, y), maxY) };
            keypad.style.transform = `translate(${kpPos.x}px, ${kpPos.y}px)`;
        }
        function dockKeypad() {
            if (keypad.parentElement !== dock) dock.appendChild(keypad);
            keypad.classList.add('docked');
            keypad.style.transform = '';
            mainBox.classList.remove('dock-empty');
        }
        function undockKeypad(x, y) {
            if (keypad.parentElement !== document.body) document.body.appendChild(keypad); // 浮動時移出停靠欄，才不會跟著被隱藏
            keypad.classList.remove('docked');
            mainBox.classList.add('dock-empty');
            placeKeypad(x, y);
        }

        kpHandle.addEventListener('pointerdown', e => {
            if (!e.isPrimary || e.target.closest('.kp-icon')) return;
            e.preventDefault();
            const r = keypad.getBoundingClientRect();
            kpDrag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, started: false };
            try { kpHandle.setPointerCapture(e.pointerId); } catch (_) {}
        });
        kpHandle.addEventListener('pointermove', e => {
            if (!kpDrag || e.pointerId !== kpDrag.id) return;
            if (!kpDrag.started) {
                if (Math.hypot(e.clientX - kpDrag.sx, e.clientY - kpDrag.sy) < 6) return;
                kpDrag.started = true;
                keypad.classList.add('dragging');
                if (isDocked()) {
                    undockKeypad(e.clientX - kpDrag.dx, e.clientY - kpDrag.dy); // 從停靠區拉出來
                    try { kpHandle.setPointerCapture(e.pointerId); } catch (_) {} // 元素搬家後要重新鎖定指標
                }
            }
            placeKeypad(e.clientX - kpDrag.dx, e.clientY - kpDrag.dy);
        });
        const endKpDrag = e => {
            if (!kpDrag || e.pointerId !== kpDrag.id) return;
            const started = kpDrag.started;
            kpDrag = null; keypad.classList.remove('dragging');
            try { kpHandle.releasePointerCapture(e.pointerId); } catch (_) {}
            if (started) saveKp();
        };
        kpHandle.addEventListener('pointerup', endKpDrag);
        kpHandle.addEventListener('pointercancel', endKpDrag);

        kpToggle.addEventListener('click', () => {
            const c = keypad.classList.toggle('collapsed');
            kpToggle.textContent = c ? '＋' : '－';
            if (!isDocked()) placeKeypad(kpPos.x, kpPos.y);
            saveKp();
        });
        kpDockBtn.addEventListener('click', () => { dockKeypad(); saveKp(); });

        window.addEventListener('resize', () => { if (!isDocked()) placeKeypad(kpPos.x, kpPos.y); });

        (function initKeypad() {
            const saved = loadKp();
            if (saved && saved.collapsed) { keypad.classList.add('collapsed'); kpToggle.textContent = '＋'; }
            if (saved && saved.docked === false) undockKeypad(saved.x, saved.y);
            else dockKeypad();
            keypad.classList.add('ready');
        })();

        // ---------- 16. 全螢幕 ----------
        const fsBtn = $('nav-fullscreen');
        const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
        const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
        function updateFsBtn() { fsBtn.textContent = fsElement() ? '🗗 離開全螢幕' : '⛶ 全螢幕'; }
        fsBtn.addEventListener('click', async () => {
            if (!fsSupported) {
                toast('這台裝置的瀏覽器不支援全螢幕。\n可用「分享 → 加入主畫面」，從主畫面開啟就會是全螢幕。', 'info', 3800);
                return;
            }
            try {
                if (fsElement()) {
                    await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
                } else {
                    const el = document.documentElement;
                    await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen());
                }
            } catch (err) {
                toast('無法切換全螢幕，請再試一次。', 'warn');
            }
        });
        document.addEventListener('fullscreenchange', () => { updateFsBtn(); setTimeout(resizeCanvas, 100); });
        document.addEventListener('webkitfullscreenchange', () => { updateFsBtn(); setTimeout(resizeCanvas, 100); });

        resizeCanvas();
        switchSysMode('practice');
        requestAnimationFrame(draw);
    })();
    </script>
</body>
</html>
