# 115年中小學教師數位與AI教學指引
## 1. 數位學習趨勢與願景
### 當前趨勢
- 一生一數位學習載具
- 建置數位平臺與研發內容
- 提出數位與AI素養內涵
- AI輔助教學與融入學科
### 發展願景
- 普及化與平權化學習環境
- 個人化與適性化學習體驗
- 數位與AI素養全面提升
- 創新教學模式與縮減差距
- 教育轉型與協作創新生態

## 2. 核心概念：素養、學習與教學
### 數位素養
- 數位安全、法規與倫理
- 數位技能與資料處理
- 數位溝通、合作與問題解決
- 數位內容識讀與創作
### 數位學習型態
- 教導式學習
- 協作式學習
- 自主式學習
### 數位教學
- 範疇：AI輔助教師教學、AI融入學科學習
- 策略：翻轉教學、合作學習、自主學習、適性學習
- 型態：同步、非同步、混成

## 3. 認識AI與師生AI素養
### 認識人工智慧
- 依功能：判別式 vs 生成式AI
- 依輸出：文字、圖像、語音、影片、多模態
- 代理式AI (Agentic AI)：具自主性、目標導向、可協助任務推進
- 核心原則：以人為中心
### AI素養內涵 (三層級：取得理解、深化應用、創造轉型)
- 教師：AI倫理、基礎技術、AI賦能教學、促進專業發展
- 學生：AI倫理、基礎技術、AI賦能學習、AI系統設計

## 4. 數位與AI教學實務
### 數位平臺與教育AI
- 差異：教育AI以學習目標為核心、適齡設計、重資料保護
- 年齡限制：多數生成式AI需13歲以上(考量法規、認知與資安)
### 選用五原則
- 年齡適切
- 學習目標
- 資料隱私與安全保障
- 課程相容設計
- 保留教師判斷與學生思考歷程

## 5. 教學應用與示例
### 教育部因材網與e度
- 通用型學習夥伴：一般、自然探究、寫作、文思、繪圖等精靈
- 學科領域型學習夥伴：針對知識節點提供引導
### AIPACK 整合應用
- 整合AI技術、教學法與學科知識
### 三階段應用實務
- 課前：備課、設計前測、影片預習、概念釐清
- 課中：班級經營、分組協作、動態評量、提問互動
- 課後：診斷測驗、學習扶助、錯題反思

## 6. 媒體識讀與風險因應
### 7大風險與教學對策
- 錯假訊息 (STEP原則：來源、時間、證據、觀點)
- 認知卸載 (THINK原則：先試、僅提示、轉化、換題、自省)
- AI幻覺與偏見 (FACT原則：找出疑點、追問、查證、轉化)
- 資訊同溫層 (OPEN原則：觀察推薦、暫停判斷、探索多方、說出理由)
- 隱私與資安 (SAFE原則：停想、避免個資、模糊化提問、求助)
- 教育工具化 (HUMAN原則：目標、先理解、重歷程、真實體驗、人際互動)
- 情感依附錯位 (CARE原則：覺察感受、承認AI界線、求助真人、真實互動)
### 教師負責任使用AI七原則
- 永續發展與福祉
- 人類自主 (AI是助手)
- 隱私保護與資料治理
- 資訊安全與安全
- 透明與可解釋
- 公平與不歧視
- 問責

## 7. 教師專業發展路徑
### 自我檢視
- 透過AI素養反思表盤點準備度
### 專業發展三階段
- 取得理解：基礎培力、工具體驗、建立AI學習習慣
- 深化應用：社群共備、數據分析、AI模擬情境、建立規範
- 創造轉型：跨域創新、校本指引、形塑組織文化
