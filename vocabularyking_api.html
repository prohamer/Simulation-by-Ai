            padding: 10px;
        }

            max-width: 650px;
        }

            margin-bottom: 15px;
            font-size: 1.5em;
        }
        h2 {
            font-size: 1.3em;
            margin: 10px 0 15px 0;
        }
        h3 {
            font-size: 1.1em;
            margin: 8px 0 10px 0;
        }
        h4 {
            font-size: 1em;
            margin: 6px 0 8px 0;
        }

        }

            padding: 8px;
            margin-top: 6px;
            border-radius: 4px;
            border: 1px solid #ddd; 
            font-size: 14px;
            box-sizing: border-box; 
        }
        
        button { 
            background-color: #007bff; 
            color: white; 
            cursor: pointer; 
            border: none; 
            transition: background-color 0.3s; 
            padding: 10px;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { 
            background-color: #6c757d; 
            cursor: not-allowed; 
            opacity: 0.6; 
        }
        
        .hidden { display: none; }
        
        .flex-container { 
            display: flex; 
            align-items: center; 
            gap: 8px;
            justify-content: center; 
            margin: 6px 0;
        }
        .flex-container input[type="checkbox"] { width: auto; margin: 0; }
        
        #timer, #current-word, #answer-feedback, #result-summary { 
            font-size: 1.1em;
            margin-top: 12px;
        }
        
        #example-sentence, #example-translation { 
            color: #555; 
            font-style: italic; 
            margin: 8px 0;
        }
        
        .correct-answer-display { 
            margin-top: 8px;
            font-size: 1em;
            color: green; 
        }
        
        .word-item { 
            padding: 8px;
            margin-bottom: 6px;
            background-color: #f8f9fa;
            border-radius: 3px;
            text-align: left;
        }
        
        .word-item-header {
            margin-bottom: 3px;
            font-weight: bold;
            font-size: 0.95em;
        }
        
        .word-item-meaning {
            margin: 3px 0;
            color: #555;
            font-weight: 500;
            font-size: 0.9em;
        }
        
        .word-item-translation {
            margin: 3px 0;
            color: #777;
            font-size: 0.85em;
            font-style: italic;
        }
        
        #logout-button { 
            background-color: #dc3545; 
            margin-top: 15px;
        }
        #logout-button:hover { background-color: #c82333; }
        
        .api-info { 
            font-size: 0.8em;
            color: #6c757d; 
            margin-top: 8px;
        }

        .api-input-container {
            display: flex;
            gap: 8px;
            align-items: stretch;
            margin-top: 6px;
        }
        
        .api-input-container input {
            flex: 1;
            margin: 0;
        }
        
        .paste-api-button {
            width: auto !important;
            padding: 8px 12px !important;
            margin: 0 !important;
            background-color: #28a745 !important;
            color: white !important;
            border: none !important;
            border-radius: 4px !important;
            cursor: pointer !important;
            font-size: 12px !important;
            white-space: nowrap;
            min-width: 60px;
        }
        
        .paste-api-button:hover {

        }

            background-color: #6c757d !important;

            margin-right: 8px;
        }

            margin: 0 8px;
        }

            margin-top: 8px;

            font-size: 12px;
        }
        
        .speed-display {

            color: #666; 
        }
        
        .countdown { 
            color: #007bff; 
            font-weight: bold; 
            margin: 8px 0;
        }

            color: white !important;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            margin: 8px 0;

        }

            background-color: #dc3545 !important;
            color: white !important;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            margin: 8px 0;
            font-size: 0.9em;

            margin-bottom: 3px;

<body>
    <div class="container">
        
        <div id="mode-selection">
            <h1>單字王練習</h1>
            <button id="start-practice-mode">開始練習模式</button>
            <button id="start-test-mode">開始測驗模式</button>
            <button id="logout-button" class="hidden">清除 API Key / 登出</button>
        </div>

        <div id="setup-section" class="hidden">
            <h2>測驗設定</h2>
            <label for="name">姓名 (可選):</label>
            <input type="text" id="name" placeholder="輸入你的姓名">
            
            <label for="start-char">從字首:</label>
            <select id="start-char"></select>
            <label for="end-char">到字首:</label>
            <select id="end-char"></select>
            
            <label for="num-questions">出題數量 (0為範圍內所有):</label>
            <input type="number" id="num-questions" value="0" min="0">

            <label for="time-limit">測驗時間:</label>
            <select id="time-limit">
                <option value="300">5 分鐘</option>
                <option value="480">8 分鐘</option>
                <option value="600">10 分鐘</option>
            </select>

            <label for="thinking-time">思考時間（語音播放完畢後的等待時間）:</label>
            <select id="thinking-time">
                <option value="5">5 秒</option>
                <option value="8" selected>8 秒（預設）</option>
                <option value="10">10 秒</option>
                <option value="15">15 秒</option>
                <option value="custom">自訂</option>
            </select>
            
            <div id="custom-thinking-time" class="hidden" style="margin-top: 10px;">
                <label for="custom-time-input">自訂思考時間:</label>
                <input type="number" id="custom-time-input" value="8" min="3" max="30" style="width: 80px; display: inline-block;">
                <span style="margin-left: 5px;">秒 (3-30秒)</span>
            </div>

            <div class="api-info">
                <div class="flex-container">
                    <input type="checkbox" id="enable-ai-api">
                    <label for="enable-ai-api">啟用 AI 生成例句與翻譯</label>
                </div>
                <div id="api-input-container" class="api-input-container hidden">
                    <input type="text" id="gemini-api-key" placeholder="請輸入你的 Google Gemini API Key">
                    <button type="button" id="paste-api-button" class="paste-api-button">貼上</button>
                </div>
                <p>
                    <a href="https://aistudio.google.com/app/apikey" target="_blank">如何取得 API Key？</a>
                </p>
            </div>
            
            <button id="start-quiz">開始測驗</button>
        </div>

        <div id="practice-section" class="hidden">
            <h2 id="mode-title"></h2>
            <div id="timer">時間: 00:00</div>
            
            <div class="voice-controls">
                <label for="speech-rate">語速控制:</label>
                <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="0.8">
                <span class="speed-display" id="speed-display">0.8x</span>
                
                <div class="voice-control-buttons">
                    <button type="button" id="repeat-word" disabled>🔄 複讀單字</button>
                    <button type="button" id="repeat-sentence" disabled>🔄 複讀例句</button>
                </div>
            </div>
            
            <div id="current-question"></div>
            <div id="current-word"></div>
            <input type="text" id="answer-input" placeholder="請輸入單字">
            <div id="answer-feedback"></div>
            
            <button id="show-example" class="hidden" disabled>顯示例句</button>
            <p id="example-sentence" class="hidden"></p>
            <button id="show-translation" class="hidden" disabled>顯示翻譯</button>
            <p id="example-translation" class="hidden"></p>
            
            <div id="correct-answer-display" class="correct-answer-display hidden">
                <p>正確答案：<span id="correct-word-display"></span></p>
                <p>翻譯：<span id="correct-translation-display"></span></p>
                <p id="next-question-countdown" class="hidden countdown"></p>
                <button id="next-question-btn" class="hidden" style="background-color: #28a745;">下一題</button>
            </div>
        </div>

        <div id="result-section" class="hidden">
            <h2>測驗結果</h2>
            <div id="result-summary"></div>
            <ul id="word-list-result"></ul>
            <button onclick="window.location.reload()">重新開始</button>
        </div>
  
    </div>

            window.quizMode = quizMode;

            window.timerInterval = timerInterval;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            
            document.addEventListener('click', function initSpeech() {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance('');
                    utterance.volume = 0;
                    window.speechSynthesis.speak(utterance);
                    console.log('語音API已初始化');
                }
                document.removeEventListener('click', initSpeech);
            }, { once: true });
        });

        function initializeApp() {
            initCharSelectors();
            bindEvents();
            checkAPIKeyExpiry();
            disableTextSelection();
            syncGlobalVariables();
            console.log('應用程式初始化完成');
        }

        function initCharSelectors() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            const startCharSelect = document.getElementById('start-char');
            const endCharSelect = document.getElementById('end-char');
            
            chars.forEach(char => {
                startCharSelect.add(new Option(char, char));
                endCharSelect.add(new Option(char, char));
            });
        }

        function bindEvents() {
            document.getElementById('start-practice-mode').addEventListener('click', () => startMode('practice'));
            document.getElementById('start-test-mode').addEventListener('click', () => startMode('test'));
            document.getElementById('start-quiz').addEventListener('click', startQuiz);
            document.getElementById('enable-ai-api').addEventListener('change', toggleAPIInput);
            document.getElementById('logout-button').addEventListener('click', logout);
            document.getElementById('speech-rate').addEventListener('input', updateSpeechRate);
            document.getElementById('repeat-word').addEventListener('click', repeatWord);
            document.getElementById('repeat-sentence').addEventListener('click', repeatSentence);
            document.getElementById('answer-input').addEventListener('keydown', handleAnswer);
            document.getElementById('next-question-btn').addEventListener('click', goToNextQuestion);
            document.getElementById('thinking-time').addEventListener('change', handleThinkingTimeChange);
            document.getElementById('custom-time-input').addEventListener('input', handleCustomTimeInput);
            document.getElementById('paste-api-button').addEventListener('click', pasteAPIKey);
        }
        
        function handleThinkingTimeChange() {
            const thinkingTimeSelect = document.getElementById('thinking-time');
            const customTimeDiv = document.getElementById('custom-thinking-time');
            const customTimeInput = document.getElementById('custom-time-input');
            
            if (thinkingTimeSelect.value === 'custom') {
                customTimeDiv.classList.remove('hidden');
                thinkingTime = parseInt(customTimeInput.value) || 8;
            } else {
                customTimeDiv.classList.add('hidden');
                thinkingTime = parseInt(thinkingTimeSelect.value);
            }
            
            window.thinkingTime = thinkingTime;
            console.log('思考時間已設定為:', thinkingTime, '秒');
        }

        function handleCustomTimeInput() {
            const customTimeInput = document.getElementById('custom-time-input');
            let customTime = parseInt(customTimeInput.value);
            
            if (customTime < 3) {
                customTime = 3;
                customTimeInput.value = 3;
            } else if (customTime > 30) {
                customTime = 30;
                customTimeInput.value = 30;
            }
            
            thinkingTime = customTime;
            window.thinkingTime = thinkingTime;
            console.log('自訂思考時間:', thinkingTime, '秒');
        }

        // 貼上 API KEY 函數
        async function pasteAPIKey() {
            const button = document.getElementById('paste-api-button');
            const input = document.getElementById('gemini-api-key');
            
            try {
                button.disabled = true;
                button.textContent = '貼上中...';
                
                if (!navigator.clipboard || !navigator.clipboard.readText) {
                    throw new Error('您的瀏覽器不支援剪貼簿功能，請手動輸入 API Key');
                }
                
                const clipboardText = await navigator.clipboard.readText();
                
                if (!clipboardText || clipboardText.trim() === '') {
                    throw new Error('剪貼簿是空的，請先複製您的 API Key');
                }
                
                const trimmedText = clipboardText.trim();
                if (!trimmedText.startsWith('AIza')) {
                    const confirm = window.confirm('偵測到剪貼簿內容可能不是有效的 Gemini API Key\n（有效的 API Key 通常以 "AIza" 開頭）\n\n是否仍要貼上？');
                    if (!confirm) {
                        throw new Error('已取消貼上');
                    }
                }
                
                input.value = trimmedText;
                input.dispatchEvent(new Event('input', { bubbles: true }));
                
                button.textContent = '已貼上';
                setTimeout(() => {
                    button.textContent = '貼上';
                    button.disabled = false;
                }, 1500);
                
                console.log('API Key 已成功貼上');
                
            } catch (error) {
                console.error('貼上 API Key 失敗:', error);
                
                let errorMessage;
                if (error.name === 'NotAllowedError') {
                    errorMessage = '無法存取剪貼簿，請檢查瀏覽器權限設定或手動輸入 API Key';
                } else if (error.message.includes('不支援剪貼簿功能')) {
                    errorMessage = error.message;
                } else {
                    errorMessage = error.message || '貼上失敗，請手動輸入 API Key';
                }
                
                alert(errorMessage);
                
                button.textContent = '貼上';
                button.disabled = false;
                input.focus();
            }
        }

        function disableTextSelection() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());
        }

        function checkAPIKeyExpiry() {
            const storedKey = localStorage.getItem(API_KEY_STORAGE_KEY);
            const storedTimestamp = localStorage.getItem(API_KEY_TIMESTAMP_KEY);

            if (storedKey && storedTimestamp) {
                const now = Date.now();
                if (now - parseInt(storedTimestamp) > EXPIRY_TIME_MS) {
                    localStorage.removeItem(API_KEY_STORAGE_KEY);
                    localStorage.removeItem(API_KEY_TIMESTAMP_KEY);
                    alert("您的 API Key 已過期，請重新輸入以繼續使用 AI 功能。");
                } else {
                    geminiAPIKey = storedKey;
                    window.geminiAPIKey = geminiAPIKey;
                    document.getElementById('enable-ai-api').checked = true;
                    document.getElementById('gemini-api-key').value = storedKey;
                    document.getElementById('api-input-container').classList.remove('hidden');
                    document.getElementById('logout-button').classList.remove('hidden');
                }
            }
        }

        // 語音功能
        function speak(text, rate) {
            rate = rate || speechRate;
            return new Promise((resolve) => {
                if (!window.speechSynthesis) {
                    resolve();
                    return;
                }
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = rate;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                
                utterance.onend = () => resolve();
                utterance.onerror = () => resolve();
                
                window.speechSynthesis.speak(utterance);
                setTimeout(resolve, Math.max(2000, text.length * 100));
            });
        }

        function clearAllTimers() {
            if (audioSequenceTimer) {
                clearTimeout(audioSequenceTimer);
                audioSequenceTimer = null;
                window.audioSequenceTimer = null;
            }
            if (buttonEnableTimer) {
                clearTimeout(buttonEnableTimer);
                buttonEnableTimer = null;
                window.buttonEnableTimer = null;
            }
            if (nextQuestionTimer) {
                clearInterval(nextQuestionTimer);
                nextQuestionTimer = null;
                window.nextQuestionTimer = null;
            }
            
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            
            console.log('所有計時器已清除');
        }

        // 答題追蹤
        function initializeQuestionTracking() {
            questionResults = currentQuiz.map((question, index) => ({
                questionNumber: index + 1,
                word: question.word,
                meaning: question.meaning || '',
                translation: question.translation,
                exampleSentence: question.exampleSentence,
                status: null,
                attempts: 0
            }));
            window.questionResults = questionResults;
            console.log('初始化答題追蹤，總題數:', questionResults.length);
        }

        function recordQuestionResult(questionIndex, status, attempts) {
            attempts = attempts || 1;
            if (questionIndex < questionResults.length) {
                questionResults[questionIndex].status = status;
                questionResults[questionIndex].attempts = attempts;
                window.questionResults = questionResults;
                
                const statusText = {
                    [ANSWER_STATUS.CORRECT]: '答對',
                    [ANSWER_STATUS.INCORRECT]: '答錯',
                    [ANSWER_STATUS.SKIPPED]: '跳過'
                };
                
                console.log('記錄第', questionIndex + 1, '題結果:', statusText[status]);
            }
            syncGlobalVariables();
        }

        function getQuizStatistics() {
            const answeredQuestions = questionResults.slice(0, currentQuestionIndex);
            
            const stats = {
                totalQuestions: answeredQuestions.length,
                correctCount: 0,
                incorrectCount: 0,
                skippedCount: 0,
                correctRate: 0
            };
            
            answeredQuestions.forEach(result => {
                switch(result.status) {
                    case ANSWER_STATUS.CORRECT:
                        stats.correctCount++;
                        break;
                    case ANSWER_STATUS.INCORRECT:
                        stats.incorrectCount++;
                        break;
                    case ANSWER_STATUS.SKIPPED:
                        stats.skippedCount++;
                        break;
                }
            });
            
            if (stats.totalQuestions > 0) {
                stats.correctRate = Math.round((stats.correctCount / stats.totalQuestions) * 100);
            }
            
            return stats;
        }

                '<p><strong>總花費時間:</strong> ' + formatTime(totalTime) + '</p>' +
                '<div style="background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0;">' +
                    '<h4>答題統計</h4>' +
                    '<p><strong>總題數:</strong> ' + stats.totalQuestions + '</p>' +
                    '<p><strong>答對:</strong> <span style="color: green;">' + stats.correctCount + ' 題</span></p>' +
                    '<p><strong>答錯:</strong> <span style="color: red;">' + stats.incorrectCount + ' 題</span></p>' +
                    '<p><strong>跳過:</strong> <span style="color: orange;">' + stats.skippedCount + ' 題</span></p>' +
                    '<p><strong>正確率:</strong> <span style="font-size: 1.2em; font-weight: bold; color: ' + 
                    (stats.correctRate >= 80 ? 'green' : stats.correctRate >= 60 ? 'orange' : 'red') + ';">' + 
                    stats.correctRate + '%</span></p>' +
                '</div>';
            
            const wordListResult = document.getElementById('word-list-result');
            wordListResult.innerHTML = '<h4>詳細答題記錄（依出題順序）</h4>';
            
            const answeredQuestions = questionResults.slice(0, currentQuestionIndex);
            answeredQuestions.forEach((result, index) => {
                const li = document.createElement('li');
                li.className = 'word-item';
                li.style.padding = '12px';
                li.style.borderLeft = '4px solid ' + getStatusColor(result.status);
                li.style.marginBottom = '8px';
                li.style.backgroundColor = '#f8f9fa';
                li.style.borderRadius = '4px';
                
                const statusSymbol = getStatusSymbol(result.status);
                const statusText = getStatusText(result.status);
                
                let displayContent = `
                    <div class="word-item-header">
                        <strong>第${index + 1}題</strong> ${statusSymbol} 
                        <span style="font-weight: bold; font-size: 1.1em; color: #333;">${result.word}</span>
                        <span style="color: #666; font-size: 0.9em;">(${statusText})</span>
                    </div>
                `;
                
                if (result.meaning && result.meaning.trim()) {
                    displayContent += `
                        <div class="word-item-meaning">
                            <strong>字義：</strong>${result.meaning}
                        </div>
                    `;
                }
                
                if (result.translation && result.translation.trim()) {
                    displayContent += `
                        <div class="word-item-translation">
                            <strong>例句翻譯：</strong>${result.translation}
                        </div>
                    `;
                }
                
                li.innerHTML = displayContent;
                wordListResult.appendChild(li);
            });
        }

        function getStatusColor(status) {
            switch(status) {
                case ANSWER_STATUS.CORRECT: return '#28a745';
                case ANSWER_STATUS.INCORRECT: return '#dc3545';
                case ANSWER_STATUS.SKIPPED: return '#ffc107';
                default: return '#6c757d';
            }
        }

        function getStatusSymbol(status) {
            switch(status) {
                case ANSWER_STATUS.CORRECT: return '✓';
                case ANSWER_STATUS.INCORRECT: return '✗';
                case ANSWER_STATUS.SKIPPED: return '！';
                default: return '?';
            }
        }

        function getStatusText(status) {
            switch(status) {
                case ANSWER_STATUS.CORRECT: return '答對';
                case ANSWER_STATUS.INCORRECT: return '答錯';
                case ANSWER_STATUS.SKIPPED: return '跳過';
                default: return '未知';
            }
        }

        // 主要功能
        async function startQuiz() {
            const startChar = document.getElementById('start-char').value;
            const endChar = document.getElementById('end-char').value;
            const numQuestions = parseInt(document.getElementById('num-questions').value);

            const thinkingTimeSelect = document.getElementById('thinking-time');
            const customTimeInput = document.getElementById('custom-time-input');
            
            if (thinkingTimeSelect.value === 'custom') {
                thinkingTime = parseInt(customTimeInput.value) || 8;
            } else {
                thinkingTime = parseInt(thinkingTimeSelect.value);
            }
            window.thinkingTime = thinkingTime;
            
            console.log('測驗開始，思考時間設定為:', thinkingTime, '秒');

            useAI = document.getElementById('enable-ai-api').checked;
            window.useAI = useAI;
            
            if (useAI) {
                geminiAPIKey = document.getElementById('gemini-api-key').value.trim();
                if (!geminiAPIKey) {
                    alert('請輸入有效的 Gemini API Key');
                    return;
                }
                window.geminiAPIKey = geminiAPIKey;
                localStorage.setItem(API_KEY_STORAGE_KEY, geminiAPIKey);
                localStorage.setItem(API_KEY_TIMESTAMP_KEY, Date.now().toString());
            }

            const filteredWords = wordList.filter(wordObj => {
                const firstChar = wordObj.word.charAt(0).toUpperCase();
                return firstChar >= startChar && firstChar <= endChar;
            });

            const shuffledWords = shuffleArray([...filteredWords]);
            currentQuiz = numQuestions > 0 ? shuffledWords.slice(0, numQuestions) : shuffledWords;
            window.currentQuiz = currentQuiz;

            if (currentQuiz.length === 0) {
                alert('該範圍內沒有找到單字，請重新選擇');
                return;
            }

            initializeQuestionTracking();

            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('practice-section').classList.remove('hidden');
            quizStartTime = Date.now();
            window.quizStartTime = quizStartTime;
            startTimer();
            loadNextQuestion();
            syncGlobalVariables();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startTimer() {
            const timeLimit = parseInt(document.getElementById('time-limit').value);
            let timeLeft = timeLimit;
            const timerDisplay = document.getElementById('timer');
            
            timerDisplay.textContent = '時間: ' + formatTime(timeLeft);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = '時間: ' + formatTime(timeLeft);
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endQuiz();
                }
            }, 1000);
            window.timerInterval = timerInterval;
            syncGlobalVariables();
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return String(minutes).padStart(2, '0') + ':' + String(remainingSeconds).padStart(2, '0');
        }

        async function loadNextQuestion() {
            console.log('載入下一題，索引:', currentQuestionIndex, '/', currentQuiz.length);
            
            if (currentQuestionIndex >= currentQuiz.length) {
                console.log('測驗結束');
                endQuiz();
                return;
            }

            currentWordObj = currentQuiz[currentQuestionIndex];
            window.currentWordObj = currentWordObj;
            console.log('載入單字:', currentWordObj.word);
            
            resetUI();
            
            let exampleText = currentWordObj.exampleSentence;
            let translationText = currentWordObj.translation;

            if (useAI) {
                const aiContent = await generateAIContent(currentWordObj.word);
                if (aiContent) {
                    exampleText = aiContent.example;
                    translationText = aiContent.translation;
                }
            }
            
            currentExampleText = exampleText;
            currentTranslationText = translationText;
            window.currentExampleText = currentExampleText;
            window.currentTranslationText = currentTranslationText;

            playAudioSequence();
            setupQuestionEventListeners();
            syncGlobalVariables();
        }

        function resetUI() {
            console.log('重置UI，題目索引:', currentQuestionIndex);
            
            clearAllTimers();
            
            document.getElementById('current-question').textContent = 
                '第 ' + (currentQuestionIndex + 1) + ' / ' + currentQuiz.length + ' 題';
            document.getElementById('current-word').textContent = '';
            
            const answerInput = document.getElementById('answer-input');
            if (answerInput) {
                answerInput.value = '';
                try {
                    answerInput.focus();
                } catch (e) {}
            }
            
            const feedback = document.getElementById('answer-feedback');
            if (feedback) {
                feedback.innerHTML = '';
                feedback.className = '';
                feedback.style.cssText = '';
            }
            
            const buttons = ['show-example', 'show-translation', 'repeat-word', 'repeat-sentence', 'next-question-btn'];
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.disabled = true;
                    if (id === 'show-example' || id === 'show-translation' || id === 'repeat-word' || id === 'repeat-sentence') {
                        btn.classList.remove('hidden');
                        btn.style.display = 'block';
                    }
                    if (id === 'next-question-btn') {
                        btn.textContent = '下一題';
                        btn.style.cssText = '';
                    }
                }
            });
            
            const hideElements = ['example-sentence', 'example-translation', 'next-question-countdown'];
            hideElements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.classList.add('hidden');
                }
            });

            const correctWordSpan = document.getElementById('correct-word-display');
            const correctTranslationSpan = document.getElementById('correct-translation-display');
            
            if (correctWordSpan) {
                correctWordSpan.textContent = '';
            }
            
            if (correctTranslationSpan) {
                correctTranslationSpan.textContent = '';
            }

            const correctAnswerDiv = document.getElementById('correct-answer-display');
            if (correctAnswerDiv) {
                correctAnswerDiv.classList.remove('hidden');
                correctAnswerDiv.style.display = 'block';
                correctAnswerDiv.style.visibility = 'visible';
            }
            
            isCorrectAnswer = false;
            window.isCorrectAnswer = false;
            
            syncGlobalVariables();
        }

        function enableButtons() {
            console.log('啟用按鈕，模式:', quizMode);
            
            const buttons = ['show-example', 'show-translation', 'repeat-word', 'repeat-sentence'];
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                }
            });

            if (quizMode === 'test') {
                showCorrectAnswer();
                enableNextQuestionButton();
                startNextQuestionCountdown();
            } else if (quizMode === 'practice') {
                enableNextQuestionButtonForPractice();
            }
            syncGlobalVariables();
        }

        function enableNextQuestionButtonForPractice() {
            const nextBtn = document.getElementById('next-question-btn');
            
            if (nextBtn) {
                nextBtn.disabled = false;
                nextBtn.textContent = '跳過此題';
                nextBtn.style.backgroundColor = '#ffc107';
                nextBtn.style.color = '#212529';
                nextBtn.style.border = '2px solid #ffc107';
                nextBtn.style.padding = '12px 16px';
                nextBtn.style.fontSize = '16px';
                nextBtn.style.fontWeight = 'bold';
                nextBtn.style.display = 'block';
                nextBtn.style.width = '100%';
                nextBtn.style.maxWidth = '300px';
                nextBtn.style.margin = '10px auto';
                nextBtn.style.borderRadius = '6px';
                nextBtn.style.cursor = 'pointer';
                
                console.log('練習模式：跳過按鈕已啟用');
                return true;
            }
            return false;
        }

        function enableNextQuestionButton() {
            const nextBtn = document.getElementById('next-question-btn');
            
            if (nextBtn) {
                nextBtn.textContent = '下一題';
                nextBtn.disabled = false;
                nextBtn.classList.remove('hidden');
            }
        }

        function setupQuestionEventListeners() {
            const showExampleBtn = document.getElementById('show-example');
            const showTranslationBtn = document.getElementById('show-translation');
            
            if (!showExampleBtn || !showTranslationBtn) return;
            
            const newShowExampleBtn = showExampleBtn.cloneNode(true);
            const newShowTranslationBtn = showTranslationBtn.cloneNode(true);
            
            showExampleBtn.parentNode.replaceChild(newShowExampleBtn, showExampleBtn);
            showTranslationBtn.parentNode.replaceChild(newShowTranslationBtn, showTranslationBtn);
            
            newShowExampleBtn.addEventListener('click', () => {
                document.getElementById('example-sentence').textContent = currentExampleText;
                document.getElementById('example-sentence').classList.remove('hidden');
            });
            
            newShowTranslationBtn.addEventListener('click', () => {
                document.getElementById('example-translation').textContent = currentTranslationText;
                document.getElementById('example-translation').classList.remove('hidden');
            });
        }

        function handleAnswer(e) {
            if (e.key === 'Enter') {
                if (quizMode === 'practice') {
                    if (isCorrectAnswer) {
                        goToNextQuestion();
                        return;
                    }
                    
                    const userInput = e.target.value.trim();
                    const correctAnswer = currentQuiz[currentQuestionIndex].word;
                    
                    if (userInput.toLowerCase() === correctAnswer.toLowerCase()) {
                        window.speechSynthesis.cancel();
                        
                        const feedbackElement = document.getElementById('answer-feedback');
                        if (feedbackElement) {
                            feedbackElement.innerHTML = '✓ 答對了！很棒！';
                            feedbackElement.className = 'feedback-success';
                        }
                        
                        recordQuestionResult(currentQuestionIndex, ANSWER_STATUS.CORRECT);
                        
                        enableButtons();
                        showCorrectAnswer();
                        
                        isCorrectAnswer = true;
                        window.isCorrectAnswer = true;
                        
                        const nextBtn = document.getElementById('next-question-btn');
                        if (nextBtn) {
                            nextBtn.textContent = '下一題';
                            nextBtn.style.backgroundColor = '#28a745';
                            nextBtn.style.color = 'white';
                            nextBtn.style.border = '1px solid #28a745';
                        }
                        
                        startNextQuestionCountdown();
                    } else {
                        const feedbackElement = document.getElementById('answer-feedback');
                        if (feedbackElement) {
                            feedbackElement.innerHTML = '✗ 答案不正確，請再試一次';
                            feedbackElement.className = 'feedback-error';
                        }
                        
                        const nextBtn = document.getElementById('next-question-btn');
                        if (nextBtn) {
                            nextBtn.disabled = false;
                            nextBtn.textContent = '跳過此題';
                            nextBtn.style.backgroundColor = '#dc3545';
                            nextBtn.style.color = 'white';
                            nextBtn.style.border = '2px solid #dc3545';
                            nextBtn.style.padding = '12px 16px';
                            nextBtn.style.fontSize = '16px';
                            nextBtn.style.fontWeight = 'bold';
                            nextBtn.style.display = 'block';
                            nextBtn.style.width = '100%';
                            nextBtn.style.maxWidth = '300px';
                            nextBtn.style.margin = '10px auto';
                            nextBtn.style.borderRadius = '6px';
                            nextBtn.style.cursor = 'pointer';
                        }
                    }
                } else if (quizMode === 'test') {
                    const userInput = e.target.value.trim().toLowerCase();
                    const correctAnswer = currentQuiz[currentQuestionIndex].word.toLowerCase();
                    
                    if (userInput === correctAnswer) {
                        recordQuestionResult(currentQuestionIndex, ANSWER_STATUS.CORRECT);
                    } else if (userInput.length > 0) {
                        recordQuestionResult(currentQuestionIndex, ANSWER_STATUS.INCORRECT);
                    } else {
                        recordQuestionResult(currentQuestionIndex, ANSWER_STATUS.SKIPPED);
                    }
                    
                    goToNextQuestion();
                }
            }
            syncGlobalVariables();
        }

        function showCorrectAnswer() {
            const correctWordSpan = document.getElementById('correct-word-display');
            const correctTranslationSpan = document.getElementById('correct-translation-display');
            const correctAnswerDiv = document.getElementById('correct-answer-display');
            
            if (correctWordSpan && correctTranslationSpan && correctAnswerDiv) {
                const currentWord = currentQuiz[currentQuestionIndex];
                correctWordSpan.textContent = currentWord.word;
                correctTranslationSpan.textContent = currentTranslationText || currentWord.translation;
                correctAnswerDiv.classList.remove('hidden');
            }
        }

        function startNextQuestionCountdown() {
            let countdown = 3;
            const countdownElement = document.getElementById('next-question-countdown');
            const nextBtn = document.getElementById('next-question-btn');
            
            if (countdownElement) {
                countdownElement.textContent = countdown + ' 秒後自動進入下一題';
                countdownElement.classList.remove('hidden');
            }
            
            if (nextBtn) {
                nextBtn.textContent = '立即下一題';
                nextBtn.classList.remove('hidden');
            }
            
            nextQuestionTimer = setInterval(() => {
                countdown--;
                if (countdown > 0 && countdownElement) {
                    countdownElement.textContent = countdown + ' 秒後自動進入下一題';
                } else {
                    if (nextQuestionTimer) {
                        clearInterval(nextQuestionTimer);
                        nextQuestionTimer = null;
                        window.nextQuestionTimer = null;
                    }
                    goToNextQuestion();
                }
            }, 1000);
            window.nextQuestionTimer = nextQuestionTimer;
            syncGlobalVariables();
        }

        function goToNextQuestion() {
            console.log('進入下一題，當前索引:', currentQuestionIndex);
            
            if (quizMode === 'practice' && 
                questionResults[currentQuestionIndex] && 
                questionResults[currentQuestionIndex].status === null) {
                recordQuestionResult(currentQuestionIndex, ANSWER_STATUS.SKIPPED);
            }
            
            clearAllTimers();
            
            const countdownElement = document.getElementById('next-question-countdown');
            if (countdownElement) {
                countdownElement.classList.add('hidden');
            }
            
            isCorrectAnswer = false;
            window.isCorrectAnswer = false;
            
            currentQuestionIndex++;
            window.currentQuestionIndex = currentQuestionIndex;
            
            syncGlobalVariables();
            loadNextQuestion();
        }

        function endQuiz() {
            clearInterval(timerInterval);
            document.getElementById('practice-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            displayEnhancedResults();
            syncGlobalVariables();
        }

        async function generateAIContent(word) {
            if (!geminiAPIKey) {
                return null;
            }
            
            try {
                const prompt = "請為這個英文單字提供一個例句，並附上中文翻譯，格式為：\n英文例句: [例句內容]\n中文翻譯: [中文翻譯內容]\n單字: " + word;
                const result = await getGeminiContent(prompt, geminiAPIKey);
                
                if (result) {
                    const exampleMatch = result.match(/英文例句: (.*)/);
                    const translationMatch = result.match(/中文翻譯: (.*)/);
                    if (exampleMatch && translationMatch) {
                        return {
                            example: exampleMatch[1].trim(),
                            translation: translationMatch[1].trim()
                        };
                    }
                }
                return null;
            } catch (error) {
                console.warn('AI內容生成錯誤:', error.message);
                return null;
            }
        }

        async function getGeminiContent(prompt, key) {
            const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + key;
            const requestBody = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                
                const data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    return data.candidates[0].content.parts[0].text;
                }
                throw new Error('No content generated from API.');
            } catch (error) {
                console.warn('Gemini API調用失敗:', error.message);
                return null;
            }
        }

        syncGlobalVariables();
  
    </script>
</body>
