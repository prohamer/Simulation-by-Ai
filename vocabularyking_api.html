<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字王練習GS27</title>
<style>
    html { font-size: 16px; }
    body {
        font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
        display: flex; justify-content: center; align-items: flex-start;
        min-height: 100vh; background-color: #f0f2f5; margin: 0; padding: 10px;
        box-sizing: border-box; user-select: none; -webkit-user-select: none;
    }
    input, textarea { user-select: text; -webkit-user-select: text; }
    .container {
        background: #fff; padding: 1.25rem; border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center;
        width: 95%; max-width: 650px; margin-top: 2vh;
    }
    h1 { color: #333; margin: 0 0 1rem; font-size: 1.5rem; }
    h2 { font-size: 1.3rem; margin: 0.6rem 0 1rem; }
    h3 { font-size: 1.1rem; margin: 0.5rem 0 0.6rem; }
    h4 { font-size: 1rem; margin: 0.4rem 0 0.5rem; }
    p { margin: 0.4rem 0; font-size: 0.9rem; }
    label { font-size: 0.85rem; margin: 0.6rem 0 0.2rem; display: block; text-align: left; }
    .hidden { display: none !important; }

    input, select, button {
        width: 100%; padding: 0.55rem; margin-top: 0.35rem; border-radius: 4px;
        border: 1px solid #ccc; font-size: 0.9rem; box-sizing: border-box;
    }
    button {
        background-color: #007bff; color: #fff; cursor: pointer; border: none;
        transition: background-color 0.2s; padding: 0.65rem;
    }
    button:hover:not(:disabled) { background-color: #0056b3; }
    button:disabled { background-color: #6c757d; cursor: not-allowed; opacity: 0.6; }
    .btn-secondary { background-color: #6c757d; }
    .btn-secondary:hover:not(:disabled) { background-color: #545b62; }
    .btn-danger { background-color: #dc3545; }
    .btn-danger:hover:not(:disabled) { background-color: #c82333; }
    .btn-success { background-color: #28a745; }
    .btn-success:hover:not(:disabled) { background-color: #218838; }
    .btn-warning { background-color: #ffc107; color: #212529; font-weight: bold; }
    .btn-warning:hover:not(:disabled) { background-color: #e0a800; }

    .row { display: flex; gap: 8px; align-items: stretch; }
    .row > * { flex: 1; }
    .check-row { display: flex; align-items: center; gap: 8px; margin: 0.6rem 0 0.2rem; text-align: left; }
    .check-row input { width: auto; margin: 0; }
    .check-row label { margin: 0; }
    .hint { font-size: 0.78rem; color: #6c757d; text-align: left; margin: 0.25rem 0; }
    .hint.warn { color: #b02a37; }
    .notice {
        background: #fff3cd; color: #856404; border: 1px solid #ffc107;
        border-radius: 4px; padding: 0.5rem; font-size: 0.8rem; margin: 0.5rem 0;
    }

    .api-box { background: #f8f9fa; border-radius: 6px; padding: 0.6rem; margin-top: 0.6rem; }
    .api-input-row { display: flex; gap: 6px; }
    .api-input-row input { flex: 1; margin: 0; }
    .api-input-row button { width: auto; margin: 0; padding: 0.5rem 0.7rem; font-size: 0.8rem; white-space: nowrap; }

    #timer { font-size: 1.1rem; margin-top: 0.4rem; font-weight: bold; }
    #timer.low { color: #dc3545; }
    .voice-controls { margin: 0.6rem 0; padding: 0.6rem; background-color: #f8f9fa; border-radius: 6px; }
    .ctrl-row { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .ctrl-row + .ctrl-row { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #dee2e6; }
    .ctrl-row span.lbl { font-size: 0.78rem; }
    .ctrl-row input[type="range"] { width: 120px; margin: 0; }
    .sq-btn {
        width: 36px !important; height: 36px; padding: 0 !important; margin: 0 !important;
        font-size: 1rem; font-weight: bold; display: flex; align-items: center; justify-content: center;
    }
    .val-display { min-width: 44px; font-size: 0.78rem; color: #333; }
    .voice-buttons { display: flex; gap: 8px; margin-top: 0.5rem; }
    .voice-buttons button { margin: 0; font-size: 0.8rem; padding: 0.45rem; }

    #question-no { font-size: 1rem; margin: 0.5rem 0; }
    #meaning-hint { font-size: 1.15rem; color: #0b5ed7; font-weight: bold; margin: 0.4rem 0; min-height: 1.2em; }
    #status-line { font-size: 0.85rem; color: #6c757d; min-height: 1.1em; }
    #answer-input { font-size: 1.1rem; text-align: center; }
    #answer-input:disabled { background: #e9ecef; }
    .feedback { padding: 0.5rem; border-radius: 4px; font-weight: bold; margin: 0.5rem 0; font-size: 0.9rem; color: #fff; }
    .feedback.ok { background-color: #28a745; }
    .feedback.bad { background-color: #dc3545; }
    .feedback.info { background-color: #6c757d; }
    .example-text { color: #555; font-style: italic; margin: 0.5rem 0; font-size: 0.95rem; }
    .answer-panel {
        margin-top: 0.6rem; padding: 0.6rem; border: 1px solid #b7e1c1; background: #eef9f0;
        border-radius: 6px; text-align: left;
    }
    .answer-panel p { font-size: 0.9rem; }
    .answer-panel .ans-word { color: #198754; font-size: 1.2rem; font-weight: bold; }
    .countdown { color: #007bff; font-weight: bold; margin: 0.5rem 0; text-align: center; }

    .stats-box { background-color: #f8f9fa; padding: 0.9rem; border-radius: 8px; margin: 0.6rem 0; }
    .rate { font-size: 1.2rem; font-weight: bold; }
    #word-list-result { list-style: none; padding: 0; margin: 0.6rem 0; }
    .word-item {
        padding: 0.6rem 0.75rem; margin-bottom: 8px; background-color: #f8f9fa;
        border-radius: 4px; text-align: left; border-left: 4px solid #6c757d;
    }
    .word-item.correct { border-left-color: #28a745; }
    .word-item.incorrect { border-left-color: #dc3545; }
    .word-item.skipped { border-left-color: #ffc107; }
    .word-item-header { font-weight: bold; font-size: 0.95rem; margin-bottom: 3px; }
    .word-item-header .w { font-size: 1.05rem; color: #333; }
    .word-item-header .s { color: #666; font-size: 0.85rem; font-weight: normal; }
    .word-item-line { margin: 3px 0; color: #555; font-size: 0.85rem; }
    .word-item-line.tr { color: #777; font-style: italic; }
    .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .result-actions button { margin: 0; }

    .history-filters { display: flex; gap: 8px; margin: 0.5rem 0; }
    .history-filters > * { flex: 1; margin: 0; }
    .history-toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0.5rem 0; }
    .history-toolbar button { margin: 0; }
    .rec-card {
        text-align: left; background: #f8f9fa; border-radius: 6px; padding: 0.6rem 0.75rem;
        margin-bottom: 8px; border-left: 4px solid #007bff;
    }
    .rec-card.test { border-left-color: #6f42c1; }
    .rec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 0.9rem; }
    .rec-meta { font-size: 0.78rem; color: #666; margin-top: 2px; }
    .rec-actions { display: flex; gap: 6px; margin-top: 0.45rem; }
    .rec-actions button { margin: 0; padding: 0.4rem; font-size: 0.8rem; }
    .rec-detail { margin-top: 0.5rem; padding: 0; list-style: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0.4rem 0 0.6rem; }
    .chip { background: #fde2e4; color: #842029; border-radius: 12px; padding: 2px 10px; font-size: 0.8rem; }

    @media (max-width: 767px) {
        .container { padding: 0.9rem; width: 100%; }
        input, select, button { font-size: 16px; }
        .api-input-row { flex-wrap: wrap; }
        .api-input-row input { flex-basis: 100%; }
        .api-input-row button { flex: 1; }
    }
</style>
</head>
<body>
<div class="container">

    <!-- 模式選擇 -->
    <div id="mode-selection">
        <h1>單字王練習</h1>
        <button id="start-practice-mode">開始練習模式</button>
        <button id="start-test-mode">開始測驗模式</button>
        <button id="open-history" class="btn-secondary">📚 測驗紀錄庫</button>
        <p class="hint" style="text-align:center;margin-top:0.8rem;">
            練習模式：可多次作答、可看例句。測驗模式：每題一次機會，思考時間到即公布答案。
        </p>
    </div>

    <!-- 設定 -->
    <div id="setup-section" class="hidden">
        <h2 id="setup-title">設定</h2>
        <label for="name">姓名 (可選):</label>
        <input type="text" id="name" placeholder="輸入你的姓名" autocomplete="off">

        <div class="row">
            <div>
                <label for="start-char">從字首:</label>
                <select id="start-char"></select>
            </div>
            <div>
                <label for="end-char">到字首:</label>
                <select id="end-char"></select>
            </div>
        </div>
        <p class="hint" id="range-info"></p>

        <label for="num-questions">出題數量 (0 為範圍內所有):</label>
        <input type="number" id="num-questions" value="0" min="0" inputmode="numeric">

        <label for="time-limit">測驗時間:</label>
        <select id="time-limit">
            <option value="300">5 分鐘</option>
            <option value="480">8 分鐘</option>
            <option value="600">10 分鐘</option>
            <option value="900">15 分鐘</option>
            <option value="1200">20 分鐘</option>
        </select>

        <label for="thinking-time">思考時間（語音播放完畢後的等待時間）:</label>
        <select id="thinking-time">
            <option value="5">5 秒</option>
            <option value="8" selected>8 秒（預設）</option>
            <option value="10">10 秒</option>
            <option value="15">15 秒</option>
            <option value="custom">自訂</option>
        </select>
        <div id="custom-thinking-time" class="hidden">
            <label for="custom-time-input">自訂思考時間（3–30 秒）:</label>
            <input type="number" id="custom-time-input" value="8" min="3" max="30" inputmode="numeric">
        </div>

        <div class="check-row">
            <input type="checkbox" id="show-meaning" checked>
            <label for="show-meaning">出題時顯示中文字義提示</label>
        </div>
        <p class="hint">關閉提示時，同音字（如 son / sun、meat / meet）都算答對。</p>

        <div class="api-box">
            <div class="check-row" style="margin-top:0;">
                <input type="checkbox" id="enable-ai-api">
                <label for="enable-ai-api">啟用 AI 生成例句與翻譯（Google Gemini）</label>
            </div>
            <div id="api-input-container" class="hidden">
                <div class="api-input-row" style="margin-top:0.4rem;">
                    <input type="password" id="gemini-api-key" placeholder="請輸入 Gemini API Key"
                           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                    <button type="button" id="toggle-key-btn" class="btn-secondary">顯示</button>
                    <button type="button" id="paste-api-button" class="btn-success">貼上</button>
                </div>
                <label for="ai-model">模型名稱:</label>
                <input type="text" id="ai-model" value="gemini-3.5-flash-lite" autocomplete="off"
                       autocapitalize="off" autocorrect="off" spellcheck="false">
                <p class="hint">若 Google 停用此模型，可在 AI Studio 查詢新的模型名稱並填入。</p>
                <p class="hint" id="api-note"></p>
                <p class="hint" id="ai-store-info"></p>
                <button type="button" id="clear-ai-store" class="btn-secondary hidden">清除已存的 AI 例句</button>
                <button type="button" id="logout-button" class="btn-danger hidden">清除已儲存的 API Key</button>
            </div>
            <p class="hint"><a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">如何取得 API Key？</a>（Key 只存在這台裝置，24 小時後自動清除）</p>
        </div>

        <button id="start-quiz">開始</button>
        <button id="back-to-mode" class="btn-secondary">返回</button>
    </div>

    <!-- 作答 -->
    <div id="practice-section" class="hidden">
        <h2 id="mode-title"></h2>
        <div id="timer">時間: 00:00</div>
        <div id="ai-warning" class="notice hidden"></div>

        <div class="voice-controls">
            <div class="ctrl-row">
                <span class="lbl">語速:</span>
                <button type="button" class="sq-btn" id="speed-decrease" aria-label="減慢語速">−</button>
                <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="0.8" aria-label="語速">
                <button type="button" class="sq-btn" id="speed-increase" aria-label="加快語速">+</button>
                <span class="val-display" id="speed-display">0.8x</span>
            </div>
            <div class="ctrl-row">
                <span class="lbl">字體大小:</span>
                <button type="button" class="sq-btn btn-success" id="font-decrease">A−</button>
                <span class="val-display" id="font-size-display">中</span>
                <button type="button" class="sq-btn btn-success" id="font-increase">A+</button>
            </div>
            <div class="voice-buttons">
                <button type="button" id="repeat-word" disabled>🔄 複讀單字</button>
                <button type="button" id="repeat-sentence" disabled>🔄 複讀例句</button>
            </div>
        </div>

        <div id="question-no"></div>
        <div id="meaning-hint"></div>
        <div id="status-line"></div>
        <input type="text" id="answer-input" placeholder="聽完後輸入單字，按 Enter 送出"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <div id="answer-feedback"></div>

        <div id="practice-helpers">
            <button id="show-example" disabled>顯示例句</button>
            <p id="example-sentence" class="example-text hidden"></p>
            <button id="show-translation" disabled>顯示翻譯</button>
            <p id="example-translation" class="example-text hidden"></p>
        </div>

        <div id="answer-panel" class="answer-panel hidden">
            <p>正確答案：<span class="ans-word" id="ans-word"></span>　<span id="ans-meaning"></span></p>
            <p>例句：<span id="ans-example"></span></p>
            <p>翻譯：<span id="ans-translation"></span></p>
        </div>
        <p id="next-question-countdown" class="countdown hidden"></p>
        <button id="next-question-btn" class="hidden">下一題</button>
        <button id="quit-btn" class="btn-secondary" style="margin-top:1rem;">結束並查看成績</button>
    </div>

    <!-- 結果 -->
    <div id="result-section" class="hidden">
        <h2>測驗結果</h2>
        <div id="result-summary"></div>
        <p class="hint" id="result-saved" style="text-align:center;"></p>
        <div class="result-actions">
            <button id="retry-wrong-btn" class="btn-warning">錯題重練</button>
            <button id="restart-btn">重新開始</button>
            <button id="copy-result-btn" class="btn-secondary">複製成績</button>
            <button id="download-csv-btn" class="btn-secondary">下載 CSV</button>
        </div>
        <ul id="word-list-result"></ul>
    </div>

    <!-- 測驗紀錄庫 -->
    <div id="history-section" class="hidden">
        <h2>測驗紀錄庫</h2>
        <div id="history-overview" class="stats-box hidden"></div>
        <div class="history-filters">
            <select id="history-filter-mode" aria-label="篩選模式">
                <option value="all">全部模式</option>
                <option value="practice">練習模式</option>
                <option value="test">測驗模式</option>
            </select>
            <input type="text" id="history-filter-name" placeholder="搜尋姓名" autocomplete="off">
        </div>
        <div class="history-toolbar">
            <button id="history-export-json" class="btn-success">匯出備份 (JSON)</button>
            <button id="history-import-btn">匯入紀錄 (JSON)</button>
            <button id="history-export-csv" class="btn-secondary">匯出明細 (CSV)</button>
            <button id="history-clear" class="btn-danger">清除全部紀錄</button>
        </div>
        <input type="file" id="history-import-file" accept=".json,application/json" class="hidden">
        <p class="hint" id="history-msg" style="text-align:center;min-height:1.2em;"></p>
        <div id="history-list"></div>
        <button id="history-back" class="btn-secondary">返回首頁</button>
    </div>
</div>

<script>
'use strict';

// ===== 單字資料（已去重、修正拼字與字義）=====
const WORDS = [
  {"word": "a", "meaning": "一個", "examples": [{"en": "I need a new pencil for my test.", "zh": "我需要一支新鉛筆寫考試。"}]},
  {"word": "a.m.", "meaning": "上午", "examples": [{"en": "I go to school at seven a.m.", "zh": "我早上七點去學校。"}]},
  {"word": "about", "meaning": "關於", "examples": [{"en": "Tell me about your new school.", "zh": "告訴我關於你的新學校。"}]},
  {"word": "above", "meaning": "在...上方", "examples": [{"en": "The bird flies above the trees.", "zh": "鳥在樹上方飛翔。"}]},
  {"word": "accept", "meaning": "接受", "examples": [{"en": "Accept help from your friends.", "zh": "接受朋友的幫助。"}]},
  {"word": "accident", "meaning": "意外", "examples": [{"en": "Be careful to avoid accidents.", "zh": "小心避免意外。"}]},
  {"word": "achieve", "meaning": "達成", "examples": [{"en": "Work hard to achieve your goals.", "zh": "努力達成你的目標。"}]},
  {"word": "across", "meaning": "橫過", "examples": [{"en": "Walk across the street carefully.", "zh": "小心地過馬路。"}]},
  {"word": "action", "meaning": "行動", "examples": [{"en": "Take action to solve the problem.", "zh": "採取行動解決問題。"}]},
  {"word": "active", "meaning": "活躍的", "examples": [{"en": "My little brother is very active in class.", "zh": "我弟弟在班上很活躍。"}]},
  {"word": "activity", "meaning": "活動", "examples": [{"en": "We have many activities at school.", "zh": "我們學校有很多活動。"}]},
  {"word": "actor", "meaning": "演員", "examples": [{"en": "The actor performs in movies.", "zh": "演員在電影中演出。"}]},
  {"word": "add", "meaning": "加入", "examples": [{"en": "Add more examples to your work.", "zh": "在你的作業中加入更多例子。"}]},
  {"word": "adult", "meaning": "成年人", "examples": [{"en": "My brother will become an adult next month.", "zh": "我哥哥下個月就成年了。"}]},

  {"word": "airport", "meaning": "機場", "examples": [{"en": "We go to the airport by bus.", "zh": "我們搭巴士去機場。"}]},
  {"word": "alarm clock", "meaning": "鬧鐘", "examples": [{"en": "The alarm clock rings at six in the morning.", "zh": "鬧鐘早上六點響。"}]},
  {"word": "all", "meaning": "全部", "examples": [{"en": "All students like our English teacher.", "zh": "所有學生都喜歡我們的英文老師。"}]},

  {"word": "along", "meaning": "沿著", "examples": [{"en": "Walk along this street to school.", "zh": "沿著這條街走去學校。"}]},

    $('paste-api-button').addEventListener('click', pasteAPIKey);

function blockSelectionOutsideInputs() {
    const isField = t => t && t.closest && t.closest('input, textarea, select');
    document.addEventListener('contextmenu', e => { if (!isField(e.target)) e.preventDefault(); });
    document.addEventListener('selectstart', e => { if (!isField(e.target)) e.preventDefault(); });
}

function showSection(id) {
    ['mode-selection', 'setup-section', 'practice-section', 'result-section', 'history-section']
        .forEach(s => $(s).classList.toggle('hidden', s !== id));
}

// ===== 設定儲存 =====
function loadSettings() {
    let s = {};
    try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (e) { s = {}; }
    if (s.name) $('name').value = s.name;
    if (s.startChar) $('start-char').value = s.startChar;
    if (s.endChar) $('end-char').value = s.endChar;
    if (s.numQuestions != null) $('num-questions').value = s.numQuestions;
    if (s.timeLimit) $('time-limit').value = s.timeLimit;
    if (s.thinkingSelect) $('thinking-time').value = s.thinkingSelect;
    if (s.customTime) $('custom-time-input').value = s.customTime;
    if (s.showMeaning != null) $('show-meaning').checked = s.showMeaning;
    if (s.aiModel && !RETIRED_DEFAULTS.includes(s.aiModel)) $('ai-model').value = s.aiModel;
    if (s.speechRate) state.speechRate = clamp(s.speechRate, 0.5, 2);
    if (s.fontLevel != null) state.fontLevel = clamp(s.fontLevel, 0, FONT_SIZES.length - 1);
    $('custom-thinking-time').classList.toggle('hidden', $('thinking-time').value !== 'custom');
    $('speech-rate').value = state.speechRate.toFixed(1);
}

function saveSettings() {
    const s = {
        name: $('name').value.trim(),
        startChar: $('start-char').value,
        endChar: $('end-char').value,
        numQuestions: $('num-questions').value,
        timeLimit: $('time-limit').value,
        thinkingSelect: $('thinking-time').value,
        customTime: $('custom-time-input').value,
        showMeaning: $('show-meaning').checked,
        aiModel: $('ai-model').value.trim(),
        speechRate: state.speechRate,
        fontLevel: state.fontLevel
    };
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) { /* 忽略 */ }
}

function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

function setSpeechRate(v) {
    state.speechRate = Math.round(clamp(v, 0.5, 2) * 10) / 10;
    $('speech-rate').value = state.speechRate.toFixed(1);
    updateSpeedDisplay();
    saveSettings();
}
function updateSpeedDisplay() { $('speed-display').textContent = state.speechRate.toFixed(1) + 'x'; }

function setFontLevel(level) {
    state.fontLevel = clamp(level, 0, FONT_SIZES.length - 1);
    applyFontSize();
    saveSettings();
}
function applyFontSize() {
    document.documentElement.style.fontSize = FONT_SIZES[state.fontLevel] + 'px';
    $('font-size-display').textContent = FONT_NAMES[state.fontLevel];
}

function onThinkingTimeChange() {
    $('custom-thinking-time').classList.toggle('hidden', $('thinking-time').value !== 'custom');
}
function onCustomTimeInput() {
    const el = $('custom-time-input');
    el.value = clamp(parseInt(el.value, 10) || 8, 3, 30);
}
function readThinkingTime() {
    if ($('thinking-time').value === 'custom') {
        onCustomTimeInput();
        return parseInt($('custom-time-input').value, 10);
    }
    return parseInt($('thinking-time').value, 10);
}

function wordsInRange() {
    const a = $('start-char').value, b = $('end-char').value;
    return WORDS.filter(w => {
        const c = w.word.charAt(0).toUpperCase();
        return c >= a && c <= b;
    });
}
function updateRangeInfo() {
    const info = $('range-info');
    if ($('start-char').value > $('end-char').value) {
        info.textContent = '起始字首不能在結束字首之後';
        info.classList.add('warn');
        $('start-quiz').disabled = true;
    } else {
        info.textContent = '範圍內共 ' + wordsInRange().length + ' 個單字';
        info.classList.remove('warn');
        $('start-quiz').disabled = false;
    }
}

// ===== API Key =====
function restoreAPIKey() {
    const key = localStorage.getItem(API_KEY_STORAGE_KEY);
    const ts = parseInt(localStorage.getItem(API_KEY_TIMESTAMP_KEY), 10);
    if (!key) return;
    if (!ts || Date.now() - ts > API_KEY_EXPIRY_MS) {
        localStorage.removeItem(API_KEY_STORAGE_KEY);
        localStorage.removeItem(API_KEY_TIMESTAMP_KEY);
        $('api-note').textContent = '先前儲存的 API Key 已超過 24 小時並已清除，請重新輸入。';
        return;
    }
    $('gemini-api-key').value = key;
    $('enable-ai-api').checked = true;
    $('api-input-container').classList.remove('hidden');
    $('logout-button').classList.remove('hidden');
}

function clearAPIKey() {
    localStorage.removeItem(API_KEY_STORAGE_KEY);
    localStorage.removeItem(API_KEY_TIMESTAMP_KEY);
    $('gemini-api-key').value = '';
    state.apiKey = '';
    $('enable-ai-api').checked = false;
    $('api-input-container').classList.add('hidden');
    $('logout-button').classList.add('hidden');
    $('api-note').textContent = '';
}

function toggleKeyVisibility() {
    const input = $('gemini-api-key');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    $('toggle-key-btn').textContent = show ? '隱藏' : '顯示';
}

async function pasteAPIKey() {
    const btn = $('paste-api-button');
    btn.disabled = true;
    try {
        if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error('unsupported');
        const text = (await navigator.clipboard.readText()).trim();
        if (!text) throw new Error('empty');
        $('gemini-api-key').value = text;
        $('api-note').textContent = /^(AQ\.|AIza)/.test(text) ? '' : '提醒：貼上的內容看起來不像 Gemini API Key（通常以 AQ. 或 AIza 開頭）。';
        btn.textContent = '✓ 已貼上';
    } catch (e) {
        btn.textContent = '請手動貼上';
        $('api-note').textContent = e.message === 'empty'
            ? '剪貼簿是空的，請先複製 API Key。'
            : '瀏覽器不允許讀取剪貼簿，請在輸入框長按或按 Ctrl+V 貼上。';
        $('gemini-api-key').focus();
    }
    setTimeout(() => { btn.textContent = '貼上'; btn.disabled = false; }, 2000);
}

// ===== 語音 =====
function initVoices() {
    if (!('speechSynthesis' in window)) return;
    const pick = () => {
        const voices = speechSynthesis.getVoices();
        state.voice =
            voices.find(v => v.lang === 'en-US' && /google|samantha|microsoft/i.test(v.name)) ||
            voices.find(v => v.lang === 'en-US') ||
            voices.find(v => /^en[-_]/i.test(v.lang)) || null;
    };
    pick();
    speechSynthesis.addEventListener('voiceschanged', pick);
}

function speak(text) {
    return new Promise(resolve => {
        if (!('speechSynthesis' in window) || !text) { resolve(); return; }
        let done = false;
        const finish = () => { if (!done) { done = true; clearTimeout(guard); resolve(); } };
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        if (state.voice) u.voice = state.voice;
        u.rate = state.speechRate;
        u.onend = finish;
        u.onerror = finish;
        // 保險計時：依語速放寬，避免慢速時尚未唸完就繼續
        const guard = setTimeout(finish, 3000 + (text.length * 120) / state.speechRate);
        speechSynthesis.speak(u);
    });
}

function stopSpeech() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
}

// ===== 出題流程 =====
function startMode(mode) {
    state.mode = mode;
    $('setup-title').textContent = mode === 'practice' ? '練習模式設定' : '測驗模式設定';
    $('start-quiz').textContent = mode === 'practice' ? '開始練習' : '開始測驗';
    showSection('setup-section');
    updateRangeInfo();
    updateAIStoreInfo();
}

// silent = true 時（從紀錄庫直接開始）沒有 Key 就不使用 AI，而不是擋下來
function prepareAI(silent) {
    state.useAI = $('enable-ai-api').checked;
    if (!state.useAI) return true;
    const key = $('gemini-api-key').value.trim();
    if (!key) {
        if (silent) { state.useAI = false; return true; }
        $('api-note').textContent = '請輸入 API Key，或取消勾選 AI 功能。';
        $('gemini-api-key').focus();
        return false;
    }
    state.apiKey = key;
    state.aiModel = $('ai-model').value.trim() || DEFAULT_AI_MODEL;
    state.triedModels = new Set();
    localStorage.setItem(API_KEY_STORAGE_KEY, key);
    if (!localStorage.getItem(API_KEY_TIMESTAMP_KEY)) {
        localStorage.setItem(API_KEY_TIMESTAMP_KEY, Date.now().toString());
    }
    $('logout-button').classList.remove('hidden');
    return true;
}

function onStartClicked() {
    if ($('start-char').value > $('end-char').value) return;
    if (!prepareAI(false)) return;

    const pool = wordsInRange();
    if (pool.length === 0) {
        $('range-info').textContent = '這個範圍內沒有單字，請重新選擇';
        return;
    }
    const n = Math.max(0, parseInt($('num-questions').value, 10) || 0);
    const picked = shuffle([...pool]);
    saveSettings();
    const range = $('start-char').value === $('end-char').value
        ? $('start-char').value : $('start-char').value + '–' + $('end-char').value;
    startQuiz(n > 0 ? picked.slice(0, n) : picked, range);
}

function startQuiz(entries, label) {
    state.rangeLabel = label || '';
    state.thinkingTime = readThinkingTime();
    state.showMeaning = $('show-meaning').checked;
    state.aiAvailable = true;
    state.aiCache.clear();
    state.quiz = entries.map(entry => ({
        entry,
        example: entry.examples[Math.floor(Math.random() * entry.examples.length)],
        status: null,
        attempts: 0,
        userAnswer: ''
    }));
    state.idx = 0;
    state.ended = false;
    state.startTime = Date.now();

    $('mode-title').textContent = state.mode === 'practice' ? '練習模式' : '測驗模式';
    $('practice-helpers').classList.toggle('hidden', state.mode === 'test');
    $('ai-warning').classList.add('hidden');
    showSection('practice-section');

    startTimer(parseInt($('time-limit').value, 10));
    loadQuestion();
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startTimer(seconds) {
    clearInterval(state.quizTimer);
    state.deadline = Date.now() + seconds * 1000;
    const tick = () => {
        const left = Math.max(0, Math.round((state.deadline - Date.now()) / 1000));
        $('timer').textContent = '時間: ' + formatTime(left);
        $('timer').classList.toggle('low', left <= 30);
        if (left <= 0) endQuiz();
    };
    tick();
    state.quizTimer = setInterval(tick, 500);
}

function formatTime(sec) {
    return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}

function currentQ() { return state.quiz[state.idx]; }

function clearQuestionTimers() {
    clearTimeout(state.thinkingTimer);
    clearInterval(state.countdownTimer);
    state.thinkingTimer = null;
    state.countdownTimer = null;
    stopSpeech();
}

async function loadQuestion() {
    const seq = ++state.seq;
    clearQuestionTimers();
    if (state.ended) return;
    if (state.idx >= state.quiz.length) { endQuiz(); return; }

    const q = currentQ();
    resetUI(q);

    if (state.useAI) {
        $('status-line').textContent = state.aiAvailable ? 'AI 例句產生中…' : '';
        const ai = await getAIExample(q.entry.word);
        if (!isAlive(seq)) return;
        $('status-line').textContent = '';
        if (ai) q.example = ai;
        prefetchNextAI();
    }

    playAudioSequence(seq);
}

function resetUI(q) {
    state.locked = false;
    $('question-no').textContent = '第 ' + (state.idx + 1) + ' / ' + state.quiz.length + ' 題';
    $('meaning-hint').textContent = state.showMeaning ? '中文提示：' + q.entry.meaning : '';
    $('status-line').textContent = '';

    const input = $('answer-input');
    input.value = '';
    input.disabled = false;
    try { input.focus(); } catch (e) { /* 忽略 */ }

    const fb = $('answer-feedback');
    fb.textContent = '';
    fb.className = '';

    ['show-example', 'show-translation', 'repeat-word', 'repeat-sentence'].forEach(id => { $(id).disabled = true; });
    ['example-sentence', 'example-translation', 'answer-panel', 'next-question-countdown', 'next-question-btn']
        .forEach(id => $(id).classList.add('hidden'));
    $('example-sentence').textContent = '';
    $('example-translation').textContent = '';
}

async function playAudioSequence(seq) {
    const q = currentQ();
    await speak(q.entry.word);
    if (!isAlive(seq)) return;
    await sleep(1000);
    if (!isAlive(seq)) return;
    await speak(q.example.en);
    if (!isAlive(seq)) return;
    await sleep(1000);
    if (!isAlive(seq)) return;
    await speak(q.entry.word);
    if (!isAlive(seq)) return;

    $('repeat-word').disabled = false;
    $('repeat-sentence').disabled = false;
    state.thinkingTimer = setTimeout(() => {
        if (isAlive(seq)) onThinkingDone();
    }, state.thinkingTime * 1000);
}

function onThinkingDone() {
    const q = currentQ();
    if (!q || q.status === STATUS.CORRECT) return;

    $('show-example').disabled = false;
    $('show-translation').disabled = false;

    if (state.mode === 'practice') {
        showNextButton('跳過此題', q.attempts > 0 ? 'btn-danger' : 'btn-warning');
    } else {
        // 測驗模式：以輸入框目前內容判定，鎖定作答後公布答案
        const input = $('answer-input');
        gradeTestAnswer(q, input.value);
        state.locked = true;
        input.disabled = true;
        showFeedback(q);
        showAnswerPanel(q);
        showNextButton('立即下一題', 'btn-success');
        startNextCountdown();
    }
}

function handleAnswer() {
    if (state.ended) return;
    const q = currentQ();
    if (!q) return;
    const input = $('answer-input');
    const value = input.value;

    if (state.mode === 'practice') {
        if (q.status === STATUS.CORRECT) { goToNextQuestion(); return; }
        if (!value.trim()) return;

        q.userAnswer = value.trim();
        const result = checkAnswer(value, q.entry.word);
        if (result) {
            state.seq++;                 // 中止語音流程與思考計時
            clearQuestionTimers();
            q.status = STATUS.CORRECT;
            q.attempts++;
            setFeedback(result === 'homophone'
                ? '✓ 答對了！（同音字，本題單字是 ' + q.entry.word + '）'
                : '✓ 答對了！很棒！', 'ok');
            ['show-example', 'show-translation', 'repeat-word', 'repeat-sentence'].forEach(id => { $(id).disabled = false; });
            showAnswerPanel(q);
            showNextButton('立即下一題', 'btn-success');
            startNextCountdown();
        } else {
            q.attempts++;
            setFeedback('✗ 答案不正確，請再試一次（第 ' + q.attempts + ' 次）', 'bad');
            showNextButton('跳過此題', 'btn-danger');
            input.select();
        }
    } else {
        if (state.locked) return;
        gradeTestAnswer(q, value);
        goToNextQuestion();
    }
}

function gradeTestAnswer(q, value) {
    const v = value.trim();
    q.userAnswer = v;
    q.attempts = v ? 1 : 0;
    if (!v) q.status = STATUS.SKIPPED;
    else q.status = checkAnswer(v, q.entry.word) ? STATUS.CORRECT : STATUS.INCORRECT;
}

function showFeedback(q) {
    if (q.status === STATUS.CORRECT) setFeedback('✓ 答對了！', 'ok');
    else if (q.status === STATUS.INCORRECT) setFeedback('✗ 答錯了（你的答案：' + q.userAnswer + '）', 'bad');
    else setFeedback('時間到，未作答', 'info');
}

function setFeedback(text, kind) {
    const fb = $('answer-feedback');
    fb.textContent = text;
    fb.className = 'feedback ' + kind;
}

function showAnswerPanel(q) {
    $('ans-word').textContent = q.entry.word;
    $('ans-meaning').textContent = q.entry.meaning;
    $('ans-example').textContent = q.example.en;
    $('ans-translation').textContent = q.example.zh;
    $('answer-panel').classList.remove('hidden');
}

function showNextButton(text, cls) {
    const btn = $('next-question-btn');
    btn.textContent = text;
    btn.className = cls;
    btn.disabled = false;
}

function startNextCountdown() {
    clearInterval(state.countdownTimer);
    let n = NEXT_COUNTDOWN_SEC;
    const el = $('next-question-countdown');
    el.textContent = n + ' 秒後自動進入下一題';
    el.classList.remove('hidden');
    state.countdownTimer = setInterval(() => {
        n--;
        if (n > 0) {
            el.textContent = n + ' 秒後自動進入下一題';
        } else {
            clearInterval(state.countdownTimer);
            state.countdownTimer = null;
            goToNextQuestion();
        }
    }, 1000);
}

function goToNextQuestion() {
    if (state.ended) return;
    const q = currentQ();
    if (q && q.status === null) {
        if (state.mode === 'practice') {
            q.status = q.attempts > 0 ? STATUS.INCORRECT : STATUS.SKIPPED;
        } else {
            gradeTestAnswer(q, $('answer-input').value);
        }
    }
    state.idx++;
    loadQuestion();
}

// ===== 答案比對 =====
function normalize(s) {
    return s.toLowerCase()
        .replace(/[’‘`]/g, "'")
        .replace(/[.'"!?,]/g, '')
        .replace(/[-\s]+/g, ' ')
        .trim();
}

// 回傳 'exact' / 'homophone' / false
function checkAnswer(input, answer) {
    const a = normalize(input), b = normalize(answer);
    if (!a) return false;
    if (a === b) return 'exact';
    const aliases = ALIASES[answer.toLowerCase()];
    if (aliases && aliases.some(x => normalize(x) === a)) return 'exact';
    if (!state.showMeaning && HOMOPHONE_GROUPS.some(g => g.includes(a) && g.includes(b))) return 'homophone';
    return false;
}

function maskWord(sentence, word) {
    const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return sentence.replace(new RegExp('\\b' + escaped + '[a-z]*', 'gi'), m => '_'.repeat(Math.max(3, m.length)));
}

// ===== AI 例句 =====
// 已產生的 AI 例句存在這台裝置；每個字累積 AI_STORE_PER_WORD 句後就不再呼叫 API，以節省額度
const AI_STORE_KEY = 'vk_ai_examples_v1';
const AI_STORE_PER_WORD = 3;

function loadAIStore() {
    try { return JSON.parse(localStorage.getItem(AI_STORE_KEY)) || {}; } catch (e) { return {}; }
}
function addToAIStore(word, ex) {
    const store = loadAIStore();
    const arr = store[word] || [];
    if (!arr.some(x => x.en === ex.en)) {
        arr.push(ex);
        if (arr.length > AI_STORE_PER_WORD) arr.shift();
    }
    store[word] = arr;
    try { localStorage.setItem(AI_STORE_KEY, JSON.stringify(store)); } catch (e) { /* 空間不足時略過 */ }
}
function updateAIStoreInfo() {
    const n = Object.keys(loadAIStore()).length;
    $('ai-store-info').textContent = n
        ? '已在這台裝置存了 ' + n + ' 個單字的 AI 例句。同一個字存滿 ' + AI_STORE_PER_WORD + ' 句後就直接使用，不再呼叫 API。'
        : '';
    $('clear-ai-store').classList.toggle('hidden', n === 0);
}
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function getAIExample(word) {
    if (!state.aiCache.has(word)) {
        const stored = loadAIStore()[word] || [];
        let p;
        if (stored.length >= AI_STORE_PER_WORD || !state.aiAvailable) {
            p = Promise.resolve(stored.length ? pickRandom(stored) : null);
        } else {
            p = fetchAIExample(word).then(ex => {
                if (ex) { addToAIStore(word, ex); return ex; }
                return stored.length ? pickRandom(stored) : null;
            });
        }
        state.aiCache.set(word, p);
    }
    return state.aiCache.get(word);
}

function prefetchNextAI() {
    const next = state.quiz[state.idx + 1];
    if (next && state.useAI && state.aiAvailable) getAIExample(next.entry.word);
}

async function fetchAIExample(word) {
    if (!state.apiKey || !state.aiAvailable) return null;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    const generationConfig = {
        responseMimeType: 'application/json',
        responseSchema: {
            type: 'OBJECT',
            properties: { example: { type: 'STRING' }, translation: { type: 'STRING' } },
            required: ['example', 'translation']
        }
    };
    // 2.5 Flash 系列關閉思考以加快速度
    if (/2\.5-flash/.test(state.aiModel)) generationConfig.thinkingConfig = { thinkingBudget: 0 };

    try {
        const res = await fetch(
            'https://generativelanguage.googleapis.com/v1beta/models/' +
                encodeURIComponent(state.aiModel) + ':generateContent',
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': state.apiKey },
                body: JSON.stringify({
                    contents: [{ parts: [{ text:
                        '請為台灣國中生程度的英文單字「' + word + '」寫一個簡單的英文例句（12 個字以內，' +
                        '句中必須包含這個單字），並提供自然的繁體中文翻譯。' }] }],
                    generationConfig
                }),
                signal: controller.signal
            });
        if (!res.ok) {
            if (res.status === 404) {
                // 模型不存在或帳號無權使用：自動改用下一個備用模型
                state.triedModels.add(state.aiModel);
                const next = FALLBACK_MODELS.find(m => !state.triedModels.has(m));
                if (next) {
                    console.warn('模型「' + state.aiModel + '」無法使用，改用 ' + next);
                    state.aiModel = next;
                    $('ai-model').value = next;
                    saveSettings();
                    return fetchAIExample(word);
                }
            }
            if (res.status === 429) {
                disableAI('已達 Gemini 用量上限（HTTP 429）。Workspace／教育版帳號通常沒有免費額度，' +
                    '可改用個人 Gmail 帳號建立的 Key');
                return null;
            }
            if ([400, 401, 403, 404].includes(res.status)) {
                disableAI(res.status === 404
                    ? '找不到模型「' + state.aiModel + '」'
                    : 'API Key 無效或沒有權限（HTTP ' + res.status + '）');
            }
            return null;
        }
        const data = await res.json();
        const text = data && data.candidates && data.candidates[0] &&
            data.candidates[0].content && data.candidates[0].content.parts &&
            data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
        if (!text) return null;
        const obj = JSON.parse(text);
        const en = String(obj.example || '').trim();
        const zh = String(obj.translation || '').trim();
        if (!en || !zh) return null;
        // 例句必須包含單字（取前幾個字母判斷，容許時態變化）
        const stem = word.toLowerCase().split(' ')[0].slice(0, Math.min(4, word.length));
        if (!en.toLowerCase().includes(stem)) return null;
        return { en, zh };
    } catch (e) {
        console.warn('AI 例句產生失敗:', e && e.message);
        return null;
    } finally {
        clearTimeout(timeout);
    }
}

function disableAI(reason) {
    if (!state.aiAvailable) return;
    state.aiAvailable = false;
    const w = $('ai-warning');
    w.textContent = '⚠️ AI 例句無法使用：' + reason + '。本次改用內建例句。';
    w.classList.remove('hidden');
}

// ===== 結束與成績 =====
function endQuiz() {
    if (state.ended) return;
    state.ended = true;
    state.seq++;
    clearQuestionTimers();
    clearInterval(state.quizTimer);
    showSection('result-section');
    renderResults();
    const hasAnswers = answered().length > 0;
    const rec = hasAnswers ? saveCurrentRecord() : null;
    $('result-saved').textContent = rec
        ? '✓ 已自動存入測驗紀錄庫'
        : hasAnswers ? '⚠️ 紀錄儲存失敗（瀏覽器儲存空間不足），請先到紀錄庫匯出備份並刪除舊紀錄' : '';
}

function answered() { return state.quiz.filter(q => q.status !== null); }

function getStats() {
    const list = answered();
    const s = { total: list.length, correct: 0, incorrect: 0, skipped: 0, rate: 0 };
    list.forEach(q => { s[q.status]++; });
    if (s.total) s.rate = Math.round(s.correct / s.total * 100);
    return s;
}

function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'class') node.className = v;
        else if (k === 'style') node.style.cssText = v;
        else node.setAttribute(k, v);
    });
    (children || []).forEach(c => node.append(c));
    return node;
}

function renderResults() {
    const s = getStats();
    const name = $('name').value.trim() || '匿名使用者';
    const seconds = Math.round((Date.now() - state.startTime) / 1000);
    const rateColor = s.rate >= 80 ? 'green' : s.rate >= 60 ? 'orange' : 'red';
    const line = (label, value, style) => {
        const span = el('span', style ? { style } : null, [value]);
        return el('p', null, [el('strong', null, [label + ': ']), span]);
    };

    const summary = $('result-summary');
    summary.replaceChildren(
        el('h3', null, ['測驗摘要']),
        line('姓名', name),
        line('日期', new Date().toLocaleDateString('zh-TW')),
        line('模式', state.mode === 'practice' ? '練習模式' : '測驗模式'),
        line('總花費時間', formatTime(seconds)),
        el('div', { class: 'stats-box' }, [
            el('h4', null, ['答題統計']),
            line('作答題數', s.total + ' / ' + state.quiz.length),
            line('答對', s.correct + ' 題', 'color:green'),
            line('答錯', s.incorrect + ' 題', 'color:red'),
            line('跳過', s.skipped + ' 題', 'color:orange'),
            el('p', null, [el('strong', null, ['正確率: ']),
                el('span', { class: 'rate', style: 'color:' + rateColor }, [s.rate + '%'])])
        ])
    );

    $('retry-wrong-btn').disabled = !answered().some(q => q.status !== STATUS.CORRECT);

    const list = $('word-list-result');
    list.replaceChildren(el('h4', null, ['詳細答題記錄（依出題順序）']), ...buildItemNodes(answered().map(itemFromQ)));
}

function itemFromQ(q) {
    return {
        word: q.entry.word, meaning: q.entry.meaning, status: q.status, attempts: q.attempts,
        userAnswer: q.userAnswer, en: q.example.en, zh: q.example.zh
    };
}

function buildItemNodes(items) {
    return items.map((it, i) => {
        const status = STATUS_TEXT[it.status] ? it.status : STATUS.SKIPPED;
        const header = el('div', { class: 'word-item-header' }, [
            '第' + (i + 1) + '題 ' + STATUS_SYMBOL[status] + ' ',
            el('span', { class: 'w' }, [String(it.word)]),
            ' ',
            el('span', { class: 's' }, ['(' + STATUS_TEXT[status] +
                (status === STATUS.INCORRECT && it.userAnswer ? '，你寫：' + it.userAnswer : '') + ')'])
        ]);
        return el('li', { class: 'word-item ' + status }, [
            header,
            el('div', { class: 'word-item-line' }, ['字義：' + (it.meaning || '')]),
            el('div', { class: 'word-item-line' }, ['例句：' + (it.en || '')]),
            el('div', { class: 'word-item-line tr' }, ['翻譯：' + (it.zh || '')])
        ]);
    });
}

function retryWrong() {
    const entries = answered().filter(q => q.status !== STATUS.CORRECT).map(q => q.entry);
    if (entries.length === 0) return;
    startQuiz(shuffle(entries), '錯題重練');
}

// ===== 測驗紀錄庫 =====
const HISTORY_KEY = 'vk_history_v1';
const HISTORY_MAX = 300;

function loadHistory() {
    try {
        const arr = JSON.parse(localStorage.getItem(HISTORY_KEY));
        return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
}

function saveHistory(list) {
    list.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}

function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function saveCurrentRecord() {
    const s = getStats();
    const rec = {
        id: makeId(),
        date: new Date().toISOString(),
        name: $('name').value.trim() || '匿名使用者',
        mode: state.mode,
        range: state.rangeLabel || '',
        durationSec: Math.round((Date.now() - state.startTime) / 1000),
        planned: state.quiz.length,
        total: s.total, correct: s.correct, incorrect: s.incorrect, skipped: s.skipped, rate: s.rate,
        items: answered().map(itemFromQ)
    };
    const list = loadHistory();
    list.unshift(rec);
    return saveHistory(list) ? rec : null;
}

function openHistory() {
    $('history-msg').textContent = '';
    showSection('history-section');
    renderHistory();
}

function filteredHistory() {
    const mode = $('history-filter-mode').value;
    const kw = $('history-filter-name').value.trim().toLowerCase();
    return loadHistory().filter(r =>
        (mode === 'all' || r.mode === mode) && (!kw || String(r.name).toLowerCase().includes(kw)));
}

function renderHistory() {
    const total = loadHistory().length;
    const list = filteredHistory();
    renderOverview(list, total);
    const box = $('history-list');
    if (!list.length) {
        box.replaceChildren(el('p', { class: 'hint', style: 'text-align:center' },
            [total ? '沒有符合條件的紀錄。' : '目前還沒有紀錄。完成一次練習或測驗後會自動儲存在這裡。']));
        return;
    }
    box.replaceChildren(...list.map(recordCard));
}

function rateColor(rate) { return rate >= 80 ? 'green' : rate >= 60 ? 'orange' : 'red'; }

function renderOverview(list, total) {
    const box = $('history-overview');
    if (!list.length) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    const avg = Math.round(list.reduce((a, r) => a + (Number(r.rate) || 0), 0) / list.length);
    const answeredCount = list.reduce((a, r) => a + (Number(r.total) || 0), 0);
    const missed = topMissed(list, 12);
    const nodes = [
        el('h4', null, ['統計總覽']),
        el('p', null, ['紀錄 ' + list.length + ' 筆' + (list.length !== total ? '（全部 ' + total + ' 筆）' : '') +
            '｜累計作答 ' + answeredCount + ' 題｜平均正確率 ',
            el('span', { style: 'font-weight:bold;color:' + rateColor(avg) }, [avg + '%'])])
    ];
    if (missed.length) {
        nodes.push(el('p', null, [el('strong', null, ['最常錯的單字'])]));
        nodes.push(el('div', { class: 'chips' }, missed.map(m => el('span', { class: 'chip' }, [m.word + ' ×' + m.count]))));
        const btn = el('button', { class: 'btn-warning' }, ['練習這些常錯單字']);
        btn.addEventListener('click', () => startFromWords(missed.map(m => m.word), 'practice', '常錯單字'));
        nodes.push(btn);
    }
    box.replaceChildren(...nodes);
}

function topMissed(list, n) {
    const count = new Map();
    list.forEach(r => (r.items || []).forEach(it => {
        if (it.status !== STATUS.CORRECT) count.set(it.word, (count.get(it.word) || 0) + 1);
    }));
    return [...count.entries()]
        .map(([word, c]) => ({ word, count: c }))
        .sort((a, b) => b.count - a.count || String(a.word).localeCompare(String(b.word)))
        .slice(0, n);
}

function fmtDateTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return d.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false });
}

function recordCard(r) {
    const items = Array.isArray(r.items) ? r.items : [];
    const wrongWords = items.filter(i => i.status !== STATUS.CORRECT).map(i => i.word);

    const detail = el('ul', { class: 'rec-detail hidden' });
    const viewBtn = el('button', null, ['查看明細']);
    viewBtn.addEventListener('click', () => {
        if (!detail.childElementCount) detail.append(...buildItemNodes(items));
        detail.classList.toggle('hidden');
        viewBtn.textContent = detail.classList.contains('hidden') ? '查看明細' : '收合';
    });

    const retryBtn = el('button', { class: 'btn-warning' }, ['錯題重練']);
    retryBtn.disabled = wrongWords.length === 0;
    retryBtn.addEventListener('click', () => startFromWords(wrongWords, r.mode, '紀錄錯題重練'));

    const delBtn = el('button', { class: 'btn-danger' }, ['刪除']);
    confirmTwice(delBtn, '確定刪除？', () => {
        saveHistory(loadHistory().filter(x => x.id !== r.id));
        renderHistory();
        flashMsg('已刪除 1 筆紀錄');
    });

    return el('div', { class: 'rec-card ' + (r.mode === 'test' ? 'test' : 'practice') }, [
        el('div', { class: 'rec-head' }, [
            el('strong', null, [fmtDateTime(r.date) + '　' + (r.name || '匿名使用者')]),
            el('span', { class: 'rate', style: 'font-size:1rem;color:' + rateColor(Number(r.rate) || 0) }, [(Number(r.rate) || 0) + '%'])
        ]),
        el('div', { class: 'rec-meta' }, [
            (r.mode === 'test' ? '測驗模式' : '練習模式') +
            (r.range ? '｜' + r.range : '') +
            '｜答對 ' + (r.correct || 0) + '・答錯 ' + (r.incorrect || 0) + '・跳過 ' + (r.skipped || 0) +
            '｜用時 ' + formatTime(Number(r.durationSec) || 0)
        ]),
        el('div', { class: 'rec-actions' }, [viewBtn, retryBtn, delBtn]),
        detail
    ]);
}

// 需要連按兩次才執行（避免誤刪；不使用 confirm() 以免被瀏覽器封鎖）
function confirmTwice(btn, confirmText, action) {
    const original = btn.textContent;
    let armed = false, timer = null;
    btn.addEventListener('click', () => {
        if (armed) {
            clearTimeout(timer);
            armed = false;
            btn.textContent = original;
            action();
            return;
        }
        armed = true;
        btn.textContent = confirmText;
        timer = setTimeout(() => { armed = false; btn.textContent = original; }, 3000);
    });
}

function flashMsg(text) {
    $('history-msg').textContent = text;
    clearTimeout(flashMsg.timer);
    flashMsg.timer = setTimeout(() => { $('history-msg').textContent = ''; }, 5000);
}

function startFromWords(words, mode, label) {
    const seen = new Set();
    const entries = [];
    words.forEach(w => {
        const key = String(w);
        const entry = WORDS.find(e => e.word === key) || WORDS.find(e => e.word.toLowerCase() === key.toLowerCase());
        if (entry && !seen.has(entry.word)) { seen.add(entry.word); entries.push(entry); }
    });
    if (!entries.length) { flashMsg('題庫中找不到這些單字'); return; }
    state.mode = mode === 'test' ? 'test' : 'practice';
    prepareAI(true);
    startQuiz(shuffle(entries), label);
}

function todayStr() { return new Date().toISOString().slice(0, 10); }

function downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const a = el('a', { href: URL.createObjectURL(blob), download: filename });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exportHistoryJSON() {
    const list = loadHistory();
    if (!list.length) { flashMsg('目前沒有紀錄可以匯出'); return; }
    const data = { app: 'vocabularyking', version: 1, exportedAt: new Date().toISOString(), records: list };
    downloadFile(JSON.stringify(data, null, 2), '單字王紀錄備份_' + todayStr() + '.json', 'application/json');
    flashMsg('已匯出全部 ' + list.length + ' 筆紀錄');
}

function exportHistoryCSV() {
    const list = filteredHistory();
    if (!list.length) { flashMsg('目前沒有紀錄可以匯出'); return; }
    const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['日期', '姓名', '模式', '範圍', '正確率', '題號', '單字', '字義', '結果', '嘗試次數', '你的答案']];
    list.forEach(r => (r.items || []).forEach((it, i) => rows.push([
        fmtDateTime(r.date), r.name, r.mode === 'test' ? '測驗' : '練習', r.range || '', (r.rate || 0) + '%',
        i + 1, it.word, it.meaning, STATUS_TEXT[it.status] || '', it.attempts, it.userAnswer
    ])));
    downloadFile('\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n'),
        '單字王紀錄明細_' + todayStr() + '.csv', 'text/csv;charset=utf-8');
    flashMsg('已匯出 ' + list.length + ' 筆紀錄的明細（依目前篩選條件）');
}

function sanitizeRecord(r) {
    if (!r || typeof r !== 'object' || !Array.isArray(r.items) || isNaN(Date.parse(r.date))) return null;
    const num = v => Math.max(0, Math.round(Number(v) || 0));
    const items = r.items.filter(it => it && typeof it.word === 'string').map(it => ({
        word: it.word,
        meaning: String(it.meaning || ''),
        status: STATUS_TEXT[it.status] ? it.status : STATUS.SKIPPED,
        attempts: num(it.attempts),
        userAnswer: String(it.userAnswer || ''),
        en: String(it.en || ''),
        zh: String(it.zh || '')
    }));
    const correct = items.filter(i => i.status === STATUS.CORRECT).length;
    const incorrect = items.filter(i => i.status === STATUS.INCORRECT).length;
    return {
        id: typeof r.id === 'string' && r.id ? r.id : makeId(),
        date: new Date(r.date).toISOString(),
        name: String(r.name || '匿名使用者').slice(0, 50),
        mode: r.mode === 'test' ? 'test' : 'practice',
        range: String(r.range || ''),
        durationSec: num(r.durationSec),
        planned: num(r.planned) || items.length,
        total: items.length,
        correct,
        incorrect,
        skipped: items.length - correct - incorrect,
        rate: items.length ? Math.round(correct / items.length * 100) : 0,
        items
    };
}

async function importHistory(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
        const data = JSON.parse(await file.text());
        const incoming = Array.isArray(data) ? data : data && data.records;
        if (!Array.isArray(incoming)) throw new Error('format');
        const list = loadHistory();
        const ids = new Set(list.map(r => r.id));
        let added = 0, dup = 0, bad = 0;
        incoming.forEach(raw => {
            const r = sanitizeRecord(raw);
            if (!r) { bad++; return; }
            if (ids.has(r.id)) { dup++; return; }
            ids.add(r.id);
            list.push(r);
            added++;
        });
        if (!saveHistory(list)) { flashMsg('匯入失敗：瀏覽器儲存空間不足'); return; }
        renderHistory();
        flashMsg('匯入 ' + added + ' 筆' + (dup ? '，略過重複 ' + dup + ' 筆' : '') + (bad ? '，無法辨識 ' + bad + ' 筆' : ''));
    } catch (err) {
        flashMsg('匯入失敗：檔案不是單字王的紀錄備份 (JSON)');
    }
}

function resultText() {
    const s = getStats();
    const lines = [
        '單字王練習成績',
        '姓名：' + ($('name').value.trim() || '匿名使用者'),
        '日期：' + new Date().toLocaleDateString('zh-TW'),
        '模式：' + (state.mode === 'practice' ? '練習模式' : '測驗模式'),
        '作答 ' + s.total + ' 題｜答對 ' + s.correct + '｜答錯 ' + s.incorrect + '｜跳過 ' + s.skipped + '｜正確率 ' + s.rate + '%'
    ];
    const wrong = answered().filter(q => q.status !== STATUS.CORRECT);
    if (wrong.length) lines.push('需加強：' + wrong.map(q => q.entry.word).join(', '));
    return lines.join('\n');
}

async function copyResult() {
    const btn = $('copy-result-btn');
    const text = resultText();
    let ok = false;
    try {
        await navigator.clipboard.writeText(text);
        ok = true;
    } catch (e) {
        const ta = el('textarea', { style: 'position:fixed;opacity:0;' });
        ta.value = text;
        document.body.append(ta);
        ta.select();
        try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
        ta.remove();
    }
    btn.textContent = ok ? '✓ 已複製' : '複製失敗';
    setTimeout(() => { btn.textContent = '複製成績'; }, 2000);
}

function downloadCSV() {
    const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [['題號', '單字', '字義', '結果', '嘗試次數', '你的答案']];
    answered().forEach((q, i) => rows.push([i + 1, q.entry.word, q.entry.meaning, STATUS_TEXT[q.status], q.attempts, q.userAnswer]));
    const csv = '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const name = ($('name').value.trim() || '成績').replace(/[\\/:*?"<>|]/g, '_');
    const a = el('a', { href: URL.createObjectURL(blob), download: '單字王_' + name + '_' + new Date().toISOString().slice(0, 10) + '.csv' });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
