<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直流電動機 3D 互動模擬</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #E6E6E6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #4CAF50;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 16px; color: #333; }
        #info-toggle { cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        #info-content { margin-top: 8px; }
        p { margin: 0; font-size: 12px; color: #555; line-height: 1.4; }
        
        #ui-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            border: 1px solid #ddd;
            width: 95%;
            max-width: 1000px;
            z-index: 10;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .control-group:hover {
            background: #f0f0f0;
        }
        .control-group input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        .btn-action {
            background: #e2e3e5; 
            border: 1px solid #d6d8db; 
            font-weight: bold; 
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .btn-action:hover { background: #d2d3d5; }
        .divider { width: 2px; height: 16px; background: #ccc; margin: 0 4px; }
    </style>
    <!-- 引入 Three.js 核心與 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info-panel">
        <h1 id="info-toggle">直流馬達 (DC Motor) 教學模擬 <span id="info-icon">▼</span></h1>
        <div id="info-content" style="display: none;">
            <p>✅ 獨立翻轉磁鐵：測試 N-N 或 S-S 磁場抵消現象<br>
               ✅ <b>教科書級磁場：完美的 3x3 陣列平行直線與平滑排斥曲線</b><br>
               ✅ 視覺聚焦：去除多餘重疊干擾，確保同極磁力線絕不接觸<br>
               ✅ 開掌定則：F(紅)與B(綠)的 3D 傾斜與動態縮放<br>
               💡 <i>切換為 N-N，觀察中央平行的磁力線如何完美向外彎曲排開！</i></p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <!-- 實驗控制區 -->
        <label class="control-group" style="background: #fff3cd; border: 1px solid #ffe69c;">
            ⚡ 電壓:
            <input type="range" id="slider-voltage" min="0" max="2" step="0.1" value="1" style="width: 50px; margin: 0 4px;">
            <span id="voltage-val" style="display:inline-block; width: 20px; text-align: right;">1.0</span>V
        </label>
        <button id="btn-reverse" class="btn-action">🔄 反轉電池</button>
        <div class="divider"></div>
        <button id="btn-rev-left" class="btn-action" style="color: #ff0000;">🔄 左磁鐵 (N)</button>
        <button id="btn-rev-right" class="btn-action" style="color: #0000ff;">🔄 右磁鐵 (S)</button>
        <div class="divider"></div>

        <!-- 顯示切換區 -->
        <label class="control-group" style="color: #0000bb;">
            <input type="checkbox" id="chk-magnets" checked> 顯示磁鐵
        </label>
        <label class="control-group" style="color: #654321;">
            <input type="checkbox" id="chk-armature" checked> 顯示電樞
        </label>
        <label class="control-group" style="color: #22bb22;">
            <input type="checkbox" id="chk-bfield-magnet"> 場磁力線
        </label>
        <label class="control-group" style="color: #8a2be2;">
            <input type="checkbox" id="chk-bfield-coil-lines"> 電樞磁力線
        </label>
        <label class="control-group" style="color: #0088aa; background: #e8f4f8; border: 1px solid #0088aa;">
            <input type="checkbox" id="chk-bfield-dynamic"> <b>磁場互動曲線</b>
        </label>
        <label class="control-group" style="color: #b8860b;">
            <input type="checkbox" id="chk-current"> 電流
        </label>
        <label class="control-group" style="color: #cc0000;">
            <input type="checkbox" id="chk-rhr"> 開掌定則
        </label>
        <label class="control-group" style="color: #333333; background: #e0e0e0;">
            <input type="checkbox" id="chk-run"> 運轉
        </label>
        <button id="btn-step-back" class="btn-action" style="font-size:14px;">◀ 15°</button>
        <button id="btn-step-fwd"  class="btn-action" style="font-size:14px;">15° ▶</button>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let armatureGroup; 
        let armatureMeshGroup; 
        let magnetGroup, leftMagnet, rightMagnet;
        let batteryGroup; 
        
        // 物理與互動狀態
        let voltageMultiplier = 1.0;
        let batteryReversed = false;
        let leftMagRev = false;  // false: N朝內(1), true: S朝內(-1)
        let rightMagRev = false; // false: S朝內(-1), true: N朝內(1)
        
        // 電流特效
        let currentGroup, redWireCurrentGroup, blueWireCurrentGroup;
        let floatingArrowLeft, floatingArrowRight;
        const armatureParticles = [];
        const redParticles = [];
        const blueParticles = [];
        
        // 磁場與物理向量
        let rhrGroup, leftF, leftB, rightF, rightB;
        let magnetBFieldGroup, coilBFieldGroup, coilLinesGroup;

        // 動態磁場互動曲線
        let dynamicCurvesGroup;
        let curveGeometries = [];
        const CURVE_POINTS = 40; // 原版80，降低以節省效能
        
        // 全新教科書磁力線陣列 (固定 18 條幾何線段，N-S 時隱藏一半，只顯示 9 條)
        let staticCurveGeometries = [];
        const magnetBParticles = []; 
        const STATIC_CURVE_POINTS = 50;

        // 動畫狀態
        let isRunning = false;
        let armatureAngle = Math.PI; // 初始 180°，電樞平面垂直
        const motorSpeed = 0.02;
        const currentSpeed = 0.005;

        let armaturePathData, redWirePathData, blueWirePathData;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#E6E6E6');

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 12, 24);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0, 1);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 8);
            scene.add(dirLight);

            initPaths();
            buildMagnets(); 
            buildArmature(); 
            buildBrushes();  
            buildBatteryAndWires(); 
            buildCurrentEffects(); 
            buildRHR(); 
            buildMagneticFields(); 
            buildDynamicCurves();

            // 初始顯示狀態：只顯示磁鐵與電樞，其餘預設關閉
            magnetBFieldGroup.visible = false;
            currentGroup.visible = false;
            redWireCurrentGroup.visible = false;
            blueWireCurrentGroup.visible = false;
            rhrGroup.visible = false;

            // 初始電樞角度（水平）
            armatureGroup.rotation.z = armatureAngle;

            // UI 互動事件綁定
            document.getElementById('slider-voltage').addEventListener('input', (e) => {
                voltageMultiplier = parseFloat(e.target.value);
                document.getElementById('voltage-val').innerText = voltageMultiplier.toFixed(1);
            });

            document.getElementById('btn-reverse').addEventListener('click', () => {
                batteryReversed = !batteryReversed;
                if(batteryGroup) batteryGroup.rotation.y = batteryReversed ? Math.PI : 0;
            });

            document.getElementById('btn-rev-left').addEventListener('click', (e) => {
                leftMagRev = !leftMagRev;
                if(leftMagnet) leftMagnet.rotation.y = leftMagRev ? Math.PI : 0;
                e.target.innerText = leftMagRev ? '🔄 左磁鐵 (S)' : '🔄 左磁鐵 (N)';
                e.target.style.color = leftMagRev ? '#0000ff' : '#ff0000';
            });

            document.getElementById('btn-rev-right').addEventListener('click', (e) => {
                rightMagRev = !rightMagRev;
                if(rightMagnet) rightMagnet.rotation.y = rightMagRev ? Math.PI : 0;
                e.target.innerText = rightMagRev ? '🔄 右磁鐵 (N)' : '🔄 右磁鐵 (S)';
                e.target.style.color = rightMagRev ? '#ff0000' : '#0000ff';
            });

            document.getElementById('chk-current').addEventListener('change', (e) => {
                currentGroup.visible = e.target.checked;
                redWireCurrentGroup.visible = e.target.checked;
                blueWireCurrentGroup.visible = e.target.checked;
            });
            document.getElementById('chk-magnets').addEventListener('change', (e) => magnetGroup.visible = e.target.checked);
            document.getElementById('chk-armature').addEventListener('change', (e) => {
                if (armatureMeshGroup) armatureMeshGroup.visible = e.target.checked;
            });
            document.getElementById('chk-rhr').addEventListener('change', (e) => {
                rhrGroup.visible = e.target.checked;
                // 開掌定則需要電流指標輔助，連動顯示/隱藏
                if (e.target.checked) {
                    currentGroup.visible = true;
                    redWireCurrentGroup.visible = true;
                    blueWireCurrentGroup.visible = true;
                } else if (!document.getElementById('chk-current').checked) {
                    currentGroup.visible = false;
                    redWireCurrentGroup.visible = false;
                    blueWireCurrentGroup.visible = false;
                }
            });
            document.getElementById('chk-bfield-magnet').addEventListener('change', (e) => magnetBFieldGroup.visible = e.target.checked);
            document.getElementById('chk-bfield-coil-lines').addEventListener('change', (e) => {
                coilLinesGroup.visible = e.target.checked;
                coilBFieldGroup.visible = e.target.checked;
            });
            document.getElementById('chk-bfield-dynamic').addEventListener('change', (e) => dynamicCurvesGroup.visible = e.target.checked);
            document.getElementById('chk-run').addEventListener('change', (e) => isRunning = e.target.checked);

            const STEP_RAD = Math.PI / 12; // 15°
            document.getElementById('btn-step-back').addEventListener('click', () => {
                armatureAngle -= STEP_RAD;
                armatureGroup.rotation.z = armatureAngle;
            });
            document.getElementById('btn-step-fwd').addEventListener('click', () => {
                armatureAngle += STEP_RAD;
                armatureGroup.rotation.z = armatureAngle;
            });

            document.getElementById('info-toggle').addEventListener('click', () => {
                const content = document.getElementById('info-content');
                const icon = document.getElementById('info-icon');
                if (content.style.display === 'none') {
                    content.style.display = 'block';
                    icon.innerText = '▲';
                } else {
                    content.style.display = 'none';
                    icon.innerText = '▼';
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        // --- 核心物理運算：取得理想的分析磁場，用於受力 F 的精確計算 ---
        function getExternalB(pos, lPole, rPole) {
            if (lPole !== rPole) {
                // 異名極相吸：完美均勻的平行直線磁場
                return new THREE.Vector3(lPole * 1.5, 0, 0);
            } else {
                // 同名極相斥：兩N極各自往外推，B 方向以 x 為主軸
                // 左導線 (x<0) 靠近左N → B 朝 +x；右導線 (x>0) 靠近右N → B 朝 -x
                // 用點磁荷公式（與磁力線貝茲曲線的物理一致）
                const pL = new THREE.Vector3(-4.5, 0, -2.0);
                const pR = new THREE.Vector3( 4.5, 0, -2.0);
                const rL = new THREE.Vector3().subVectors(pos, pL);
                const rR = new THREE.Vector3().subVectors(pos, pR);
                let dL = Math.max(rL.length(), 0.5);
                let dR = Math.max(rR.length(), 0.5);
                const bL = rL.normalize().multiplyScalar(lPole * 2.0 / (dL * dL));
                const bR = rR.normalize().multiplyScalar(rPole * 2.0 / (dR * dR));
                return new THREE.Vector3().addVectors(bL, bR);
            }
        }

        // --- 建立場磁鐵專屬平行陣列磁場 (參數化完美貝茲曲線) ---
        function buildMagneticFields() {
            magnetBFieldGroup = new THREE.Group();
            scene.add(magnetBFieldGroup);
            
            const matMagnetStatic = new THREE.LineBasicMaterial({ color: 0x22bb22, linewidth: 2 });

            // 準備 18 條線 (排斥時左 9 條、右 9 條)
            for(let i=0; i<18; i++) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(STATIC_CURVE_POINTS * 3);
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.userData = { valid: false }; 
                const line = new THREE.Line(geometry, matMagnetStatic);
                magnetBFieldGroup.add(line);
                staticCurveGeometries.push(geometry);
            }

            // 動態箭頭
            const matArrow = new THREE.MeshBasicMaterial({ color: 0x22bb22 });
            const arrowGeo = new THREE.ConeGeometry(0.15, 0.4, 16);
            // 每條線分配 3 個均勻箭頭
            for(let i=0; i<18; i++) {
                for(let j=0; j<3; j++) { 
                    const arrow = new THREE.Mesh(arrowGeo, matArrow);
                    arrow.userData = { lineIndex: i, t: j / 3.0 };
                    magnetBParticles.push(arrow);
                    magnetBFieldGroup.add(arrow);
                }
            }

            // 電樞中心磁場與環繞磁力線
            coilBFieldGroup = new THREE.Group();
            coilBFieldGroup.position.set(0, 0, -2.0); 
            armatureGroup.add(coilBFieldGroup); 
            coilBFieldGroup.visible = false; 

            const coilBColor = 0x9932cc; 
            const mat = new THREE.MeshLambertMaterial({ color: coilBColor });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.0, 16), mat);
            body.position.set(0, -1.0, 0); 
            const head = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.7, 16), mat);
            head.position.set(0, -2.35, 0); 
            head.rotation.x = Math.PI; 
            coilBFieldGroup.add(body);
            coilBFieldGroup.add(head);

            coilLinesGroup = new THREE.Group();
            coilBFieldGroup.add(coilLinesGroup); 
            coilLinesGroup.visible = false;

            const lineMat = new THREE.MeshLambertMaterial({ color: 0x8a2be2 });
            function createCoilLoop(centerX, centerZ, rotY, clockwise) {
                const r = 1.8;
                const torus = new THREE.Mesh(new THREE.TorusGeometry(r, 0.04, 8, 32), lineMat);
                torus.position.set(centerX, 0, centerZ);
                torus.rotation.y = rotY;
                const arrow1 = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 8), lineMat);
                arrow1.position.set(r, 0, 0); 
                arrow1.rotation.z = clockwise ? 0 : Math.PI; 
                const arrow2 = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 8), lineMat);
                arrow2.position.set(0, r, 0); 
                arrow2.rotation.z = clockwise ? -Math.PI/2 : Math.PI/2; 
                torus.add(arrow1);
                torus.add(arrow2);
                return torus;
            }
            coilLinesGroup.add(createCoilLoop(-1.8, 0, 0, false)); 
            coilLinesGroup.add(createCoilLoop(1.8, 0, 0, true));   
            coilLinesGroup.add(createCoilLoop(0, 1.8, Math.PI/2, true));  
            coilLinesGroup.add(createCoilLoop(0, -1.8, Math.PI/2, false)); 
        }

        // --- 建立右手開掌定則輔助向量 ---
        function buildRHR() {
            rhrGroup = new THREE.Group();
            scene.add(rhrGroup);

            function createPhysicsVector(colorHex, text, textColor) {
                const group = new THREE.Group();
                // 半透明材質，讓電樞線圈透出來
                const mat = new THREE.MeshLambertMaterial({ color: colorHex, transparent: true, opacity: 0.55 });
                
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.0, 16), mat);
                body.position.y = 0.5; 
                const head = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 16), mat);
                head.position.y = 1.0 + 0.25;
                
                group.add(body);
                group.add(head);

                const sprite = createTextSprite(text, textColor, 80);
                sprite.position.y = 1.8; 
                group.add(sprite);

                group.setLength = function(len) {
                    if (len < 0.05) {
                        group.visible = false;
                        return;
                    }
                    group.visible = true;
                    body.scale.y = len;
                    body.position.y = len / 2;
                    head.position.y = len + 0.25;
                    sprite.position.y = len + 0.8;
                };
                return group;
            }

            leftF = createPhysicsVector(0xff0000, 'F', '#ff4444');
            leftB = createPhysicsVector(0x00cc00, 'B', '#22bb22');
            rightF = createPhysicsVector(0xff0000, 'F', '#ff4444');
            rightB = createPhysicsVector(0x00cc00, 'B', '#22bb22');

            rhrGroup.add(leftF);
            rhrGroup.add(leftB);
            rhrGroup.add(rightF);
            rhrGroup.add(rightB);
        }

        // --- 建立兩側可獨立翻轉的平面磁鐵 ---
        function buildMagnets() {
            magnetGroup = new THREE.Group();
            scene.add(magnetGroup);

            const depth = 6.0;     
            const height = 4.0;    
            const width = 2.5;     
            const zCenter = -2.0;  
            const gapOffset = 4.5; 
            const magCenterOffset = gapOffset + width; 

            const matBlue = new THREE.MeshLambertMaterial({ color: 0x0000ff }); 
            const matRed = new THREE.MeshLambertMaterial({ color: 0xff0000 });  
            const boxGeo = new THREE.BoxGeometry(width, height, depth);

            leftMagnet = new THREE.Group();
            leftMagnet.position.set(-magCenterOffset, 0, zCenter);
            magnetGroup.add(leftMagnet);

            const leftRed = new THREE.Mesh(boxGeo, matRed);
            leftRed.position.set(width/2, 0, 0); 
            leftMagnet.add(leftRed);
            const leftBlue = new THREE.Mesh(boxGeo, matBlue);
            leftBlue.position.set(-width/2, 0, 0); 
            leftMagnet.add(leftBlue);

            const textN_L = createTextSprite('N', '#ffffff', 80);
            textN_L.position.set(width/2, 0, depth/2 + 0.1);
            leftMagnet.add(textN_L);
            const textS_L = createTextSprite('S', '#ffffff', 80);
            textS_L.position.set(-width/2, 0, depth/2 + 0.1);
            leftMagnet.add(textS_L);

            rightMagnet = new THREE.Group();
            rightMagnet.position.set(magCenterOffset, 0, zCenter);
            magnetGroup.add(rightMagnet);

            const rightBlue = new THREE.Mesh(boxGeo, matBlue);
            rightBlue.position.set(-width/2, 0, 0); 
            rightMagnet.add(rightBlue);
            const rightRed = new THREE.Mesh(boxGeo, matRed);
            rightRed.position.set(width/2, 0, 0); 
            rightMagnet.add(rightRed);

            const textS_R = createTextSprite('S', '#ffffff', 80);
            textS_R.position.set(-width/2, 0, depth/2 + 0.1);
            rightMagnet.add(textS_R);
            const textN_R = createTextSprite('N', '#ffffff', 80);
            textN_R.position.set(width/2, 0, depth/2 + 0.1);
            rightMagnet.add(textN_R);
        }

        // --- 建立電樞與換向器 ---
        function buildArmature() {
            armatureGroup = new THREE.Group();
            scene.add(armatureGroup);

            armatureMeshGroup = new THREE.Group();
            armatureGroup.add(armatureMeshGroup);

            const wireMat = new THREE.MeshLambertMaterial({ color: 0x4a2e15, transparent: true, opacity: 0.6 }); 
            const wireR = 0.08; 
            const w = 3.6; 
            const l = 6.0; 
            const zOffset = -2; 

            const backWire = new THREE.Mesh(new THREE.CylinderGeometry(wireR, wireR, w, 16), wireMat);
            backWire.rotation.z = Math.PI / 2;
            backWire.position.set(0, 0, zOffset - l/2);
            armatureMeshGroup.add(backWire);

            const leftWire = new THREE.Mesh(new THREE.CylinderGeometry(wireR, wireR, l, 16), wireMat);
            leftWire.rotation.x = Math.PI / 2;
            leftWire.position.set(-w/2, 0, zOffset);
            armatureMeshGroup.add(leftWire);

            const rightWire = new THREE.Mesh(new THREE.CylinderGeometry(wireR, wireR, l, 16), wireMat);
            rightWire.rotation.x = Math.PI / 2;
            rightWire.position.set(w/2, 0, zOffset);
            armatureMeshGroup.add(rightWire);

            const leadX = 0.7; 
            const frontWidth = w/2 - leadX;
            const frontWireL = new THREE.Mesh(new THREE.CylinderGeometry(wireR, wireR, frontWidth, 16), wireMat);
            frontWireL.rotation.z = Math.PI / 2;
            frontWireL.position.set(-w/2 + frontWidth/2, 0, zOffset + l/2);
            armatureMeshGroup.add(frontWireL);

            const frontWireR = new THREE.Mesh(new THREE.CylinderGeometry(wireR, wireR, frontWidth, 16), wireMat);
            frontWireR.rotation.z = Math.PI / 2;
            frontWireR.position.set(w/2 - frontWidth/2, 0, zOffset + l/2);
            armatureMeshGroup.add(frontWireR);

            const leadLength = 3.5;
            const leadL = new THREE.Mesh(new THREE.CylinderGeometry(wireR, wireR, leadLength, 16), wireMat);

        // --- 輔助函數 ---
        function createCylinderLine(x1, y1, z1, x2, y2, z2, material) {
            const start = new THREE.Vector3(x1, y1, z1);
            const end = new THREE.Vector3(x2, y2, z2);
            const distance = start.distanceTo(end);
            const position = end.clone().add(start).divideScalar(2);
            const geo = new THREE.CylinderGeometry(0.12, 0.12, distance, 8);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.copy(position);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.clone().sub(start).normalize());
            scene.add(mesh);
        }

        function createTextSprite(text, color, size) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const context = canvas.getContext('2d');
            context.font = `bold ${size}px Arial`;
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, 128, 128);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(3, 3, 1); 
            return sprite;
        }

        function createPathData(points) {
            let totalLength = 0;
            let lengths = [];
            for (let i = 0; i < points.length - 1; i++) {
                let len = points[i].distanceTo(points[i + 1]);
                lengths.push(len);
                totalLength += len;
            }
            return { points, lengths, totalLength };
        }

        function getPointAndTangentOnPath(t, pathData) {
            t = t % 1.0;
            if (t < 0) t += 1.0;
            let targetD = t * pathData.totalLength;
            let currentD = 0;
            for (let i = 0; i < pathData.lengths.length; i++) {
                if (currentD + pathData.lengths[i] >= targetD || i === pathData.lengths.length - 1) {
                    let segmentT = (targetD - currentD) / pathData.lengths[i];
                    let p1 = pathData.points[i];
                    let p2 = pathData.points[i+1];
                    let point = new THREE.Vector3().lerpVectors(p1, p2, segmentT);
                    let tangent = new THREE.Vector3().subVectors(p2, p1).normalize();
                    return { point, tangent };
                }
                currentD += pathData.lengths[i];
            }
            return { point: pathData.points[0], tangent: new THREE.Vector3(1, 0, 0) };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 教科書等級參數化磁場曲線更新邏輯 (去除所有重疊，保證絕對不相交) ---
        function updateMagnetFieldCurves(leftPole, rightPole) {
            // 3x3 網格發射點
            const yVals = [-1.2, 0, 1.2];
            const zVals = [-3.2, -2.0, -0.8];
            let lineIdx = 0;

            if (leftPole !== rightPole) {
                // 【異名極相吸 (N-S 或 S-N)】: 產生 9 條完全不重疊的純淨曲線，跨越電樞
                let startX = leftPole === 1 ? -4.5 : 4.5;
                let endX = leftPole === 1 ? 4.5 : -4.5;

                for (let y of yVals) {
                    for (let z of zVals) {
                        const positions = staticCurveGeometries[lineIdx].attributes.position.array;
                        
                        let p0 = new THREE.Vector3(startX, y, z);
                        let p2 = new THREE.Vector3(endX, y, z);
                        let p1;
                        
                        let radY = y; 
                        let radZ = z - (-2.0);
                        
                        // 中間留完美的平行直線，最外圈畫出去產生立體微彎 (Fringing)
                        if (Math.abs(radY) < 0.1 && Math.abs(radZ) < 0.1) {
                            p1 = new THREE.Vector3(0, y, z); // 直線
                        } else {
                            let bulge = 1.2; // 外圈膨脹幅度
                            p1 = new THREE.Vector3(0, y + radY * bulge, z + radZ * bulge);
                        }

                        for (let step = 0; step < STATIC_CURVE_POINTS; step++) {
                            let t = step / (STATIC_CURVE_POINTS - 1);
                            let mt = 1 - t;
                            positions[step * 3] = mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x;
                            positions[step * 3 + 1] = mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y;
                            positions[step * 3 + 2] = mt*mt*p0.z + 2*mt*t*p1.z + t*t*p2.z;
                        }
                        staticCurveGeometries[lineIdx].userData.valid = true;
                        staticCurveGeometries[lineIdx].attributes.position.needsUpdate = true;
                        magnetBFieldGroup.children[lineIdx].visible = true;
                        lineIdx++;
                    }
                }
                
                // 相吸時，不需要另外 9 條線，直接隱藏
                for (; lineIdx < 18; lineIdx++) {
                    staticCurveGeometries[lineIdx].userData.valid = false;
                    magnetBFieldGroup.children[lineIdx].visible = false;
                }
            } else {
                // 【同名極相斥 (N-N 或 S-S)】: 產生 18 條完美向外彎曲的平滑排斥線，絕不接觸！
                
                // 左側 9 條 (絕不超過 x = -0.5)
                for (let y of yVals) {
                    for (let z of zVals) {
                        const positions = staticCurveGeometries[lineIdx].attributes.position.array;
                        let p0, p1, p2;
                        
                        let radY = y; 
                        let radZ = z - (-2.0);
                        let bendY, bendZ;
                        
                        // 中間那條強迫向上排開
                        if (Math.abs(radY) < 0.1 && Math.abs(radZ) < 0.1) {
                            bendY = 4.0;
                            bendZ = -2.0;
                        } else {
                            bendY = y + radY * 3.0;
                            bendZ = z + radZ * 3.0;
                        }

                        if (leftPole === 1) { // N-N: 從面(-4.5)出發彎向外部(-0.5)
                            p0 = new THREE.Vector3(-4.5, y, z);
                            p1 = new THREE.Vector3(-1.0, y, z);
                            p2 = new THREE.Vector3(-0.5, bendY, bendZ);
                        } else {              // S-S: 從外部(-0.5)彎向面(-4.5)
                            p0 = new THREE.Vector3(-0.5, bendY, bendZ);
                            p1 = new THREE.Vector3(-1.0, y, z);
                            p2 = new THREE.Vector3(-4.5, y, z);
                        }

                        for (let step = 0; step < STATIC_CURVE_POINTS; step++) {
                            let t = step / (STATIC_CURVE_POINTS - 1);
                            let mt = 1 - t;
                            positions[step * 3] = mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x;
                            positions[step * 3 + 1] = mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y;
                            positions[step * 3 + 2] = mt*mt*p0.z + 2*mt*t*p1.z + t*t*p2.z;
                        }
                        staticCurveGeometries[lineIdx].userData.valid = true;
                        staticCurveGeometries[lineIdx].attributes.position.needsUpdate = true;
                        magnetBFieldGroup.children[lineIdx].visible = true;
                        lineIdx++;
                    }
                }
                
                // 右側 9 條 (絕不超過 x = 0.5)
                for (let y of yVals) {
                    for (let z of zVals) {
                        const positions = staticCurveGeometries[lineIdx].attributes.position.array;
                        let p0, p1, p2;
                        
                        let radY = y; 
                        let radZ = z - (-2.0);
                        let bendY, bendZ;
                        
                        // 中間那條強迫向上排開 (與左側對稱)
                        if (Math.abs(radY) < 0.1 && Math.abs(radZ) < 0.1) {
                            bendY = 4.0;
                            bendZ = -2.0;
                        } else {
                            bendY = y + radY * 3.0;
                            bendZ = z + radZ * 3.0;
                        }

                        if (rightPole === 1) { // N-N: 從面(4.5)出發彎向外部(0.5)
                            p0 = new THREE.Vector3(4.5, y, z);
                            p1 = new THREE.Vector3(1.0, y, z);
                            p2 = new THREE.Vector3(0.5, bendY, bendZ);
                        } else {               // S-S: 從外部(0.5)彎向面(4.5)
                            p0 = new THREE.Vector3(0.5, bendY, bendZ);
                            p1 = new THREE.Vector3(1.0, y, z);
                            p2 = new THREE.Vector3(4.5, y, z);
                        }

                        for (let step = 0; step < STATIC_CURVE_POINTS; step++) {
                            let t = step / (STATIC_CURVE_POINTS - 1);
                            let mt = 1 - t;
                            positions[step * 3] = mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x;
                            positions[step * 3 + 1] = mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y;
                            positions[step * 3 + 2] = mt*mt*p0.z + 2*mt*t*p1.z + t*t*p2.z;
                        }
                        staticCurveGeometries[lineIdx].userData.valid = true;
                        staticCurveGeometries[lineIdx].attributes.position.needsUpdate = true;
                        magnetBFieldGroup.children[lineIdx].visible = true;
                        lineIdx++;
                    }
                }
            }
        }

        // --- 建立磁場互動立體曲線 (磁鐵場 + 線圈偶極場疊加) ---
        function buildDynamicCurves() {
            dynamicCurvesGroup = new THREE.Group();
            scene.add(dynamicCurvesGroup);
            dynamicCurvesGroup.visible = false; // 預設關閉

            const matMagnetDriven = new THREE.LineBasicMaterial({ color: 0x00aaff, linewidth: 2 });
            const matCoilDriven   = new THREE.LineBasicMaterial({ color: 0xff00ff, linewidth: 2 });

            function addCurveBuffer(material) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(CURVE_POINTS * 3);
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const line = new THREE.Line(geometry, material);
                dynamicCurvesGroup.add(line);
                curveGeometries.push(geometry);
            }

            for(let i = 0; i < 18; i++) addCurveBuffer(matMagnetDriven); // 磁鐵驅動 18 條（藍）
            for(let i = 0; i < 10; i++) addCurveBuffer(matCoilDriven);   // 線圈驅動 10 條（洋紅）
        }

        // --- 動畫核心迴圈 ---
        function animate() {
            requestAnimationFrame(animate);

            let leftPole = leftMagRev ? -1 : 1;   
            let rightPole = rightMagRev ? 1 : -1; 
            
            let polarDir = batteryReversed ? -1 : 1;
            let hasVoltage = voltageMultiplier > 0;

            // 判斷是否為抵消狀態 (N-N或S-S)
            let bFieldMultiplier = (leftPole !== rightPole) ? leftPole : 0; 

            if (isRunning) {
                armatureAngle += motorSpeed * voltageMultiplier * polarDir * bFieldMultiplier;
                armatureGroup.rotation.z = armatureAngle;
            }

            let normalizedAngle = armatureAngle % (Math.PI * 2);
            if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

            let commutatorDir = 1;
            if (normalizedAngle > Math.PI / 2 && normalizedAngle < 3 * Math.PI / 2) {
                commutatorDir = -1; 
            }
            let actualCoilDir = commutatorDir * polarDir;

            // 2. 更新教科書級平滑磁場網格與動態箭頭
            if (magnetBFieldGroup && magnetBFieldGroup.visible) {
                // 即時更新 3D 曲線形狀
                updateMagnetFieldCurves(leftPole, rightPole);

                const bFlowSpeed = currentSpeed * 1.5;
                magnetBParticles.forEach(p => {
                    const lIdx = p.userData.lineIndex;
                    const geo = staticCurveGeometries[lIdx];
                    
                    if (!geo.userData.valid) {
                        p.visible = false;
                        return;
                    }
                    p.visible = true;

                    // 箭頭永遠順著我們建構的曲線從 t=0 均勻流向 t=1
                    // 因為我們已經將 S-S 相斥線改為「從外向內」繪製，N-N 及 N-S 為「從內向外」繪製，完全符合真實磁場物理方向！
                    p.userData.t += bFlowSpeed;
                    if (p.userData.t > 1) p.userData.t -= 1;

                    const positions = geo.attributes.position.array;
                    const floatIdx = p.userData.t * (STATIC_CURVE_POINTS - 1);
                    const idx = Math.floor(floatIdx);
                    const frac = floatIdx - idx;

                    let p1 = new THREE.Vector3();
                    let p2 = new THREE.Vector3();

                    if (idx >= STATIC_CURVE_POINTS - 1) {
                        p1.set(positions[(STATIC_CURVE_POINTS-2)*3], positions[(STATIC_CURVE_POINTS-2)*3+1], positions[(STATIC_CURVE_POINTS-2)*3+2]);
                        p2.set(positions[(STATIC_CURVE_POINTS-1)*3], positions[(STATIC_CURVE_POINTS-1)*3+1], positions[(STATIC_CURVE_POINTS-1)*3+2]);
                        p.position.copy(p2);
                    } else {
                        p1.set(positions[idx*3], positions[idx*3+1], positions[idx*3+2]);
                        p2.set(positions[(idx+1)*3], positions[(idx+1)*3+1], positions[(idx+1)*3+2]);
                        p.position.lerpVectors(p1, p2, frac);
                    }

                    const tangent = new THREE.Vector3().subVectors(p2, p1).normalize();
                    if (tangent.lengthSq() > 0.001) {
                        p.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
                    }
                });
            }

            // 3. 更新動態電流流動與位置
            if (currentGroup && currentGroup.visible && hasVoltage && isRunning) {
                let extFlowSpeed = currentSpeed * 1.5 * voltageMultiplier * polarDir;
                redParticles.forEach(p => {
                    p.userData.t += extFlowSpeed; 
                    let { point, tangent } = getPointAndTangentOnPath(p.userData.t, redWirePathData);
                    if (polarDir < 0) tangent.negate(); 
                    p.position.copy(point);
                    p.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
                });
                blueParticles.forEach(p => {
                    p.userData.t += extFlowSpeed;
                    let { point, tangent } = getPointAndTangentOnPath(p.userData.t, blueWirePathData);
                    if (polarDir < 0) tangent.negate();
                    p.position.copy(point);
                    p.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
                });

                let armFlowSpeed = currentSpeed * voltageMultiplier * actualCoilDir;
                if(bFieldMultiplier === 0) armFlowSpeed = currentSpeed * voltageMultiplier * actualCoilDir; // 抵消時線圈仍有電流

                armatureParticles.forEach(p => {
                    p.userData.t += armFlowSpeed;
                    let { point, tangent } = getPointAndTangentOnPath(p.userData.t, armaturePathData);
                    if (actualCoilDir < 0) tangent.negate();
                    p.position.copy(point);
                    p.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
                });
            }

            if (currentGroup && currentGroup.visible) {
                if (actualCoilDir === 1) {
                    floatingArrowLeft.rotation.x = -Math.PI / 2;  
                    floatingArrowRight.rotation.x = Math.PI / 2;   
                } else {
                    floatingArrowLeft.rotation.x = Math.PI / 2;   
                    floatingArrowRight.rotation.x = -Math.PI / 2; 
                }
            }

            // 4. 更新右手開掌定則向量 (F, B)
            if (rhrGroup && rhrGroup.visible) {
                // 與 I 箭頭完全同一局部座標轉世界座標，確保起點一致
                const leftWorldPos  = new THREE.Vector3(-2.6, 0, -2.0).applyMatrix4(armatureGroup.matrixWorld);
                const rightWorldPos = new THREE.Vector3( 2.6, 0, -2.0).applyMatrix4(armatureGroup.matrixWorld);

                leftB.position.copy(leftWorldPos);
                leftF.position.copy(leftWorldPos);
                rightB.position.copy(rightWorldPos);
                rightF.position.copy(rightWorldPos);

                if (!hasVoltage) {
                    leftB.setLength(0); rightB.setLength(0);
                    leftF.setLength(0); rightF.setLength(0);
                } else {
                    let bLeftVec = getExternalB(leftWorldPos, leftPole, rightPole);
                    let bRightVec = getExternalB(rightWorldPos, leftPole, rightPole);

                    // 根據導線的 x 位置計算有效磁場強度：
                    // 導線在間隙中央 (x≈0) 時最強，靠近或超出磁鐵面 (|x|→4.5) 時衰減
                    // 完全轉到垂直 (|x|≈0 但 y 大) 時幾乎離開有效磁場區
                    function effectiveBScale(worldPos) {
                        // 用導線到間隙中心線的距離衰減
                        // x 方向：在 [-4.5, 4.5] 範圍內才有有效磁場
                        const xFrac = Math.max(0, 1.0 - Math.abs(worldPos.x) / 4.5);
                        // y 方向：導線越高（旋轉越多）磁場越弱（超出磁鐵高度範圍）
                        const yFrac = Math.max(0, 1.0 - Math.abs(worldPos.y) / 2.5);
                        return xFrac * yFrac;
                    }

                    const scaleL = effectiveBScale(leftWorldPos);
                    const scaleR = effectiveBScale(rightWorldPos);

                    const bDisplayBase = 3.0;  // 原 2.0 × 1.5

                    if (scaleL > 0.02) {
                        leftB.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), bLeftVec.clone().normalize());
                        leftB.setLength(bDisplayBase * scaleL);
                    } else leftB.setLength(0);

                    if (scaleR > 0.02) {
                        rightB.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), bRightVec.clone().normalize());
                        rightB.setLength(bDisplayBase * scaleR);
                    } else rightB.setLength(0);

                    let I_left_local = new THREE.Vector3(0, 0, -actualCoilDir);
                    let I_right_local = new THREE.Vector3(0, 0, actualCoilDir);
                    let I_left_world = I_left_local.transformDirection(armatureGroup.matrixWorld).normalize();
                    let I_right_world = I_right_local.transformDirection(armatureGroup.matrixWorld).normalize();

                    let F_left = new THREE.Vector3().crossVectors(I_left_world, bLeftVec);
                    let F_right = new THREE.Vector3().crossVectors(I_right_world, bRightVec);

                    let fLeftLen  = F_left.length()  * voltageMultiplier * scaleL * 2.4;
                    let fRightLen = F_right.length() * voltageMultiplier * scaleR * 2.4;

                    if (fLeftLen > 0.05) {
                        leftF.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), F_left.clone().normalize());
                        leftF.setLength(fLeftLen);
                    } else leftF.setLength(0);

                    if (fRightLen > 0.05) {
                        rightF.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), F_right.clone().normalize());
                        rightF.setLength(fRightLen);
                    } else rightF.setLength(0);
                }
            }

            // 5. 更新電樞專屬磁力線方向
            if (coilBFieldGroup) {
                if (actualCoilDir === 1) {
                    coilBFieldGroup.rotation.x = 0; 
                } else {
                    coilBFieldGroup.rotation.x = Math.PI; 
                }
            }

            // 6. 運算動態磁場互動立體曲線（磁鐵場 + 線圈偶極場疊加）
            if (dynamicCurvesGroup && dynamicCurvesGroup.visible) {
                const coilWorldPos = new THREE.Vector3(0, 0, -2.0).applyMatrix4(armatureGroup.matrixWorld);

                // 線圈磁偶極方向（隨電樞旋轉）
                let mLocal = actualCoilDir >= 0 ? new THREE.Vector3(0, -1, 0) : new THREE.Vector3(0, 1, 0);
                let mWorld = mLocal.transformDirection(armatureGroup.matrixWorld).normalize();
                const k_coil = 7.0 * voltageMultiplier;

                // 疊加場函數：磁鐵場 + 線圈偶極場
                function getCombinedB(pos) {
                    const B_mag = getExternalB(pos, leftPole, rightPole);
                    if (voltageMultiplier === 0) return B_mag;
                    const rVec = new THREE.Vector3().subVectors(pos, coilWorldPos);
                    let r = Math.max(rVec.length(), 0.6);
                    const rHat = rVec.clone().normalize();
                    const mDotR = mWorld.dot(rHat);
                    const B_coil = rHat.clone().multiplyScalar(3 * mDotR).sub(mWorld).multiplyScalar(k_coil / (r * r * r));
                    return new THREE.Vector3().addVectors(B_mag, B_coil);
                }

                const stepSize = 0.18;
                let lineIdx = 0;

                // 18 條：從左右磁鐵面各 9 個種子出發
                for(let side of [-1, 1]) {
                    for(let y of [-1.2, 0, 1.2]) {
                        for(let z of [-3.2, -2.0, -0.8]) {
                            if(lineIdx >= 18) break;
                            let startX = side < 0 ? -4.5 : 4.5;
                            let facePole = side < 0 ? leftPole : rightPole;
                            let dirMul = facePole === 1 ? 1 : -1;

                            let pos = new THREE.Vector3(startX, y, z);
                            const positions = curveGeometries[lineIdx].attributes.position.array;
                            let validPts = CURVE_POINTS;

                            for(let step = 0; step < CURVE_POINTS; step++) {
                                positions[step*3]   = pos.x;
                                positions[step*3+1] = pos.y;
                                positions[step*3+2] = pos.z;
                                const B = getCombinedB(pos);
                                if(B.lengthSq() < 0.001) { validPts = step + 1; break; }
                                pos.add(B.normalize().multiplyScalar(stepSize * dirMul));
                            }
                            // 剩餘點縮到最後有效點
                            for(let step = validPts; step < CURVE_POINTS; step++) {
                                positions[step*3]   = positions[(validPts-1)*3];
                                positions[step*3+1] = positions[(validPts-1)*3+1];
                                positions[step*3+2] = positions[(validPts-1)*3+2];
                            }
                            curveGeometries[lineIdx].attributes.position.needsUpdate = true;
                            lineIdx++;
                        }
                    }
                }

                // 10 條：從線圈周圍種子點雙向追蹤
                const coilSeeds = [
                    new THREE.Vector3(0,  1.2, -2.0), new THREE.Vector3(0, -1.2, -2.0),
                    new THREE.Vector3(0,  0,   -0.8), new THREE.Vector3(0,  0,   -3.2),
                    new THREE.Vector3(-1.0,  0.8, -2.0), new THREE.Vector3( 1.0, -0.8, -2.0),
                    new THREE.Vector3( 1.0,  0.8, -2.0), new THREE.Vector3(-1.0, -0.8, -2.0),
                    new THREE.Vector3(0,  0,   -2.0), new THREE.Vector3(0,  0,   -1.4),
                ];

                for(let i = 0; i < 10; i++) {
                    if(lineIdx >= 28) break;
                    const startPos = coilSeeds[i].clone().applyMatrix4(armatureGroup.matrixWorld);

                    // 往反方向積分
                    let posB = startPos.clone();
                    let backPts = [];
                    for(let step = 0; step < CURVE_POINTS / 2; step++) {
                        backPts.push(posB.clone());
                        const B = getCombinedB(posB);
                        if(B.lengthSq() < 0.001) break;
                        posB.sub(B.normalize().multiplyScalar(stepSize));
                    }
                    backPts.reverse();

                    // 往正方向積分
                    let posF = startPos.clone();
                    let fwdPts = [];
                    for(let step = 0; step < CURVE_POINTS / 2; step++) {
                        const B = getCombinedB(posF);
                        if(B.lengthSq() < 0.001) break;
                        posF.add(B.normalize().multiplyScalar(stepSize));
                        fwdPts.push(posF.clone());
                    }

                    let allPts = backPts.concat(fwdPts);
                    while(allPts.length < CURVE_POINTS) allPts.push(allPts[allPts.length - 1].clone());
                    if(allPts.length > CURVE_POINTS) allPts = allPts.slice(0, CURVE_POINTS);

                    const positions = curveGeometries[lineIdx].attributes.position.array;
                    for(let step = 0; step < CURVE_POINTS; step++) {
                        positions[step*3]   = allPts[step].x;
                        positions[step*3+1] = allPts[step].y;
                        positions[step*3+2] = allPts[step].z;
                    }
                    curveGeometries[lineIdx].attributes.position.needsUpdate = true;
                    lineIdx++;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
